<script id="data-q-RL16" type="application/json">{"body":"### 产品、训练方法和写作过程，属于三个层次\n\nR1 是具体模型与训练工作的名称；GRPO 是其中涉及的一类策略优化方法；推理链是模型生成的中间推理文本。\n\n这好比某位学生、某种教学法、学生写下的解题步骤，三者有关，但不能互相当作定义。\n\n**直答：** 把模型、优化方法和输出行为分开描述。某模型使用 GRPO，不代表任何 GRPO 训练都会获得相同推理能力。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** GRPO 是训练方法之一；R1 系列工作展示了通过 RL 等训练阶段改善推理的路线；可见推理链是输出行为，不是算法本身。\n\n**展开：** 区分 R1-Zero 与完整 R1 的冷启动、数据筛选和多阶段过程；“纯 RL”不能概括所有版本。推理链出现反思字样不证明该步骤真实贡献了正确率。\n\n**追问：模型一定学到了新推理能力吗？** 要定义能力边界并控制采样预算，比较大 k 覆盖率、任务迁移和去污染评测。后续研究有不同条件下的发现，详见 F05。\n\n**易错：** 不要把“我读过 R1”写成“我做过大规模 RL”。依据：S13。","html":"<h3>产品、训练方法和写作过程，属于三个层次<\/h3>\n<p>R1 是具体模型与训练工作的名称；GRPO 是其中涉及的一类策略优化方法；推理链是模型生成的中间推理文本。<\/p>\n<p>这好比某位学生、某种教学法、学生写下的解题步骤，三者有关，但不能互相当作定义。<\/p>\n<p><strong>直答：<\/strong> 把模型、优化方法和输出行为分开描述。某模型使用 GRPO，不代表任何 GRPO 训练都会获得相同推理能力。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> GRPO 是训练方法之一；R1 系列工作展示了通过 RL 等训练阶段改善推理的路线；可见推理链是输出行为，不是算法本身。<\/p>\n<p><strong>展开：<\/strong> 区分 R1-Zero 与完整 R1 的冷启动、数据筛选和多阶段过程；“纯 RL”不能概括所有版本。推理链出现反思字样不证明该步骤真实贡献了正确率。<\/p>\n<p><strong>追问：模型一定学到了新推理能力吗？<\/strong> 要定义能力边界并控制采样预算，比较大 k 覆盖率、任务迁移和去污染评测。后续研究有不同条件下的发现，详见 <a class=\"ref\" href=\"#q-F05\">F05<\/a>。<\/p>\n<p><strong>易错：<\/strong> 不要把“我读过 R1”写成“我做过大规模 RL”。依据：<a class=\"ref\" href=\"#source-S13\">S13<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-F01" type="application/json">{"body":"### 自己写步骤、大家投票、请老师挑一份\n\nCoT 是引导或训练模型写中间推理；Self-Consistency 是生成多次后，对最终答案做聚合；Best-of-N 是生成 N 份，由评分器挑一份。\n\n它们可以组合，但代价与失败方式不同：多数答案可能一起错，评分器也可能偏爱看起来漂亮的错答案。\n\n**直答：** 三者分别改变推理表达、多次答案聚合和候选选择方式；都需要把多生成与多评审的成本算进去。\n\n### 进一步：公式、边界与追问\n\n**本章进阶约定与范围：**\n\n本章不是排行榜。核查日 2026-09-15，精选能改变面试判断的研究；未逐一核实会议决定的工作按作者论文讨论，不声称正式接收。\n\n**技术表述：** CoT 引导或训练中间推理；Self-Consistency 对多次采样的最终答案做聚合；Best-of-N 用评分器从 N 个候选中选一个。\n\n**展开：** 三者可组合。答案投票要求可比较与规范化；Best-of-N 依赖评审器区分正确答案，不能使用部署时拿不到的标准答案。\n\n**追问：N 倍采样一定得到 N 倍收益？** 候选高度相关、验证器有偏或题目超出能力覆盖时，收益会很小甚至恶化。\n\n**易错：** 长 CoT 是计算行为，不是推理正确的证明。依据：S17、S62。","html":"<h3>自己写步骤、大家投票、请老师挑一份<\/h3>\n<p>CoT 是引导或训练模型写中间推理；Self-Consistency 是生成多次后，对最终答案做聚合；Best-of-N 是生成 N 份，由评分器挑一份。<\/p>\n<p>它们可以组合，但代价与失败方式不同：多数答案可能一起错，评分器也可能偏爱看起来漂亮的错答案。<\/p>\n<p><strong>直答：<\/strong> 三者分别改变推理表达、多次答案聚合和候选选择方式；都需要把多生成与多评审的成本算进去。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>本章进阶约定与范围：<\/strong><\/p>\n<p>本章不是排行榜。核查日 2026-09-15，精选能改变面试判断的研究；未逐一核实会议决定的工作按作者论文讨论，不声称正式接收。<\/p>\n<p><strong>技术表述：<\/strong> CoT 引导或训练中间推理；Self-Consistency 对多次采样的最终答案做聚合；Best-of-N 用评分器从 N 个候选中选一个。<\/p>\n<p><strong>展开：<\/strong> 三者可组合。答案投票要求可比较与规范化；Best-of-N 依赖评审器区分正确答案，不能使用部署时拿不到的标准答案。<\/p>\n<p><strong>追问：N 倍采样一定得到 N 倍收益？<\/strong> 候选高度相关、验证器有偏或题目超出能力覆盖时，收益会很小甚至恶化。<\/p>\n<p><strong>易错：<\/strong> 长 CoT 是计算行为，不是推理正确的证明。依据：<a class=\"ref\" href=\"#source-S17\">S17<\/a>、<a class=\"ref\" href=\"#source-S62\">S62<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-F02" type="application/json">{"body":"### 一分钟会做的题，不一定值得再想一小时\n\n简单题追加计算可能帮助不大；完全超出能力的题，反复尝试也未必有效；有机会解出但不稳定的题，额外尝试可能更有价值。\n\n部署时不能偷看标准答案来判断难度，只能利用分歧、验证结果或事先学到的难度线索。\n\n**直答：** 根据可观测的困难程度和追加计算收益分配预算，用正确率、耗时与成本一起评估，避免所有题都无限多想。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 简单题继续采样收益小，极难题可能怎么搜都找不到有效解；中等难度题往往更有利用额外计算的空间。\n\n**展开：** 可先低成本生成，用外部可验证信号或校准置信度决定追加采样、搜索或转人工。评价要用正确率—成本曲线，包含评审器成本和尾延迟。\n\n**追问：难度标签从哪来？** 不能在部署时偷看标准答案；可用独立开发数据训练路由器，或采用可观测的分歧、验证失败、历史任务属性。\n\n**易错：** “多想一会一定比换大模型划算”不是普遍结论。依据：S17。","html":"<h3>一分钟会做的题，不一定值得再想一小时<\/h3>\n<p>简单题追加计算可能帮助不大；完全超出能力的题，反复尝试也未必有效；有机会解出但不稳定的题，额外尝试可能更有价值。<\/p>\n<p>部署时不能偷看标准答案来判断难度，只能利用分歧、验证结果或事先学到的难度线索。<\/p>\n<p><strong>直答：<\/strong> 根据可观测的困难程度和追加计算收益分配预算，用正确率、耗时与成本一起评估，避免所有题都无限多想。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 简单题继续采样收益小，极难题可能怎么搜都找不到有效解；中等难度题往往更有利用额外计算的空间。<\/p>\n<p><strong>展开：<\/strong> 可先低成本生成，用外部可验证信号或校准置信度决定追加采样、搜索或转人工。评价要用正确率—成本曲线，包含评审器成本和尾延迟。<\/p>\n<p><strong>追问：难度标签从哪来？<\/strong> 不能在部署时偷看标准答案；可用独立开发数据训练路由器，或采用可观测的分歧、验证失败、历史任务属性。<\/p>\n<p><strong>易错：<\/strong> “多想一会一定比换大模型划算”不是普遍结论。依据：<a class=\"ref\" href=\"#source-S17\">S17<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-F03" type="application/json">{"body":"### 抄老师的范文，和让老师批改自己的草稿\n\n离线蒸馏可以用事先收集的教师答案教学生；on-policy 蒸馏则让学生先写，再由教师对学生实际走到的内容提供反馈。\n\n自蒸馏说的是教师与学生的关系：教师可能来自自己或相关版本，有时拥有额外上下文。它并不表示“没有额外信息也一定能无限变强”。\n\n**直答：** 区分反馈在什么轨迹上产生，以及教师来自哪里；蒸馏的价值要看教师信号是否可靠、是否针对学生真实短板。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 离线蒸馏使用固定教师数据；on-policy 蒸馏在学生自己生成的轨迹上获取教师反馈；自蒸馏指教师来自自身模型或相关版本，具体机制需说明。\n\n**展开：** token 分布蒸馏与只训练教师最终文本不同。前者需要概率信息与词表/对齐支持；后者常是序列级示范训练。on-policy 的价值是让教师处理学生实际会走到的状态。\n\n**追问：同一个模型怎么教自己？** 可以给教师额外已验证解题上下文，而学生只看问题；学习将额外信息带来的行为压缩进学生。教师反馈本身仍可能错误。\n\n**易错：** 学生不见特权信息，不代表教师生成数据可以包含测试答案。依据：S18。","html":"<h3>抄老师的范文，和让老师批改自己的草稿<\/h3>\n<p>离线蒸馏可以用事先收集的教师答案教学生；on-policy 蒸馏则让学生先写，再由教师对学生实际走到的内容提供反馈。<\/p>\n<p>自蒸馏说的是教师与学生的关系：教师可能来自自己或相关版本，有时拥有额外上下文。它并不表示“没有额外信息也一定能无限变强”。<\/p>\n<p><strong>直答：<\/strong> 区分反馈在什么轨迹上产生，以及教师来自哪里；蒸馏的价值要看教师信号是否可靠、是否针对学生真实短板。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 离线蒸馏使用固定教师数据；on-policy 蒸馏在学生自己生成的轨迹上获取教师反馈；自蒸馏指教师来自自身模型或相关版本，具体机制需说明。<\/p>\n<p><strong>展开：<\/strong> token 分布蒸馏与只训练教师最终文本不同。前者需要概率信息与词表/对齐支持；后者常是序列级示范训练。on-policy 的价值是让教师处理学生实际会走到的状态。<\/p>\n<p><strong>追问：同一个模型怎么教自己？<\/strong> 可以给教师额外已验证解题上下文，而学生只看问题；学习将额外信息带来的行为压缩进学生。教师反馈本身仍可能错误。<\/p>\n<p><strong>易错：<\/strong> 学生不见特权信息，不代表教师生成数据可以包含测试答案。依据：<a class=\"ref\" href=\"#source-S18\">S18<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-F04" type="application/json">{"body":"### 老师也拿不准时，别急着只学一种写法\n\n教师在某些 token 上给多种选择较高概率，说明它也保留了多种可能。相关研究尝试在这些高熵位置增加特定方向的 KL 约束，缓和学生过度集中于少数路径的倾向。\n\n这里先读 M03 的 KL 方向，再看论文的门控和损失细节。高熵只是选择位置的信号，不自动代表该位置更重要。\n\n**直答：** 这类方法尝试根据教师的不确定性选择蒸馏约束，研究多样性与质量的权衡；结论要保留模型和任务条件。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 在教师高不确定性的 token 上，额外引入前向 KL 约束，以缓和只用反向 KL 时过度集中于少数路径的倾向。\n\n**展开：** 先明确教师/学生分布方向，再看高熵门控与损失组合。论文在特定数学任务和模型规模上研究多样性与 Pass@8，不可直接推断所有聊天或安全任务都改善。\n\n**追问：可做什么消融？** 固定教师、学生、轨迹预算，比较反向 KL、全位置双 KL、高熵位置双 KL；同时看单次正确率、采样覆盖、熵与成本。\n\n**易错：** 高熵不天然等于关键推理点，方法收益需独立任务验证。依据：S19，作者版本 2026-06-12。","html":"<h3>老师也拿不准时，别急着只学一种写法<\/h3>\n<p>教师在某些 token 上给多种选择较高概率，说明它也保留了多种可能。相关研究尝试在这些高熵位置增加特定方向的 KL 约束，缓和学生过度集中于少数路径的倾向。<\/p>\n<p>这里先读 <a class=\"ref\" href=\"#q-M03\">M03<\/a> 的 KL 方向，再看论文的门控和损失细节。高熵只是选择位置的信号，不自动代表该位置更重要。<\/p>\n<p><strong>直答：<\/strong> 这类方法尝试根据教师的不确定性选择蒸馏约束，研究多样性与质量的权衡；结论要保留模型和任务条件。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 在教师高不确定性的 token 上，额外引入前向 KL 约束，以缓和只用反向 KL 时过度集中于少数路径的倾向。<\/p>\n<p><strong>展开：<\/strong> 先明确教师/学生分布方向，再看高熵门控与损失组合。论文在特定数学任务和模型规模上研究多样性与 Pass@8，不可直接推断所有聊天或安全任务都改善。<\/p>\n<p><strong>追问：可做什么消融？<\/strong> 固定教师、学生、轨迹预算，比较反向 KL、全位置双 KL、高熵位置双 KL；同时看单次正确率、采样覆盖、熵与成本。<\/p>\n<p><strong>易错：<\/strong> 高熵不天然等于关键推理点，方法收益需独立任务验证。依据：<a class=\"ref\" href=\"#source-S19\">S19<\/a>，作者版本 2026-06-12。<\/p><\/div><\/details>"}</script>
<script id="data-q-F05" type="application/json">{"body":"### 考试更稳定，是新会了，还是原来会的更容易发挥？\n\n如果模型偶尔本就能答对，训练后答对频率上升，可能主要是概率重新分配；要判断是否扩展了可解决题目的范围，就要看更广任务和更多次采样。\n\n有限次没答对不能证明概率严格为零。不同研究的基础模型、训练强度和测试预算也不同。\n\n**直答：** 先定义能力提升的含义，再区分单次成功率与可解题覆盖；不能只凭一个分数判断 RL 是否创造了新能力。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 不能一概而论。要先定义“能力”，再看基础模型、任务、采样覆盖和 RL 训练强度。\n\n**展开：** S64 研究发现某些设置中小 k 性能提升伴随大 k 覆盖受限；S63 的 ProRL 在更长训练和不同设计下报告更广覆盖。这是条件不同的实证结果，不是互相否定的数学定理。\n\n**追问：如何检验“基础模型不可能”？** 有限次未采到只支持“在该预算下未观察到”；无法证明其概率严格为零。应报告 k、温度、token 预算和任务划分。\n\n**易错：** 不能用 pass@1 上升直接证明新增知识，也不能用一个研究断言 RL 永不产生能力提升。依据：S63、S64。","html":"<h3>考试更稳定，是新会了，还是原来会的更容易发挥？<\/h3>\n<p>如果模型偶尔本就能答对，训练后答对频率上升，可能主要是概率重新分配；要判断是否扩展了可解决题目的范围，就要看更广任务和更多次采样。<\/p>\n<p>有限次没答对不能证明概率严格为零。不同研究的基础模型、训练强度和测试预算也不同。<\/p>\n<p><strong>直答：<\/strong> 先定义能力提升的含义，再区分单次成功率与可解题覆盖；不能只凭一个分数判断 RL 是否创造了新能力。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 不能一概而论。要先定义“能力”，再看基础模型、任务、采样覆盖和 RL 训练强度。<\/p>\n<p><strong>展开：<\/strong> <a class=\"ref\" href=\"#source-S64\">S64<\/a> 研究发现某些设置中小 k 性能提升伴随大 k 覆盖受限；<a class=\"ref\" href=\"#source-S63\">S63<\/a> 的 ProRL 在更长训练和不同设计下报告更广覆盖。这是条件不同的实证结果，不是互相否定的数学定理。<\/p>\n<p><strong>追问：如何检验“基础模型不可能”？<\/strong> 有限次未采到只支持“在该预算下未观察到”；无法证明其概率严格为零。应报告 k、温度、token 预算和任务划分。<\/p>\n<p><strong>易错：<\/strong> 不能用 pass@1 上升直接证明新增知识，也不能用一个研究断言 RL 永不产生能力提升。依据：<a class=\"ref\" href=\"#source-S63\">S63<\/a>、<a class=\"ref\" href=\"#source-S64\">S64<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-F06" type="application/json">{"body":"### 候选答案越多，越考验挑选答案的人\n\n生成 100 份答案，有一份正确当然有潜在价值，但只有选中它才能交付好结果。若评分器容易被漂亮措辞欺骗，候选越多，反而越可能找到“很会拿分”的错答案。\n\n因此增加计算时，也要测试评审是否能识别关键错误。\n\n**直答：** 多采样的收益受验证器限制；扩大候选数必须同时检查挑选能力和相关成本。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 更多候选只有在能可靠识别优劣时才有用；评分器的误报会被搜索放大。\n\n**展开：** 如果 N 增大，越容易找到能欺骗评审器的候选。可构造“表面合理但关键错误”负例，比较与人工或执行结果的一致性，按任务难度校准。\n\n**追问：多个 judge 投票能解决吗？** 若它们共享数据、偏好和失败模式，错误相关性仍很高；需要不同证据来源，不能只换提示词。\n\n**易错：** 自评置信度并不天然等于真实正确概率。","html":"<h3>候选答案越多，越考验挑选答案的人<\/h3>\n<p>生成 100 份答案，有一份正确当然有潜在价值，但只有选中它才能交付好结果。若评分器容易被漂亮措辞欺骗，候选越多，反而越可能找到“很会拿分”的错答案。<\/p>\n<p>因此增加计算时，也要测试评审是否能识别关键错误。<\/p>\n<p><strong>直答：<\/strong> 多采样的收益受验证器限制；扩大候选数必须同时检查挑选能力和相关成本。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 更多候选只有在能可靠识别优劣时才有用；评分器的误报会被搜索放大。<\/p>\n<p><strong>展开：<\/strong> 如果 N 增大，越容易找到能欺骗评审器的候选。可构造“表面合理但关键错误”负例，比较与人工或执行结果的一致性，按任务难度校准。<\/p>\n<p><strong>追问：多个 judge 投票能解决吗？<\/strong> 若它们共享数据、偏好和失败模式，错误相关性仍很高；需要不同证据来源，不能只换提示词。<\/p>\n<p><strong>易错：<\/strong> 自评置信度并不天然等于真实正确概率。<\/p><\/div><\/details>"}</script>
<script id="data-q-F07" type="application/json">{"body":"### 改笔记，和真正改大脑里的参数\n\n把几个例子放进输入，模型按例子回答，通常没改权重；Agent 保存一条外部记忆，也可能只改了数据库。另一些测试时学习方法会实际更新模型参数。\n\n因此看到“会学习”，要追问到底改的是提示、记忆还是权重，以及使用了什么反馈。\n\n**直答：** 上下文、外部记忆和参数更新是不同适应方式；讨论测试时学习时先明确可修改对象和评价方法。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 上下文学习通常不更新模型权重，通过输入示例改变行为；测试时学习是更宽泛术语，可能指上下文适应、记忆更新或真正参数更新。\n\n**展开：** 描述方法时交代可修改的是提示、记忆、检索索引还是权重，以及是否使用标签。线上适应可能遗忘旧规则，也可能引入污染。\n\n**追问：Agent 写入记忆算训练吗？** 不一定，它改变外部状态而非参数。应分别评估记忆写入正确、时效、冲突与删除。\n\n**易错：** 不要看到 test-time learning 就自动理解为反向传播。依据：S33。","html":"<h3>改笔记，和真正改大脑里的参数<\/h3>\n<p>把几个例子放进输入，模型按例子回答，通常没改权重；Agent 保存一条外部记忆，也可能只改了数据库。另一些测试时学习方法会实际更新模型参数。<\/p>\n<p>因此看到“会学习”，要追问到底改的是提示、记忆还是权重，以及使用了什么反馈。<\/p>\n<p><strong>直答：<\/strong> 上下文、外部记忆和参数更新是不同适应方式；讨论测试时学习时先明确可修改对象和评价方法。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 上下文学习通常不更新模型权重，通过输入示例改变行为；测试时学习是更宽泛术语，可能指上下文适应、记忆更新或真正参数更新。<\/p>\n<p><strong>展开：<\/strong> 描述方法时交代可修改的是提示、记忆、检索索引还是权重，以及是否使用标签。线上适应可能遗忘旧规则，也可能引入污染。<\/p>\n<p><strong>追问：Agent 写入记忆算训练吗？<\/strong> 不一定，它改变外部状态而非参数。应分别评估记忆写入正确、时效、冲突与删除。<\/p>\n<p><strong>易错：<\/strong> 不要看到 test-time learning 就自动理解为反向传播。依据：<a class=\"ref\" href=\"#source-S33\">S33<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-F08" type="application/json">{"body":"### 从左到右接写，还是多轮修复缺失部分？\n\n自回归模型通常写出一个 token，再继续写下一个；某些扩散语言模型从被遮住或加噪的文本状态开始，通过多轮预测恢复内容。\n\n第二种不代表一次就完成全文：可能要反复处理整段，训练目标和概率计算也不同。\n\n**直答：** 两类方法的生成顺序和训练过程不同；并行恢复部分内容有潜力，但速度、质量和后训练方法都要按具体模型比较。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 自回归按前缀逐 token 建模；一些扩散语言模型通过多轮恢复或去噪生成文本，可利用不同的生成顺序与局部补全方式。\n\n**展开：** 离散文本的噪声过程、训练目标和概率计算必须按具体模型定义；不能把图像扩散公式直接搬过来。减少串行 token 步数，也可能需要多轮全序列计算。\n\n**追问：适合直接照搬 DPO/GRPO 吗？** 需处理序列似然估计、生成路径和动作定义；不能假定现成自回归 logprob 接口可用。\n\n**易错：** “非自回归”不意味着一步出完整答案或一定更快。LLaDA 的掩码恢复建模见 S49；偏好优化研究入口见 S65。","html":"<h3>从左到右接写，还是多轮修复缺失部分？<\/h3>\n<p>自回归模型通常写出一个 token，再继续写下一个；某些扩散语言模型从被遮住或加噪的文本状态开始，通过多轮预测恢复内容。<\/p>\n<p>第二种不代表一次就完成全文：可能要反复处理整段，训练目标和概率计算也不同。<\/p>\n<p><strong>直答：<\/strong> 两类方法的生成顺序和训练过程不同；并行恢复部分内容有潜力，但速度、质量和后训练方法都要按具体模型比较。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 自回归按前缀逐 token 建模；一些扩散语言模型通过多轮恢复或去噪生成文本，可利用不同的生成顺序与局部补全方式。<\/p>\n<p><strong>展开：<\/strong> 离散文本的噪声过程、训练目标和概率计算必须按具体模型定义；不能把图像扩散公式直接搬过来。减少串行 token 步数，也可能需要多轮全序列计算。<\/p>\n<p><strong>追问：适合直接照搬 DPO/GRPO 吗？<\/strong> 需处理序列似然估计、生成路径和动作定义；不能假定现成自回归 logprob 接口可用。<\/p>\n<p><strong>易错：<\/strong> “非自回归”不意味着一步出完整答案或一定更快。LLaDA 的掩码恢复建模见 <a class=\"ref\" href=\"#source-S49\">S49<\/a>；偏好优化研究入口见 <a class=\"ref\" href=\"#source-S65\">S65<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-F09" type="application/json">{"body":"### 训练一个办事助手，先得记清它到底做过什么\n\nAgent 可能读网页、调用工具、遇到报错再重试。要用 RL 训练它，必须准确区分模型写出的 token、工具返回的数据、每一步的版本以及最终结果。\n\n否则一份看似完整的记录，也可能把外部返回文字误当成模型动作。\n\n**直答：** Agent RL 不只需要优化公式，还需要可靠的轨迹记录、环境执行和任务评分；工程接口本身就是学习能否成立的前提。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 除了优化器，长任务的轨迹重建、工具环境、异步采样与训练接口一致性直接决定能否有效学习。\n\n**展开：** Polar 等工作把已有 Agent 运行环境接到 RL，强调准确记录模型 token 交互与评测。岗位上应追问：工具输出算不算生成 token、失败轨迹如何截断、策略版本如何跟踪、终态怎么评分。\n\n**追问：换个 Agent 框架就提升，说明 RL 算法更好？** 未必，提示、工具接口和恢复逻辑都可能变化，要做同运行环境对照。\n\n**易错：** 不将单个软件任务集的收益外推为所有 Agent；该条按作者预印本观察。依据：S66，2026-05。","html":"<h3>训练一个办事助手，先得记清它到底做过什么<\/h3>\n<p>Agent 可能读网页、调用工具、遇到报错再重试。要用 RL 训练它，必须准确区分模型写出的 token、工具返回的数据、每一步的版本以及最终结果。<\/p>\n<p>否则一份看似完整的记录，也可能把外部返回文字误当成模型动作。<\/p>\n<p><strong>直答：<\/strong> Agent RL 不只需要优化公式，还需要可靠的轨迹记录、环境执行和任务评分；工程接口本身就是学习能否成立的前提。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 除了优化器，长任务的轨迹重建、工具环境、异步采样与训练接口一致性直接决定能否有效学习。<\/p>\n<p><strong>展开：<\/strong> Polar 等工作把已有 Agent 运行环境接到 RL，强调准确记录模型 token 交互与评测。岗位上应追问：工具输出算不算生成 token、失败轨迹如何截断、策略版本如何跟踪、终态怎么评分。<\/p>\n<p><strong>追问：换个 Agent 框架就提升，说明 RL 算法更好？<\/strong> 未必，提示、工具接口和恢复逻辑都可能变化，要做同运行环境对照。<\/p>\n<p><strong>易错：<\/strong> 不将单个软件任务集的收益外推为所有 Agent；该条按作者预印本观察。依据：<a class=\"ref\" href=\"#source-S66\">S66<\/a>，2026-05。<\/p><\/div><\/details>"}</script>
<script id="data-q-F10" type="application/json">{"body":"### 讲论文，先讲它修好了什么麻烦\n\n比如“旧方法在所有候选都错时没有学习信号”，比先报算法缩写更容易理解。接着讲作者增加了什么信息或步骤、是否公平对比、在哪些情况仍会失败。\n\n最后提出一个自己能完成的小验证，才能把阅读变成有判断力的理解。\n\n**直答：** 用“问题—反馈—改动—对照—边界—验证”讲论文，并把读懂、实现和复现结果如实区分。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 用“问题—训练信号—关键变化—对照—边界—复现”六步回答。\n\n**展开：** 先说原方法在哪种输入上失败；写出新增模块或目标；说明数据、采样与预算是否变化；报告主指标之外的退化；提出可以在现有资源上完成的最小验证。\n\n**追问：论文自称 SOTA，能直接写简历吗？** 阅读可以写研究理解；只有真实复现日志和对照才支撑“复现/实现”，有原创改进与证据才支撑“提出/优化”。\n\n**模板：** “该方法尝试解决___；我认为最关键的假设是___；若迁移到内容安全，我会先测___，失败标准是___。”","html":"<h3>讲论文，先讲它修好了什么麻烦<\/h3>\n<p>比如“旧方法在所有候选都错时没有学习信号”，比先报算法缩写更容易理解。接着讲作者增加了什么信息或步骤、是否公平对比、在哪些情况仍会失败。<\/p>\n<p>最后提出一个自己能完成的小验证，才能把阅读变成有判断力的理解。<\/p>\n<p><strong>直答：<\/strong> 用“问题—反馈—改动—对照—边界—验证”讲论文，并把读懂、实现和复现结果如实区分。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 用“问题—训练信号—关键变化—对照—边界—复现”六步回答。<\/p>\n<p><strong>展开：<\/strong> 先说原方法在哪种输入上失败；写出新增模块或目标；说明数据、采样与预算是否变化；报告主指标之外的退化；提出可以在现有资源上完成的最小验证。<\/p>\n<p><strong>追问：论文自称 SOTA，能直接写简历吗？<\/strong> 阅读可以写研究理解；只有真实复现日志和对照才支撑“复现/实现”，有原创改进与证据才支撑“提出/优化”。<\/p>\n<p><strong>模板：<\/strong> “该方法尝试解决<strong><em>；我认为最关键的假设是<\/em><\/strong>；若迁移到内容安全，我会先测<strong><em>，失败标准是<\/em><\/strong>。”<\/p><\/div><\/details>"}</script>
<script id="data-q-F11" type="application/json">{"body":"### 太难的题完全无从下手，可以先给一点已知正确的步骤\n\nIGPO 在特定扩散语言模型设置中利用部分正确推理片段帮助探索，让模型更容易进入有希望的生成区域。\n\n这相当于给了额外提示，因此对比时必须算入信息优势。训练时用提示，不代表测试时也能看答案。\n\n**直答：** 该思路用部分已知正确内容引导探索，缓解成功轨迹难找到的问题；评估时必须说明额外监督和测试条件。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 在扩散语言模型在线采样中放入部分已知正确推理片段，让模型更容易进入有希望的轨迹区域，减少全组失败。\n\n**展开：** 提示部分路径属于额外监督，比较时必须计入信息优势；不能把收益全归因于优化器。需要明确训练时插入比例、位置、如何评价以及测试时不提供答案。\n\n**追问：这和纯粹奖励探索有什么差别？** 它混合了已知解信息与自生成轨迹，帮助解决稀疏奖励下找不到成功路径的问题。\n\n**易错：** 不能用测试答案辅助生成再当作无辅助推理评测。依据：S65。","html":"<h3>太难的题完全无从下手，可以先给一点已知正确的步骤<\/h3>\n<p>IGPO 在特定扩散语言模型设置中利用部分正确推理片段帮助探索，让模型更容易进入有希望的生成区域。<\/p>\n<p>这相当于给了额外提示，因此对比时必须算入信息优势。训练时用提示，不代表测试时也能看答案。<\/p>\n<p><strong>直答：<\/strong> 该思路用部分已知正确内容引导探索，缓解成功轨迹难找到的问题；评估时必须说明额外监督和测试条件。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 在扩散语言模型在线采样中放入部分已知正确推理片段，让模型更容易进入有希望的轨迹区域，减少全组失败。<\/p>\n<p><strong>展开：<\/strong> 提示部分路径属于额外监督，比较时必须计入信息优势；不能把收益全归因于优化器。需要明确训练时插入比例、位置、如何评价以及测试时不提供答案。<\/p>\n<p><strong>追问：这和纯粹奖励探索有什么差别？<\/strong> 它混合了已知解信息与自生成轨迹，帮助解决稀疏奖励下找不到成功路径的问题。<\/p>\n<p><strong>易错：<\/strong> 不能用测试答案辅助生成再当作无辅助推理评测。依据：<a class=\"ref\" href=\"#source-S65\">S65<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-SA01" type="application/json">{"body":"### 看输入、管输出、看是否拒答\n\n内容分类判断这段材料属于什么类别；生成安全关注模型实际写了什么、会造成什么影响；拒答检测只判断模型是否拒绝了请求。\n\n“我不能帮你”可能是合适拒答，也可能误拒正常问题。只统计拒答多不多，无法评价完整安全能力。\n\n**直答：** 三者评价对象不同：内容是什么、生成是否合规、有没有拒答。拒答是行为之一，不等于安全本身。\n\n### 进一步：公式、边界与追问\n\n**本章进阶约定与范围：**\n\n定位：结合已有约 2 万样本、24 类能力、SFT+DPO 的背景组织。本文不把报告中的个人指标当作已独立核实结果。\n\n**技术表述：** 分类识别输入或内容风险；生成安全判断模型输出是否有害；拒答检测识别模型是否拒绝执行。三者标签不同。\n\n**展开：** 危险请求被恰当拒答，可同时有“输入高风险、输出安全、发生拒答”。正常请求被拒答则可能是误拒。WildGuard 的多任务设计体现了这些区分。\n\n**追问：审核模型能直接作为生成偏好标签吗？** 需要明确是回答风险、帮助性还是输入风险，最好拆成多维评价。\n\n**易错：** 不要把检测到危险词等同于回答有害。依据：S23。","html":"<h3>看输入、管输出、看是否拒答<\/h3>\n<p>内容分类判断这段材料属于什么类别；生成安全关注模型实际写了什么、会造成什么影响；拒答检测只判断模型是否拒绝了请求。<\/p>\n<p>“我不能帮你”可能是合适拒答，也可能误拒正常问题。只统计拒答多不多，无法评价完整安全能力。<\/p>\n<p><strong>直答：<\/strong> 三者评价对象不同：内容是什么、生成是否合规、有没有拒答。拒答是行为之一，不等于安全本身。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>本章进阶约定与范围：<\/strong><\/p>\n<p>定位：结合已有约 2 万样本、24 类能力、SFT+DPO 的背景组织。本文不把报告中的个人指标当作已独立核实结果。<\/p>\n<p><strong>技术表述：<\/strong> 分类识别输入或内容风险；生成安全判断模型输出是否有害；拒答检测识别模型是否拒绝执行。三者标签不同。<\/p>\n<p><strong>展开：<\/strong> 危险请求被恰当拒答，可同时有“输入高风险、输出安全、发生拒答”。正常请求被拒答则可能是误拒。WildGuard 的多任务设计体现了这些区分。<\/p>\n<p><strong>追问：审核模型能直接作为生成偏好标签吗？<\/strong> 需要明确是回答风险、帮助性还是输入风险，最好拆成多维评价。<\/p>\n<p><strong>易错：<\/strong> 不要把检测到危险词等同于回答有害。依据：<a class=\"ref\" href=\"#source-S23\">S23<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-SA02" type="application/json">{"body":"### 安检门既不能放过危险物，也不能把正常旅客全拦住\n\n**漏放**是该拦的没拦，**误拒**是正常请求被拒绝。如果把所有请求都拒绝，漏放可能减少，但系统也失去了帮助人的价值。\n\n所以调整阈值或训练模型时，要同时看两类错误，尤其检查容易混淆的正常近邻。\n\n**直答：** 安全系统要同时控制漏放和误拒，在真实业务代价下选择平衡；单看某一侧可以被极端策略“做漂亮”。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 全部拒绝可以减少部分风险，却失去使用价值；全部回答也可能放过有害请求。目标是明确业务代价下的折中。\n\n**展开：** 需要有害请求集与正常请求集，尤其是措辞敏感但意图正常的安全邻域。记录有害输出率、正常响应率与帮助性，而非一个总 accuracy。\n\n**追问：双侧指标怎么选阈值？** 在验证集上固定召回或风险约束后选择阈值，测试集只做一次评价，并报告人工复核比例。\n\n**易错：** 正常响应不等于回答质量合格；空洞回答也可能“没有拒答”。依据：S22。","html":"<h3>安检门既不能放过危险物，也不能把正常旅客全拦住<\/h3>\n<p><strong>漏放<\/strong>是该拦的没拦，<strong>误拒<\/strong>是正常请求被拒绝。如果把所有请求都拒绝，漏放可能减少，但系统也失去了帮助人的价值。<\/p>\n<p>所以调整阈值或训练模型时，要同时看两类错误，尤其检查容易混淆的正常近邻。<\/p>\n<p><strong>直答：<\/strong> 安全系统要同时控制漏放和误拒，在真实业务代价下选择平衡；单看某一侧可以被极端策略“做漂亮”。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 全部拒绝可以减少部分风险，却失去使用价值；全部回答也可能放过有害请求。目标是明确业务代价下的折中。<\/p>\n<p><strong>展开：<\/strong> 需要有害请求集与正常请求集，尤其是措辞敏感但意图正常的安全邻域。记录有害输出率、正常响应率与帮助性，而非一个总 accuracy。<\/p>\n<p><strong>追问：双侧指标怎么选阈值？<\/strong> 在验证集上固定召回或风险约束后选择阈值，测试集只做一次评价，并报告人工复核比例。<\/p>\n<p><strong>易错：<\/strong> 正常响应不等于回答质量合格；空洞回答也可能“没有拒答”。依据：<a class=\"ref\" href=\"#source-S22\">S22<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-SA03" type="application/json">{"body":"### 一个问题可能同时贴多个标签\n\n一条内容可能同时涉及多个风险，强制只能选一类会丢失信息。多标签体系允许同时勾选多个类别。\n\n不过类别之间要有清楚边界和例子，否则标注员各自理解，模型学到的规则也会混乱。\n\n**直答：** 先定义每类的含义、共存关系和边界例，再设计多标签标注与评测，不能只增加类别数量。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 先定义标签含义、层级、可共现关系和边界，再做示例、反例、冲突处理与版本管理。\n\n**展开：** “辱骂”“威胁”“隐私”等风险可能共现；多分类强制单标签可能丢失信息。标注指南要区分引用、批评、教育讨论、真实攻击意图和上下文转义。\n\n**追问：24 类如何报告效果？** 每类样本数、precision/recall/F1 与支持量，宏平均及重要类约束；不能用总体均值掩盖少数高风险类别。\n\n**易错：** 标签体系变了后，直接与旧版本指标比较可能没有意义。","html":"<h3>一个问题可能同时贴多个标签<\/h3>\n<p>一条内容可能同时涉及多个风险，强制只能选一类会丢失信息。多标签体系允许同时勾选多个类别。<\/p>\n<p>不过类别之间要有清楚边界和例子，否则标注员各自理解，模型学到的规则也会混乱。<\/p>\n<p><strong>直答：<\/strong> 先定义每类的含义、共存关系和边界例，再设计多标签标注与评测，不能只增加类别数量。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 先定义标签含义、层级、可共现关系和边界，再做示例、反例、冲突处理与版本管理。<\/p>\n<p><strong>展开：<\/strong> “辱骂”“威胁”“隐私”等风险可能共现；多分类强制单标签可能丢失信息。标注指南要区分引用、批评、教育讨论、真实攻击意图和上下文转义。<\/p>\n<p><strong>追问：24 类如何报告效果？<\/strong> 每类样本数、precision/recall/F1 与支持量，宏平均及重要类约束；不能用总体均值掩盖少数高风险类别。<\/p>\n<p><strong>易错：<\/strong> 标签体系变了后，直接与旧版本指标比较可能没有意义。<\/p><\/div><\/details>"}</script>
<script id="data-q-SA04" type="application/json">{"body":"### 换个字形，不一定换了意思\n\n同音字、拼音或夹杂符号可能让简单关键词匹配失效。处理时可以规范化文本、保留原文，并让模型结合上下文理解。\n\n但过度替换也会误伤正常词句。每种变体都应配真实风险例和正常例，检查收益与误伤。\n\n**直答：** 结合规范化、变体数据和上下文判断提高鲁棒性，并保留正常对照，避免把所有相似字形都当成风险。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 多视角规范化、字符特征和上下文模型结合，评测未见变体与正常近邻。\n\n**展开：** 保留原文，并生成可追溯规范化视图，如 Unicode 规范化、全半角、部分字符间隔处理；不要不可逆地把所有词强行替换成风险词。字符 n-gram 可作高效基线，语义模型处理语境。\n\n**追问：训练见过变体，测试同一模板换个字算泛化吗？** 很弱。应按变体规则、模板或攻击家族隔离。\n\n**易错：** 激进归一化可能误伤人名、外语、缩写与专业术语。","html":"<h3>换个字形，不一定换了意思<\/h3>\n<p>同音字、拼音或夹杂符号可能让简单关键词匹配失效。处理时可以规范化文本、保留原文，并让模型结合上下文理解。<\/p>\n<p>但过度替换也会误伤正常词句。每种变体都应配真实风险例和正常例，检查收益与误伤。<\/p>\n<p><strong>直答：<\/strong> 结合规范化、变体数据和上下文判断提高鲁棒性，并保留正常对照，避免把所有相似字形都当成风险。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 多视角规范化、字符特征和上下文模型结合，评测未见变体与正常近邻。<\/p>\n<p><strong>展开：<\/strong> 保留原文，并生成可追溯规范化视图，如 Unicode 规范化、全半角、部分字符间隔处理；不要不可逆地把所有词强行替换成风险词。字符 n-gram 可作高效基线，语义模型处理语境。<\/p>\n<p><strong>追问：训练见过变体，测试同一模板换个字算泛化吗？<\/strong> 很弱。应按变体规则、模板或攻击家族隔离。<\/p>\n<p><strong>易错：<\/strong> 激进归一化可能误伤人名、外语、缩写与专业术语。<\/p><\/div><\/details>"}</script>
<script id="data-q-SA05" type="application/json">{"body":"### 一句话没问题，连起来才看出意图\n\n某人分几轮提供信息，最后一句可能只是“继续”。如果模型只看这一句，就不知道正在继续什么；如果上下文被截断，也会漏掉关键线索。\n\n多轮安全因此要检查信息怎样累积、角色怎样变化、拒绝之后是否会被后续话术带偏。\n\n**直答：** 多轮安全依赖整个对话中的意图和信息联系；评测要覆盖跨轮累积、上下文截断和多次尝试。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 风险可能分散在多轮，前文建立的意图会改变当前句子的含义，还可能累积诱导模型越界。\n\n**展开：** 每轮独立分类可能漏掉跨轮拼接；把全部历史塞入也可能因截断丢失关键证据。需要会话级标签、风险出现轮次和上下文消融。\n\n**追问：怎么切分数据？** 以会话及生成/攻击模板为单位隔离，不能把相邻轮次随机分到训练与测试。\n\n**易错：** 只报每轮平均会稀释一次严重会话失败；还要报会话内任一风险事件率。依据：S24。","html":"<h3>一句话没问题，连起来才看出意图<\/h3>\n<p>某人分几轮提供信息，最后一句可能只是“继续”。如果模型只看这一句，就不知道正在继续什么；如果上下文被截断，也会漏掉关键线索。<\/p>\n<p>多轮安全因此要检查信息怎样累积、角色怎样变化、拒绝之后是否会被后续话术带偏。<\/p>\n<p><strong>直答：<\/strong> 多轮安全依赖整个对话中的意图和信息联系；评测要覆盖跨轮累积、上下文截断和多次尝试。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 风险可能分散在多轮，前文建立的意图会改变当前句子的含义，还可能累积诱导模型越界。<\/p>\n<p><strong>展开：<\/strong> 每轮独立分类可能漏掉跨轮拼接；把全部历史塞入也可能因截断丢失关键证据。需要会话级标签、风险出现轮次和上下文消融。<\/p>\n<p><strong>追问：怎么切分数据？<\/strong> 以会话及生成/攻击模板为单位隔离，不能把相邻轮次随机分到训练与测试。<\/p>\n<p><strong>易错：<\/strong> 只报每轮平均会稀释一次严重会话失败；还要报会话内任一风险事件率。依据：<a class=\"ref\" href=\"#source-S24\">S24<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-SA06" type="application/json">{"body":"### 先说清“一次攻击”怎么算\n\n100 个目标各尝试 10 次，可以统计每次尝试的成功比例，也可以统计有多少目标至少被成功一次。两者分母不同，数值不能直接比较。\n\n还要定义成功是模型说了某个词，还是确实产生了目标违规行为，并检查评审标准。\n\n**直答：** 攻击成功率必须说明目标、成功规则、尝试次数和分母；不同预算与统计单位下的数字不能混比。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 明确攻击集、预算、目标模型和判断规则，核查模型是否真正给出可用的有害内容。\n\n**展开：** 输出“当然可以”后接拒答，或生成乱码，不应仅因关键词被算成成功。StrongREJECT 关注评价是否高估了实际有害帮助；HarmBench 提供标准化比较框架。\n\n**追问：ASR 下降就安全了吗？** 只说明在该攻击集合与预算下更稳健，未知攻击、工具链和新语言仍需测试。\n\n**易错：** 不同攻击尝试次数、judge、拒答解析和基线模型的 ASR 不宜直接比较。依据：S20、S21。","html":"<h3>先说清“一次攻击”怎么算<\/h3>\n<p>100 个目标各尝试 10 次，可以统计每次尝试的成功比例，也可以统计有多少目标至少被成功一次。两者分母不同，数值不能直接比较。<\/p>\n<p>还要定义成功是模型说了某个词，还是确实产生了目标违规行为，并检查评审标准。<\/p>\n<p><strong>直答：<\/strong> 攻击成功率必须说明目标、成功规则、尝试次数和分母；不同预算与统计单位下的数字不能混比。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 明确攻击集、预算、目标模型和判断规则，核查模型是否真正给出可用的有害内容。<\/p>\n<p><strong>展开：<\/strong> 输出“当然可以”后接拒答，或生成乱码，不应仅因关键词被算成成功。StrongREJECT 关注评价是否高估了实际有害帮助；HarmBench 提供标准化比较框架。<\/p>\n<p><strong>追问：ASR 下降就安全了吗？<\/strong> 只说明在该攻击集合与预算下更稳健，未知攻击、工具链和新语言仍需测试。<\/p>\n<p><strong>易错：<\/strong> 不同攻击尝试次数、judge、拒答解析和基线模型的 ASR 不宜直接比较。依据：<a class=\"ref\" href=\"#source-S20\">S20<\/a>、<a class=\"ref\" href=\"#source-S21\">S21<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-SA07" type="application/json">{"body":"### 日常题、刁钻题、容易被误判的正常题\n\n只考常见风险，测不到对抗下的短板；只考攻击，又看不见误拒。还需要正常但看起来敏感的近邻问题。\n\n这三类一起看，才能判断模型是在理解规则，还是靠见到某些词就拒绝。\n\n**直答：** 安全评测同时覆盖常规风险、对抗变体和正常近邻，并按类别记录错误，而不是只有一个总分。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 固定黄金集测回归，滚动挑战集发现新失效，线上回流集观察真实分布。\n\n**展开：** 黄金集冻结并限制调参接触；挑战集可用于研发但记录版本；回流集需明确抽样率、延迟和人工标签质量。三者报告分开，不能拼成一个随时变化的分母。\n\n**追问：失败样本回训后怎么证明修复？** 除了原失败集，建立独立同机制变体和未见模板，再看正常邻域是否退化。\n\n**易错：** 只复测修过的样本容易把记忆化当鲁棒性。","html":"<h3>日常题、刁钻题、容易被误判的正常题<\/h3>\n<p>只考常见风险，测不到对抗下的短板；只考攻击，又看不见误拒。还需要正常但看起来敏感的近邻问题。<\/p>\n<p>这三类一起看，才能判断模型是在理解规则，还是靠见到某些词就拒绝。<\/p>\n<p><strong>直答：<\/strong> 安全评测同时覆盖常规风险、对抗变体和正常近邻，并按类别记录错误，而不是只有一个总分。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 固定黄金集测回归，滚动挑战集发现新失效，线上回流集观察真实分布。<\/p>\n<p><strong>展开：<\/strong> 黄金集冻结并限制调参接触；挑战集可用于研发但记录版本；回流集需明确抽样率、延迟和人工标签质量。三者报告分开，不能拼成一个随时变化的分母。<\/p>\n<p><strong>追问：失败样本回训后怎么证明修复？<\/strong> 除了原失败集，建立独立同机制变体和未见模板，再看正常邻域是否退化。<\/p>\n<p><strong>易错：<\/strong> 只复测修过的样本容易把记忆化当鲁棒性。<\/p><\/div><\/details>"}</script>
<script id="data-q-SA08" type="application/json">{"body":"### 好回答不总是“拒绝”\n\n对真正危险的请求，合适拒答可能更好；对科普、求助或正常讨论，给出有帮助的回答可能更好；条件不清时，澄清可能更好。\n\n如果 chosen 全是拒答模板，模型容易学成“拒绝越多越好”。\n\n**直答：** 安全偏好中的好回答应随意图和规则变化，覆盖恰当回答、澄清与拒绝，同时约束危险帮助和过度拒答。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** chosen 是在具体意图与政策下更恰当的回答，可是正常帮助、必要澄清、适度拒答或安全替代建议。\n\n**展开：** 配对拒答与不拒答前，先确认请求语境；避免 chosen 永远更长、更礼貌或固定模板，否则模型可能学表面特征。\n\n**追问：怎么构造防过拒数据？** 选择敏感词出现但意图正常的请求，比较有效帮助与无依据拒答；保持解释自然，不过度暴露内部规则。\n\n**易错：** 用生成模型自己打分后直接全量回训，可能放大自身政策偏差。","html":"<h3>好回答不总是“拒绝”<\/h3>\n<p>对真正危险的请求，合适拒答可能更好；对科普、求助或正常讨论，给出有帮助的回答可能更好；条件不清时，澄清可能更好。<\/p>\n<p>如果 chosen 全是拒答模板，模型容易学成“拒绝越多越好”。<\/p>\n<p><strong>直答：<\/strong> 安全偏好中的好回答应随意图和规则变化，覆盖恰当回答、澄清与拒绝，同时约束危险帮助和过度拒答。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> chosen 是在具体意图与政策下更恰当的回答，可是正常帮助、必要澄清、适度拒答或安全替代建议。<\/p>\n<p><strong>展开：<\/strong> 配对拒答与不拒答前，先确认请求语境；避免 chosen 永远更长、更礼貌或固定模板，否则模型可能学表面特征。<\/p>\n<p><strong>追问：怎么构造防过拒数据？<\/strong> 选择敏感词出现但意图正常的请求，比较有效帮助与无依据拒答；保持解释自然，不过度暴露内部规则。<\/p>\n<p><strong>易错：<\/strong> 用生成模型自己打分后直接全量回训，可能放大自身政策偏差。<\/p><\/div><\/details>"}</script>
<script id="data-q-SA09" type="application/json">{"body":"### 非黑即白之前，可以留一个复核区\n\n把风险分数低的正常放行，高的拦截，中间拿不准的交给进一步检查，就是三段决策。\n\n中间区域越宽，人工或二次模型负担越重；越窄，自动决策承担的错误也可能更多。阈值需根据资源和风险选择。\n\n**直答：** 用低风险放行、高风险拦截、中间复核的分层策略处理不确定性，并评估复核容量、延迟与最终错误。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 根据风险分数设置放行、人工复核、拦截区间，同时跟踪复核队列容量。\n\n**展开：** 阈值 t_low<t_high；低风险放行，中间复核，高风险拦截。分数需校准，重要类别可有不同约束。复核延迟和标注反馈也属于系统性能。\n\n**追问：人工复核越来越多，指标却更好说明什么？** 可能把难题转给人工，而非模型能力提升。应报自动化覆盖率、单位样本成本与端到端质量。\n\n**易错：** 不要把复核后指标当纯模型指标。","html":"<h3>非黑即白之前，可以留一个复核区<\/h3>\n<p>把风险分数低的正常放行，高的拦截，中间拿不准的交给进一步检查，就是三段决策。<\/p>\n<p>中间区域越宽，人工或二次模型负担越重；越窄，自动决策承担的错误也可能更多。阈值需根据资源和风险选择。<\/p>\n<p><strong>直答：<\/strong> 用低风险放行、高风险拦截、中间复核的分层策略处理不确定性，并评估复核容量、延迟与最终错误。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 根据风险分数设置放行、人工复核、拦截区间，同时跟踪复核队列容量。<\/p>\n<p><strong>展开：<\/strong> 阈值 t_low&lt;t_high；低风险放行，中间复核，高风险拦截。分数需校准，重要类别可有不同约束。复核延迟和标注反馈也属于系统性能。<\/p>\n<p><strong>追问：人工复核越来越多，指标却更好说明什么？<\/strong> 可能把难题转给人工，而非模型能力提升。应报自动化覆盖率、单位样本成本与端到端质量。<\/p>\n<p><strong>易错：<\/strong> 不要把复核后指标当纯模型指标。<\/p><\/div><\/details>"}</script>
<script id="data-q-SA10" type="application/json">{"body":"### 用户提要求，和资料偷偷指挥助手，是两回事\n\n普通有害请求来自用户任务本身；提示注入则可能藏在网页、文档或工具返回里，试图让助手把读到的文字当成新的指令。\n\n例如网页正文声称“忽略用户，执行另一件事”。问题不只在文字内容危险，还在低信任资料试图改变控制权。\n\n**直答：** 提示注入利用数据与指令边界混淆改变助手行为；要限制外部内容的权限，不能只靠检测敏感词。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 提示注入常把指令藏进低信任数据，如网页或工具返回，试图改变 Agent 的任务、权限或信息流。\n\n**展开：** 关键是信任边界：文档内容不因被检索到就有资格改系统政策。防御需要工具权限、数据隔离、输出校验与状态验证，单条“忽略注入”提示难以充分覆盖。\n\n**追问：为什么分类器通过但系统仍失败？** 可能后续工具把不可信文本解释成可执行操作，单模块检测没覆盖实际链路。\n\n**易错：** 只测最终回答，不测数据修改或外发状态，会漏掉真实失败。依据：S32。","html":"<h3>用户提要求，和资料偷偷指挥助手，是两回事<\/h3>\n<p>普通有害请求来自用户任务本身；提示注入则可能藏在网页、文档或工具返回里，试图让助手把读到的文字当成新的指令。<\/p>\n<p>例如网页正文声称“忽略用户，执行另一件事”。问题不只在文字内容危险，还在低信任资料试图改变控制权。<\/p>\n<p><strong>直答：<\/strong> 提示注入利用数据与指令边界混淆改变助手行为；要限制外部内容的权限，不能只靠检测敏感词。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 提示注入常把指令藏进低信任数据，如网页或工具返回，试图改变 Agent 的任务、权限或信息流。<\/p>\n<p><strong>展开：<\/strong> 关键是信任边界：文档内容不因被检索到就有资格改系统政策。防御需要工具权限、数据隔离、输出校验与状态验证，单条“忽略注入”提示难以充分覆盖。<\/p>\n<p><strong>追问：为什么分类器通过但系统仍失败？<\/strong> 可能后续工具把不可信文本解释成可执行操作，单模块检测没覆盖实际链路。<\/p>\n<p><strong>易错：<\/strong> 只测最终回答，不测数据修改或外发状态，会漏掉真实失败。依据：<a class=\"ref\" href=\"#source-S32\">S32<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-SA11" type="application/json">{"body":"### 去年的试卷，未必代表今年的用法\n\n用户群、热点话题、语言变体或业务规则变化后，旧测试分数可能还很高，线上却出现新错误。这叫分布漂移。\n\n应看新近样本、不同来源和时间切片，并区分是输入变了，还是标注规则本身变了。\n\n**直答：** 用随时间和人群分层的评测监测新场景变化；总体成绩不变时，也可能有某一类风险正在恶化。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 分开观察输入分布、标签标准与模型行为变化，配合定期人工抽样。\n\n**展开：** 新梗、新语种、热点事件和政策调整都可能改变难度。监控类别占比、分数分布、拒答比例、复核率与延迟；统计变化触发检查，不自动当作性能下降证据。\n\n**追问：线上没有即时真标签怎么办？** 用延迟审计、抽样复核和固定哨兵集补足；代理指标只能提供预警。\n\n**易错：** 单看风险词命中数不能判断真实风险上升。","html":"<h3>去年的试卷，未必代表今年的用法<\/h3>\n<p>用户群、热点话题、语言变体或业务规则变化后，旧测试分数可能还很高，线上却出现新错误。这叫分布漂移。<\/p>\n<p>应看新近样本、不同来源和时间切片，并区分是输入变了，还是标注规则本身变了。<\/p>\n<p><strong>直答：<\/strong> 用随时间和人群分层的评测监测新场景变化；总体成绩不变时，也可能有某一类风险正在恶化。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 分开观察输入分布、标签标准与模型行为变化，配合定期人工抽样。<\/p>\n<p><strong>展开：<\/strong> 新梗、新语种、热点事件和政策调整都可能改变难度。监控类别占比、分数分布、拒答比例、复核率与延迟；统计变化触发检查，不自动当作性能下降证据。<\/p>\n<p><strong>追问：线上没有即时真标签怎么办？<\/strong> 用延迟审计、抽样复核和固定哨兵集补足；代理指标只能提供预警。<\/p>\n<p><strong>易错：<\/strong> 单看风险词命中数不能判断真实风险上升。<\/p><\/div><\/details>"}</script>
<script id="data-q-SA12" type="application/json">{"body":"### “抓得更准”不等于“抓得更全”\n\n若系统这次只拦了少量最明显的风险，拦下来的大多确实有问题，precision 会很高，但也可能放过大量其他风险。\n\n因此讲 79%→96% 时，要先确认拦截对象、样本和阈值是否一致，再补召回和误拒，才能说明改进是什么。个人数字只能用真实记录支持。\n\n**直答：** 先解释 precision 的分母和比较条件，再用召回、误拒及对照说明收益；79% 到 96% 是增加 17 个百分点。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 先确认这里确为 precision，再解释测试集、正类、阈值、召回、数据隔离和人工复核口径。\n\n**展开：** 应提供同一冻结集上的混淆矩阵、分类型召回、PR 曲线或固定召回比较。区分数据清洗、SFT、DPO、阈值与规则变更分别贡献多少。\n\n**追问：没有完整历史对照怎么办？** 如实说现有证据可证明什么、尚不能归因什么，再提出补实验，不能编造 seed、样本数或消融。\n\n**易错：** precision 提升不等于 accuracy 提升，也不保证漏放降低。个人数字仅来自背景报告。","html":"<h3>“抓得更准”不等于“抓得更全”<\/h3>\n<p>若系统这次只拦了少量最明显的风险，拦下来的大多确实有问题，precision 会很高，但也可能放过大量其他风险。<\/p>\n<p>因此讲 79%→96% 时，要先确认拦截对象、样本和阈值是否一致，再补召回和误拒，才能说明改进是什么。个人数字只能用真实记录支持。<\/p>\n<p><strong>直答：<\/strong> 先解释 precision 的分母和比较条件，再用召回、误拒及对照说明收益；79% 到 96% 是增加 17 个百分点。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 先确认这里确为 precision，再解释测试集、正类、阈值、召回、数据隔离和人工复核口径。<\/p>\n<p><strong>展开：<\/strong> 应提供同一冻结集上的混淆矩阵、分类型召回、PR 曲线或固定召回比较。区分数据清洗、SFT、DPO、阈值与规则变更分别贡献多少。<\/p>\n<p><strong>追问：没有完整历史对照怎么办？<\/strong> 如实说现有证据可证明什么、尚不能归因什么，再提出补实验，不能编造 seed、样本数或消融。<\/p>\n<p><strong>易错：<\/strong> precision 提升不等于 accuracy 提升，也不保证漏放降低。个人数字仅来自背景报告。<\/p><\/div><\/details>"}</script>
<script id="data-q-E01" type="application/json">{"body":"### 用捞坏苹果记住两个分母\n\n篮里实际有 20 个坏苹果。系统挑出了 15 个，其中 12 个真坏、3 个是好苹果。Precision 问“挑出来的准不准”：12/15=80%；Recall 问“坏的找全没”：12/20=60%。\n\nF1 用调和平均综合两者，本例约 68.6%。它能提醒你别只顾一边，但没有包含所有业务代价。\n\n**直答：** 精确率以判为正的结果为分母，召回率以真正的正例为分母；F1 综合两者，实际使用还要说明什么算正类。\n\n### 进一步：公式、边界与追问\n\n**本章进阶约定与范围：**\n\n定位：把“分数涨了”变成可信结论。以下公式适用于已明确的统计单位；多标签、会话与多次采样需先定义分母。\n\n标准分类与概率指标的实现定义可对照 S72；统计抽样、系统归因和业务约束部分按本资料给出的假设使用。\n\n$$P=\\frac{TP}{TP+FP},\\quad R=\\frac{TP}{TP+FN},\\quad F1=\\frac{2PR}{P+R}.$$\n\n**技术表述：** 精确率问“判正的有多少真为正”；召回问“真正的正例找回多少”；F1 综合两者。\n\n**算例：** TP=80、FP=20、FN=40，则 P=0.8、R≈0.667、F1≈0.727。零分母时需约定返回值，并报告该类支持数。\n\n**追问：F1 为什么不是平均数？** 调和平均更受较低项影响，但没有表达所有业务误差代价。\n\n**易错：** 正类如果改成“安全”而不是“有害”，TP/FP 语义会完全改变。","html":"<h3>用捞坏苹果记住两个分母<\/h3>\n<p>篮里实际有 20 个坏苹果。系统挑出了 15 个，其中 12 个真坏、3 个是好苹果。Precision 问“挑出来的准不准”：12/15=80%；Recall 问“坏的找全没”：12/20=60%。<\/p>\n<p>F1 用调和平均综合两者，本例约 68.6%。它能提醒你别只顾一边，但没有包含所有业务代价。<\/p>\n<p><strong>直答：<\/strong> 精确率以判为正的结果为分母，召回率以真正的正例为分母；F1 综合两者，实际使用还要说明什么算正类。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>本章进阶约定与范围：<\/strong><\/p>\n<p>定位：把“分数涨了”变成可信结论。以下公式适用于已明确的统计单位；多标签、会话与多次采样需先定义分母。<\/p>\n<p>标准分类与概率指标的实现定义可对照 <a class=\"ref\" href=\"#source-S72\">S72<\/a>；统计抽样、系统归因和业务约束部分按本资料给出的假设使用。<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>P<\/mi><mo>=<\/mo><mfrac><mrow><mi>T<\/mi><mi>P<\/mi><\/mrow><mrow><mi>T<\/mi><mi>P<\/mi><mo>+<\/mo><mi>F<\/mi><mi>P<\/mi><\/mrow><\/mfrac><mo>,<\/mo><mspace width=\"1em\" /><mi>R<\/mi><mo>=<\/mo><mfrac><mrow><mi>T<\/mi><mi>P<\/mi><\/mrow><mrow><mi>T<\/mi><mi>P<\/mi><mo>+<\/mo><mi>F<\/mi><mi>N<\/mi><\/mrow><\/mfrac><mo>,<\/mo><mspace width=\"1em\" /><mi>F<\/mi><mn>1<\/mn><mo>=<\/mo><mfrac><mrow><mn>2<\/mn><mi>P<\/mi><mi>R<\/mi><\/mrow><mrow><mi>P<\/mi><mo>+<\/mo><mi>R<\/mi><\/mrow><\/mfrac><mo>.<\/mo><\/mrow><\/math><\/div>\n<p><strong>技术表述：<\/strong> 精确率问“判正的有多少真为正”；召回问“真正的正例找回多少”；F1 综合两者。<\/p>\n<p><strong>算例：<\/strong> TP=80、FP=20、FN=40，则 P=0.8、R≈0.667、F1≈0.727。零分母时需约定返回值，并报告该类支持数。<\/p>\n<p><strong>追问：F1 为什么不是平均数？<\/strong> 调和平均更受较低项影响，但没有表达所有业务误差代价。<\/p>\n<p><strong>易错：<\/strong> 正类如果改成“安全”而不是“有害”，TP/FP 语义会完全改变。<\/p><\/div><\/details>"}</script>
<script id="data-q-E02" type="application/json">{"body":"### 先给每科算成绩，还是把所有题混在一起算？\n\n常见类别有 1000 条，稀有类别只有 10 条。Micro 先汇总整体计数，容易由大类主导；Macro 先分别算每类指标再平均，让小类也占一票。\n\nWeighted 则按类别样本量给各类指标加权。哪个更合适，取决于你是否特别重视稀有类。\n\n**直答：** 三者是在选择怎样汇总类别表现；除了汇总指标，还应查看每类样本量和错误，避免平均数掩盖问题。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** Macro 让各类同等权重，Micro 先汇总计数，Weighted 按类别样本量加权。\n\n**展开：** 长尾安全类别少但重要，Micro 可能被常见类主导；Macro 也会被极少样本类的高方差影响。应联合 per-class 支持量与置信区间。\n\n**追问：Macro-F1 等于用 Macro-P、Macro-R 计算的 F1 吗？** 通常不等；先逐类算 F1 再平均。\n\n**易错：** 多标签场景的 Micro 指标不等同于整条样本所有标签都正确的 exact match。","html":"<h3>先给每科算成绩，还是把所有题混在一起算？<\/h3>\n<p>常见类别有 1000 条，稀有类别只有 10 条。Micro 先汇总整体计数，容易由大类主导；Macro 先分别算每类指标再平均，让小类也占一票。<\/p>\n<p>Weighted 则按类别样本量给各类指标加权。哪个更合适，取决于你是否特别重视稀有类。<\/p>\n<p><strong>直答：<\/strong> 三者是在选择怎样汇总类别表现；除了汇总指标，还应查看每类样本量和错误，避免平均数掩盖问题。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> Macro 让各类同等权重，Micro 先汇总计数，Weighted 按类别样本量加权。<\/p>\n<p><strong>展开：<\/strong> 长尾安全类别少但重要，Micro 可能被常见类主导；Macro 也会被极少样本类的高方差影响。应联合 per-class 支持量与置信区间。<\/p>\n<p><strong>追问：Macro-F1 等于用 Macro-P、Macro-R 计算的 F1 吗？<\/strong> 通常不等；先逐类算 F1 再平均。<\/p>\n<p><strong>易错：<\/strong> 多标签场景的 Micro 指标不等同于整条样本所有标签都正确的 exact match。<\/p><\/div><\/details>"}</script>
<script id="data-q-E03" type="application/json">{"body":"### 排名能力好，实际画一条录取线后也要检查\n\n模型会给样本打分，阈值决定分数多高才判为正。改变阈值，就得到不同的精确率、召回率等表现，连起来形成曲线。\n\nAUC 概括曲线相关的整体排序表现；部署最终仍要选阈值。曲线面积更好，不保证在你的关键阈值处也更好。\n\n**直答：** AUC 用来概括跨阈值表现，业务决策看具体阈值下的错误和成本；两种视角要一起使用。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** AUC 评价跨阈值的排序表现；部署需要某个阈值或策略区间下的实际 precision、recall 与成本。\n\n**展开：** 正例稀少时 PR 曲线更直接反映判正结果的可靠性，但其基线受正例率影响；ROC-AUC 也有价值，不能说在不均衡时一定无用。\n\n**追问：AUC 提升但线上误报变多？** 可能当前阈值未校准，或特定低 FPR 区域没改善。比较业务关注区域与真实基率。\n\n**易错：** average precision 与梯形积分 PR-AUC 是不同定义，要记录实现。","html":"<h3>排名能力好，实际画一条录取线后也要检查<\/h3>\n<p>模型会给样本打分，阈值决定分数多高才判为正。改变阈值，就得到不同的精确率、召回率等表现，连起来形成曲线。<\/p>\n<p>AUC 概括曲线相关的整体排序表现；部署最终仍要选阈值。曲线面积更好，不保证在你的关键阈值处也更好。<\/p>\n<p><strong>直答：<\/strong> AUC 用来概括跨阈值表现，业务决策看具体阈值下的错误和成本；两种视角要一起使用。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> AUC 评价跨阈值的排序表现；部署需要某个阈值或策略区间下的实际 precision、recall 与成本。<\/p>\n<p><strong>展开：<\/strong> 正例稀少时 PR 曲线更直接反映判正结果的可靠性，但其基线受正例率影响；ROC-AUC 也有价值，不能说在不均衡时一定无用。<\/p>\n<p><strong>追问：AUC 提升但线上误报变多？<\/strong> 可能当前阈值未校准，或特定低 FPR 区域没改善。比较业务关注区域与真实基率。<\/p>\n<p><strong>易错：<\/strong> average precision 与梯形积分 PR-AUC 是不同定义，要记录实现。<\/p><\/div><\/details>"}</script>
<script id="data-q-E04" type="application/json">{"body":"### 说“八成把握”的题，真的大约八成答对吗？\n\n把模型声称约 80% 置信度的预测放在一起，若实际上只有 50% 正确，它就是过度自信。校准要让预测概率与实际频率更相符。\n\n校准不是直接让模型学会新知识；一个准确率一般的模型，也可能诚实表达不确定性。\n\n**直答：** 校准检查“报出的概率是否可信”，与“选出的类别是否正确”不同；需要在独立数据上评估概率和实际频率的对应。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 让预测为 80% 的一组样本确实约 80% 正确。可使用可靠性图、Brier score 和 ECE 等指标。\n\n**展开：** 校准与排序能力不同。温度缩放在验证集拟合一个温度，常不改变 argmax，但能改变概率；分布漂移后需重评。ECE 依赖分箱，不能独自作为最终判断。\n\n**追问：LLM 说“我有 90% 把握”可信吗？** 只有经过具体任务的校准评测才可解释为概率。\n\n**易错：** 不能在测试集上拟合温度再报告同一测试集校准效果。依据：S54。","html":"<h3>说“八成把握”的题，真的大约八成答对吗？<\/h3>\n<p>把模型声称约 80% 置信度的预测放在一起，若实际上只有 50% 正确，它就是过度自信。校准要让预测概率与实际频率更相符。<\/p>\n<p>校准不是直接让模型学会新知识；一个准确率一般的模型，也可能诚实表达不确定性。<\/p>\n<p><strong>直答：<\/strong> 校准检查“报出的概率是否可信”，与“选出的类别是否正确”不同；需要在独立数据上评估概率和实际频率的对应。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 让预测为 80% 的一组样本确实约 80% 正确。可使用可靠性图、Brier score 和 ECE 等指标。<\/p>\n<p><strong>展开：<\/strong> 校准与排序能力不同。温度缩放在验证集拟合一个温度，常不改变 argmax，但能改变概率；分布漂移后需重评。ECE 依赖分箱，不能独自作为最终判断。<\/p>\n<p><strong>追问：LLM 说“我有 90% 把握”可信吗？<\/strong> 只有经过具体任务的校准评测才可解释为概率。<\/p>\n<p><strong>易错：<\/strong> 不能在测试集上拟合温度再报告同一测试集校准效果。依据：<a class=\"ref\" href=\"#source-S54\">S54<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-E05" type="application/json">{"body":"### 多答对一道题，可能只是这张卷子碰巧\n\n100 道题上，新模型多对 1 道；换另一批题，优势可能反过来。判断差异不能只看两个百分数，还要看样本量、哪些题变化、波动有多大。\n\n同一批题比较时，应保留每题的新旧结果，再估计差值的不确定性。统计上能区分，也不一定代表业务收益值得成本。\n\n**直答：** 分数差要结合成对样本、抽样不确定性和实际价值判断；“高了 1 个百分点”本身不够说明提升可靠。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 需要样本量、同题配对结果、相关性和选择过程，单个差值无法回答。\n\n**展开：** 对同一测试集可对每个独立单位的 A/B 得分差做 paired bootstrap；每次抽同一索引给两模型，得到差值分布。会话相关数据应整组抽样。\n\n**追问：区间不含零就够吗？** 仍要看实际收益、风险类别退化、多次比较与测试集偏差；统计显著不等于业务重要。\n\n**易错：** 两模型分别 bootstrap 后只看各自区间是否重叠，不是最直接的配对差异检验。","html":"<h3>多答对一道题，可能只是这张卷子碰巧<\/h3>\n<p>100 道题上，新模型多对 1 道；换另一批题，优势可能反过来。判断差异不能只看两个百分数，还要看样本量、哪些题变化、波动有多大。<\/p>\n<p>同一批题比较时，应保留每题的新旧结果，再估计差值的不确定性。统计上能区分，也不一定代表业务收益值得成本。<\/p>\n<p><strong>直答：<\/strong> 分数差要结合成对样本、抽样不确定性和实际价值判断；“高了 1 个百分点”本身不够说明提升可靠。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 需要样本量、同题配对结果、相关性和选择过程，单个差值无法回答。<\/p>\n<p><strong>展开：<\/strong> 对同一测试集可对每个独立单位的 A/B 得分差做 paired bootstrap；每次抽同一索引给两模型，得到差值分布。会话相关数据应整组抽样。<\/p>\n<p><strong>追问：区间不含零就够吗？<\/strong> 仍要看实际收益、风险类别退化、多次比较与测试集偏差；统计显著不等于业务重要。<\/p>\n<p><strong>易错：<\/strong> 两模型分别 bootstrap 后只看各自区间是否重叠，不是最直接的配对差异检验。<\/p><\/div><\/details>"}</script>
<script id="data-q-E06" type="application/json">{"body":"### 是重新训练、换一张试卷，还是同题再答一次？\n\n不同随机种子重新训练，观察训练过程的波动；bootstrap 从已有测试样本重抽，观察抽样估计的波动；同题重复生成，观察回答行为的随机性。\n\n三者改变的环节不同，做十次生成不能代替十次独立训练。\n\n**直答：** 先明确随机性来自训练、测试抽样还是生成，再选择重复实验方式和统计方法。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 多训练 seed 测训练随机性；bootstrap 测测试样本抽样不确定性；重复生成测解码或环境随机性。\n\n**展开：** 它们不能相互替代。昂贵训练只有一个 seed 时，可诚实报告测试抽样区间和多次生成，但不把它称为“训练稳定性已验证”。\n\n**追问：至少 3 seeds 是铁律吗？** 不是。次数取决于方差、预算与论断强度；关键是准确报告做了什么。\n\n**易错：** 重复评测同一确定性输出不是新的独立训练实验。","html":"<h3>是重新训练、换一张试卷，还是同题再答一次？<\/h3>\n<p>不同随机种子重新训练，观察训练过程的波动；bootstrap 从已有测试样本重抽，观察抽样估计的波动；同题重复生成，观察回答行为的随机性。<\/p>\n<p>三者改变的环节不同，做十次生成不能代替十次独立训练。<\/p>\n<p><strong>直答：<\/strong> 先明确随机性来自训练、测试抽样还是生成，再选择重复实验方式和统计方法。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 多训练 seed 测训练随机性；bootstrap 测测试样本抽样不确定性；重复生成测解码或环境随机性。<\/p>\n<p><strong>展开：<\/strong> 它们不能相互替代。昂贵训练只有一个 seed 时，可诚实报告测试抽样区间和多次生成，但不把它称为“训练稳定性已验证”。<\/p>\n<p><strong>追问：至少 3 seeds 是铁律吗？<\/strong> 不是。次数取决于方差、预算与论断强度；关键是准确报告做了什么。<\/p>\n<p><strong>易错：<\/strong> 重复评测同一确定性输出不是新的独立训练实验。<\/p><\/div><\/details>"}</script>
<script id="data-q-E07" type="application/json">{"body":"### 给 k 次机会，只要成功一次\n\n一道代码题生成 5 份答案，只要其中一份通过测试，这道题在 pass@5 的“至少成功一次”意义下就算成功。\n\n它衡量多次尝试的覆盖，不代表系统知道哪份正确。如果部署只能交一个答案，还需要可靠的选择机制。\n\n**直答：** pass@k 关注 k 次尝试中至少有一次成功的能力，必须说明采样与评分条件，并计入额外尝试成本。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** k 次候选中至少一次正确的概率，描述采样覆盖，不代表系统能找到那个正确答案。\n\n若同题采样 n 个候选，c 个正确，n≥k：\n\n$$\\widehat{\\mathrm{pass@}k}=1-\\frac{\\binom{n-c}{k}}{\\binom nk}.$$\n\n**展开：** n−c<k 时结果为 1。与独立同成功率 p 的理想式 1−(1−p)^k 区分；真实采样相关性和具体协议影响解释。\n\n**追问：部署用 best-of-k 就达到 pass@k？** 只有理想验证器能准确选中时才可能；实际选择准确率更低。\n\n**易错：** 不同 k 或采样温度的分数不可直接比较。依据：S53。","html":"<h3>给 k 次机会，只要成功一次<\/h3>\n<p>一道代码题生成 5 份答案，只要其中一份通过测试，这道题在 pass@5 的“至少成功一次”意义下就算成功。<\/p>\n<p>它衡量多次尝试的覆盖，不代表系统知道哪份正确。如果部署只能交一个答案，还需要可靠的选择机制。<\/p>\n<p><strong>直答：<\/strong> pass@k 关注 k 次尝试中至少有一次成功的能力，必须说明采样与评分条件，并计入额外尝试成本。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> k 次候选中至少一次正确的概率，描述采样覆盖，不代表系统能找到那个正确答案。<\/p>\n<p>若同题采样 n 个候选，c 个正确，n≥k：<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mover><mrow><mrow><mi mathvariant=\"normal\">p<\/mi><mi mathvariant=\"normal\">a<\/mi><mi mathvariant=\"normal\">s<\/mi><mi mathvariant=\"normal\">s<\/mi><mi mathvariant=\"normal\">@<\/mi><\/mrow><mi>k<\/mi><\/mrow><mo>^<\/mo><\/mover><mo>=<\/mo><mn>1<\/mn><mo>−<\/mo><mfrac><mrow><mo minsize=\"2.047em\" maxsize=\"2.047em\">(<\/mo><mfrac linethickness=\"0\"><mrow><mi>n<\/mi><mo>−<\/mo><mi>c<\/mi><\/mrow><mrow><mi>k<\/mi><\/mrow><\/mfrac><mo minsize=\"2.047em\" maxsize=\"2.047em\">)<\/mo><\/mrow><mrow><mo minsize=\"2.047em\" maxsize=\"2.047em\">(<\/mo><mfrac linethickness=\"0\"><mi>n<\/mi><mi>k<\/mi><\/mfrac><mo minsize=\"2.047em\" maxsize=\"2.047em\">)<\/mo><\/mrow><\/mfrac><mo>.<\/mo><\/mrow><\/math><\/div>\n<p><strong>展开：<\/strong> n−c&lt;k 时结果为 1。与独立同成功率 p 的理想式 1−(1−p)^k 区分；真实采样相关性和具体协议影响解释。<\/p>\n<p><strong>追问：部署用 best-of-k 就达到 pass@k？<\/strong> 只有理想验证器能准确选中时才可能；实际选择准确率更低。<\/p>\n<p><strong>易错：<\/strong> 不同 k 或采样温度的分数不可直接比较。依据：<a class=\"ref\" href=\"#source-S53\">S53<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-E08" type="application/json">{"body":"### “五次里成功一次”和“五次都成功”差得很远\n\n假设每次成功率为 80%，并且各次独立。四次至少成功一次的概率是 1−0.2⁴=99.84%；四次都成功只有 0.8⁴=40.96%。\n\n前者关心有没有找到解，后者关心反复办事是否可靠。上面的独立性只是教学假设，真实运行需要实测。\n\n**直答：** pass@k 强调多次尝试的成功覆盖，pass^k 强调重复成功的可靠性；符号相近，考查目标相反，不能混用。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** pass@k 看多次里至少一次成功；τ-bench 的 pass^k 关注多次都成功的可靠性。\n\n**展开：** 在独立且每次成功率 p 的教学模型中，前者为 1−(1−p)^k，后者为 p^k。p=0.8、k=4 时分别约 0.9984 与 0.4096，回答的是两种截然不同的问题。\n\n**追问：实际怎么算？** 按对应 benchmark 对多次试验的定义和估计方法，不凭这个理想算式替换官方实现。\n\n**易错：** 排版上一个 @、一个上标，语义不是小区别。依据：S31、S53。","html":"<h3>“五次里成功一次”和“五次都成功”差得很远<\/h3>\n<p>假设每次成功率为 80%，并且各次独立。四次至少成功一次的概率是 1−0.2⁴=99.84%；四次都成功只有 0.8⁴=40.96%。<\/p>\n<p>前者关心有没有找到解，后者关心反复办事是否可靠。上面的独立性只是教学假设，真实运行需要实测。<\/p>\n<p><strong>直答：<\/strong> pass@k 强调多次尝试的成功覆盖，pass^k 强调重复成功的可靠性；符号相近，考查目标相反，不能混用。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> pass@k 看多次里至少一次成功；τ-bench 的 pass^k 关注多次都成功的可靠性。<\/p>\n<p><strong>展开：<\/strong> 在独立且每次成功率 p 的教学模型中，前者为 1−(1−p)^k，后者为 p^k。p=0.8、k=4 时分别约 0.9984 与 0.4096，回答的是两种截然不同的问题。<\/p>\n<p><strong>追问：实际怎么算？<\/strong> 按对应 benchmark 对多次试验的定义和估计方法，不凭这个理想算式替换官方实现。<\/p>\n<p><strong>易错：<\/strong> 排版上一个 @、一个上标，语义不是小区别。依据：<a class=\"ref\" href=\"#source-S31\">S31<\/a>、<a class=\"ref\" href=\"#source-S53\">S53<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-E09" type="application/json">{"body":"### 请 AI 当评卷老师，也先给它一份校准试卷\n\n评审模型可能偏爱长答案、熟悉风格或排在前面的回答。先准备经人工核对的样本，检查它是否能正确判断关键错误。\n\n交换答案顺序、分开事实性与表达评分、抽查分歧，可以帮助发现偏差。多个类似模型投票，也可能一起犯同一种错。\n\n**直答：** 模型评审需要人工基准、偏差检查和持续抽查；评审分数是需要验证的测量工具，不是天然正确的真值。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 把 judge 当测量工具：明确 rubric，人工标注一批难例，测一致性、位置与长度偏差，再建立复核机制。\n\n**展开：** 成对评测随机交换 A/B，隐藏模型名称；区分正确性、完整性、引用和风格。开放文本评分可先判断关键事实，再给总分，避免流畅度遮盖错误。\n\n**追问：同源 judge 有什么问题？** 可能偏好自己的表达和训练分布；更大模型也不自动消除偏差。\n\n**易错：** judge 一致并不证明真值正确，可能是共同偏误。依据：S52。","html":"<h3>请 AI 当评卷老师，也先给它一份校准试卷<\/h3>\n<p>评审模型可能偏爱长答案、熟悉风格或排在前面的回答。先准备经人工核对的样本，检查它是否能正确判断关键错误。<\/p>\n<p>交换答案顺序、分开事实性与表达评分、抽查分歧，可以帮助发现偏差。多个类似模型投票，也可能一起犯同一种错。<\/p>\n<p><strong>直答：<\/strong> 模型评审需要人工基准、偏差检查和持续抽查；评审分数是需要验证的测量工具，不是天然正确的真值。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 把 judge 当测量工具：明确 rubric，人工标注一批难例，测一致性、位置与长度偏差，再建立复核机制。<\/p>\n<p><strong>展开：<\/strong> 成对评测随机交换 A/B，隐藏模型名称；区分正确性、完整性、引用和风格。开放文本评分可先判断关键事实，再给总分，避免流畅度遮盖错误。<\/p>\n<p><strong>追问：同源 judge 有什么问题？<\/strong> 可能偏好自己的表达和训练分布；更大模型也不自动消除偏差。<\/p>\n<p><strong>易错：<\/strong> judge 一致并不证明真值正确，可能是共同偏误。依据：<a class=\"ref\" href=\"#source-S52\">S52<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-E10" type="application/json">{"body":"### 拆掉发动机，车变慢不能证明你设计的发动机最好\n\n消融是去掉或替换某个部件，观察变化。但如果替换后接口失配、预算减少或系统没调通，变差可能来自不公平比较。\n\n例如测重排器价值，要让两边拿到相同候选池，并给替代方案合理设置。\n\n**直答：** 消融要隔离被研究部件的贡献，保证其余系统仍合理工作，并控制数据、候选和资源条件。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 每个消融对应可检验假设，保证移除模块后系统仍是合理、调优过的对照。\n\n**展开：** 测 reranker 价值时固定召回候选池；测新 loss 时尽量统一数据和预算；测长上下文时记录更多 token 带来的成本。注明是总效果、直接作用还是控制条件下的贡献。\n\n**追问：交互效应怎么处理？** 模块 A/B 可能相互依赖，必要时测四组合而非只逐个去掉。\n\n**易错：** 不能把训练中多个改变合并称“单因素消融”。","html":"<h3>拆掉发动机，车变慢不能证明你设计的发动机最好<\/h3>\n<p>消融是去掉或替换某个部件，观察变化。但如果替换后接口失配、预算减少或系统没调通，变差可能来自不公平比较。<\/p>\n<p>例如测重排器价值，要让两边拿到相同候选池，并给替代方案合理设置。<\/p>\n<p><strong>直答：<\/strong> 消融要隔离被研究部件的贡献，保证其余系统仍合理工作，并控制数据、候选和资源条件。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 每个消融对应可检验假设，保证移除模块后系统仍是合理、调优过的对照。<\/p>\n<p><strong>展开：<\/strong> 测 reranker 价值时固定召回候选池；测新 loss 时尽量统一数据和预算；测长上下文时记录更多 token 带来的成本。注明是总效果、直接作用还是控制条件下的贡献。<\/p>\n<p><strong>追问：交互效应怎么处理？<\/strong> 模块 A/B 可能相互依赖，必要时测四组合而非只逐个去掉。<\/p>\n<p><strong>易错：<\/strong> 不能把训练中多个改变合并称“单因素消融”。<\/p><\/div><\/details>"}</script>
<script id="data-q-E11" type="application/json">{"body":"### 先考模拟卷，再小范围实习，最后持续检查\n\n离线测试可以反复、低成本比较；小流量线上试用能发现真实用户行为；上线后的监测负责发现新错误和回归。\n\n每一步都应有通过标准和退回办法。否则“离线分数不错”与“线上出问题”之间缺少可追踪的解释。\n\n**直答：** 把离线评测、有限上线和持续监测连起来，明确每阶段门槛、观察指标和回退条件。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 离线冻结集筛版本，仿真/影子流量查链路，再在可回滚范围内验证真实收益。\n\n**展开：** 记录模型、数据、提示、工具、检索索引与政策版本。线上主指标之外配延迟、成本、错误率、误拒和人工负担等护栏；异常能追溯到具体轨迹。\n\n**追问：线上升了、离线没升？** 可能用户分布不同、系统改动、干预混杂或离线指标未覆盖实际目标，需要对齐归因。\n\n**易错：** 没有真实线上实验，不写“线上提升”；教学设计不等于部署经历。","html":"<h3>先考模拟卷，再小范围实习，最后持续检查<\/h3>\n<p>离线测试可以反复、低成本比较；小流量线上试用能发现真实用户行为；上线后的监测负责发现新错误和回归。<\/p>\n<p>每一步都应有通过标准和退回办法。否则“离线分数不错”与“线上出问题”之间缺少可追踪的解释。<\/p>\n<p><strong>直答：<\/strong> 把离线评测、有限上线和持续监测连起来，明确每阶段门槛、观察指标和回退条件。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 离线冻结集筛版本，仿真/影子流量查链路，再在可回滚范围内验证真实收益。<\/p>\n<p><strong>展开：<\/strong> 记录模型、数据、提示、工具、检索索引与政策版本。线上主指标之外配延迟、成本、错误率、误拒和人工负担等护栏；异常能追溯到具体轨迹。<\/p>\n<p><strong>追问：线上升了、离线没升？<\/strong> 可能用户分布不同、系统改动、干预混杂或离线指标未覆盖实际目标，需要对齐归因。<\/p>\n<p><strong>易错：<\/strong> 没有真实线上实验，不写“线上提升”；教学设计不等于部署经历。<\/p><\/div><\/details>"}</script>
<script id="data-q-E12" type="application/json">{"body":"### 医生不能只说“病人不舒服”\n\nRAG 答错，可能是文档没解析出来、检索没找到、排序把证据挤掉，或模型读到了仍理解错。仅把失败截图堆在一起，无法选择修复办法。\n\n记录中间结果，做替换实验，例如直接提供正确证据，看答案能否恢复，才有助于定位。\n\n**直答：** 按系统阶段建立错误类别，用中间记录和干预对照定位原因，再为修复增加回归样本。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 定义可复用错误分类，按首个可修复原因定位，并用反事实替换验证。\n\n**展开：** RAG 可区分无数据、解析错、路由错、召回漏、重排掉、上下文截断、生成不忠实；Agent 加工具参数、策略、环境与恢复。每类报告数量、严重度、修复成本和代表例。\n\n**追问：一个样本多个原因怎么办？** 保留多标签，同时选择首要失败阶段；可分别测 oracle 检索、oracle 工具等上界。\n\n**易错：** “模型幻觉”太笼统，往往不能指导改进。","html":"<h3>医生不能只说“病人不舒服”<\/h3>\n<p>RAG 答错，可能是文档没解析出来、检索没找到、排序把证据挤掉，或模型读到了仍理解错。仅把失败截图堆在一起，无法选择修复办法。<\/p>\n<p>记录中间结果，做替换实验，例如直接提供正确证据，看答案能否恢复，才有助于定位。<\/p>\n<p><strong>直答：<\/strong> 按系统阶段建立错误类别，用中间记录和干预对照定位原因，再为修复增加回归样本。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 定义可复用错误分类，按首个可修复原因定位，并用反事实替换验证。<\/p>\n<p><strong>展开：<\/strong> RAG 可区分无数据、解析错、路由错、召回漏、重排掉、上下文截断、生成不忠实；Agent 加工具参数、策略、环境与恢复。每类报告数量、严重度、修复成本和代表例。<\/p>\n<p><strong>追问：一个样本多个原因怎么办？<\/strong> 保留多标签，同时选择首要失败阶段；可分别测 oracle 检索、oracle 工具等上界。<\/p>\n<p><strong>易错：<\/strong> “模型幻觉”太笼统，往往不能指导改进。<\/p><\/div><\/details>"}</script>
<script id="data-q-E13" type="application/json">{"body":"### 两种方案要在可比的人群上使用\n\n若新版本都分给简单用户、旧版本都分给复杂用户，成绩差异就混入了人群因素。A/B 测试通过合适的随机分流来提高可比性。\n\n还要考虑同一用户反复出现、两个版本相互影响、提前看结果就停等问题。\n\n**直答：** 明确随机单位、观察周期、主要指标和相互影响，避免把人群或时间差异误认为模型贡献。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 随机分流单位、样本依赖、指标选择、持续时间和多重查看。\n\n**展开：** 用户级分流避免同用户跨组相互影响；会话长度等指标可能受模型行为改变，解释时防选择偏差。提前约定主指标与停止条件，反复看到 p<0.05 就停会增加误报。\n\n**追问：不能随机分流怎么办？** 可做受控回放或观察性比较，但结论的因果力度较弱，需说明混杂因素。\n\n**易错：** 请求数量很大不等于独立用户数量很大。","html":"<h3>两种方案要在可比的人群上使用<\/h3>\n<p>若新版本都分给简单用户、旧版本都分给复杂用户，成绩差异就混入了人群因素。A/B 测试通过合适的随机分流来提高可比性。<\/p>\n<p>还要考虑同一用户反复出现、两个版本相互影响、提前看结果就停等问题。<\/p>\n<p><strong>直答：<\/strong> 明确随机单位、观察周期、主要指标和相互影响，避免把人群或时间差异误认为模型贡献。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 随机分流单位、样本依赖、指标选择、持续时间和多重查看。<\/p>\n<p><strong>展开：<\/strong> 用户级分流避免同用户跨组相互影响；会话长度等指标可能受模型行为改变，解释时防选择偏差。提前约定主指标与停止条件，反复看到 p&lt;0.05 就停会增加误报。<\/p>\n<p><strong>追问：不能随机分流怎么办？<\/strong> 可做受控回放或观察性比较，但结论的因果力度较弱，需说明混杂因素。<\/p>\n<p><strong>易错：<\/strong> 请求数量很大不等于独立用户数量很大。<\/p><\/div><\/details>"}</script>
<script id="data-q-E14" type="application/json">{"body":"### 很会考某张卷子，未必很会解决新问题\n\n模型可能见过公开测试题，开发者也可能反复围绕榜单改方法。可以换时间更新的题、等价改写或隐藏题，看表现是否稳健。\n\n这些检查提供线索，但不能仅凭一次异常就断言别人故意作弊。\n\n**直答：** 用数据溯源、独立新题和预算透明度判断榜单结论的可信范围，避免把公开测试高分直接当作部署能力。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 查训练与测试来源、提示调优、候选选择、样本剔除和预算是否透明。\n\n**展开：** 新时间数据、隐藏测试、任务变体和可执行终态比单一公开分数更能补充证据；但隐藏不等于代表真实部署，仍需覆盖分析。\n\n**追问：该如何写论文结论？** 写“在指定模型、数据版本、解码和预算下提升”，并列不稳定或退化项。\n\n**易错：** 不把作者论文中当时的 SOTA 表述复制成截至今天的排名。","html":"<h3>很会考某张卷子，未必很会解决新问题<\/h3>\n<p>模型可能见过公开测试题，开发者也可能反复围绕榜单改方法。可以换时间更新的题、等价改写或隐藏题，看表现是否稳健。<\/p>\n<p>这些检查提供线索，但不能仅凭一次异常就断言别人故意作弊。<\/p>\n<p><strong>直答：<\/strong> 用数据溯源、独立新题和预算透明度判断榜单结论的可信范围，避免把公开测试高分直接当作部署能力。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 查训练与测试来源、提示调优、候选选择、样本剔除和预算是否透明。<\/p>\n<p><strong>展开：<\/strong> 新时间数据、隐藏测试、任务变体和可执行终态比单一公开分数更能补充证据；但隐藏不等于代表真实部署，仍需覆盖分析。<\/p>\n<p><strong>追问：该如何写论文结论？<\/strong> 写“在指定模型、数据版本、解码和预算下提升”，并列不稳定或退化项。<\/p>\n<p><strong>易错：<\/strong> 不把作者论文中当时的 SOTA 表述复制成截至今天的排名。<\/p><\/div><\/details>"}</script>
<script id="data-q-R01" type="application/json">{"body":"### 不会的问题，是查书、读长材料、补课，还是调用机器？\n\nRAG 先检索相关资料，再据此回答，像开卷考试；长上下文把更多材料直接放进输入；微调改变模型参数，像补课；工具可以执行查询、计算或业务动作。\n\n问最新政策适合查可更新资料，算复杂数值适合调用计算工具。也可以组合，先不要把所有问题都当作“再训练一下”。\n\n**直答：** 根据缺的是知识、上下文容量、行为习惯还是执行能力，选择检索、长输入、微调或工具，并考虑更新频率和成本。\n\n### 进一步：公式、边界与追问\n\n**本章进阶约定与范围：**\n\n定位：三知识库与航空业务经历的直接延伸。核心是证据如何流动、错误如何归因，不止会画“向量库→LLM”。\n\n**技术表述：** RAG 解决外部证据获取，长上下文增加单次可读内容，微调改变模型能力与行为，工具获取或执行精确结构化操作。\n\n**展开：** 经常变更的政策可检索，订单状态查数据库，固定输出格式可 SFT，大文档整体分析可用长上下文；可以组合，先测最简单可用基线。\n\n**追问：有 1M 上下文还要 RAG 吗？** 输入成本、权限过滤、知识更新和干扰仍在，检索可缩小证据范围；但小知识库直接全放也可能更简单。\n\n**易错：** RAG 不保证没有幻觉。依据：S25。","html":"<h3>不会的问题，是查书、读长材料、补课，还是调用机器？<\/h3>\n<p>RAG 先检索相关资料，再据此回答，像开卷考试；长上下文把更多材料直接放进输入；微调改变模型参数，像补课；工具可以执行查询、计算或业务动作。<\/p>\n<p>问最新政策适合查可更新资料，算复杂数值适合调用计算工具。也可以组合，先不要把所有问题都当作“再训练一下”。<\/p>\n<p><strong>直答：<\/strong> 根据缺的是知识、上下文容量、行为习惯还是执行能力，选择检索、长输入、微调或工具，并考虑更新频率和成本。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>本章进阶约定与范围：<\/strong><\/p>\n<p>定位：三知识库与航空业务经历的直接延伸。核心是证据如何流动、错误如何归因，不止会画“向量库→LLM”。<\/p>\n<p><strong>技术表述：<\/strong> RAG 解决外部证据获取，长上下文增加单次可读内容，微调改变模型能力与行为，工具获取或执行精确结构化操作。<\/p>\n<p><strong>展开：<\/strong> 经常变更的政策可检索，订单状态查数据库，固定输出格式可 SFT，大文档整体分析可用长上下文；可以组合，先测最简单可用基线。<\/p>\n<p><strong>追问：有 1M 上下文还要 RAG 吗？<\/strong> 输入成本、权限过滤、知识更新和干扰仍在，检索可缩小证据范围；但小知识库直接全放也可能更简单。<\/p>\n<p><strong>易错：<\/strong> RAG 不保证没有幻觉。依据：<a class=\"ref\" href=\"#source-S25\">S25<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-R02" type="application/json">{"body":"### 从一柜子文件，到一句有根据的回答\n\n先把文件转成可读取文本，再切成片段并建立索引；收到问题后找候选资料、重新排序，把较相关证据交给模型组织答案，最后核对引用。\n\n就像图书馆先编目，再找书、翻页、摘录、作答。任何一步丢了内容，最后都可能答错。\n\n**直答：** RAG 是从文档处理到检索、重排、生成和引用核对的一整条流程，需要保存各阶段记录才能定位问题。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 数据解析→切分与元数据→索引→查询理解/路由→召回→重排→上下文组织→生成与引用→验证和日志。\n\n**展开：** 每一步有版本与证据 ID。航空场景先确认问题是政策、流程还是实时记录；检索权限过滤应在可见内容进入模型前生效。\n\n**追问：哪些要缓存？** 查询或前缀可缓存，但键需包含用户权限、索引/文档版本、模型及模板；动态事实要设置失效机制。\n\n**易错：** 一个总体 judge 分无法知道失败发生在哪个阶段。","html":"<h3>从一柜子文件，到一句有根据的回答<\/h3>\n<p>先把文件转成可读取文本，再切成片段并建立索引；收到问题后找候选资料、重新排序，把较相关证据交给模型组织答案，最后核对引用。<\/p>\n<p>就像图书馆先编目，再找书、翻页、摘录、作答。任何一步丢了内容，最后都可能答错。<\/p>\n<p><strong>直答：<\/strong> RAG 是从文档处理到检索、重排、生成和引用核对的一整条流程，需要保存各阶段记录才能定位问题。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 数据解析→切分与元数据→索引→查询理解/路由→召回→重排→上下文组织→生成与引用→验证和日志。<\/p>\n<p><strong>展开：<\/strong> 每一步有版本与证据 ID。航空场景先确认问题是政策、流程还是实时记录；检索权限过滤应在可见内容进入模型前生效。<\/p>\n<p><strong>追问：哪些要缓存？<\/strong> 查询或前缀可缓存，但键需包含用户权限、索引/文档版本、模型及模板；动态事实要设置失效机制。<\/p>\n<p><strong>易错：<\/strong> 一个总体 judge 分无法知道失败发生在哪个阶段。<\/p><\/div><\/details>"}</script>
<script id="data-q-R03" type="application/json">{"body":"### 资料卡太短看不懂，太长又难找重点\n\n把“退票条件”和“适用航班”切到不同片段，检索到一半就可能误答；整本手册当一个片段，又会带入太多无关内容。\n\noverlap 是让相邻片段保留少量重叠，减少边界断裂，但也增加重复。最好按真实问题需要的完整证据选择切法。\n\n**直答：** 切片要兼顾语义完整、检索定位和输入长度，重叠能缓解断裂但会增加冗余，不能只套固定字数。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 按文档结构、问题粒度与检索/生成预算选择，通过小规模受控对照找平衡。\n\n**展开：** 太短可能丢定义与条件，太长会稀释向量表示并带入噪声。保留标题、表头、条款编号、有效日期和父文档。overlap 减少边界断裂，但增加重复与成本。\n\n**追问：表格怎么切？** 保留表头、单位、行列对应和注释；只抽出数字而丢单位，会制造错误证据。\n\n**易错：** 固定“500 字加 50 overlap”只是起始配置，不是最佳实践定理。","html":"<h3>资料卡太短看不懂，太长又难找重点<\/h3>\n<p>把“退票条件”和“适用航班”切到不同片段，检索到一半就可能误答；整本手册当一个片段，又会带入太多无关内容。<\/p>\n<p>overlap 是让相邻片段保留少量重叠，减少边界断裂，但也增加重复。最好按真实问题需要的完整证据选择切法。<\/p>\n<p><strong>直答：<\/strong> 切片要兼顾语义完整、检索定位和输入长度，重叠能缓解断裂但会增加冗余，不能只套固定字数。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 按文档结构、问题粒度与检索/生成预算选择，通过小规模受控对照找平衡。<\/p>\n<p><strong>展开：<\/strong> 太短可能丢定义与条件，太长会稀释向量表示并带入噪声。保留标题、表头、条款编号、有效日期和父文档。overlap 减少边界断裂，但增加重复与成本。<\/p>\n<p><strong>追问：表格怎么切？<\/strong> 保留表头、单位、行列对应和注释；只抽出数字而丢单位，会制造错误证据。<\/p>\n<p><strong>易错：<\/strong> 固定“500 字加 50 overlap”只是起始配置，不是最佳实践定理。<\/p><\/div><\/details>"}</script>
<script id="data-q-R04" type="application/json">{"body":"### 对上关键词，和听懂同一个意思\n\n关键词检索擅长精确型号、编号和专名；向量检索把文本变成数字表示，尝试找到意思相近的内容，例如“改期”和“换个日期”。\n\n前者可能漏掉换说法，后者可能把语义近但编号不对的文档排前面，组合时可以互补。\n\n**直答：** 稀疏检索重视词项匹配，稠密检索重视学习到的语义相似；两者的强弱随任务不同，混合要通过证据召回验证。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 稀疏检索重视词项匹配，适合编号、专名和精确词；稠密检索捕捉语义相似，适合同义表达。\n\n**展开：** BM25 结合词频饱和、逆文档频率与长度归一；向量检索依赖 embedding 的训练分布。航空代码、型号、政策编号常需要精确匹配，口语改写更需要语义。\n\n**追问：为什么 embedding 相似却答非所问？** 相似不代表蕴含，可能只在主题上相近；还可能忽略否定、时间与适用条件。\n\n**易错：** 不同检索器原始分数的尺度不可直接随意相加。依据：S26、S67。","html":"<h3>对上关键词，和听懂同一个意思<\/h3>\n<p>关键词检索擅长精确型号、编号和专名；向量检索把文本变成数字表示，尝试找到意思相近的内容，例如“改期”和“换个日期”。<\/p>\n<p>前者可能漏掉换说法，后者可能把语义近但编号不对的文档排前面，组合时可以互补。<\/p>\n<p><strong>直答：<\/strong> 稀疏检索重视词项匹配，稠密检索重视学习到的语义相似；两者的强弱随任务不同，混合要通过证据召回验证。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 稀疏检索重视词项匹配，适合编号、专名和精确词；稠密检索捕捉语义相似，适合同义表达。<\/p>\n<p><strong>展开：<\/strong> BM25 结合词频饱和、逆文档频率与长度归一；向量检索依赖 embedding 的训练分布。航空代码、型号、政策编号常需要精确匹配，口语改写更需要语义。<\/p>\n<p><strong>追问：为什么 embedding 相似却答非所问？<\/strong> 相似不代表蕴含，可能只在主题上相近；还可能忽略否定、时间与适用条件。<\/p>\n<p><strong>易错：<\/strong> 不同检索器原始分数的尺度不可直接随意相加。依据：<a class=\"ref\" href=\"#source-S26\">S26<\/a>、<a class=\"ref\" href=\"#source-S67\">S67<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-R05" type="application/json">{"body":"### 两个老师的原始分数不一样，先比较名次\n\n关键词检索给分 12.3，向量检索给分 0.82，量纲不同，直接相加可能没有意义。RRF 根据各列表中的排名给贡献，再把同一文档的贡献加起来。\n\n在多个列表都靠前的文档更有优势。它简化融合，但不理解文档内容本身。\n\n**直答：** RRF 用排名而非原始分数融合多个检索结果，减少分数尺度不一致的问题，常数和候选范围仍需设定。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 依据排名而非原始分数融合，降低不同检索器分数尺度不一致的问题。\n\n$$\\mathrm{RRF}(d)=\\sum_j\\frac1{k_0+\\mathrm{rank}_j(d)}.$$\n\n**展开：** k₀ 是平滑常数，不是 top-k 检索条数；不在某列表中的文档该项通常记零。先统一文档/段落 ID、去重，再融合。\n\n**追问：RRF 一定最好吗？** 不是，它丢弃分数间距信息；有可靠验证集时也可做校准加权或学习排序。\n\n**练习：** 同一文档两榜排名 1 与 3，k₀=60，得分 1/61+1/63≈0.03227。依据：S68。","html":"<h3>两个老师的原始分数不一样，先比较名次<\/h3>\n<p>关键词检索给分 12.3，向量检索给分 0.82，量纲不同，直接相加可能没有意义。RRF 根据各列表中的排名给贡献，再把同一文档的贡献加起来。<\/p>\n<p>在多个列表都靠前的文档更有优势。它简化融合，但不理解文档内容本身。<\/p>\n<p><strong>直答：<\/strong> RRF 用排名而非原始分数融合多个检索结果，减少分数尺度不一致的问题，常数和候选范围仍需设定。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 依据排名而非原始分数融合，降低不同检索器分数尺度不一致的问题。<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mrow><mi mathvariant=\"normal\">R<\/mi><mi mathvariant=\"normal\">R<\/mi><mi mathvariant=\"normal\">F<\/mi><\/mrow><mo stretchy=\"false\">(<\/mo><mi>d<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><munder><mo>∑<\/mo><mi>j<\/mi><\/munder><mfrac><mn>1<\/mn><mrow><msub><mi>k<\/mi><mn>0<\/mn><\/msub><mo>+<\/mo><msub><mrow><mi mathvariant=\"normal\">r<\/mi><mi mathvariant=\"normal\">a<\/mi><mi mathvariant=\"normal\">n<\/mi><mi mathvariant=\"normal\">k<\/mi><\/mrow><mi>j<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>d<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/mfrac><mo>.<\/mo><\/mrow><\/math><\/div>\n<p><strong>展开：<\/strong> k₀ 是平滑常数，不是 top-k 检索条数；不在某列表中的文档该项通常记零。先统一文档/段落 ID、去重，再融合。<\/p>\n<p><strong>追问：RRF 一定最好吗？<\/strong> 不是，它丢弃分数间距信息；有可靠验证集时也可做校准加权或学习排序。<\/p>\n<p><strong>练习：<\/strong> 同一文档两榜排名 1 与 3，k₀=60，得分 1/61+1/63≈0.03227。依据：<a class=\"ref\" href=\"#source-S68\">S68<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-R06" type="application/json">{"body":"### 先快速海选，再让评委仔细比较\n\nBi-encoder 分别把问题和文档编码，文档可以提前算好，适合从大量资料里快速找候选。Cross-encoder 把问题与每份候选放在一起分析，能做更细的交互判断，但更费计算。\n\n因此常先召回几十份，再精排其中最有用的几份。\n\n**直答：** 双编码器适合大规模快速召回，交叉编码器适合小候选集精排；分工来自速度与细粒度匹配的取舍。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** Bi-encoder 分别编码 query/document，便于离线建索引与快速召回；Cross-encoder 联合输入，细粒度判断相关性，常用于较小候选集重排。\n\n**展开：** 重排无法找回召回阶段完全漏掉的证据；所以先确认候选池 recall，再比较重排。还要看长文本截断和中文/领域适配。\n\n**追问：rerank 后效果变差？** 可能重排模型不适合领域、关键信息超出长度、只按主题相似而非回答支持排序。\n\n**易错：** 更大 reranker 未必在固定延迟预算下更好。依据：S26、S69。","html":"<h3>先快速海选，再让评委仔细比较<\/h3>\n<p>Bi-encoder 分别把问题和文档编码，文档可以提前算好，适合从大量资料里快速找候选。Cross-encoder 把问题与每份候选放在一起分析，能做更细的交互判断，但更费计算。<\/p>\n<p>因此常先召回几十份，再精排其中最有用的几份。<\/p>\n<p><strong>直答：<\/strong> 双编码器适合大规模快速召回，交叉编码器适合小候选集精排；分工来自速度与细粒度匹配的取舍。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> Bi-encoder 分别编码 query/document，便于离线建索引与快速召回；Cross-encoder 联合输入，细粒度判断相关性，常用于较小候选集重排。<\/p>\n<p><strong>展开：<\/strong> 重排无法找回召回阶段完全漏掉的证据；所以先确认候选池 recall，再比较重排。还要看长文本截断和中文/领域适配。<\/p>\n<p><strong>追问：rerank 后效果变差？<\/strong> 可能重排模型不适合领域、关键信息超出长度、只按主题相似而非回答支持排序。<\/p>\n<p><strong>易错：<\/strong> 更大 reranker 未必在固定延迟预算下更好。依据：<a class=\"ref\" href=\"#source-S26\">S26<\/a>、<a class=\"ref\" href=\"#source-S69\">S69<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-R07" type="application/json">{"body":"### 教模型分清“相关”和“看起来很像但不相关”\n\n训练文本向量时，让问题靠近正确证据、远离不相关片段。难负例是容易混淆的错误候选，例如问国内退票规则，却给国际航班的相似条款。\n\n难例有价值，但若它其实也能回答问题，把它当负例反而教错。\n\n**直答：** 对比学习拉近正确匹配、区分错误匹配；难负例要有代表性，并确认不属于漏标的正确证据。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 拉近问题与相关文档表示，推远不相关文档；难负例与主题相近但不支持答案，能提供更有用区分。\n\n$$L=-\\log\\frac{\\exp(s(q,d^+)/\\tau)}{\\exp(s(q,d^+)/\\tau)+\\sum_j\\exp(s(q,d_j^-)/\\tau)}.$$\n\n**展开：** in-batch negatives 省计算，但其他样本的正例可能也是当前 query 的正确证据，形成 false negative。去重与多正例标注很重要。\n\n**追问：余弦和点积等价吗？** 向量都 L2 归一化时排序可等价，否则范数会影响点积。\n\n**易错：** 换 embedding 模型后旧索引通常需要重建或明确兼容策略。依据：S26。","html":"<h3>教模型分清“相关”和“看起来很像但不相关”<\/h3>\n<p>训练文本向量时，让问题靠近正确证据、远离不相关片段。难负例是容易混淆的错误候选，例如问国内退票规则，却给国际航班的相似条款。<\/p>\n<p>难例有价值，但若它其实也能回答问题，把它当负例反而教错。<\/p>\n<p><strong>直答：<\/strong> 对比学习拉近正确匹配、区分错误匹配；难负例要有代表性，并确认不属于漏标的正确证据。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 拉近问题与相关文档表示，推远不相关文档；难负例与主题相近但不支持答案，能提供更有用区分。<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>L<\/mi><mo>=<\/mo><mo>−<\/mo><mi>log<\/mi><mfrac><mrow><mi>exp<\/mi><mo stretchy=\"false\">(<\/mo><mi>s<\/mi><mo stretchy=\"false\">(<\/mo><mi>q<\/mi><mo>,<\/mo><msup><mi>d<\/mi><mo>+<\/mo><\/msup><mo stretchy=\"false\">)<\/mo><mo>/<\/mo><mi>τ<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><mrow><mi>exp<\/mi><mo stretchy=\"false\">(<\/mo><mi>s<\/mi><mo stretchy=\"false\">(<\/mo><mi>q<\/mi><mo>,<\/mo><msup><mi>d<\/mi><mo>+<\/mo><\/msup><mo stretchy=\"false\">)<\/mo><mo>/<\/mo><mi>τ<\/mi><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><msub><mo>∑<\/mo><mi>j<\/mi><\/msub><mi>exp<\/mi><mo stretchy=\"false\">(<\/mo><mi>s<\/mi><mo stretchy=\"false\">(<\/mo><mi>q<\/mi><mo>,<\/mo><msubsup><mi>d<\/mi><mi>j<\/mi><mo>−<\/mo><\/msubsup><mo stretchy=\"false\">)<\/mo><mo>/<\/mo><mi>τ<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/mfrac><mo>.<\/mo><\/mrow><\/math><\/div>\n<p><strong>展开：<\/strong> in-batch negatives 省计算，但其他样本的正例可能也是当前 query 的正确证据，形成 false negative。去重与多正例标注很重要。<\/p>\n<p><strong>追问：余弦和点积等价吗？<\/strong> 向量都 L2 归一化时排序可等价，否则范数会影响点积。<\/p>\n<p><strong>易错：<\/strong> 换 embedding 模型后旧索引通常需要重建或明确兼容策略。依据：<a class=\"ref\" href=\"#source-S26\">S26<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-R08" type="application/json">{"body":"### 找没找到、第一条好答案多靠前、整页排序好不好\n\nRecall@k 看前 k 条有没有覆盖需要的相关资料；MRR 关注第一条相关结果的名次；NDCG 可以考虑多条结果的相关程度，并更重视前面的名次。\n\n如果任务需要两份不同证据，仅把第一份排第一仍然不够，指标要匹配真正的信息需求。\n\n**直答：** 检索指标分别强调覆盖、首个命中或分级排序质量；先定义相关证据，再选择能反映任务目标的指标。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** Recall@k 看需要的相关项找回多少；MRR 看第一个相关结果排多前；NDCG 支持分级相关性与位置折扣。\n\n**展开：** 多跳问题需要多条证据，仅“第一条命中”不足。文档级命中与片段级可回答性也不同。统一 relevance 定义和去重单位。\n\n**追问：检索 top-k 大一点一定好？** recall 可能提高，但噪声、上下文占用和生成干扰也会上升。\n\n**易错：** hit@k（至少一个命中）不等于多证据场景的 recall@k。依据：S67。","html":"<h3>找没找到、第一条好答案多靠前、整页排序好不好<\/h3>\n<p>Recall@k 看前 k 条有没有覆盖需要的相关资料；MRR 关注第一条相关结果的名次；NDCG 可以考虑多条结果的相关程度，并更重视前面的名次。<\/p>\n<p>如果任务需要两份不同证据，仅把第一份排第一仍然不够，指标要匹配真正的信息需求。<\/p>\n<p><strong>直答：<\/strong> 检索指标分别强调覆盖、首个命中或分级排序质量；先定义相关证据，再选择能反映任务目标的指标。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> Recall@k 看需要的相关项找回多少；MRR 看第一个相关结果排多前；NDCG 支持分级相关性与位置折扣。<\/p>\n<p><strong>展开：<\/strong> 多跳问题需要多条证据，仅“第一条命中”不足。文档级命中与片段级可回答性也不同。统一 relevance 定义和去重单位。<\/p>\n<p><strong>追问：检索 top-k 大一点一定好？<\/strong> recall 可能提高，但噪声、上下文占用和生成干扰也会上升。<\/p>\n<p><strong>易错：<\/strong> hit@k（至少一个命中）不等于多证据场景的 recall@k。依据：<a class=\"ref\" href=\"#source-S67\">S67<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-R09" type="application/json">{"body":"### 问题该去哪个柜子找，也可能要查两个柜子\n\n假设有航班规则、会员政策和内部流程三个库。问普通退票查一个库可能够，问“会员如何退改签”可能要联合查。\n\n路由就是决定搜哪里。评测不仅看库是否选对，还看最终找齐了哪些证据以及多查带来的成本。\n\n**直答：** 按问题的信息需求决定单库或跨库检索，测试路由错误、证据完整性和资源代价，避免把多库简单串在一起。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 先定义每库的知识边界、权限与更新周期，再支持单库、多库和不确定路由。\n\n**展开：** 将任务标注为需哪些库的证据；统计漏路由、错路由、跨库组合、无库可答。低置信度可多库召回后重排，而非强迫单选。\n\n**追问：路由准确率高但回答差？** 可能路由标签太粗、证据缺失、检索失败或跨库规则冲突。做 oracle 路由对照估计其损失上界。\n\n**易错：** 只按“问题中有某个词”硬编码时，要测同义和歧义例。","html":"<h3>问题该去哪个柜子找，也可能要查两个柜子<\/h3>\n<p>假设有航班规则、会员政策和内部流程三个库。问普通退票查一个库可能够，问“会员如何退改签”可能要联合查。<\/p>\n<p>路由就是决定搜哪里。评测不仅看库是否选对，还看最终找齐了哪些证据以及多查带来的成本。<\/p>\n<p><strong>直答：<\/strong> 按问题的信息需求决定单库或跨库检索，测试路由错误、证据完整性和资源代价，避免把多库简单串在一起。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 先定义每库的知识边界、权限与更新周期，再支持单库、多库和不确定路由。<\/p>\n<p><strong>展开：<\/strong> 将任务标注为需哪些库的证据；统计漏路由、错路由、跨库组合、无库可答。低置信度可多库召回后重排，而非强迫单选。<\/p>\n<p><strong>追问：路由准确率高但回答差？<\/strong> 可能路由标签太粗、证据缺失、检索失败或跨库规则冲突。做 oracle 路由对照估计其损失上界。<\/p>\n<p><strong>易错：<\/strong> 只按“问题中有某个词”硬编码时，要测同义和歧义例。<\/p><\/div><\/details>"}</script>
<script id="data-q-R10" type="application/json">{"body":"### 换个问法有助于查书，也可能把原问题改偏\n\n查询改写尝试更适合检索的表达；HyDE 先生成假想答案再用它检索；多跳检索根据前一次结果继续查下一步。\n\n这些中间文字不是已经证实的事实。如果假想答案错了，还被后面当真，就会把搜索带向错误方向。\n\n**直答：** 查询扩展可以提高覆盖，但必须保留原始意图、追踪证据来源，并检查中间生成错误是否被放大。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 它们扩展查询表达与检索路径，但也可能改错意图或引入虚构约束。\n\n**展开：** 保留原 query，与改写结果联合检索；多轮改写应解析指代但保留实体、日期、否定与权限。HyDE 类方法用假设文档帮助检索，不能把其内容当真实证据。\n\n**追问：多跳什么时候停？** 依据证据覆盖、预算、重复查询或无法解决的冲突停止，必要时澄清。\n\n**易错：** 将改写器编造的航班号或规则编号传给后续会放大错误。依据：S70。","html":"<h3>换个问法有助于查书，也可能把原问题改偏<\/h3>\n<p>查询改写尝试更适合检索的表达；HyDE 先生成假想答案再用它检索；多跳检索根据前一次结果继续查下一步。<\/p>\n<p>这些中间文字不是已经证实的事实。如果假想答案错了，还被后面当真，就会把搜索带向错误方向。<\/p>\n<p><strong>直答：<\/strong> 查询扩展可以提高覆盖，但必须保留原始意图、追踪证据来源，并检查中间生成错误是否被放大。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 它们扩展查询表达与检索路径，但也可能改错意图或引入虚构约束。<\/p>\n<p><strong>展开：<\/strong> 保留原 query，与改写结果联合检索；多轮改写应解析指代但保留实体、日期、否定与权限。HyDE 类方法用假设文档帮助检索，不能把其内容当真实证据。<\/p>\n<p><strong>追问：多跳什么时候停？<\/strong> 依据证据覆盖、预算、重复查询或无法解决的冲突停止，必要时澄清。<\/p>\n<p><strong>易错：<\/strong> 将改写器编造的航班号或规则编号传给后续会放大错误。依据：<a class=\"ref\" href=\"#source-S70\">S70<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-R11" type="application/json">{"body":"### 说得有出处、说得对、说得全，是不同要求\n\n回答忠实于旧手册，却可能不符合新政策；引用了一条真实规定，却漏掉关键例外；标了引用，但那一页其实不支持该结论。\n\n所以要分别检查是否依照给定证据、事实是否正确、所需内容是否完整、每条引用是否真的支持它旁边的话。\n\n**直答：** 忠实性、正确性、完整性和引用支持度分别回答不同问题，不能用“带引用”直接证明答案可靠。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 忠实性看是否被证据支持，正确性看是否符合真值，完整性看需求覆盖，引用精度看引用是否真正支持所附结论。\n\n**展开：** 证据本身过期时，回答可以忠实但错误；回答事实正确但没被所引文档支持，则引用不可靠。将回答拆成可核对 claims，分别标支持与覆盖。\n\n**追问：RAGChecker 的价值？** 用细粒度诊断区分检索和生成问题，比只看一个总体生成分数更可操作。\n\n**易错：** 有引用标记不等于引用有效，引用到整本手册也未必可定位。依据：S29。","html":"<h3>说得有出处、说得对、说得全，是不同要求<\/h3>\n<p>回答忠实于旧手册，却可能不符合新政策；引用了一条真实规定，却漏掉关键例外；标了引用，但那一页其实不支持该结论。<\/p>\n<p>所以要分别检查是否依照给定证据、事实是否正确、所需内容是否完整、每条引用是否真的支持它旁边的话。<\/p>\n<p><strong>直答：<\/strong> 忠实性、正确性、完整性和引用支持度分别回答不同问题，不能用“带引用”直接证明答案可靠。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 忠实性看是否被证据支持，正确性看是否符合真值，完整性看需求覆盖，引用精度看引用是否真正支持所附结论。<\/p>\n<p><strong>展开：<\/strong> 证据本身过期时，回答可以忠实但错误；回答事实正确但没被所引文档支持，则引用不可靠。将回答拆成可核对 claims，分别标支持与覆盖。<\/p>\n<p><strong>追问：RAGChecker 的价值？<\/strong> 用细粒度诊断区分检索和生成问题，比只看一个总体生成分数更可操作。<\/p>\n<p><strong>易错：<\/strong> 有引用标记不等于引用有效，引用到整本手册也未必可定位。依据：<a class=\"ref\" href=\"#source-S29\">S29<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-R12" type="application/json">{"body":"### 两本手册互相矛盾，不能随便挑一句顺眼的\n\n先看版本、适用对象、发布权限和时间；如果仍无法消除冲突，就说明冲突在哪里，并按任务要求进一步确认。\n\n找不到证据时也不要用流畅表达掩盖缺失。区分资料确定支持的内容与仍待核实的部分。\n\n**直答：** 冲突先核版本和适用范围，缺失就明确说明并继续查证或升级处理，让回答强度与证据强度匹配。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 按来源权威、适用范围和生效日期处理；缺证据则澄清、查工具或明确不能确认。\n\n**展开：** 文档版本与事件发生时间可能不同；新规则不一定适用于旧订单。引用中保留条款位置、版本和有效期，不让模型凭措辞自信决定哪个为准。\n\n**追问：无证据拒答怎么评测？** 构造可答、缺证据、冲突和过期四类，分别测有效帮助、正确拒答与误拒。\n\n**易错：** 最新发布时间不必然等于最新生效规则。","html":"<h3>两本手册互相矛盾，不能随便挑一句顺眼的<\/h3>\n<p>先看版本、适用对象、发布权限和时间；如果仍无法消除冲突，就说明冲突在哪里，并按任务要求进一步确认。<\/p>\n<p>找不到证据时也不要用流畅表达掩盖缺失。区分资料确定支持的内容与仍待核实的部分。<\/p>\n<p><strong>直答：<\/strong> 冲突先核版本和适用范围，缺失就明确说明并继续查证或升级处理，让回答强度与证据强度匹配。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 按来源权威、适用范围和生效日期处理；缺证据则澄清、查工具或明确不能确认。<\/p>\n<p><strong>展开：<\/strong> 文档版本与事件发生时间可能不同；新规则不一定适用于旧订单。引用中保留条款位置、版本和有效期，不让模型凭措辞自信决定哪个为准。<\/p>\n<p><strong>追问：无证据拒答怎么评测？<\/strong> 构造可答、缺证据、冲突和过期四类，分别测有效帮助、正确拒答与误拒。<\/p>\n<p><strong>易错：<\/strong> 最新发布时间不必然等于最新生效规则。<\/p><\/div><\/details>"}</script>
<script id="data-q-R13" type="application/json">{"body":"### 检索也可以学会反思、做层级笔记、整理关系\n\nSelf-RAG 关注是否需要检索及生成后的自我评价；RAPTOR 用分层摘要组织资料，帮助不同粒度的检索；GraphRAG 利用关系组织或汇总信息，支持某些跨文档问题。\n\n它们不是同一个算法换名字，各有建立索引和维护的成本。\n\n**直答：** 先识别当前困难是检索决策、层次概括还是跨文档关系，再考虑对应方法，并与简单基线比较。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** Self-RAG 研究何时检索与自我评估；RAPTOR 用层级摘要服务不同抽象层的问题；图式检索适合实体关系和跨文档聚合。\n\n**展开：** 增加结构会带来构建、更新与错误传播成本。摘要可能遗漏限制条件，图边可能抽取错，反思标签也需可靠训练。\n\n**追问：企业小知识库是否都要 GraphRAG？** 不需要先假定；与简单混合检索比较多跳覆盖、事实可靠、延迟与维护成本。\n\n**易错：** 原论文的学习式 Self-RAG 不等于在提示词加一句“请反思”。依据：S27、S28、S71。","html":"<h3>检索也可以学会反思、做层级笔记、整理关系<\/h3>\n<p>Self-RAG 关注是否需要检索及生成后的自我评价；RAPTOR 用分层摘要组织资料，帮助不同粒度的检索；GraphRAG 利用关系组织或汇总信息，支持某些跨文档问题。<\/p>\n<p>它们不是同一个算法换名字，各有建立索引和维护的成本。<\/p>\n<p><strong>直答：<\/strong> 先识别当前困难是检索决策、层次概括还是跨文档关系，再考虑对应方法，并与简单基线比较。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> Self-RAG 研究何时检索与自我评估；RAPTOR 用层级摘要服务不同抽象层的问题；图式检索适合实体关系和跨文档聚合。<\/p>\n<p><strong>展开：<\/strong> 增加结构会带来构建、更新与错误传播成本。摘要可能遗漏限制条件，图边可能抽取错，反思标签也需可靠训练。<\/p>\n<p><strong>追问：企业小知识库是否都要 GraphRAG？<\/strong> 不需要先假定；与简单混合检索比较多跳覆盖、事实可靠、延迟与维护成本。<\/p>\n<p><strong>易错：<\/strong> 原论文的学习式 Self-RAG 不等于在提示词加一句“请反思”。依据：<a class=\"ref\" href=\"#source-S27\">S27<\/a>、<a class=\"ref\" href=\"#source-S28\">S28<\/a>、<a class=\"ref\" href=\"#source-S71\">S71<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-R14" type="application/json">{"body":"### 分阶段问：书在不在、找没找到、读懂没有\n\n先确认答案证据确实进入了索引；再看检索是否拿到、重排是否保留；最后把正确证据直接给模型，看它能否答对。\n\n这个“替换成已知正确输入”的办法能缩小问题范围，比盲目增大模型或切片更有效。\n\n**直答：** 沿解析、索引、召回、重排、生成逐层检查，用正确证据替换实验定位瓶颈，再做针对性修复。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 顺着“数据是否存在→能否召回→是否保留→模型是否使用”逐层查。\n\n**展开：** 先找 gold evidence；不存在是数据问题；存在却没进候选是解析/路由/召回；候选有但重排后没了是排序；输入有却答案错是组织或生成。用人工正确证据替换检索结果，看端到端提升上界。\n\n**追问：长上下文里证据明明在为什么仍错？** 可能位置、干扰、冲突或条件组合难，需做位置交换与噪声消融。\n\n**易错：** 不先做 oracle 分析就换更大模型，可能花钱掩盖上游错误。","html":"<h3>分阶段问：书在不在、找没找到、读懂没有<\/h3>\n<p>先确认答案证据确实进入了索引；再看检索是否拿到、重排是否保留；最后把正确证据直接给模型，看它能否答对。<\/p>\n<p>这个“替换成已知正确输入”的办法能缩小问题范围，比盲目增大模型或切片更有效。<\/p>\n<p><strong>直答：<\/strong> 沿解析、索引、召回、重排、生成逐层检查，用正确证据替换实验定位瓶颈，再做针对性修复。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 顺着“数据是否存在→能否召回→是否保留→模型是否使用”逐层查。<\/p>\n<p><strong>展开：<\/strong> 先找 gold evidence；不存在是数据问题；存在却没进候选是解析/路由/召回；候选有但重排后没了是排序；输入有却答案错是组织或生成。用人工正确证据替换检索结果，看端到端提升上界。<\/p>\n<p><strong>追问：长上下文里证据明明在为什么仍错？<\/strong> 可能位置、干扰、冲突或条件组合难，需做位置交换与噪声消融。<\/p>\n<p><strong>易错：<\/strong> 不先做 oracle 分析就换更大模型，可能花钱掩盖上游错误。<\/p><\/div><\/details>"}</script>
<script id="data-q-R15" type="application/json">{"body":"### 百万资料里找邻居，不一定逐个量距离\n\nANN 是近似最近邻搜索，允许少量近似误差，换取更快查询。HNSW 把向量组织成多层邻接关系，可以先大步靠近，再细找相似向量。\n\n搜索更仔细通常能找到更好的邻居，但也更慢、更耗资源。“向量邻居近”仍不保证它能回答业务问题。\n\n**直答：** ANN 加速相似向量查找，HNSW 用分层图搜索实现速度与召回的取舍；最终还要评估真实证据检索效果。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 近似最近邻 ANN 以少量召回损失换取大规模检索速度；HNSW 利用分层邻近图，从粗层导航到细层搜索。\n\n**展开：** 图的连接度、构建搜索与查询搜索预算影响内存、构建时间和召回。需要用精确检索作小样本参照，再调实际质量—延迟曲线。\n\n**追问：ANN recall 高就代表 RAG 好吗？** 它常衡量相对精确向量近邻的找回率；精确向量近邻本身也可能不是支持答案的证据。\n\n**易错：** 索引 recall、语义 relevance recall、最终答案正确率是三个不同层次。依据：S78。","html":"<h3>百万资料里找邻居，不一定逐个量距离<\/h3>\n<p>ANN 是近似最近邻搜索，允许少量近似误差，换取更快查询。HNSW 把向量组织成多层邻接关系，可以先大步靠近，再细找相似向量。<\/p>\n<p>搜索更仔细通常能找到更好的邻居，但也更慢、更耗资源。“向量邻居近”仍不保证它能回答业务问题。<\/p>\n<p><strong>直答：<\/strong> ANN 加速相似向量查找，HNSW 用分层图搜索实现速度与召回的取舍；最终还要评估真实证据检索效果。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 近似最近邻 ANN 以少量召回损失换取大规模检索速度；HNSW 利用分层邻近图，从粗层导航到细层搜索。<\/p>\n<p><strong>展开：<\/strong> 图的连接度、构建搜索与查询搜索预算影响内存、构建时间和召回。需要用精确检索作小样本参照，再调实际质量—延迟曲线。<\/p>\n<p><strong>追问：ANN recall 高就代表 RAG 好吗？<\/strong> 它常衡量相对精确向量近邻的找回率；精确向量近邻本身也可能不是支持答案的证据。<\/p>\n<p><strong>易错：<\/strong> 索引 recall、语义 relevance recall、最终答案正确率是三个不同层次。依据：<a class=\"ref\" href=\"#source-S78\">S78<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-A01" type="application/json">{"body":"### 按固定菜谱做，还是根据现场情况决定下一步\n\nWorkflow 的主要步骤和分支由人预先规定；Agent 在给定目标与权限内，可以依据当前结果选择下一步工具或行动。\n\n比如固定“查询—汇总—回复”和“先查缺什么信息，再决定补查或澄清”有所不同。自主选择更多，也增加失败组合和评测难度。\n\n**直答：** 区别主要在执行过程由谁决定、能调整到什么程度；能用固定流程可靠完成的任务，不一定需要更高自主性。\n\n### 进一步：公式、边界与追问\n\n**本章进阶约定与范围：**\n\n定位：把 LangGraph 项目从“流程编排”讲成可验证的决策系统。本章框架无关；具体 API 与默认行为以固定软件版本为准。\n\n**技术表述：** Workflow 的主要执行路径由开发者预先规定；Agent 让模型在一定范围内选择下一步行动、工具和停止时机。\n\n**展开：** 两者可混合：高风险业务流程保持明确约束，知识检索和诊断步骤允许灵活决策。选择自由度应对应真实任务需求与评测能力。\n\n**追问：所有任务都值得 Agent 化吗？** 固定结构查询、简单分类可能用程序更可靠、更便宜；先建立规则或固定流程基线。\n\n**易错：** 循环调用 LLM 不自动产生有效规划。","html":"<h3>按固定菜谱做，还是根据现场情况决定下一步<\/h3>\n<p>Workflow 的主要步骤和分支由人预先规定；Agent 在给定目标与权限内，可以依据当前结果选择下一步工具或行动。<\/p>\n<p>比如固定“查询—汇总—回复”和“先查缺什么信息，再决定补查或澄清”有所不同。自主选择更多，也增加失败组合和评测难度。<\/p>\n<p><strong>直答：<\/strong> 区别主要在执行过程由谁决定、能调整到什么程度；能用固定流程可靠完成的任务，不一定需要更高自主性。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>本章进阶约定与范围：<\/strong><\/p>\n<p>定位：把 LangGraph 项目从“流程编排”讲成可验证的决策系统。本章框架无关；具体 API 与默认行为以固定软件版本为准。<\/p>\n<p><strong>技术表述：<\/strong> Workflow 的主要执行路径由开发者预先规定；Agent 让模型在一定范围内选择下一步行动、工具和停止时机。<\/p>\n<p><strong>展开：<\/strong> 两者可混合：高风险业务流程保持明确约束，知识检索和诊断步骤允许灵活决策。选择自由度应对应真实任务需求与评测能力。<\/p>\n<p><strong>追问：所有任务都值得 Agent 化吗？<\/strong> 固定结构查询、简单分类可能用程序更可靠、更便宜；先建立规则或固定流程基线。<\/p>\n<p><strong>易错：<\/strong> 循环调用 LLM 不自动产生有效规划。<\/p><\/div><\/details>"}</script>
<script id="data-q-A02" type="application/json">{"body":"### 先行动获得新信息，再更新判断\n\n查航班前只能猜有哪些选项；调用查询工具后，才知道实际时间和余票。ReAct 把思考、动作和观察交替起来，让下一步根据新信息调整。\n\n若工具报错，也应把报错当作当前事实处理，不能继续假设查询成功。\n\n**直答：** ReAct 通过推理—行动—观察循环，让规划与外部反馈相互更新，避免一开始就凭不完整信息定死全部步骤。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 让模型利用行动获得的新观察更新决策，减少只凭内部知识规划到底的错误。\n\n**展开：** 模型提出下一动作，环境返回观察，再决定下一步。真正的增益来自外部信息和可纠错反馈，不是输出“Thought/Action”格式本身。\n\n**追问：为什么不能一次计划全部工具调用？** 动态任务中后续参数可能依赖查询结果；但彼此独立的只读查询可并行。\n\n**易错：** 文本写“已完成操作”不证明工具真的执行。依据：S30。","html":"<h3>先行动获得新信息，再更新判断<\/h3>\n<p>查航班前只能猜有哪些选项；调用查询工具后，才知道实际时间和余票。ReAct 把思考、动作和观察交替起来，让下一步根据新信息调整。<\/p>\n<p>若工具报错，也应把报错当作当前事实处理，不能继续假设查询成功。<\/p>\n<p><strong>直答：<\/strong> ReAct 通过推理—行动—观察循环，让规划与外部反馈相互更新，避免一开始就凭不完整信息定死全部步骤。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 让模型利用行动获得的新观察更新决策，减少只凭内部知识规划到底的错误。<\/p>\n<p><strong>展开：<\/strong> 模型提出下一动作，环境返回观察，再决定下一步。真正的增益来自外部信息和可纠错反馈，不是输出“Thought/Action”格式本身。<\/p>\n<p><strong>追问：为什么不能一次计划全部工具调用？<\/strong> 动态任务中后续参数可能依赖查询结果；但彼此独立的只读查询可并行。<\/p>\n<p><strong>易错：<\/strong> 文本写“已完成操作”不证明工具真的执行。依据：<a class=\"ref\" href=\"#source-S30\">S30<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-A03" type="application/json">{"body":"### 表格填得合规，不代表事情办对了\n\n工具调用的 JSON 格式正确，只说明系统能读懂字段；航班日期填错、金额单位弄错、对象不对，仍会执行错误。\n\n还要检查请求是否有授权、参数语义是否正确、工具是否成功，以及最终业务状态有没有变化到目标。\n\n**直答：** 工具调用要依次验证格式、参数含义、权限、执行结果和最终状态；格式通过只是第一关。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 还要验证工具选择、参数语义、权限、执行结果和业务终态。\n\n**展开：** schema 只约束形状，不保证订单 ID 存在、日期有效、金额单位正确或动作获授权。执行器应校验类型、枚举、范围、关系约束和调用上下文。\n\n**追问：结构化输出为什么仍会失败？** 它可能生成格式合法但含义错误的参数。需要错误反馈与修正，而非无限重复。\n\n**易错：** 不要把 tool call parse rate 叫 task success rate。","html":"<h3>表格填得合规，不代表事情办对了<\/h3>\n<p>工具调用的 JSON 格式正确，只说明系统能读懂字段；航班日期填错、金额单位弄错、对象不对，仍会执行错误。<\/p>\n<p>还要检查请求是否有授权、参数语义是否正确、工具是否成功，以及最终业务状态有没有变化到目标。<\/p>\n<p><strong>直答：<\/strong> 工具调用要依次验证格式、参数含义、权限、执行结果和最终状态；格式通过只是第一关。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 还要验证工具选择、参数语义、权限、执行结果和业务终态。<\/p>\n<p><strong>展开：<\/strong> schema 只约束形状，不保证订单 ID 存在、日期有效、金额单位正确或动作获授权。执行器应校验类型、枚举、范围、关系约束和调用上下文。<\/p>\n<p><strong>追问：结构化输出为什么仍会失败？<\/strong> 它可能生成格式合法但含义错误的参数。需要错误反馈与修正，而非无限重复。<\/p>\n<p><strong>易错：<\/strong> 不要把 tool call parse rate 叫 task success rate。<\/p><\/div><\/details>"}</script>
<script id="data-q-A04" type="application/json">{"body":"### 办事过程中，要有一张可靠进度单\n\n记录用户目标、已经确认的条件、查到的事实、工具结果、待解决问题和已经执行的动作。这样重试时才能知道从哪里继续。\n\n尤其要把“打算退票”“正在请求退票”“已经退票成功”分开，否则模型的一句话可能被误当成已发生的事实。\n\n**直答：** 状态应区分计划、证据、待办和已完成动作，并保留来源与执行标识，支持检查、恢复和结束判断。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 用户目标、已知事实与来源、计划状态、工具输入输出、约束、错误、待解决问题和终态证据。\n\n**展开：** 状态应可序列化与恢复；大型文档可保存引用而非全部复制。工具副作用与会话文字分开记，避免模型压缩摘要时丢掉已经提交的操作。\n\n**追问：为什么记录版本？** 同样问题在不同模型、索引、工具和政策版本下行为可能不同，回放需要这些信息。\n\n**易错：** 一段自然语言总结通常不足以承担事务状态。","html":"<h3>办事过程中，要有一张可靠进度单<\/h3>\n<p>记录用户目标、已经确认的条件、查到的事实、工具结果、待解决问题和已经执行的动作。这样重试时才能知道从哪里继续。<\/p>\n<p>尤其要把“打算退票”“正在请求退票”“已经退票成功”分开，否则模型的一句话可能被误当成已发生的事实。<\/p>\n<p><strong>直答：<\/strong> 状态应区分计划、证据、待办和已完成动作，并保留来源与执行标识，支持检查、恢复和结束判断。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 用户目标、已知事实与来源、计划状态、工具输入输出、约束、错误、待解决问题和终态证据。<\/p>\n<p><strong>展开：<\/strong> 状态应可序列化与恢复；大型文档可保存引用而非全部复制。工具副作用与会话文字分开记，避免模型压缩摘要时丢掉已经提交的操作。<\/p>\n<p><strong>追问：为什么记录版本？<\/strong> 同样问题在不同模型、索引、工具和政策版本下行为可能不同，回放需要这些信息。<\/p>\n<p><strong>易错：<\/strong> 一段自然语言总结通常不足以承担事务状态。<\/p><\/div><\/details>"}</script>
<script id="data-q-A05" type="application/json">{"body":"### 没收到回执，不等于事情没办成\n\n退款请求发出后超时，可能根本没执行，也可能钱已退、只是回执丢了。立即重新退款，可能重复操作。\n\n可靠恢复先用请求标识查询状态，再决定继续等待或安全重试。不同错误需要不同处理。\n\n**直答：** 超时后先判断执行状态是否未知，查询并核对业务结果；涉及写入时不能把所有失败都当作可直接重试。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 先区分临时失败、参数错误、权限问题与执行状态未知，再选重试、修正、替代或升级处理。\n\n**展开：** 只读请求可采用有上限退避；写入请求超时后先查状态，再决定是否重试。记录尝试次数、错误类型和剩余预算。\n\n**追问：为什么执行状态未知最麻烦？** 请求可能已成功但响应丢失，直接重试可能重复提交。使用幂等键或业务唯一标识可减少重复副作用。\n\n**易错：** 模型生成“重试一下”不是可靠重试策略。","html":"<h3>没收到回执，不等于事情没办成<\/h3>\n<p>退款请求发出后超时，可能根本没执行，也可能钱已退、只是回执丢了。立即重新退款，可能重复操作。<\/p>\n<p>可靠恢复先用请求标识查询状态，再决定继续等待或安全重试。不同错误需要不同处理。<\/p>\n<p><strong>直答：<\/strong> 超时后先判断执行状态是否未知，查询并核对业务结果；涉及写入时不能把所有失败都当作可直接重试。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 先区分临时失败、参数错误、权限问题与执行状态未知，再选重试、修正、替代或升级处理。<\/p>\n<p><strong>展开：<\/strong> 只读请求可采用有上限退避；写入请求超时后先查状态，再决定是否重试。记录尝试次数、错误类型和剩余预算。<\/p>\n<p><strong>追问：为什么执行状态未知最麻烦？<\/strong> 请求可能已成功但响应丢失，直接重试可能重复提交。使用幂等键或业务唯一标识可减少重复副作用。<\/p>\n<p><strong>易错：<\/strong> 模型生成“重试一下”不是可靠重试策略。<\/p><\/div><\/details>"}</script>
<script id="data-q-A06" type="application/json">{"body":"### 同一张单据提交两次，应只办一次\n\n幂等的意思是同一操作重复提交，结果不会重复叠加，比如同一退款单不会退两遍。事务要求一组操作按约定整体完成或处理失败；回滚尝试撤销已经发生的改变。\n\n并非所有现实动作都能撤销。因此设计工具时，要把确认、重复请求和补偿处理考虑进去。\n\n**直答：** Agent 会重试也会中断，必须依靠幂等、事务或补偿规则控制重复与半完成状态，不能只靠模型记住“别重复”。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** Agent 能修改外部状态后，可靠性必须满足业务系统的基本一致性要求。\n\n**展开：** 幂等让同一逻辑请求重复执行不产生额外副作用；事务使相关更新按一致规则提交；无法原地回滚的动作需补偿流程。关键状态检查应由程序执行。\n\n**追问：多工具操作如何保证原子性？** 跨系统通常难有单数据库事务，可用状态机、步骤记录和补偿，并说明不可逆步骤边界。\n\n**易错：** 在提示词中要求“不要重复”不能替代幂等实现。","html":"<h3>同一张单据提交两次，应只办一次<\/h3>\n<p>幂等的意思是同一操作重复提交，结果不会重复叠加，比如同一退款单不会退两遍。事务要求一组操作按约定整体完成或处理失败；回滚尝试撤销已经发生的改变。<\/p>\n<p>并非所有现实动作都能撤销。因此设计工具时，要把确认、重复请求和补偿处理考虑进去。<\/p>\n<p><strong>直答：<\/strong> Agent 会重试也会中断，必须依靠幂等、事务或补偿规则控制重复与半完成状态，不能只靠模型记住“别重复”。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> Agent 能修改外部状态后，可靠性必须满足业务系统的基本一致性要求。<\/p>\n<p><strong>展开：<\/strong> 幂等让同一逻辑请求重复执行不产生额外副作用；事务使相关更新按一致规则提交；无法原地回滚的动作需补偿流程。关键状态检查应由程序执行。<\/p>\n<p><strong>追问：多工具操作如何保证原子性？<\/strong> 跨系统通常难有单数据库事务，可用状态机、步骤记录和补偿，并说明不可逆步骤边界。<\/p>\n<p><strong>易错：<\/strong> 在提示词中要求“不要重复”不能替代幂等实现。<\/p><\/div><\/details>"}</script>
<script id="data-q-A07" type="application/json">{"body":"### 说“已经完成”和真的完成，是两个分数\n\n用户要求改到明天的航班，助手回复“已改签”，但系统仍是今天的机票，任务就没成功。\n\n评价应检查预订记录、日期、费用和必要约束，而不只是最后一句话听起来是否正确。\n\n**直答：** 用可核验的最终业务状态和约束定义成功，把对话质量与任务实际完成分别评分。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 核验最终环境是否达到目标，且过程未违反关键策略；不能只看最终回复。\n\n**展开：** 退票任务需核对订单状态、退款额、权限与必要确认。即使目标终态正确，越权查询或违反业务规则也应单独记风险。\n\n**追问：用户模拟器可靠吗？** 它会引入行为偏差；固定版本、场景和随机性，并辅以人工回放或真实匿名案例。\n\n**易错：** 把“我已为您退票”当成功标签，会奖励虚假完成。依据：S31。","html":"<h3>说“已经完成”和真的完成，是两个分数<\/h3>\n<p>用户要求改到明天的航班，助手回复“已改签”，但系统仍是今天的机票，任务就没成功。<\/p>\n<p>评价应检查预订记录、日期、费用和必要约束，而不只是最后一句话听起来是否正确。<\/p>\n<p><strong>直答：<\/strong> 用可核验的最终业务状态和约束定义成功，把对话质量与任务实际完成分别评分。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 核验最终环境是否达到目标，且过程未违反关键策略；不能只看最终回复。<\/p>\n<p><strong>展开：<\/strong> 退票任务需核对订单状态、退款额、权限与必要确认。即使目标终态正确，越权查询或违反业务规则也应单独记风险。<\/p>\n<p><strong>追问：用户模拟器可靠吗？<\/strong> 它会引入行为偏差；固定版本、场景和随机性，并辅以人工回放或真实匿名案例。<\/p>\n<p><strong>易错：<\/strong> 把“我已为您退票”当成功标签，会奖励虚假完成。依据：<a class=\"ref\" href=\"#source-S31\">S31<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-A08" type="application/json">{"body":"### 一次演示成功，可能只是碰巧走对了\n\n同一道任务重复运行，模型可能选不同工具、不同步骤，也会遇到不同响应。一次完成不足以说明长期可靠。\n\n应多次运行并统计成功、成本和失败类型，尤其观察涉及写入、恢复与复杂分支的任务。\n\n**直答：** Agent 评测需要重复运行来估计行为稳定性；平均成功率之外，还要看任务级反复成功和严重错误。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 模型采样、工具时延、环境反馈和用户互动会让同一任务产生不同轨迹。\n\n**展开：** 分别报单次成功率、重复成功可靠性、平均/尾部步数、恢复率、成本和 policy violation。固定模型后增加解码 seed，不冒充训练 seed。\n\n**追问：一次成功的演示能证明什么？** 证明存在一条成功路径，不证明系统稳定。可用 pass^k 补充可靠性观察。\n\n**易错：** 不要筛掉超时或失败样本后才计算成功率。依据：S31。","html":"<h3>一次演示成功，可能只是碰巧走对了<\/h3>\n<p>同一道任务重复运行，模型可能选不同工具、不同步骤，也会遇到不同响应。一次完成不足以说明长期可靠。<\/p>\n<p>应多次运行并统计成功、成本和失败类型，尤其观察涉及写入、恢复与复杂分支的任务。<\/p>\n<p><strong>直答：<\/strong> Agent 评测需要重复运行来估计行为稳定性；平均成功率之外，还要看任务级反复成功和严重错误。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 模型采样、工具时延、环境反馈和用户互动会让同一任务产生不同轨迹。<\/p>\n<p><strong>展开：<\/strong> 分别报单次成功率、重复成功可靠性、平均/尾部步数、恢复率、成本和 policy violation。固定模型后增加解码 seed，不冒充训练 seed。<\/p>\n<p><strong>追问：一次成功的演示能证明什么？<\/strong> 证明存在一条成功路径，不证明系统稳定。可用 pass^k 补充可靠性观察。<\/p>\n<p><strong>易错：<\/strong> 不要筛掉超时或失败样本后才计算成功率。依据：<a class=\"ref\" href=\"#source-S31\">S31<\/a>。<\/p><\/div><\/details>"}</script>
