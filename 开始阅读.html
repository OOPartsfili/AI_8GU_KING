<script id="data-q-J04" type="application/json">{"body":"### 一份失败案例，应像一次故障诊断\n\n不要只说“模型答错了”。先展示输入和错误，再解释怀疑原因，做一个能区分原因的小对照，最后验证修复是否帮助了独立新案例。\n\n例如补上被截断的上文后恢复正确，是定位上下文问题的一条证据，仍需检查其他可能影响。\n\n**直答：** 用失败表现、定位证据、修复措施和独立回归串起案例，说明自己怎样从错误找到可验证的原因。\n\n### 进一步：公式、边界与追问\n\n**回答骨架：** 用输入机制→失败表现→定位证据→修复→独立回归的顺序。\n\n**展开：** 例如“跨轮信息被截断导致漏检”仅是可用案例类型，需换成本人真实样本。展示截断前后和上下文消融，说明是数据处理、模型理解还是策略阈值问题。\n\n**追问答案：** “修复会不会误伤？”加入同机制正常近邻。“为什么不直接加规则？”说明规则覆盖范围与不可泛化边界，可把规则作为对照或应急措施。\n\n**易错：** “增加数据后解决了”缺少机制和独立验证，难以证明知道原因。","html":"<h3>一份失败案例，应像一次故障诊断<\/h3>\n<p>不要只说“模型答错了”。先展示输入和错误，再解释怀疑原因，做一个能区分原因的小对照，最后验证修复是否帮助了独立新案例。<\/p>\n<p>例如补上被截断的上文后恢复正确，是定位上下文问题的一条证据，仍需检查其他可能影响。<\/p>\n<p><strong>直答：<\/strong> 用失败表现、定位证据、修复措施和独立回归串起案例，说明自己怎样从错误找到可验证的原因。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>回答骨架：<\/strong> 用输入机制→失败表现→定位证据→修复→独立回归的顺序。<\/p>\n<p><strong>展开：<\/strong> 例如“跨轮信息被截断导致漏检”仅是可用案例类型，需换成本人真实样本。展示截断前后和上下文消融，说明是数据处理、模型理解还是策略阈值问题。<\/p>\n<p><strong>追问答案：<\/strong> “修复会不会误伤？”加入同机制正常近邻。“为什么不直接加规则？”说明规则覆盖范围与不可泛化边界，可把规则作为对照或应急措施。<\/p>\n<p><strong>易错：<\/strong> “增加数据后解决了”缺少机制和独立验证，难以证明知道原因。<\/p><\/div><\/details>"}</script>
<script id="data-q-J05" type="application/json">{"body":"### 三个库接起来以后，最难的问题在哪里？\n\n选一个必须联合两库证据的问题，展示最初漏了什么、怎样改检索或排序、如何证明证据找全了。\n\n这样能让面试官看见算法判断：候选为什么选、指标怎么定、失败怎么修，而不只是服务接口连通。\n\n**直答：** 用真实跨库问题说明路由、检索、重排和证据评测中的个人决策，并提供相同条件下的对照。\n\n### 进一步：公式、边界与追问\n\n**回答骨架：** 围绕跨库路由、证据匹配、重排、冲突处理和归因评测讲。\n\n**展开：** 给三个库的类型/边界及典型跨库问题；建立需哪些证据的 gold 标签；比较 BM25、向量、混合与 rerank；记录各阶段 recall 和最终忠实性、完整性。\n\n**追问答案：** “加 rerank 提升多少？”提供候选池相同的对照。“没做过定量评测？”如实说明已实现链路、目前缺少哪类评测，并给出可执行补强方案。\n\n**证据：** 解析样例、路由矩阵、gold evidence、召回日志、引用核对和时延分解。","html":"<h3>三个库接起来以后，最难的问题在哪里？<\/h3>\n<p>选一个必须联合两库证据的问题，展示最初漏了什么、怎样改检索或排序、如何证明证据找全了。<\/p>\n<p>这样能让面试官看见算法判断：候选为什么选、指标怎么定、失败怎么修，而不只是服务接口连通。<\/p>\n<p><strong>直答：<\/strong> 用真实跨库问题说明路由、检索、重排和证据评测中的个人决策，并提供相同条件下的对照。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>回答骨架：<\/strong> 围绕跨库路由、证据匹配、重排、冲突处理和归因评测讲。<\/p>\n<p><strong>展开：<\/strong> 给三个库的类型/边界及典型跨库问题；建立需哪些证据的 gold 标签；比较 BM25、向量、混合与 rerank；记录各阶段 recall 和最终忠实性、完整性。<\/p>\n<p><strong>追问答案：<\/strong> “加 rerank 提升多少？”提供候选池相同的对照。“没做过定量评测？”如实说明已实现链路、目前缺少哪类评测，并给出可执行补强方案。<\/p>\n<p><strong>证据：<\/strong> 解析样例、路由矩阵、gold evidence、召回日志、引用核对和时延分解。<\/p><\/div><\/details>"}</script>
<script id="data-q-J06" type="application/json">{"body":"### 框架帮你管理流程，你还做了哪些判断？\n\n举一次工具超时或中断后的恢复，说明哪些状态被保存、哪条分支被触发、何时安全结束。然后区分框架现成功能与自己实现的业务逻辑。\n\n“不用框架能不能做”可以从维护、调试和适配成本回答，不必把框架说成唯一选择。\n\n**直答：** 用状态流转和恢复实例说明框架的作用，再如实说明自己写的逻辑、评测与改进。\n\n### 进一步：公式、边界与追问\n\n**回答骨架：** 它承载了有状态执行、条件分支和恢复管理；价值要由任务完成和可维护性证明。\n\n**展开：** 画出简洁状态图，并说明每个节点的输入输出、不变量、失败处理和终止条件。不要把框架提供的能力都说成个人原创。\n\n**追问答案：** “不用框架能做吗？”可以，比较自建状态机的维护成本与现成框架适配性。“Agent 比固定流程好吗？”同任务预算比较，不预设答案。\n\n**易错：** tool calling 演示与完整业务闭环不是同一完成度。","html":"<h3>框架帮你管理流程，你还做了哪些判断？<\/h3>\n<p>举一次工具超时或中断后的恢复，说明哪些状态被保存、哪条分支被触发、何时安全结束。然后区分框架现成功能与自己实现的业务逻辑。<\/p>\n<p>“不用框架能不能做”可以从维护、调试和适配成本回答，不必把框架说成唯一选择。<\/p>\n<p><strong>直答：<\/strong> 用状态流转和恢复实例说明框架的作用，再如实说明自己写的逻辑、评测与改进。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>回答骨架：<\/strong> 它承载了有状态执行、条件分支和恢复管理；价值要由任务完成和可维护性证明。<\/p>\n<p><strong>展开：<\/strong> 画出简洁状态图，并说明每个节点的输入输出、不变量、失败处理和终止条件。不要把框架提供的能力都说成个人原创。<\/p>\n<p><strong>追问答案：<\/strong> “不用框架能做吗？”可以，比较自建状态机的维护成本与现成框架适配性。“Agent 比固定流程好吗？”同任务预算比较，不预设答案。<\/p>\n<p><strong>易错：<\/strong> tool calling 演示与完整业务闭环不是同一完成度。<\/p><\/div><\/details>"}</script>
<script id="data-q-J07" type="application/json">{"body":"### 平台的价值，是让错误更容易被发现和追查\n\n例如模型总分没变，某个安全类别却退步。平台如果能定位版本、题目、生成参数和评审记录，就能帮助团队及时发现回归。\n\n介绍时用一个真实“发现—定位—复现”的过程，比列页面和按钮更有说服力。\n\n**直答：** 说明平台怎样统一比较条件、发现问题并重跑验证，再用具体案例展示个人贡献。\n\n### 进一步：公式、边界与追问\n\n**回答骨架：** “统一数据快照、执行配置、评分协议和结果归档，让多个模型版本可比较、可追踪、能发现回归。”\n\n**展开：** 说明批量调度、失败重试、去重、日志、结果汇总和异常标记；展示一个总分不变但某类退化被平台发现的真实案例。\n\n**追问答案：** “judge 不靠谱怎么办？”人工黄金集、盲评顺序随机化、分维度评分和仲裁。“平台创新在哪里？”按实际贡献回答协议、故障归因或成本优化，不虚构底层框架。\n\n**证据：** 版本对比报告、任务配置、异常日志、复现步骤、阈值选择依据。","html":"<h3>平台的价值，是让错误更容易被发现和追查<\/h3>\n<p>例如模型总分没变，某个安全类别却退步。平台如果能定位版本、题目、生成参数和评审记录，就能帮助团队及时发现回归。<\/p>\n<p>介绍时用一个真实“发现—定位—复现”的过程，比列页面和按钮更有说服力。<\/p>\n<p><strong>直答：<\/strong> 说明平台怎样统一比较条件、发现问题并重跑验证，再用具体案例展示个人贡献。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>回答骨架：<\/strong> “统一数据快照、执行配置、评分协议和结果归档，让多个模型版本可比较、可追踪、能发现回归。”<\/p>\n<p><strong>展开：<\/strong> 说明批量调度、失败重试、去重、日志、结果汇总和异常标记；展示一个总分不变但某类退化被平台发现的真实案例。<\/p>\n<p><strong>追问答案：<\/strong> “judge 不靠谱怎么办？”人工黄金集、盲评顺序随机化、分维度评分和仲裁。“平台创新在哪里？”按实际贡献回答协议、故障归因或成本优化，不虚构底层框架。<\/p>\n<p><strong>证据：<\/strong> 版本对比报告、任务配置、异常日志、复现步骤、阈值选择依据。<\/p><\/div><\/details>"}</script>
<script id="data-q-J08" type="application/json">{"body":"### 把会的方法说清楚，也把新领域的差异说清楚\n\n人因研究处理隐藏意图、行为不确定性和连续决策，这些经验可以帮助理解 Agent 状态和驾驶 VLM 可靠性。\n\n但相关经验不等于已经做过 VLA 训练。可以选择一个小型视觉干预或行为评测课题，把迁移能力变成实际证据。\n\n**直答：** 先指出可迁移的建模和实验方法，再说明领域差异与补强计划，用真实工作证明连接。\n\n### 进一步：公式、边界与追问\n\n**回答骨架：** “两类工作都把人的行为或偏好转成学习信号，并用部署相关指标评估高风险决策。”\n\n**展开：** 人因研究的隐变量、POMDP、EM 和可解释规则，连接 Agent 的部分可观测状态、记忆和长链路评测；驾驶视觉注意连接 VLM grounding 和危险行为分析。\n\n**追问答案：** “直接能做 VLA 训练吗？”说明相关能力与尚缺工程证据，建议用可靠性小课题证明迁移。“论文自己贡献什么？”准备问题定义、算法推导、实验与协作边界。\n\n**易错：** 不说两个领域完全一样，说明可迁移方法与必须补的差异。","html":"<h3>把会的方法说清楚，也把新领域的差异说清楚<\/h3>\n<p>人因研究处理隐藏意图、行为不确定性和连续决策，这些经验可以帮助理解 Agent 状态和驾驶 VLM 可靠性。<\/p>\n<p>但相关经验不等于已经做过 VLA 训练。可以选择一个小型视觉干预或行为评测课题，把迁移能力变成实际证据。<\/p>\n<p><strong>直答：<\/strong> 先指出可迁移的建模和实验方法，再说明领域差异与补强计划，用真实工作证明连接。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>回答骨架：<\/strong> “两类工作都把人的行为或偏好转成学习信号，并用部署相关指标评估高风险决策。”<\/p>\n<p><strong>展开：<\/strong> 人因研究的隐变量、POMDP、EM 和可解释规则，连接 Agent 的部分可观测状态、记忆和长链路评测；驾驶视觉注意连接 VLM grounding 和危险行为分析。<\/p>\n<p><strong>追问答案：<\/strong> “直接能做 VLA 训练吗？”说明相关能力与尚缺工程证据，建议用可靠性小课题证明迁移。“论文自己贡献什么？”准备问题定义、算法推导、实验与协作边界。<\/p>\n<p><strong>易错：<\/strong> 不说两个领域完全一样，说明可迁移方法与必须补的差异。<\/p><\/div><\/details>"}</script>
<script id="data-q-J09" type="application/json">{"body":"### 可以会讲原理，但不要把阅读说成训练经历\n\n清楚说明已做过 SFT/DPO、理解了 GRPO 的哪些机制，能展示哪些 CPU 教学验证；真正的大模型训练如果没做，就提供具体复现方案。\n\n这样面试官才能区分你的当前能力与学习计划，也更容易展开有意义的追问。\n\n**直答：** 如实区分理解、教学实现和实际训练，用可展示的内容证明已有基础，再给出能执行的补强步骤。\n\n### 进一步：公式、边界与追问\n\n**回答骨架：** “我理解组内优势、采样更新和主要失效，实际经验目前在 SFT/DPO；可以说明复现方案与需要验证的点。”\n\n**展开：** 先讲清 RL06–RL14，再给小模型可执行任务的实验设计：SFT 基线、验证器单测、固定 rollout 预算、组大小消融、熵/长度/成本指标。\n\n**追问答案：** “会不会只是看论文？”承认已做与未做，用实际运行的 CPU 核心计算说明理解，用真实 GPU 日志支撑未来复现。\n\n**易错：** 不把本知识库中的教学代码称为大模型 GRPO 训练项目。","html":"<h3>可以会讲原理，但不要把阅读说成训练经历<\/h3>\n<p>清楚说明已做过 SFT/DPO、理解了 GRPO 的哪些机制，能展示哪些 CPU 教学验证；真正的大模型训练如果没做，就提供具体复现方案。<\/p>\n<p>这样面试官才能区分你的当前能力与学习计划，也更容易展开有意义的追问。<\/p>\n<p><strong>直答：<\/strong> 如实区分理解、教学实现和实际训练，用可展示的内容证明已有基础，再给出能执行的补强步骤。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>回答骨架：<\/strong> “我理解组内优势、采样更新和主要失效，实际经验目前在 SFT/DPO；可以说明复现方案与需要验证的点。”<\/p>\n<p><strong>展开：<\/strong> 先讲清 <a class=\"ref\" href=\"#q-RL06\">RL06<\/a>–<a class=\"ref\" href=\"#q-RL14\">RL14<\/a>，再给小模型可执行任务的实验设计：SFT 基线、验证器单测、固定 rollout 预算、组大小消融、熵/长度/成本指标。<\/p>\n<p><strong>追问答案：<\/strong> “会不会只是看论文？”承认已做与未做，用实际运行的 CPU 核心计算说明理解，用真实 GPU 日志支撑未来复现。<\/p>\n<p><strong>易错：<\/strong> 不把本知识库中的教学代码称为大模型 GRPO 训练项目。<\/p><\/div><\/details>"}</script>
<script id="data-q-J10" type="application/json">{"body":"### 一条简历，读完应知道做了什么、凭什么相信\n\n先写动作和对象，再写关键方法、结果及测量条件。比如“改进检索”还应说明改了哪一步、对什么问题有效、用什么独立指标测。\n\n没有真实数字就写已完成范围，不必为了句子漂亮加入“显著”“首创”等无法支撑的词。\n\n**直答：** 用具体动作、对象、方法、结果口径和证据写项目条目，确保每个成果词都有实际依据。\n\n### 进一步：公式、边界与追问\n\n**回答骨架：** 动作＋对象/规模＋关键方法＋明确口径结果＋可验证条件。\n\n**展开：** 可编辑模板：“针对___任务，负责___数据/算法环节，采用___；在___冻结集与___约束下，___从___到___，并通过___对照定位收益，成本为___。”没有真实结果的字段不要硬填。\n\n**追问答案：** “你认为最弱的证据是什么？”指出尚缺的独立测试、资源记录或消融，并给补齐优先级。\n\n**易错：** “主导、首创、显著提升”都需要对应职责、先例和统计证据。\n\n## 个人证据登记表\n\n| 证据 | 当前已知 | 使用前确认 |\n|---|---|---|\n| 内容安全数据 | 报告称约 2 万、24 类 | 来源、样本单位、去重与版本 |\n| SFT+DPO | 报告称已完成 | 模型、配置、职责、训练日志 |\n| 79%→96% | 报告明确指 precision | 召回、阈值、测试集、人工环节 |\n| 三知识库/LangGraph | 报告描述已有工程 | 数据类型、工具、任务终态与基准 |\n| ICCV/人因论文专利 | 报告中描述 | 原论文、作者贡献、专利状态 |\n\n这张表刻意不填不存在的细节；它让后续补证据有明确入口。","html":"<h3>一条简历，读完应知道做了什么、凭什么相信<\/h3>\n<p>先写动作和对象，再写关键方法、结果及测量条件。比如“改进检索”还应说明改了哪一步、对什么问题有效、用什么独立指标测。<\/p>\n<p>没有真实数字就写已完成范围，不必为了句子漂亮加入“显著”“首创”等无法支撑的词。<\/p>\n<p><strong>直答：<\/strong> 用具体动作、对象、方法、结果口径和证据写项目条目，确保每个成果词都有实际依据。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>回答骨架：<\/strong> 动作＋对象/规模＋关键方法＋明确口径结果＋可验证条件。<\/p>\n<p><strong>展开：<\/strong> 可编辑模板：“针对<strong><em>任务，负责<\/em><\/strong>数据/算法环节，采用<strong><em>；在<\/em><\/strong>冻结集与<strong><em>约束下，<\/em><\/strong>从<strong><em>到<\/em><\/strong>，并通过<strong><em>对照定位收益，成本为<\/em><\/strong>。”没有真实结果的字段不要硬填。<\/p>\n<p><strong>追问答案：<\/strong> “你认为最弱的证据是什么？”指出尚缺的独立测试、资源记录或消融，并给补齐优先级。<\/p>\n<p><strong>易错：<\/strong> “主导、首创、显著提升”都需要对应职责、先例和统计证据。<\/p>\n<h2>个人证据登记表<\/h2>\n<table>\n<thead>\n<tr>\n<th>证据<\/th>\n<th>当前已知<\/th>\n<th>使用前确认<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>内容安全数据<\/td>\n<td>报告称约 2 万、24 类<\/td>\n<td>来源、样本单位、去重与版本<\/td>\n<\/tr>\n<tr>\n<td>SFT+DPO<\/td>\n<td>报告称已完成<\/td>\n<td>模型、配置、职责、训练日志<\/td>\n<\/tr>\n<tr>\n<td>79%→96%<\/td>\n<td>报告明确指 precision<\/td>\n<td>召回、阈值、测试集、人工环节<\/td>\n<\/tr>\n<tr>\n<td>三知识库/LangGraph<\/td>\n<td>报告描述已有工程<\/td>\n<td>数据类型、工具、任务终态与基准<\/td>\n<\/tr>\n<tr>\n<td>ICCV/人因论文专利<\/td>\n<td>报告中描述<\/td>\n<td>原论文、作者贡献、专利状态<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>这张表刻意不填不存在的细节；它让后续补证据有明确入口。<\/p><\/div><\/details>"}</script>
<script id="data-q-C01" type="application/json">{"body":"### 先把用户的一条内容送完整个流程\n\n内容进来，做必要预处理，再由规则或模型判断风险；低风险放行、高风险处理、不确定的进一步审核。所有阶段记录足够信息，便于发现漏放与误拒。\n\n设计前先问清处理文本还是生成输出、延迟要求和人工能力，再决定模型。\n\n**直答：** 从输入、风险决策、复核、反馈和监测设计全流程，用双侧错误与资源约束选择组件。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 用分层检测和可复核决策，把输入、输出、会话与工具链风险串起来。\n\n**设计：** 原始输入保留→规范化与低成本筛选→上下文分类/生成审核→阈值决策→必要复核→版本回流。标签政策、会话状态和审核证据可追踪。\n\n**指标：** 固定召回下 precision、关键类召回、正常响应、复核比例、端到端延迟和成本。\n\n**追问与取舍：** 高峰时不要无差别关闭安全环节；可降低非关键采样开销、优先处理高风险、扩容或限制流量。具体策略需符合业务约束。\n\n**验证：** 冻结测试、未见变体、多轮拆分、正常近邻、模块失效注入。对应 SA01–SA12。","html":"<h3>先把用户的一条内容送完整个流程<\/h3>\n<p>内容进来，做必要预处理，再由规则或模型判断风险；低风险放行、高风险处理、不确定的进一步审核。所有阶段记录足够信息，便于发现漏放与误拒。<\/p>\n<p>设计前先问清处理文本还是生成输出、延迟要求和人工能力，再决定模型。<\/p>\n<p><strong>直答：<\/strong> 从输入、风险决策、复核、反馈和监测设计全流程，用双侧错误与资源约束选择组件。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 用分层检测和可复核决策，把输入、输出、会话与工具链风险串起来。<\/p>\n<p><strong>设计：<\/strong> 原始输入保留→规范化与低成本筛选→上下文分类/生成审核→阈值决策→必要复核→版本回流。标签政策、会话状态和审核证据可追踪。<\/p>\n<p><strong>指标：<\/strong> 固定召回下 precision、关键类召回、正常响应、复核比例、端到端延迟和成本。<\/p>\n<p><strong>追问与取舍：<\/strong> 高峰时不要无差别关闭安全环节；可降低非关键采样开销、优先处理高风险、扩容或限制流量。具体策略需符合业务约束。<\/p>\n<p><strong>验证：<\/strong> 冻结测试、未见变体、多轮拆分、正常近邻、模块失效注入。对应 <a class=\"ref\" href=\"#q-SA01\">SA01<\/a>–<a class=\"ref\" href=\"#q-SA12\">SA12<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-C02" type="application/json">{"body":"### 用户问的不是“搜三个库”，而是“得到有依据的答案”\n\n先识别问题需要哪些知识库，找到条款及适用条件，核对版本和冲突，再组织带支持证据的回答。找不齐证据时要有明确处理方式。\n\n用单库、跨库、过期和冲突问题分别检查，才能看出设计是否完整。\n\n**直答：** 围绕证据需求设计路由、检索、重排和回答，配套版本管理、缺失处理及逐阶段评测。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 按知识边界、权限和时效做路由，检索可引用证据，实时事实用工具查询。\n\n**设计：** 文档解析保留条款/表头/生效期→多索引→单库或多库召回→重排去重→证据冲突处理→引用回答或澄清。订单状态不用静态文档猜。\n\n**指标：** 路由召回、证据 recall、claim 支持/覆盖、正确拒答、引用有效与 p95 延迟。\n\n**追问与取舍：** 小知识库可先全上下文基线；复杂层级与图检索仅在多跳问题证明收益后加入。\n\n**验证：** 文档更新、权限隔离、空检索、表格单位、跨库冲突和误导文档。对应 R01–R14。","html":"<h3>用户问的不是“搜三个库”，而是“得到有依据的答案”<\/h3>\n<p>先识别问题需要哪些知识库，找到条款及适用条件，核对版本和冲突，再组织带支持证据的回答。找不齐证据时要有明确处理方式。<\/p>\n<p>用单库、跨库、过期和冲突问题分别检查，才能看出设计是否完整。<\/p>\n<p><strong>直答：<\/strong> 围绕证据需求设计路由、检索、重排和回答，配套版本管理、缺失处理及逐阶段评测。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 按知识边界、权限和时效做路由，检索可引用证据，实时事实用工具查询。<\/p>\n<p><strong>设计：<\/strong> 文档解析保留条款/表头/生效期→多索引→单库或多库召回→重排去重→证据冲突处理→引用回答或澄清。订单状态不用静态文档猜。<\/p>\n<p><strong>指标：<\/strong> 路由召回、证据 recall、claim 支持/覆盖、正确拒答、引用有效与 p95 延迟。<\/p>\n<p><strong>追问与取舍：<\/strong> 小知识库可先全上下文基线；复杂层级与图检索仅在多跳问题证明收益后加入。<\/p>\n<p><strong>验证：<\/strong> 文档更新、权限隔离、空检索、表格单位、跨库冲突和误导文档。对应 <a class=\"ref\" href=\"#q-R01\">R01<\/a>–<a class=\"ref\" href=\"#q-R14\">R14<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-C03" type="application/json">{"body":"### 先确认需求，再查选项，最后执行并核对\n\n退改签涉及日期、旅客、价格和实际订单变化。查询阶段与执行阶段要分开，按既定权限和确认规则推进；超时后查询订单状态，避免重复修改。\n\n最后从预订系统核对结果，不把助手的成功话术当作完成证明。\n\n**直答：** 用明确状态和工具权限组织查询、确认、执行、恢复与核验，并用实际订单终态评测。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 用模型理解目标与查询证据，用受约束工具和状态机执行关键业务变更。\n\n**设计：** 确认用户意图与必要信息→查订单与规则→计算方案→满足业务确认条件→执行幂等操作→核对最终状态。退款金额使用确定性计算或可靠服务。\n\n**指标：** 合法终态成功、策略违规、重复操作、恢复率、工具步数与成本。\n\n**追问与取舍：** 写入超时先查状态，不盲目重试；跨系统失败用补偿流程和人工升级。工具返回不能修改上层权限。\n\n**验证：** 重复请求、响应丢失、规则变化、权限不足、用户中途变更目标。对应 A03–A08。","html":"<h3>先确认需求，再查选项，最后执行并核对<\/h3>\n<p>退改签涉及日期、旅客、价格和实际订单变化。查询阶段与执行阶段要分开，按既定权限和确认规则推进；超时后查询订单状态，避免重复修改。<\/p>\n<p>最后从预订系统核对结果，不把助手的成功话术当作完成证明。<\/p>\n<p><strong>直答：<\/strong> 用明确状态和工具权限组织查询、确认、执行、恢复与核验，并用实际订单终态评测。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 用模型理解目标与查询证据，用受约束工具和状态机执行关键业务变更。<\/p>\n<p><strong>设计：<\/strong> 确认用户意图与必要信息→查订单与规则→计算方案→满足业务确认条件→执行幂等操作→核对最终状态。退款金额使用确定性计算或可靠服务。<\/p>\n<p><strong>指标：<\/strong> 合法终态成功、策略违规、重复操作、恢复率、工具步数与成本。<\/p>\n<p><strong>追问与取舍：<\/strong> 写入超时先查状态，不盲目重试；跨系统失败用补偿流程和人工升级。工具返回不能修改上层权限。<\/p>\n<p><strong>验证：<\/strong> 重复请求、响应丢失、规则变化、权限不足、用户中途变更目标。对应 <a class=\"ref\" href=\"#q-A03\">A03<\/a>–<a class=\"ref\" href=\"#q-A08\">A08<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-C04" type="application/json">{"body":"### 同一批教材，比较三种教学方法\n\n先选定共同基座和数据来源，再说明哪些数据能构造成对偏好、哪些是单条标签；固定主要计算预算，比较质量、长度、遗忘和资源。\n\n不能让某方法额外获得大量优质反馈，却把收益全部归到损失公式上。\n\n**直答：** 控制模型、数据和预算，记录反馈转换与实现差异，联合评估任务质量和成本，才能解释方法之间的差异。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 固定数据与初始能力，分别比较各方法可用的反馈与总资源下的收益。\n\n**设计：** 冻结 SFT checkpoint 和评测；偏好对用于 DPO/SimPO，KTO 的二值反馈定义明确；加入继续 SFT 基线。记录超参数搜索预算和参考概率计算成本。\n\n**指标：** 安全双侧质量、偏好胜率、通用能力、长度、显存与 GPU 时。\n\n**追问与取舍：** KTO 若使用更多独立标签，分开报告“同数据量方法对比”与“业务可用数据方案对比”。\n\n**验证：** 标签噪声、长度控制、数据来源、多个训练 seed 或如实报告资源限制。对应 P01–P16。","html":"<h3>同一批教材，比较三种教学方法<\/h3>\n<p>先选定共同基座和数据来源，再说明哪些数据能构造成对偏好、哪些是单条标签；固定主要计算预算，比较质量、长度、遗忘和资源。<\/p>\n<p>不能让某方法额外获得大量优质反馈，却把收益全部归到损失公式上。<\/p>\n<p><strong>直答：<\/strong> 控制模型、数据和预算，记录反馈转换与实现差异，联合评估任务质量和成本，才能解释方法之间的差异。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 固定数据与初始能力，分别比较各方法可用的反馈与总资源下的收益。<\/p>\n<p><strong>设计：<\/strong> 冻结 SFT checkpoint 和评测；偏好对用于 DPO/SimPO，KTO 的二值反馈定义明确；加入继续 SFT 基线。记录超参数搜索预算和参考概率计算成本。<\/p>\n<p><strong>指标：<\/strong> 安全双侧质量、偏好胜率、通用能力、长度、显存与 GPU 时。<\/p>\n<p><strong>追问与取舍：<\/strong> KTO 若使用更多独立标签，分开报告“同数据量方法对比”与“业务可用数据方案对比”。<\/p>\n<p><strong>验证：<\/strong> 标签噪声、长度控制、数据来源、多个训练 seed 或如实报告资源限制。对应 <a class=\"ref\" href=\"#q-P01\">P01<\/a>–<a class=\"ref\" href=\"#q-P16\">P16<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-C05" type="application/json">{"body":"### 预算少，就把验证做扎实、把题目缩小\n\n选一个能可靠判结果的窄任务，先让 SFT 基线跑通，再确认奖励程序会拒绝典型假成功。然后用少量训练观察优势、长度和真实正确率。\n\n目标是验证一条机制，不是靠一次小实验宣称普遍结论。\n\n**直答：** 从可靠验证器、窄任务和固定采样预算开始，建立基线、监控与停止条件，优先证明训练信号有效。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 选有明确可执行验证的小任务，先证实验证器和基线，再逐步引入在线探索。\n\n**设计：** 小模型/小数据→SFT baseline→奖励函数边界单测→少量 rollout 检查→训练→独立评测。先用可控算术或格式化计算，避免一开始依赖昂贵复杂环境。\n\n**指标：** pass@1、多次覆盖、平均长度、有效优势组、熵、验证器失败、每成功题成本。\n\n**追问与取舍：** 如全组全错，先查验证器和难度，再调探索，不只增加训练步数。\n\n**验证：** 隐藏模板、不可解析答案、截断、重复答案和投机输出。对应 RL08–RL15。","html":"<h3>预算少，就把验证做扎实、把题目缩小<\/h3>\n<p>选一个能可靠判结果的窄任务，先让 SFT 基线跑通，再确认奖励程序会拒绝典型假成功。然后用少量训练观察优势、长度和真实正确率。<\/p>\n<p>目标是验证一条机制，不是靠一次小实验宣称普遍结论。<\/p>\n<p><strong>直答：<\/strong> 从可靠验证器、窄任务和固定采样预算开始，建立基线、监控与停止条件，优先证明训练信号有效。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 选有明确可执行验证的小任务，先证实验证器和基线，再逐步引入在线探索。<\/p>\n<p><strong>设计：<\/strong> 小模型/小数据→SFT baseline→奖励函数边界单测→少量 rollout 检查→训练→独立评测。先用可控算术或格式化计算，避免一开始依赖昂贵复杂环境。<\/p>\n<p><strong>指标：<\/strong> pass@1、多次覆盖、平均长度、有效优势组、熵、验证器失败、每成功题成本。<\/p>\n<p><strong>追问与取舍：<\/strong> 如全组全错，先查验证器和难度，再调探索，不只增加训练步数。<\/p>\n<p><strong>验证：<\/strong> 隐藏模板、不可解析答案、截断、重复答案和投机输出。对应 <a class=\"ref\" href=\"#q-RL08\">RL08<\/a>–<a class=\"ref\" href=\"#q-RL15\">RL15<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-C06" type="application/json">{"body":"### 让每次考试都有试卷版本、考场规则和成绩依据\n\n平台保存数据快照、模型配置、生成结果、评分版本和错误日志；重跑能知道比较的条件是否一致。\n\n还要把执行失败与模型答错分开。网络请求没成功，不应悄悄算成普通零分或从总数里消失。\n\n**直答：** 用版本化任务和结果记录建立可重跑评测，清楚处理失败、评分、汇总与回归定位。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 将数据、执行和评分版本化，保留轨迹与可重跑配置，让回归可定位。\n\n**设计：** 数据注册→任务清单→队列与资源调度→执行结果→评分器→人工抽查→差异报告。失败也存档，重试记录不覆盖原始尝试。\n\n**指标：** 平台执行成功、结果一致、可复现、评测时长/成本；模型质量指标单独计算。\n\n**追问与取舍：** 数据集更新后可双跑新旧快照；judge 更新不能静默覆盖历史评分。\n\n**验证：** 中断恢复、重复任务、评分解析失败、工具版本变更与配对差异。对应 E05–E14。","html":"<h3>让每次考试都有试卷版本、考场规则和成绩依据<\/h3>\n<p>平台保存数据快照、模型配置、生成结果、评分版本和错误日志；重跑能知道比较的条件是否一致。<\/p>\n<p>还要把执行失败与模型答错分开。网络请求没成功，不应悄悄算成普通零分或从总数里消失。<\/p>\n<p><strong>直答：<\/strong> 用版本化任务和结果记录建立可重跑评测，清楚处理失败、评分、汇总与回归定位。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 将数据、执行和评分版本化，保留轨迹与可重跑配置，让回归可定位。<\/p>\n<p><strong>设计：<\/strong> 数据注册→任务清单→队列与资源调度→执行结果→评分器→人工抽查→差异报告。失败也存档，重试记录不覆盖原始尝试。<\/p>\n<p><strong>指标：<\/strong> 平台执行成功、结果一致、可复现、评测时长/成本；模型质量指标单独计算。<\/p>\n<p><strong>追问与取舍：<\/strong> 数据集更新后可双跑新旧快照；judge 更新不能静默覆盖历史评分。<\/p>\n<p><strong>验证：<\/strong> 中断恢复、重复任务、评分解析失败、工具版本变更与配对差异。对应 <a class=\"ref\" href=\"#q-E05\">E05<\/a>–<a class=\"ref\" href=\"#q-E14\">E14<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-C07" type="application/json">{"body":"### 用户要求两秒开始回复，先把两秒花在哪里算清楚\n\n把排队、输入处理、检索或工具调用、首个 token 生成拆开，给各阶段预算。再按典型输入长度和并发压测。\n\n批处理和缓存可能提高吞吐，也可能改变等待；不要只优化平均值而忽略最慢一批用户。\n\n**直答：** 按端到端延迟预算设计调度、缓存和模型服务，用目标负载下的首字、后续速度和尾延迟验收。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 基于输入/输出长度与到达分布测容量，平衡模型选择、批处理、KV 和服务等级。\n\n**设计：** 请求校验/路由→队列→模型 worker→流式输出；优先复用公共前缀，控制最大输出和重试，按实际硬件选择并行/量化。\n\n**指标：** TTFT、TPOT、p95/p99、成功率、有效吞吐、每成功请求成本和 KV 峰值。\n\n**追问与取舍：** 牺牲一点吞吐换低尾延迟可能更符合交互任务；离线批作业可以另一套调度。\n\n**验证：** 冷启动、长短混合、突发流量、cache miss 和 OOM 恢复。对应 I01–I12。","html":"<h3>用户要求两秒开始回复，先把两秒花在哪里算清楚<\/h3>\n<p>把排队、输入处理、检索或工具调用、首个 token 生成拆开，给各阶段预算。再按典型输入长度和并发压测。<\/p>\n<p>批处理和缓存可能提高吞吐，也可能改变等待；不要只优化平均值而忽略最慢一批用户。<\/p>\n<p><strong>直答：<\/strong> 按端到端延迟预算设计调度、缓存和模型服务，用目标负载下的首字、后续速度和尾延迟验收。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 基于输入/输出长度与到达分布测容量，平衡模型选择、批处理、KV 和服务等级。<\/p>\n<p><strong>设计：<\/strong> 请求校验/路由→队列→模型 worker→流式输出；优先复用公共前缀，控制最大输出和重试，按实际硬件选择并行/量化。<\/p>\n<p><strong>指标：<\/strong> TTFT、TPOT、p95/p99、成功率、有效吞吐、每成功请求成本和 KV 峰值。<\/p>\n<p><strong>追问与取舍：<\/strong> 牺牲一点吞吐换低尾延迟可能更符合交互任务；离线批作业可以另一套调度。<\/p>\n<p><strong>验证：<\/strong> 冷启动、长短混合、突发流量、cache miss 和 OOM 恢复。对应 <a class=\"ref\" href=\"#q-I01\">I01<\/a>–<a class=\"ref\" href=\"#q-I12\">I12<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-C08" type="application/json">{"body":"### 问“看到什么”，也问“据此建议会不会危险”\n\n固定驾驶问题，改变关键视觉证据，例如交通灯或障碍位置，检查回答是否随证据合理变化；再分类记录危险建议、遗漏和过度谨慎。\n\n开环图像问答只能证明相应范围，连续控制可靠性还需要对应闭环验证。\n\n**直答：** 用受控视觉干预与风险分类评测驾驶 VLM，保持问题、证据和评分可追踪，并明确评测的部署边界。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 用可解释的图像干预和任务分层，分开测视觉理解、语言解释与动作建议。\n\n**设计：** 明确对象/关系/风险标签→构造干净、损坏、缺图、替图与文本冲突条件→固定模型提示→逐 claim 和危险行为评价→人工审查。\n\n**指标：** grounding 依赖、关键对象召回、解释支持、危险建议率、校准与时延。\n\n**追问与取舍：** 删除图像是诊断干预，不能代替所有真实传感器故障；分布外鲁棒性要覆盖实际噪声。\n\n**验证：** 按道路场景而非相邻帧切分，避免视频近重复；未做闭环时不声称驾驶安全已验证。对应 V03–V15。","html":"<h3>问“看到什么”，也问“据此建议会不会危险”<\/h3>\n<p>固定驾驶问题，改变关键视觉证据，例如交通灯或障碍位置，检查回答是否随证据合理变化；再分类记录危险建议、遗漏和过度谨慎。<\/p>\n<p>开环图像问答只能证明相应范围，连续控制可靠性还需要对应闭环验证。<\/p>\n<p><strong>直答：<\/strong> 用受控视觉干预与风险分类评测驾驶 VLM，保持问题、证据和评分可追踪，并明确评测的部署边界。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 用可解释的图像干预和任务分层，分开测视觉理解、语言解释与动作建议。<\/p>\n<p><strong>设计：<\/strong> 明确对象/关系/风险标签→构造干净、损坏、缺图、替图与文本冲突条件→固定模型提示→逐 claim 和危险行为评价→人工审查。<\/p>\n<p><strong>指标：<\/strong> grounding 依赖、关键对象召回、解释支持、危险建议率、校准与时延。<\/p>\n<p><strong>追问与取舍：<\/strong> 删除图像是诊断干预，不能代替所有真实传感器故障；分布外鲁棒性要覆盖实际噪声。<\/p>\n<p><strong>验证：<\/strong> 按道路场景而非相邻帧切分，避免视频近重复；未做闭环时不声称驾驶安全已验证。对应 <a class=\"ref\" href=\"#q-V03\">V03<\/a>–<a class=\"ref\" href=\"#q-V15\">V15<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-doc-d8ec9a00bfd" type="application/json">{"html":"<h1>大模型算法面试知识库<\/h1>\n<p><strong>面向 2026 秋招｜版本 1.5 · Transformer 手写与算法可视化｜资料核查基准日：2026-09-16<\/strong><\/p>\n<p>这套资料服务于四条岗位主线：<strong>后训练与内容安全、Agent/RAG 算法、模型评测与平台、自动驾驶人因与 VLM/VLA 可靠性<\/strong>。基础、训练与推理工程作为共同底座。核心目标是：能讲清原理、比较条件、写出关键计算、解释实验，并把已有项目转成可信证据。<\/p>\n<h2>从这里开始<\/h2>\n<p>双击同目录的 <strong>开始阅读.html<\/strong>，即可离线搜索、按章节阅读、展开追问并记录复习进度。也可以直接用任意 Markdown 编辑器阅读正文。<\/p>\n<p>阅读器已做加载优化：内嵌本地题库按需解析，点击题目才加载正文，展开深读才渲染公式；长列表优先绘制屏幕内的内容。仍是一个可双击使用的 HTML 文件，无需安装数据库或启动服务，原复习进度继续使用。<\/p>\n<p><strong>从 GitHub 下载：<\/strong> 在 <a href=\"https://github.com/OOPartsfili/AI_8GU_KING\">AI_8GU_KING 仓库<\/a> 点击 <strong>Code → Download ZIP<\/strong>，解压后双击“开始阅读.html”。也可以用 <code>git clone https://github.com/OOPartsfili/AI_8GU_KING.git<\/code> 获取项目。阅读无需安装 Python；运行实验和重建时再按对应说明准备环境。仓库包含学习内容、源码和校验工具；个人岗位背景原始报告、开发环境、历史备份及临时文件只保留在本地。<\/p>\n<p>当前内容：<strong>21 个知识章节、341 道固定编号问题、20 道入门题、48 道口述核心题、135 条一手来源、3 场模拟面试<\/strong>。全部题目已增加具体场景与白话回答，数学基础重点补齐交叉熵、熵、KL 和梯度的教学例子。详细推导和边界放在可展开的深读部分。<\/p>\n<p>本次新增 <strong>Transformer 手写 22 步（<a class=\"ref\" href=\"#q-TH01\">TH01<\/a>—<a class=\"ref\" href=\"#q-TH22\">TH22<\/a>）<\/strong>：从形状、单头注意力、mask、多头、归一化和 FFN，逐渐拼成 Pre-LN 小语言模型及 Encoder–Decoder，再做训练、生成、KV Cache 与现代部件。配套可运行 PyTorch 实现、19 项数值/行为测试，以及 8 个按需加载的交互可视化。顶部可直接进入教程与可视化。<\/p>\n<p>此前新增 <strong>36 道 Agent 实战与前沿题（<a class=\"ref\" href=\"#q-AG01\">AG01<\/a>—<a class=\"ref\" href=\"#q-AG36\">AG36<\/a>）<\/strong>，与 <a class=\"ref\" href=\"#q-A01\">A01<\/a>—<a class=\"ref\" href=\"#q-A14\">A14<\/a> 组成 <strong>Agent 50 题教程<\/strong>：系统与工具 → 上下文与记忆 → 长期任务 → 训练与评测 → 岗位项目。阅读器有 Agent 专属入口、12 题入门路线，以及可逐步点击的订单执行演示。配套 8 项 CPU 故障与对照实验。<\/p>\n<p>继续保留此前专题：<\/p>\n<ul>\n<li><strong>蒸馏 34 题（<a class=\"ref\" href=\"#q-KD01\">KD01<\/a>—<a class=\"ref\" href=\"#q-KD34\">KD34<\/a>）<\/strong>：从经典 KD 到 OPD、OPSD、MOPD、SDPO、EOPD、U-OPSD；另设 OPD 家族 10 题快捷入口。<\/li>\n<li><strong>后训练进阶 8 题（<a class=\"ref\" href=\"#q-HP01\">HP01<\/a>—<a class=\"ref\" href=\"#q-HP08\">HP08<\/a>）<\/strong>：DAPO / Dr. GRPO、GSPO、SAPO、GDPO、VESPO，按它们要解决的训练问题比较。<\/li>\n<li><strong>预训练 20 题（<a class=\"ref\" href=\"#q-PT01\">PT01<\/a>—<a class=\"ref\" href=\"#q-PT20\">PT20<\/a>）<\/strong>：从下一 token 预测、数据和 tokenizer，到训练预算、优化、混合精度、MTP、长上下文及评测。<\/li>\n<\/ul>\n<p>延续“先举例，再讲原理”的结构，配有 CPU 数值练习和小模型实验设计。新研究注明版本与验证范围；较新不代表对所有任务最好。长公式可在公式区域横向滚动。<\/p>\n<h2>如何读<\/h2>\n<ol>\n<li><strong>新人先走“20 题”路线<\/strong>，或读“00_导读/新人从这里开始.md”。想弄懂交叉熵与 KL，可以直接打开 <a class=\"ref\" href=\"#q-M02\">M02<\/a>。<\/li>\n<li>每题先读场景和例子，试着换个数字或对象再解释一遍，然后读“直答”。<\/li>\n<li>在阅读器里点“我已读懂例子，继续看公式、边界与追问”再加深。也可以切到“完整阅读”，一次显示全部内容。<\/li>\n<li>遇到 token、logits、梯度、策略等词，先查“术语翻译小词表”。读完整个入门路线，再按岗位深入。<\/li>\n<li>P0/P1/P2 表示岗位优先级，不是理解难度。48 道核心题适合建立直觉后的口述复习。<\/li>\n<li>教学例子用于理解方法，不代表个人经历或实际大模型训练成绩；个人项目数字仍需日志支持。<\/li>\n<\/ol>\n<h2>内容结构<\/h2>\n<table>\n<thead>\n<tr>\n<th>目录<\/th>\n<th>用途<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>00_导读<\/td>\n<td>新人路线、术语翻译、岗位地图、题目索引与速查<\/td>\n<\/tr>\n<tr>\n<td>01_知识主线<\/td>\n<td>数学基础到后训练、可靠性、系统工程和多模态<\/td>\n<\/tr>\n<tr>\n<td>02_项目与面试<\/td>\n<td>项目深挖、系统设计、模拟面试与回答评分<\/td>\n<\/tr>\n<tr>\n<td>03_代码实验<\/td>\n<td>可在 CPU 运行的核心计算与验证；GPU 实验设计<\/td>\n<\/tr>\n<tr>\n<td>90_维护与来源<\/td>\n<td>来源登记、更新规范、校验工具、变更记录与原始背景报告<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>内容约定<\/h2>\n<ul>\n<li><strong>事实<\/strong>：原论文或官方文档支持的方法定义、明确条件下的结果。<\/li>\n<li><strong>教学推导<\/strong>：从已注明的定义演算，保留假设与单位。<\/li>\n<li><strong>工程建议<\/strong>：需要在自己的数据、预算与硬件上验证的选择。<\/li>\n<li><strong>研究观察<\/strong>：已检索到的新研究；不等同于成熟方案或已复现结论。<\/li>\n<li><strong>个人背景<\/strong>：根据用户提供的报告整理，实际面试仍以本人日志与材料为准。<\/li>\n<\/ul>\n<p>原报告是岗位背景依据；其中论文名称、会议状态与技术结论在引用时另行核查。对尚未核实的背景数字，不新增或编造细节。<\/p>\n<h2>维护原则<\/h2>\n<p>Markdown 是正文唯一编辑源；每题使用固定编号。来源和题目索引分开维护，版本与核查日期可追踪。新增研究须说明它改变了哪一题的答案、在什么条件下成立，以及如何验证，避免只堆论文名称。<\/p>\n<p>完成范围见“90_维护与来源/验收记录.md”；后续修改按“维护规范.md”执行。运行“验证与重建.ps1”可重新生成阅读器与索引。<\/p>"}</script>
<script id="data-doc-d6d4593bc70" type="application/json">{"html":"<h1>新人从这里开始<\/h1>\n<p>这套资料现在先教你看懂，再帮助你准备面试。第一遍不用背公式，也不用一次记住所有缩写。每题先读例子，能用自己的话解释发生了什么，再看一句“直答”；想继续研究时，展开公式与追问。<\/p>\n<h2>先建立一张地图：一个模型是怎样变成助手的？<\/h2>\n<h3>1. 先会接着写<\/h3>\n<p>输入“我喝了一杯”，模型给下一块文字分配概率。大量文本训练，让它逐渐熟悉语言、知识表达和一些解题模式。这是理解语言模型的起点，见 <a class=\"ref\" href=\"#q-M01\">M01<\/a>。<\/p>\n<h3>2. 再知道什么叫“这次学得不好”<\/h3>\n<p>实际答案是“水”，模型却几乎不给“水”概率，就需要扣分。扣分规则叫损失，交叉熵是常见的一种。参数更新让平均损失逐渐下降。先读 <a class=\"ref\" href=\"#q-M04\">M04<\/a>、<a class=\"ref\" href=\"#q-M09\">M09<\/a>、<a class=\"ref\" href=\"#q-M02\">M02<\/a>，再读 <a class=\"ref\" href=\"#q-M05\">M05<\/a>、<a class=\"ref\" href=\"#q-M07\">M07<\/a>。<\/p>\n<h3>3. 给它更清楚的作答示范<\/h3>\n<p>会续写，不等于会按用户要求办事。SFT 用“问题—示范回答”教它怎样回答；LoRA 是减少一部分训练开销的更新方式。先读 <a class=\"ref\" href=\"#q-SFT01\">SFT01<\/a>、<a class=\"ref\" href=\"#q-SFT03\">SFT03<\/a>。<\/p>\n<h3>4. 再学会在多个回答里偏向更好的<\/h3>\n<p>同题两个回答，一份更好、一份较差，可以提供偏好反馈。DPO、SimPO 等方法据此改变生成倾向。能自己尝试并可靠评分时，还可以用强化学习。先读 <a class=\"ref\" href=\"#q-P01\">P01<\/a>、<a class=\"ref\" href=\"#q-P06\">P06<\/a>、<a class=\"ref\" href=\"#q-P08\">P08<\/a>、<a class=\"ref\" href=\"#q-RL01\">RL01<\/a>、<a class=\"ref\" href=\"#q-RL06\">RL06<\/a>。<\/p>\n<h3>5. 不知道就查，需要办事就调用工具<\/h3>\n<p>RAG 像开卷找资料；Agent 可以根据结果决定下一步动作。二者都有完整流程，模型只是其中一部分。先读 <a class=\"ref\" href=\"#q-R01\">R01<\/a>、<a class=\"ref\" href=\"#q-A01\">A01<\/a>。<\/p>\n<h3>6. 最后检查：真的更好了吗？<\/h3>\n<p>别只看训练扣分。还要看新题、真实用户任务、漏检误拒、响应时间和成本。<a class=\"ref\" href=\"#q-E01\">E01<\/a> 用坏苹果例子讲最常见的精确率和召回率。<\/p>\n<h2>第一轮只学这 20 题<\/h2>\n<table>\n<thead>\n<tr>\n<th>步骤<\/th>\n<th>题号<\/th>\n<th>学完只需做到<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>模型怎样预测<\/td>\n<td><a class=\"ref\" href=\"#q-M01\">M01<\/a>、<a class=\"ref\" href=\"#q-M04\">M04<\/a>、<a class=\"ref\" href=\"#q-M09\">M09<\/a><\/td>\n<td>解释 token、分数、概率和不确定性<\/td>\n<\/tr>\n<tr>\n<td>怎样打分与学习<\/td>\n<td><a class=\"ref\" href=\"#q-M02\">M02<\/a>、<a class=\"ref\" href=\"#q-M05\">M05<\/a>、<a class=\"ref\" href=\"#q-M07\">M07<\/a><\/td>\n<td>讲清交叉熵与 KL 的区别、更新往哪走<\/td>\n<\/tr>\n<tr>\n<td>怎样读上下文<\/td>\n<td><a class=\"ref\" href=\"#q-T01\">T01<\/a>、<a class=\"ref\" href=\"#q-T02\">T02<\/a>、<a class=\"ref\" href=\"#q-T05\">T05<\/a>、<a class=\"ref\" href=\"#q-T04\">T04<\/a><\/td>\n<td>讲清注意力、遮罩和 K/V 共享<\/td>\n<\/tr>\n<tr>\n<td>怎样教它回答<\/td>\n<td><a class=\"ref\" href=\"#q-SFT01\">SFT01<\/a>、<a class=\"ref\" href=\"#q-SFT03\">SFT03<\/a><\/td>\n<td>分清训练示范和减少可训练参数<\/td>\n<\/tr>\n<tr>\n<td>怎样学好坏<\/td>\n<td><a class=\"ref\" href=\"#q-P01\">P01<\/a>、<a class=\"ref\" href=\"#q-P06\">P06<\/a>、<a class=\"ref\" href=\"#q-P08\">P08<\/a><\/td>\n<td>分清偏好反馈、参考模型和 SimPO<\/td>\n<\/tr>\n<tr>\n<td>怎样自己尝试<\/td>\n<td><a class=\"ref\" href=\"#q-RL01\">RL01<\/a>、<a class=\"ref\" href=\"#q-RL06\">RL06<\/a><\/td>\n<td>把奖励和组内比较讲成一个过程<\/td>\n<\/tr>\n<tr>\n<td>怎样考、查、做<\/td>\n<td><a class=\"ref\" href=\"#q-E01\">E01<\/a>、<a class=\"ref\" href=\"#q-R01\">R01<\/a>、<a class=\"ref\" href=\"#q-A01\">A01<\/a><\/td>\n<td>分清指标、查资料和调用工具办事<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>这 20 题是理解入口，不是 20 道高频题的统计结论。可以分成 7 次学习，每次完成表格一行，不规定必须一天学完。<\/p>\n<p><strong>特别想弄懂交叉熵和 KL，直接从 <a class=\"ref\" href=\"#q-M02\">M02<\/a> 的红蓝球例子开始。<\/strong><\/p>\n<h2>每次怎样学，才不陷入背术语？<\/h2>\n<ol>\n<li>先说这个方法想解决什么麻烦。例如“答案太长，总概率受长度影响”。<\/li>\n<li>按自己的话复述例子，把数字或对象换一下。例如红球 80% 改成 50%，会发生什么？<\/li>\n<li>读“直答”，把例子收束成一句较正式的回答。<\/li>\n<li>有余力再展开“公式、边界与追问”。不理解的符号先查词表；未学过的前置概念先跳回去。<\/li>\n<li>第二天先不看答案，解释一次。解释卡住的地方，才是下一步要补的地方。<\/li>\n<\/ol>\n<p>P0/P1/P2 是原有岗位优先级，<strong>不表示理解难度，也不意味着新人必须立即全部会<\/strong>。第一轮完成后，再按目标岗位学习，最后用 48 道核心题做口述复习。<\/p>\n<h2>一个概念的“理解通过”标准<\/h2>\n<p>以交叉熵为例，你不必一开始就会求导，但应能回答：<\/p>\n<ul>\n<li>模型给实际答案 90% 和 10% 概率，哪次扣分更多？——10% 那次。<\/li>\n<li>已知红蓝球长期比例是 80/20，模型也报 80/20，还会每次都猜中吗？——不会，随机性仍然存在。<\/li>\n<li>两套概率相同，KL 为 0，为什么交叉熵未必为 0？——后者还包括结果本身的不确定性。<\/li>\n<li>KL 很小，是否已经证明模型安全？——没有，它只描述指定分布比较，具体行为仍需评测。<\/li>\n<\/ul>\n<p>能讲清这些，再进入公式推导，会比直接背定义更稳。<\/p>\n<h2>新增专题怎么接着学<\/h2>\n<p>理解交叉熵、KL 和 SFT 后，按需要选择：<\/p>\n<ul>\n<li><strong>蒸馏高级模型 / Agent 岗位：<\/strong><a class=\"ref\" href=\"#q-KD25\">KD25<\/a> → <a class=\"ref\" href=\"#q-KD27\">KD27<\/a> → <a class=\"ref\" href=\"#q-KD29\">KD29<\/a> → <a class=\"ref\" href=\"#q-KD34\">KD34<\/a>，先辨清 OPD、OPSD、MOPD；再读 <a class=\"ref\" href=\"#q-KD11\">KD11<\/a>、<a class=\"ref\" href=\"#q-KD14\">KD14<\/a>、<a class=\"ref\" href=\"#q-KD17\">KD17<\/a>、<a class=\"ref\" href=\"#q-KD21\">KD21<\/a> 的轨迹与评测。<\/li>\n<li><strong>预训练入门：<\/strong><a class=\"ref\" href=\"#q-PT01\">PT01<\/a> → <a class=\"ref\" href=\"#q-PT02\">PT02<\/a> → <a class=\"ref\" href=\"#q-PT05\">PT05<\/a> → <a class=\"ref\" href=\"#q-PT06\">PT06<\/a> → <a class=\"ref\" href=\"#q-PT08\">PT08<\/a> → <a class=\"ref\" href=\"#q-PT10\">PT10<\/a> → <a class=\"ref\" href=\"#q-PT11\">PT11<\/a> → <a class=\"ref\" href=\"#q-PT13\">PT13<\/a> → <a class=\"ref\" href=\"#q-PT17\">PT17<\/a> → <a class=\"ref\" href=\"#q-PT20\">PT20<\/a>，从训练样本走到实际训练过程。<\/li>\n<li><strong>后训练进阶：<\/strong><a class=\"ref\" href=\"#q-HP01\">HP01<\/a> → <a class=\"ref\" href=\"#q-HP02\">HP02<\/a> → <a class=\"ref\" href=\"#q-HP04\">HP04<\/a> → <a class=\"ref\" href=\"#q-HP08\">HP08<\/a>，再按瓶颈补 SAPO、VESPO 或 SDPO。先说清想解决的问题，再比较新方法。<\/li>\n<\/ul>\n<p>这些是入门 20 题之后的延伸路线，公式仍可按需展开。<\/p>\n<h2>Agent 从入门到实战（1.4）<\/h2>\n<p>阅读器的“Agent 50 题”集中展示 <a class=\"ref\" href=\"#q-A01\">A01<\/a>—<a class=\"ref\" href=\"#q-A14\">A14<\/a> 与 <a class=\"ref\" href=\"#q-AG01\">AG01<\/a>—<a class=\"ref\" href=\"#q-AG36\">AG36<\/a>。先点订单演示，试着解释为什么“执行结果未知”不能改写成失败；再进入“Agent 入门 12 题”。<\/p>\n<ul>\n<li><strong>要做项目：<\/strong><a class=\"ref\" href=\"#q-AG01\">AG01<\/a>—<a class=\"ref\" href=\"#q-AG12\">AG12<\/a> 理解系统与工具；<a class=\"ref\" href=\"#q-AG13\">AG13<\/a>—<a class=\"ref\" href=\"#q-AG21\">AG21<\/a> 补上下文、记忆、交接与协同；<a class=\"ref\" href=\"#q-AG31\">AG31<\/a>—<a class=\"ref\" href=\"#q-AG35\">AG35<\/a> 做评测和作品。<\/li>\n<li><strong>要做训练：<\/strong><a class=\"ref\" href=\"#q-AG25\">AG25<\/a>—<a class=\"ref\" href=\"#q-AG29\">AG29<\/a> 先讲轨迹、监督与环境；接着读 <a class=\"ref\" href=\"#q-KD25\">KD25<\/a>—<a class=\"ref\" href=\"#q-KD34\">KD34<\/a>，按教师与反馈条件选择蒸馏方案。<\/li>\n<li><strong>要跟进前沿：<\/strong><a class=\"ref\" href=\"#q-AG22\">AG22<\/a>—<a class=\"ref\" href=\"#q-AG24\">AG24<\/a> 区分不同记忆学习方法；<a class=\"ref\" href=\"#q-AG36\">AG36<\/a> 看训练与评测的 2026 阅读路线。先理解问题再追新缩写。<\/li>\n<\/ul>\n<p>建议带着“Agent 可靠性小实验”阅读，用具体状态和执行证据检查自己的解释。研究条目与工程主线可以分开学习，不必第一轮就读完全部论文。<\/p>\n<h2>想练 Transformer 手写<\/h2>\n<p>从 <a href=\"../01_知识主线/21_Transformer架构手写教学.md\">第 21 章<\/a> 的 <a class=\"ref\" href=\"#q-TH01\">TH01<\/a> 开始，按五次练习逐步完成。先预测张量形状和一个格子的数值，再操作可视化，最后手写并运行。<a class=\"ref\" href=\"#q-TH06\">TH06<\/a>、<a class=\"ref\" href=\"#q-TH10\">TH10<\/a>、<a class=\"ref\" href=\"#q-TH13\">TH13<\/a> 等节附逐行拆解；可以先跳过缓存，等基本前向写通再回来。阅读器顶部“算法可视化”提供 8 个小实验，每次只加载你打开的一个。<\/p>"}</script>
<script id="data-doc-d715c0c2f90" type="application/json">{"html":"<h1>术语翻译小词表<\/h1>\n<p>先看“可以怎样理解”，再跳到原题。比喻只负责帮你入门，具体条件以展开内容为准。字母 p、q、y 在不同公式里可能有不同角色，每次都要看本题定义。<\/p>\n<h2>看懂一次预测<\/h2>\n<table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>可以怎样理解<\/th>\n<th>去哪里看<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>token<\/td>\n<td>模型读写的一小块文字；不一定等于一个汉字或单词<\/td>\n<td><a class=\"ref\" href=\"#q-M01\">M01<\/a>、<a class=\"ref\" href=\"#q-T09\">T09<\/a><\/td>\n<\/tr>\n<tr>\n<td>tokenizer<\/td>\n<td>把文字切成 token 并映射到编号的工具<\/td>\n<td><a class=\"ref\" href=\"#q-T09\">T09<\/a><\/td>\n<\/tr>\n<tr>\n<td>概率分布<\/td>\n<td>把所有可能结果各分多少概率，合起来等于 1<\/td>\n<td><a class=\"ref\" href=\"#q-M01\">M01<\/a><\/td>\n<\/tr>\n<tr>\n<td>条件概率<\/td>\n<td>在已经知道某些信息后，一个结果出现的概率<\/td>\n<td><a class=\"ref\" href=\"#q-M01\">M01<\/a><\/td>\n<\/tr>\n<tr>\n<td>logits<\/td>\n<td>还没变成概率的原始分数，可正可负<\/td>\n<td><a class=\"ref\" href=\"#q-M04\">M04<\/a><\/td>\n<\/tr>\n<tr>\n<td>softmax<\/td>\n<td>把一组分数变成总和为 1 的概率<\/td>\n<td><a class=\"ref\" href=\"#q-M04\">M04<\/a><\/td>\n<\/tr>\n<tr>\n<td>log / ln<\/td>\n<td>对数；可把概率乘积转成加法。本资料通常用自然对数<\/td>\n<td><a class=\"ref\" href=\"#q-M01\">M01<\/a>、<a class=\"ref\" href=\"#q-M02\">M02<\/a><\/td>\n<\/tr>\n<tr>\n<td>负对数似然 NLL<\/td>\n<td>给实际出现结果的概率取 log，再加负号，作为扣分<\/td>\n<td><a class=\"ref\" href=\"#q-M02\">M02<\/a><\/td>\n<\/tr>\n<tr>\n<td>熵<\/td>\n<td>这套概率有多不确定；完全确定时为零<\/td>\n<td><a class=\"ref\" href=\"#q-M09\">M09<\/a>、<a class=\"ref\" href=\"#q-M02\">M02<\/a><\/td>\n<\/tr>\n<tr>\n<td>交叉熵<\/td>\n<td>用预测概率给实际结果计分时的平均扣分<\/td>\n<td><a class=\"ref\" href=\"#q-M02\">M02<\/a><\/td>\n<\/tr>\n<tr>\n<td>KL 散度<\/td>\n<td>用一套概率近似另一套概率时的额外代价，有方向<\/td>\n<td><a class=\"ref\" href=\"#q-M02\">M02<\/a>、<a class=\"ref\" href=\"#q-M03\">M03<\/a><\/td>\n<\/tr>\n<tr>\n<td>one-hot<\/td>\n<td>用一个 1 指出正确类别，其余位置为 0<\/td>\n<td><a class=\"ref\" href=\"#q-M05\">M05<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>看懂一次训练<\/h2>\n<table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>可以怎样理解<\/th>\n<th>去哪里看<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>参数 / 权重<\/td>\n<td>模型内部可以学习调整的数字<\/td>\n<td><a class=\"ref\" href=\"#q-M07\">M07<\/a>、<a class=\"ref\" href=\"#q-T13\">T13<\/a><\/td>\n<\/tr>\n<tr>\n<td>损失 loss<\/td>\n<td>用来衡量这次训练预测有多不好的一种扣分<\/td>\n<td><a class=\"ref\" href=\"#q-M02\">M02<\/a><\/td>\n<\/tr>\n<tr>\n<td>梯度<\/td>\n<td>参数或分数稍动时，损失怎样变化的局部信息<\/td>\n<td><a class=\"ref\" href=\"#q-M05\">M05<\/a><\/td>\n<\/tr>\n<tr>\n<td>反向传播<\/td>\n<td>从输出损失往前计算各参数梯度的方法<\/td>\n<td><a class=\"ref\" href=\"#q-M05\">M05<\/a>、<a class=\"ref\" href=\"#q-H01\">H01<\/a><\/td>\n<\/tr>\n<tr>\n<td>学习率<\/td>\n<td>根据梯度改参数时，更新幅度的系数<\/td>\n<td><a class=\"ref\" href=\"#q-M07\">M07<\/a><\/td>\n<\/tr>\n<tr>\n<td>batch<\/td>\n<td>一批一起计算的数据<\/td>\n<td><a class=\"ref\" href=\"#q-M08\">M08<\/a><\/td>\n<\/tr>\n<tr>\n<td>epoch<\/td>\n<td>按相应采样定义完整遍历一次训练数据<\/td>\n<td><a class=\"ref\" href=\"#q-SFT09\">SFT09<\/a><\/td>\n<\/tr>\n<tr>\n<td>checkpoint<\/td>\n<td>保存的模型或训练状态快照<\/td>\n<td><a class=\"ref\" href=\"#q-SFT10\">SFT10<\/a>、<a class=\"ref\" href=\"#q-X10\">X10<\/a><\/td>\n<\/tr>\n<tr>\n<td>activation / 激活<\/td>\n<td>网络计算过程中产生的中间表示<\/td>\n<td><a class=\"ref\" href=\"#q-I04\">I04<\/a>、<a class=\"ref\" href=\"#q-X03\">X03<\/a><\/td>\n<\/tr>\n<tr>\n<td>mask / 遮罩<\/td>\n<td>指定哪些位置不能被看见，或不参与某项计算的规则<\/td>\n<td><a class=\"ref\" href=\"#q-T05\">T05<\/a><\/td>\n<\/tr>\n<tr>\n<td>SFT<\/td>\n<td>用输入和示范输出训练模型按要求回答<\/td>\n<td><a class=\"ref\" href=\"#q-SFT01\">SFT01<\/a><\/td>\n<\/tr>\n<tr>\n<td>LoRA<\/td>\n<td>用小矩阵表示大权重的更新量，减少可训练参数<\/td>\n<td><a class=\"ref\" href=\"#q-SFT03\">SFT03<\/a><\/td>\n<\/tr>\n<tr>\n<td>基线 baseline<\/td>\n<td>用来判断新方法有无收益的比较起点<\/td>\n<td><a class=\"ref\" href=\"#q-D10\">D10<\/a>、<a class=\"ref\" href=\"#q-B08\">B08<\/a><\/td>\n<\/tr>\n<tr>\n<td>消融 ablation<\/td>\n<td>去掉或替换某部分，研究它贡献了什么<\/td>\n<td><a class=\"ref\" href=\"#q-E10\">E10<\/a><\/td>\n<\/tr>\n<tr>\n<td>泛化<\/td>\n<td>换成没见过的题，仍然能完成任务<\/td>\n<td><a class=\"ref\" href=\"#q-B07\">B07<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>看懂偏好与强化学习<\/h2>\n<table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>可以怎样理解<\/th>\n<th>去哪里看<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>policy / 策略<\/td>\n<td>在当前条件下选择各动作或 token 的概率规则<\/td>\n<td><a class=\"ref\" href=\"#q-RL01\">RL01<\/a><\/td>\n<\/tr>\n<tr>\n<td>rollout / 轨迹采样<\/td>\n<td>按策略实际做一次，记录选择和结果<\/td>\n<td><a class=\"ref\" href=\"#q-RL01\">RL01<\/a>、<a class=\"ref\" href=\"#q-RL15\">RL15<\/a><\/td>\n<\/tr>\n<tr>\n<td>reward / 奖励<\/td>\n<td>对结果或过程提供的评分；分数可能不可靠<\/td>\n<td><a class=\"ref\" href=\"#q-RL12\">RL12<\/a><\/td>\n<\/tr>\n<tr>\n<td>return / 回报<\/td>\n<td>按规定方式累计得到的奖励，可能包含时间折扣<\/td>\n<td><a class=\"ref\" href=\"#q-RL05\">RL05<\/a><\/td>\n<\/tr>\n<tr>\n<td>advantage / 优势<\/td>\n<td>这次选择的回报比某个基准好多少<\/td>\n<td><a class=\"ref\" href=\"#q-RL04\">RL04<\/a>、<a class=\"ref\" href=\"#q-RL06\">RL06<\/a><\/td>\n<\/tr>\n<tr>\n<td>actor<\/td>\n<td>负责选择动作、生成回答的模型<\/td>\n<td><a class=\"ref\" href=\"#q-RL03\">RL03<\/a><\/td>\n<\/tr>\n<tr>\n<td>critic<\/td>\n<td>估计当前状态后续回报的价值模型<\/td>\n<td><a class=\"ref\" href=\"#q-RL03\">RL03<\/a>、<a class=\"ref\" href=\"#q-RL05\">RL05<\/a><\/td>\n<\/tr>\n<tr>\n<td>reference<\/td>\n<td>固定参考策略，提供原有概率基准<\/td>\n<td><a class=\"ref\" href=\"#q-P06\">P06<\/a><\/td>\n<\/tr>\n<tr>\n<td>chosen / rejected<\/td>\n<td>同题较优回答 / 较差回答<\/td>\n<td><a class=\"ref\" href=\"#q-P02\">P02<\/a><\/td>\n<\/tr>\n<tr>\n<td>margin<\/td>\n<td>希望好坏之间拉开的间隔，单位要看公式<\/td>\n<td><a class=\"ref\" href=\"#q-P08\">P08<\/a><\/td>\n<\/tr>\n<tr>\n<td>sigmoid<\/td>\n<td>把实数映射到 0—1 的 S 形函数，两端逐渐变平<\/td>\n<td><a class=\"ref\" href=\"#q-P04\">P04<\/a>、<a class=\"ref\" href=\"#q-P17\">P17<\/a><\/td>\n<\/tr>\n<tr>\n<td>clip<\/td>\n<td>在指定目标中裁剪某个数的范围，不等于一切变化都被硬限制<\/td>\n<td><a class=\"ref\" href=\"#q-RL04\">RL04<\/a><\/td>\n<\/tr>\n<tr>\n<td>on-policy<\/td>\n<td>使用当前或按算法约定足够近的新策略采样的数据<\/td>\n<td><a class=\"ref\" href=\"#q-M11\">M11<\/a><\/td>\n<\/tr>\n<tr>\n<td>off-policy<\/td>\n<td>使用其他或较旧策略产生的数据<\/td>\n<td><a class=\"ref\" href=\"#q-M11\">M11<\/a><\/td>\n<\/tr>\n<tr>\n<td>KL 正则<\/td>\n<td>在目标中用分布偏离代价约束模型变化<\/td>\n<td><a class=\"ref\" href=\"#q-P03\">P03<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>看懂系统与评测<\/h2>\n<table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>可以怎样理解<\/th>\n<th>去哪里看<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>embedding / 向量表示<\/td>\n<td>把对象变成一组数字，便于学习和比较<\/td>\n<td><a class=\"ref\" href=\"#q-R04\">R04<\/a>、<a class=\"ref\" href=\"#q-B04\">B04<\/a><\/td>\n<\/tr>\n<tr>\n<td>召回（检索阶段）<\/td>\n<td>从大量资料中先找出一批可能有用的候选<\/td>\n<td><a class=\"ref\" href=\"#q-R02\">R02<\/a><\/td>\n<\/tr>\n<tr>\n<td>召回率（指标）<\/td>\n<td>真正需要找出的正例，有多少被找回<\/td>\n<td><a class=\"ref\" href=\"#q-E01\">E01<\/a><\/td>\n<\/tr>\n<tr>\n<td>rerank / 重排<\/td>\n<td>对召回的候选进一步排序<\/td>\n<td><a class=\"ref\" href=\"#q-R06\">R06<\/a><\/td>\n<\/tr>\n<tr>\n<td>grounding<\/td>\n<td>回答或判断与具体外部证据对应<\/td>\n<td><a class=\"ref\" href=\"#q-V03\">V03<\/a><\/td>\n<\/tr>\n<tr>\n<td>KV cache<\/td>\n<td>生成时保留历史键和值，减少重复计算<\/td>\n<td><a class=\"ref\" href=\"#q-I02\">I02<\/a><\/td>\n<\/tr>\n<tr>\n<td>prefill / decode<\/td>\n<td>处理已有输入 / 逐步生成新 token<\/td>\n<td><a class=\"ref\" href=\"#q-I01\">I01<\/a><\/td>\n<\/tr>\n<tr>\n<td>幂等<\/td>\n<td>同一操作重复提交，不重复叠加业务结果<\/td>\n<td><a class=\"ref\" href=\"#q-A06\">A06<\/a><\/td>\n<\/tr>\n<tr>\n<td>终态<\/td>\n<td>任务结束时可核验的实际系统状态<\/td>\n<td><a class=\"ref\" href=\"#q-A07\">A07<\/a><\/td>\n<\/tr>\n<tr>\n<td>分布漂移<\/td>\n<td>新数据的来源、特征或规则与以前发生变化<\/td>\n<td><a class=\"ref\" href=\"#q-SA11\">SA11<\/a><\/td>\n<\/tr>\n<tr>\n<td>冻结测试集<\/td>\n<td>比较期间固定内容和规则、避免随意调整的评测材料<\/td>\n<td><a class=\"ref\" href=\"#q-E11\">E11<\/a><\/td>\n<\/tr>\n<tr>\n<td>开环 / 闭环<\/td>\n<td>只评给定观测下的输出 / 让动作影响环境并持续反馈<\/td>\n<td><a class=\"ref\" href=\"#q-V08\">V08<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>遇到公式时，按这个顺序读<\/h2>\n<p>先找“输入是什么、想优化什么”；再找每个符号的含义；把求和看成“把各项加起来”，把期望看成“按相应概率求平均”；最后才看导数。<\/p>\n<p>读到 πθ(y|x)，可以先念成：“参数为 θ 的模型，在看到 x 后写出 y 的概率”。读到 E，可以先问：“这是对哪些题、哪些回答求平均？”<\/p>\n<h2>蒸馏与 Agent 新词<\/h2>\n<table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>先这样理解<\/th>\n<th>从哪读<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>教师 / 学生<\/td>\n<td>提供教学信号的模型 / 接受训练的模型<\/td>\n<td><a class=\"ref\" href=\"#q-KD01\">KD01<\/a><\/td>\n<\/tr>\n<tr>\n<td>软标签<\/td>\n<td>老师对多个候选的概率判断<\/td>\n<td><a class=\"ref\" href=\"#q-KD03\">KD03<\/a><\/td>\n<\/tr>\n<tr>\n<td>序列蒸馏<\/td>\n<td>把老师写出的完整文本作为训练目标<\/td>\n<td><a class=\"ref\" href=\"#q-KD05\">KD05<\/a><\/td>\n<\/tr>\n<tr>\n<td>on-policy<\/td>\n<td>数据由当前学习中的策略生成<\/td>\n<td><a class=\"ref\" href=\"#q-KD07\">KD07<\/a><\/td>\n<\/tr>\n<tr>\n<td>轨迹<\/td>\n<td>从任务开始到结束的动作和观察记录<\/td>\n<td><a class=\"ref\" href=\"#q-KD11\">KD11<\/a><\/td>\n<\/tr>\n<tr>\n<td>loss mask<\/td>\n<td>哪些目标位置参与直接计分<\/td>\n<td><a class=\"ref\" href=\"#q-KD11\">KD11<\/a><\/td>\n<\/tr>\n<tr>\n<td>复盘技能<\/td>\n<td>从做完的任务中总结的可复用指导<\/td>\n<td><a class=\"ref\" href=\"#q-KD15\">KD15<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>OPD 家族：先记老师从哪里来<\/h2>\n<table>\n<thead>\n<tr>\n<th>名称<\/th>\n<th>先这样理解<\/th>\n<th>从哪读<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>OPD<\/td>\n<td>学生自己做，老师沿学生实际走过的步骤指导<\/td>\n<td><a class=\"ref\" href=\"#q-KD25\">KD25<\/a>、<a class=\"ref\" href=\"#q-KD26\">KD26<\/a><\/td>\n<\/tr>\n<tr>\n<td>OPSD<\/td>\n<td>同一模型加上训练参考解，成为信息更多的自教师<\/td>\n<td><a class=\"ref\" href=\"#q-KD27\">KD27<\/a>、<a class=\"ref\" href=\"#q-KD28\">KD28<\/a><\/td>\n<\/tr>\n<tr>\n<td>MOPD<\/td>\n<td>不同问题向不同领域专家学，再整合成一个学生<\/td>\n<td><a class=\"ref\" href=\"#q-KD29\">KD29<\/a>、<a class=\"ref\" href=\"#q-KD30\">KD30<\/a><\/td>\n<\/tr>\n<tr>\n<td>SDPO<\/td>\n<td>把程序、工具等详细反馈交给自教师，重新评价原来的尝试<\/td>\n<td><a class=\"ref\" href=\"#q-KD31\">KD31<\/a><\/td>\n<\/tr>\n<tr>\n<td>EOPD<\/td>\n<td>保留 OPD，在老师不确定的位置额外加入正向 KL<\/td>\n<td><a class=\"ref\" href=\"#q-KD32\">KD32<\/a><\/td>\n<\/tr>\n<tr>\n<td>U-OPSD<\/td>\n<td>用多次回答的共识构造伪答案，再做自蒸馏；共识仍可能错<\/td>\n<td><a class=\"ref\" href=\"#q-KD33\">KD33<\/a><\/td>\n<\/tr>\n<tr>\n<td>stop-gradient / sg<\/td>\n<td>这次更新把该量当固定数；不等于模型永远不变<\/td>\n<td><a class=\"ref\" href=\"#q-KD26\">KD26<\/a>、<a class=\"ref\" href=\"#q-KD27\">KD27<\/a><\/td>\n<\/tr>\n<tr>\n<td>行为策略<\/td>\n<td>真正生成这条训练数据的策略<\/td>\n<td><a class=\"ref\" href=\"#q-HP06\">HP06<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>预训练：把一本书变成练习题<\/h2>\n<table>\n<thead>\n<tr>\n<th>名称<\/th>\n<th>先这样理解<\/th>\n<th>从哪读<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>NTP<\/td>\n<td>看前文，预测下一块文字<\/td>\n<td><a class=\"ref\" href=\"#q-PT01\">PT01<\/a>、<a class=\"ref\" href=\"#q-PT02\">PT02<\/a><\/td>\n<\/tr>\n<tr>\n<td>FIM<\/td>\n<td>先给前后两段，再让模型补中间；训练文本需要重排<\/td>\n<td><a class=\"ref\" href=\"#q-PT03\">PT03<\/a><\/td>\n<\/tr>\n<tr>\n<td>packing<\/td>\n<td>把短文装进训练块，提高有效内容比例<\/td>\n<td><a class=\"ref\" href=\"#q-PT06\">PT06<\/a><\/td>\n<\/tr>\n<tr>\n<td>DoReMi<\/td>\n<td>先用小模型探索各领域数据应该喂多少<\/td>\n<td><a class=\"ref\" href=\"#q-PT07\">PT07<\/a><\/td>\n<\/tr>\n<tr>\n<td>warmup<\/td>\n<td>初期逐步提高学习率，帮助训练平稳启动<\/td>\n<td><a class=\"ref\" href=\"#q-PT10\">PT10<\/a><\/td>\n<\/tr>\n<tr>\n<td>梯度累积<\/td>\n<td>多批分别计算，积累之后再更新一次参数<\/td>\n<td><a class=\"ref\" href=\"#q-PT11\">PT11<\/a><\/td>\n<\/tr>\n<tr>\n<td>MTP<\/td>\n<td>除了下一个位置，还练更远的未来 token<\/td>\n<td><a class=\"ref\" href=\"#q-PT15\">PT15<\/a><\/td>\n<\/tr>\n<tr>\n<td>mid-training<\/td>\n<td>基础训练与最终后训练之间的能力强化阶段，定义需看报告<\/td>\n<td><a class=\"ref\" href=\"#q-PT16\">PT16<\/a><\/td>\n<\/tr>\n<tr>\n<td>PPL / 困惑度<\/td>\n<td>从平均预测扣分换算出的指标，需要统一计分单位再比较<\/td>\n<td><a class=\"ref\" href=\"#q-PT17\">PT17<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Agent 实战新词<\/h2>\n<table>\n<thead>\n<tr>\n<th>术语<\/th>\n<th>先这样理解<\/th>\n<th>从哪读<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>harness<\/td>\n<td>让模型持续办事的运行程序：安排工具、上下文、恢复和预算<\/td>\n<td><a class=\"ref\" href=\"#q-AG01\">AG01<\/a>、<a class=\"ref\" href=\"#q-AG26\">AG26<\/a><\/td>\n<\/tr>\n<tr>\n<td>Function Calling<\/td>\n<td>模型写工具请求，应用实际执行并回传结果<\/td>\n<td><a class=\"ref\" href=\"#q-AG03\">AG03<\/a><\/td>\n<\/tr>\n<tr>\n<td>工具契约<\/td>\n<td>说明输入含义、返回证据、错误与副作用的约定<\/td>\n<td><a class=\"ref\" href=\"#q-AG04\">AG04<\/a><\/td>\n<\/tr>\n<tr>\n<td>MCP<\/td>\n<td>应用连接外部工具与资源的协议；行为要看版本<\/td>\n<td><a class=\"ref\" href=\"#q-AG05\">AG05<\/a><\/td>\n<\/tr>\n<tr>\n<td>A2A<\/td>\n<td>Agent 之间交换消息、任务状态和产物的协议<\/td>\n<td><a class=\"ref\" href=\"#q-AG06\">AG06<\/a><\/td>\n<\/tr>\n<tr>\n<td>程序化工具调用<\/td>\n<td>用代码组织循环、并行、调用与结果处理<\/td>\n<td><a class=\"ref\" href=\"#q-AG07\">AG07<\/a><\/td>\n<\/tr>\n<tr>\n<td>上下文工程<\/td>\n<td>决定模型下一步具体看见哪些材料<\/td>\n<td><a class=\"ref\" href=\"#q-AG13\">AG13<\/a><\/td>\n<\/tr>\n<tr>\n<td>工具发现<\/td>\n<td>先在目录中找候选，再读工具的完整说明<\/td>\n<td><a class=\"ref\" href=\"#q-AG14\">AG14<\/a><\/td>\n<\/tr>\n<tr>\n<td>Skill<\/td>\n<td>把一类任务的步骤、脚本和参考资料组成可复用手册<\/td>\n<td><a class=\"ref\" href=\"#q-AG19\">AG19<\/a><\/td>\n<\/tr>\n<tr>\n<td>检查点 / 交接包<\/td>\n<td>保存成果与运行状态 / 告诉接班者怎样继续<\/td>\n<td><a class=\"ref\" href=\"#q-AG18\">AG18<\/a><\/td>\n<\/tr>\n<tr>\n<td>参数记忆<\/td>\n<td>用训练更新参数保存信息，区别于检索外部笔记<\/td>\n<td><a class=\"ref\" href=\"#q-AG23\">AG23<\/a><\/td>\n<\/tr>\n<tr>\n<td>trace<\/td>\n<td>模型输入、调用、观察和状态变化组成的执行记录<\/td>\n<td><a class=\"ref\" href=\"#q-AG31\">AG31<\/a><\/td>\n<\/tr>\n<tr>\n<td>验收器<\/td>\n<td>检查任务真实结果是否满足要求的程序或评分过程<\/td>\n<td><a class=\"ref\" href=\"#q-AG29\">AG29<\/a>、<a class=\"ref\" href=\"#q-AG30\">AG30<\/a><\/td>\n<\/tr>\n<tr>\n<td>契约漂移<\/td>\n<td>接口或业务含义变了，旧 Agent 因此可能失效<\/td>\n<td><a class=\"ref\" href=\"#q-AG33\">AG33<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}</script>
<script id="data-doc-d6659a22bb4" type="application/json">{"html":"<h1>岗位地图与学习路线<\/h1>\n<h2>新人先走理解路线<\/h2>\n<p>第一次接触这些方法，先读“新人从这里开始.md”，完成 20 道入门题。本页的 7/14/30 天路线适合有基础后的岗位准备，不是要求新人按天赶完。先看例子、能用自己的话说清，再接受公式推导和项目追问。<\/p>\n<h2>你的四条主线<\/h2>\n<table>\n<thead>\n<tr>\n<th>主线<\/th>\n<th>应体现的能力<\/th>\n<th>重点章节<\/th>\n<th>最值得补的证据<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>后训练/内容安全<\/td>\n<td>把反馈变成训练目标，控制漏放和误拒<\/td>\n<td>04–09、项目 <a class=\"ref\" href=\"#q-J01\">J01<\/a>–<a class=\"ref\" href=\"#q-J04\">J04<\/a><\/td>\n<td>数据卡、DPO 对照、双侧评测和成本<\/td>\n<\/tr>\n<tr>\n<td>Agent/RAG 算法<\/td>\n<td>知识获取、工具执行、记忆和故障恢复<\/td>\n<td>09–11、<a class=\"ref\" href=\"#q-J05\">J05<\/a>–<a class=\"ref\" href=\"#q-J06\">J06<\/a><\/td>\n<td>证据级评测、终态基准与故障注入<\/td>\n<\/tr>\n<tr>\n<td>模型评测/AI 平台<\/td>\n<td>版本可比、统计可信、回归可定位<\/td>\n<td>09、12–13、<a class=\"ref\" href=\"#q-J07\">J07<\/a><\/td>\n<td>冻结快照、配对差异和可重跑报告<\/td>\n<\/tr>\n<tr>\n<td>驾驶人因/VLM 可靠性<\/td>\n<td>部分可观测建模、视觉证据和闭环评价<\/td>\n<td>14、<a class=\"ref\" href=\"#q-J08\">J08<\/a>、<a class=\"ref\" href=\"#q-C08\">C08<\/a><\/td>\n<td>图像干预、危险建议与本人论文贡献<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>这是基于已有报告的能力映射，不是实时岗位招聘清单。具体 JD、HC 与技术栈仍按投递时信息调整。<\/p>\n<h2>先修顺序<\/h2>\n<p>概率与梯度（01）→ 注意力与分词（02）→ 数据与 SFT（03–04）→ 偏好/强化学习（05–07）。<\/p>\n<p>评测统计（09）支撑所有方向；内容安全（08）、RAG（10）、Agent（11）可按岗位穿插。推理/分布式（12–13）提供成本与工程理解；驾驶（14）形成差异化；传统基线（15）与手撕（16）用于补齐短板。<\/p>\n<h2>每题怎么学<\/h2>\n<ol>\n<li><strong>30–60 秒：<\/strong> 用自己的话给结论，明确输入、输出和目标。<\/li>\n<li><strong>2–3 分钟：<\/strong> 补机制、公式或例子，解释关键条件。<\/li>\n<li><strong>5 分钟追问：<\/strong> 比较方案、指出失效、设计验证。<\/li>\n<li><strong>项目落地：<\/strong> 写下本人真实证据；没有则标实验计划。<\/li>\n<\/ol>\n<p>背诵不是逐字复述。判断掌握的标准是：换一个数据条件或预算，你还能给出合理答案。<\/p>\n<h2>七天冲刺：已有项目、面试临近<\/h2>\n<table>\n<thead>\n<tr>\n<th>天<\/th>\n<th>主任务<\/th>\n<th>当天验收<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>核对 <a class=\"ref\" href=\"#q-J01\">J01<\/a>–<a class=\"ref\" href=\"#q-J10\">J10<\/a>；读 M/T 核心<\/td>\n<td>两分钟介绍项目；手算 CE 与 attention 维度<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>SFT、LoRA、DPO<\/td>\n<td>推导 <a class=\"ref\" href=\"#q-P03\">P03<\/a>–<a class=\"ref\" href=\"#q-P05\">P05<\/a>；说清真实训练配置<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>SimPO/KTO/GRPO<\/td>\n<td>比较 <a class=\"ref\" href=\"#q-P11\">P11<\/a>；解释零优势和 reward hacking<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>安全与评测<\/td>\n<td>讲清 79%→96% 口径；设计双侧评测<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>RAG 与 Agent<\/td>\n<td>对真实失败逐层归因；讲超时恢复<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>工程/驾驶按岗位选<\/td>\n<td>KV 算例；视觉 grounding 或服务时延<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>一场 60 分钟模拟<\/td>\n<td>记录五个错误，修三项最关键证据<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>十四天巩固：每天约 1.5–3 小时<\/h2>\n<p>第 1–2 天数学与 Transformer；第 3 天数据；第 4 天 SFT/LoRA；第 5–6 天 DPO/SimPO/KTO；第 7 天 PPO/GRPO；第 8 天安全；第 9 天评测；第 10 天 RAG；第 11 天 Agent；第 12 天推理/分布式；第 13 天驾驶交叉或目标 JD 加深；第 14 天模拟与复盘。<\/p>\n<p>每天至少闭卷复述五题、做一个算例或错误分析，复习前一天的两道薄弱题。未完成时顺延，不把读完页数当掌握。<\/p>\n<h2>三十天形成岗位证据<\/h2>\n<table>\n<thead>\n<tr>\n<th>阶段<\/th>\n<th>阅读和实现<\/th>\n<th>可审查交付物<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>第 1 周<\/td>\n<td>建立理论主干；冻结数据切分；运行 CPU 练习<\/td>\n<td>题目学习记录、数据卡、基线定义<\/td>\n<\/tr>\n<tr>\n<td>第 2 周<\/td>\n<td>按一个主线做小规模对照<\/td>\n<td>训练/检索/Agent 配置、日志、真实结果<\/td>\n<\/tr>\n<tr>\n<td>第 3 周<\/td>\n<td>压力测试、消融、归因<\/td>\n<td>鲁棒性矩阵、错误类别、成本分解<\/td>\n<\/tr>\n<tr>\n<td>第 4 周<\/td>\n<td>阈值或方案选择；复现和面试<\/td>\n<td>一页项目总结、完整复现材料、三场模拟<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>首选补强方向是中文内容安全双侧评测；若正在投 Agent 岗，则改为三知识库任务终态与故障恢复基准。不要同月同时启动三个重训练项目而没有任何一项完成。<\/p>\n<h2>岗位定向必讲题<\/h2>\n<ul>\n<li><strong>后训练：<\/strong> <a class=\"ref\" href=\"#q-SFT03\">SFT03<\/a>、<a class=\"ref\" href=\"#q-P03\">P03<\/a>–<a class=\"ref\" href=\"#q-P14\">P14<\/a>、<a class=\"ref\" href=\"#q-RL04\">RL04<\/a>、<a class=\"ref\" href=\"#q-RL06\">RL06<\/a>–<a class=\"ref\" href=\"#q-RL15\">RL15<\/a>、<a class=\"ref\" href=\"#q-SA02\">SA02<\/a>、<a class=\"ref\" href=\"#q-E05\">E05<\/a>、<a class=\"ref\" href=\"#q-C04\">C04<\/a>。<\/li>\n<li><strong>内容安全：<\/strong> <a class=\"ref\" href=\"#q-SA01\">SA01<\/a>–<a class=\"ref\" href=\"#q-SA12\">SA12<\/a>、<a class=\"ref\" href=\"#q-P02\">P02<\/a>/<a class=\"ref\" href=\"#q-P12\">P12<\/a>、<a class=\"ref\" href=\"#q-E01\">E01<\/a>–<a class=\"ref\" href=\"#q-E06\">E06<\/a>、<a class=\"ref\" href=\"#q-J01\">J01<\/a>–<a class=\"ref\" href=\"#q-J04\">J04<\/a>、<a class=\"ref\" href=\"#q-C01\">C01<\/a>。<\/li>\n<li><strong>Agent/RAG：<\/strong> <a class=\"ref\" href=\"#q-R01\">R01<\/a>–<a class=\"ref\" href=\"#q-R14\">R14<\/a>、<a class=\"ref\" href=\"#q-A01\">A01<\/a>–<a class=\"ref\" href=\"#q-A14\">A14<\/a>、<a class=\"ref\" href=\"#q-E08\">E08<\/a>–<a class=\"ref\" href=\"#q-E12\">E12<\/a>、<a class=\"ref\" href=\"#q-C02\">C02<\/a>/<a class=\"ref\" href=\"#q-C03\">C03<\/a>。<\/li>\n<li><strong>评测平台：<\/strong> <a class=\"ref\" href=\"#q-E01\">E01<\/a>–<a class=\"ref\" href=\"#q-E14\">E14<\/a>、<a class=\"ref\" href=\"#q-A07\">A07<\/a>/<a class=\"ref\" href=\"#q-A08\">A08<\/a>、<a class=\"ref\" href=\"#q-I10\">I10<\/a>–<a class=\"ref\" href=\"#q-I12\">I12<\/a>、<a class=\"ref\" href=\"#q-X10\">X10<\/a>、<a class=\"ref\" href=\"#q-C06\">C06<\/a>。<\/li>\n<li><strong>驾驶交叉：<\/strong> <a class=\"ref\" href=\"#q-V01\">V01<\/a>–<a class=\"ref\" href=\"#q-V15\">V15<\/a>、<a class=\"ref\" href=\"#q-M11\">M11<\/a>、<a class=\"ref\" href=\"#q-E05\">E05<\/a>、<a class=\"ref\" href=\"#q-J08\">J08<\/a>、<a class=\"ref\" href=\"#q-C08\">C08<\/a>。<\/li>\n<\/ul>\n<h2>研究阅读优先级<\/h2>\n<p>先读 <a class=\"ref\" href=\"#source-S08\">S08<\/a>/<a class=\"ref\" href=\"#source-S09\">S09<\/a>/<a class=\"ref\" href=\"#source-S10\">S10<\/a> 的目标定义，接着 <a class=\"ref\" href=\"#source-S12\">S12<\/a>/<a class=\"ref\" href=\"#source-S16\">S16<\/a> 的 GRPO 与实现差异；安全读 <a class=\"ref\" href=\"#source-S20\">S20<\/a>–<a class=\"ref\" href=\"#source-S24\">S24<\/a>；RAG/Agent 读 <a class=\"ref\" href=\"#source-S29\">S29<\/a>/<a class=\"ref\" href=\"#source-S31\">S31<\/a>/<a class=\"ref\" href=\"#source-S32\">S32<\/a>；驾驶读 <a class=\"ref\" href=\"#source-S42\">S42<\/a>–<a class=\"ref\" href=\"#source-S46\">S46<\/a>。研究储备再读 <a class=\"ref\" href=\"#source-S18\">S18<\/a>/<a class=\"ref\" href=\"#source-S19\">S19<\/a>/<a class=\"ref\" href=\"#source-S63\">S63<\/a>/<a class=\"ref\" href=\"#source-S64\">S64<\/a>/<a class=\"ref\" href=\"#source-S65\">S65<\/a>/<a class=\"ref\" href=\"#source-S66\">S66<\/a>。<\/p>\n<p>每篇只回答六件事：问题、信号、关键变化、对照、边界、能做的验证。来源索引列出了阅读入口和核查状态。<\/p>\n<h2>完成度自评<\/h2>\n<p>入门：能用一句话解释。能面试：能正确展开和追问。能证明：有推导、代码或真实实验。能维护：发现新证据后知道修改哪道题、保留哪些版本差异。<\/p>\n<h2>Agent 蒸馏岗位补充路线（1.2）<\/h2>\n<p>先读 <a class=\"ref\" href=\"#q-KD01\">KD01<\/a>、<a class=\"ref\" href=\"#q-KD02\">KD02<\/a>、<a class=\"ref\" href=\"#q-KD03\">KD03<\/a>、<a class=\"ref\" href=\"#q-KD05\">KD05<\/a>，弄清教师信号；再读 <a class=\"ref\" href=\"#q-KD07\">KD07<\/a>、<a class=\"ref\" href=\"#q-KD11\">KD11<\/a>、<a class=\"ref\" href=\"#q-KD17\">KD17<\/a>、<a class=\"ref\" href=\"#q-KD21\">KD21<\/a>，理解学生状态、轨迹数据与评测。用 <a class=\"ref\" href=\"#q-KD22\">KD22<\/a> 练一个完整项目回答。希望深入算法时，再比较 <a class=\"ref\" href=\"#q-KD09\">KD09<\/a> 的 MiniLLM、<a class=\"ref\" href=\"#q-KD10\">KD10<\/a> 的 GKD，以及 <a class=\"ref\" href=\"#q-KD14\">KD14<\/a>/<a class=\"ref\" href=\"#q-KD15\">KD15<\/a> 的 2026 预印本。CPU 数值练习与小项目设计在“03_代码实验/蒸馏数值实验与Agent小项目.md”。<\/p>\n<h2>新增专题怎么接着学<\/h2>\n<p>理解交叉熵、KL 和 SFT 后，按需要选择：<\/p>\n<ul>\n<li><strong>蒸馏高级模型 / Agent 岗位：<\/strong><a class=\"ref\" href=\"#q-KD25\">KD25<\/a> → <a class=\"ref\" href=\"#q-KD27\">KD27<\/a> → <a class=\"ref\" href=\"#q-KD29\">KD29<\/a> → <a class=\"ref\" href=\"#q-KD34\">KD34<\/a>，先辨清 OPD、OPSD、MOPD；再读 <a class=\"ref\" href=\"#q-KD11\">KD11<\/a>、<a class=\"ref\" href=\"#q-KD14\">KD14<\/a>、<a class=\"ref\" href=\"#q-KD17\">KD17<\/a>、<a class=\"ref\" href=\"#q-KD21\">KD21<\/a> 的轨迹与评测。<\/li>\n<li><strong>预训练入门：<\/strong><a class=\"ref\" href=\"#q-PT01\">PT01<\/a> → <a class=\"ref\" href=\"#q-PT02\">PT02<\/a> → <a class=\"ref\" href=\"#q-PT05\">PT05<\/a> → <a class=\"ref\" href=\"#q-PT06\">PT06<\/a> → <a class=\"ref\" href=\"#q-PT08\">PT08<\/a> → <a class=\"ref\" href=\"#q-PT10\">PT10<\/a> → <a class=\"ref\" href=\"#q-PT11\">PT11<\/a> → <a class=\"ref\" href=\"#q-PT13\">PT13<\/a> → <a class=\"ref\" href=\"#q-PT17\">PT17<\/a> → <a class=\"ref\" href=\"#q-PT20\">PT20<\/a>，从训练样本走到实际训练过程。<\/li>\n<li><strong>后训练进阶：<\/strong><a class=\"ref\" href=\"#q-HP01\">HP01<\/a> → <a class=\"ref\" href=\"#q-HP02\">HP02<\/a> → <a class=\"ref\" href=\"#q-HP04\">HP04<\/a> → <a class=\"ref\" href=\"#q-HP08\">HP08<\/a>，再按瓶颈补 SAPO、VESPO 或 SDPO。先说清想解决的问题，再比较新方法。<\/li>\n<\/ul>\n<p>这些是入门 20 题之后的延伸路线，公式仍可按需展开。<\/p>\n<h2>Agent 从入门到实战（1.4）<\/h2>\n<p>阅读器的“Agent 50 题”集中展示 <a class=\"ref\" href=\"#q-A01\">A01<\/a>—<a class=\"ref\" href=\"#q-A14\">A14<\/a> 与 <a class=\"ref\" href=\"#q-AG01\">AG01<\/a>—<a class=\"ref\" href=\"#q-AG36\">AG36<\/a>。先点订单演示，试着解释为什么“执行结果未知”不能改写成失败；再进入“Agent 入门 12 题”。<\/p>\n<ul>\n<li><strong>要做项目：<\/strong><a class=\"ref\" href=\"#q-AG01\">AG01<\/a>—<a class=\"ref\" href=\"#q-AG12\">AG12<\/a> 理解系统与工具；<a class=\"ref\" href=\"#q-AG13\">AG13<\/a>—<a class=\"ref\" href=\"#q-AG21\">AG21<\/a> 补上下文、记忆、交接与协同；<a class=\"ref\" href=\"#q-AG31\">AG31<\/a>—<a class=\"ref\" href=\"#q-AG35\">AG35<\/a> 做评测和作品。<\/li>\n<li><strong>要做训练：<\/strong><a class=\"ref\" href=\"#q-AG25\">AG25<\/a>—<a class=\"ref\" href=\"#q-AG29\">AG29<\/a> 先讲轨迹、监督与环境；接着读 <a class=\"ref\" href=\"#q-KD25\">KD25<\/a>—<a class=\"ref\" href=\"#q-KD34\">KD34<\/a>，按教师与反馈条件选择蒸馏方案。<\/li>\n<li><strong>要跟进前沿：<\/strong><a class=\"ref\" href=\"#q-AG22\">AG22<\/a>—<a class=\"ref\" href=\"#q-AG24\">AG24<\/a> 区分不同记忆学习方法；<a class=\"ref\" href=\"#q-AG36\">AG36<\/a> 看训练与评测的 2026 阅读路线。先理解问题再追新缩写。<\/li>\n<\/ul>\n<p>建议带着“Agent 可靠性小实验”阅读，用具体状态和执行证据检查自己的解释。研究条目与工程主线可以分开学习，不必第一轮就读完全部论文。<\/p>"}</script>
<script id="data-doc-d9cbef88031" type="application/json">{"html":"<h1>01 数学、概率与优化<\/h1>\n<p>这一章把“预测—扣分—调整”讲清楚。新人建议按 <a class=\"ref\" href=\"#q-M01\">M01<\/a> → <a class=\"ref\" href=\"#q-M04\">M04<\/a> → <a class=\"ref\" href=\"#q-M09\">M09<\/a> → <a class=\"ref\" href=\"#q-M02\">M02<\/a> → <a class=\"ref\" href=\"#q-M05\">M05<\/a> → <a class=\"ref\" href=\"#q-M07\">M07<\/a> 阅读，再补其他题。<a class=\"ref\" href=\"#q-M02\">M02<\/a> 有完整红蓝球小课，专门解释交叉熵、熵与 KL。第一遍先看例子，公式与深入追问可以随后展开。<\/p>"}</script>
<script id="data-doc-d88ba90b9b5" type="application/json">{"html":"<h1>02 Transformer、位置编码与模型结构<\/h1>\n<p>这一章解释模型怎样读前文、记顺序和交换信息。先读 <a class=\"ref\" href=\"#q-M01\">M01<\/a>、<a class=\"ref\" href=\"#q-M04\">M04<\/a>，知道 token、分数与概率，再从 <a class=\"ref\" href=\"#q-T01\">T01<\/a> 的 Q/K/V 例子开始。符号和工程变体放在直觉之后理解。<\/p>"}</script>
<script id="data-doc-db62786f5ba" type="application/json">{"html":"<h1>03 预训练、数据治理与实验控制<\/h1>\n<p><strong>完整预训练路线：<\/strong>本章侧重数据治理；从目标到实际训练流程的 20 题见 <a class=\"ref\" href=\"#q-PT01\">PT01<\/a>—<a class=\"ref\" href=\"#q-PT20\">PT20<\/a>，包含预算、优化、MTP、长上下文与训练异常排查。<\/p>\n<p>把训练数据当作教材来理解：教材从哪里来、是否教错、有没有重复、考试题是否提前泄漏。先读 <a class=\"ref\" href=\"#q-D01\">D01<\/a> 区分训练阶段，后面每题都围绕一个具体的数据问题。<\/p>"}</script>
<script id="data-doc-d367e6a9c30" type="application/json">{"html":"<h1>04 SFT、LoRA 与训练排障<\/h1>\n<p>先看模型怎样模仿示范答案，再看怎样节省更新参数。前置是 <a class=\"ref\" href=\"#q-M01\">M01<\/a>、<a class=\"ref\" href=\"#q-M02\">M02<\/a>；先读 <a class=\"ref\" href=\"#q-SFT01\">SFT01<\/a> 和 <a class=\"ref\" href=\"#q-SFT03\">SFT03<\/a>，rank、alpha、量化等细节可以第二遍再看。<\/p>"}</script>
<script id="data-doc-d266d2b4246" type="application/json">{"html":"<h1>05 偏好优化：DPO、KTO 与 SimPO<\/h1>\n<p>这一章讲“同题有很多回答，怎样让模型更偏向好的”。先读 <a class=\"ref\" href=\"#q-P01\">P01<\/a>、<a class=\"ref\" href=\"#q-P02\">P02<\/a>、<a class=\"ref\" href=\"#q-P06\">P06<\/a>，再看 DPO 和 SimPO。<a class=\"ref\" href=\"#q-P03\">P03<\/a>–<a class=\"ref\" href=\"#q-P05\">P05<\/a> 的推导依赖 <a class=\"ref\" href=\"#q-M02\">M02<\/a> 的 KL 与 <a class=\"ref\" href=\"#q-M05\">M05<\/a> 的梯度；读不顺时先回到小例子。<\/p>"}</script>
<script id="data-doc-d017e6eab95" type="application/json">{"html":"<h1>06 PPO、GRPO 与可验证奖励<\/h1>\n<p>先把强化学习理解成“自己作答—获得成绩—调整下次选择”。<a class=\"ref\" href=\"#q-RL01\">RL01<\/a> 解释策略、动作、奖励和 rollout；<a class=\"ref\" href=\"#q-RL03\">RL03<\/a> 区分几种角色。先理解 <a class=\"ref\" href=\"#q-RL06\">RL06<\/a> 的四份答案，再展开 GRPO 长公式。<\/p>"}</script>
<script id="data-doc-d0c999090c7" type="application/json">{"html":"<h1>07 推理时计算、蒸馏与 2026 研究观察<\/h1>\n<p><strong>新增专题入口：<\/strong>OPSD 的全名、参考解监督和版本差异见 <a class=\"ref\" href=\"#q-KD27\">KD27<\/a>、<a class=\"ref\" href=\"#q-KD28\">KD28<\/a>；EOPD 见 <a class=\"ref\" href=\"#q-KD32\">KD32<\/a>；多教师 MOPD 见 <a class=\"ref\" href=\"#q-KD29\">KD29<\/a>。策略优化进阶见 <a class=\"ref\" href=\"#q-HP01\">HP01<\/a>—<a class=\"ref\" href=\"#q-HP08\">HP08<\/a>。<\/p>\n<p><strong>蒸馏入门与 Agent 专题已扩展到第 17 章（<a class=\"ref\" href=\"#q-KD01\">KD01<\/a>—<a class=\"ref\" href=\"#q-KD34\">KD34<\/a>）。<\/strong>先从 <a class=\"ref\" href=\"#q-KD01\">KD01<\/a>、<a class=\"ref\" href=\"#q-KD03\">KD03<\/a>、<a class=\"ref\" href=\"#q-KD07\">KD07<\/a>、<a class=\"ref\" href=\"#q-KD11\">KD11<\/a> 建立直觉，再回来看这里的前沿研究。<\/p>\n<p>这一章是学会基础后的延伸：多想几次有没有用、谁来挑答案、学生怎样向教师学习。先看每题的教学场景，再阅读具体研究。研究年份和结论边界沿用来源核查记录。<\/p>"}</script>
<script id="data-doc-dc6af0fe838" type="application/json">{"html":"<h1>08 内容安全、拒答与系统风险<\/h1>\n<p>先想安检的两种错误：该拦的没拦、正常的被拦。<a class=\"ref\" href=\"#q-SA01\">SA01<\/a>、<a class=\"ref\" href=\"#q-SA02\">SA02<\/a> 建立判断框架，再读多轮安全与提示注入。需要概率指标时先读 <a class=\"ref\" href=\"#q-E01\">E01<\/a> 的坏苹果例子。<\/p>"}</script>
<script id="data-doc-d29cdb81558" type="application/json">{"html":"<h1>09 评测、统计与实验设计<\/h1>\n<p>这一章解释“怎样知道模型真的更好”。从 <a class=\"ref\" href=\"#q-E01\">E01<\/a> 的苹果计数开始；指标的分母、随机波动和比较条件比术语数量更重要。更严格的统计表述放在展开部分。<\/p>"}</script>
<script id="data-doc-d234c4e82f0" type="application/json">{"html":"<h1>10 RAG、检索与知识工程<\/h1>\n<p>把 RAG 想成一次开卷考试：整理资料、找相关页、读证据、组织答案。先读 <a class=\"ref\" href=\"#q-R01\">R01<\/a>、<a class=\"ref\" href=\"#q-R02\">R02<\/a>，再看每一阶段为何会失败；召回这个流程名和召回率这个指标要分开。<\/p>"}</script>
<script id="data-doc-d9213d3c61b" type="application/json">{"html":"<h1>11 Agent、工具、记忆与可靠性<\/h1>\n<p><strong>进阶入口：<\/strong>第 20 章 <a class=\"ref\" href=\"#q-AG01\">AG01<\/a>—<a class=\"ref\" href=\"#q-AG36\">AG36<\/a> 已补齐工具协议、程序化调用、上下文、技能与记忆、长期任务、Agent 训练及 2026 评测。阅读器“Agent 50 题”将两章连成一条路线。<\/p>\n<p>把 Agent 想成能使用工具的办事助手。先读 <a class=\"ref\" href=\"#q-A01\">A01<\/a>，再沿“状态—调用—结果—恢复”理解可靠性。重点是事情实际有没有办成，而不只是回答是否流畅。<\/p>"}</script>
<script id="data-doc-d0f11467db8" type="application/json">{"html":"<h1>12 推理、显存与服务性能<\/h1>\n<p>先区分读题与写答案（<a class=\"ref\" href=\"#q-I01\">I01<\/a>），再理解保存历史笔记（<a class=\"ref\" href=\"#q-I02\">I02<\/a>）和数缓存里的数字（<a class=\"ref\" href=\"#q-I03\">I03<\/a>）。显存、速度、等待与成本分别计算，最后再看具体加速算法。<\/p>"}</script>
<script id="data-doc-dfd0e3790b3" type="application/json">{"html":"<h1>13 分布式训练、量化与系统排障<\/h1>\n<p>本章解决“一张卡放不下或算不快”的问题。先读 <a class=\"ref\" href=\"#q-I04\">I04<\/a> 的显存组成，再看分数据、分计算、搬存储和降低精度各在解决什么负担。<\/p>"}</script>
<script id="data-doc-de563d7d6eb" type="application/json">{"html":"<h1>14 多模态、自动驾驶与人因交叉<\/h1>\n<p>先分清看图、依据图像回答、生成动作这几件事。<a class=\"ref\" href=\"#q-V03\">V03<\/a> 用改图检查是否真看图；<a class=\"ref\" href=\"#q-V08\">V08<\/a> 用录像与实际接管解释开环和闭环。隐变量、EM 等可以按本人研究需要加深。<\/p>"}</script>
<script id="data-doc-d409d8a1452" type="application/json">{"html":"<h1>15 传统机器学习与 NLP 基线<\/h1>\n<p>简单模型是理解与实验的好起点。先看它使用什么特征、怎样判断，再与大模型比较。不需要因为模型传统就忽略它，也不必因此把所有任务都交给简单模型。<\/p>"}</script>
<script id="data-doc-d492bc62871" type="application/json">{"html":"<h1>16 手撕、数值验证与最小闭环<\/h1>\n<p>这章是练习，不要求一开始手写全部代码。先读对应原理题，再按“一个小输入—一个预期结果—一个错误性质”运行与检查。已有教学代码在 03_代码实验。<\/p>"}</script>
<script id="data-doc-d6b12c6552d" type="application/json">{"html":"<h1>17 · 蒸馏算法与 Agent 能力迁移<\/h1>\n<p><strong>先抓住一个画面：<\/strong>公司有一位能力强、调用费用高的“老师”，想让便宜、响应快的“学生”接手一类重复工作。要搬过去的不是老师的参数文件，而是可观察、可验证的做事能力。<\/p>\n<p>本章共 34 题。<strong>要看 OPD、OPSD、MOPD，先读 <a class=\"ref\" href=\"#q-KD25\">KD25<\/a> → <a class=\"ref\" href=\"#q-KD27\">KD27<\/a> → <a class=\"ref\" href=\"#q-KD29\">KD29<\/a> → <a class=\"ref\" href=\"#q-KD34\">KD34<\/a><\/strong>：依次弄清学生在哪里学习、老师怎样构造、多个老师如何整合。再用 <a class=\"ref\" href=\"#q-KD26\">KD26<\/a> 理解更新信号。<\/p>\n<p>本章贯穿一个教学场景：用户要查订单，助手需要补齐订单号、查订单工具、读返回结果、给出有依据的答复。所有数字和业务方案都是教学设计，不是论文实测。<\/p>\n<p><strong>第一遍先读：<a class=\"ref\" href=\"#q-KD01\">KD01<\/a> → <a class=\"ref\" href=\"#q-KD02\">KD02<\/a> → <a class=\"ref\" href=\"#q-KD03\">KD03<\/a> → <a class=\"ref\" href=\"#q-KD05\">KD05<\/a> → <a class=\"ref\" href=\"#q-KD07\">KD07<\/a> → <a class=\"ref\" href=\"#q-KD11\">KD11<\/a> → <a class=\"ref\" href=\"#q-KD17\">KD17<\/a> → <a class=\"ref\" href=\"#q-KD21\">KD21<\/a>。<\/strong>再读 <a class=\"ref\" href=\"#q-KD22\">KD22<\/a> 做项目方案。<a class=\"ref\" href=\"#q-KD09\">KD09<\/a>、<a class=\"ref\" href=\"#q-KD10\">KD10<\/a>、<a class=\"ref\" href=\"#q-KD14\">KD14<\/a>、<a class=\"ref\" href=\"#q-KD15\">KD15<\/a> 放在理解基本流程之后。<\/p>\n<table>\n<thead>\n<tr>\n<th>想让学生学什么<\/th>\n<th>典型做法<\/th>\n<th>最先确认什么<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>老师写出的答案<\/td>\n<td>序列蒸馏，用教师文本做 SFT<\/td>\n<td>答案是否正确、学生部署时有没有同样的输入<\/td>\n<\/tr>\n<tr>\n<td>老师对下一步的判断<\/td>\n<td>软标签蒸馏、GKD、MiniLLM<\/td>\n<td>能否取到所需概率，词表与上下文是否对齐<\/td>\n<\/tr>\n<tr>\n<td>查资料、调工具、处理异常<\/td>\n<td>Agent 轨迹蒸馏<\/td>\n<td>工具是否真实执行，观察与动作是否分开<\/td>\n<\/tr>\n<tr>\n<td>学生走错以后怎么补救<\/td>\n<td>学生采样 + 教师纠正，DAgger/OPD 思路<\/td>\n<td>老师是否看见学生真正到达的状态<\/td>\n<\/tr>\n<tr>\n<td>从做完的任务中总结经验<\/td>\n<td>自蒸馏，结合反馈或技能的训练<\/td>\n<td>经验是否可靠，训练提示能否被真正学进参数<\/td>\n<\/tr>\n<tr>\n<td>用参考解帮助老师评价学生路径<\/td>\n<td>OPSD（<a class=\"ref\" href=\"#q-KD27\">KD27<\/a>）<\/td>\n<td>训练参考信息与测试输入严格区分<\/td>\n<\/tr>\n<tr>\n<td>整合几个领域专家的能力<\/td>\n<td>MOPD（<a class=\"ref\" href=\"#q-KD29\">KD29<\/a>）<\/td>\n<td>教师专长、任务路由、同预算对照<\/td>\n<\/tr>\n<tr>\n<td>从环境详细反馈中学习<\/td>\n<td>SDPO（<a class=\"ref\" href=\"#q-KD31\">KD31<\/a>）<\/td>\n<td>反馈是否可靠，教师怎样更新<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>“高级模型”通常提供较强的教师行为，但教师可能出错。蒸馏能迁移哪些能力，需要用具体任务和部署预算验证；模型名字本身不是效果保证。一般概率、交叉熵、KL 的前置解释见 <a class=\"ref\" href=\"#q-M02\">M02<\/a>、<a class=\"ref\" href=\"#q-M04\">M04<\/a>、<a class=\"ref\" href=\"#q-M07\">M07<\/a>。<\/p>"}</script>
<script id="data-doc-d6403496de7" type="application/json">{"html":"<h1>18 · 后训练算法进阶与 2026 研究地图<\/h1>\n<p><strong>先把训练拆成三件事：从哪里取得反馈，怎样把反馈算成更新信号，怎样稳定地执行更新。<\/strong>有些新方法改教师，有些改奖励归一化，有些改概率比权重。它们改动的位置不同。<\/p>\n<p>核查基准日：2026-09-15。本章补齐 2025—2026 年有一手来源的方法；“较新”不等于“对所有任务最好”。OPD、OPSD、MOPD、SDPO、EOPD、U-OPSD 的完整比较在 <a class=\"ref\" href=\"#q-KD25\">KD25<\/a>—<a class=\"ref\" href=\"#q-KD34\">KD34<\/a>；本章重点讲策略优化的新改动。<\/p>\n<table>\n<thead>\n<tr>\n<th>瓶颈<\/th>\n<th>代表方法<\/th>\n<th>本章入口<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>同组奖励全相同、长回答计分失衡<\/td>\n<td>DAPO、Dr. GRPO<\/td>\n<td><a class=\"ref\" href=\"#q-HP01\">HP01<\/a><\/td>\n<\/tr>\n<tr>\n<td>少数 token 概率比异常，整段更新不稳<\/td>\n<td>GSPO<\/td>\n<td><a class=\"ref\" href=\"#q-HP02\">HP02<\/a><\/td>\n<\/tr>\n<tr>\n<td>硬剪切过于突然，仍想保留合适的更新<\/td>\n<td>SAPO<\/td>\n<td><a class=\"ref\" href=\"#q-HP03\">HP03<\/a><\/td>\n<\/tr>\n<tr>\n<td>多个奖励先相加，差异被压掉<\/td>\n<td>GDPO<\/td>\n<td><a class=\"ref\" href=\"#q-HP04\">HP04<\/a><\/td>\n<\/tr>\n<tr>\n<td>异步采样的数据变旧，概率比方差过大<\/td>\n<td>VESPO<\/td>\n<td><a class=\"ref\" href=\"#q-HP05\">HP05<\/a><\/td>\n<\/tr>\n<tr>\n<td>分不清采样模型、教师和参考模型<\/td>\n<td>数据与策略版本管理<\/td>\n<td><a class=\"ref\" href=\"#q-HP06\">HP06<\/a><\/td>\n<\/tr>\n<tr>\n<td>训练越来越会钻评分规则<\/td>\n<td>验证器、过程反馈与对照实验<\/td>\n<td><a class=\"ref\" href=\"#q-HP07\">HP07<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>第一遍按 <a class=\"ref\" href=\"#q-HP01\">HP01<\/a> → <a class=\"ref\" href=\"#q-HP02\">HP02<\/a> → <a class=\"ref\" href=\"#q-HP04\">HP04<\/a> → <a class=\"ref\" href=\"#q-HP08\">HP08<\/a> 阅读。术语卡住时回到 <a class=\"ref\" href=\"#q-RL04\">RL04<\/a>、<a class=\"ref\" href=\"#q-RL06\">RL06<\/a> 和 <a class=\"ref\" href=\"#q-KD26\">KD26<\/a>。以下教学算例不对应论文实测结果。<\/p>"}</script>
<script id="data-doc-db4bdbdc3f9" type="application/json">{"html":"<h1>19 · 大模型预训练：从目标到工程<\/h1>\n<p><strong>先建立一个完整画面：<\/strong>预训练把大量文本变成“根据前文预测后文”的练习。训练系统负责把文本送进模型、算错多少、更新参数并不断检查是否学到了可迁移的能力。<\/p>\n<p>第 3 章讲数据治理；本章把<strong>训练目标 → 数据与分词 → 模型与预算 → 优化与工程 → 评测 → 后续训练<\/strong>串起来。先读 <a class=\"ref\" href=\"#q-PT01\">PT01<\/a>、<a class=\"ref\" href=\"#q-PT02\">PT02<\/a>、<a class=\"ref\" href=\"#q-PT04\">PT04<\/a>、<a class=\"ref\" href=\"#q-PT08\">PT08<\/a>、<a class=\"ref\" href=\"#q-PT10\">PT10<\/a>、<a class=\"ref\" href=\"#q-PT11\">PT11<\/a>、<a class=\"ref\" href=\"#q-PT17\">PT17<\/a>、<a class=\"ref\" href=\"#q-PT20\">PT20<\/a>，再补工程细节。<\/p>\n<table>\n<thead>\n<tr>\n<th>阶段<\/th>\n<th>核心产物<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>准备教材<\/td>\n<td>可追踪的数据版本、切分、过滤和配比<\/td>\n<\/tr>\n<tr>\n<td>定义练习<\/td>\n<td>tokenizer、预测目标、样本边界与 mask<\/td>\n<\/tr>\n<tr>\n<td>定义学生<\/td>\n<td>模型结构、参数规模、上下文长度<\/td>\n<\/tr>\n<tr>\n<td>开始学习<\/td>\n<td>优化器、学习率、批次、数值精度和训练日志<\/td>\n<\/tr>\n<tr>\n<td>防止白学<\/td>\n<td>独立评测、稳定性监控、可恢复的检查点<\/td>\n<\/tr>\n<tr>\n<td>进入应用<\/td>\n<td>继续训练、SFT、RL、蒸馏与工具系统<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>这里提供方法理解和实验设计，不将预训练经验写成你的既有项目经历。开放训练案例采用 Olmo 3、DeepSeek-V3 等一手技术资料，明确它们不是同一套配方。<\/p>"}</script>
<script id="data-doc-d611a9a97fc" type="application/json">{"html":"<h1>20 · Agent 从入门到实战：工具、记忆、训练与评测<\/h1>\n<p><strong>先抓住一条主线：读懂目标 → 取得事实 → 选择动作 → 真实执行 → 核验结果 → 继续或停止。<\/strong>一个模型能说出下一步，还需要工具、状态、运行控制和验证器，才能稳定把事办完。<\/p>\n<p>本章新增 36 题，和第 11 章 <a class=\"ref\" href=\"#q-A01\">A01<\/a>—<a class=\"ref\" href=\"#q-A14\">A14<\/a> 组成阅读器中的 <strong>Agent 50 题<\/strong>。常用例子是订单修改与报销：它们都有明确目标、工具、约束和可核验终态，便于把抽象概念讲清。<\/p>\n<h2>从哪一段开始<\/h2>\n<table>\n<thead>\n<tr>\n<th>学习层次<\/th>\n<th>先弄懂的事情<\/th>\n<th>题号<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>入门<\/td>\n<td>模型提出动作，程序执行，终态证明结果<\/td>\n<td><a class=\"ref\" href=\"#q-A01\">A01<\/a>、<a class=\"ref\" href=\"#q-AG01\">AG01<\/a>、<a class=\"ref\" href=\"#q-A02\">A02<\/a>、<a class=\"ref\" href=\"#q-AG03\">AG03<\/a>、<a class=\"ref\" href=\"#q-AG04\">AG04<\/a>、<a class=\"ref\" href=\"#q-A04\">A04<\/a>、<a class=\"ref\" href=\"#q-A05\">A05<\/a>、<a class=\"ref\" href=\"#q-A07\">A07<\/a><\/td>\n<\/tr>\n<tr>\n<td>工具与执行<\/td>\n<td>MCP / A2A、程序化调用、规划、界面操作与并行<\/td>\n<td><a class=\"ref\" href=\"#q-AG05\">AG05<\/a>—<a class=\"ref\" href=\"#q-AG12\">AG12<\/a><\/td>\n<\/tr>\n<tr>\n<td>上下文与长期任务<\/td>\n<td>筛选证据、检索工具、记忆、交接、技能与协同<\/td>\n<td><a class=\"ref\" href=\"#q-AG13\">AG13<\/a>—<a class=\"ref\" href=\"#q-AG21\">AG21<\/a><\/td>\n<\/tr>\n<tr>\n<td>前沿记忆选读<\/td>\n<td>控制器训练、LoRA 参数记忆、外部技能演化<\/td>\n<td><a class=\"ref\" href=\"#q-AG22\">AG22<\/a>—<a class=\"ref\" href=\"#q-AG24\">AG24<\/a><\/td>\n<\/tr>\n<tr>\n<td>训练与评测<\/td>\n<td>轨迹监督、Agent RL、环境构造、故障归因与统计<\/td>\n<td><a class=\"ref\" href=\"#q-AG25\">AG25<\/a>—<a class=\"ref\" href=\"#q-AG33\">AG33<\/a><\/td>\n<\/tr>\n<tr>\n<td>岗位作品<\/td>\n<td>做出可验收项目，讲清贡献与证据<\/td>\n<td><a class=\"ref\" href=\"#q-AG34\">AG34<\/a>—<a class=\"ref\" href=\"#q-AG36\">AG36<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>第一轮不必全背：先走阅读器的“Agent 入门 12 题”，再按失败问题找对应章节。公式与研究边界仍放在深读区，先用自己的话讲清例子。<\/p>\n<h2>本轮研究怎么使用<\/h2>\n<p>核查基准日：2026-09-15。覆盖 MCP 2026-07-28、A2A 1.0、2026 年程序化调用研究、记忆与技能演化、Agent Lightning v1.0，以及持续更新的 Agent 基准。条目会说明更新的是协议、数据、技能文本、控制器还是模型参数，避免把不同改进混成一个“最强算法”。<\/p>\n<p>原论文、官方工程方法、教学方案分别标明。文中的模拟任务与预算例子帮助理解机制；并未把它们当作真实大模型训练成绩。每个来源可从题目中的 S 编号打开。<\/p>\n<h2>带着一个可运行的小实验读<\/h2>\n<p><a href=\"../03_代码实验/Agent可靠性小实验.md\">Agent 可靠性小实验<\/a>用内存订单模拟八类问题，包括未知结果、旧版本、压缩丢约束和终态验收。阅读器的 Agent 入口还提供逐步演示，区分“后台实际发生了什么”与“Agent 目前获得了什么证据”。<\/p>"}</script>
<script id="data-doc-d69723ddacb" type="application/json">{"html":"<h1>Transformer 架构手写：从一行向量到完整模型<\/h1>\n<p><strong>学习目标：<\/strong>新人能在纸上说明形状，逐步写出核心部件，运行小语言模型，并解释常见错误。<a class=\"ref\" href=\"#q-TH01\">TH01<\/a>—<a class=\"ref\" href=\"#q-TH16\">TH16<\/a> 是主线；<a class=\"ref\" href=\"#q-TH17\">TH17<\/a>—<a class=\"ref\" href=\"#q-TH20\">TH20<\/a> 是缓存、现代变体与验证；<a class=\"ref\" href=\"#q-TH21\">TH21<\/a>—<a class=\"ref\" href=\"#q-TH22\">TH22<\/a> 用于面试练习和学习迁移。<\/p>\n<p>建议分 5 次练：① <a class=\"ref\" href=\"#q-TH01\">TH01<\/a>—<a class=\"ref\" href=\"#q-TH05\">TH05<\/a>；② <a class=\"ref\" href=\"#q-TH06\">TH06<\/a>—<a class=\"ref\" href=\"#q-TH10\">TH10<\/a>；③ <a class=\"ref\" href=\"#q-TH11\">TH11<\/a>—<a class=\"ref\" href=\"#q-TH14\">TH14<\/a>；④ <a class=\"ref\" href=\"#q-TH15\">TH15<\/a>—<a class=\"ref\" href=\"#q-TH17\">TH17<\/a>；⑤ <a class=\"ref\" href=\"#q-TH18\">TH18<\/a>—<a class=\"ref\" href=\"#q-TH22\">TH22<\/a>。每次先自己预测输出，再运行；不要求第一天记住全部代码。<\/p>\n<p>配套 <a href=\"../03_代码实验/transformer_handwrite.py\">完整实现<\/a>、<a href=\"../03_代码实验/test_transformer_handwrite.py\">数值与行为测试<\/a>、<a href=\"../03_代码实验/Transformer手写运行与练习.md\">安装、运行和分层练习<\/a>。阅读器顶部有“Transformer 手写”和“算法可视化”入口。<\/p>\n<p><strong>统一约定：<\/strong>Python + PyTorch；[B,T,D]；True=允许关注；float32 CPU；主线使用 Pre-LN、GELU 与可训练绝对位置。原始 Post-LN、正弦位置、RoPE、RMSNorm、SwiGLU、GQA 在相应位置区分，不混称同一个模型。示例小模型不是现成预训练模型。<\/p>"}</script>
<script id="data-doc-d66c1228e2c" type="application/json">{"html":"<h1>项目深挖：从“做过”到“能被追问”<\/h1>\n<p>使用边界：仅把背景报告中的经历作为对话起点。所有数据、配置、职责和结果由本人核对后使用。下列“回答骨架”不是可直接照搬的履历事实。<\/p>\n<p>先读每题的场景与白话回答，再展开完整回答骨架或设计细节。所有个人经历仍需本人真实材料支持。<\/p>"}</script>
<script id="data-doc-d9e5a3c1dc3" type="application/json">{"html":"<h1>系统设计八问<\/h1>\n<p>回答顺序：先明确目标和约束，再画数据/状态流，列指标、失败模式和验证方案。容量和预算未提供时，以符号估算并说明假设，避免编造真实业务规模。<\/p>\n<p>先读每题的场景与白话回答，再展开完整回答骨架或设计细节。所有个人经历仍需本人真实材料支持。<\/p>"}</script>
<script id="data-doc-d1f1be2e7cb" type="application/json">{"html":"<h1>模拟面试与评分<\/h1>\n<p>不冒充任何公司的真实题库。下面是按岗位能力要求设计的模拟流程。<\/p>\n<p>新人请先完成入门路线，再用本页做自测。第一次可以不限时，先达到“能举例说明”的程度；60 分钟整场模拟放在原理和项目都准备好之后。<\/p>\n<h2>统一评分尺（每题 0–4 分）<\/h2>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: right;\">分数<\/th>\n<th>表现<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: right;\">0<\/td>\n<td>定义或方向错误，无法区分概念<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">1<\/td>\n<td>能说名词和大意，追问后缺乏机制<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">2<\/td>\n<td>原理基本正确，能举例或写关键式<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">3<\/td>\n<td>条件、误区与实验验证完整<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">4<\/td>\n<td>能结合本人真实证据，比较取舍并定位失败<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>对尚未实际做过的研究题，4 分可由准确推导、运行练习和扎实实验设计体现；不能用编造项目换高分。<\/p>\n<h2>场次一：后训练与内容安全（60 分钟）<\/h2>\n<table>\n<thead>\n<tr>\n<th>时间<\/th>\n<th>问题链<\/th>\n<th>核心评分点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0–8 分钟<\/td>\n<td><a class=\"ref\" href=\"#q-J01\">J01<\/a> → <a class=\"ref\" href=\"#q-J02\">J02<\/a> → <a class=\"ref\" href=\"#q-J03\">J03<\/a><\/td>\n<td>指标口径、个人贡献、数据切分<\/td>\n<\/tr>\n<tr>\n<td>8–20 分钟<\/td>\n<td><a class=\"ref\" href=\"#q-P03\">P03<\/a> → <a class=\"ref\" href=\"#q-P04\">P04<\/a> → <a class=\"ref\" href=\"#q-P06\">P06<\/a> → <a class=\"ref\" href=\"#q-P08\">P08<\/a><\/td>\n<td>DPO 推导、参考角色、SimPO β/γ<\/td>\n<\/tr>\n<tr>\n<td>20–30 分钟<\/td>\n<td><a class=\"ref\" href=\"#q-P12\">P12<\/a> → <a class=\"ref\" href=\"#q-SA02\">SA02<\/a> → <a class=\"ref\" href=\"#q-SA05\">SA05<\/a><\/td>\n<td>好坏标签、双侧风险、多轮隔离<\/td>\n<\/tr>\n<tr>\n<td>30–40 分钟<\/td>\n<td><a class=\"ref\" href=\"#q-RL06\">RL06<\/a> → <a class=\"ref\" href=\"#q-RL08\">RL08<\/a> → <a class=\"ref\" href=\"#q-RL10\">RL10<\/a><\/td>\n<td>组内优势、零信号、损失权重<\/td>\n<\/tr>\n<tr>\n<td>40–50 分钟<\/td>\n<td><a class=\"ref\" href=\"#q-C04\">C04<\/a><\/td>\n<td>对照、成本、消融和失败标准<\/td>\n<\/tr>\n<tr>\n<td>50–60 分钟<\/td>\n<td><a class=\"ref\" href=\"#q-J04\">J04<\/a> → <a class=\"ref\" href=\"#q-E05\">E05<\/a><\/td>\n<td>真正归因和统计边界<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>标准追问答案摘要：<\/strong> 同题 Z 相消；DPO 的参考不负责判断语义对错；SimPO 平均差阈值是 γ/β；全组相同奖励没有相对学习信号；提高 precision 要同时看 recall。展开答案见相应题号。<\/p>\n<h2>场次二：Agent/RAG 与评测（60 分钟）<\/h2>\n<table>\n<thead>\n<tr>\n<th>时间<\/th>\n<th>问题链<\/th>\n<th>核心评分点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0–8 分钟<\/td>\n<td><a class=\"ref\" href=\"#q-J05\">J05<\/a> → <a class=\"ref\" href=\"#q-R09\">R09<\/a><\/td>\n<td>三库边界和路由证据<\/td>\n<\/tr>\n<tr>\n<td>8–20 分钟<\/td>\n<td><a class=\"ref\" href=\"#q-R04\">R04<\/a> → <a class=\"ref\" href=\"#q-R05\">R05<\/a> → <a class=\"ref\" href=\"#q-R06\">R06<\/a> → <a class=\"ref\" href=\"#q-R11\">R11<\/a><\/td>\n<td>稀疏/稠密、融合、重排、claim<\/td>\n<\/tr>\n<tr>\n<td>20–32 分钟<\/td>\n<td><a class=\"ref\" href=\"#q-A03\">A03<\/a> → <a class=\"ref\" href=\"#q-A05\">A05<\/a> → <a class=\"ref\" href=\"#q-A06\">A06<\/a><\/td>\n<td>schema 与语义、状态未知、幂等<\/td>\n<\/tr>\n<tr>\n<td>32–42 分钟<\/td>\n<td><a class=\"ref\" href=\"#q-A09\">A09<\/a> → <a class=\"ref\" href=\"#q-A11\">A11<\/a> → <a class=\"ref\" href=\"#q-A13\">A13<\/a><\/td>\n<td>记忆更新、信任边界、摘要<\/td>\n<\/tr>\n<tr>\n<td>42–52 分钟<\/td>\n<td><a class=\"ref\" href=\"#q-C03\">C03<\/a> 或 <a class=\"ref\" href=\"#q-C06\">C06<\/a><\/td>\n<td>终态、策略和故障注入<\/td>\n<\/tr>\n<tr>\n<td>52–60 分钟<\/td>\n<td><a class=\"ref\" href=\"#q-E08\">E08<\/a> → <a class=\"ref\" href=\"#q-E09\">E09<\/a><\/td>\n<td>重复可靠性、judge 校准<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>标准追问答案摘要：<\/strong> reranker 无法找回从未召回的证据；格式正确不代表参数正确；写入超时先查状态；记忆需来源/时效/删除；pass^k 与 pass@k 目标不同。<\/p>\n<h2>场次三：基础、工程与驾驶交叉（60 分钟）<\/h2>\n<table>\n<thead>\n<tr>\n<th>时间<\/th>\n<th>问题链<\/th>\n<th>核心评分点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0–12 分钟<\/td>\n<td><a class=\"ref\" href=\"#q-T01\">T01<\/a> → <a class=\"ref\" href=\"#q-T02\">T02<\/a> → <a class=\"ref\" href=\"#q-T06\">T06<\/a><\/td>\n<td>维度、缩放、相对位置推导<\/td>\n<\/tr>\n<tr>\n<td>12–24 分钟<\/td>\n<td><a class=\"ref\" href=\"#q-SFT03\">SFT03<\/a> → <a class=\"ref\" href=\"#q-SFT06\">SFT06<\/a> → <a class=\"ref\" href=\"#q-X02\">X02<\/a><\/td>\n<td>低秩参数、量化精度、分片状态<\/td>\n<\/tr>\n<tr>\n<td>24–34 分钟<\/td>\n<td><a class=\"ref\" href=\"#q-I03\">I03<\/a> → <a class=\"ref\" href=\"#q-I08\">I08<\/a> → <a class=\"ref\" href=\"#q-I10\">I10<\/a><\/td>\n<td>KV 算例、草稿验证、尾延迟<\/td>\n<\/tr>\n<tr>\n<td>34–46 分钟<\/td>\n<td><a class=\"ref\" href=\"#q-V03\">V03<\/a> → <a class=\"ref\" href=\"#q-V08\">V08<\/a> → <a class=\"ref\" href=\"#q-V09\">V09<\/a><\/td>\n<td>grounding、开闭环与非反应式<\/td>\n<\/tr>\n<tr>\n<td>46–55 分钟<\/td>\n<td><a class=\"ref\" href=\"#q-V11\">V11<\/a> → <a class=\"ref\" href=\"#q-V12\">V12<\/a> → <a class=\"ref\" href=\"#q-J08\">J08<\/a><\/td>\n<td>belief、EM、能力迁移<\/td>\n<\/tr>\n<tr>\n<td>55–60 分钟<\/td>\n<td><a class=\"ref\" href=\"#q-F10\">F10<\/a><\/td>\n<td>新论文的假设与验证<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>标准追问答案摘要：<\/strong> GQA 缓存按 KV 头数变；LoRA 冻结不等于无反向激活；精确 speculative decoding 依赖接受/残差规则；世界模型预测好看不证明规划安全；EM 不保证全局最优。<\/p>\n<h2>使用方法<\/h2>\n<p>先闭卷录音，再按题目检查错误；把不会的题记为“需复习”，能完成追问再标“已掌握”。每轮只选三个最影响岗位表现的问题补证据，避免只累计阅读时间。<\/p>\n<h2>面试后复盘模板<\/h2>\n<ul>\n<li>岗位方向与日期：<\/li>\n<li>被问到的固定题号/新增问题：<\/li>\n<li>我实际回答的要点：<\/li>\n<li>事实或公式错误：<\/li>\n<li>缺失的项目证据：<\/li>\n<li>需要新增/修改的章节：<\/li>\n<li>下次能证明掌握的动作：<\/li>\n<\/ul>\n<p>该模板用于个人复盘，不记录他人的私人身份信息或保密业务材料。<\/p>"}</script>
<script id="data-doc-db35eb0ae8e" type="application/json">{"html":"<h1>Agent 可靠性小实验：让订单真的改对<\/h1>\n<p><strong>先抓住一句话：Agent 说“我办好了”，和系统里“事情真的办好了”，是两回事。<\/strong><\/p>\n<p>这里用一个故事贯穿八个实验：Alice 有一张订单，当前数量为 1、版本为 1。她希望把数量改成 2；环境只允许她修改自己的这张订单，数量最多为 3。工具可能在提交前或提交后丢失响应。<\/p>\n<p>全部操作都发生在程序内存里，运行结束即消失。<strong>不访问网络、不调用模型、不改真实订单，程序本身只打印 JSON。<\/strong> 对照项是我们刻意写出的薄弱规则，不代表某个大模型的能力，也不会产生“模型成功率”。<\/p>\n<h2>先看八个实验究竟教什么<\/h2>\n<table>\n<thead>\n<tr>\n<th>故障或对照<\/th>\n<th>容易犯的错<\/th>\n<th>要保留的工程行为<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>只生成改单计划<\/td>\n<td>已有动作 JSON，就宣布完成<\/td>\n<td>计划与执行分开；没有回执、终态就没有成功证据<\/td>\n<\/tr>\n<tr>\n<td>参数、权限或版本不对<\/td>\n<td>JSON 能解析，就执行<\/td>\n<td>数量类型与范围、用户授权、订单版本都要检查<\/td>\n<\/tr>\n<tr>\n<td>工具超时<\/td>\n<td>把超时当作确定失败<\/td>\n<td>超时只说明没有拿到响应；用原操作编号查提交结果<\/td>\n<\/tr>\n<tr>\n<td>连回执也查不清<\/td>\n<td>换一个编号再提交<\/td>\n<td>保留“未知”和原命令；恢复时沿用原编号与原参数<\/td>\n<\/tr>\n<tr>\n<td>聊天被压缩<\/td>\n<td>摘要只剩“把数量改成 4”<\/td>\n<td>数量上限、用户、订单、版本、操作编号放入独立状态<\/td>\n<\/tr>\n<tr>\n<td>检索出记忆<\/td>\n<td>只要相似就全塞进上下文<\/td>\n<td>按用户隔离，检查有效期；记忆内容不能授予权限<\/td>\n<\/tr>\n<tr>\n<td>调用预算耗尽<\/td>\n<td>一直重试，或声称没有执行<\/td>\n<td>停止调用；区分“还没发出”和“发出后结果未知”<\/td>\n<\/tr>\n<tr>\n<td>评测 Agent<\/td>\n<td>检查回答里有没有“成功”<\/td>\n<td>检查真实订单、对应回执和修改次数<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>结合 <a class=\"ref\" href=\"#q-A03\">A03<\/a>–<a class=\"ref\" href=\"#q-A07\">A07<\/a>、<a class=\"ref\" href=\"#q-A09\">A09<\/a>–<a class=\"ref\" href=\"#q-A11\">A11<\/a>、<a class=\"ref\" href=\"#q-A13\">A13<\/a> 阅读。<a class=\"ref\" href=\"#q-KD22\">KD22<\/a>–<a class=\"ref\" href=\"#q-KD23\">KD23<\/a> 讨论 Agent 蒸馏与评测时，也可以把这里的故障场景作为需要覆盖的轨迹类型。<\/p>\n<h2>第一课：为什么需要“订单版本”<\/h2>\n<p>你读到版本 1，准备修改；另一个人已经把订单改成版本 2。此时继续按旧信息操作，可能覆盖对方的修改。<\/p>\n<p>所以命令除了写“改成 2”，还要带上“我依据的是版本 1”。服务端发现版本不一致，就拒绝这次修改。接下来应重新读取状态、重新判断用户目标，而不是机械重试旧命令。<\/p>\n<p>这里的权限由模拟环境预先配置。即使 Agent 在自己的上下文里写“数量上限是 99”，服务端仍会按真实授权上限 3 拦截。<\/p>\n<h2>第二课：超时为什么有三种结果<\/h2>\n<p>想象你提交表单，页面一直转圈：服务器可能还没收到，也可能已经处理完，只是回信丢了。<\/p>\n<ul>\n<li><strong>查到提交回执：<\/strong>本次操作已完成，直接使用回执。<\/li>\n<li><strong>权威确认尚未提交：<\/strong>允许按原操作编号、原参数重试。<\/li>\n<li><strong>回执查询也不可用：<\/strong>保留“未知”，停止盲目提交，等待后续恢复。<\/li>\n<\/ul>\n<p>操作编号相当于这一次改单的“取件码”。同编号、同命令再次到达时，服务端返回原回执；同编号换了数量，会被拒绝。这样恢复原操作时不会误变成第二次操作。<\/p>\n<p><strong>模拟边界：<\/strong>本实验假设单进程原子提交，而且可用的回执查询是强一致的。在真实系统中，如果查询有延迟，“没查到”可能仍是未知。生产系统还需要持久化操作记录、权限校验、幂等记录保留期，以及适合具体业务的一致性协议。这个小实验没有实现分布式事务。<\/p>\n<h2>第三课：上下文压缩、记忆、预算各管什么<\/h2>\n<p><strong>压缩聊天<\/strong>负责删掉闲聊与冗长描述。任务数量上限、操作编号等字段独立保存，压缩函数没有权限改它们。本实验验证这种状态组织方式，不是在评测某个模型的摘要质量。<\/p>\n<p><strong>检索记忆<\/strong>负责返回当前用户尚未过期的信息。实验采用外部给定的整数时间，便于复现到期边界；到期时刻就算失效。通过过滤不代表内容已被验证，所以回忆里的“我有权限”仍不能修改服务端授权。<\/p>\n<p><strong>预算<\/strong>负责决定还可以调用几次工具。实验只计算调用次数，没有估算 token、金钱和真实耗时。预算用完时，如果上一次调用可能已提交，状态必须留在“未知”，不能把它改写成确定失败。<\/p>\n<h2>怎样运行<\/h2>\n<p>在本目录打开终端，执行：<\/p>\n<pre><code class=\"language-powershell\">python agent_reliability_examples.py\npython -m unittest test_agent_reliability.py -v\n<\/code><\/pre>\n<p>第一条会输出包含八个场景的 JSON。每个场景都有 <code>baseline<\/code> 和 <code>guarded<\/code>：前者记录薄弱规则的问题，后者记录模拟环境中检查得到的行为。第二条运行 8 项故障与对照验证。<\/p>\n<p>重点观察这些结果：<\/p>\n<ul>\n<li>只做计划：<code>actual_success<\/code> 为 <code>false<\/code>，写入次数为 <code>0<\/code>。<\/li>\n<li>提交前超时与提交后超时：恢复后都只有 <code>1<\/code> 次写入，工具调用次数分别为 <code>3<\/code> 和 <code>2<\/code>。<\/li>\n<li>回执不可见：第一次结果是 <code>unknown<\/code>；恢复可见后用原操作编号重放，仍只有 <code>1<\/code> 次写入。<\/li>\n<li>上下文压缩：目标数量 <code>4<\/code> 仍被上限 <code>3<\/code> 拦截，工具调用次数为 <code>0<\/code>。<\/li>\n<li>提交后只有一次调用预算：实际已写入，但对调用方只能报告 <code>unknown<\/code>。<\/li>\n<li>回答声称成功却没有执行：终态评测为 <code>false<\/code>。<\/li>\n<\/ul>\n<h2>面试时怎样讲这个项目<\/h2>\n<p>可以这样概括：<\/p>\n<blockquote>\n<p>我搭了一个可重置的订单模拟环境，给相同任务注入超时、旧版本、上下文压缩和记忆污染等故障。系统把计划、工具回执和真实状态分开记录；结果不明时保留原操作编号，受预算约束地恢复；最后根据环境终态评测。现阶段验证的是系统规则，尚未证明任何模型的能力提升。<\/p>\n<\/blockquote>\n<p>下一步若接入真实模型，可以比较“只有提示词”和“提示词加这些系统约束”两个版本，保持工具权限、任务集、预算一致，统计任务完成、错误操作、未知结果处理与调用成本。训练集和测试集应按任务模板及故障组合隔离。<strong>只有实际运行这组评测后，才能报告模型或 Agent 的成功率。<\/strong><\/p>"}</script>
<script id="data-doc-d17159d1f2d" type="application/json">{"html":"<h1>Transformer 手写：运行与练习<\/h1>\n<p>先看第 21 章 <a class=\"ref\" href=\"#q-TH01\">TH01<\/a>。你只需要能读 Python 函数、列表与类；不需要显卡、模型账号或下载训练语料。网页可直接阅读和操作可视化，只有运行 Python 实验时才需要下面的环境。<\/p>\n<h2>第一次运行<\/h2>\n<p>在当前学习目录打开 PowerShell。新建独立环境，不改其他项目的依赖。以下版本与本轮实际检查一致：Python 3.12、PyTorch 2.14.0 CPU。<\/p>\n<pre><code class=\"language-powershell\">python -m venv .venv-transformer\n.\\.venv-transformer\\Scripts\\python.exe -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu\n.\\.venv-transformer\\Scripts\\python.exe -m pip install numpy\n.\\.venv-transformer\\Scripts\\python.exe -X utf8 03_代码实验/transformer_handwrite.py\n.\\.venv-transformer\\Scripts\\python.exe -X utf8 03_代码实验/test_transformer_handwrite.py\n<\/code><\/pre>\n<p>首次安装需要联网；后面的实验在 CPU 本地完成。如果系统找不到 python，先安装 Python 3.12 并重新打开终端。已有合适 PyTorch 环境也可直接运行最后两个文件；换版本后应重新跑测试。<\/p>\n<p>本次助手实际验证环境保存在 <code>work/transformer-visual-revision/venv<\/code>，你在当前电脑上也可用它的 <code>Scripts/python.exe<\/code> 运行。运行过程中打印版本、损失和生成序列，不保存大模型权重。<\/p>\n<h2>先看怎样才算跑通<\/h2>\n<p>完整实现学习 0→1→…→7→0 的循环。预期输入 [0,1,2] 后续写出 [3,4,5,6,7,0]，训练损失显著下降。具体实测数值保存在同目录 <code>Transformer手写运行结果.json<\/code>；不同运行环境可能出现小幅数值差异。<\/p>\n<p>这只是检查训练链路能工作的一道小题；没有自然语言数据、验证集或泛化成绩。TinySeq2Seq 做了前向、反向、因果性和 padding 检查，没有训练成翻译模型。<\/p>\n<h2>五次练习，每次有明确产物<\/h2>\n<table>\n<thead>\n<tr>\n<th>次数<\/th>\n<th>阅读<\/th>\n<th>自己写出<\/th>\n<th>验收<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><a class=\"ref\" href=\"#q-TH01\">TH01<\/a>—<a class=\"ref\" href=\"#q-TH05\">TH05<\/a><\/td>\n<td>attention 与两种 mask<\/td>\n<td>小数值可手算；未来权重为 0<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><a class=\"ref\" href=\"#q-TH06\">TH06<\/a>—<a class=\"ref\" href=\"#q-TH10\">TH10<\/a><\/td>\n<td>MultiHeadAttention、Norm、FFN、Block<\/td>\n<td>与参考层对照；拆合头顺序不变<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><a class=\"ref\" href=\"#q-TH11\">TH11<\/a>—<a class=\"ref\" href=\"#q-TH14\">TH14<\/a><\/td>\n<td>TinyLanguageModel 与 TinySeq2Seq<\/td>\n<td>输出维度和双
