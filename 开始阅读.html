i mathvariant=\"normal\">i<\/mi><mi mathvariant=\"normal\">n<\/mi><\/mrow><\/msub><\/mrow><\/msup><\/mrow><\/math><\/div>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>B<\/mi><mo>∈<\/mo><msup><mi mathvariant=\"normal\">ℝ<\/mi><mrow><msub><mi>d<\/mi><mrow><mi mathvariant=\"normal\">o<\/mi><mi mathvariant=\"normal\">u<\/mi><mi mathvariant=\"normal\">t<\/mi><\/mrow><\/msub><mi>×<\/mi><mi>r<\/mi><\/mrow><\/msup><mo>.<\/mo><\/mrow><\/math><\/div>\n<p>新增参数为 r(d_in+d_out)。当 d_in=d_out=4096、r=8 时为 65,536，原矩阵为 16,777,216，比例约 0.39%，忽略偏置。<\/p>\n<p><strong>追问：A 随机、B 为零时，为什么一开始 A 梯度为零？<\/strong> ΔW=BA；对 A 的梯度含 B，而 B=0。B 首步可有梯度，随后 A 也开始更新。<\/p>\n<p><strong>易错：<\/strong> A/B 命名可能被实现交换，答题先给形状。依据：<a class=\"ref\" href=\"#source-S06\">S06<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-SFT04" type="application/json">{"body":"### 补丁有多大、力度多强、贴在哪里？\n\nrank 影响补丁能表达多复杂的变化；alpha 参与调整补丁输出的缩放；作用层决定在哪些权重上加补丁。\n\n不要把三个旋钮混成“越大越强”。补丁容量变大后，学习率、数据量和过拟合风险也要重新检查。\n\n**直答：** 分别控制更新容量、缩放和位置，在固定数据与预算下逐项比较，并记录具体实现采用的缩放公式。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** rank 控制增量表达容量；alpha 控制缩放；作用层决定能改变哪些计算。三者需要联合看。\n\n**展开：** 普通 LoRA 常用 α/r，其他变体可有不同缩放。先固定数据和预算，比较低/中 rank、attention-only 与包含 MLP 的设置，同时记录质量、参数量、显存与时延。\n\n**追问：rank 越大越好吗？** 不保证。小数据可能过拟合，训练成本上升；任务是否需要更高秩要由验证集回答。\n\n**易错：** 不能换 rank 时忘记实际缩放改变；也不能只报告“LoRA 微调”却说不出 target modules。依据：S06。","html":"<h3>补丁有多大、力度多强、贴在哪里？<\/h3>\n<p>rank 影响补丁能表达多复杂的变化；alpha 参与调整补丁输出的缩放；作用层决定在哪些权重上加补丁。<\/p>\n<p>不要把三个旋钮混成“越大越强”。补丁容量变大后，学习率、数据量和过拟合风险也要重新检查。<\/p>\n<p><strong>直答：<\/strong> 分别控制更新容量、缩放和位置，在固定数据与预算下逐项比较，并记录具体实现采用的缩放公式。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> rank 控制增量表达容量；alpha 控制缩放；作用层决定能改变哪些计算。三者需要联合看。<\/p>\n<p><strong>展开：<\/strong> 普通 LoRA 常用 α/r，其他变体可有不同缩放。先固定数据和预算，比较低/中 rank、attention-only 与包含 MLP 的设置，同时记录质量、参数量、显存与时延。<\/p>\n<p><strong>追问：rank 越大越好吗？<\/strong> 不保证。小数据可能过拟合，训练成本上升；任务是否需要更高秩要由验证集回答。<\/p>\n<p><strong>易错：<\/strong> 不能换 rank 时忘记实际缩放改变；也不能只报告“LoRA 微调”却说不出 target modules。依据：<a class=\"ref\" href=\"#source-S06\">S06<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-SFT05" type="application/json">{"body":"### 训练时分开改，交付时合成一张表\n\nLoRA 的线性层可以写成“原权重产生的结果＋补丁产生的结果”。在满足相应条件时，先把补丁矩阵加进原权重，以后直接使用合好的权重，就不必每次额外走补丁分支。\n\n这像把批注落实到最终稿。量化、多适配器切换等设置还要检查精度和具体实现。\n\n**直答：** 对可合并的线性 LoRA，先把更新量加到原权重，就能用一个合并后的矩阵推理；合并效果要做数值与任务验证。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 对兼容的线性层可把低秩增量加回原权重，得到 W′=W+ΔW，再按普通线性层计算。\n\n**展开：** 合并要匹配基座版本、精度与适配器缩放。量化基座重新合并/量化可能产生额外数值误差；多个 adapter 并不是随便相加就能保持各任务性能。\n\n**追问：何时不合并？** 需要请求级切换多个适配器时，保留独立 adapter 更灵活，但调度与额外计算代价要实测。\n\n**易错：** 合并减少分支不意味着模型从未发生数值变化。依据：S06。","html":"<h3>训练时分开改，交付时合成一张表<\/h3>\n<p>LoRA 的线性层可以写成“原权重产生的结果＋补丁产生的结果”。在满足相应条件时，先把补丁矩阵加进原权重，以后直接使用合好的权重，就不必每次额外走补丁分支。<\/p>\n<p>这像把批注落实到最终稿。量化、多适配器切换等设置还要检查精度和具体实现。<\/p>\n<p><strong>直答：<\/strong> 对可合并的线性 LoRA，先把更新量加到原权重，就能用一个合并后的矩阵推理；合并效果要做数值与任务验证。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 对兼容的线性层可把低秩增量加回原权重，得到 W′=W+ΔW，再按普通线性层计算。<\/p>\n<p><strong>展开：<\/strong> 合并要匹配基座版本、精度与适配器缩放。量化基座重新合并/量化可能产生额外数值误差；多个 adapter 并不是随便相加就能保持各任务性能。<\/p>\n<p><strong>追问：何时不合并？<\/strong> 需要请求级切换多个适配器时，保留独立 adapter 更灵活，但调度与额外计算代价要实测。<\/p>\n<p><strong>易错：<\/strong> 合并减少分支不意味着模型从未发生数值变化。依据：<a class=\"ref\" href=\"#source-S06\">S06<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-SFT06" type="application/json">{"body":"### 把大底座压缩存放，另外训练小补丁\n\nQLoRA 的直觉是：庞大的基础模型用较低位数表示并冻结，学习主要发生在 LoRA 小矩阵上。这样可以节省基础权重的存储。\n\n低位存储不代表所有计算都在 4 bit 中进行，更不代表全部基础参数都在被更新。\n\n**直答：** QLoRA 结合量化存放的冻结基座和可训练 LoRA；要分清权重存储精度、计算精度和实际更新的参数。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 不是。典型 QLoRA 把冻结基座以低比特存储，在计算时按需要反量化，训练较高精度的低秩适配器。\n\n**展开：** 论文包含 NF4、双重量化与分页优化器等设计。低比特权重存储、矩阵乘计算精度、梯度和优化器状态精度是不同概念。\n\n**追问：4 bit 模型显存就是参数数÷2 字节吗？** 那只是裸权重粗估，还需量化元数据、未量化层、激活、适配器和运行缓冲。\n\n**易错：** QLoRA 不等于所有矩阵乘都在原生 int4 中完成。依据：S07。","html":"<h3>把大底座压缩存放，另外训练小补丁<\/h3>\n<p>QLoRA 的直觉是：庞大的基础模型用较低位数表示并冻结，学习主要发生在 LoRA 小矩阵上。这样可以节省基础权重的存储。<\/p>\n<p>低位存储不代表所有计算都在 4 bit 中进行，更不代表全部基础参数都在被更新。<\/p>\n<p><strong>直答：<\/strong> QLoRA 结合量化存放的冻结基座和可训练 LoRA；要分清权重存储精度、计算精度和实际更新的参数。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 不是。典型 QLoRA 把冻结基座以低比特存储，在计算时按需要反量化，训练较高精度的低秩适配器。<\/p>\n<p><strong>展开：<\/strong> 论文包含 NF4、双重量化与分页优化器等设计。低比特权重存储、矩阵乘计算精度、梯度和优化器状态精度是不同概念。<\/p>\n<p><strong>追问：4 bit 模型显存就是参数数÷2 字节吗？<\/strong> 那只是裸权重粗估，还需量化元数据、未量化层、激活、适配器和运行缓冲。<\/p>\n<p><strong>易错：<\/strong> QLoRA 不等于所有矩阵乘都在原生 int4 中完成。依据：<a class=\"ref\" href=\"#source-S07\">S07<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-SFT07" type="application/json">{"body":"### 学生成绩不动，先检查题目有没有发对\n\nloss 不下降，先看模型是否真的收到了正确输入和答案、答案位置有没有计分、参数是否参与更新。把一两条干净样本反复训练，看能否学会，是很有帮助的小检查。\n\n如果最小例子也学不会，再查学习率、数值异常和程序连接。直接扩大模型或跑更久，可能只会放大浪费。\n\n**直答：** 按“数据与标签—计分位置—参数与梯度—学习率和数值”的顺序排查，先验证模型能学会极小数据集。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 先验证数据和监督是否正确，再检查梯度、优化器和学习率，最后才扩大模型或算力。\n\n**展开：** 取极小样本尝试过拟合；检查模板还原、label shift、有效 token 数、EOS、截断；核查 requires_grad、optimizer 参数、梯度范数与实际学习率。确认训练模式、精度溢出和 NaN 来源。\n\n**追问：几条样本也记不住说明什么？** 高概率是实现、数据或优化问题，尚不能归因于泛化能力不足。\n\n**易错：** loss 为零也可能是所有 label 被忽略，不一定训练完美。","html":"<h3>学生成绩不动，先检查题目有没有发对<\/h3>\n<p>loss 不下降，先看模型是否真的收到了正确输入和答案、答案位置有没有计分、参数是否参与更新。把一两条干净样本反复训练，看能否学会，是很有帮助的小检查。<\/p>\n<p>如果最小例子也学不会，再查学习率、数值异常和程序连接。直接扩大模型或跑更久，可能只会放大浪费。<\/p>\n<p><strong>直答：<\/strong> 按“数据与标签—计分位置—参数与梯度—学习率和数值”的顺序排查，先验证模型能学会极小数据集。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 先验证数据和监督是否正确，再检查梯度、优化器和学习率，最后才扩大模型或算力。<\/p>\n<p><strong>展开：<\/strong> 取极小样本尝试过拟合；检查模板还原、label shift、有效 token 数、EOS、截断；核查 requires_grad、optimizer 参数、梯度范数与实际学习率。确认训练模式、精度溢出和 NaN 来源。<\/p>\n<p><strong>追问：几条样本也记不住说明什么？<\/strong> 高概率是实现、数据或优化问题，尚不能归因于泛化能力不足。<\/p>\n<p><strong>易错：<\/strong> loss 为零也可能是所有 label 被忽略，不一定训练完美。<\/p><\/div><\/details>"}</script>
<script id="data-q-SFT08" type="application/json">{"body":"### 跟着答案填空容易，自己往下写可能出错\n\n训练时前文常含真实答案；生成时前文是模型自己刚写出的内容。一步写偏，后面可能继续偏。模板、结束符或生成参数不一致，也会导致重复和停不下来。\n\n因此不仅看训练扣分，还要真的让模型独立回答几道固定问题，保存完整输出检查。\n\n**直答：** 低训练损失不保证自由生成正常；先对齐训练与生成的模板、结束符和分词，再检查数据重复与生成设置。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 对齐训练和推理的 tokenizer、chat template、特殊 token、EOS 与解码设置，再检查数据污染和过拟合。\n\n**展开：** 比较同一输入在基座、SFT checkpoint 的 greedy 输出；核查词表/embedding 尺寸、padding side、模板重复插入和结束条件。统计重复片段、异常长度与语言混杂，不只看一条输出。\n\n**追问：调高 repetition penalty 就解决了吗？** 可能掩盖问题，也可能破坏代码、专有名词和必要复述，应先定位。\n\n**易错：** 训练验证都使用错误模板，也能得到看似一致的低 loss。","html":"<h3>跟着答案填空容易，自己往下写可能出错<\/h3>\n<p>训练时前文常含真实答案；生成时前文是模型自己刚写出的内容。一步写偏，后面可能继续偏。模板、结束符或生成参数不一致，也会导致重复和停不下来。<\/p>\n<p>因此不仅看训练扣分，还要真的让模型独立回答几道固定问题，保存完整输出检查。<\/p>\n<p><strong>直答：<\/strong> 低训练损失不保证自由生成正常；先对齐训练与生成的模板、结束符和分词，再检查数据重复与生成设置。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 对齐训练和推理的 tokenizer、chat template、特殊 token、EOS 与解码设置，再检查数据污染和过拟合。<\/p>\n<p><strong>展开：<\/strong> 比较同一输入在基座、SFT checkpoint 的 greedy 输出；核查词表/embedding 尺寸、padding side、模板重复插入和结束条件。统计重复片段、异常长度与语言混杂，不只看一条输出。<\/p>\n<p><strong>追问：调高 repetition penalty 就解决了吗？<\/strong> 可能掩盖问题，也可能破坏代码、专有名词和必要复述，应先定位。<\/p>\n<p><strong>易错：<\/strong> 训练验证都使用错误模板，也能得到看似一致的低 loss。<\/p><\/div><\/details>"}</script>
<script id="data-q-SFT09" type="application/json">{"body":"### 100 条短句和 100 篇长文，训练量差很多\n\n模型逐 token 计算。只报“训练了 1 万条”看不出实际工作量：长度越长，处理的 token 更多，注意力成本和显存也可能更大。\n\n还要区分总 token 与真正参与损失的 token。很长的用户输入和很短的助手回答，不应被统计成同样长度的回答监督。\n\n**直答：** token 数和长度分布决定真实计算与监督规模；比较实验时同时报告样本、总 token、有效计分 token 和长度截断。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** token 决定主要计算与监督量；长样本会影响 batch 权重、显存、截断和吞吐。\n\n**展开：** 报告样本数同时报告有效训练 token、prompt/completion 分布和截断比例。内容安全长对话若总在关键风险前被截断，模型学不到跨轮信息。\n\n**追问：动态 padding 与 packing 差别？** 前者按批内最大长度补齐；后者把独立短样本装进同一序列，涉及边界语义。\n\n**易错：** 训练速度从 samples/s 提高，可能只是样本更短；应同时看有效 tokens/s。","html":"<h3>100 条短句和 100 篇长文，训练量差很多<\/h3>\n<p>模型逐 token 计算。只报“训练了 1 万条”看不出实际工作量：长度越长，处理的 token 更多，注意力成本和显存也可能更大。<\/p>\n<p>还要区分总 token 与真正参与损失的 token。很长的用户输入和很短的助手回答，不应被统计成同样长度的回答监督。<\/p>\n<p><strong>直答：<\/strong> token 数和长度分布决定真实计算与监督规模；比较实验时同时报告样本、总 token、有效计分 token 和长度截断。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> token 决定主要计算与监督量；长样本会影响 batch 权重、显存、截断和吞吐。<\/p>\n<p><strong>展开：<\/strong> 报告样本数同时报告有效训练 token、prompt/completion 分布和截断比例。内容安全长对话若总在关键风险前被截断，模型学不到跨轮信息。<\/p>\n<p><strong>追问：动态 padding 与 packing 差别？<\/strong> 前者按批内最大长度补齐；后者把独立短样本装进同一序列，涉及边界语义。<\/p>\n<p><strong>易错：<\/strong> 训练速度从 samples/s 提高，可能只是样本更短；应同时看有效 tokens/s。<\/p><\/div><\/details>"}</script>
<script id="data-q-SFT10" type="application/json">{"body":"### 不一定是最后一版作业最好\n\ncheckpoint 是训练途中保存的模型快照。后面的快照可能训练分更好，却过拟合、误拒更多，或忘记了通用能力。\n\n应预先规定用哪些开发集指标选快照，并保留最终测试集做独立判断。早停就是发现继续训练收益不足或退化时及时停下。\n\n**直答：** 用事先确定的验证指标和约束选择训练快照，不能只选训练 loss 最低或最后保存的那一个。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 按冻结的多指标选择规则决定，而非只取训练 loss 最低的版本。\n\n**展开：** 内容安全可在满足最低长尾召回和正常响应率的约束下，优化主指标与成本；RAG 则约束引用可靠与无证据拒答。保存各 checkpoint 的配置、数据快照和生成设置。\n\n**追问：如果不同指标互相冲突？** 呈现 Pareto 候选与业务约束，说明选择代价；不要临时改指标把某个 checkpoint 包装成最好。\n\n**易错：** 使用最终测试集做早停会泄漏选择信息。","html":"<h3>不一定是最后一版作业最好<\/h3>\n<p>checkpoint 是训练途中保存的模型快照。后面的快照可能训练分更好，却过拟合、误拒更多，或忘记了通用能力。<\/p>\n<p>应预先规定用哪些开发集指标选快照，并保留最终测试集做独立判断。早停就是发现继续训练收益不足或退化时及时停下。<\/p>\n<p><strong>直答：<\/strong> 用事先确定的验证指标和约束选择训练快照，不能只选训练 loss 最低或最后保存的那一个。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 按冻结的多指标选择规则决定，而非只取训练 loss 最低的版本。<\/p>\n<p><strong>展开：<\/strong> 内容安全可在满足最低长尾召回和正常响应率的约束下，优化主指标与成本；RAG 则约束引用可靠与无证据拒答。保存各 checkpoint 的配置、数据快照和生成设置。<\/p>\n<p><strong>追问：如果不同指标互相冲突？<\/strong> 呈现 Pareto 候选与业务约束，说明选择代价；不要临时改指标把某个 checkpoint 包装成最好。<\/p>\n<p><strong>易错：<\/strong> 使用最终测试集做早停会泄漏选择信息。<\/p><\/div><\/details>"}</script>
<script id="data-q-SFT11" type="application/json">{"body":"### “照着好答案学”和“分清谁更好”有何不同？\n\nSFT 直接给一份好答案，告诉模型怎样写；偏好优化给出两个答案或好坏反馈，让模型学习哪些输出更值得出现。\n\n例如两份回答都通顺，但一份更符合安全规则，仅做示范训练和直接学习两者差异，提供的监督信息不同。是否需要后者，要看实际短板和反馈。\n\n**直答：** SFT 学示范行为，偏好优化利用优劣关系调整生成倾向；它们可以配合，也可能在某些任务上只用 SFT 就已足够。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 强 SFT 是必要基线，但只模仿 chosen 不一定充分利用“为什么 rejected 更差”的相对信息。\n\n**展开：** 若数据只有可靠好答案、差答案质量参差，SFT 可能更合适；若有同题可比的偏好对，DPO/SimPO 可利用排序信号。应比较基座、SFT、继续 SFT、偏好优化，控制额外训练预算。\n\n**追问：偏好算法赢了，是不是算法必然优越？** 可能来自更多数据、不同标注器和生成候选，应做配对数据、长度控制等消融。\n\n**易错：** 不要把所有 SFT 回答叫“标准答案”，开放任务可能有多个合理解。","html":"<h3>“照着好答案学”和“分清谁更好”有何不同？<\/h3>\n<p>SFT 直接给一份好答案，告诉模型怎样写；偏好优化给出两个答案或好坏反馈，让模型学习哪些输出更值得出现。<\/p>\n<p>例如两份回答都通顺，但一份更符合安全规则，仅做示范训练和直接学习两者差异，提供的监督信息不同。是否需要后者，要看实际短板和反馈。<\/p>\n<p><strong>直答：<\/strong> SFT 学示范行为，偏好优化利用优劣关系调整生成倾向；它们可以配合，也可能在某些任务上只用 SFT 就已足够。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 强 SFT 是必要基线，但只模仿 chosen 不一定充分利用“为什么 rejected 更差”的相对信息。<\/p>\n<p><strong>展开：<\/strong> 若数据只有可靠好答案、差答案质量参差，SFT 可能更合适；若有同题可比的偏好对，DPO/SimPO 可利用排序信号。应比较基座、SFT、继续 SFT、偏好优化，控制额外训练预算。<\/p>\n<p><strong>追问：偏好算法赢了，是不是算法必然优越？<\/strong> 可能来自更多数据、不同标注器和生成候选，应做配对数据、长度控制等消融。<\/p>\n<p><strong>易错：<\/strong> 不要把所有 SFT 回答叫“标准答案”，开放任务可能有多个合理解。<\/p><\/div><\/details>"}</script>
<script id="data-q-SFT12" type="application/json">{"body":"### 过两周，还能做出同一道菜吗？\n\n如果只记得“用了 LoRA，效果不错”，却没保存数据版本、模型版本、模板、参数和随机种子，就像做菜只记得“加了一些调料”，难以复现。\n\n日志还应记录训练何时开始、花了多少资源、最终选择哪个快照，以及怎样测试。\n\n**直答：** 保存能重建训练与评测条件的记录：模型、数据、模板、配置、代码版本、随机性设置、资源和结果，而不只是最好分数。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 能从记录重建数据、模型、配置、运行环境和选择过程。\n\n**展开：** 记录模型 revision、tokenizer/template、数据哈希及切分、随机种子、软件版本、硬件、精度、并行、batch/累积、优化器、学习率、保存策略、主评测及日志。附真实开始结束时间、有效 token 与峰值显存。\n\n**追问：只有 config 就可复现吗？** 还需要代码版本、数据可达性、依赖和评测协议；非确定性算子可能使逐位复现不现实，应说明统计复现标准。\n\n**易错：** 不能把没有实际运行的配置写成训练结果。","html":"<h3>过两周，还能做出同一道菜吗？<\/h3>\n<p>如果只记得“用了 LoRA，效果不错”，却没保存数据版本、模型版本、模板、参数和随机种子，就像做菜只记得“加了一些调料”，难以复现。<\/p>\n<p>日志还应记录训练何时开始、花了多少资源、最终选择哪个快照，以及怎样测试。<\/p>\n<p><strong>直答：<\/strong> 保存能重建训练与评测条件的记录：模型、数据、模板、配置、代码版本、随机性设置、资源和结果，而不只是最好分数。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 能从记录重建数据、模型、配置、运行环境和选择过程。<\/p>\n<p><strong>展开：<\/strong> 记录模型 revision、tokenizer/template、数据哈希及切分、随机种子、软件版本、硬件、精度、并行、batch/累积、优化器、学习率、保存策略、主评测及日志。附真实开始结束时间、有效 token 与峰值显存。<\/p>\n<p><strong>追问：只有 config 就可复现吗？<\/strong> 还需要代码版本、数据可达性、依赖和评测协议；非确定性算子可能使逐位复现不现实，应说明统计复现标准。<\/p>\n<p><strong>易错：<\/strong> 不能把没有实际运行的配置写成训练结果。<\/p><\/div><\/details>"}</script>
<script id="data-q-P01" type="application/json">{"body":"### 先会写答案，再学哪些答案更受认可\n\n同一个问题，模型可能给出许多通顺但质量不同的回答。RLHF 就是利用人的反馈调整这种选择倾向。\n\n经典路线先训练一个奖励模型，像学出来的评审员，再根据它的分数优化生成模型。DPO 则在特定数学假设下，直接用好坏回答对训练生成模型，不另训练独立评审员。\n\n**直答：** 人类反馈提供好坏标准，奖励模型把标准变成分数，策略优化调整模型怎样生成；DPO 提供了直接从偏好训练生成模型的一条路线。\n\n### 进一步：公式、边界与追问\n\n**本章进阶约定与范围：**\n\n定位：后训练与内容安全主投岗位的核心章节。先能说清“数据有什么反馈”，再谈算法。x 为同一问题，y_w/y_l 为较优/较差回答，π_ref 为固定参考策略。\n\n**技术表述：** RLHF 利用人类反馈优化模型。经典流程先从偏好训练奖励模型，再优化策略；DPO 等方法用特定推导把偏好学习直接写成策略损失。\n\n**展开：** 奖励模型回答“哪个回答更好”，策略模型负责生成。人类偏好数据、评审模型标签与程序可验证奖励是不同反馈来源，可靠性不能混同。\n\n**追问：DPO 没有显式 reward model 就没有 reward 吗？** 它通过策略与参考策略的 log 概率比定义隐式奖励，不额外训练一个独立评分网络。\n\n**易错：** RLHF 是方法框架，不等于 PPO 单个优化器。依据：S08、S11。","html":"<h3>先会写答案，再学哪些答案更受认可<\/h3>\n<p>同一个问题，模型可能给出许多通顺但质量不同的回答。RLHF 就是利用人的反馈调整这种选择倾向。<\/p>\n<p>经典路线先训练一个奖励模型，像学出来的评审员，再根据它的分数优化生成模型。DPO 则在特定数学假设下，直接用好坏回答对训练生成模型，不另训练独立评审员。<\/p>\n<p><strong>直答：<\/strong> 人类反馈提供好坏标准，奖励模型把标准变成分数，策略优化调整模型怎样生成；DPO 提供了直接从偏好训练生成模型的一条路线。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>本章进阶约定与范围：<\/strong><\/p>\n<p>定位：后训练与内容安全主投岗位的核心章节。先能说清“数据有什么反馈”，再谈算法。x 为同一问题，y_w/y_l 为较优/较差回答，π_ref 为固定参考策略。<\/p>\n<p><strong>技术表述：<\/strong> RLHF 利用人类反馈优化模型。经典流程先从偏好训练奖励模型，再优化策略；DPO 等方法用特定推导把偏好学习直接写成策略损失。<\/p>\n<p><strong>展开：<\/strong> 奖励模型回答“哪个回答更好”，策略模型负责生成。人类偏好数据、评审模型标签与程序可验证奖励是不同反馈来源，可靠性不能混同。<\/p>\n<p><strong>追问：DPO 没有显式 reward model 就没有 reward 吗？<\/strong> 它通过策略与参考策略的 log 概率比定义隐式奖励，不额外训练一个独立评分网络。<\/p>\n<p><strong>易错：<\/strong> RLHF 是方法框架，不等于 PPO 单个优化器。依据：<a class=\"ref\" href=\"#source-S08\">S08<\/a>、<a class=\"ref\" href=\"#source-S11\">S11<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-P02" type="application/json">{"body":"### 比较两篇作文，题目应该相同\n\n拿“解释交叉熵”的好回答和“写旅游攻略”的差回答相比，不容易判断模型该学到什么：差异可能来自题目本身。\n\n偏好对通常针对同一问题、同一上下文，标记哪份更好。chosen 是较优回答，rejected 是较差回答，不代表一份完美、一份毫无价值。\n\n**直答：** 同题比较尽量排除问题和条件差异，让训练信号集中到回答质量；标签还应说明依据，避免只学到长度或格式捷径。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 要比较相同条件下的回答质量，才能把排序归因于回答选择而非题目难度或任务差异。\n\n**展开：** 同一个 prompt、工具条件、上下文、政策版本下构造 chosen/rejected；控制明显的格式、长度和语种捷径。偏好不明确时允许平局、丢弃或保留不确定性，不强行二选一。\n\n**追问：内容安全里所有拒答都当 chosen 行吗？** 不行。正常请求的合理回答、危险请求的恰当处理、模糊请求的澄清都应覆盖。\n\n**易错：** “人工通过/拦截”常是单样本业务标签，不能未经语义核查直接拼成同题偏好对。","html":"<h3>比较两篇作文，题目应该相同<\/h3>\n<p>拿“解释交叉熵”的好回答和“写旅游攻略”的差回答相比，不容易判断模型该学到什么：差异可能来自题目本身。<\/p>\n<p>偏好对通常针对同一问题、同一上下文，标记哪份更好。chosen 是较优回答，rejected 是较差回答，不代表一份完美、一份毫无价值。<\/p>\n<p><strong>直答：<\/strong> 同题比较尽量排除问题和条件差异，让训练信号集中到回答质量；标签还应说明依据，避免只学到长度或格式捷径。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 要比较相同条件下的回答质量，才能把排序归因于回答选择而非题目难度或任务差异。<\/p>\n<p><strong>展开：<\/strong> 同一个 prompt、工具条件、上下文、政策版本下构造 chosen/rejected；控制明显的格式、长度和语种捷径。偏好不明确时允许平局、丢弃或保留不确定性，不强行二选一。<\/p>\n<p><strong>追问：内容安全里所有拒答都当 chosen 行吗？<\/strong> 不行。正常请求的合理回答、危险请求的恰当处理、模糊请求的澄清都应覆盖。<\/p>\n<p><strong>易错：<\/strong> “人工通过/拦截”常是单样本业务标签，不能未经语义核查直接拼成同题偏好对。<\/p><\/div><\/details>"}</script>
<script id="data-q-P03" type="application/json">{"body":"### DPO 推导先从一个朴素愿望开始\n\n我们想让模型多写高质量答案，但又不希望它为了迎合评分而彻底变样。因此目标中有两部分：回答越好越加分，偏离参考模型的概率分布越多越扣分。\n\n这里的 KL 就是 M02 讲过的分布差异量，不是在逐个比较参数。β 控制这项偏离惩罚的力度。\n\n推导会得到：理想模型在原有倾向上，更多偏向高奖励回答。再把这个关系倒过来，就能用“新模型相对参考模型的概率变化”表达隐式奖励。\n\n**直答：** DPO 从“提高奖励，同时惩罚偏离参考策略”出发，先求理想策略与奖励的关系，再把奖励改写成模型概率比，转成直接可训练的偏好损失。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 先求带参考策略 KL 惩罚的最优策略，再反解奖励，放入偏好概率模型。\n\n固定 x，考虑：\n\n$$\\max_\\pi\\ \\sum_y\\pi(y|x)r(x,y)-\\beta\n\\sum_y\\pi(y|x)\\log\\frac{\\pi(y|x)}{\\pi_{\\rm ref}(y|x)},\\ \\beta>0.$$\n\n对概率归一化引入拉格朗日乘子，令对 π 的导数为零：\n\n$$r-\\beta(\\log(\\pi/\\pi_{\\rm ref})+1)+\\lambda=0.$$\n\n归一化后得到：\n\n$$\\pi^*(y|x)=\\frac{\\pi_{\\rm ref}(y|x)e^{r(x,y)/\\beta}}{Z(x)}$$\n\n$$r(x,y)=\\beta\\log\\frac{\\pi^*(y|x)}{\\pi_{\\rm ref}(y|x)}+\\beta\\log Z(x).$$\n\n**追问：假设是什么？** 参考策略在相关输出上有支持；奖励有限且可归一化；这是理想策略空间中的最优关系，有限神经网络训练不保证达到该最优解。\n\n**易错：** β 在这个目标中是 KL 惩罚系数，不能把“β 越大”机械解释成“越激进”。依据：S08。","html":"<h3>DPO 推导先从一个朴素愿望开始<\/h3>\n<p>我们想让模型多写高质量答案，但又不希望它为了迎合评分而彻底变样。因此目标中有两部分：回答越好越加分，偏离参考模型的概率分布越多越扣分。<\/p>\n<p>这里的 KL 就是 <a class=\"ref\" href=\"#q-M02\">M02<\/a> 讲过的分布差异量，不是在逐个比较参数。β 控制这项偏离惩罚的力度。<\/p>\n<p>推导会得到：理想模型在原有倾向上，更多偏向高奖励回答。再把这个关系倒过来，就能用“新模型相对参考模型的概率变化”表达隐式奖励。<\/p>\n<p><strong>直答：<\/strong> DPO 从“提高奖励，同时惩罚偏离参考策略”出发，先求理想策略与奖励的关系，再把奖励改写成模型概率比，转成直接可训练的偏好损失。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 先求带参考策略 KL 惩罚的最优策略，再反解奖励，放入偏好概率模型。<\/p>\n<p>固定 x，考虑：<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mo>max<\/mo><mi>π<\/mi><\/msub><mtext> <\/mtext><munder><mo>∑<\/mo><mi>y<\/mi><\/munder><mi>π<\/mi><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mi>r<\/mi><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo>,<\/mo><mi>y<\/mi><mo stretchy=\"false\">)<\/mo><mo>−<\/mo><mi>β<\/mi><munder><mo>∑<\/mo><mi>y<\/mi><\/munder><mi>π<\/mi><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mi>log<\/mi><mfrac><mrow><mi>π<\/mi><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><mrow><msub><mi>π<\/mi><mrow><mi mathvariant=\"normal\">r<\/mi><mi mathvariant=\"normal\">e<\/mi><mi mathvariant=\"normal\">f<\/mi><\/mrow><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/mfrac><mo>,<\/mo><mtext> <\/mtext><mi>β<\/mi><mo>&gt;<\/mo><mn>0<\/mn><mo>.<\/mo><\/mrow><\/math><\/div>\n<p>对概率归一化引入拉格朗日乘子，令对 π 的导数为零：<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>r<\/mi><mo>−<\/mo><mi>β<\/mi><mo stretchy=\"false\">(<\/mo><mi>log<\/mi><mo stretchy=\"false\">(<\/mo><mi>π<\/mi><mo>/<\/mo><msub><mi>π<\/mi><mrow><mi mathvariant=\"normal\">r<\/mi><mi mathvariant=\"normal\">e<\/mi><mi mathvariant=\"normal\">f<\/mi><\/mrow><\/msub><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><mn>1<\/mn><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><mi>λ<\/mi><mo>=<\/mo><mn>0<\/mn><mo>.<\/mo><\/mrow><\/math><\/div>\n<p>归一化后得到：<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msup><mi>π<\/mi><mo>*<\/mo><\/msup><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mfrac><mrow><msub><mi>π<\/mi><mrow><mi mathvariant=\"normal\">r<\/mi><mi mathvariant=\"normal\">e<\/mi><mi mathvariant=\"normal\">f<\/mi><\/mrow><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><msup><mi>e<\/mi><mrow><mi>r<\/mi><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo>,<\/mo><mi>y<\/mi><mo stretchy=\"false\">)<\/mo><mo>/<\/mo><mi>β<\/mi><\/mrow><\/msup><\/mrow><mrow><mi>Z<\/mi><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/mfrac><\/mrow><\/math><\/div>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>r<\/mi><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo>,<\/mo><mi>y<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mi>β<\/mi><mi>log<\/mi><mfrac><mrow><msup><mi>π<\/mi><mo>*<\/mo><\/msup><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><mrow><msub><mi>π<\/mi><mrow><mi mathvariant=\"normal\">r<\/mi><mi mathvariant=\"normal\">e<\/mi><mi mathvariant=\"normal\">f<\/mi><\/mrow><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/mfrac><mo>+<\/mo><mi>β<\/mi><mi>log<\/mi><mi>Z<\/mi><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo>.<\/mo><\/mrow><\/math><\/div>\n<p><strong>追问：假设是什么？<\/strong> 参考策略在相关输出上有支持；奖励有限且可归一化；这是理想策略空间中的最优关系，有限神经网络训练不保证达到该最优解。<\/p>\n<p><strong>易错：<\/strong> β 在这个目标中是 KL 惩罚系数，不能把“β 越大”机械解释成“越激进”。依据：<a class=\"ref\" href=\"#source-S08\">S08<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-P04" type="application/json">{"body":"### 原模型已经喜欢的答案，和新训练学到的偏好\n\n假设原模型就很喜欢模板化长回答。DPO 不只看当前模型觉得哪个答案更可能，还看这个倾向相对于参考模型改变了多少。\n\n损失里的 sigmoid 可以先理解成把差值转成“偏好较优答案”的分数，差值越大，训练扣分越小。Z 是让概率总和为 1 的归一化项；同一个问题下两份回答共享它，相减时就抵消了。\n\n**直答：** DPO 比较当前模型与参考模型各自对同题两个回答的概率差，再推动较优回答在这个相对比较中占优势；共享的归一化项因相减而消失。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 用 Bradley–Terry 模型 P(y_w≻y_l|x)=σ(r_w−r_l)，同题两项里的 β log Z(x) 相消。\n\n令：\n\n$$\\Delta_\\theta=\\log\\pi_\\theta(y_w|x)-\\log\\pi_\\theta(y_l|x)$$\n\n$$\\Delta_{\\rm ref}=\\log\\pi_{\\rm ref}(y_w|x)-\\log\\pi_{\\rm ref}(y_l|x).$$\n\n则：\n\n$$L_{\\rm DPO}=-\\mathbb E\\log\\sigma\\big(\\beta(\\Delta_\\theta-\\Delta_{\\rm ref})\\big).$$\n\n**展开：** 标准式使用回答 token 的序列 log 概率求和；把它改成平均不是无关紧要的实现优化，而是改变目标。\n\n**追问：实现时怎么稳？** 使用负 log-sigmoid 或 softplus(−z)，不直接先 sigmoid 再 log。\n\n**易错：** 参考模型应固定，不让其一起朝降低 loss 的方向更新。依据：S08。","html":"<h3>原模型已经喜欢的答案，和新训练学到的偏好<\/h3>\n<p>假设原模型就很喜欢模板化长回答。DPO 不只看当前模型觉得哪个答案更可能，还看这个倾向相对于参考模型改变了多少。<\/p>\n<p>损失里的 sigmoid 可以先理解成把差值转成“偏好较优答案”的分数，差值越大，训练扣分越小。Z 是让概率总和为 1 的归一化项；同一个问题下两份回答共享它，相减时就抵消了。<\/p>\n<p><strong>直答：<\/strong> DPO 比较当前模型与参考模型各自对同题两个回答的概率差，再推动较优回答在这个相对比较中占优势；共享的归一化项因相减而消失。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 用 Bradley–Terry 模型 P(y_w≻y_l|x)=σ(r_w−r_l)，同题两项里的 β log Z(x) 相消。<\/p>\n<p>令：<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>Δ<\/mi><mi>θ<\/mi><\/msub><mo>=<\/mo><mi>log<\/mi><msub><mi>π<\/mi><mi>θ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>y<\/mi><mi>w<\/mi><\/msub><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo>−<\/mo><mi>log<\/mi><msub><mi>π<\/mi><mi>θ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>y<\/mi><mi>l<\/mi><\/msub><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math><\/div>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>Δ<\/mi><mrow><mi mathvariant=\"normal\">r<\/mi><mi mathvariant=\"normal\">e<\/mi><mi mathvariant=\"normal\">f<\/mi><\/mrow><\/msub><mo>=<\/mo><mi>log<\/mi><msub><mi>π<\/mi><mrow><mi mathvariant=\"normal\">r<\/mi><mi mathvariant=\"normal\">e<\/mi><mi mathvariant=\"normal\">f<\/mi><\/mrow><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>y<\/mi><mi>w<\/mi><\/msub><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo>−<\/mo><mi>log<\/mi><msub><mi>π<\/mi><mrow><mi mathvariant=\"normal\">r<\/mi><mi mathvariant=\"normal\">e<\/mi><mi mathvariant=\"normal\">f<\/mi><\/mrow><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>y<\/mi><mi>l<\/mi><\/msub><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo>.<\/mo><\/mrow><\/math><\/div>\n<p>则：<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>L<\/mi><mrow><mi mathvariant=\"normal\">D<\/mi><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">O<\/mi><\/mrow><\/msub><mo>=<\/mo><mo>−<\/mo><mi mathvariant=\"normal\">𝔼<\/mi><mi>log<\/mi><mi>σ<\/mi><mo minsize=\"1.2em\" maxsize=\"1.2em\">(<\/mo><mi>β<\/mi><mo stretchy=\"false\">(<\/mo><msub><mi>Δ<\/mi><mi>θ<\/mi><\/msub><mo>−<\/mo><msub><mi>Δ<\/mi><mrow><mi mathvariant=\"normal\">r<\/mi><mi mathvariant=\"normal\">e<\/mi><mi mathvariant=\"normal\">f<\/mi><\/mrow><\/msub><mo stretchy=\"false\">)<\/mo><mo minsize=\"1.2em\" maxsize=\"1.2em\">)<\/mo><mo>.<\/mo><\/mrow><\/math><\/div>\n<p><strong>展开：<\/strong> 标准式使用回答 token 的序列 log 概率求和；把它改成平均不是无关紧要的实现优化，而是改变目标。<\/p>\n<p><strong>追问：实现时怎么稳？<\/strong> 使用负 log-sigmoid 或 softplus(−z)，不直接先 sigmoid 再 log。<\/p>\n<p><strong>易错：<\/strong> 参考模型应固定，不让其一起朝降低 loss 的方向更新。依据：<a class=\"ref\" href=\"#source-S08\">S08<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-P05" type="application/json">{"body":"### 它推动的是两个回答之间的相对关系\n\n训练希望“好答案相对差答案更占优势”。就像拉开两人的比分，既可以让领先者涨分，也可以让落后者降得更多。\n\n因此，即使 chosen 的绝对概率下降，只要 rejected 降得更多，DPO 损失仍可能下降。模型参数互相共享，实际更新也不是两个独立概率旋钮。\n\n**直答：** DPO 梯度推动较优与较差回答的相对 log 概率差增大；损失改善不保证每个好回答的绝对概率都逐步上升，需要联合检查生成结果。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 相对参考模型，提高 chosen 与 rejected 的 log 概率差；越是尚未满足偏好的样本，梯度权重通常越大。\n\n令 z=β(Δθ−Δref)，则：\n\n$$\\nabla_\\theta L=-\\beta\\sigma(-z)\n\\left[\\nabla_\\theta\\log\\pi_\\theta(y_w|x)-\\nabla_\\theta\\log\\pi_\\theta(y_l|x)\\right].$$\n\n**展开：** 这是单个偏好对的梯度表达。参数共享会耦合很多 token 和样本，因此不能保证每一步 chosen 的绝对概率都增加。\n\n**追问：chosen 和 rejected 概率都降低，loss 能下降吗？** 能。如果 rejected 降得更多，相对差仍增大。应监控两边 logprob、长度和实际生成评测。\n\n**易错：** preference accuracy 接近 100% 不证明开放生成已经优秀。依据：S08。","html":"<h3>它推动的是两个回答之间的相对关系<\/h3>\n<p>训练希望“好答案相对差答案更占优势”。就像拉开两人的比分，既可以让领先者涨分，也可以让落后者降得更多。<\/p>\n<p>因此，即使 chosen 的绝对概率下降，只要 rejected 降得更多，DPO 损失仍可能下降。模型参数互相共享，实际更新也不是两个独立概率旋钮。<\/p>\n<p><strong>直答：<\/strong> DPO 梯度推动较优与较差回答的相对 log 概率差增大；损失改善不保证每个好回答的绝对概率都逐步上升，需要联合检查生成结果。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 相对参考模型，提高 chosen 与 rejected 的 log 概率差；越是尚未满足偏好的样本，梯度权重通常越大。<\/p>\n<p>令 z=β(Δθ−Δref)，则：<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mo>∇<\/mo><mi>θ<\/mi><\/msub><mi>L<\/mi><mo>=<\/mo><mo>−<\/mo><mi>β<\/mi><mi>σ<\/mi><mo stretchy=\"false\">(<\/mo><mo>−<\/mo><mi>z<\/mi><mo stretchy=\"false\">)<\/mo><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">[<\/mo><msub><mo>∇<\/mo><mi>θ<\/mi><\/msub><mi>log<\/mi><msub><mi>π<\/mi><mi>θ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>y<\/mi><mi>w<\/mi><\/msub><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo>−<\/mo><msub><mo>∇<\/mo><mi>θ<\/mi><\/msub><mi>log<\/mi><msub><mi>π<\/mi><mi>θ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>y<\/mi><mi>l<\/mi><\/msub><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">]<\/mo><\/mrow><mo>.<\/mo><\/mrow><\/math><\/div>\n<p><strong>展开：<\/strong> 这是单个偏好对的梯度表达。参数共享会耦合很多 token 和样本，因此不能保证每一步 chosen 的绝对概率都增加。<\/p>\n<p><strong>追问：chosen 和 rejected 概率都降低，loss 能下降吗？<\/strong> 能。如果 rejected 降得更多，相对差仍增大。应监控两边 logprob、长度和实际生成评测。<\/p>\n<p><strong>易错：<\/strong> preference accuracy 接近 100% 不证明开放生成已经优秀。依据：<a class=\"ref\" href=\"#source-S08\">S08<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-P06" type="application/json">{"body":"### 留一份训练前的样子，才能知道改了多少\n\n参考模型像训练开始前的固定快照，提供“原来有多倾向这些答案”的基准。DPO 看当前模型相对这个基准的变化。\n\n它负责提供概率，不是在评价答案好坏，所以与奖励模型不同。参考概率有时可以提前算好存下；理论上需要参考策略，并不意味着训练全过程必须额外常驻一整套模型。\n\n**直答：** 参考模型提供固定的概率基准，让偏好优化具有相对原策略的约束含义。是否额外占用整份模型显存，要看预计算和参数共享等实现。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 为偏好学习提供相对基准，使目标来自一个不希望策略任意偏离原模型的 KL 正则化框架。\n\n**展开：** 通常选择 SFT 模型。原模型本来就偏好的答案，不会仅因绝对概率高就被当成已经学会新的偏好；DPO看的是相对参考的变化。\n\n**追问：一定额外常驻一整份参考模型吗？** 对固定数据、固定模板和固定参考模型，可以预计算参考 logprob；参数高效设置也有共享基座或切换适配器的实现。要据实际配置评估显存。\n\n**易错：** reference、old policy、reward model 是三个不同角色。依据：S08、S51；工程预计算需确认所用训练器。","html":"<h3>留一份训练前的样子，才能知道改了多少<\/h3>\n<p>参考模型像训练开始前的固定快照，提供“原来有多倾向这些答案”的基准。DPO 看当前模型相对这个基准的变化。<\/p>\n<p>它负责提供概率，不是在评价答案好坏，所以与奖励模型不同。参考概率有时可以提前算好存下；理论上需要参考策略，并不意味着训练全过程必须额外常驻一整套模型。<\/p>\n<p><strong>直答：<\/strong> 参考模型提供固定的概率基准，让偏好优化具有相对原策略的约束含义。是否额外占用整份模型显存，要看预计算和参数共享等实现。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 为偏好学习提供相对基准，使目标来自一个不希望策略任意偏离原模型的 KL 正则化框架。<\/p>\n<p><strong>展开：<\/strong> 通常选择 SFT 模型。原模型本来就偏好的答案，不会仅因绝对概率高就被当成已经学会新的偏好；DPO看的是相对参考的变化。<\/p>\n<p><strong>追问：一定额外常驻一整份参考模型吗？<\/strong> 对固定数据、固定模板和固定参考模型，可以预计算参考 logprob；参数高效设置也有共享基座或切换适配器的实现。要据实际配置评估显存。<\/p>\n<p><strong>易错：<\/strong> reference、old policy、reward model 是三个不同角色。依据：<a class=\"ref\" href=\"#source-S08\">S08<\/a>、<a class=\"ref\" href=\"#source-S51\">S51<\/a>；工程预计算需确认所用训练器。<\/p><\/div><\/details>"}</script>
<script id="data-q-P07" type="application/json">{"body":"### 一个旋钮，在公式和实际训练里都有作用\n\nβ 在理想目标中控制“偏离参考模型要罚多重”。到了实际 DPO 损失，它又参与缩放偏好差值和梯度。\n\n因此不能只背“β 大就学得更猛”或“β 大就一定更保守”，再把它当作训练结果的单调规律。学习率、数据差值和训练时长也会改变最终表现。\n\n**直答：** β 既有 KL 权衡含义，也影响实际损失的数值尺度；调节后要观察偏好表现、分布变化和业务质量，而不是套一个口诀。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 理论中 β 调整奖励与偏离参考的权衡；训练实现中它也缩放偏好 logits 和梯度，效果还受数据尺度、学习率与训练时长影响。\n\n**展开：** β 很小会使同样 log-ratio 差对应的分类 margin 小；β 很大又可能使 sigmoid 迅速饱和。不要把局部梯度现象直接等同于最终 KL 单调变化。\n\n**追问：怎么调？** 在相同数据和预算下网格选少量 β，记录验证偏好、KL 估计、长度、通用能力和安全双侧指标。\n\n**易错：** β=0 时标准 DPO 损失为常数 ln2，没有有效偏好梯度。依据：S08。","html":"<h3>一个旋钮，在公式和实际训练里都有作用<\/h3>\n<p>β 在理想目标中控制“偏离参考模型要罚多重”。到了实际 DPO 损失，它又参与缩放偏好差值和梯度。<\/p>\n<p>因此不能只背“β 大就学得更猛”或“β 大就一定更保守”，再把它当作训练结果的单调规律。学习率、数据差值和训练时长也会改变最终表现。<\/p>\n<p><strong>直答：<\/strong> β 既有 KL 权衡含义，也影响实际损失的数值尺度；调节后要观察偏好表现、分布变化和业务质量，而不是套一个口诀。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 理论中 β 调整奖励与偏离参考的权衡；训练实现中它也缩放偏好 logits 和梯度，效果还受数据尺度、学习率与训练时长影响。<\/p>\n<p><strong>展开：<\/strong> β 很小会使同样 log-ratio 差对应的分类 margin 小；β 很大又可能使 sigmoid 迅速饱和。不要把局部梯度现象直接等同于最终 KL 单调变化。<\/p>\n<p><strong>追问：怎么调？<\/strong> 在相同数据和预算下网格选少量 β，记录验证偏好、KL 估计、长度、通用能力和安全双侧指标。<\/p>\n<p><strong>易错：<\/strong> β=0 时标准 DPO 损失为常数 ln2，没有有效偏好梯度。依据：<a class=\"ref\" href=\"#source-S08\">S08<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-P08" type="application/json">{"body":"### 两篇长短不同的回答，怎样比“模型有多愿意写”？\n\n一句回答的总概率由每个 token 的概率相乘。越长，乘的项越多，数值往往越小。SimPO 先取 log 把乘法变成加法，再除以 token 数，比较平均分。\n\n它直接要求较优答案的平均分比差答案更高，并希望拉开一定间隔；不再减去参考模型的分数。β 负责缩放，γ 是在缩放后分数上的间隔，所以换回原平均分单位，要除以 β。\n\n**直答：** SimPO 直接比较好坏回答的平均 log 概率，并加入目标间隔；它不需要参考模型，但平均分仍只是训练信号，不能当成答案正确性的直接评分。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 用回答的平均 log 概率作为缩放后的隐式奖励，去掉参考模型，并要求偏好间有目标 margin。\n\n$$a_\\theta(x,y)=\\frac{1}{|y|}\\log\\pi_\\theta(y|x)$$\n\n$$L_{\\rm SimPO}=-\\mathbb E\\log\\sigma\\big(\\beta(a_w-a_l)-\\gamma\\big).$$\n\n**展开：** β 是奖励差缩放，γ 是缩放后的 margin。若写成平均 log 概率差的阈值，对应 γ/β，而非无条件等于 γ。损失是软约束，不保证所有训练对最终满足。\n\n**追问：为什么用平均 log 概率？** 可削弱序列长度对总和尺度的影响，但不保证消除所有长度偏差，也不是直接优化事实正确率。\n\n**易错：** 平均 log 概率的指数是几何平均概率，不是 token 概率的算术平均。依据：S09。","html":"<h3>两篇长短不同的回答，怎样比“模型有多愿意写”？<\/h3>\n<p>一句回答的总概率由每个 token 的概率相乘。越长，乘的项越多，数值往往越小。SimPO 先取 log 把乘法变成加法，再除以 token 数，比较平均分。<\/p>\n<p>它直接要求较优答案的平均分比差答案更高，并希望拉开一定间隔；不再减去参考模型的分数。β 负责缩放，γ 是在缩放后分数上的间隔，所以换回原平均分单位，要除以 β。<\/p>\n<p><strong>直答：<\/strong> SimPO 直接比较好坏回答的平均 log 概率，并加入目标间隔；它不需要参考模型，但平均分仍只是训练信号，不能当成答案正确性的直接评分。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 用回答的平均 log 概率作为缩放后的隐式奖励，去掉参考模型，并要求偏好间有目标 margin。<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>a<\/mi><mi>θ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo>,<\/mo><mi>y<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mo stretchy=\"false\">|<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><\/mrow><\/mfrac><mi>log<\/mi><msub><mi>π<\/mi><mi>θ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/math><\/div>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>L<\/mi><mrow><mi mathvariant=\"normal\">S<\/mi><mi mathvariant=\"normal\">i<\/mi><mi mathvariant=\"normal\">m<\/mi><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">O<\/mi><\/mrow><\/msub><mo>=<\/mo><mo>−<\/mo><mi mathvariant=\"normal\">𝔼<\/mi><mi>log<\/mi><mi>σ<\/mi><mo minsize=\"1.2em\" maxsize=\"1.2em\">(<\/mo><mi>β<\/mi><mo stretchy=\"false\">(<\/mo><msub><mi>a<\/mi><mi>w<\/mi><\/msub><mo>−<\/mo><msub><mi>a<\/mi><mi>l<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><mo>−<\/mo><mi>γ<\/mi><mo minsize=\"1.2em\" maxsize=\"1.2em\">)<\/mo><mo>.<\/mo><\/mrow><\/math><\/div>\n<p><strong>展开：<\/strong> β 是奖励差缩放，γ 是缩放后的 margin。若写成平均 log 概率差的阈值，对应 γ/β，而非无条件等于 γ。损失是软约束，不保证所有训练对最终满足。<\/p>\n<p><strong>追问：为什么用平均 log 概率？<\/strong> 可削弱序列长度对总和尺度的影响，但不保证消除所有长度偏差，也不是直接优化事实正确率。<\/p>\n<p><strong>易错：<\/strong> 平均 log 概率的指数是几何平均概率，不是 token 概率的算术平均。依据：<a class=\"ref\" href=\"#source-S09\">S09<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-P09" type="application/json">{"body":"### 总分低，可能只是算了更多项\n\n好回答有 100 个 token，总 log 概率为 −100；差回答有 20 个，总分为 −30。直接看总分，−30 更大；按长度平均，二者是 −1 和 −1.5，好回答反而更高。\n\nSimPO 从这些平均分构造损失；DPO 还要知道参考模型原来给了多少概率。因此只知道当前模型的这两个总分，还算不出完整 DPO 比较。\n\n**直答：** SimPO 看当前模型的长度平均分，DPO 看相对参考模型的概率变化；同一对回答可以得到不同训练信号，不能直接比较两种 loss 数值判优。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** DPO 比较相对参考的变化，SimPO 比较当前模型的平均 log 概率，两者可能对同一回答对给不同信号。\n\n**教学算例：** chosen 总 logP=−100、长度 100；rejected 总 logP=−30、长度 20。平均分别为 −1 和 −1.5，差为 0.5。SimPO 取 β=2、γ=0.5，则 z=0.5，loss≈0.474。\n\n若参考模型的总 logP 分别为 −110、−32，则当前 Δ=−70、参考 Δref=−78，DPO 取 β=0.1 得 z=0.8，loss≈0.371。\n\n**追问：这能证明哪个算法更好吗？** 不能，两个 loss 尺度不同；应比较同条件生成任务表现。\n\n**易错：** 不同模型/算法的训练 loss 大小不可直接排名。依据：S08、S09；数字为自建算例。","html":"<h3>总分低，可能只是算了更多项<\/h3>\n<p>好回答有 100 个 token，总 log 概率为 −100；差回答有 20 个，总分为 −30。直接看总分，−30 更大；按长度平均，二者是 −1 和 −1.5，好回答反而更高。<\/p>\n<p>SimPO 从这些平均分构造损失；DPO 还要知道参考模型原来给了多少概率。因此只知道当前模型的这两个总分，还算不出完整 DPO 比较。<\/p>\n<p><strong>直答：<\/strong> SimPO 看当前模型的长度平均分，DPO 看相对参考模型的概率变化；同一对回答可以得到不同训练信号，不能直接比较两种 loss 数值判优。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> DPO 比较相对参考的变化，SimPO 比较当前模型的平均 log 概率，两者可能对同一回答对给不同信号。<\/p>\n<p><strong>教学算例：<\/strong> chosen 总 logP=−100、长度 100；rejected 总 logP=−30、长度 20。平均分别为 −1 和 −1.5，差为 0.5。SimPO 取 β=2、γ=0.5，则 z=0.5，loss≈0.474。<\/p>\n<p>若参考模型的总 logP 分别为 −110、−32，则当前 Δ=−70、参考 Δref=−78，DPO 取 β=0.1 得 z=0.8，loss≈0.371。<\/p>\n<p><strong>追问：这能证明哪个算法更好吗？<\/strong> 不能，两个 loss 尺度不同；应比较同条件生成任务表现。<\/p>\n<p><strong>易错：<\/strong> 不同模型/算法的训练 loss 大小不可直接排名。依据：<a class=\"ref\" href=\"#source-S08\">S08<\/a>、<a class=\"ref\" href=\"#source-S09\">S09<\/a>；数字为自建算例。<\/p><\/div><\/details>"}</script>
<script id="data-q-P10" type="application/json">{"body":"### 有时候容易判断“好不好”，却凑不成同题一对\n\n审核日志可能只留下某个回答“可接受”或“不可接受”，没有同题另一份回答。KTO 可以利用这种单回答好坏反馈训练生成模型。\n\n别把它理解成只训练一个“输出好坏标签”的分类器：它更新的仍然是回答各 token 的生成概率，部署时模型仍负责写答案。\n\n**直答：** KTO 利用单个回答的好坏标签优化生成倾向，不要求每条都有同题偏好对；标签含义与数据比例仍需仔细处理。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** KTO 用单个回答的好/坏反馈优化生成模型，不要求每条都有同题成对偏好。\n\n**展开：** 它围绕相对参考的隐式奖励、参考点和好坏效用构造目标；好坏样本权重可不同。最终改变的是生成策略，而不是仅训练一个输出“通过/拦截”的分类头。\n\n**追问：审核日志可以直接拿来 KTO 吗？** 先确认标签评价的是模型回答质量，还是输入风险、规则命中或审核流程结果；它们不是同一监督含义。\n\n**易错：** 不要把 desirable/undesirable 简化成“用户请求有没有危险”，也不要混用不同时期政策标签。依据：S10。","html":"<h3>有时候容易判断“好不好”，却凑不成同题一对<\/h3>\n<p>审核日志可能只留下某个回答“可接受”或“不可接受”，没有同题另一份回答。KTO 可以利用这种单回答好坏反馈训练生成模型。<\/p>\n<p>别把它理解成只训练一个“输出好坏标签”的分类器：它更新的仍然是回答各 token 的生成概率，部署时模型仍负责写答案。<\/p>\n<p><strong>直答：<\/strong> KTO 利用单个回答的好坏标签优化生成倾向，不要求每条都有同题偏好对；标签含义与数据比例仍需仔细处理。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> KTO 用单个回答的好/坏反馈优化生成模型，不要求每条都有同题成对偏好。<\/p>\n<p><strong>展开：<\/strong> 它围绕相对参考的隐式奖励、参考点和好坏效用构造目标；好坏样本权重可不同。最终改变的是生成策略，而不是仅训练一个输出“通过/拦截”的分类头。<\/p>\n<p><strong>追问：审核日志可以直接拿来 KTO 吗？<\/strong> 先确认标签评价的是模型回答质量，还是输入风险、规则命中或审核流程结果；它们不是同一监督含义。<\/p>\n<p><strong>易错：<\/strong> 不要把 desirable/undesirable 简化成“用户请求有没有危险”，也不要混用不同时期政策标签。依据：<a class=\"ref\" href=\"#source-S10\">S10<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-P11" type="application/json">{"body":"### 先盘点手里有什么反馈\n\n有成对好坏回答，可以先比较 DPO、SimPO；只有单条好坏记录，可以考虑 KTO；如果能不断让模型尝试，并可靠判断结果，可以进一步考虑 PPO、GRPO 等在线训练。\n\n例如数学答案可用程序核验，和“这段话是否得体”的反馈可靠性不同。方法要配得上数据和预算。\n\n**直答：** 先看反馈是示范、成对偏好、单条标签还是可验证结果，再选训练方法；别先选热门算法，再勉强凑它需要的数据。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 有成对偏好先比较 DPO/SimPO，只有单回答好坏标签可考虑 KTO；能持续采样且奖励可信，再考虑 PPO/GRPO。先匹配反馈和预算，再用任务表现选算法。\n\n| 条件 | 候选起点 | 先验证什么 |\n|---|---|---|\n| 有可靠同题偏好对，预算有限 | SFT + DPO | 偏好噪声、参考实现、长度 |\n| 有偏好对，想省参考相关开销 | SimPO | β/γ、遗忘、长度和实际质量 |\n| 更容易获得单回答好/坏标签 | KTO | 标签语义、类别权重、参考点 |\n| 能在线采样并可靠验证结果 | RLVR + 合适策略优化 | 奖励漏洞、探索、采样成本 |\n\n**追问：你的内容安全项目为什么优先 DPO？** 按已有报告，其反馈更接近离线审核与偏好；需由真实数据构造证明。没有可靠可执行奖励时，不因 GRPO 热门而硬套。\n\n**易错：** RLVR 是奖励/训练范式，GRPO 是优化方法，两者不是同义词。依据：S08、S09、S10、S11、S12、S13。","html":"<h3>先盘点手里有什么反馈<\/h3>\n<p>有成对好坏回答，可以先比较 DPO、SimPO；只有单条好坏记录，可以考虑 KTO；如果能不断让模型尝试，并可靠判断结果，可以进一步考虑 PPO、GRPO 等在线训练。<\/p>\n<p>例如数学答案可用程序核验，和“这段话是否得体”的反馈可靠性不同。方法要配得上数据和预算。<\/p>\n<p><strong>直答：<\/strong> 先看反馈是示范、成对偏好、单条标签还是可验证结果，再选训练方法；别先选热门算法，再勉强凑它需要的数据。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 有成对偏好先比较 DPO/SimPO，只有单回答好坏标签可考虑 KTO；能持续采样且奖励可信，再考虑 PPO/GRPO。先匹配反馈和预算，再用任务表现选算法。<\/p>\n<table>\n<thead>\n<tr>\n<th>条件<\/th>\n<th>候选起点<\/th>\n<th>先验证什么<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>有可靠同题偏好对，预算有限<\/td>\n<td>SFT + DPO<\/td>\n<td>偏好噪声、参考实现、长度<\/td>\n<\/tr>\n<tr>\n<td>有偏好对，想省参考相关开销<\/td>\n<td>SimPO<\/td>\n<td>β/γ、遗忘、长度和实际质量<\/td>\n<\/tr>\n<tr>\n<td>更容易获得单回答好/坏标签<\/td>\n<td>KTO<\/td>\n<td>标签语义、类别权重、参考点<\/td>\n<\/tr>\n<tr>\n<td>能在线采样并可靠验证结果<\/td>\n<td>RLVR + 合适策略优化<\/td>\n<td>奖励漏洞、探索、采样成本<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>追问：你的内容安全项目为什么优先 DPO？<\/strong> 按已有报告，其反馈更接近离线审核与偏好；需由真实数据构造证明。没有可靠可执行奖励时，不因 GRPO 热门而硬套。<\/p>\n<p><strong>易错：<\/strong> RLVR 是奖励/训练范式，GRPO 是优化方法，两者不是同义词。依据：<a class=\"ref\" href=\"#source-S08\">S08<\/a>、<a class=\"ref\" href=\"#source-S09\">S09<\/a>、<a class=\"ref\" href=\"#source-S10\">S10<\/a>、<a class=\"ref\" href=\"#source-S11\">S11<\/a>、<a class=\"ref\" href=\"#source-S12\">S12<\/a>、<a class=\"ref\" href=\"#source-S13\">S13<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-P12" type="application/json">{"body":"### 让学生比较“有代表性的错误”\n\n把一篇好作文和一串乱码相比，学生很容易选对，却未必学到真实短板。更有价值的差答案可能语言流畅，只在关键事实上错误，或在边界规则上处理不当。\n\n但也不是越难越好：如果评审者都无法稳定判断谁好谁坏，强行贴标签会引入噪声。\n\n**直答：** rejected 应揭示模型真实、可判断的短板；兼顾代表性和标签可靠性，避免只用明显垃圾或高度争议的回答。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 选择能暴露当前模型真实短板、且偏好理由清楚的回答，而不是明显垃圾答案。\n\n**展开：** 混合真实漏放/误拒、同题模型候选、边界错误、事实或策略违例；保留理由标签和置信度。控制长度、风格与固定拒答句带来的捷径。太简单提供的信息少，太模糊又增加标签噪声。\n\n**追问：越难越好吗？** 若评审员也无法稳定排序，训练可能学到噪声。先做双标一致性、仲裁和难度分层。\n\n**易错：** rejected 不能包含测试集专属答案或线上敏感标识而不治理。","html":"<h3>让学生比较“有代表性的错误”<\/h3>\n<p>把一篇好作文和一串乱码相比，学生很容易选对，却未必学到真实短板。更有价值的差答案可能语言流畅，只在关键事实上错误，或在边界规则上处理不当。<\/p>\n<p>但也不是越难越好：如果评审者都无法稳定判断谁好谁坏，强行贴标签会引入噪声。<\/p>\n<p><strong>直答：<\/strong> rejected 应揭示模型真实、可判断的短板；兼顾代表性和标签可靠性，避免只用明显垃圾或高度争议的回答。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 选择能暴露当前模型真实短板、且偏好理由清楚的回答，而不是明显垃圾答案。<\/p>\n<p><strong>展开：<\/strong> 混合真实漏放/误拒、同题模型候选、边界错误、事实或策略违例；保留理由标签和置信度。控制长度、风格与固定拒答句带来的捷径。太简单提供的信息少，太模糊又增加标签噪声。<\/p>\n<p><strong>追问：越难越好吗？<\/strong> 若评审员也无法稳定排序，训练可能学到噪声。先做双标一致性、仲裁和难度分层。<\/p>\n<p><strong>易错：<\/strong> rejected 不能包含测试集专属答案或线上敏感标识而不治理。<\/p><\/div><\/details>"}</script>
<script id="data-q-P13" type="application/json">{"body":"### 改完模型，它可能写出旧练习册里没有的新答案\n\n固定偏好集通常来自旧模型曾经生成的候选。模型变了以后，会走向新的表达、长度和边界情形，旧数据未必约束过这些情况。\n\n重新生成、评审、补充数据可以帮助覆盖，但要付出成本，也可能把评审模型的偏见不断放大。\n\n**直答：** 离线偏好数据只能覆盖见过的比较，更新后的模型可能生成新问题；数据收集是否在线，与使用什么损失应分开描述。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 固定偏好数据覆盖的是旧策略生成的候选，而训练后的模型可能生成新的、更长或更边界化的回答。\n\n**展开：** loss 只约束被观察到的对比；在未见输出上可能出现新问题。迭代采样、重新评分并更新偏好集可以扩展覆盖，但也引入评审成本和自我强化偏差。\n\n**追问：DPO 一定不能在线用吗？** 标准设置常是离线，但可放入迭代/在线数据收集流程；“损失形式”和“数据收集方式”分开描述。\n\n**易错：** 不应把所有偏好优化说成从不 rollout。依据：S08、S09。","html":"<h3>改完模型，它可能写出旧练习册里没有的新答案<\/h3>\n<p>固定偏好集通常来自旧模型曾经生成的候选。模型变了以后，会走向新的表达、长度和边界情形，旧数据未必约束过这些情况。<\/p>\n<p>重新生成、评审、补充数据可以帮助覆盖，但要付出成本，也可能把评审模型的偏见不断放大。<\/p>\n<p><strong>直答：<\/strong> 离线偏好数据只能覆盖见过的比较，更新后的模型可能生成新问题；数据收集是否在线，与使用什么损失应分开描述。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 固定偏好数据覆盖的是旧策略生成的候选，而训练后的模型可能生成新的、更长或更边界化的回答。<\/p>\n<p><strong>展开：<\/strong> loss 只约束被观察到的对比；在未见输出上可能出现新问题。迭代采样、重新评分并更新偏好集可以扩展覆盖，但也引入评审成本和自我强化偏差。<\/p>\n<p><strong>追问：DPO 一定不能在线用吗？<\/strong> 标准设置常是离线，但可放入迭代/在线数据收集流程；“损失形式”和“数据收集方式”分开描述。<\/p>\n<p><strong>易错：<\/strong> 不应把所有偏好优化说成从不 rollout。依据：<a class=\"ref\" href=\"#source-S08\">S08<\/a>、<a class=\"ref\" href=\"#source-S09\">S09<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-P14" type="application/json">{"body":"### 分数表要同时看学习、行为和花费\n\n只看偏好对上选对率，像只看学生会不会选老师批过的题。还应让模型独立回答，检查是否更会拒绝危险请求、是否也误拒正常请求，以及回答是否变长或单一。\n\n同时记录训练用了多少时间、显存和有效 token，才能判断提升值不值得。\n\n**直答：** 监控训练损失之外的生成行为、关键业务指标和资源成本；一个内部指标变好，不足以证明整个系统更好。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 同时看训练目标、分布变化、生成质量和资源成本。\n\n**展开：** 训练看 margin、chosen/rejected logprob、偏好准确率、梯度；分布看参考 KL 估计、长度、拒答比例和多样性；业务看漏放、误拒、分类召回、帮助性；成本看显存、有效 tokens/s 与总 GPU 时。\n\n**追问：KL 很小就一定安全？** 不保证。关键小概率行为的变化也可能很重要；平均 KL 不替代分层风险评测。\n\n**易错：** 只挑高胜率截图，缺少冻结集、采样配置与盲评顺序，会降低结果可信度。","html":"<h3>分数表要同时看学习、行为和花费<\/h3>\n<p>只看偏好对上选对率，像只看学生会不会选老师批过的题。还应让模型独立回答，检查是否更会拒绝危险请求、是否也误拒正常请求，以及回答是否变长或单一。<\/p>\n<p>同时记录训练用了多少时间、显存和有效 token，才能判断提升值不值得。<\/p>\n<p><strong>直答：<\/strong> 监控训练损失之外的生成行为、关键业务指标和资源成本；一个内部指标变好，不足以证明整个系统更好。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 同时看训练目标、分布变化、生成质量和资源成本。<\/p>\n<p><strong>展开：<\/strong> 训练看 margin、chosen/rejected logprob、偏好准确率、梯度；分布看参考 KL 估计、长度、拒答比例和多样性；业务看漏放、误拒、分类召回、帮助性；成本看显存、有效 tokens/s 与总 GPU 时。<\/p>\n<p><strong>追问：KL 很小就一定安全？<\/strong> 不保证。关键小概率行为的变化也可能很重要；平均 KL 不替代分层风险评测。<\/p>\n<p><strong>易错：<\/strong> 只挑高胜率截图，缺少冻结集、采样配置与盲评顺序，会降低结果可信度。<\/p><\/div><\/details>"}</script>
<script id="data-q-P15" type="application/json">{"body":"### 老师意见不一致，先问为什么\n\n有的分歧来自标签标错，有的来自规则不清，有的则是两份答案各有优点。这些情况不适合都强行选一个赢家。\n\n可以补充规则、让多人复核、记录置信度或保留平局。删掉所有难样本也可能把最重要的边界问题一起删掉。\n\n**直答：** 先辨别反馈噪声的来源，再选择复核、软标签、权重或平局处理；不能指望更复杂的损失自动修好混乱标准。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 先减少标注歧义，再考虑置信度权重、软标签、噪声鲁棒目标或平局处理，不能只靠调损失补救。\n\n**展开：** 分开“标签错”“两者都好”“两者都差”“规则矛盾”。记录标注政策、来源和多标一致性；按噪声层级做受控注入实验，观察不同目标的退化。\n\n**追问：把所有低置信度样本删除好吗？** 可能丢掉最重要的边界场景。可用于分析或主动复核，而非全部进入强监督训练。\n\n**易错：** label smoothing 的数值不是标注准确率的自动估计。","html":"<h3>老师意见不一致，先问为什么<\/h3>\n<p>有的分歧来自标签标错，有的来自规则不清，有的则是两份答案各有优点。这些情况不适合都强行选一个赢家。<\/p>\n<p>可以补充规则、让多人复核、记录置信度或保留平局。删掉所有难样本也可能把最重要的边界问题一起删掉。<\/p>\n<p><strong>直答：<\/strong> 先辨别反馈噪声的来源，再选择复核、软标签、权重或平局处理；不能指望更复杂的损失自动修好混乱标准。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 先减少标注歧义，再考虑置信度权重、软标签、噪声鲁棒目标或平局处理，不能只靠调损失补救。<\/p>\n<p><strong>展开：<\/strong> 分开“标签错”“两者都好”“两者都差”“规则矛盾”。记录标注政策、来源和多标一致性；按噪声层级做受控注入实验，观察不同目标的退化。<\/p>\n<p><strong>追问：把所有低置信度样本删除好吗？<\/strong> 可能丢掉最重要的边界场景。可用于分析或主动复核，而非全部进入强监督训练。<\/p>\n<p><strong>易错：<\/strong> label smoothing 的数值不是标注准确率的自动估计。<\/p><\/div><\/details>"}</script>
<script id="data-q-P16" type="application/json">{"body":"### 训练题像二选一，最后学会的仍是怎样生成\n\nDPO 的训练形式是在判断“同题哪份回答更值得偏好”，所以损失看起来像二分类。但它的比较分数来自生成模型给回答的概率，不是随便加一个好坏分类头。\n\n调整这些概率之后，模型自由生成时的倾向也会变化。理解这个联系比争论名字更有用。\n\n**直答：** DPO 有分类式的偏好目标，但优化对象是生成策略的概率；其数学形式和部署时承担的生成任务要分别理解。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 它的偏好损失具有二分类形式，但被优化的是生成策略的序列概率；模型的生成分布会随之变化。\n\n**展开：** 输入是一对回答，标签是偏好方向；分类 logit 由策略与参考 logprob 差构造，不是任意分类头。推理时通常只保留优化后的生成模型。\n\n**追问：理论漂亮就保证最好吗？** 不保证，BT 偏好假设、有限策略容量、数据覆盖和优化误差都会影响结果。\n\n**易错：** 可以承认分类式目标的工程便利，同时说明其生成策略含义，避免陷入“算不算真正 RL”的名词争论。依据：S08。","html":"<h3>训练题像二选一，最后学会的仍是怎样生成<\/h3>\n<p>DPO 的训练形式是在判断“同题哪份回答更值得偏好”，所以损失看起来像二分类。但它的比较分数来自生成模型给回答的概率，不是随便加一个好坏分类头。<\/p>\n<p>调整这些概率之后，模型自由生成时的倾向也会变化。理解这个联系比争论名字更有用。<\/p>\n<p><strong>直答：<\/strong> DPO 有分类式的偏好目标，但优化对象是生成策略的概率；其数学形式和部署时承担的生成任务要分别理解。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 它的偏好损失具有二分类形式，但被优化的是生成策略的序列概率；模型的生成分布会随之变化。<\/p>\n<p><strong>展开：<\/strong> 输入是一对回答，标签是偏好方向；分类 logit 由策略与参考 logprob 差构造，不是任意分类头。推理时通常只保留优化后的生成模型。<\/p>\n<p><strong>追问：理论漂亮就保证最好吗？<\/strong> 不保证，BT 偏好假设、有限策略容量、数据覆盖和优化误差都会影响结果。<\/p>\n<p><strong>易错：<\/strong> 可以承认分类式目标的工程便利，同时说明其生成策略含义，避免陷入“算不算真正 RL”的名词争论。依据：<a class=\"ref\" href=\"#source-S08\">S08<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-P17" type="application/json">{"body":"### 好反馈与坏反馈，推动方向相反\n\nKTO 先比较回答在当前模型和参考模型下的概率，再与一个参考点比较。好标签希望往更受认可的方向推动，坏标签则反向推动。\n\n它用 sigmoid 表示效用，曲线在两端逐渐变平。这意味着极端位置的梯度会变小；与交叉熵里的“负对数扣分”不是同一条曲线。KL 参考点可以先当作比较用的刻度，具体估计放在下面深读。\n\n**直答：** KTO 用相反方向的 sigmoid 效用处理好坏标签，并引入 KL 参考点；不要把它写成普通二元交叉熵只换个标签。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 对好/坏样本使用方向相反的 sigmoid 效用，并与 KL 参考点比较；它不是普通二元交叉熵。\n\n按作者 v3 的记号：\n\n$$r=\\log\\frac{\\pi_\\theta(y|x)}{\\pi_{\\rm ref}(y|x)}$$\n\n$$z_0=D_{\\rm KL}(\\pi_\\theta(\\cdot|x)\\|\\pi_{\\rm ref}(\\cdot|x)).$$\n\n$$L_D=\\lambda_D[1-\\sigma(\\beta(r-z_0))]$$\n\n$$L_U=\\lambda_U[1-\\sigma(\\beta(z_0-r))].$$\n\n**展开：** 数据集按好坏标签选择对应项并平均。β 放在效用里，r 本身没有再乘 β，避免重复缩放。原文实现用批内错配输入/回答估计共享参考点并截到非负，不反传该项；这不是精确词表 KL。\n\n**追问：和 −log σ 有何不同？** sigmoid 效用在极端两侧会饱和，梯度趋小；不能把它当 BCE 只换一下标签。\n\n**易错：** 参考点估计与好坏权重属于目标的一部分，换实现需记录。依据：S10，正文式 8 与 KL Estimate。","html":"<h3>好反馈与坏反馈，推动方向相反<\/h3>\n<p>KTO 先比较回答在当前模型和参考模型下的概率，再与一个参考点比较。好标签希望往更受认可的方向推动，坏标签则反向推动。<\/p>\n<p>它用 sigmoid 表示效用，曲线在两端逐渐变平。这意味着极端位置的梯度会变小；与交叉熵里的“负对数扣分”不是同一条曲线。KL 参考点可以先当作比较用的刻度，具体估计放在下面深读。<\/p>\n<p><strong>直答：<\/strong> KTO 用相反方向的 sigmoid 效用处理好坏标签，并引入 KL 参考点；不要把它写成普通二元交叉熵只换个标签。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 对好/坏样本使用方向相反的 sigmoid 效用，并与 KL 参考点比较；它不是普通二元交叉熵。<\/p>\n<p>按作者 v3 的记号：<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>r<\/mi><mo>=<\/mo><mi>log<\/mi><mfrac><mrow><msub><mi>π<\/mi><mi>θ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><mrow><msub><mi>π<\/mi><mrow><mi mathvariant=\"normal\">r<\/mi><mi mathvariant=\"normal\">e<\/mi><mi mathvariant=\"normal\">f<\/mi><\/mrow><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/mfrac><\/mrow><\/math><\/div>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>z<\/mi><mn>0<\/mn><\/msub><mo>=<\/mo><msub><mi>D<\/mi><mrow><mi mathvariant=\"normal\">K<\/mi><mi mathvariant=\"normal\">L<\/mi><\/mrow><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>π<\/mi><mi>θ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>·<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo fence=\"false\" stretchy=\"false\">‖<\/mo><msub><mi>π<\/mi><mrow><mi mathvariant=\"normal\">r<\/mi><mi mathvariant=\"normal\">e<\/mi><mi mathvariant=\"normal\">f<\/mi><\/mrow><\/msub><mo stretchy=\"false\">(<\/mo><mi>·<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">)<\/mo><mo>.<\/mo><\/mrow><\/math><\/div>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>L<\/mi><mi>D<\/mi><\/msub><mo>=<\/mo><msub><mi>λ<\/mi><mi>D<\/mi><\/msub><mo stretchy=\"false\">[<\/mo><mn>1<\/mn><mo>−<\/mo><mi>σ<\/mi><mo stretchy=\"false\">(<\/mo><mi>β<\/mi><mo stretchy=\"false\">(<\/mo><mi>r<\/mi><mo>−<\/mo><msub><mi>z<\/mi><mn>0<\/mn><\/msub><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">]<\/mo><\/mrow><\/math><\/div>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>L<\/mi><mi>U<\/mi><\/msub><mo>=<\/mo><msub><mi>λ<\/mi><mi>U<\/mi><\/msub><mo stretchy=\"false\">[<\/mo><mn>1<\/mn><mo>−<\/mo><mi>σ<\/mi><mo stretchy=\"false\">(<\/mo><mi>β<\/mi><mo stretchy=\"false\">(<\/mo><msub><mi>z<\/mi><mn>0<\/mn><\/msub><mo>−<\/mo><mi>r<\/mi><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">]<\/mo><mo>.<\/mo><\/mrow><\/math><\/div>\n<p><strong>展开：<\/strong> 数据集按好坏标签选择对应项并平均。β 放在效用里，r 本身没有再乘 β，避免重复缩放。原文实现用批内错配输入/回答估计共享参考点并截到非负，不反传该项；这不是精确词表 KL。<\/p>\n<p><strong>追问：和 −log σ 有何不同？<\/strong> sigmoid 效用在极端两侧会饱和，梯度趋小；不能把它当 BCE 只换一下标签。<\/p>\n<p><strong>易错：<\/strong> 参考点估计与好坏权重属于目标的一部分，换实现需记录。依据：<a class=\"ref\" href=\"#source-S10\">S10<\/a>，正文式 8 与 KL Estimate。<\/p><\/div><\/details>"}</script>
<script id="data-q-P18" type="application/json">{"body":"### 给作文评分的老师，也需要考试\n\n奖励模型学习给回答一个标量分数。常见训练让同题较优回答分高、较差回答分低，反复学习评审者的偏好。\n\n但生成模型会主动寻找能拿高分的答案，可能钻评分规则的漏洞。奖励模型在旧作业上判得准，不代表遇到这些新花样仍可靠。\n\n**直答：** 奖励模型从偏好学习评分，再用于指导生成模型；需要独立验证其排序和抗投机能力，不能只看训练偏好准确率。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 用同题偏好训练标量评分 rφ，使好回答分数高于差回答，再独立验证排序、校准与抗投机能力。\n\n$$L_{\\rm RM}=-\\mathbb E\\log\\sigma(r_\\phi(x,y_w)-r_\\phi(x,y_l)).$$\n\n**展开：** 这是常见 BT 偏好目标；模型可在语言模型表征上接评分头。奖励的绝对零点通常不可由成对差唯一确定；不同任务分数尺度也不天然可比。\n\n**追问：奖励模型训练准确率高，策略训练就安全吗？** 策略会主动寻找高分输出，可能进入评分器没见过的区域。需要生成后重评、长度/风格反例及独立人工或可执行校验。\n\n**易错：** 相同训练集上的 reward accuracy 不能证明真实奖励可靠；DPO 隐式奖励也不能直接当作已校准业务风险概率。依据：S08、S52。","html":"<h3>给作文评分的老师，也需要考试<\/h3>\n<p>奖励模型学习给回答一个标量分数。常见训练让同题较优回答分高、较差回答分低，反复学习评审者的偏好。<\/p>\n<p>但生成模型会主动寻找能拿高分的答案，可能钻评分规则的漏洞。奖励模型在旧作业上判得准，不代表遇到这些新花样仍可靠。<\/p>\n<p><strong>直答：<\/strong> 奖励模型从偏好学习评分，再用于指导生成模型；需要独立验证其排序和抗投机能力，不能只看训练偏好准确率。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 用同题偏好训练标量评分 rφ，使好回答分数高于差回答，再独立验证排序、校准与抗投机能力。<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>L<\/mi><mrow><mi mathvariant=\"normal\">R<\/mi><mi mathvariant=\"normal\">M<\/mi><\/mrow><\/msub><mo>=<\/mo><mo>−<\/mo><mi mathvariant=\"normal\">𝔼<\/mi><mi>log<\/mi><mi>σ<\/mi><mo stretchy=\"false\">(<\/mo><msub><mi>r<\/mi><mi>ϕ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo>,<\/mo><msub><mi>y<\/mi><mi>w<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><mo>−<\/mo><msub><mi>r<\/mi><mi>ϕ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>x<\/mi><mo>,<\/mo><msub><mi>y<\/mi><mi>l<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">)<\/mo><mo>.<\/mo><\/mrow><\/math><\/div>\n<p><strong>展开：<\/strong> 这是常见 BT 偏好目标；模型可在语言模型表征上接评分头。奖励的绝对零点通常不可由成对差唯一确定；不同任务分数尺度也不天然可比。<\/p>\n<p><strong>追问：奖励模型训练准确率高，策略训练就安全吗？<\/strong> 策略会主动寻找高分输出，可能进入评分器没见过的区域。需要生成后重评、长度/风格反例及独立人工或可执行校验。<\/p>\n<p><strong>易错：<\/strong> 相同训练集上的 reward accuracy 不能证明真实奖励可靠；DPO 隐式奖励也不能直接当作已校准业务风险概率。依据：<a class=\"ref\" href=\"#source-S08\">S08<\/a>、<a class=\"ref\" href=\"#source-S52\">S52<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-RL01" type="application/json">{"body":"### 从看标准答案，变成自己做完再看成绩\n\nSFT 常让模型模仿示范；强化学习则可以让模型自己生成一份答案，系统给结果打分，再调整模型的选择倾向。\n\n在这种描述里，前文是“当前状态”，选下一个 token 是“动作”，模型给各 token 的概率叫“策略”，答案得到的分数叫“奖励”。rollout 就是实际生成并记录这样一次过程。\n\n**直答：** 语言生成可以看成连续选择 token 的过程；强化学习利用生成结果的奖励，调整以后走向不同答案的概率。\n\n### 进一步：公式、边界与追问\n\n**本章进阶约定与范围：**\n\n定位：后训练高阶追问。必须区分当前策略 θ、采样旧策略 θ_old、固定参考策略 ref、奖励模型和价值模型。γ 在 RL 中常指折扣因子，和 SimPO 的 margin 同字母但含义不同。\n\n**技术表述：** 状态是问题与已生成前缀，动作是下一个 token，策略是语言模型，终止于 EOS 或长度上限；奖励可在末尾或中间给出。\n\n**展开：** 代码任务可用测试结果作奖励，偏好任务可用奖励模型；工具型 Agent 的环境状态还包括工具与外部系统。奖励最大化必须处理探索、延迟反馈和分布变化。\n\n**追问：终局奖励如何影响前面 token？** 通过策略梯度把回报分配给轨迹中的动作；粗粒度分配未必准确定位真正关键步骤。\n\n**易错：** “有 reward”不等于奖励可信。依据：S11、S12、S13。","html":"<h3>从看标准答案，变成自己做完再看成绩<\/h3>\n<p>SFT 常让模型模仿示范；强化学习则可以让模型自己生成一份答案，系统给结果打分，再调整模型的选择倾向。<\/p>\n<p>在这种描述里，前文是“当前状态”，选下一个 token 是“动作”，模型给各 token 的概率叫“策略”，答案得到的分数叫“奖励”。rollout 就是实际生成并记录这样一次过程。<\/p>\n<p><strong>直答：<\/strong> 语言生成可以看成连续选择 token 的过程；强化学习利用生成结果的奖励，调整以后走向不同答案的概率。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>本章进阶约定与范围：<\/strong><\/p>\n<p>定位：后训练高阶追问。必须区分当前策略 θ、采样旧策略 θ_old、固定参考策略 ref、奖励模型和价值模型。γ 在 RL 中常指折扣因子，和 SimPO 的 margin 同字母但含义不同。<\/p>\n<p><strong>技术表述：<\/strong> 状态是问题与已生成前缀，动作是下一个 token，策略是语言模型，终止于 EOS 或长度上限；奖励可在末尾或中间给出。<\/p>\n<p><strong>展开：<\/strong> 代码任务可用测试结果作奖励，偏好任务可用奖励模型；工具型 Agent 的环境状态还包括工具与外部系统。奖励最大化必须处理探索、延迟反馈和分布变化。<\/p>\n<p><strong>追问：终局奖励如何影响前面 token？<\/strong> 通过策略梯度把回报分配给轨迹中的动作；粗粒度分配未必准确定位真正关键步骤。<\/p>\n<p><strong>易错：<\/strong> “有 reward”不等于奖励可信。依据：<a class=\"ref\" href=\"#source-S11\">S11<\/a>、<a class=\"ref\" href=\"#source-S12\">S12<\/a>、<a class=\"ref\" href=\"#source-S13\">S13<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-RL02" type="application/json">{"body":"### 结果不错，就增加走出这条路径的机会\n\n模型写完答案后才得到一个分数。策略梯度把这个反馈接到生成概率上：好结果对应的选择更值得重复，差结果对应的选择要降低机会。\n\nlog 概率的导数提供了调整这些概率的方便表达，也能把一串概率乘积拆成求和。它不是“给奖励取 log”，更不是把最终分数平均分给每一步就自然正确。\n\n**直答：** 策略梯度用奖励相关的权重，乘上生成动作的 log 概率梯度，把结果好坏转成概率更新方向。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 利用 ∇π=π∇logπ，把期望的梯度写成从当前策略采样即可估计的形式。\n\n$$\\nabla_\\theta \\mathbb E_{\\tau\\sim\\pi_\\theta}[R(\\tau)]\n=\\mathbb E_\\tau\\left[R(\\tau)\\nabla_\\theta\\log\\pi_\\theta(\\tau)\\right].$$\n\n在环境转移不依赖 θ 的条件下，轨迹 log 概率中可训练部分是各动作 logπ 的和。\n\n**追问：为什么减 baseline？** 与当前动作无关的 baseline 在适当条件下不改变期望梯度，却能减少方差。优势表示动作相对预期表现的好坏。\n\n**易错：** 奖励为负仍可学习；关键是相对优势与目标定义，而不是所有 reward 必须为正。","html":"<h3>结果不错，就增加走出这条路径的机会<\/h3>\n<p>模型写完答案后才得到一个分数。策略梯度把这个反馈接到生成概率上：好结果对应的选择更值得重复，差结果对应的选择要降低机会。<\/p>\n<p>log 概率的导数提供了调整这些概率的方便表达，也能把一串概率乘积拆成求和。它不是“给奖励取 log”，更不是把最终分数平均分给每一步就自然正确。<\/p>\n<p><strong>直答：<\/strong> 策略梯度用奖励相关的权重，乘上生成动作的 log 概率梯度，把结果好坏转成概率更新方向。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 利用 ∇π=π∇logπ，把期望的梯度写成从当前策略采样即可估计的形式。<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mo>∇<\/mo><mi>θ<\/mi><\/msub><msub><mi mathvariant=\"normal\">𝔼<\/mi><mrow><mi>τ<\/mi><mi>~<\/mi><msub><mi>π<\/mi><mi>θ<\/mi><\/msub><\/mrow><\/msub><mo stretchy=\"false\">[<\/mo><mi>R<\/mi><mo stretchy=\"false\">(<\/mo><mi>τ<\/mi><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">]<\/mo><mo>=<\/mo><msub><mi mathvariant=\"normal\">𝔼<\/mi><mi>τ<\/mi><\/msub><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">[<\/mo><mi>R<\/mi><mo stretchy=\"false\">(<\/mo><mi>τ<\/mi><mo stretchy=\"false\">)<\/mo><msub><mo>∇<\/mo><mi>θ<\/mi><\/msub><mi>log<\/mi><msub><mi>π<\/mi><mi>θ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>τ<\/mi><mo stretchy=\"false\">)<\/mo><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">]<\/mo><\/mrow><mo>.<\/mo><\/mrow><\/math><\/div>\n<p>在环境转移不依赖 θ 的条件下，轨迹 log 概率中可训练部分是各动作 logπ 的和。<\/p>\n<p><strong>追问：为什么减 baseline？<\/strong> 与当前动作无关的 baseline 在适当条件下不改变期望梯度，却能减少方差。优势表示动作相对预期表现的好坏。<\/p>\n<p><strong>易错：<\/strong> 奖励为负仍可学习；关键是相对优势与目标定义，而不是所有 reward 必须为正。<\/p><\/div><\/details>"}</script>
<script id="data-q-RL03" type="application/json">{"body":"### 写答案、预测前景、评卷、留旧稿\n\nactor 是写答案的模型；critic 估计从当前情况继续写下去，大致能拿多少回报；reward model 或验证器给结果评分；reference 是固定参考模型，用来约束变化。\n\n想象比赛里有选手、赛前预测员、裁判和原有表现基准，职责不同。实际程序能否共用部分网络，要看实现，不能靠角色数直接数模型份数。\n\n**直答：** 先区分生成动作、估计价值、提供奖励和比较基准这四个职责，再讨论 PPO 系统具体需要哪些网络。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** actor 生成动作，critic 估计价值，reward 提供评分，reference 限制策略偏移；可以有参数共享，但概念不同。\n\n**展开：** 旧 actor 用来计算采样概率比；critic 通常跟训练更新；reference 常固定。不同 RLHF 系统可能合并、移除或预计算某些角色。\n\n**追问：PPO 必须永远有四份完整模型同时驻留吗？** 不一定。实现可共享、分阶段、卸载或采用不同奖励来源，必须按实际架构算资源。\n\n**易错：** old policy 不是“语义上判断好坏的老师”。依据：S11。","html":"<h3>写答案、预测前景、评卷、留旧稿<\/h3>\n<p>actor 是写答案的模型；critic 估计从当前情况继续写下去，大致能拿多少回报；reward model 或验证器给结果评分；reference 是固定参考模型，用来约束变化。<\/p>\n<p>想象比赛里有选手、赛前预测员、裁判和原有表现基准，职责不同。实际程序能否共用部分网络，要看实现，不能靠角色数直接数模型份数。<\/p>\n<p><strong>直答：<\/strong> 先区分生成动作、估计价值、提供奖励和比较基准这四个职责，再讨论 PPO 系统具体需要哪些网络。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> actor 生成动作，critic 估计价值，reward 提供评分，reference 限制策略偏移；可以有参数共享，但概念不同。<\/p>\n<p><strong>展开：<\/strong> 旧 actor 用来计算采样概率比；critic 通常跟训练更新；reference 常固定。不同 RLHF 系统可能合并、移除或预计算某些角色。<\/p>\n<p><strong>追问：PPO 必须永远有四份完整模型同时驻留吗？<\/strong> 不一定。实现可共享、分阶段、卸载或采用不同奖励来源，必须按实际架构算资源。<\/p>\n<p><strong>易错：<\/strong> old policy 不是“语义上判断好坏的老师”。依据：<a class=\"ref\" href=\"#source-S11\">S11<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-RL04" type="application/json">{"body":"### 一次好成绩，不能让学生立刻押上全部赌注\n\n**优势**先理解成“这次比通常预期好多少”。优势为正，想提高这条选择的概率；为负，想降低它。\n\nPPO 再看新旧概率的比值。例如旧概率 0.2、新概率 0.3，比值为 1.5，变化已有 50%。clip 会限制目标从过大变化中继续获得好处，避免一次更新过分追随这批成绩。\n\n它不是把实际概率硬锁在某个范围里。正负优势时，取最小项的作用方向还不同，下面的算例再展开。\n\n**直答：** PPO 用优势决定鼓励还是抑制某些选择，再通过新旧概率比的裁剪限制过大的优化激励，帮助控制单次更新幅度。\n\n### 进一步：公式、边界与追问\n\n$$r_t(\\theta)=\\frac{\\pi_\\theta(a_t|s_t)}{\\pi_{\\rm old}(a_t|s_t)}$$\n\n$$J_{\\rm clip}=\\mathbb E\\min\\big(r_tA_t,\\ \\mathrm{clip}(r_t,1-\\epsilon,1+\\epsilon)A_t\\big).$$\n\n**技术表述：** 用保守的替代目标，限制“继续朝已获益方向推得过远”的激励。\n\n**展开：** A>0 时，r 超过上界后不再继续增加该样本收益；A<0 时，r 低于下界后不再继续奖励进一步压低概率。不是把真实更新或 KL 强行限制在一个硬球内。\n\n**追问：clip 外梯度一定为零？** 要看优势符号和 min 选中的分支。负优势且 r 过大时，仍可能有纠正梯度。\n\n**易错：** 训练通常最小化 −J，符号不能反。依据：S11。","html":"<h3>一次好成绩，不能让学生立刻押上全部赌注<\/h3>\n<p><strong>优势<\/strong>先理解成“这次比通常预期好多少”。优势为正，想提高这条选择的概率；为负，想降低它。<\/p>\n<p>PPO 再看新旧概率的比值。例如旧概率 0.2、新概率 0.3，比值为 1.5，变化已有 50%。clip 会限制目标从过大变化中继续获得好处，避免一次更新过分追随这批成绩。<\/p>\n<p>它不是把实际概率硬锁在某个范围里。正负优势时，取最小项的作用方向还不同，下面的算例再展开。<\/p>\n<p><strong>直答：<\/strong> PPO 用优势决定鼓励还是抑制某些选择，再通过新旧概率比的裁剪限制过大的优化激励，帮助控制单次更新幅度。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>r<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>θ<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mfrac><mrow><msub><mi>π<\/mi><mi>θ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>a<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">|<\/mo><msub><mi>s<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><\/mrow><mrow><msub><mi>π<\/mi><mrow><mi mathvariant=\"normal\">o<\/mi><mi mathvariant=\"normal\">l<\/mi><mi mathvariant=\"normal\">d<\/mi><\/mrow><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>a<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">|<\/mo><msub><mi>s<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><\/mrow><\/mfrac><\/mrow><\/math><\/div>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>J<\/mi><mrow><mi mathvariant=\"normal\">c<\/mi><mi mathvariant=\"normal\">l<\/mi><mi mathvariant=\"normal\">i<\/mi><mi mathvariant=\"normal\">p<\/mi><\/mrow><\/msub><mo>=<\/mo><mi mathvariant=\"normal\">𝔼<\/mi><mo>min<\/mo><mo minsize=\"1.2em\" maxsize=\"1.2em\">(<\/mo><msub><mi>r<\/mi><mi>t<\/mi><\/msub><msub><mi>A<\/mi><mi>t<\/mi><\/msub><mo>,<\/mo><mtext> <\/mtext><mrow><mi mathvariant=\"normal\">c<\/mi><mi mathvariant=\"normal\">l<\/mi><mi mathvariant=\"normal\">i<\/mi><mi mathvariant=\"normal\">p<\/mi><\/mrow><mo stretchy=\"false\">(<\/mo><msub><mi>r<\/mi><mi>t<\/mi><\/msub><mo>,<\/mo><mn>1<\/mn><mo>−<\/mo><mi>ϵ<\/mi><mo>,<\/mo><mn>1<\/mn><mo>+<\/mo><mi>ϵ<\/mi><mo stretchy=\"false\">)<\/mo><msub><mi>A<\/mi><mi>t<\/mi><\/msub><mo minsize=\"1.2em\" maxsize=\"1.2em\">)<\/mo><mo>.<\/mo><\/mrow><\/math><\/div>\n<p><strong>技术表述：<\/strong> 用保守的替代目标，限制“继续朝已获益方向推得过远”的激励。<\/p>\n<p><strong>展开：<\/strong> A&gt;0 时，r 超过上界后不再继续增加该样本收益；A&lt;0 时，r 低于下界后不再继续奖励进一步压低概率。不是把真实更新或 KL 强行限制在一个硬球内。<\/p>\n<p><strong>追问：clip 外梯度一定为零？<\/strong> 要看优势符号和 min 选中的分支。负优势且 r 过大时，仍可能有纠正梯度。<\/p>\n<p><strong>易错：<\/strong> 训练通常最小化 −J，符号不能反。依据：<a class=\"ref\" href=\"#source-S11\">S11<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-RL05" type="application/json">{"body":"### 一步走得好不好，要看眼前，也要看后果\n\n下棋的一步暂时吃到子，却可能几步后丢掉更大优势。GAE 会综合不同长度的后续反馈，估计当前动作比预期好多少。\n\n只看近处更依赖价值模型的估计，可能有偏；看得很远能利用更多真实结果，但随机波动也可能更大。λ 是调节这种混合方式的参数。\n\n**直答：** GAE 混合不同时间长度的优势估计，用 λ 在依赖价值预测与承受长期回报波动之间取舍。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** GAE 将不同长度的时序差分残差按权重累积，构造优势估计，在偏差与方差间折中。\n\n$$\\delta_t=r_t+\\gamma V(s_{t+1})-V(s_t)$$\n\n$$\\hat A_t=\\sum_{l\\ge0}(\\gamma\\lambda)^l\\delta_{t+l}.$$\n\n**展开：** λ 接近 0 更依赖一步估计，λ 接近 1 更依赖长程回报；价值估计误差和轨迹终止规则影响结果。截断与真正终止的 bootstrap 处理不能混用。\n\n**追问：GRPO 为什么省 critic？** 用同题组内奖励作比较基准，而不是为每个状态训练价值网络。\n\n**易错：** 不要把 λ 当成学习率。依据：S61、S12。","html":"<h3>一步走得好不好，要看眼前，也要看后果<\/h3>\n<p>下棋的一步暂时吃到子，却可能几步后丢掉更大优势。GAE 会综合不同长度的后续反馈，估计当前动作比预期好多少。<\/p>\n<p>只看近处更依赖价值模型的估计，可能有偏；看得很远能利用更多真实结果，但随机波动也可能更大。λ 是调节这种混合方式的参数。<\/p>\n<p><strong>直答：<\/strong> GAE 混合不同时间长度的优势估计，用 λ 在依赖价值预测与承受长期回报波动之间取舍。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> GAE 将不同长度的时序差分残差按权重累积，构造优势估计，在偏差与方差间折中。<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>δ<\/mi><mi>t<\/mi><\/msub><mo>=<\/mo><msub><mi>r<\/mi><mi>t<\/mi><\/msub><mo>+<\/mo><mi>γ<\/mi><mi>V<\/mi><mo stretchy=\"false\">(<\/mo><msub><mi>s<\/mi><mrow><mi>t<\/mi><mo>+<\/mo><mn>1<\/mn><\/mrow><\/msub><mo stretchy=\"false\">)<\/mo><mo>−<\/mo><mi>V<\/mi><mo stretchy=\"false\">(<\/mo><msub><mi>s<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><\/mrow><\/math><\/div>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mover><mi>A<\/mi><mo stretchy=\"false\">^<\/mo><\/mover><mi>t<\/mi><\/msub><mo>=<\/mo><munder><mo>∑<\/mo><mrow><mi>l<\/mi><mo>≥<\/mo><mn>0<\/mn><\/mrow><\/munder><mo stretchy=\"false\">(<\/mo><mi>γ<\/mi><mi>λ<\/mi><msup><mo stretchy=\"false\">)<\/mo><mi>l<\/mi><\/msup><msub><mi>δ<\/mi><mrow><mi>t<\/mi><mo>+<\/mo><mi>l<\/mi><\/mrow><\/msub><mo>.<\/mo><\/mrow><\/math><\/div>\n<p><strong>展开：<\/strong> λ 接近 0 更依赖一步估计，λ 接近 1 更依赖长程回报；价值估计误差和轨迹终止规则影响结果。截断与真正终止的 bootstrap 处理不能混用。<\/p>\n<p><strong>追问：GRPO 为什么省 critic？<\/strong> 用同题组内奖励作比较基准，而不是为每个状态训练价值网络。<\/p>\n<p><strong>易错：<\/strong> 不要把 λ 当成学习率。依据：<a class=\"ref\" href=\"#source-S61\">S61<\/a>、<a class=\"ref\" href=\"#source-S12\">S12<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-RL06" type="application/json">{"body":"### 不另请预测老师，先让同一道题的几份答案互相比\n\n对一道题生成 4 份回答，得分为 [0,0,1,1]，平均是 0.5。两份成功回答高于组平均，应得到正向信号；失败回答低于平均，应得到反向信号。\n\nGRPO 用这种组内比较来构造优势，省去 PPO 常用的独立价值模型。它仍要生成多份答案并评分，不能理解成训练完全没成本。\n\n**直答：** GRPO 对同题多次生成的结果做组内比较，用相对奖励构造优势，再优化生成概率，减少对独立 critic 的依赖。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 同一个问题生成一组回答，以组内相对奖励估计优势，通常省去独立价值模型。\n\n$$\\hat A_i=\\frac{R_i-\\bar R}{\\mathrm{std}(R_1,\\ldots,R_G)+\\varepsilon}.$$\n\n**展开：** 简单 outcome reward 设置里，一个回答的多个有效 token 共享该优势，再通过 token 概率比更新。原始 GRPO 也讨论过程奖励；工程变体对归一化、KL 和采样纠偏有差异。\n\n**追问：没有 critic 就没有 baseline？** 仍有组内均值基准，只是来源不同。\n\n**易错：** “只奖励最佳答案”不等于 GRPO 的全部组内相对更新。依据：S12。","html":"<h3>不另请预测老师，先让同一道题的几份答案互相比<\/h3>\n<p>对一道题生成 4 份回答，得分为 [0,0,1,1]，平均是 0.5。两份成功回答高于组平均，应得到正向信号；失败回答低于平均，应得到反向信号。<\/p>\n<p>GRPO 用这种组内比较来构造优势，省去 PPO 常用的独立价值模型。它仍要生成多份答案并评分，不能理解成训练完全没成本。<\/p>\n<p><strong>直答：<\/strong> GRPO 对同题多次生成的结果做组内比较，用相对奖励构造优势，再优化生成概率，减少对独立 critic 的依赖。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 同一个问题生成一组回答，以组内相对奖励估计优势，通常省去独立价值模型。<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mover><mi>A<\/mi><mo stretchy=\"false\">^<\/mo><\/mover><mi>i<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><msub><mi>R<\/mi><mi>i<\/mi><\/msub><mo>−<\/mo><mover><mi>R<\/mi><mo stretchy=\"true\">¯<\/mo><\/mover><\/mrow><mrow><mrow><mi mathvariant=\"normal\">s<\/mi><mi mathvariant=\"normal\">t<\/mi><mi mathvariant=\"normal\">d<\/mi><\/mrow><mo stretchy=\"false\">(<\/mo><msub><mi>R<\/mi><mn>1<\/mn><\/msub><mo>,<\/mo><mi>…<\/mi><mo>,<\/mo><msub><mi>R<\/mi><mi>G<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><mi>ε<\/mi><\/mrow><\/mfrac><mo>.<\/mo><\/mrow><\/math><\/div>\n<p><strong>展开：<\/strong> 简单 outcome reward 设置里，一个回答的多个有效 token 共享该优势，再通过 token 概率比更新。原始 GRPO 也讨论过程奖励；工程变体对归一化、KL 和采样纠偏有差异。<\/p>\n<p><strong>追问：没有 critic 就没有 baseline？<\/strong> 仍有组内均值基准，只是来源不同。<\/p>\n<p><strong>易错：<\/strong> “只奖励最佳答案”不等于 GRPO 的全部组内相对更新。依据：<a class=\"ref\" href=\"#source-S12\">S12<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-RL07" type="application/json">{"body":"### 先拆成三件事，别盯着整行公式\n\nGRPO 目标里通常能看到：第一，根据组内表现判断该鼓励谁；第二，用新旧概率比和裁剪控制更新；第三，在相应设置中用 KL 约束偏离参考模型。\n\n最后还要规定不同回答、不同 token 怎样求平均。看懂这些部件后，长公式只是把它们写在一行；不同实现会改变部件和开关。\n\n**直答：** 读 GRPO 目标时按“优势—概率比与裁剪—可选约束—聚合方式”拆开，逐项确认具体论文和训练器版本的定义。\n\n### 进一步：公式、边界与追问\n\n以一种常见的原始形式表示：\n\n$$J=\\mathbb E\\left[\\frac1G\\sum_{i=1}^{G}\\frac1{|y_i|}\n\\sum_t\\left(\\min(r_{i,t}\\hat A_i,\\mathrm{clip}(r_{i,t},1-\\epsilon,1+\\epsilon)\\hat A_i)\n-\\beta D_{i,t}\\right)\\right].$$\n\n**技术表述：** 组内优势决定方向，概率比与 clip 稳定更新，KL 项可约束参考偏离；按序列或 token 聚合会改变权重。\n\n**追问：所有 GRPO 框架都这样默认吗？** 不是。本文引用的 TRL v0.24.0 文档提供 dapo、dr_grpo 等选项，不能从“用 GRPOTrainer”推断实际目标。\n\n**易错：** 这里 β 是 KL 项权重，与 DPO/SimPO 里的记号应按各自公式解释。依据：S12、S16。","html":"<h3>先拆成三件事，别盯着整行公式<\/h3>\n<p>GRPO 目标里通常能看到：第一，根据组内表现判断该鼓励谁；第二，用新旧概率比和裁剪控制更新；第三，在相应设置中用 KL 约束偏离参考模型。<\/p>\n<p>最后还要规定不同回答、不同 token 怎样求平均。看懂这些部件后，长公式只是把它们写在一行；不同实现会改变部件和开关。<\/p>\n<p><strong>直答：<\/strong> 读 GRPO 目标时按“优势—概率比与裁剪—可选约束—聚合方式”拆开，逐项确认具体论文和训练器版本的定义。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p>以一种常见的原始形式表示：<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>J<\/mi><mo>=<\/mo><mi mathvariant=\"normal\">𝔼<\/mi><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">[<\/mo><mfrac><mn>1<\/mn><mi>G<\/mi><\/mfrac><msubsup><mo>∑<\/mo><mrow><mi>i<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><mrow><mi>G<\/mi><\/mrow><\/msubsup><mfrac><mn>1<\/mn><mrow><mo stretchy=\"false\">|<\/mo><msub><mi>y<\/mi><mi>i<\/mi><\/msub><mo stretchy=\"false\">|<\/mo><\/mrow><\/mfrac><msub><mo>∑<\/mo><mi>t<\/mi><\/msub><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">(<\/mo><mo>min<\/mo><mo stretchy=\"false\">(<\/mo><msub><mi>r<\/mi><mrow><mi>i<\/mi><mo>,<\/mo><mi>t<\/mi><\/mrow><\/msub><msub><mover><mi>A<\/mi><mo stretchy=\"false\">^<\/mo><\/mover><mi>i<\/mi><\/msub><mo>,<\/mo><mrow><mi mathvariant=\"normal\">c<\/mi><mi mathvariant=\"normal\">l<\/mi><mi mathvariant=\"normal\">i<\/mi><mi mathvariant=\"normal\">p<\/mi><\/mrow><mo stretchy=\"false\">(<\/mo><msub><mi>r<\/mi><mrow><mi>i<\/mi><mo>,<\/mo><mi>t<\/mi><\/mrow><\/msub><mo>,<\/mo><mn>1<\/mn><mo>−<\/mo><mi>ϵ<\/mi><mo>,<\/mo><mn>1<\/mn><mo>+<\/mo><mi>ϵ<\/mi><mo stretchy=\"false\">)<\/mo><msub><mover><mi>A<\/mi><mo stretchy=\"false\">^<\/mo><\/mover><mi>i<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><mo>−<\/mo><mi>β<\/mi><msub><mi>D<\/mi><mrow><mi>i<\/mi><mo>,<\/mo><mi>t<\/mi><\/mrow><\/msub><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">]<\/mo><\/mrow><mo>.<\/mo><\/mrow><\/math><\/div>\n<p><strong>技术表述：<\/strong> 组内优势决定方向，概率比与 clip 稳定更新，KL 项可约束参考偏离；按序列或 token 聚合会改变权重。<\/p>\n<p><strong>追问：所有 GRPO 框架都这样默认吗？<\/strong> 不是。本文引用的 TRL v0.24.0 文档提供 dapo、dr_grpo 等选项，不能从“用 GRPOTrainer”推断实际目标。<\/p>\n<p><strong>易错：<\/strong> 这里 β 是 KL 项权重，与 DPO/SimPO 里的记号应按各自公式解释。依据：<a class=\"ref\" href=\"#source-S12\">S12<\/a>、<a class=\"ref\" href=\"#source-S16\">S16<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-RL08" type="application/json">{"body":"### 四个人都得零分，排名就教不了谁\n\n假设同题生成四份答案，奖励全为 0。每份减去组平均仍为 0，组内比较无法说明哪份更值得学习。全都得 1 分也一样。\n\n这不是程序一定坏了，而是这一组没有相对差异。增加探索或挑选有学习空间的题可能有帮助，但不能凭空把错误答案标成成功。\n\n**直答：** 同组奖励全相同时，常见组内中心化得到零优势，偏好方向的学习信号消失；需要检查题目难度、生成覆盖和奖励区分度。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 减去组均值后优势全为零，奖励驱动的策略梯度没有区分信号；KL 等额外项仍可能产生更新。\n\n**展开：** 全对可能表示题太简单，全错可能题太难、验证器坏或探索不足。增加组大小仅提高遇到差异的机会，不保证解决。\n\n**追问：怎么排查？** 分开记录全对、全错与部分正确的比例，检查奖励解析、采样温度、课程难度及是否被截断。\n\n**易错：** std=0 加 ε 防止数值异常，但不会凭空产生学习信号。依据：S12、S16。","html":"<h3>四个人都得零分，排名就教不了谁<\/h3>\n<p>假设同题生成四份答案，奖励全为 0。每份减去组平均仍为 0，组内比较无法说明哪份更值得学习。全都得 1 分也一样。<\/p>\n<p>这不是程序一定坏了，而是这一组没有相对差异。增加探索或挑选有学习空间的题可能有帮助，但不能凭空把错误答案标成成功。<\/p>\n<p><strong>直答：<\/strong> 同组奖励全相同时，常见组内中心化得到零优势，偏好方向的学习信号消失；需要检查题目难度、生成覆盖和奖励区分度。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 减去组均值后优势全为零，奖励驱动的策略梯度没有区分信号；KL 等额外项仍可能产生更新。<\/p>\n<p><strong>展开：<\/strong> 全对可能表示题太简单，全错可能题太难、验证器坏或探索不足。增加组大小仅提高遇到差异的机会，不保证解决。<\/p>\n<p><strong>追问：怎么排查？<\/strong> 分开记录全对、全错与部分正确的比例，检查奖励解析、采样温度、课程难度及是否被截断。<\/p>\n<p><strong>易错：<\/strong> std=0 加 ε 防止数值异常，但不会凭空产生学习信号。依据：<a class=\"ref\" href=\"#source-S12\">S12<\/a>、<a class=\"ref\" href=\"#source-S16\">S16<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-RL09" type="application/json">{"body":"### 一个班只差一分，除以很小的波动会怎样？\n\n组内标准差表示这组奖励有多分散。把差值除以标准差，可以统一尺度；但如果整组差异很小，小小的奖励变化也可能被放得很大。\n\n这会改变不同题目的相对权重。奖励中的微小噪声，也可能因此显得很重要。\n\n**直答：** 标准差归一化既调整尺度，也可能改变题目权重并放大奖励噪声；要结合零方差处理和不同难度题的表现检查。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 它改变问题间的相对权重；同样的原始奖励差，在低方差组中可能被放大。\n\n**展开：** 组归一化便于比较不同尺度，但可能引入题目难度相关偏置。移除标准差缩放、用 batch 统计或调整采样都是不同设计，需与基线比较。\n\n**追问：只看 reward mean 够吗？** 不够，还看 group std、有效组比例、长度、熵与分任务收益。\n\n**易错：** 任何归一化都在定义训练权重，不能视为纯数值清洁。依据：S15、S16。","html":"<h3>一个班只差一分，除以很小的波动会怎样？<\/h3>\n<p>组内标准差表示这组奖励有多分散。把差值除以标准差，可以统一尺度；但如果整组差异很小，小小的奖励变化也可能被放得很大。<\/p>\n<p>这会改变不同题目的相对权重。奖励中的微小噪声，也可能因此显得很重要。<\/p>\n<p><strong>直答：<\/strong> 标准差归一化既调整尺度，也可能改变题目权重并放大奖励噪声；要结合零方差处理和不同难度题的表现检查。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 它改变问题间的相对权重；同样的原始奖励差，在低方差组中可能被放大。<\/p>\n<p><strong>展开：<\/strong> 组归一化便于比较不同尺度，但可能引入题目难度相关偏置。移除标准差缩放、用 batch 统计或调整采样都是不同设计，需与基线比较。<\/p>\n<p><strong>追问：只看 reward mean 够吗？<\/strong> 不够，还看 group std、有效组比例、长度、熵与分任务收益。<\/p>\n<p><strong>易错：<\/strong> 任何归一化都在定义训练权重，不能视为纯数值清洁。依据：<a class=\"ref\" href=\"#source-S15\">S15<\/a>、<a class=\"ref\" href=\"#source-S16\">S16<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-RL10" type="application/json">{"body":"### 先平均每篇作文，还是先平均每个字？\n\n短回答有 2 个 token，长回答有 8 个。如果先算每条回答的平均损失，再各占一半，两个回答同等重要；如果把 10 个 token 放在一起平均，长回答占 8/10。\n\n再改成除以预先规定的固定长度，整体更新尺度也会变。分母看似只是算术细节，其实在决定训练重视什么。\n\n**直答：** 不同聚合方式给回答和 token 不同权重；讨论 GRPO、DAPO、Dr. GRPO 时，要写出实际分母，并区分各方法的其他改动。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 它们对回答长度和有效 token 的权重处理不同；DAPO 还包含其他训练改进，不能被缩成一个分母。\n\n| 聚合示意 | 单题一组 token loss l 的聚合 |\n|---|---|\n| 原始序列平均 | (1/G)∑ᵢ(1/Lᵢ)∑ₜ lᵢₜ |\n| DAPO 型 token 平均 | ∑ᵢₜ lᵢₜ / ∑ᵢLᵢ |\n| Dr. GRPO 型常数归一 | ∑ᵢₜ lᵢₜ / (G·L_max) |\n\n**展开：** 可用“短回答 2 token、长回答 8 token、同样每 token loss”手算，看单条回答和单个 token 的权重。分布式训练还需确认分母是否跨卡正确汇总。\n\n**追问：两条回答各贡献多少？** 每 token loss 取 1，序列平均中各贡献 1/2；token 平均中分别为 2/10 与 8/10；常数归一取 L_max=10，分别为 2/20 与 8/20。单题组内 token 平均与常数归一的相对权重相同，但分母尺度及跨组关系不同。\n\n**易错：** 不能只改名字不记录实际 loss_type、scale_rewards 与截断处理。依据：S14、S15、S16。","html":"<h3>先平均每篇作文，还是先平均每个字？<\/h3>\n<p>短回答有 2 个 token，长回答有 8 个。如果先算每条回答的平均损失，再各占一半，两个回答同等重要；如果把 10 个 token 放在一起平均，长回答占 8/10。<\/p>\n<p>再改成除以预先规定的固定长度，整体更新尺度也会变。分母看似只是算术细节，其实在决定训练重视什么。<\/p>\n<p><strong>直答：<\/strong> 不同聚合方式给回答和 token 不同权重；讨论 GRPO、DAPO、Dr. GRPO 时，要写出实际分母，并区分各方法的其他改动。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 它们对回答长度和有效 token 的权重处理不同；DAPO 还包含其他训练改进，不能被缩成一个分母。<\/p>\n<table>\n<thead>\n<tr>\n<th>聚合示意<\/th>\n<th>单题一组 token loss l 的聚合<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>原始序列平均<\/td>\n<td>(1/G)∑ᵢ(1/Lᵢ)∑ₜ lᵢₜ<\/td>\n<\/tr>\n<tr>\n<td>DAPO 型 token 平均<\/td>\n<td>∑ᵢₜ lᵢₜ / ∑ᵢLᵢ<\/td>\n<\/tr>\n<tr>\n<td>Dr. GRPO 型常数归一<\/td>\n<td>∑ᵢₜ lᵢₜ / (G·L_max)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>展开：<\/strong> 可用“短回答 2 token、长回答 8 token、同样每 token loss”手算，看单条回答和单个 token 的权重。分布式训练还需确认分母是否跨卡正确汇总。<\/p>\n<p><strong>追问：两条回答各贡献多少？<\/strong> 每 token loss 取 1，序列平均中各贡献 1/2；token 平均中分别为 2/10 与 8/10；常数归一取 L_max=10，分别为 2/20 与 8/20。单题组内 token 平均与常数归一的相对权重相同，但分母尺度及跨组关系不同。<\/p>\n<p><strong>易错：<\/strong> 不能只改名字不记录实际 loss_type、scale_rewards 与截断处理。依据：<a class=\"ref\" href=\"#source-S14\">S14<\/a>、<a class=\"ref\" href=\"#source-S15\">S15<\/a>、<a class=\"ref\" href=\"#source-S16\">S16<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-RL11" type="application/json">{"body":"### 真正的平均数非负，不代表每次抽样值都非负\n\nKL 是一整个分布上的加权平均。实际大模型通常难以枚举所有完整答案，于是抽样估计。\n\n像一个长期盈利的项目，某一天也可能亏损，单个样本的 log 概率比可以为负；这不否定对应真实 KL 的非负性。要看样本按哪个分布取得、估计量怎么定义。\n\n**直答：** KL 的非负性属于正确计算的分布平均；有限样本或单条 log 比可能为负，需区分真值、估计量与采样误差。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 真正 KL 非负，但单个采样点的 log 概率比可以为负；有限样本均值也可能有波动。\n\n若从当前 π 采样，令 u=π_ref(a|s)/π(a|s)，常见非负点估计为：\n\n$$u-\\log u-1\\ge0.$$\n\n它在支持与期望条件成立时对应 KL(π‖π_ref) 的期望。实现是否使用当前、旧策略或纠偏权重需确认。\n\n**追问：logπ−logπ_ref<0 就是代码错吗？** 不一定，它只是该 token 在参考模型下更可能。\n\n**易错：** token 抽样估计、词表精确 KL、整序列 KL 不要不加说明地混报。依据：S12、S16。","html":"<h3>真正的平均数非负，不代表每次抽样值都非负<\/h3>\n<p>KL 是一整个分布上的加权平均。实际大模型通常难以枚举所有完整答案，于是抽样估计。<\/p>\n<p>像一个长期盈利的项目，某一天也可能亏损，单个样本的 log 概率比可以为负；这不否定对应真实 KL 的非负性。要看样本按哪个分布取得、估计量怎么定义。<\/p>\n<p><strong>直答：<\/strong> KL 的非负性属于正确计算的分布平均；有限样本或单条 log 比可能为负，需区分真值、估计量与采样误差。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 真正 KL 非负，但单个采样点的 log 概率比可以为负；有限样本均值也可能有波动。<\/p>\n<p>若从当前 π 采样，令 u=π_ref(a|s)/π(a|s)，常见非负点估计为：<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>u<\/mi><mo>−<\/mo><mi>log<\/mi><mi>u<\/mi><mo>−<\/mo><mn>1<\/mn><mo>≥<\/mo><mn>0<\/mn><mo>.<\/mo><\/mrow><\/math><\/div>\n<p>它在支持与期望条件成立时对应 KL(π‖π_ref) 的期望。实现是否使用当前、旧策略或纠偏权重需确认。<\/p>\n<p><strong>追问：logπ−logπ_ref&lt;0 就是代码错吗？<\/strong> 不一定，它只是该 token 在参考模型下更可能。<\/p>\n<p><strong>易错：<\/strong> token 抽样估计、词表精确 KL、整序列 KL 不要不加说明地混报。依据：<a class=\"ref\" href=\"#source-S12\">S12<\/a>、<a class=\"ref\" href=\"#source-S16\">S16<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-RL12" type="application/json">{"body":"### 有客观判卷器很好，但模型可能钻规则空子\n\n数学题可以核对答案，代码题可以运行测试，用这些可验证结果提供奖励，就是 RLVR 的典型思路。\n\n如果程序只检查最后有没有出现正确数字，模型可能在正文乱答、结尾堆数字，也拿到分。这叫 reward hacking：学会迎合评分规则，却没实现真正目标。\n\n**直答：** RLVR 利用可验证结果提供训练奖励；验证器需要检查真实任务要求，否则优化会放大奖励规则的漏洞。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** RLVR 用规则、答案或执行结果提供可验证奖励；reward hacking 是策略利用评分漏洞获得高分，却没完成真实目标。\n\n**展开：** 代码只通过可见用例可能硬编码；格式奖励过重可能产生漂亮空答案；答案提取器宽松可能接受矛盾输出。验证器需要负例、边界例、隐藏用例和解析失败统计。\n\n**追问：规则奖励比模型奖励永远可靠？** 规则更可检查，但覆盖有限且可能被利用；正确运行的评分器也可能测错目标。\n\n**易错：** reward=1 只表示通过当前规则，不自动证明完整推理正确。依据：S13。","html":"<h3>有客观判卷器很好，但模型可能钻规则空子<\/h3>\n<p>数学题可以核对答案，代码题可以运行测试，用这些可验证结果提供奖励，就是 RLVR 的典型思路。<\/p>\n<p>如果程序只检查最后有没有出现正确数字，模型可能在正文乱答、结尾堆数字，也拿到分。这叫 reward hacking：学会迎合评分规则，却没实现真正目标。<\/p>\n<p><strong>直答：<\/strong> RLVR 利用可验证结果提供训练奖励；验证器需要检查真实任务要求，否则优化会放大奖励规则的漏洞。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> RLVR 用规则、答案或执行结果提供可验证奖励；reward hacking 是策略利用评分漏洞获得高分，却没完成真实目标。<\/p>\n<p><strong>展开：<\/strong> 代码只通过可见用例可能硬编码；格式奖励过重可能产生漂亮空答案；答案提取器宽松可能接受矛盾输出。验证器需要负例、边界例、隐藏用例和解析失败统计。<\/p>\n<p><strong>追问：规则奖励比模型奖励永远可靠？<\/strong> 规则更可检查，但覆盖有限且可能被利用；正确运行的评分器也可能测错目标。<\/p>\n<p><strong>易错：<\/strong> reward=1 只表示通过当前规则，不自动证明完整推理正确。依据：<a class=\"ref\" href=\"#source-S13\">S13<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-RL13" type="application/json">{"body":"### 只看最后答案，还是也批改步骤？\n\n结果奖励像只看最终答案是否正确，便宜直接，但不容易定位哪一步有贡献；过程奖励也评价中间步骤，反馈更细，却需要更可靠、更昂贵的步骤判断。\n\n一道题可能有多种正确解法，若过程评审只认一种写法，就可能误罚其他有效路径。\n\n**直答：** 结果奖励适合最终结果可可靠验证的任务；过程奖励能提供更细反馈，但要处理步骤标注成本与错误评审风险。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 结果奖励便于定义但反馈稀疏；过程奖励提供更密集信号，却需可靠地评价中间步骤。\n\n**展开：** 数学最终答案可判定，不代表每一步可简单打分；错误推理可能偶然得到正确结果。过程评分器也可能偏爱熟悉路径，误伤新解法。\n\n**追问：怎么公平比较？** 控制标注和评审计算预算，报告最终正确率、搜索成本、过程评分与人工一致性，做验证器失效分析。\n\n**易错：** 把每步都给同一个最终 reward 不等于学到了准确的过程价值。依据：S17。","html":"<h3>只看最后答案，还是也批改步骤？<\/h3>\n<p>结果奖励像只看最终答案是否正确，便宜直接，但不容易定位哪一步有贡献；过程奖励也评价中间步骤，反馈更细，却需要更可靠、更昂贵的步骤判断。<\/p>\n<p>一道题可能有多种正确解法，若过程评审只认一种写法，就可能误罚其他有效路径。<\/p>\n<p><strong>直答：<\/strong> 结果奖励适合最终结果可可靠验证的任务；过程奖励能提供更细反馈，但要处理步骤标注成本与错误评审风险。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 结果奖励便于定义但反馈稀疏；过程奖励提供更密集信号，却需可靠地评价中间步骤。<\/p>\n<p><strong>展开：<\/strong> 数学最终答案可判定，不代表每一步可简单打分；错误推理可能偶然得到正确结果。过程评分器也可能偏爱熟悉路径，误伤新解法。<\/p>\n<p><strong>追问：怎么公平比较？<\/strong> 控制标注和评审计算预算，报告最终正确率、搜索成本、过程评分与人工一致性，做验证器失效分析。<\/p>\n<p><strong>易错：<\/strong> 把每步都给同一个最终 reward 不等于学到了准确的过程价值。依据：<a class=\"ref\" href=\"#source-S17\">S17<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-RL14" type="application/json">{"body":"### 成绩乱跳时，先查试卷和裁判\n\n在线训练中，模型不断生成新答案。若奖励程序有错、回答被截断、策略版本记混，就算优化器完全正确，训练也会异常。\n\n先看完整生成案例、奖励分布、全错组、答案长度和更新幅度，再决定是否调整学习率。\n\n**直答：** 先验证采样、奖励和数据记录，再查梯度与优化设置；训练不稳定往往来自整个学习流程，而不只是某一个参数。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 先排奖励与轨迹正确性，再看策略更新幅度、采样分布和系统一致性。\n\n**展开：** 核查奖励解析、EOS/截断、response mask、old logprob 与当前权重版本；监控 ratio、clip fraction、KL、entropy、梯度与全零优势组。若 rollout 引擎与训练引擎算出的概率不同，需要明确纠偏或容忍范围。\n\n**追问：reward 上升、真实测试下降怎么办？** 检查奖励投机、过拟合验证器、长度漂移和测试分布；停止只围绕训练 reward 选模型。\n\n**易错：** 直接加大 KL 或降低学习率可能缓解表面症状，却没修复数据错误。","html":"<h3>成绩乱跳时，先查试卷和裁判<\/h3>\n<p>在线训练中，模型不断生成新答案。若奖励程序有错、回答被截断、策略版本记混，就算优化器完全正确，训练也会异常。<\/p>\n<p>先看完整生成案例、奖励分布、全错组、答案长度和更新幅度，再决定是否调整学习率。<\/p>\n<p><strong>直答：<\/strong> 先验证采样、奖励和数据记录，再查梯度与优化设置；训练不稳定往往来自整个学习流程，而不只是某一个参数。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 先排奖励与轨迹正确性，再看策略更新幅度、采样分布和系统一致性。<\/p>\n<p><strong>展开：<\/strong> 核查奖励解析、EOS/截断、response mask、old logprob 与当前权重版本；监控 ratio、clip fraction、KL、entropy、梯度与全零优势组。若 rollout 引擎与训练引擎算出的概率不同，需要明确纠偏或容忍范围。<\/p>\n<p><strong>追问：reward 上升、真实测试下降怎么办？<\/strong> 检查奖励投机、过拟合验证器、长度漂移和测试分布；停止只围绕训练 reward 选模型。<\/p>\n<p><strong>易错：<\/strong> 直接加大 KL 或降低学习率可能缓解表面症状，却没修复数据错误。<\/p><\/div><\/details>"}</script>
<script id="data-q-RL15" type="application/json">{"body":"### 不只上课花时间，出题、作答、批改也花时间\n\n在线 RL 每轮需要让模型真正生成多份回答，再验证、打分、整理训练数据，最后更新参数。长回答、多候选和慢工具都可能让采样成为主要成本。\n\n所以省掉 critic 并不等于省掉主要时间。要统计完整一轮，而不只是反向传播耗时。\n\n**直答：** 在线 RL 的成本包括生成、环境交互、验证和训练更新；总预算要按整条流程计算，关注最慢的环节。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 不只反向传播，往往还有大量采样、长回答、评分、工具环境和同步等待。\n\n**展开：** 成本记录包括生成 token、训练 token、每题组数、验证器调用、环境时间、GPU 利用率与峰值显存。长短任务混合可出现尾部等待；异步能改善吞吐，却引入策略滞后与轨迹版本管理。\n\n**追问：省掉 critic 就一定比 DPO 便宜？** 不一定；在线探索可能远比一次离线训练昂贵，应比较总预算与质量。\n\n**易错：** 不要用 optimizer step 数对比不同 rollout 长度和组数。","html":"<h3>不只上课花时间，出题、作答、批改也花时间<\/h3>\n<p>在线 RL 每轮需要让模型真正生成多份回答，再验证、打分、整理训练数据，最后更新参数。长回答、多候选和慢工具都可能让采样成为主要成本。<\/p>\n<p>所以省掉 critic 并不等于省掉主要时间。要统计完整一轮，而不只是反向传播耗时。<\/p>\n<p><strong>直答：<\/strong> 在线 RL 的成本包括生成、环境交互、验证和训练更新；总预算要按整条流程计算，关注最慢的环节。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 不只反向传播，往往还有大量采样、长回答、评分、工具环境和同步等待。<\/p>\n<p><strong>展开：<\/strong> 成本记录包括生成 token、训练 token、每题组数、验证器调用、环境时间、GPU 利用率与峰值显存。长短任务混合可出现尾部等待；异步能改善吞吐，却引入策略滞后与轨迹版本管理。<\/p>\n<p><strong>追问：省掉 critic 就一定比 DPO 便宜？<\/strong> 不一定；在线探索可能远比一次离线训练昂贵，应比较总预算与质量。<\/p>\n<p><strong>易错：<\/strong> 不要用 optimizer step 数对比不同 rollout 长度和组数。<\/p><\/div><\/details>"}</script>
