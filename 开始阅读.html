<script id="data-q-AG29" type="application/json">{"body":"**先看例子：**让模型随便编一万条“请修复项目”的需求很容易；项目装不上、测试不存在、要求互相矛盾时，这一万条文本就不能可靠地训练 Agent。\n\n**直答：**这类可验证训练任务应明确初始环境、目标、可执行工具与验收器，并尽量用已知可行解检查可做性。数据规模应按“能运行、能验收的任务数”计算。\n\n### 进一步：公式、边界与追问\n\nSWE-smith 的关键顺序是先搭好真实代码仓库的环境，再引入会触发测试失败的修改，构造修复任务；它还保留修复应通过、原本正常功能应继续通过两类测试。（S122）\n\n教学流程可以是：确认原始项目通过测试 → 注入一个逻辑错误 → 确认目标测试失败 → 生成与错误一致的需求 → 应用已知修复 → 确认目标和回归测试通过。每步保存日志，任何一关失败都不纳入训练。\n\n**追问：既然已有正确修复，Agent 会偷看吗？**评测工作区只放允许的初始材料，把参考答案和隐藏验收留在独立位置；确认历史版本、任务元数据或联网结果没有泄漏目标答案。隔离后再跑正常构建，避免封掉答案时也封掉必要依赖。\n\n**追问：测试通过就是真正高质量吗？**测试可能漏掉边界，也可能强行限定某一种正确写法。S127 的 2026 年 9 月预印本同时修环境泄漏和任务描述/测试不一致，说明验收器本身也需审计。\n\n**可做的对照：**按仓库或任务模板留出测试集，再与随机切分比较。若随机切分很强、换仓库骤降，就要排查同源任务记忆；用真实历史故障再测一次，判断合成错误能否迁移。","html":"<p><strong>先看例子：<\/strong>让模型随便编一万条“请修复项目”的需求很容易；项目装不上、测试不存在、要求互相矛盾时，这一万条文本就不能可靠地训练 Agent。<\/p>\n<p><strong>直答：<\/strong>这类可验证训练任务应明确初始环境、目标、可执行工具与验收器，并尽量用已知可行解检查可做性。数据规模应按“能运行、能验收的任务数”计算。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p>SWE-smith 的关键顺序是先搭好真实代码仓库的环境，再引入会触发测试失败的修改，构造修复任务；它还保留修复应通过、原本正常功能应继续通过两类测试。（<a class=\"ref\" href=\"#source-S122\">S122<\/a>）<\/p>\n<p>教学流程可以是：确认原始项目通过测试 → 注入一个逻辑错误 → 确认目标测试失败 → 生成与错误一致的需求 → 应用已知修复 → 确认目标和回归测试通过。每步保存日志，任何一关失败都不纳入训练。<\/p>\n<p><strong>追问：既然已有正确修复，Agent 会偷看吗？<\/strong>评测工作区只放允许的初始材料，把参考答案和隐藏验收留在独立位置；确认历史版本、任务元数据或联网结果没有泄漏目标答案。隔离后再跑正常构建，避免封掉答案时也封掉必要依赖。<\/p>\n<p><strong>追问：测试通过就是真正高质量吗？<\/strong>测试可能漏掉边界，也可能强行限定某一种正确写法。<a class=\"ref\" href=\"#source-S127\">S127<\/a> 的 2026 年 9 月预印本同时修环境泄漏和任务描述/测试不一致，说明验收器本身也需审计。<\/p>\n<p><strong>可做的对照：<\/strong>按仓库或任务模板留出测试集，再与随机切分比较。若随机切分很强、换仓库骤降，就要排查同源任务记忆；用真实历史故障再测一次，判断合成错误能否迁移。<\/p><\/div><\/details>"}</script>
<script id="data-q-AG30" type="application/json">{"body":"**先看例子：**能修 Python 项目的助手，未必能引导用户排查手机网络；会查订单的客服，也未必能在终端里配置一个陌生服务。这些都是 Agent，考试内容却不同。\n\n**直答：**先看任务与验收方式，再看分数。终态验收问“环境中真的完成了吗”；过程验收补充“怎样完成、有没有违反约束”。\n\n### 进一步：公式、边界与追问\n\n| 基准 | 典型能力 | 不能由分数直接推断 |\n|---|---|---|\n| τ²-bench | 多轮服务、遵守领域规则；telecom 中与能操作设备的模拟用户协作 | 真实用户口音、耐心和所有业务变化 |\n| Terminal-Bench | 在受控终端环境完成可验证的计算机任务 | 任意生产系统都能直接自治 |\n| SWE 类基准 | 根据仓库需求提交修复，并通过验收测试 | 需求设计、长期维护和团队协作全部能力 |\n\nτ² 的“双控制”是用户和 Agent 各自能改变部分环境；可以通过“Agent 独自控制全部工具”和“与用户协作”对照，诊断沟通负担。（S123）\n\n**追问：2026 年还只看这些老版本吗？**截至本轮核查，Terminal-Bench 已发布 4.0；τ 系列官方仓库已加入 τ³ 的知识检索和语音方向；SWE-Bench Pro Verified 的 9 月预印本研究验收可靠性。新旧版本的任务、资源和验收变化需要分别记账。（S124、S126、S127）\n\n**追问：客服最后说“处理成功”算成功吗？**应查目标状态、金额与次数等必要字段。这里以报销为例：申请存在但金额错，仍然失败。可接受多条正确路径，只有业务必需的步骤才写进硬约束，避免把参考轨迹当唯一答案。","html":"<p><strong>先看例子：<\/strong>能修 Python 项目的助手，未必能引导用户排查手机网络；会查订单的客服，也未必能在终端里配置一个陌生服务。这些都是 Agent，考试内容却不同。<\/p>\n<p><strong>直答：<\/strong>先看任务与验收方式，再看分数。终态验收问“环境中真的完成了吗”；过程验收补充“怎样完成、有没有违反约束”。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><table>\n<thead>\n<tr>\n<th>基准<\/th>\n<th>典型能力<\/th>\n<th>不能由分数直接推断<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>τ²-bench<\/td>\n<td>多轮服务、遵守领域规则；telecom 中与能操作设备的模拟用户协作<\/td>\n<td>真实用户口音、耐心和所有业务变化<\/td>\n<\/tr>\n<tr>\n<td>Terminal-Bench<\/td>\n<td>在受控终端环境完成可验证的计算机任务<\/td>\n<td>任意生产系统都能直接自治<\/td>\n<\/tr>\n<tr>\n<td>SWE 类基准<\/td>\n<td>根据仓库需求提交修复，并通过验收测试<\/td>\n<td>需求设计、长期维护和团队协作全部能力<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>τ² 的“双控制”是用户和 Agent 各自能改变部分环境；可以通过“Agent 独自控制全部工具”和“与用户协作”对照，诊断沟通负担。（<a class=\"ref\" href=\"#source-S123\">S123<\/a>）<\/p>\n<p><strong>追问：2026 年还只看这些老版本吗？<\/strong>截至本轮核查，Terminal-Bench 已发布 4.0；τ 系列官方仓库已加入 τ³ 的知识检索和语音方向；SWE-Bench Pro Verified 的 9 月预印本研究验收可靠性。新旧版本的任务、资源和验收变化需要分别记账。（<a class=\"ref\" href=\"#source-S124\">S124<\/a>、<a class=\"ref\" href=\"#source-S126\">S126<\/a>、<a class=\"ref\" href=\"#source-S127\">S127<\/a>）<\/p>\n<p><strong>追问：客服最后说“处理成功”算成功吗？<\/strong>应查目标状态、金额与次数等必要字段。这里以报销为例：申请存在但金额错，仍然失败。可接受多条正确路径，只有业务必需的步骤才写进硬约束，避免把参考轨迹当唯一答案。<\/p><\/div><\/details>"}</script>
<script id="data-q-AG31" type="application/json">{"body":"**先看例子：**助手声称“申请已提交”，最终数据库没有记录。只看最终回答，会误判成语言表达问题；回看过程发现提交接口超时，问题是它没有确认执行结果。\n\n**直答：**trace 是任务执行记录。把用户目标、模型实际输入、工具调用、观察、状态变化和终态验收对齐，找到第一处偏离目标的决策，再验证修复能否减少同类失败。\n\n### 进一步：公式、边界与追问\n\n| 步骤 | 实际记录 | 初步判断 |\n|---|---|---|\n| 1 | 查单据：审核通过 | 信息足够 |\n| 2 | 提交申请：超时，提交状态未知 | 必须确认状态 |\n| 3 | 助手直接报告成功 | 无证据的成功声明 |\n| 验收 | 申请不存在 | 任务失败 |\n\n可以按“信息缺失、选错工具、参数错误、误读观察、状态恢复失败、验收器错误”统计原因。表格是教学案例，不是模型跑分。可落地的修复是：超时后按业务请求号查结果，确认未提交后再决定是否重试。\n\n**追问：让另一个模型读 trace 打分就够吗？**先用程序校验事实与状态，再让模型按清楚的评分规则检查难以机械判断的行为，最后抽样人工复核。评审模型的标签要与人工样本对齐，不能把流畅的分析当因果证据。（S125）\n\n**追问：如何证明找对原因？**在同一批初始状态上重放失败类型，只替换一个处理环节；比较恢复成功率与重复提交率。需要模型当时真正可见的工具内容与时间顺序；不可见的内部推理不是必需日志，也不应假设服务一定提供。","html":"<p><strong>先看例子：<\/strong>助手声称“申请已提交”，最终数据库没有记录。只看最终回答，会误判成语言表达问题；回看过程发现提交接口超时，问题是它没有确认执行结果。<\/p>\n<p><strong>直答：<\/strong>trace 是任务执行记录。把用户目标、模型实际输入、工具调用、观察、状态变化和终态验收对齐，找到第一处偏离目标的决策，再验证修复能否减少同类失败。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><table>\n<thead>\n<tr>\n<th>步骤<\/th>\n<th>实际记录<\/th>\n<th>初步判断<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>查单据：审核通过<\/td>\n<td>信息足够<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>提交申请：超时，提交状态未知<\/td>\n<td>必须确认状态<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>助手直接报告成功<\/td>\n<td>无证据的成功声明<\/td>\n<\/tr>\n<tr>\n<td>验收<\/td>\n<td>申请不存在<\/td>\n<td>任务失败<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>可以按“信息缺失、选错工具、参数错误、误读观察、状态恢复失败、验收器错误”统计原因。表格是教学案例，不是模型跑分。可落地的修复是：超时后按业务请求号查结果，确认未提交后再决定是否重试。<\/p>\n<p><strong>追问：让另一个模型读 trace 打分就够吗？<\/strong>先用程序校验事实与状态，再让模型按清楚的评分规则检查难以机械判断的行为，最后抽样人工复核。评审模型的标签要与人工样本对齐，不能把流畅的分析当因果证据。（<a class=\"ref\" href=\"#source-S125\">S125<\/a>）<\/p>\n<p><strong>追问：如何证明找对原因？<\/strong>在同一批初始状态上重放失败类型，只替换一个处理环节；比较恢复成功率与重复提交率。需要模型当时真正可见的工具内容与时间顺序；不可见的内部推理不是必需日志，也不应假设服务一定提供。<\/p><\/div><\/details>"}</script>
<script id="data-q-AG32" type="application/json">{"body":"**先看例子：**旧方案 100 题成功 70 题，新方案成功 72 题；如果重新运行各自会波动三四题，这次增加的两题可能只是随机变化。\n\n**直答：**同时看任务覆盖、重复运行、不确定范围和成本。比较应使用同一测试集与资源预算，并保留逐题结果，不能只截一张最高分截图。\n\n### 进一步：公式、边界与追问\n\n教学实验可以从 50 个独立业务场景开始，每题各跑 3 次。对每个场景计算新旧差值，再以“场景”为单位重采样，估计差值区间。一个场景的三次尝试相关，不能随意当成三个全新的业务场景。区间跨过零时，报告方向不确定，并扩大样本或针对失败类型继续排查。\n\n**追问：pass@k 和 pass^k 差在哪？**前者问 k 次里至少成功一次；后者问 k 次是否都成功。前者描述尝试机会，后者强调重复可靠性。它们的具体估计要按基准实现；不要把全库平均成功率直接乘 k 次，冒充逐题可靠性。基础定义见 S31，实践解释见 S125。\n\n**追问：多试几次成功了，不就能上线吗？**还需要知道系统能否识别哪次正确，以及重试会不会产生重复操作。验收器只在测试时知道真值，部署未必拥有同样判断能力。\n\n同时记总费用、每个成功任务的摊销费用、P50/P95 完成时间、工具调用数、重试数和人工接管率。摊销费用应把失败尝试也算进去；“token 更少”可能伴随更贵的模型或更多等待，不能单独代表更便宜。","html":"<p><strong>先看例子：<\/strong>旧方案 100 题成功 70 题，新方案成功 72 题；如果重新运行各自会波动三四题，这次增加的两题可能只是随机变化。<\/p>\n<p><strong>直答：<\/strong>同时看任务覆盖、重复运行、不确定范围和成本。比较应使用同一测试集与资源预算，并保留逐题结果，不能只截一张最高分截图。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p>教学实验可以从 50 个独立业务场景开始，每题各跑 3 次。对每个场景计算新旧差值，再以“场景”为单位重采样，估计差值区间。一个场景的三次尝试相关，不能随意当成三个全新的业务场景。区间跨过零时，报告方向不确定，并扩大样本或针对失败类型继续排查。<\/p>\n<p><strong>追问：pass@k 和 pass^k 差在哪？<\/strong>前者问 k 次里至少成功一次；后者问 k 次是否都成功。前者描述尝试机会，后者强调重复可靠性。它们的具体估计要按基准实现；不要把全库平均成功率直接乘 k 次，冒充逐题可靠性。基础定义见 <a class=\"ref\" href=\"#source-S31\">S31<\/a>，实践解释见 <a class=\"ref\" href=\"#source-S125\">S125<\/a>。<\/p>\n<p><strong>追问：多试几次成功了，不就能上线吗？<\/strong>还需要知道系统能否识别哪次正确，以及重试会不会产生重复操作。验收器只在测试时知道真值，部署未必拥有同样判断能力。<\/p>\n<p>同时记总费用、每个成功任务的摊销费用、P50/P95 完成时间、工具调用数、重试数和人工接管率。摊销费用应把失败尝试也算进去；“token 更少”可能伴随更贵的模型或更多等待，不能单独代表更便宜。<\/p><\/div><\/details>"}</script>
<script id="data-q-AG33" type="application/json">{"body":"**先看例子：**退款工具把金额单位从“元”改成“分”，字段仍叫 amount；模型仍填 80，系统却只退了 0.8 元。模型参数没变，任务行为已经改变。\n\n**直答：**Agent 能力取决于模型与整套运行条件。工具协议、提示、检索索引、上下文压缩、环境镜像、权限、资源及验收版本变化，都可能让结果漂移。\n\n### 进一步：公式、边界与追问\n\n一次实验至少记录：模型具体版本、harness 版本、工具 schema 与语义、提示模板、环境镜像、任务快照、超时/输出预算、用户模拟器和验收器版本。API 字段没变不代表业务含义没变；金额、时区、分页默认值都是应做契约检查的地方。\n\n这不是只针对生产系统。Terminal-Bench 4.0 更改了资源和任务集合，官方要求重跑；τ 仓库 2026 年 7 月的 grading 更新影响 banking_knowledge 的可比性，明确区分更新前后的结果。（S124、S126）\n\n**追问：旧 trace 重新打分够吗？**若只改验收标准，且旧记录保留所需信息，可重新评分；工具行为、资源、任务初态或观察改变时，通常要重新执行。旧轨迹不能反映新环境中的决策。\n\n**可做的对照：**准备两个工具版本与一组冻结任务，旧 Agent 分别运行；再加兼容适配运行第三组。把“模型改变”和“接口适配改变”拆开。旧记录可以检查新适配器能否解析，不能证明新服务的业务行为一样；后者要用受控请求验证。上线前对高影响字段做确定性检查，对完整任务做小流量验证，并保存能够回退的版本组合。","html":"<p><strong>先看例子：<\/strong>退款工具把金额单位从“元”改成“分”，字段仍叫 amount；模型仍填 80，系统却只退了 0.8 元。模型参数没变，任务行为已经改变。<\/p>\n<p><strong>直答：<\/strong>Agent 能力取决于模型与整套运行条件。工具协议、提示、检索索引、上下文压缩、环境镜像、权限、资源及验收版本变化，都可能让结果漂移。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p>一次实验至少记录：模型具体版本、harness 版本、工具 schema 与语义、提示模板、环境镜像、任务快照、超时/输出预算、用户模拟器和验收器版本。API 字段没变不代表业务含义没变；金额、时区、分页默认值都是应做契约检查的地方。<\/p>\n<p>这不是只针对生产系统。Terminal-Bench 4.0 更改了资源和任务集合，官方要求重跑；τ 仓库 2026 年 7 月的 grading 更新影响 banking_knowledge 的可比性，明确区分更新前后的结果。（<a class=\"ref\" href=\"#source-S124\">S124<\/a>、<a class=\"ref\" href=\"#source-S126\">S126<\/a>）<\/p>\n<p><strong>追问：旧 trace 重新打分够吗？<\/strong>若只改验收标准，且旧记录保留所需信息，可重新评分；工具行为、资源、任务初态或观察改变时，通常要重新执行。旧轨迹不能反映新环境中的决策。<\/p>\n<p><strong>可做的对照：<\/strong>准备两个工具版本与一组冻结任务，旧 Agent 分别运行；再加兼容适配运行第三组。把“模型改变”和“接口适配改变”拆开。旧记录可以检查新适配器能否解析，不能证明新服务的业务行为一样；后者要用受控请求验证。上线前对高影响字段做确定性检查，对完整任务做小流量验证，并保存能够回退的版本组合。<\/p><\/div><\/details>"}</script>
<script id="data-q-AG34" type="application/json">{"body":"**先看例子：**简历只写“基于某框架搭建多 Agent 系统”，面试官无法判断你解决了什么。若能演示同一个提交超时案例如何恢复，并展示重复提交率前后变化，就更容易证明能力。\n\n**直答：**选一个能闭环验收的业务，把基线、改进、逐题评测、失败分析和成本整理成可重复演示的项目。先把一个流程做扎实，再按证据决定是否训练或增加多个 Agent。\n\n### 进一步：公式、边界与追问\n\n以教学用“报销审核与提交”为例，可这样推进：\n\n| 阶段 | 做出的东西 | 与什么比较 |\n|---|---|---|\n| MVP | 查询、规则检查、模拟提交、终态验收 | 规则流程或原始模型 |\n| 稳定性 | 超时恢复、业务请求号、错误解释 | 同模型、同工具的原流程 |\n| 数据闭环 | 失败分类、正确恢复轨迹、SFT 样本 | 改前模型与提示方案 |\n| 能力迁移 | 学生 OPD/SDPO 小规模实验 | 同学生 SFT、同教师预算 |\n| 上线准备 | 冻结版本、运行监测、回退与接管 | 离线结果与真实任务分布 |\n\n**追问：没有 GPU 怎么办？**先完成模拟工具、验收器、trace 分析与模型调用对照。可以产出训练数据和检查 mask，但要明确哪些已经执行、哪些只是训练方案。没有实际更新权重，就不写“已完成 RL/蒸馏”。\n\n**追问：多少题才够？**先覆盖正常、缺信息、冲突、超时、状态变化等真实类别，固定开发集和保留测试集。小规模用于找大问题；报告精细提升前再扩大样本。该流程是教学项目建议，评测与运行监测的依据见 S125；统计方法见 AG32。","html":"<p><strong>先看例子：<\/strong>简历只写“基于某框架搭建多 Agent 系统”，面试官无法判断你解决了什么。若能演示同一个提交超时案例如何恢复，并展示重复提交率前后变化，就更容易证明能力。<\/p>\n<p><strong>直答：<\/strong>选一个能闭环验收的业务，把基线、改进、逐题评测、失败分析和成本整理成可重复演示的项目。先把一个流程做扎实，再按证据决定是否训练或增加多个 Agent。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p>以教学用“报销审核与提交”为例，可这样推进：<\/p>\n<table>\n<thead>\n<tr>\n<th>阶段<\/th>\n<th>做出的东西<\/th>\n<th>与什么比较<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>MVP<\/td>\n<td>查询、规则检查、模拟提交、终态验收<\/td>\n<td>规则流程或原始模型<\/td>\n<\/tr>\n<tr>\n<td>稳定性<\/td>\n<td>超时恢复、业务请求号、错误解释<\/td>\n<td>同模型、同工具的原流程<\/td>\n<\/tr>\n<tr>\n<td>数据闭环<\/td>\n<td>失败分类、正确恢复轨迹、SFT 样本<\/td>\n<td>改前模型与提示方案<\/td>\n<\/tr>\n<tr>\n<td>能力迁移<\/td>\n<td>学生 OPD/SDPO 小规模实验<\/td>\n<td>同学生 SFT、同教师预算<\/td>\n<\/tr>\n<tr>\n<td>上线准备<\/td>\n<td>冻结版本、运行监测、回退与接管<\/td>\n<td>离线结果与真实任务分布<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>追问：没有 GPU 怎么办？<\/strong>先完成模拟工具、验收器、trace 分析与模型调用对照。可以产出训练数据和检查 mask，但要明确哪些已经执行、哪些只是训练方案。没有实际更新权重，就不写“已完成 RL/蒸馏”。<\/p>\n<p><strong>追问：多少题才够？<\/strong>先覆盖正常、缺信息、冲突、超时、状态变化等真实类别，固定开发集和保留测试集。小规模用于找大问题；报告精细提升前再扩大样本。该流程是教学项目建议，评测与运行监测的依据见 <a class=\"ref\" href=\"#source-S125\">S125<\/a>；统计方法见 <a class=\"ref\" href=\"#q-AG32\">AG32<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-AG35" type="application/json">{"body":"**先看例子：**被问“你怎么做 Agent”，先解释半分钟框架名字，面试官仍不知道它能完成什么任务。可以先说目标，再说行动流程和验收证据。\n\n**直答：**按“任务 → 决策与工具 → 状态和恢复 → 评测 → 改进”回答。每层给一个具体例子；数据与结果必须来自自己的实验。\n\n### 进一步：公式、边界与追问\n\n下面是教学回答骨架，不能当成已经做过的项目经历：\n\n> 我的任务是让助手完成报销查询与提交。我先定义成功终态：正确单据只产生一次正确金额的申请。模型负责理解要求和选择下一步，工具负责查询与执行。流程记录请求号和已执行状态，遇到超时先确认提交结果。评测同时检查终态、恢复能力、成本和人工接管。我会先比较规则基线与单 Agent；只有失败分析显示模型能力不足时，再比较 SFT 或蒸馏，并保留未参与开发的测试场景。\n\n**追问：为什么不直接用最强模型？**可以把它作为较强的参照基线，再比较成本、延迟和数据条件。如果较便宜模型加好工具已满足目标，没有必要为了展示算法强行训练。\n\n**追问：最难的点是什么？**挑一条真实失败轨迹，解释原始判断、错误发生处、修改及对照结果。例如“超时被当失败，重试导致重复提交”；说明你怎样查终态并验证修复。避免把所有失败归因于模型幻觉。\n\n**追问：你的提升来自哪里？**展示只改变一个主要因素的对照、逐题得失和总预算；把模型能力、工具设计与运行资源的影响分清。验收思路参考 S125，训练与运行条件的一致性见 S120。","html":"<p><strong>先看例子：<\/strong>被问“你怎么做 Agent”，先解释半分钟框架名字，面试官仍不知道它能完成什么任务。可以先说目标，再说行动流程和验收证据。<\/p>\n<p><strong>直答：<\/strong>按“任务 → 决策与工具 → 状态和恢复 → 评测 → 改进”回答。每层给一个具体例子；数据与结果必须来自自己的实验。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p>下面是教学回答骨架，不能当成已经做过的项目经历：<\/p>\n<blockquote>\n<p>我的任务是让助手完成报销查询与提交。我先定义成功终态：正确单据只产生一次正确金额的申请。模型负责理解要求和选择下一步，工具负责查询与执行。流程记录请求号和已执行状态，遇到超时先确认提交结果。评测同时检查终态、恢复能力、成本和人工接管。我会先比较规则基线与单 Agent；只有失败分析显示模型能力不足时，再比较 SFT 或蒸馏，并保留未参与开发的测试场景。<\/p>\n<\/blockquote>\n<p><strong>追问：为什么不直接用最强模型？<\/strong>可以把它作为较强的参照基线，再比较成本、延迟和数据条件。如果较便宜模型加好工具已满足目标，没有必要为了展示算法强行训练。<\/p>\n<p><strong>追问：最难的点是什么？<\/strong>挑一条真实失败轨迹，解释原始判断、错误发生处、修改及对照结果。例如“超时被当失败，重试导致重复提交”；说明你怎样查终态并验证修复。避免把所有失败归因于模型幻觉。<\/p>\n<p><strong>追问：你的提升来自哪里？<\/strong>展示只改变一个主要因素的对照、逐题得失和总预算；把模型能力、工具设计与运行资源的影响分清。验收思路参考 <a class=\"ref\" href=\"#source-S125\">S125<\/a>，训练与运行条件的一致性见 <a class=\"ref\" href=\"#source-S120\">S120<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-AG36" type="application/json">{"body":"**先看例子：**本周看完一个新缩写，下周又出现两个。若先问它解决“训练、行动、反馈还是评测”的哪一个问题，就不容易被名字带着跑。\n\n**直答：**按四条主线读：模型在真实运行流程中怎样训练；工具交互经验怎样变成监督；环境与任务怎样规模化；能力怎样被可靠评测。每读一篇，落实一个能运行的对照。\n\n### 进一步：公式、边界与追问\n\n| 阅读入口 | 具体看点 | 可落实的练习 |\n|---|---|---|\n| Agent Lightning v1.0，2026-08 | 部署 harness 参与 RL；分段与训练权重 | 同一任务拆成不同段数，检查统计是否被改变 |\n| SOD、SEED、SDPO，2026 | 学生路径、技能复盘、详细反馈 | 选择一种反馈来源，与同预算 SFT 比较 |\n| SWE-smith，2025 | 先环境、再合成可验收任务 | 造一个失败用例并用已知解恢复 |\n| τ³、Terminal-Bench 4.0，2026 | 新场景与基准持续维护 | 固定版本，记录升级前后哪些条件改变 |\n| SWE-Bench Pro Verified，2026-09 | 隔离答案与修订任务/测试 | 为自建任务检查“能否偷看答案”“合理解会不会被误判” |\n\n**追问：这些就是当前最强算法吗？**它们包含算法、训练框架、数据管线和基准，不是在争同一种冠军。8 月的框架论文与 9 月的评测预印本提供新证据，但单篇特定环境结果不能推出所有 Agent 都受益。\n\n**阅读检查表：**论文给模型哪些额外信息？教师和环境花了多少成本？运行工具与测试是否同版本？有没有按任务/仓库隔离测试？消融只改变了什么？代码能否重跑？本资料核查截至 2026-09-15，未替代论文复现。依据 S89、S90、S94、S120、S122、S124、S126、S127。","html":"<p><strong>先看例子：<\/strong>本周看完一个新缩写，下周又出现两个。若先问它解决“训练、行动、反馈还是评测”的哪一个问题，就不容易被名字带着跑。<\/p>\n<p><strong>直答：<\/strong>按四条主线读：模型在真实运行流程中怎样训练；工具交互经验怎样变成监督；环境与任务怎样规模化；能力怎样被可靠评测。每读一篇，落实一个能运行的对照。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><table>\n<thead>\n<tr>\n<th>阅读入口<\/th>\n<th>具体看点<\/th>\n<th>可落实的练习<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Agent Lightning v1.0，2026-08<\/td>\n<td>部署 harness 参与 RL；分段与训练权重<\/td>\n<td>同一任务拆成不同段数，检查统计是否被改变<\/td>\n<\/tr>\n<tr>\n<td>SOD、SEED、SDPO，2026<\/td>\n<td>学生路径、技能复盘、详细反馈<\/td>\n<td>选择一种反馈来源，与同预算 SFT 比较<\/td>\n<\/tr>\n<tr>\n<td>SWE-smith，2025<\/td>\n<td>先环境、再合成可验收任务<\/td>\n<td>造一个失败用例并用已知解恢复<\/td>\n<\/tr>\n<tr>\n<td>τ³、Terminal-Bench 4.0，2026<\/td>\n<td>新场景与基准持续维护<\/td>\n<td>固定版本，记录升级前后哪些条件改变<\/td>\n<\/tr>\n<tr>\n<td>SWE-Bench Pro Verified，2026-09<\/td>\n<td>隔离答案与修订任务/测试<\/td>\n<td>为自建任务检查“能否偷看答案”“合理解会不会被误判”<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>追问：这些就是当前最强算法吗？<\/strong>它们包含算法、训练框架、数据管线和基准，不是在争同一种冠军。8 月的框架论文与 9 月的评测预印本提供新证据，但单篇特定环境结果不能推出所有 Agent 都受益。<\/p>\n<p><strong>阅读检查表：<\/strong>论文给模型哪些额外信息？教师和环境花了多少成本？运行工具与测试是否同版本？有没有按任务/仓库隔离测试？消融只改变了什么？代码能否重跑？本资料核查截至 2026-09-15，未替代论文复现。依据 <a class=\"ref\" href=\"#source-S89\">S89<\/a>、<a class=\"ref\" href=\"#source-S90\">S90<\/a>、<a class=\"ref\" href=\"#source-S94\">S94<\/a>、<a class=\"ref\" href=\"#source-S120\">S120<\/a>、<a class=\"ref\" href=\"#source-S122\">S122<\/a>、<a class=\"ref\" href=\"#source-S124\">S124<\/a>、<a class=\"ref\" href=\"#source-S126\">S126<\/a>、<a class=\"ref\" href=\"#source-S127\">S127<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-TH01" type="application/json">{"body":"你面前是一张白纸，面试官说“写一个 Transformer”。先别背两百行代码：先确认要单头注意力、多头注意力、一层 Block，还是完整编码器—解码器。\n\n本章用同一套小积木逐步拼装：**形状 → 注意力 → mask → 多头 → 归一化与 FFN → Block → 模型 → loss → 生成与缓存**。主线是便于练习的 Pre-LN 小语言模型；同时给出翻译式 Encoder–Decoder。最后再看 RoPE、GQA 等变体。\n\n默认例子是 2 句话、每句 3 个 token、每个 token 8 个数。先读 TH01—TH06，能够解释每行的输入输出，再向后走。\n\n**直答：**先约定输入输出与 mask 语义，再逐块实现并验证；代码写完还要证明形状、数值、梯度与因果性正确。\n\n### 跟着写\n\n```python\nimport torch\nfrom torch import nn\nfrom torch.nn import functional as F\n\ntorch.manual_seed(9)\nx = torch.randn(2, 3, 8)\nprint(x.shape)  # torch.Size([2, 3, 8])\n```\n\n### 进一步：公式、边界与追问\n\n**练习：**用一句话解释三个数字，不能只说“B、T、D”。\n\n**答案：**2 个独立样本；每个样本有 3 个位置；每个位置用 8 维向量表示。批次维不会让两句话互相读到内容。\n\n**追问：能只复制每题代码运行吗？**短例子可在完整模块旁导入相关函数；较长类依赖前面的函数。配套 `transformer_handwrite.py` 已按本章顺序合并，`Transformer手写运行与练习.md` 给出从安装到运行的方法。网页中的动画执行小型数值计算，不执行 Python，也不下载模型。\n\n参考 Happy-LLM 的基础到实现顺序、LLMs-from-scratch 的分模块练习，以及面试指南的连续追问组织；本章例子与实现重新编写。\n\n依据：S01、S132、S134、S135。","html":"<p>你面前是一张白纸，面试官说“写一个 Transformer”。先别背两百行代码：先确认要单头注意力、多头注意力、一层 Block，还是完整编码器—解码器。<\/p>\n<p>本章用同一套小积木逐步拼装：<strong>形状 → 注意力 → mask → 多头 → 归一化与 FFN → Block → 模型 → loss → 生成与缓存<\/strong>。主线是便于练习的 Pre-LN 小语言模型；同时给出翻译式 Encoder–Decoder。最后再看 RoPE、GQA 等变体。<\/p>\n<p>默认例子是 2 句话、每句 3 个 token、每个 token 8 个数。先读 <a class=\"ref\" href=\"#q-TH01\">TH01<\/a>—<a class=\"ref\" href=\"#q-TH06\">TH06<\/a>，能够解释每行的输入输出，再向后走。<\/p>\n<p><strong>直答：<\/strong>先约定输入输出与 mask 语义，再逐块实现并验证；代码写完还要证明形状、数值、梯度与因果性正确。<\/p>\n<h3>跟着写<\/h3>\n<pre><code class=\"language-python\">import torch\nfrom torch import nn\nfrom torch.nn import functional as F\n\ntorch.manual_seed(9)\nx = torch.randn(2, 3, 8)\nprint(x.shape)  # torch.Size([2, 3, 8])\n<\/code><\/pre><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>练习：<\/strong>用一句话解释三个数字，不能只说“B、T、D”。<\/p>\n<p><strong>答案：<\/strong>2 个独立样本；每个样本有 3 个位置；每个位置用 8 维向量表示。批次维不会让两句话互相读到内容。<\/p>\n<p><strong>追问：能只复制每题代码运行吗？<\/strong>短例子可在完整模块旁导入相关函数；较长类依赖前面的函数。配套 <code>transformer_handwrite.py<\/code> 已按本章顺序合并，<code>Transformer手写运行与练习.md<\/code> 给出从安装到运行的方法。网页中的动画执行小型数值计算，不执行 Python，也不下载模型。<\/p>\n<p>参考 Happy-LLM 的基础到实现顺序、LLMs-from-scratch 的分模块练习，以及面试指南的连续追问组织；本章例子与实现重新编写。<\/p>\n<p>依据：<a class=\"ref\" href=\"#source-S01\">S01<\/a>、<a class=\"ref\" href=\"#source-S132\">S132<\/a>、<a class=\"ref\" href=\"#source-S134\">S134<\/a>、<a class=\"ref\" href=\"#source-S135\">S135<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-TH02" type="application/json">{"body":"把一个 token 的 8 个数分给 2 个头，每个头拿 4 个数。词的位置没有改变，改变的是“按哪个头组织这些数”。不能把 reshape 当成任意换轴。\n\n请先画四个标签：句子、头、词的位置、每头通道。可视化的“拆头与合头”会显示每个数字搬到了哪里。\n\n**直答：**本章从 [B,T,D] 出发，先拆成 [B,T,H,Dh]，再换轴到 [B,H,T,Dh]；D=H×Dh 是这套实现的约束。\n\n### 跟着写\n\n```python\ndef split_heads(x, heads):\n    batch, tokens, channels = x.shape\n    if channels % heads:\n        raise ValueError(\"channels 必须能被 heads 整除\")\n    # reshape 只拆最后一维；transpose 才把头移到前面。\n    return x.reshape(batch, tokens, heads, channels // heads).transpose(1, 2)\n\n\ndef merge_heads(x):\n    batch, heads, tokens, width = x.shape\n    return x.transpose(1, 2).contiguous().view(batch, tokens, heads * width)\n```\n\n### 进一步：公式、边界与追问\n\n**练习：**对 `torch.arange(24).reshape(1,3,8)` 拆成 2 个头，预测第 2 个头、第 2 个词会拿到哪些数。\n\n**答案：**原词向量是 8 到 15，第二头拿 12、13、14、15；合头后必须逐元素回到原张量。\n\n**追问：为什么 transpose 后常接 contiguous？**换轴可以只改访问步长，底层数字尚未重排；`view` 要求相容的内存布局。这里先连续化再合并。`reshape` 可能在需要时复制，不能假定所有换形状都免费。\n\n**边界：**有些架构的总注意力通道数不等于残差宽度。本章先采用最常见的等宽手写版本；不要把 D=H×Dh 推成所有模型的硬规则。\n\n依据：S01、S129。","html":"<p>把一个 token 的 8 个数分给 2 个头，每个头拿 4 个数。词的位置没有改变，改变的是“按哪个头组织这些数”。不能把 reshape 当成任意换轴。<\/p>\n<p>请先画四个标签：句子、头、词的位置、每头通道。可视化的“拆头与合头”会显示每个数字搬到了哪里。<\/p>\n<p><strong>直答：<\/strong>本章从 [B,T,D] 出发，先拆成 [B,T,H,Dh]，再换轴到 [B,H,T,Dh]；D=H×Dh 是这套实现的约束。<\/p>\n<h3>跟着写<\/h3>\n<pre><code class=\"language-python\">def split_heads(x, heads):\n    batch, tokens, channels = x.shape\n    if channels % heads:\n        raise ValueError(&quot;channels 必须能被 heads 整除&quot;)\n    # reshape 只拆最后一维；transpose 才把头移到前面。\n    return x.reshape(batch, tokens, heads, channels // heads).transpose(1, 2)\n\n\ndef merge_heads(x):\n    batch, heads, tokens, width = x.shape\n    return x.transpose(1, 2).contiguous().view(batch, tokens, heads * width)\n<\/code><\/pre><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>练习：<\/strong>对 <code>torch.arange(24).reshape(1,3,8)<\/code> 拆成 2 个头，预测第 2 个头、第 2 个词会拿到哪些数。<\/p>\n<p><strong>答案：<\/strong>原词向量是 8 到 15，第二头拿 12、13、14、15；合头后必须逐元素回到原张量。<\/p>\n<p><strong>追问：为什么 transpose 后常接 contiguous？<\/strong>换轴可以只改访问步长，底层数字尚未重排；<code>view<\/code> 要求相容的内存布局。这里先连续化再合并。<code>reshape<\/code> 可能在需要时复制，不能假定所有换形状都免费。<\/p>\n<p><strong>边界：<\/strong>有些架构的总注意力通道数不等于残差宽度。本章先采用最常见的等宽手写版本；不要把 D=H×Dh 推成所有模型的硬规则。<\/p>\n<p>依据：<a class=\"ref\" href=\"#source-S01\">S01<\/a>、<a class=\"ref\" href=\"#source-S129\">S129<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-TH03" type="application/json">{"body":"“猫”的编号是 2，不代表猫比编号 1 的“狗”大。Embedding 是按编号取一行可训练向量；线性层再把这行向量变成用于匹配或传递信息的数。\n\n像同一个人分别写“我想找什么”（Q）、“我提供什么线索”（K）、“可以取走什么内容”（V）；这些只是帮助理解作用，真正的向量由训练学得。\n\n**直答：**Embedding 是查表；Q/K/V 是三套独立投影。本章 nn.Linear 的权重存成 [输出维,输入维]，实际运算是 x @ weight.T + bias。\n\n### 跟着写\n\n```python\nembedding = nn.Embedding(10, 8)\nids = torch.tensor([[2, 5, 2]])\nx = embedding(ids)               # [1,3,8]\nq_proj = nn.Linear(8, 8)\nq = q_proj(x)                    # [1,3,8]\nmanual = x @ q_proj.weight.T + q_proj.bias\ntorch.testing.assert_close(q, manual)\ntorch.testing.assert_close(x[:, 0], x[:, 2])\n```\n\n### 逐行拆解\n\n1. `ids` 是整数编号，不能拿编号大小当语义距离。\n2. `embedding(ids)` 一次取出每个位置的一行，所以多出通道维 8。\n3. `nn.Linear(8,8)` 创建可训练权重和偏置；调用它才执行乘法。\n4. 最后两条断言分别检查线性运算和同编号查表是否一致。\n\n### 进一步：公式、边界与追问\n\n**练习：**词表 10、宽度 8，Embedding 有几个参数？有 bias 的 8→8 线性层呢？\n\n**答案：**分别是 80 和 64+8=72。Embedding 通常不需要在运行时真的构造巨大 one-hot。\n\n**追问：同一个 token 每次向量都相同吗？**这里的原始查表结果相同；加入位置并经过注意力后，其上下文表示通常不同。不要把“查表向量”与“深层隐藏状态”混为一谈。\n\n依据：S01。","html":"<p>“猫”的编号是 2，不代表猫比编号 1 的“狗”大。Embedding 是按编号取一行可训练向量；线性层再把这行向量变成用于匹配或传递信息的数。<\/p>\n<p>像同一个人分别写“我想找什么”（Q）、“我提供什么线索”（K）、“可以取走什么内容”（V）；这些只是帮助理解作用，真正的向量由训练学得。<\/p>\n<p><strong>直答：<\/strong>Embedding 是查表；Q/K/V 是三套独立投影。本章 nn.Linear 的权重存成 [输出维,输入维]，实际运算是 x @ weight.T + bias。<\/p>\n<h3>跟着写<\/h3>\n<pre><code class=\"language-python\">embedding = nn.Embedding(10, 8)\nids = torch.tensor([[2, 5, 2]])\nx = embedding(ids)               # [1,3,8]\nq_proj = nn.Linear(8, 8)\nq = q_proj(x)                    # [1,3,8]\nmanual = x @ q_proj.weight.T + q_proj.bias\ntorch.testing.assert_close(q, manual)\ntorch.testing.assert_close(x[:, 0], x[:, 2])\n<\/code><\/pre>\n<h3>逐行拆解<\/h3>\n<ol>\n<li><code>ids<\/code> 是整数编号，不能拿编号大小当语义距离。<\/li>\n<li><code>embedding(ids)<\/code> 一次取出每个位置的一行，所以多出通道维 8。<\/li>\n<li><code>nn.Linear(8,8)<\/code> 创建可训练权重和偏置；调用它才执行乘法。<\/li>\n<li>最后两条断言分别检查线性运算和同编号查表是否一致。<\/li>\n<\/ol><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>练习：<\/strong>词表 10、宽度 8，Embedding 有几个参数？有 bias 的 8→8 线性层呢？<\/p>\n<p><strong>答案：<\/strong>分别是 80 和 64+8=72。Embedding 通常不需要在运行时真的构造巨大 one-hot。<\/p>\n<p><strong>追问：同一个 token 每次向量都相同吗？<\/strong>这里的原始查表结果相同；加入位置并经过注意力后，其上下文表示通常不同。不要把“查表向量”与“深层隐藏状态”混为一谈。<\/p>\n<p>依据：<a class=\"ref\" href=\"#source-S01\">S01<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-TH04" type="application/json">{"body":"只有两个可选位置，V 分别是 [2,0] 与 [0,4]。如果注意力权重是 0.67 和 0.33，输出约为 [1.34,1.32]：从两份内容按比例取信息。\n\n先写 Q 与 K 的匹配分数，再把一整行变成分配比例，最后加权 V。softmax 放错轴，代码也可能运行，却变成另一个算法。\n\n**直答：**核心是 QK 转置打分、除以头维度平方根、遮住禁看位置、沿 key 轴 softmax、再乘 V。\n\n### 跟着写\n\n```python\ndef attention(q, k, v, allowed=None, dropout_p=0.0, training=False):\n    # q: [B,H,Tq,Dh]；k/v: [B,H,Tk,Dh]（v 的末维也可不同）\n    scores = q @ k.transpose(-2, -1) / math.sqrt(q.size(-1))\n    if allowed is not None:\n        if allowed.dtype != torch.bool:\n            raise TypeError(\"本教程只接受 bool mask；True = 可以看\")\n        allowed = torch.broadcast_to(allowed, scores.shape)\n        if not allowed.any(dim=-1).all():\n            raise ValueError(\"存在完全看不到任何 key 的行；请检查 padding/mask\")\n        scores = scores.masked_fill(~allowed, float(\"-inf\"))\n    weights = torch.softmax(scores, dim=-1)  # 沿 key 轴分配权重\n    used = F.dropout(weights, p=dropout_p, training=training)\n    return used @ v, weights  # 返回 dropout 前权重，便于教学验算行和\n```\n\n### 逐行拆解\n\n1. `q @ k.transpose(-2,-1)`：把最后两维转置，才得到每个 query 与每个 key 的两两打分。\n2. 除以头维度平方根，让维度增加时打分尺度更可控。\n3. 用负无穷替换禁看位置，使其 softmax 权重变为 0。\n4. `dim=-1` 沿 key 轴分配比例；`weights @ v` 才把比例变成取出的内容。\n\n### 进一步：公式、边界与追问\n\n**练习：**令 Q=[1,0]，K=[[1,0],[0,1]]。预测输出大概更靠近哪份 V，再运行 `test_attention_weighted_sum`。\n\n**答案：**第一份。缩放后分数约 [0.707,0]，权重约 [0.670,0.330]，输出约 [1.340,1.321]。\n\n**追问：返回的 weights 加起来一定是 1 吗？**这里返回 dropout 前权重；每个可用行的和约为 1。训练中实际乘 V 的权重经过 dropout，单次采样后的行和未必等于 1。\n\n**边界：**教学实现显式生成打分矩阵，空间随序列长度平方增长。生产内核可以采用更节省中间存储的实现。\n\n依据：S01、S128。","html":"<p>只有两个可选位置，V 分别是 [2,0] 与 [0,4]。如果注意力权重是 0.67 和 0.33，输出约为 [1.34,1.32]：从两份内容按比例取信息。<\/p>\n<p>先写 Q 与 K 的匹配分数，再把一整行变成分配比例，最后加权 V。softmax 放错轴，代码也可能运行，却变成另一个算法。<\/p>\n<p><strong>直答：<\/strong>核心是 QK 转置打分、除以头维度平方根、遮住禁看位置、沿 key 轴 softmax、再乘 V。<\/p>\n<h3>跟着写<\/h3>\n<pre><code class=\"language-python\">def attention(q, k, v, allowed=None, dropout_p=0.0, training=False):\n    # q: [B,H,Tq,Dh]；k/v: [B,H,Tk,Dh]（v 的末维也可不同）\n    scores = q @ k.transpose(-2, -1) / math.sqrt(q.size(-1))\n    if allowed is not None:\n        if allowed.dtype != torch.bool:\n            raise TypeError(&quot;本教程只接受 bool mask；True = 可以看&quot;)\n        allowed = torch.broadcast_to(allowed, scores.shape)\n        if not allowed.any(dim=-1).all():\n            raise ValueError(&quot;存在完全看不到任何 key 的行；请检查 padding/mask&quot;)\n        scores = scores.masked_fill(~allowed, float(&quot;-inf&quot;))\n    weights = torch.softmax(scores, dim=-1)  # 沿 key 轴分配权重\n    used = F.dropout(weights, p=dropout_p, training=training)\n    return used @ v, weights  # 返回 dropout 前权重，便于教学验算行和\n<\/code><\/pre>\n<h3>逐行拆解<\/h3>\n<ol>\n<li><code>q @ k.transpose(-2,-1)<\/code>：把最后两维转置，才得到每个 query 与每个 key 的两两打分。<\/li>\n<li>除以头维度平方根，让维度增加时打分尺度更可控。<\/li>\n<li>用负无穷替换禁看位置，使其 softmax 权重变为 0。<\/li>\n<li><code>dim=-1<\/code> 沿 key 轴分配比例；<code>weights @ v<\/code> 才把比例变成取出的内容。<\/li>\n<\/ol><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>练习：<\/strong>令 Q=[1,0]，K=[[1,0],[0,1]]。预测输出大概更靠近哪份 V，再运行 <code>test_attention_weighted_sum<\/code>。<\/p>\n<p><strong>答案：<\/strong>第一份。缩放后分数约 [0.707,0]，权重约 [0.670,0.330]，输出约 [1.340,1.321]。<\/p>\n<p><strong>追问：返回的 weights 加起来一定是 1 吗？<\/strong>这里返回 dropout 前权重；每个可用行的和约为 1。训练中实际乘 V 的权重经过 dropout，单次采样后的行和未必等于 1。<\/p>\n<p><strong>边界：<\/strong>教学实现显式生成打分矩阵，空间随序列长度平方增长。生产内核可以采用更节省中间存储的实现。<\/p>\n<p>依据：<a class=\"ref\" href=\"#source-S01\">S01<\/a>、<a class=\"ref\" href=\"#source-S128\">S128<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-TH05" type="application/json">{"body":"让模型根据“我 爱”预测下一个词时，不能让它在输入中先看到答案。因果 mask 遮住未来；padding mask 遮住补齐用的空位置，两者解决不同问题。\n\n**直答：**先统一 True 的含义，再按“既非 padding，又不在未来”组合允许矩阵。本章约定 True = 可以看。\n\n### 跟着写\n\n```python\ndef causal_allowed(query_len, key_len, past_len=0, device=None):\n    # 缓存后 query 的绝对位置从 past_len 开始。\n    query_pos = past_len + torch.arange(query_len, device=device)\n    key_pos = torch.arange(key_len, device=device)\n    return key_pos[None, :] <= query_pos[:, None]\n\n\ndef padding_allowed(valid_keys):\n    # valid_keys: [B,Tk]；扩展后能广播到 [B,H,Tq,Tk]。\n    return valid_keys[:, None, None, :]\n```\n\n### 进一步：公式、边界与追问\n\n**练习：**画出长度 3 的因果矩阵。第一行能看谁？缓存已有 3 个词、当前新来 2 个词时又如何？\n\n**答案：**普通矩阵三行是 100、110、111。缓存后的两行是 11110、11111；query 绝对位置从 3 开始，不能直接取一个左上角的 2×5 下三角。\n\n**追问：给 nn.MultiheadAttention 可以原样传这个 bool mask 吗？**不可以，其屏蔽型 bool mask 用 True 表示禁止。我们的 allowed 与 PyTorch SDPA 的 bool 约定相同。换接口要重新核对；不能根据变量名猜。\n\n**边界：**本实现遇到整行不可见直接报错，避免 softmax 全为负无穷后出现 NaN。先练习右 padding、有效开头的样本。padding query 的输出未被自动清零，训练时仍需忽略对应标签；key mask 与 loss mask 不能互相替代。\n\n依据：S128、S129。","html":"<p>让模型根据“我 爱”预测下一个词时，不能让它在输入中先看到答案。因果 mask 遮住未来；padding mask 遮住补齐用的空位置，两者解决不同问题。<\/p>\n<p><strong>直答：<\/strong>先统一 True 的含义，再按“既非 padding，又不在未来”组合允许矩阵。本章约定 True = 可以看。<\/p>\n<h3>跟着写<\/h3>\n<pre><code class=\"language-python\">def causal_allowed(query_len, key_len, past_len=0, device=None):\n    # 缓存后 query 的绝对位置从 past_len 开始。\n    query_pos = past_len + torch.arange(query_len, device=device)\n    key_pos = torch.arange(key_len, device=device)\n    return key_pos[None, :] &lt;= query_pos[:, None]\n\n\ndef padding_allowed(valid_keys):\n    # valid_keys: [B,Tk]；扩展后能广播到 [B,H,Tq,Tk]。\n    return valid_keys[:, None, None, :]\n<\/code><\/pre><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>练习：<\/strong>画出长度 3 的因果矩阵。第一行能看谁？缓存已有 3 个词、当前新来 2 个词时又如何？<\/p>\n<p><strong>答案：<\/strong>普通矩阵三行是 100、110、111。缓存后的两行是 11110、11111；query 绝对位置从 3 开始，不能直接取一个左上角的 2×5 下三角。<\/p>\n<p><strong>追问：给 nn.MultiheadAttention 可以原样传这个 bool mask 吗？<\/strong>不可以，其屏蔽型 bool mask 用 True 表示禁止。我们的 allowed 与 PyTorch SDPA 的 bool 约定相同。换接口要重新核对；不能根据变量名猜。<\/p>\n<p><strong>边界：<\/strong>本实现遇到整行不可见直接报错，避免 softmax 全为负无穷后出现 NaN。先练习右 padding、有效开头的样本。padding query 的输出未被自动清零，训练时仍需忽略对应标签；key mask 与 loss mask 不能互相替代。<\/p>\n<p>依据：<a class=\"ref\" href=\"#source-S128\">S128<\/a>、<a class=\"ref\" href=\"#source-S129\">S129<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-TH06" type="application/json">{"body":"两位读者各自用一套线索看同一句话，然后合并各自找出的内容。代码不是“把单头结果复制两份”，而是把投影通道分组，独立计算注意力，再拼回去。\n\n先忽略 cache 三行，把 `forward` 按“投影 → 拆头 → 注意力 → 合头 → 输出投影”默写一遍。TH17 再回到缓存。\n\n**直答：**每个头都在 token 之间做注意力；合头只拼通道，最后的 out_proj 负责混合来自不同头的信息。\n\n### 跟着写\n\n```python\nclass MultiHeadAttention(nn.Module):\n    def __init__(self, d_model, heads, dropout=0.0):\n        super().__init__()\n        if d_model % heads:\n            raise ValueError(\"d_model 必须能被 heads 整除\")\n        self.heads, self.dropout = heads, dropout\n        self.q_proj = nn.Linear(d_model, d_model)\n        self.k_proj = nn.Linear(d_model, d_model)\n        self.v_proj = nn.Linear(d_model, d_model)\n        self.out_proj = nn.Linear(d_model, d_model)\n\n    def forward(self, x, context=None, allowed=None, causal=False,\n                cache=None, use_cache=False):\n        if context is not None and (cache is not None or use_cache):\n            raise ValueError(\"这个教学缓存仅支持 self-attention\")\n        source = x if context is None else context\n        q = split_heads(self.q_proj(x), self.heads)\n        k = split_heads(self.k_proj(source), self.heads)\n        v = split_heads(self.v_proj(source), self.heads)\n        past = 0\n        if cache is not None:\n            past = cache[0].size(-2)\n            k = torch.cat([cache[0], k], dim=-2)\n            v = torch.cat([cache[1], v], dim=-2)\n        if causal:\n            causal_mask = causal_allowed(q.size(-2), k.size(-2), past, x.device)\n            allowed = causal_mask if allowed is None else allowed & causal_mask\n        y, weights = attention(q, k, v, allowed, self.dropout, self.training)\n        y = self.out_proj(merge_heads(y))\n        return y, weights, (k, v) if use_cache else None\n```\n\n### 逐行拆解\n\n1. `__init__` 创建四个有参数的层；它们会被优化器更新。\n2. `source=x` 是自注意力；给定 context 时，K/V 从另一个序列来。\n3. 三次投影后调用拆头函数；头在第二维，词的位置在第三维。\n4. 第一遍学习先假设 cache=None；因果遮罩按当前 query/key 长度创建。\n5. `attention` 负责打分、分配和取内容；`merge_heads` 合通道；`out_proj` 混合各头结果。\n6. 返回三件东西：输出、用于检查的权重、可选的新缓存。后两件不是新的可训练参数。\n\n### 进一步：公式、边界与追问\n\n**练习：**输入 [2,3,8]、2 头，分别写出 Q、scores、合头后输出的形状。\n\n**答案：**[2,2,3,4]、[2,2,3,3]、[2,3,8]。若是 cross-attention 且来源有 5 个位置，scores 变成 [2,2,3,5]。\n\n**追问：头越多越好吗？**固定宽度时每头会更窄，表达与开销的变化需要任务验证。“一个头天然负责语法”也不是由代码保证的。\n\n**核对：**测试把 Q/K/V 与输出投影权重复制到 PyTorch 参考层，再比较 self/cross 的输出及每头权重，避免只检查张量形状。\n\n依据：S01、S129。","html":"<p>两位读者各自用一套线索看同一句话，然后合并各自找出的内容。代码不是“把单头结果复制两份”，而是把投影通道分组，独立计算注意力，再拼回去。<\/p>\n<p>先忽略 cache 三行，把 <code>forward<\/code> 按“投影 → 拆头 → 注意力 → 合头 → 输出投影”默写一遍。<a class=\"ref\" href=\"#q-TH17\">TH17<\/a> 再回到缓存。<\/p>\n<p><strong>直答：<\/strong>每个头都在 token 之间做注意力；合头只拼通道，最后的 out_proj 负责混合来自不同头的信息。<\/p>\n<h3>跟着写<\/h3>\n<pre><code class=\"language-python\">class MultiHeadAttention(nn.Module):\n    def __init__(self, d_model, heads, dropout=0.0):\n        super().__init__()\n        if d_model % heads:\n            raise ValueError(&quot;d_model 必须能被 heads 整除&quot;)\n        self.heads, self.dropout = heads, dropout\n        self.q_proj = nn.Linear(d_model, d_model)\n        self.k_proj = nn.Linear(d_model, d_model)\n        self.v_proj = nn.Linear(d_model, d_model)\n        self.out_proj = nn.Linear(d_model, d_model)\n\n    def forward(self, x, context=None, allowed=None, causal=False,\n                cache=None, use_cache=False):\n        if context is not None and (cache is not None or use_cache):\n            raise ValueError(&quot;这个教学缓存仅支持 self-attention&quot;)\n        source = x if context is None else context\n        q = split_heads(self.q_proj(x), self.heads)\n        k = split_heads(self.k_proj(source), self.heads)\n        v = split_heads(self.v_proj(source), self.heads)\n        past = 0\n        if cache is not None:\n            past = cache[0].size(-2)\n            k = torch.cat([cache[0], k], dim=-2)\n            v = torch.cat([cache[1], v], dim=-2)\n        if causal:\n            causal_mask = causal_allowed(q.size(-2), k.size(-2), past, x.device)\n            allowed = causal_mask if allowed is None else allowed &amp; causal_mask\n        y, weights = attention(q, k, v, allowed, self.dropout, self.training)\n        y = self.out_proj(merge_heads(y))\n        return y, weights, (k, v) if use_cache else None\n<\/code><\/pre>\n<h3>逐行拆解<\/h3>\n<ol>\n<li><code>__init__<\/code> 创建四个有参数的层；它们会被优化器更新。<\/li>\n<li><code>source=x<\/code> 是自注意力；给定 context 时，K/V 从另一个序列来。<\/li>\n<li>三次投影后调用拆头函数；头在第二维，词的位置在第三维。<\/li>\n<li>第一遍学习先假设 cache=None；因果遮罩按当前 query/key 长度创建。<\/li>\n<li><code>attention<\/code> 负责打分、分配和取内容；<code>merge_heads<\/code> 合通道；<code>out_proj<\/code> 混合各头结果。<\/li>\n<li>返回三件东西：输出、用于检查的权重、可选的新缓存。后两件不是新的可训练参数。<\/li>\n<\/ol><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>练习：<\/strong>输入 [2,3,8]、2 头，分别写出 Q、scores、合头后输出的形状。<\/p>\n<p><strong>答案：<\/strong>[2,2,3,4]、[2,2,3,3]、[2,3,8]。若是 cross-attention 且来源有 5 个位置，scores 变成 [2,2,3,5]。<\/p>\n<p><strong>追问：头越多越好吗？<\/strong>固定宽度时每头会更窄，表达与开销的变化需要任务验证。“一个头天然负责语法”也不是由代码保证的。<\/p>\n<p><strong>核对：<\/strong>测试把 Q/K/V 与输出投影权重复制到 PyTorch 参考层，再比较 self/cross 的输出及每头权重，避免只检查张量形状。<\/p>\n<p>依据：<a class=\"ref\" href=\"#source-S01\">S01<\/a>、<a class=\"ref\" href=\"#source-S129\">S129<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-TH07" type="application/json">{"body":"每个词的一行数可能整体偏大。LayerNorm 在这一行里先减平均数，再除以标准差；它没有拿另一句话或另一个词来凑平均数。RMSNorm 则不做减均值。\n\n**直答：**这两个模块按 token 的通道维归一化，形状保持 [B,T,D]；它们的统计量与可训练缩放参数需要分清。\n\n### 跟着写\n\n```python\nclass LayerNorm(nn.Module):\n    def __init__(self, width, eps=1e-5):\n        super().__init__()\n        self.weight = nn.Parameter(torch.ones(width))\n        self.bias = nn.Parameter(torch.zeros(width))\n        self.eps = eps\n\n    def forward(self, x):\n        mean = x.mean(dim=-1, keepdim=True)\n        variance = (x - mean).square().mean(dim=-1, keepdim=True)\n        return (x - mean) * torch.rsqrt(variance + self.eps) * self.weight + self.bias\n\n\nclass RMSNorm(nn.Module):\n    def __init__(self, width, eps=1e-6):\n        super().__init__()\n        self.weight = nn.Parameter(torch.ones(width))\n        self.eps = eps\n\n    def forward(self, x):\n        return x * torch.rsqrt(x.square().mean(-1, keepdim=True) + self.eps) * self.weight\n```\n\n### 进一步：公式、边界与追问\n\n**练习：**把第 3 个词的输入加 99，前两个词的归一化输出是否应该改变？\n\n**答案：**不应该，这是按位置独立操作。LayerNorm 的方差分母为 D，手写时别误用默认的样本方差 D−1。\n\n**追问：RMSNorm 就是没有 bias 的 LayerNorm 吗？**还少了减均值这一步。这里为 float32/float64 教学写法；大规模混合精度常需单独考虑统计量的计算精度。\n\n依据：S56、S131。","html":"<p>每个词的一行数可能整体偏大。LayerNorm 在这一行里先减平均数，再除以标准差；它没有拿另一句话或另一个词来凑平均数。RMSNorm 则不做减均值。<\/p>\n<p><strong>直答：<\/strong>这两个模块按 token 的通道维归一化，形状保持 [B,T,D]；它们的统计量与可训练缩放参数需要分清。<\/p>\n<h3>跟着写<\/h3>\n<pre><code class=\"language-python\">class LayerNorm(nn.Module):\n    def __init__(self, width, eps=1e-5):\n        super().__init__()\n        self.weight = nn.Parameter(torch.ones(width))\n        self.bias = nn.Parameter(torch.zeros(width))\n        self.eps = eps\n\n    def forward(self, x):\n        mean = x.mean(dim=-1, keepdim=True)\n        variance = (x - mean).square().mean(dim=-1, keepdim=True)\n        return (x - mean) * torch.rsqrt(variance + self.eps) * self.weight + self.bias\n\n\nclass RMSNorm(nn.Module):\n    def __init__(self, width, eps=1e-6):\n        super().__init__()\n        self.weight = nn.Parameter(torch.ones(width))\n        self.eps = eps\n\n    def forward(self, x):\n        return x * torch.rsqrt(x.square().mean(-1, keepdim=True) + self.eps) * self.weight\n<\/code><\/pre><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>练习：<\/strong>把第 3 个词的输入加 99，前两个词的归一化输出是否应该改变？<\/p>\n<p><strong>答案：<\/strong>不应该，这是按位置独立操作。LayerNorm 的方差分母为 D，手写时别误用默认的样本方差 D−1。<\/p>\n<p><strong>追问：RMSNorm 就是没有 bias 的 LayerNorm 吗？<\/strong>还少了减均值这一步。这里为 float32/float64 教学写法；大规模混合精度常需单独考虑统计量的计算精度。<\/p>\n<p>依据：<a class=\"ref\" href=\"#source-S56\">S56<\/a>、<a class=\"ref\" href=\"#source-S131\">S131<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-TH08" type="application/json">{"body":"每个词已经从其他词收集了信息，接着需要加工自己的那一行表示。8→32→8 的中间层先建立更多特征，再组合回来；中间有非线性，不能把两层简单合并成一层。\n\n**直答：**FFN 逐 token 加工通道，不直接混合词的位置。SwiGLU 用一条经过 SiLU 的支路调制另一条支路，再投影回来。\n\n### 跟着写\n\n```python\nclass FeedForward(nn.Module):\n    def __init__(self, width, hidden):\n        super().__init__()\n        self.up = nn.Linear(width, hidden)\n        self.down = nn.Linear(hidden, width)\n\n    def forward(self, x):\n        return self.down(F.gelu(self.up(x)))\n\n\nclass SwiGLU(nn.Module):\n    def __init__(self, width, hidden):\n        super().__init__()\n        self.gate = nn.Linear(width, hidden, bias=False)\n        self.up = nn.Linear(width, hidden, bias=False)\n        self.down = nn.Linear(hidden, width, bias=False)\n\n    def forward(self, x):\n        return self.down(F.silu(self.gate(x)) * self.up(x))\n```\n\n### 进一步：公式、边界与追问\n\n**练习：**没有激活的 `down(up(x))` 能否合并？有 GELU 时呢？\n\n**答案：**前者可合并成一个仿射变换，后者通常不能。SwiGLU 还有逐元素乘法，也不是简单线性叠加。\n\n**追问：同样 hidden=32 就是公平比较吗？**不一定。普通 FFN 有两组矩阵，SwiGLU 有三组，比较时要控制参数量或计算预算。这里保留可读的分支结构。\n\n依据：S01、S57。","html":"<p>每个词已经从其他词收集了信息，接着需要加工自己的那一行表示。8→32→8 的中间层先建立更多特征，再组合回来；中间有非线性，不能把两层简单合并成一层。<\/p>\n<p><strong>直答：<\/strong>FFN 逐 token 加工通道，不直接混合词的位置。SwiGLU 用一条经过 SiLU 的支路调制另一条支路，再投影回来。<\/p>\n<h3>跟着写<\/h3>\n<pre><code class=\"language-python\">class FeedForward(nn.Module):\n    def __init__(self, width, hidden):\n        super().__init__()\n        self.up = nn.Linear(width, hidden)\n        self.down = nn.Linear(hidden, width)\n\n    def forward(self, x):\n        return self.down(F.gelu(self.up(x)))\n\n\nclass SwiGLU(nn.Module):\n    def __init__(self, width, hidden):\n        super().__init__()\n        self.gate = nn.Linear(width, hidden, bias=False)\n        self.up = nn.Linear(width, hidden, bias=False)\n        self.down = nn.Linear(hidden, width, bias=False)\n\n    def forward(self, x):\n        return self.down(F.silu(self.gate(x)) * self.up(x))\n<\/code><\/pre><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>练习：<\/strong>没有激活的 <code>down(up(x))<\/code> 能否合并？有 GELU 时呢？<\/p>\n<p><strong>答案：<\/strong>前者可合并成一个仿射变换，后者通常不能。SwiGLU 还有逐元素乘法，也不是简单线性叠加。<\/p>\n<p><strong>追问：同样 hidden=32 就是公平比较吗？<\/strong>不一定。普通 FFN 有两组矩阵，SwiGLU 有三组，比较时要控制参数量或计算预算。这里保留可读的分支结构。<\/p>\n<p>依据：<a class=\"ref\" href=\"#source-S01\">S01<\/a>、<a class=\"ref\" href=\"#source-S57\">S57<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-TH09" type="application/json">{"body":"把词向量当作资料卡，只看卡片内容并不能直接得到绝对次序。位置编码给每张卡补一个位置标记；本节先实现不需要训练的位置表。\n\n**直答：**正弦位置表按位置产生 [T,D]，广播加到 token 向量上；可训练位置表则用 nn.Embedding(max_len,D)。两者要选清楚。\n\n### 跟着写\n\n```python\ndef sinusoidal_positions(length, width, device=None):\n    if width % 2:\n        raise ValueError(\"这个简化正弦实现要求 width 为偶数\")\n    pos = torch.arange(length, device=device).float()[:, None]\n    freq = torch.exp(torch.arange(0, width, 2, device=device).float()\n                     * (-math.log(10000.0) / width))\n    pe = torch.zeros(length, width, device=device)\n    pe[:, 0::2], pe[:, 1::2] = torch.sin(pos * freq), torch.cos(pos * freq)\n    return pe  # [T,D]，可广播加到 [B,T,D]\n```\n\n### 进一步：公式、边界与追问\n\n**练习：**位置 0 的偶数通道与奇数通道分别是什么？\n\n**答案：**sin(0)=0、cos(0)=1。不同通道使用不同变化频率。\n\n**追问：本章最终模型用哪种？**TinyLanguageModel 用可训练绝对位置；TinySeq2Seq 用正弦位置。RoPE 在 TH18 单独实现，它旋转 Q/K，并非把这个正弦表再加一次。每种示例都明确约定，不能随意混装。\n\n依据：S01。","html":"<p>把词向量当作资料卡，只看卡片内容并不能直接得到绝对次序。位置编码给每张卡补一个位置标记；本节先实现不需要训练的位置表。<\/p>\n<p><strong>直答：<\/strong>正弦位置表按位置产生 [T,D]，广播加到 token 向量上；可训练位置表则用 nn.Embedding(max_len,D)。两者要选清楚。<\/p>\n<h3>跟着写<\/h3>\n<pre><code class=\"language-python\">def sinusoidal_positions(length, width, device=None):\n    if width % 2:\n        raise ValueError(&quot;这个简化正弦实现要求 width 为偶数&quot;)\n    pos = torch.arange(length, device=device).float()[:, None]\n    freq = torch.exp(torch.arange(0, width, 2, device=device).float()\n                     * (-math.log(10000.0) / width))\n    pe = torch.zeros(length, width, device=device)\n    pe[:, 0::2], pe[:, 1::2] = torch.sin(pos * freq), torch.cos(pos * freq)\n    return pe  # [T,D]，可广播加到 [B,T,D]\n<\/code><\/pre><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>练习：<\/strong>位置 0 的偶数通道与奇数通道分别是什么？<\/p>\n<p><strong>答案：<\/strong>sin(0)=0、cos(0)=1。不同通道使用不同变化频率。<\/p>\n<p><strong>追问：本章最终模型用哪种？<\/strong>TinyLanguageModel 用可训练绝对位置；TinySeq2Seq 用正弦位置。RoPE 在 <a class=\"ref\" href=\"#q-TH18\">TH18<\/a> 单独实现，它旋转 Q/K，并非把这个正弦表再加一次。每种示例都明确约定，不能随意混装。<\/p>\n<p>依据：<a class=\"ref\" href=\"#source-S01\">S01<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-TH10" type="application/json">{"body":"把一层想成“收集信息”和“加工信息”两道工序。残差保留进入工序之前的表示，把新得到的修正加上去，所以子层输出必须回到原宽度。\n\n**直答：**本章采用 Pre-LN：x 加上 Attention(Norm(x))，再加上 FFN(Norm(x))。残差连接不是把两个向量拼接。\n\n### 跟着写\n\n```python\nclass TransformerBlock(nn.Module):\n    \"\"\"Pre-LN：先归一化再进子层；不同于原始论文的 Post-LN 布局。\"\"\"\n    def __init__(self, width, heads, hidden, dropout=0.0):\n        super().__init__()\n        self.norm1, self.norm2 = LayerNorm(width), LayerNorm(width)\n        self.attn = MultiHeadAttention(width, heads, dropout)\n        self.ffn = FeedForward(width, hidden)\n        self.drop = nn.Dropout(dropout)\n\n    def forward(self, x, allowed=None, causal=False, cache=None, use_cache=False):\n        update, _, new_cache = self.attn(self.norm1(x), allowed=allowed,\n                                         causal=causal, cache=cache, use_cache=use_cache)\n        x = x + self.drop(update)\n        x = x + self.drop(self.ffn(self.norm2(x)))\n        return x, new_cache\n```\n\n### 逐行拆解\n\n1. norm1 与 norm2 是两套参数，不是同一个归一化层反复用。\n2. 注意力读入归一化的 x，但残差加回的是归一化之前的 x。\n3. FFN 前再次归一化，再加回第二条残差。\n4. Dropout 在训练和评估模式下行为不同；学习基本数据流时先设 dropout=0。\n\n### 进一步：公式、边界与追问\n\n**练习：**把所有 attention 和 FFN 参数置零，这一层的输出应是什么？\n\n**答案：**残差保留原 x。若写成只返回子层输出，就失去了这条路径。\n\n**追问：这就是原始论文的精确架构吗？**原论文是 Post-LN 布局，且 FFN 等细节不同。本章用 Pre-LN、GELU 的教学变体，并在堆叠末端补最终归一化；面试要求哪一种，就按哪一种画图并实现。\n\n依据：S01、S134。","html":"<p>把一层想成“收集信息”和“加工信息”两道工序。残差保留进入工序之前的表示，把新得到的修正加上去，所以子层输出必须回到原宽度。<\/p>\n<p><strong>直答：<\/strong>本章采用 Pre-LN：x 加上 Attention(Norm(x))，再加上 FFN(Norm(x))。残差连接不是把两个向量拼接。<\/p>\n<h3>跟着写<\/h3>\n<pre><code class=\"language-python\">class TransformerBlock(nn.Module):\n    &quot;&quot;&quot;Pre-LN：先归一化再进子层；不同于原始论文的 Post-LN 布局。&quot;&quot;&quot;\n    def __init__(self, width, heads, hidden, dropout=0.0):\n        super().__init__()\n        self.norm1, self.norm2 = LayerNorm(width), LayerNorm(width)\n        self.attn = MultiHeadAttention(width, heads, dropout)\n        self.ffn = FeedForward(width, hidden)\n        self.drop = nn.Dropout(dropout)\n\n    def forward(self, x, allowed=None, causal=False, cache=None, use_cache=False):\n        update, _, new_cache = self.attn(self.norm1(x), allowed=allowed,\n                                         causal=causal, cache=cache, use_cache=use_cache)\n        x = x + self.drop(update)\n        x = x + self.drop(self.ffn(self.norm2(x)))\n        return x, new_cache\n<\/code><\/pre>\n<h3>逐行拆解<\/h3>\n<ol>\n<li>norm1 与 norm2 是两套参数，不是同一个归一化层反复用。<\/li>\n<li>注意力读入归一化的 x，但残差加回的是归一化之前的 x。<\/li>\n<li>FFN 前再次归一化，再加回第二条残差。<\/li>\n<li>Dropout 在训练和评估模式下行为不同；学习基本数据流时先设 dropout=0。<\/li>\n<\/ol><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>练习：<\/strong>把所有 attention 和 FFN 参数置零，这一层的输出应是什么？<\/p>\n<p><strong>答案：<\/strong>残差保留原 x。若写成只返回子层输出，就失去了这条路径。<\/p>\n<p><strong>追问：这就是原始论文的精确架构吗？<\/strong>原论文是 Post-LN 布局，且 FFN 等细节不同。本章用 Pre-LN、GELU 的教学变体，并在堆叠末端补最终归一化；面试要求哪一种，就按哪一种画图并实现。<\/p>\n<p>依据：<a class=\"ref\" href=\"#source-S01\">S01<\/a>、<a class=\"ref\" href=\"#source-S134\">S134<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-TH11" type="application/json">{"body":"理解一段完整输入、接着前文写下一个词、把中文翻成英文，这三种任务的“能看谁”不同。先画可见关系，比先背模型名字有效。\n\n**直答：**Encoder 通常双向看来源序列；Decoder-only 因果地看自身前文；翻译式 Decoder 还要通过 cross-attention 读取 Encoder 输出。\n\n### 跟着写\n\n```python\nencoder = TransformerBlock(8, 2, 32)\nmemory, _ = encoder(torch.randn(2, 5, 8), causal=False)\nlanguage_block = TransformerBlock(8, 2, 32)\nhidden, _ = language_block(torch.randn(2, 3, 8), causal=True)\nprint(memory.shape, hidden.shape)  # [2,5,8] 与 [2,3,8]\n```\n\n### 进一步：公式、边界与追问\n\n**练习：**英文目标有 3 个词，中文来源有 5 个词，cross-attention 打分矩阵是 3×3 还是 3×5？\n\n**答案：**3×5；Q 来自目标，K/V 来自来源。\n\n**追问：Decoder-only 少了 cross-attention 就等于原 Decoder 吗？**还需明确位置、归一化、FFN 等具体实现。架构分类描述信息流，不代表每个细节一样。\n\n依据：S01。","html":"<p>理解一段完整输入、接着前文写下一个词、把中文翻成英文，这三种任务的“能看谁”不同。先画可见关系，比先背模型名字有效。<\/p>\n<p><strong>直答：<\/strong>Encoder 通常双向看来源序列；Decoder-only 因果地看自身前文；翻译式 Decoder 还要通过 cross-attention 读取 Encoder 输出。<\/p>\n<h3>跟着写<\/h3>\n<pre><code class=\"language-python\">encoder = TransformerBlock(8, 2, 32)\nmemory, _ = encoder(torch.randn(2, 5, 8), causal=False)\nlanguage_block = TransformerBlock(8, 2, 32)\nhidden, _ = language_block(torch.randn(2, 3, 8), causal=True)\nprint(memory.shape, hidden.shape)  # [2,5,8] 与 [2,3,8]\n<\/code><\/pre><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>练习：<\/strong>英文目标有 3 个词，中文来源有 5 个词，cross-attention 打分矩阵是 3×3 还是 3×5？<\/p>\n<p><strong>答案：<\/strong>3×5；Q 来自目标，K/V 来自来源。<\/p>\n<p><strong>追问：Decoder-only 少了 cross-attention 就等于原 Decoder 吗？<\/strong>还需明确位置、归一化、FFN 等具体实现。架构分类描述信息流，不代表每个细节一样。<\/p>\n<p>依据：<a class=\"ref\" href=\"#source-S01\">S01<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-TH12" type="application/json">{"body":"写英文第 3 个词时，先看已经写出的英文，再去完整中文来源找信息。第一步不能偷看未来英文；第二步可以读取允许的所有中文位置。\n\n**直答：**翻译式 Decoder 一层有因果自注意力、交叉注意力、FFN 三个子层，各自有残差。\n\n### 跟着写\n\n```python\nclass DecoderBlock(nn.Module):\n    \"\"\"翻译式 decoder：因果 self-attention → cross-attention → FFN。\"\"\"\n    def __init__(self, width, heads, hidden):\n        super().__init__()\n        self.norms = nn.ModuleList([LayerNorm(width) for _ in range(3)])\n        self.self_attn = MultiHeadAttention(width, heads)\n        self.cross_attn = MultiHeadAttention(width, heads)\n        self.ffn = FeedForward(width, hidden)\n\n    def forward(self, x, memory, source_valid=None, target_valid=None):\n        target_mask = None if target_valid is None else padding_allowed(target_valid)\n        update, _, _ = self.self_attn(self.norms[0](x), allowed=target_mask, causal=True)\n        x = x + update\n        source_mask = None if source_valid is None else padding_allowed(source_valid)\n        update, _, _ = self.cross_attn(self.norms[1](x), context=memory, allowed=source_mask)\n        x = x + update\n        return x + self.ffn(self.norms[2](x))\n```\n\n### 进一步：公式、边界与追问\n\n**练习：**交换 cross-attention 的 x 与 memory，会发生什么？\n\n**答案：**输出位置数跟随 Q，会变成按来源位置输出，偏离当前要预测目标词的任务。\n\n**追问：source padding 与 target padding 能共用一张 mask 吗？**通常不能，它们长度与可见关系不同。目标还要与因果约束合并。源码的缓存功能只给自注意力教学用；这里没有实现 cross KV 缓存。\n\n依据：S01。","html":"<p>写英文第 3 个词时，先看已经写出的英文，再去完整中文来源找信息。第一步不能偷看未来英文；第二步可以读取允许的所有中文位置。<\/p>\n<p><strong>直答：<\/strong>翻译式 Decoder 一层有因果自注意力、交叉注意力、FFN 三个子层，各自有残差。<\/p>\n<h3>跟着写<\/h3>\n<pre><code class=\"language-python\">class DecoderBlock(nn.Module):\n    &quot;&quot;&quot;翻译式 decoder：因果 self-attention → cross-attention → FFN。&quot;&quot;&quot;\n    def __init__(self, width, heads, hidden):\n        super().__init__()\n        self.norms = nn.ModuleList([LayerNorm(width) for _ in range(3)])\n        self.self_attn = MultiHeadAttention(width, heads)\n        self.cross_attn = MultiHeadAttention(width, heads)\n        self.ffn = FeedForward(width, hidden)\n\n    def forward(self, x, memory, source_valid=None, target_valid=None):\n        target_mask = None if target_valid is None else padding_allowed(target_valid)\n        update, _, _ = self.self_attn(self.norms[0](x), allowed=target_mask, causal=True)\n        x = x + update\n        source_mask = None if source_valid is None else padding_allowed(source_valid)\n        update, _, _ = self.cross_attn(self.norms[1](x), context=memory, allowed=source_mask)\n        x = x + update\n        return x + self.ffn(self.norms[2](x))\n<\/code><\/pre><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>练习：<\/strong>交换 cross-attention 的 x 与 memory，会发生什么？<\/p>\n<p><strong>答案：<\/strong>输出位置数跟随 Q，会变成按来源位置输出，偏离当前要预测目标词的任务。<\/p>\n<p><strong>追问：source padding 与 target padding 能共用一张 mask 吗？<\/strong>通常不能，它们长度与可见关系不同。目标还要与因果约束合并。源码的缓存功能只给自注意力教学用；这里没有实现 cross KV 缓存。<\/p>\n<p>依据：<a class=\"ref\" href=\"#source-S01\">S01<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-TH13" type="application/json">{"body":"假设词表只有 8 个符号。每个位置先拿到 24 维内部表示，经过 2 层处理，最后输出 8 个分数，表示下一符号的不同候选。内部维度与词表大小是两件事。\n\n**直答：**先把 token 和位置变成向量，经过独立参数的多层 Block，再映射到词表 logits；这里返回分数，不提前 softmax。\n\n### 跟着写\n\n```python\nclass TinyLanguageModel(nn.Module):\n    def __init__(self, vocab_size=8, width=24, heads=3, layers=2, max_len=64):\n        super().__init__()\n        self.token_emb = nn.Embedding(vocab_size, width)\n        self.pos_emb = nn.Embedding(max_len, width)\n        self.blocks = nn.ModuleList([TransformerBlock(width, heads, 4 * width)\n                                     for _ in range(layers)])\n        self.norm = LayerNorm(width)\n        self.lm_head = nn.Linear(width, vocab_size, bias=False)\n        self.max_len = max_len\n\n    def forward(self, ids, caches=None, use_cache=False):\n        # 教学 LM 只接收无 padding 的等长序列；batch 内缓存长度相同。\n        if caches is not None and len(caches) != len(self.blocks):\n            raise ValueError(\"每一层都需要自己的 KV cache\")\n        past = 0 if caches is None else caches[0][0].size(-2)\n        if past + ids.size(1) > self.max_len:\n            raise ValueError(\"超过位置表长度，请用更短的序列\")\n        positions = torch.arange(past, past + ids.size(1), device=ids.device)\n        x = self.token_emb(ids) + self.pos_emb(positions)\n        new_caches = []\n        for i, block in enumerate(self.blocks):\n            x, cache = block(x, causal=True, cache=None if caches is None else caches[i],\n                             use_cache=use_cache)\n            new_caches.append(cache)\n        return self.lm_head(self.norm(x)), new_caches if use_cache else None\n```\n\n### 逐行拆解\n\n1. token_emb 和 pos_emb 是两张不同的查表参数；一张表示符号，一张表示位置。\n2. ModuleList 把每个独立创建的 Block 登记成模型子模块。\n3. positions 在整个 batch 间广播，但不会混合不同样本。\n4. 每次循环把上一层输出交给下一层，宽度保持不变。\n5. lm_head 把内部宽度投影成词表大小；logits 的每个数还不是概率。\n6. 初次阅读设 caches=None；学习 TH17 时再追踪各层独立缓存与位置偏移。\n\n### 进一步：公式、边界与追问\n\n**练习：**输入 [2,5] 的 token 编号，模型输出是什么形状？两层如何保证不是同一层重复引用？\n\n**答案：**logits 是 [2,5,8]；用列表推导每次创建新的 Block。写 `[block]*2` 会重复引用同一个对象。\n\n**追问：参数与激活有什么区别？**Embedding 表、投影矩阵属于可学习参数；这次前向得到的 x 和 logits 是激活。ModuleList 使每层参数被模块正确登记；普通 Python 列表不会自动登记其中的子模块。\n\n**运行边界：**这个 LM 只支持无 padding、批内等长的输入；最大位置长度为 64；没有声称具备真实语言能力。\n\n依据：S01、S134。","html":"<p>假设词表只有 8 个符号。每个位置先拿到 24 维内部表示，经过 2 层处理，最后输出 8 个分数，表示下一符号的不同候选。内部维度与词表大小是两件事。<\/p>\n<p><strong>直答：<\/strong>先把 token 和位置变成向量，经过独立参数的多层 Block，再映射到词表 logits；这里返回分数，不提前 softmax。<\/p>\n<h3>跟着写<\/h3>\n<pre><code class=\"language-python\">class TinyLanguageModel(nn.Module):\n    def __init__(self, vocab_size=8, width=24, heads=3, layers=2, max_len=64):\n        super().__init__()\n        self.token_emb = nn.Embedding(vocab_size, width)\n        self.pos_emb = nn.Embedding(max_len, width)\n        self.blocks = nn.ModuleList([TransformerBlock(width, heads, 4 * width)\n                                     for _ in range(layers)])\n        self.norm = LayerNorm(width)\n        self.lm_head = nn.Linear(width, vocab_size, bias=False)\n        self.max_len = max_len\n\n    def forward(self, ids, caches=None, use_cache=False):\n        # 教学 LM 只接收无 padding 的等长序列；batch 内缓存长度相同。\n        if caches is not None and len(caches) != len(self.blocks):\n            raise ValueError(&quot;每一层都需要自己的 KV cache&quot;)\n        past = 0 if caches is None else caches[0][0].size(-2)\n        if past + ids.size(1) &gt; self.max_len:\n            raise ValueError(&quot;超过位置表长度，请用更短的序列&quot;)\n        positions = torch.arange(past, past + ids.size(1), device=ids.device)\n        x = self.token_emb(ids) + self.pos_emb(positions)\n        new_caches = []\n        for i, block in enumerate(self.blocks):\n            x, cache = block(x, causal=True, cache=None if caches is None else caches[i],\n                             use_cache=use_cache)\n            new_caches.append(cache)\n        return self.lm_head(self.norm(x)), new_caches if use_cache else None\n<\/code><\/pre>\n<h3>逐行拆解<\/h3>\n<ol>\n<li>token_emb 和 pos_emb 是两张不同的查表参数；一张表示符号，一张表示位置。<\/li>\n<li>ModuleList 把每个独立创建的 Block 登记成模型子模块。<\/li>\n<li>positions 在整个 batch 间广播，但不会混合不同样本。<\/li>\n<li>每次循环把上一层输出交给下一层，宽度保持不变。<\/li>\n<li>lm_head 把内部宽度投影成词表大小；logits 的每个数还不是概率。<\/li>\n<li>初次阅读设 caches=None；学习 <a class=\"ref\" href=\"#q-TH17\">TH17<\/a> 时再追踪各层独立缓存与位置偏移。<\/li>\n<\/ol><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>练习：<\/strong>输入 [2,5] 的 token 编号，模型输出是什么形状？两层如何保证不是同一层重复引用？<\/p>\n<p><strong>答案：<\/strong>logits 是 [2,5,8]；用列表推导每次创建新的 Block。写 <code>[block]*2<\/code> 会重复引用同一个对象。<\/p>\n<p><strong>追问：参数与激活有什么区别？<\/strong>Embedding 表、投影矩阵属于可学习参数；这次前向得到的 x 和 logits 是激活。ModuleList 使每层参数被模块正确登记；普通 Python 列表不会自动登记其中的子模块。<\/p>\n<p><strong>运行边界：<\/strong>这个 LM 只支持无 padding、批内等长的输入；最大位置长度为 64；没有声称具备真实语言能力。<\/p>\n<p>依据：<a class=\"ref\" href=\"#source-S01\">S01<\/a>、<a class=\"ref\" href=\"#source-S134\">S134<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-TH14" type="application/json">{"body":"中文整句先编码成 memory；英文输入以 BOS 起头，逐位置预测目标标签。把这个整体跑通，才能确认你会的是完整 Transformer，而不仅是一段 Attention。\n\n**直答：**Encoder 处理来源，Decoder 使用右移后的目标输入并读取来源 memory，最后输出每个目标位置的词表分数。\n\n### 跟着写\n\n```python\nclass TinySeq2Seq(nn.Module):\n    def __init__(self, vocab_size=12, width=16, heads=2, layers=2, max_len=32):\n        super().__init__()\n        self.source_emb = nn.Embedding(vocab_size, width)\n        self.target_emb = nn.Embedding(vocab_size, width)\n        self.register_buffer(\"positions\", sinusoidal_positions(max_len, width))\n        self.encoders = nn.ModuleList([TransformerBlock(width, heads, 4*width) for _ in range(layers)])\n        self.decoders = nn.ModuleList([DecoderBlock(width, heads, 4*width) for _ in range(layers)])\n        self.encoder_norm, self.decoder_norm = LayerNorm(width), LayerNorm(width)\n        self.output = nn.Linear(width, vocab_size)\n\n    def forward(self, source_ids, target_input, source_valid=None, target_valid=None):\n        # 目标已在调用处右移；target_input[0] 通常是 BOS。\n        memory = self.source_emb(source_ids) + self.positions[:source_ids.size(1)]\n        mask = None if source_valid is None else padding_allowed(source_valid)\n        for block in self.encoders:\n            memory, _ = block(memory, allowed=mask)\n        memory = self.encoder_norm(memory)\n        x = self.target_emb(target_input) + self.positions[:target_input.size(1)]\n        for block in self.decoders:\n            x = block(x, memory, source_valid, target_valid)\n        return self.output(self.decoder_norm(x))\n```\n\n### 进一步：公式、边界与追问\n\n**练习：**source_ids=[2,5]，target_input=[2,3]，词表 12，输出形状是什么？\n\n**答案：**[2,3,12]。目标长度控制输出位置数，来源长度只影响 cross-attention 的 key 数。\n\n**追问：padding 目标怎样计算 loss？**把 padding 标签设为忽略编号，并在交叉熵中用相应 ignore_index；输入的 target_valid 只管可见关系。还要避免整批所有标签都被忽略。本章测试验证 forward、反向、目标因果性和来源 padding 隔离；没有把它宣称为训练好的翻译模型。\n\n依据：S01、S130。","html":"<p>中文整句先编码成 memory；英文输入以 BOS 起头，逐位置预测目标标签。把这个整体跑通，才能确认你会的是完整 Transformer，而不仅是一段 Attention。<\/p>\n<p><strong>直答：<\/strong>Encoder 处理来源，Decoder 使用右移后的目标输入并读取来源 memory，最后输出每个目标位置的词表分数。<\/p>\n<h3>跟着写<\/h3>\n<pre><code class=\"language-python\">class TinySeq2Seq(nn.Module):\n    def __init__(self, vocab_size=12, width=16, heads=2, layers=2, max_len=32):\n        super().__init__()\n        self.source_emb = nn.Embedding(vocab_size, width)\n        self.target_emb = nn.Embedding(vocab_size, width)\n        self.register_buffer(&quot;positions&quot;, sinusoidal_positions(max_len, width))\n        self.encoders = nn.ModuleList([TransformerBlock(width, heads, 4*width) for _ in range(layers)])\n        self.decoders = nn.ModuleList([DecoderBlock(width, heads, 4*width) for _ in range(layers)])\n        self.encoder_norm, self.decoder_norm = LayerNorm(width), LayerNorm(width)\n        self.output = nn.Linear(width, vocab_size)\n\n    def forward(self, source_ids, target_input, source_valid=None, target_valid=None):\n        # 目标已在调用处右移；target_input[0] 通常是 BOS。\n        memory = self.source_emb(source_ids) + self.positions[:source_ids.size(1)]\n        mask = None if source_valid is None else padding_allowed(source_valid)\n        for block in self.encoders:\n            memory, _ = block(memory, allowed=mask)\n        memory = self.encoder_norm(memory)\n        x = self.target_emb(target_input) + self.positions[:target_input.size(1)]\n        for block in self.decoders:\n            x = block(x, memory, source_valid, target_valid)\n        return self.output(self.decoder_norm(x))\n<\/code><\/pre><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>练习：<\/strong>source_ids=[2,5]，target_input=[2,3]，词表 12，输出形状是什么？<\/p>\n<p><strong>答案：<\/strong>[2,3,12]。目标长度控制输出位置数，来源长度只影响 cross-attention 的 key 数。<\/p>\n<p><strong>追问：padding 目标怎样计算 loss？<\/strong>把 padding 标签设为忽略编号，并在交叉熵中用相应 ignore_index；输入的 target_valid 只管可见关系。还要避免整批所有标签都被忽略。本章测试验证 forward、反向、目标因果性和来源 padding 隔离；没有把它宣称为训练好的翻译模型。<\/p>\n<p>依据：<a class=\"ref\" href=\"#source-S01\">S01<\/a>、<a class=\"ref\" href=\"#source-S130\">S130<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-TH15" type="application/json">{"body":"给模型 0、1、2，希望它分别预测 1、2、3。不是让同一个位置抄回自己的输入，也不是先 softmax 后再把概率交给接收 logits 的损失函数。\n\n**直答：**输入取原序列去掉最后一个，标签取去掉第一个；模型给每个位置输出词表分数，再按对应标签计算交叉熵。\n\n### 跟着写\n\n```python\ndef next_token_loss(model, token_ids):\n    # [0,1,2,3] -> 输入 [0,1,2]，标签 [1,2,3]；只移位一次。\n    if token_ids.size(1) < 2:\n        raise ValueError(\"至少两个 token 才能构造下一 token 标签\")\n    inputs, labels = token_ids[:, :-1], token_ids[:, 1:]\n    logits, _ = model(inputs)\n    return F.cross_entropy(logits.reshape(-1, logits.size(-1)), labels.reshape(-1))\n```\n\n### 进一步：公式、边界与追问\n\n**练习：**原序列 [4,5,6,7]，写出三对输入位置与监督答案。\n\n**答案：**看到 4 预测 5；看到 4、5 预测 6；看到 4、5、6 预测 7。整段可并行算前向，但因果 mask 限制每行的可见范围。\n\n**追问：为什么 reshape 成 [B×T,V]？**交叉熵的这个调用把每个位置当一条分类样本；标签同步展平。用 M02 的交叉熵/KL 可视化先理解单个分数，回来再理解批量平均。\n\n依据：S130。","html":"<p>给模型 0、1、2，希望它分别预测 1、2、3。不是让同一个位置抄回自己的输入，也不是先 softmax 后再把概率交给接收 logits 的损失函数。<\/p>\n<p><strong>直答：<\/strong>输入取原序列去掉最后一个，标签取去掉第一个；模型给每个位置输出词表分数，再按对应标签计算交叉熵。<\/p>\n<h3>跟着写<\/h3>\n<pre><code class=\"language-python\">def next_token_loss(model, token_ids):\n    # [0,1,2,3] -&gt; 输入 [0,1,2]，标签 [1,2,3]；只移位一次。\n    if token_ids.size(1) &lt; 2:\n        raise ValueError(&quot;至少两个 token 才能构造下一 token 标签&quot;)\n    inputs, labels = token_ids[:, :-1], token_ids[:, 1:]\n    logits, _ = model(inputs)\n    return F.cross_entropy(logits.reshape(-1, logits.size(-1)), labels.reshape(-1))\n<\/code><\/pre><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>练习：<\/strong>原序列 [4,5,6,7]，写出三对输入位置与监督答案。<\/p>\n<p><strong>答案：<\/strong>看到 4 预测 5；看到 4、5 预测 6；看到 4、5、6 预测 7。整段可并行算前向，但因果 mask 限制每行的可见范围。<\/p>\n<p><strong>追问：为什么 reshape 成 [B×T,V]？<\/strong>交叉熵的这个调用把每个位置当一条分类样本；标签同步展平。用 <a class=\"ref\" href=\"#q-M02\">M02<\/a> 的交叉熵/KL 可视化先理解单个分数，回来再理解批量平均。<\/p>\n<p>依据：<a class=\"ref\" href=\"#source-S130\">S130<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-TH16" type="application/json">{"body":"让模型学习 0→1→…→7→0 的玩具规律。它不需要下载语料或显卡；这能检查“前向、反向、更新”有没有接通，不能用来证明理解自然语言。\n\n**直答：**每步清梯度、前向算损失、反向求梯度、按需裁剪，再让优化器更新参数；要看损失和实际生成，而不只是程序退出成功。\n\n### 跟着写\n\n```python\ndef learning_demo(steps=120):\n    torch.manual_seed(17)\n    torch.set_num_threads(1)\n    model = TinyLanguageModel()\n    # 玩具规律：0 -> 1 -> ... -> 7 -> 0；不是自然语言语料。\n    offsets = torch.arange(8)[:, None]\n    batch = (offsets + torch.arange(13)[None, :]) % 8\n    optimizer = torch.optim.AdamW(model.parameters(), lr=0.01, weight_decay=0.0)\n    history = []\n    for step in range(steps):\n        optimizer.zero_grad(set_to_none=True)\n        loss = next_token_loss(model, batch)\n        loss.backward()\n        torch.nn.utils.clip_grad_norm_(model.parameters(), 1.0)\n        optimizer.step()\n        if step in (0, steps - 1):\n            history.append(float(loss.detach()))\n    prediction = generate(model, torch.tensor([[0, 1, 2]]), 6).tolist()[0]\n    return {\"torch\": torch.__version__, \"device\": \"cpu\", \"steps\": steps,\n            \"first_loss\": history[0], \"last_loss\": history[-1],\n            \"generated\": prediction, \"expected\": [0,1,2,3,4,5,6,7,0],\n            \"scope\": \"玩具循环序列的过拟合自检；不代表语言理解与泛化能力\"}\n```\n\n### 逐行拆解\n\n1. batch 的每行是一条可预测的循环序列，8 行从不同符号起步。\n2. optimizer 持有 model.parameters，知道哪些数需要更新。\n3. zero_grad 清上一轮梯度；loss 是本轮平均扣分。\n4. backward 根据当前 loss 计算各参数梯度；它本身不会更新权重。\n5. step 真正改变参数；下一次前向才会使用改变后的权重。\n6. 最后用生成结果检查学到的规律，和单看 loss 做交叉验证。\n\n### 进一步：公式、边界与追问\n\n**练习：**注释 optimizer.step 后再运行，与正常结果比较；另外观察没有清梯度时，梯度为什么会累加。\n\n**答案：**没有 step 就没有参数更新；不清梯度会把旧梯度留到下一步。梯度累积可以是有意设计，但必须同时设计 loss 缩放和更新频率。\n\n**追问：loss 降到很低代表模型好了？**这里只验证一条极小训练规律。泛化还要用未参与训练的数据与独立任务测试。本章实际运行结果放在配套实验文件旁。\n\n依据：S130、S134。","html":"<p>让模型学习 0→1→…→7→0 的玩具规律。它不需要下载语料或显卡；这能检查“前向、反向、更新”有没有接通，不能用来证明理解自然语言。<\/p>\n<p><strong>直答：<\/strong>每步清梯度、前向算损失、反向求梯度、按需裁剪，再让优化器更新参数；要看损失和实际生成，而不只是程序退出成功。<\/p>\n<h3>跟着写<\/h3>\n<pre><code class=\"language-python\">def learning_demo(steps=120):\n    torch.manual_seed(17)\n    torch.set_num_threads(1)\n    model = TinyLanguageModel()\n    # 玩具规律：0 -&gt; 1 -&gt; ... -&gt; 7 -&gt; 0；不是自然语言语料。\n    offsets = torch.arange(8)[:, None]\n    batch = (offsets + torch.arange(13)[None, :]) % 8\n    optimizer = torch.optim.AdamW(model.parameters(), lr=0.01, weight_decay=0.0)\n    history = []\n    for step in range(steps):\n        optimizer.zero_grad(set_to_none=True)\n        loss = next_token_loss(model, batch)\n        loss.backward()\n        torch.nn.utils.clip_grad_norm_(model.parameters(), 1.0)\n        optimizer.step()\n        if step in (0, steps - 1):\n            history.append(float(loss.detach()))\n    prediction = generate(model, torch.tensor([[0, 1, 2]]), 6).tolist()[0]\n    return {&quot;torch&quot;: torch.__version__, &quot;device&quot;: &quot;cpu&quot;, &quot;steps&quot;: steps,\n            &quot;first_loss&quot;: history[0], &quot;last_loss&quot;: history[-1],\n            &quot;generated&quot;: prediction, &quot;expected&quot;: [0,1,2,3,4,5,6,7,0],\n            &quot;scope&quot;: &quot;玩具循环序列的过拟合自检；不代表语言理解与泛化能力&quot;}\n<\/code><\/pre>\n<h3>逐行拆解<\/h3>\n<ol>\n<li>batch 的每行是一条可预测的循环序列，8 行从不同符号起步。<\/li>\n<li>optimizer 持有 model.parameters，知道哪些数需要更新。<\/li>\n<li>zero_grad 清上一轮梯度；loss 是本轮平均扣分。<\/li>\n<li>backward 根据当前 loss 计算各参数梯度；它本身不会更新权重。<\/li>\n<li>step 真正改变参数；下一次前向才会使用改变后的权重。<\/li>\n<li>最后用生成结果检查学到的规律，和单看 loss 做交叉验证。<\/li>\n<\/ol><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>练习：<\/strong>注释 optimizer.step 后再运行，与正常结果比较；另外观察没有清梯度时，梯度为什么会累加。<\/p>\n<p><strong>答案：<\/strong>没有 step 就没有参数更新；不清梯度会把旧梯度留到下一步。梯度累积可以是有意设计，但必须同时设计 loss 缩放和更新频率。<\/p>\n<p><strong>追问：loss 降到很低代表模型好了？<\/strong>这里只验证一条极小训练规律。泛化还要用未参与训练的数据与独立任务测试。本章实际运行结果放在配套实验文件旁。<\/p>\n<p>依据：<a class=\"ref\" href=\"#source-S130\">S130<\/a>、<a class=\"ref\" href=\"#source-S134\">S134<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-TH17" type="application/json">{"body":"先读完提示词 0、1、2，模型选出 3。下一步只需处理新来的 3，并读取前面已算好的 K/V；如果仍然喂整段却又拼上缓存，前文会被重复加入。\n\n**直答：**先 prefill 整段提示，再逐 token decode；每层保留自身历史 K/V，同时对齐绝对位置与 mask。\n\n### 跟着写\n\n```python\n@torch.no_grad()\ndef generate(model, prompt, steps, use_cache=True):\n    was_training = model.training\n    model.eval()\n    try:\n        ids, caches = prompt.clone(), None\n        for _ in range(steps):\n            current = ids[:, -1:] if use_cache and caches is not None else ids\n            logits, caches = model(current, caches=caches, use_cache=use_cache)\n            next_id = logits[:, -1].argmax(dim=-1, keepdim=True)  # 贪心选择\n            ids = torch.cat([ids, next_id], dim=1)\n        return ids\n    finally:\n        model.train(was_training)\n```\n\n### 进一步：公式、边界与追问\n\n**练习：**回看 TH06 的 cache 拼接和 TH13 的 positions：已有 3 个 token，新 token 的位置编号是多少？\n\n**答案：**从 0 编号时是 3；它应能看到全部 4 个 key。测试还用“前缀 3 个、随后一块 2 个、最后 1 个”与完整前向逐项比 logits，专门检查非方形 mask。\n\n**追问：缓存以后注意力不用算了吗？**新 Q 仍要与全部已缓存 K 比较；省去的是旧 token 的重复投影与多层前向。缓存增加内存，不等于消除序列长度成本。\n\n**边界：**生成函数用 no_grad 与 eval，并在结束后恢复原训练模式。本教学缓存不支持跨样本不同长度、滑窗淘汰或服务端共享，也没有为了演示静默截断历史。\n\n依据：S01、S128。","html":"<p>先读完提示词 0、1、2，模型选出 3。下一步只需处理新来的 3，并读取前面已算好的 K/V；如果仍然喂整段却又拼上缓存，前文会被重复加入。<\/p>\n<p><strong>直答：<\/strong>先 prefill 整段提示，再逐 token decode；每层保留自身历史 K/V，同时对齐绝对位置与 mask。<\/p>\n<h3>跟着写<\/h3>\n<pre><code class=\"language-python\">@torch.no_grad()\ndef generate(model, prompt, steps, use_cache=True):\n    was_training = model.training\n    model.eval()\n    try:\n        ids, caches = prompt.clone(), None\n        for _ in range(steps):\n            current = ids[:, -1:] if use_cache and caches is not None else ids\n            logits, caches = model(current, caches=caches, use_cache=use_cache)\n            next_id = logits[:, -1].argmax(dim=-1, keepdim=True)  # 贪心选择\n            ids = torch.cat([ids, next_id], dim=1)\n        return ids\n    finally:\n        model.train(was_training)\n<\/code><\/pre><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>练习：<\/strong>回看 <a class=\"ref\" href=\"#q-TH06\">TH06<\/a> 的 cache 拼接和 <a class=\"ref\" href=\"#q-TH13\">TH13<\/a> 的 positions：已有 3 个 token，新 token 的位置编号是多少？<\/p>\n<p><strong>答案：<\/strong>从 0 编号时是 3；它应能看到全部 4 个 key。测试还用“前缀 3 个、随后一块 2 个、最后 1 个”与完整前向逐项比 logits，专门检查非方形 mask。<\/p>\n<p><strong>追问：缓存以后注意力不用算了吗？<\/strong>新 Q 仍要与全部已缓存 K 比较；省去的是旧 token 的重复投影与多层前向。缓存增加内存，不等于消除序列长度成本。<\/p>\n<p><strong>边界：<\/strong>生成函数用 no_grad 与 eval，并在结束后恢复原训练模式。本教学缓存不支持跨样本不同长度、滑窗淘汰或服务端共享，也没有为了演示静默截断历史。<\/p>\n<p>依据：<a class=\"ref\" href=\"#source-S01\">S01<\/a>、<a class=\"ref\" href=\"#source-S128\">S128<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-TH18" type="application/json">{"body":"先只看两个通道形成的小箭头。位置越后，按该频率旋转越多；箭头长度不变，两支箭头做点积时会带入相对位置差。\n\n**直答：**本节按相邻通道配对旋转 Q/K；一般不旋转 V。配对方式、频率、位置偏移必须和模型约定一致。\n\n### 跟着写\n\n```python\ndef apply_rope(x, positions, base=10000.0):\n    # 相邻两个通道为一对；有的模型使用前半/后半配对，不能混用权重约定。\n    width = x.size(-1)\n    if width % 2:\n        raise ValueError(\"RoPE 头维度必须为偶数\")\n    freq = base ** (-torch.arange(0, width, 2, device=x.device).float() / width)\n    angle = positions.to(x.device).float()[:, None] * freq\n    cos, sin = angle.cos().to(x.dtype), angle.sin().to(x.dtype)\n    even, odd = x[..., 0::2], x[..., 1::2]\n    return torch.stack([even*cos - odd*sin, even*sin + odd*cos], dim=-1).flatten(-2)\n```\n\n### 进一步：公式、边界与追问\n\n**练习：**把 [1,0] 旋转约 90 度，预期得到什么？缓存增加后，positions 能否从 0 重新开始？\n\n**答案：**约 [0,1]；不能每步重置位置。二维点积的相对角度来自两者旋转角之差。\n\n**追问：把这段加到 TinyLanguageModel 就是 LLaMA 吗？**不是。这里给的是独立部件；替换时还要删除绝对位置加法，在 Q/K 的正确阶段旋转，并处理缓存中 K 已被旋转的事实。归一化、FFN、分组头和权重约定也需逐项对应。\n\n依据：S02。","html":"<p>先只看两个通道形成的小箭头。位置越后，按该频率旋转越多；箭头长度不变，两支箭头做点积时会带入相对位置差。<\/p>\n<p><strong>直答：<\/strong>本节按相邻通道配对旋转 Q/K；一般不旋转 V。配对方式、频率、位置偏移必须和模型约定一致。<\/p>\n<h3>跟着写<\/h3>\n<pre><code class=\"language-python\">def apply_rope(x, positions, base=10000.0):\n    # 相邻两个通道为一对；有的模型使用前半/后半配对，不能混用权重约定。\n    width = x.size(-1)\n    if width % 2:\n        raise ValueError(&quot;RoPE 头维度必须为偶数&quot;)\n    freq = base ** (-torch.arange(0, width, 2, device=x.device).float() / width)\n    angle = positions.to(x.device).float()[:, None] * freq\n    cos, sin = angle.cos().to(x.dtype), angle.sin().to(x.dtype)\n    even, odd = x[..., 0::2], x[..., 1::2]\n    return torch.stack([even*cos - odd*sin, even*sin + odd*cos], dim=-1).flatten(-2)\n<\/code><\/pre><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>练习：<\/strong>把 [1,0] 旋转约 90 度，预期得到什么？缓存增加后，positions 能否从 0 重新开始？<\/p>\n<p><strong>答案：<\/strong>约 [0,1]；不能每步重置位置。二维点积的相对角度来自两者旋转角之差。<\/p>\n<p><strong>追问：把这段加到 TinyLanguageModel 就是 LLaMA 吗？<\/strong>不是。这里给的是独立部件；替换时还要删除绝对位置加法，在 Q/K 的正确阶段旋转，并处理缓存中 K 已被旋转的事实。归一化、FFN、分组头和权重约定也需逐项对应。<\/p>\n<p>依据：<a class=\"ref\" href=\"#source-S02\">S02<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-TH19" type="application/json">{"body":"有 4 个提问者、2 份资料。前两人共用第 1 份 K/V，后两人共用第 2 份；每人的 Q 仍然独立，所以注意力权重不必相同。\n\n**直答：**GQA 让多个 Q 头共享一组 K/V 头；MQA 是只有一组 K/V 的特殊情形，常用于降低 KV 的存储和读取量。\n\n### 跟着写\n\n```python\ndef expand_kv(k, v, query_heads):\n    kv_heads = k.size(1)\n    if v.size(1) != kv_heads or query_heads % kv_heads:\n        raise ValueError(\"Q 头数必须是相同 K/V 头数的整数倍\")\n    group = query_heads // kv_heads\n    # 为看清语义先显式复制；生产内核可避免物理展开。\n    return k.repeat_interleave(group, dim=1), v.repeat_interleave(group, dim=1)\n```\n\n### 进一步：公式、边界与追问\n\n**练习：**Q 有 8 头，K/V 有 2 头，每份 K/V 对应几个 Q 头？换成 3 个 K/V 头呢？\n\n**答案：**每份对应 4 头；本规则下 8 不能被 3 整除，应报错。\n\n**追问：repeat_interleave 不是又把内存复制回去了吗？**这是便于观察分组的参考写法；高效内核可按共享关系读取。缓存应存未展开的 K/V。理论缓存元素数为 2×层数×批量×KV头数×长度×每头维度；字节数还要乘数据类型字节数。\n\n依据：S03。","html":"<p>有 4 个提问者、2 份资料。前两人共用第 1 份 K/V，后两人共用第 2 份；每人的 Q 仍然独立，所以注意力权重不必相同。<\/p>\n<p><strong>直答：<\/strong>GQA 让多个 Q 头共享一组 K/V 头；MQA 是只有一组 K/V 的特殊情形，常用于降低 KV 的存储和读取量。<\/p>\n<h3>跟着写<\/h3>\n<pre><code class=\"language-python\">def expand_kv(k, v, query_heads):\n    kv_heads = k.size(1)\n    if v.size(1) != kv_heads or query_heads % kv_heads:\n        raise ValueError(&quot;Q 头数必须是相同 K/V 头数的整数倍&quot;)\n    group = query_heads // kv_heads\n    # 为看清语义先显式复制；生产内核可避免物理展开。\n    return k.repeat_interleave(group, dim=1), v.repeat_interleave(group, dim=1)\n<\/code><\/pre><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>练习：<\/strong>Q 有 8 头，K/V 有 2 头，每份 K/V 对应几个 Q 头？换成 3 个 K/V 头呢？<\/p>\n<p><strong>答案：<\/strong>每份对应 4 头；本规则下 8 不能被 3 整除，应报错。<\/p>\n<p><strong>追问：repeat_interleave 不是又把内存复制回去了吗？<\/strong>这是便于观察分组的参考写法；高效内核可按共享关系读取。缓存应存未展开的 K/V。理论缓存元素数为 2×层数×批量×KV头数×长度×每头维度；字节数还要乘数据类型字节数。<\/p>\n<p>依据：<a class=\"ref\" href=\"#source-S03\">S03<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-TH20" type="application/json">{"body":"一个把头与位置顺序弄反的程序，可能仍输出 [B,T,D]。一个偷看未来的模型，训练 loss 甚至会更漂亮。正确性需要专门设计会揭穿这些错误的例子。\n\n**直答：**至少验证形状与顺序、参考数值、梯度、遮罩因果性、缓存等价，以及小样本学习；每类检查针对不同错误。\n\n### 跟着写\n\n```python\n# 在 transformer_handwrite.py 同目录运行\nfrom transformer_handwrite import TinyLanguageModel\nmodel = TinyLanguageModel().eval()\na = torch.tensor([[0, 1, 2, 3]])\nb = torch.tensor([[0, 1, 2, 7]])\ntorch.testing.assert_close(model(a)[0][:, :3], model(b)[0][:, :3])\n# 只改未来，过去位置的输出应不变。\n```\n\n### 进一步：公式、边界与追问\n\n**练习：**临时去掉 causal=True，再运行这一检查；它是否能发现未来泄漏？\n\n**答案：**随机权重下通常会不一致。正式测试固定随机种子，并同时做 PyTorch 对照、有限差分梯度、padding 隔离和缓存分块等价，避免依赖单一例子。\n\n**追问：必须所有浮点位完全相同吗？**通常用合理容差比较；不同精度与内核有浮点误差。误差阈值应跟任务与精度对应，不能用很大的容差掩盖轴顺序错误。\n\n依据：S128、S129。","html":"<p>一个把头与位置顺序弄反的程序，可能仍输出 [B,T,D]。一个偷看未来的模型，训练 loss 甚至会更漂亮。正确性需要专门设计会揭穿这些错误的例子。<\/p>\n<p><strong>直答：<\/strong>至少验证形状与顺序、参考数值、梯度、遮罩因果性、缓存等价，以及小样本学习；每类检查针对不同错误。<\/p>\n<h3>跟着写<\/h3>\n<pre><code class=\"language-python\"># 在 transformer_handwrite.py 同目录运行\nfrom transformer_handwrite import TinyLanguageModel\nmodel = TinyLanguageModel().eval()\na = torch.tensor([[0, 1, 2, 3]])\nb = torch.tensor([[0, 1, 2, 7]])\ntorch.testing.assert_close(model(a)[0][:, :3], model(b)[0][:, :3])\n# 只改未来，过去位置的输出应不变。\n<\/code><\/pre><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>练习：<\/strong>临时去掉 causal=True，再运行这一检查；它是否能发现未来泄漏？<\/p>\n<p><strong>答案：<\/strong>随机权重下通常会不一致。正式测试固定随机种子，并同时做 PyTorch 对照、有限差分梯度、padding 隔离和缓存分块等价，避免依赖单一例子。<\/p>\n<p><strong>追问：必须所有浮点位完全相同吗？<\/strong>通常用合理容差比较；不同精度与内核有浮点误差。误差阈值应跟任务与精度对应，不能用很大的容差掩盖轴顺序错误。<\/p>\n<p>依据：<a class=\"ref\" href=\"#source-S128\">S128<\/a>、<a class=\"ref\" href=\"#source-S129\">S129<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-TH21" type="application/json">{"body":"时间有限时，不要先写十几个可选参数。先给一个可以解释和验证的核心版本，再按面试官追问扩展。以下是练习时间分配，不是任何公司的统一题型。\n\n**直答：**先确认范围，用形状驱动实现，再用一个小例子自检；解释关键选择与边界和写出代码同样重要。\n\n### 进一步：公式、边界与追问\n\n| 时间 | 练习产物 | 自检 |\n|---|---|---|\n| 0—3 分钟 | 写 B/T/D/H 与输入输出 | 是否 batch_first；是否 causal |\n| 3—10 分钟 | 单头 attention 与 mask | softmax 沿 key；未来权重为 0 |\n| 10—18 分钟 | 多头拆合与输出投影 | 数字顺序可逆；不把 token 轴拼错 |\n| 18—24 分钟 | Norm、FFN、残差 | 形状保持；参数被登记 |\n| 24—30 分钟 | 样例测试与追问 | padding、all-masked、cache 的约定 |\n\n**练习：**合上答案，仅凭这张表重写 TH06，再用参考测试检查。若题目要求完整 Transformer，则把 TH11—TH14 的 encoder/cross-attention 一起纳入更长一轮练习。\n\n**答案判定：**不是和参考代码逐字相同，而是信息流、计算、mask、参数与结果满足同一约定。\n\n**追问：可以用库层吗？**先确认面试要求。手写基础时不能用封装层替代正在考的模块；工程应用可以选成熟内核，并解释两者差异。\n\n依据：S129、S135。","html":"<p>时间有限时，不要先写十几个可选参数。先给一个可以解释和验证的核心版本，再按面试官追问扩展。以下是练习时间分配，不是任何公司的统一题型。<\/p>\n<p><strong>直答：<\/strong>先确认范围，用形状驱动实现，再用一个小例子自检；解释关键选择与边界和写出代码同样重要。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><table>\n<thead>\n<tr>\n<th>时间<\/th>\n<th>练习产物<\/th>\n<th>自检<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0—3 分钟<\/td>\n<td>写 B/T/D/H 与输入输出<\/td>\n<td>是否 batch_first；是否 causal<\/td>\n<\/tr>\n<tr>\n<td>3—10 分钟<\/td>\n<td>单头 attention 与 mask<\/td>\n<td>softmax 沿 key；未来权重为 0<\/td>\n<\/tr>\n<tr>\n<td>10—18 分钟<\/td>\n<td>多头拆合与输出投影<\/td>\n<td>数字顺序可逆；不把 token 轴拼错<\/td>\n<\/tr>\n<tr>\n<td>18—24 分钟<\/td>\n<td>Norm、FFN、残差<\/td>\n<td>形状保持；参数被登记<\/td>\n<\/tr>\n<tr>\n<td>24—30 分钟<\/td>\n<td>样例测试与追问<\/td>\n<td>padding、all-masked、cache 的约定<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>练习：<\/strong>合上答案，仅凭这张表重写 <a class=\"ref\" href=\"#q-TH06\">TH06<\/a>，再用参考测试检查。若题目要求完整 Transformer，则把 <a class=\"ref\" href=\"#q-TH11\">TH11<\/a>—<a class=\"ref\" href=\"#q-TH14\">TH14<\/a> 的 encoder/cross-attention 一起纳入更长一轮练习。<\/p>\n<p><strong>答案判定：<\/strong>不是和参考代码逐字相同，而是信息流、计算、mask、参数与结果满足同一约定。<\/p>\n<p><strong>追问：可以用库层吗？<\/strong>先确认面试要求。手写基础时不能用封装层替代正在考的模块；工程应用可以选成熟内核，并解释两者差异。<\/p>\n<p>依据：<a class=\"ref\" href=\"#source-S129\">S129<\/a>、<a class=\"ref\" href=\"#source-S135\">S135<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-TH22" type="application/json">{"body":"会滑动一个动画，不等于会写算法；会背代码，也不等于知道为什么错。每次用同一小例子走完“先预测 → 操作可视化 → 手写 → 运行检查 → 解释差异”。\n\n**直答：**用可视化建立可计算的直觉，用代码验证它，再把错误诊断方法迁移到真实模型或 Agent 的工具、训练与评测。\n\n### 进一步：公式、边界与追问\n\n**练习路线：**矩阵乘法看一个格子的来源 → TH03 写投影；注意力开关因果遮罩 → TH04—TH06 写 mask；概率滑块看 CE/KL → TH15 写 loss；缓存逐步增加 → TH17 比较完整与缓存 logits。\n\n**答案标准：**每一步能说出输入输出、变化原因及一个失败例子。比如“没 mask 也能生成”不能证明没偷看答案；“工具返回 200”也不能证明 Agent 办成任务。\n\n**追问：外部开源教程怎样搭配？**Happy-LLM 适合沿基础走向完整实现；LLMs-from-scratch 有模块代码和练习；Hello-Agents 让读者从基本循环走向工具、记忆与项目；面试指南可用于连环追问。这里只借鉴组织方式，算法事实仍按原论文与官方接口核对，没有把公开面经当作公司要求的证据。\n\n依据：S132、S133、S134、S135。","html":"<p>会滑动一个动画，不等于会写算法；会背代码，也不等于知道为什么错。每次用同一小例子走完“先预测 → 操作可视化 → 手写 → 运行检查 → 解释差异”。<\/p>\n<p><strong>直答：<\/strong>用可视化建立可计算的直觉，用代码验证它，再把错误诊断方法迁移到真实模型或 Agent 的工具、训练与评测。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>练习路线：<\/strong>矩阵乘法看一个格子的来源 → <a class=\"ref\" href=\"#q-TH03\">TH03<\/a> 写投影；注意力开关因果遮罩 → <a class=\"ref\" href=\"#q-TH04\">TH04<\/a>—<a class=\"ref\" href=\"#q-TH06\">TH06<\/a> 写 mask；概率滑块看 CE/KL → <a class=\"ref\" href=\"#q-TH15\">TH15<\/a> 写 loss；缓存逐步增加 → <a class=\"ref\" href=\"#q-TH17\">TH17<\/a> 比较完整与缓存 logits。<\/p>\n<p><strong>答案标准：<\/strong>每一步能说出输入输出、变化原因及一个失败例子。比如“没 mask 也能生成”不能证明没偷看答案；“工具返回 200”也不能证明 Agent 办成任务。<\/p>\n<p><strong>追问：外部开源教程怎样搭配？<\/strong>Happy-LLM 适合沿基础走向完整实现；LLMs-from-scratch 有模块代码和练习；Hello-Agents 让读者从基本循环走向工具、记忆与项目；面试指南可用于连环追问。这里只借鉴组织方式，算法事实仍按原论文与官方接口核对，没有把公开面经当作公司要求的证据。<\/p>\n<p>依据：<a class=\"ref\" href=\"#source-S132\">S132<\/a>、<a class=\"ref\" href=\"#source-S133\">S133<\/a>、<a class=\"ref\" href=\"#source-S134\">S134<\/a>、<a class=\"ref\" href=\"#source-S135\">S135<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-J01" type="application/json">{"body":"### 面试官先想知道，你替谁解决了什么问题\n\n先说业务遇到的麻烦，再说你负责哪一段、做了什么、怎么确认有效。例如“误拦正常咨询太多”比一上来列十个模型名更容易理解。\n\n下面模板中的数字和职责都要由本人真实记录填写；资料里的例子是练习，不是新增经历。\n\n**直答：** 按业务问题、个人职责、关键做法、验证结果和失败经验介绍项目，让每一项成果都能追问到证据。\n\n### 进一步：公式、边界与追问\n\n**回答骨架：** “业务要解决的是___。我负责___，建立___标签与数据流程；以___为基线，完成 SFT 和偏好优化；在___冻结评测口径下，___指标发生变化，同时观察___风险；最主要的失败是___，后续用___验证。”\n\n**展开：** 先说输入输出和业务代价，再说数据、训练、评测、部署。技术栈不应挤掉问题和结果。报告中的 2 万样本、24 类、precision 变化只有经本人确认后再填。\n\n**追问答案：** “为什么用 DPO？”从成对偏好可得性、计算和稳定性讲，不回答“因为它先进”。“你个人做什么？”明确独立负责、协作和使用他人成果的边界。\n\n**证据：** 数据卡、标签指南、配置、冻结集、对照、错误案例、资源日志。没有的材料列为证据缺口。","html":"<h3>面试官先想知道，你替谁解决了什么问题<\/h3>\n<p>先说业务遇到的麻烦，再说你负责哪一段、做了什么、怎么确认有效。例如“误拦正常咨询太多”比一上来列十个模型名更容易理解。<\/p>\n<p>下面模板中的数字和职责都要由本人真实记录填写；资料里的例子是练习，不是新增经历。<\/p>\n<p><strong>直答：<\/strong> 按业务问题、个人职责、关键做法、验证结果和失败经验介绍项目，让每一项成果都能追问到证据。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>回答骨架：<\/strong> “业务要解决的是<strong><em>。我负责<\/em><\/strong>，建立<strong><em>标签与数据流程；以<\/em><\/strong>为基线，完成 SFT 和偏好优化；在<strong><em>冻结评测口径下，<\/em><\/strong>指标发生变化，同时观察<strong><em>风险；最主要的失败是<\/em><\/strong>，后续用___验证。”<\/p>\n<p><strong>展开：<\/strong> 先说输入输出和业务代价，再说数据、训练、评测、部署。技术栈不应挤掉问题和结果。报告中的 2 万样本、24 类、precision 变化只有经本人确认后再填。<\/p>\n<p><strong>追问答案：<\/strong> “为什么用 DPO？”从成对偏好可得性、计算和稳定性讲，不回答“因为它先进”。“你个人做什么？”明确独立负责、协作和使用他人成果的边界。<\/p>\n<p><strong>证据：<\/strong> 数据卡、标签指南、配置、冻结集、对照、错误案例、资源日志。没有的材料列为证据缺口。<\/p><\/div><\/details>"}</script>
<script id="data-q-J02" type="application/json">{"body":"### 2 万条不是答案，生产过程才是答案\n\n这些样本从哪里来、哪些重复、谁判断对错、分歧怎么解决、训练和测试怎样隔开，决定它们是否值得学习。\n\n可以先拿一条真实样本，从原始来源讲到最终标签，随后再说整体规模和审核比例。\n\n**直答：** 用一条样本的完整处理过程说明质量机制，再用版本记录和统计说明规模，不能只报一个总数。\n\n### 进一步：公式、边界与追问\n\n**回答骨架：** 说明来源、去重、标注、审核、切分与更新链路，而不是只报数量。\n\n**展开：** 把真实日志、公开数据、模型合成分别列量级与限制；标注指南带正反例、边界例；测双标一致性和仲裁原因；训练/验证/测试按会话和模板隔离。\n\n**追问答案：** “标注不一致怎么办？”区分规范不清、样本缺上下文、真实偏好差异；分别修指南、补上下文或保留不确定性。“数据越多效果越好？”给学习曲线和固定 token 比较。\n\n**易错：** 不能为填满回答编造各来源比例；未知字段写待本人确认，不加入成果数字。","html":"<h3>2 万条不是答案，生产过程才是答案<\/h3>\n<p>这些样本从哪里来、哪些重复、谁判断对错、分歧怎么解决、训练和测试怎样隔开，决定它们是否值得学习。<\/p>\n<p>可以先拿一条真实样本，从原始来源讲到最终标签，随后再说整体规模和审核比例。<\/p>\n<p><strong>直答：<\/strong> 用一条样本的完整处理过程说明质量机制，再用版本记录和统计说明规模，不能只报一个总数。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>回答骨架：<\/strong> 说明来源、去重、标注、审核、切分与更新链路，而不是只报数量。<\/p>\n<p><strong>展开：<\/strong> 把真实日志、公开数据、模型合成分别列量级与限制；标注指南带正反例、边界例；测双标一致性和仲裁原因；训练/验证/测试按会话和模板隔离。<\/p>\n<p><strong>追问答案：<\/strong> “标注不一致怎么办？”区分规范不清、样本缺上下文、真实偏好差异；分别修指南、补上下文或保留不确定性。“数据越多效果越好？”给学习曲线和固定 token 比较。<\/p>\n<p><strong>易错：<\/strong> 不能为填满回答编造各来源比例；未知字段写待本人确认，不加入成果数字。<\/p><\/div><\/details>"}</script>
<script id="data-q-J03" type="application/json">{"body":"### 把“升级套餐”拆开，才知道哪一项有用\n\n数据清洗、SFT、DPO 和阈值同时变了，最终 precision 上涨是整体结果。要拆贡献，比较只改变其中一步时的结果。\n\n如果历史条件无法重建，就明确可证明的范围，再补可运行对照；不要用猜测填满每项贡献。\n\n**直答：** 固定评测口径，按训练和决策阶段建立对照，分别报告指标与代价，区分观察到的提升和已经证明的因果贡献。\n\n### 进一步：公式、边界与追问\n\n**回答骨架：** 先固定 metric 定义与评测条件，再用阶段对照区分数据、训练和阈值贡献。\n\n**展开：** 推荐表：原模型→同数据 SFT→继续 SFT→SFT+DPO；分别列 P/R、误拒、分类型召回、样本数、阈值和成本。另测规则或审核流程是否变化。\n\n**追问答案：** “提升是不是只靠提高阈值？”给 PR 曲线或固定召回点。“没有旧模型怎么办？”仅陈述历史可追溯业务结果，不能声称已严格证明 DPO 单独贡献；补可重跑基线。\n\n**易错：** 17 个百分点不是“提升 17%”；相对增幅约 21.5%，仍须先确认统计口径。","html":"<h3>把“升级套餐”拆开，才知道哪一项有用<\/h3>\n<p>数据清洗、SFT、DPO 和阈值同时变了，最终 precision 上涨是整体结果。要拆贡献，比较只改变其中一步时的结果。<\/p>\n<p>如果历史条件无法重建，就明确可证明的范围，再补可运行对照；不要用猜测填满每项贡献。<\/p>\n<p><strong>直答：<\/strong> 固定评测口径，按训练和决策阶段建立对照，分别报告指标与代价，区分观察到的提升和已经证明的因果贡献。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>回答骨架：<\/strong> 先固定 metric 定义与评测条件，再用阶段对照区分数据、训练和阈值贡献。<\/p>\n<p><strong>展开：<\/strong> 推荐表：原模型→同数据 SFT→继续 SFT→SFT+DPO；分别列 P/R、误拒、分类型召回、样本数、阈值和成本。另测规则或审核流程是否变化。<\/p>\n<p><strong>追问答案：<\/strong> “提升是不是只靠提高阈值？”给 PR 曲线或固定召回点。“没有旧模型怎么办？”仅陈述历史可追溯业务结果，不能声称已严格证明 DPO 单独贡献；补可重跑基线。<\/p>\n<p><strong>易错：<\/strong> 17 个百分点不是“提升 17%”；相对增幅约 21.5%，仍须先确认统计口径。<\/p><\/div><\/details>"}</script>
