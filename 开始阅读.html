向/因果可见关系正确<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><a class=\"ref\" href=\"#q-TH15\">TH15<\/a>—<a class=\"ref\" href=\"#q-TH17\">TH17<\/a><\/td>\n<td>loss、训练循环、生成与缓存<\/td>\n<td>玩具规律学会；缓存 logits 对齐完整前向<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><a class=\"ref\" href=\"#q-TH18\">TH18<\/a>—<a class=\"ref\" href=\"#q-TH22\">TH22<\/a><\/td>\n<td>RoPE、GQA 与限时手写<\/td>\n<td>旋转不改长度；KV 分组正确；解释边界<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>每次复制完整实现为自己的练习文件，先删去本次要练的函数体，合上参考答案再写。保留一份正确实现，方便比较。不要为了让测试变绿而删掉测试；先读失败信息，再画形状或算一个格子。<\/p>\n<h2>建议主动制造的五个错误<\/h2>\n<ol>\n<li>softmax 改成 dim=-2：观察权重行和与参考输出。<\/li>\n<li>去掉 causal mask：修改未来 token，检查过去 logits 会不会变。<\/li>\n<li>去掉合头前 transpose：输出形状可能相同，数字顺序会错。<\/li>\n<li>缓存时把 positions 重置为 0：对比逐 token 与整段前向。<\/li>\n<li>注释 optimizer.step：看 loss 为什么不随训练改善。<\/li>\n<\/ol>\n<p>上述错误只在自己的练习副本中尝试。参考实现与测试文件作为对照；每次只改一处，定位原因后恢复。<\/p>\n<h2>代码的明确边界<\/h2>\n<ul>\n<li>attention 的 allowed=True 表示可见；完全屏蔽的行直接报错。padding 的可见性与标签忽略需分开处理。<\/li>\n<li>主线 LM 使用无 padding、批内等长输入、可训练绝对位置与 Pre-LN；生成使用贪心选择。<\/li>\n<li>缓存是各层的 K/V 张量元组；没有分页、跨请求共享、滑窗淘汰、量化或服务部署逻辑。<\/li>\n<li>RoPE、RMSNorm、SwiGLU、GQA 是可运行的独立教学部件，并未声称主线 LM 同时采用这些变体。<\/li>\n<li>Python 与浏览器演示使用同一数学定义和小例子；浏览器不运行 PyTorch、不做训练。不要把动画中的示意数值当作真实模型权重。<\/li>\n<\/ul>\n<p>参考资料与版本见第 21 章各题的一手来源；开源教程教学组织的取舍见维护目录的“可视化与手写教学设计”。<\/p>"}</script>
<script id="data-doc-dd36ce09842" type="application/json">{"html":"<h1>后训练与预训练数值练习<\/h1>\n<p>目标是把 <a class=\"ref\" href=\"#q-KD26\">KD26<\/a>、<a class=\"ref\" href=\"#q-HP02\">HP02<\/a>—<a class=\"ref\" href=\"#q-HP04\">HP04<\/a>、<a class=\"ref\" href=\"#q-PT02\">PT02<\/a>、<a class=\"ref\" href=\"#q-PT08\">PT08<\/a>、<a class=\"ref\" href=\"#q-PT11\">PT11<\/a> 的数字算明白。这里的 CPU 程序只验证公式与样本组织；模型训练是后面的独立实验设计。<\/p>\n<h2>第一层：先把六件小事算对<\/h2>\n<table>\n<thead>\n<tr>\n<th>练习<\/th>\n<th>你应该看到什么<\/th>\n<th>回到哪题<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>老师给 0.5，学生给 0.2<\/td>\n<td>对数概率差约 +0.916；交换后为 −0.916<\/td>\n<td><a class=\"ref\" href=\"#q-KD26\">KD26<\/a><\/td>\n<\/tr>\n<tr>\n<td>固定上下文，枚举三个候选 token<\/td>\n<td>直接反向 KL 梯度、停止梯度优势的期望更新、有限差分三者一致<\/td>\n<td><a class=\"ref\" href=\"#q-KD26\">KD26<\/a><\/td>\n<\/tr>\n<tr>\n<td>两个新旧概率比为 2、0.5<\/td>\n<td>GSPO 几何平均为 1，算术平均为 1.25<\/td>\n<td><a class=\"ref\" href=\"#q-HP02\">HP02<\/a><\/td>\n<\/tr>\n<tr>\n<td>改变 SAPO 温度<\/td>\n<td>在 r=1 处导数仍为 1，远离该点逐渐减弱<\/td>\n<td><a class=\"ref\" href=\"#q-HP03\">HP03<\/a><\/td>\n<\/tr>\n<tr>\n<td>把一个奖励维度放大 7 倍<\/td>\n<td>在本练习的数值容差内，分别归一化后的优势不变；常数组不出现 NaN<\/td>\n<td><a class=\"ref\" href=\"#q-HP04\">HP04<\/a><\/td>\n<\/tr>\n<tr>\n<td>标签移位、有效 token 与预算<\/td>\n<td>目标比输入错后一位；损失按 token 加权；一次更新 65536 token<\/td>\n<td><a class=\"ref\" href=\"#q-PT02\">PT02<\/a>、<a class=\"ref\" href=\"#q-PT11\">PT11<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>运行根目录“验证与重建.ps1”可一并检查。单独练习时，进入本目录，用可用的 Python 运行：<\/p>\n<pre><code class=\"language-text\">python posttraining_pretraining_examples.py\npython test_posttraining_pretraining.py\n<\/code><\/pre>\n<p>需要 NumPy。随机策略采样没有在此真正运行；为了避免蒙特卡洛噪声，OPD 例子显式枚举所有 token，再按学生概率加权。<\/p>\n<h3>怎样理解这个 OPD 检查<\/h3>\n<p>先固定老师与上下文，只改变学生的三个原始分数。第一种方法直接计算两套概率的反向 KL；第二种把“老师 logprob − 学生 logprob”当固定优势，计算每个可能选择的更新再取平均；第三种把一个原始分数稍微加减，观察 KL 的实际变化。<\/p>\n<p>这能检查方向和停止梯度处理。它没有模拟前面动作改变后引发的后续状态变化，因此不能据此声称实现了完整序列 RL 或复现了 OPD 论文成绩。<\/p>\n<h2>第二层：预训练小模型对照方案<\/h2>\n<p>在具备相应训练资源后，可选择小规模文本续写模型，先完成一次能稳定下降并保存检查点的基础训练。以下是待执行方案。<\/p>\n<ol>\n<li><strong>确定数据与切分。<\/strong>选有权使用的小语料，按文档和近重复家族隔离训练与验证；记录 tokenizer 版本。<\/li>\n<li><strong>先审一条样本。<\/strong>逐位置打印输入、预测目标、attention mask 和有效 loss 位置，确认没有偷看答案或重复移位。<\/li>\n<li><strong>固定一个预算。<\/strong>记录模型规模、有效训练 token、优化器、学习率、上下文、微批次与累积次数。<\/li>\n<li><strong>只改变一个因素。<\/strong>例如原始数据与去重数据，或网页/代码的两种配比。去重后可以调整遍历次数，但要交代重复训练量并统一有效 token 预算。<\/li>\n<li><strong>保存证据。<\/strong>训练/验证曲线、分领域损失、生成样本、吞吐、显存、耗时、异常及恢复记录。<\/li>\n<li><strong>给有边界的结论。<\/strong>“在本数据、模型和预算下，方案 A 的某指标优于 B”；不要仅凭训练 loss 更低断言泛化更好。<\/li>\n<\/ol>\n<h2>第三层：有教师资源后怎么比较后训练<\/h2>\n<p>先选一个能验证终态的小任务，再逐步增加复杂度：示范 SFT → 单教师 OPD → 按实际信息条件考虑 OPSD 或 MOPD。统一学生起点、测试输入、总训练预算与教师调用成本。<\/p>\n<p>有参考解才能做相应 OPSD 对照；有可靠领域专家和路由，才讨论 MOPD；有详细环境反馈再比较 SDPO。每个新步骤都同时测原能力是否遗忘、任务成功率和每成功任务成本。<\/p>\n<p><strong>报告时分开三类工作：<\/strong>已运行的数值检查、自己完成的模型实验、原论文结果。具体方法出处见 <a class=\"ref\" href=\"#q-KD25\">KD25<\/a>—<a class=\"ref\" href=\"#q-KD34\">KD34<\/a>、<a class=\"ref\" href=\"#q-HP02\">HP02<\/a>—<a class=\"ref\" href=\"#q-HP06\">HP06<\/a>、<a class=\"ref\" href=\"#q-PT18\">PT18<\/a>、<a class=\"ref\" href=\"#q-PT19\">PT19<\/a>。<\/p>"}</script>
<script id="data-doc-dd23ac576bc" type="application/json">{"html":"<h1>实验说明与 GPU 补强方案<\/h1>\n<h2>已提供的 CPU 练习<\/h2>\n<p>core_algorithms.py 是核心实现，test_core.py 做独立性质和数值校验，run_examples.py 生成“教学运行结果.json”。无需模型 API、数据上传或 GPU。<\/p>\n<p>在该目录打开终端：<\/p>\n<pre><code class=\"language-powershell\">python test_core.py\npython run_examples.py\n<\/code><\/pre>\n<p>依赖 Python 3.10+ 与 NumPy；使用本机配套“验证与重建.ps1”也可运行。代码本身不训练大模型。<\/p>\n<table>\n<thead>\n<tr>\n<th>练习<\/th>\n<th>核查的关键点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>softmax/CE<\/td>\n<td>大 logits、平移不变、空 mask、有限差分梯度<\/td>\n<\/tr>\n<tr>\n<td>attention<\/td>\n<td>未来 V 不影响早期输出，权重和为 1<\/td>\n<\/tr>\n<tr>\n<td>sequence logprob<\/td>\n<td>目标已对齐、忽略 −100、有效长度<\/td>\n<\/tr>\n<tr>\n<td>LoRA<\/td>\n<td>合并前后线性代数一致，零初始化还原基座<\/td>\n<\/tr>\n<tr>\n<td>DPO/SimPO<\/td>\n<td>初始 loss、梯度符号、长度归一与 β/γ<\/td>\n<\/tr>\n<tr>\n<td>KTO<\/td>\n<td>参考点处效用、好坏梯度方向与饱和；参考点从外部提供<\/td>\n<\/tr>\n<tr>\n<td>GRPO/clip<\/td>\n<td>组全相同、正负优势、三类归一化<\/td>\n<\/tr>\n<tr>\n<td>pass@k<\/td>\n<td>小样本穷举对照<\/td>\n<\/tr>\n<tr>\n<td>paired bootstrap<\/td>\n<td>相同模型差值区间为零<\/td>\n<\/tr>\n<tr>\n<td>RRF/KV<\/td>\n<td>排名融合与单位换算<\/td>\n<\/tr>\n<tr>\n<td>Agent 恢复<\/td>\n<td>提交后响应丢失，不重复写入<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>建议自己补做的题<\/h3>\n<p>为 attention 加 padding；为 sequence_logprob 增加显式 shift 包装；把分布式变长 token 权重错误写成一个失败用例；将退款模拟扩展为最终一致性并限制查询次数。完成后记录运行输出，不仅贴代码。<\/p>\n<h2>GPU 实验一：DPO/KTO/SimPO 比较<\/h2>\n<p><strong>假设：<\/strong> 同一 SFT 起点下，反馈形式与目标选择会改变安全双侧表现和训练成本。<\/p>\n<p><strong>数据：<\/strong> 训练、开发、冻结测试按会话/模板隔离；记录样本与有效 token；偏好标签带理由和置信度；单样本好坏标签单独定义。<\/p>\n<p><strong>组别：<\/strong> SFT 原点、同预算继续 SFT、DPO、SimPO；有合适二值反馈再加 KTO。数据量与信息量不等价时分别报告。<\/p>\n<p><strong>配置：<\/strong> 模型及 revision、模板、max length、精度、LoRA target/rank、batch/累积、学习率、epoch、β、γ、参考 logprob 方式、训练器版本。超参数只用开发集选择。<\/p>\n<p><strong>指标：<\/strong> precision/recall、关键类召回、正常请求误拒、生成帮助性、回答长度、偏好 win rate、通用能力、GPU 时和峰值显存。<\/p>\n<p><strong>最低验证：<\/strong> 训练前手查样本；先少量步检查梯度/标签；正式训练后独立测试；可用预算下多 seed，否则明确训练随机性未充分评估。<\/p>\n<p><strong>否证条件：<\/strong> 仅长度变长或阈值变化带来表面胜率；冻结集无稳健收益；关键安全类退化；额外成本超过可接受范围。<\/p>\n<p><strong>产物：<\/strong> 配置、版本、数据卡、日志、对照表、错误库、复现说明。此实验尚未在本次任务中训练。<\/p>\n<h2>GPU 实验二：最小 RLVR<\/h2>\n<p>先选择可执行的算术/结构化任务，奖励测试应覆盖正确、错误、空答案、多个矛盾答案、截断与解析失败。基线至少含 SFT 与相同预算采样。<\/p>\n<p>比较组大小、reward scaling 和一种明确的 loss_type；总生成 token 与训练 token 分开计。记录 reward mean、组全对/全错比例、熵、长度、ratio、clip、KL 与有效组数。<\/p>\n<p>冻结测试使用未见模板与难度切片；报告 pass@1、pass@k、选择器表现和每成功题成本。避免把 oracle 选中正确答案当作系统实际能力。<\/p>\n<p>这是实验设计，尚未运行真实模型训练。无需先追求大模型或大规模分布式，先证明验证器与采样更新链路正确。<\/p>\n<h2>无需训练的补强三：RAG/Agent 故障矩阵<\/h2>\n<p>每个任务登记目标、证据 ID、工具、政策、预期终态；为正常、空检索、错路由、工具超时、响应丢失、规则过期和提示注入分别创建版本。<\/p>\n<p>比较固定工作流、基本 Agent、加入恢复、加入记忆；同总预算多次运行。记录成功率、违规、无效调用、恢复、引用和 p95 时延。<\/p>\n<p>先人工核查 10 条完整轨迹，再扩大任务集，避免自动 judge 在错误协议上批量生产分数。<\/p>\n<h2>结果记录模板<\/h2>\n<pre><code class=\"language-json\">{\n  &quot;experiment_id&quot;: &quot;由本人创建&quot;,\n  &quot;status&quot;: &quot;planned&quot;,\n  &quot;model_revision&quot;: null,\n  &quot;code_revision&quot;: null,\n  &quot;data_snapshot&quot;: null,\n  &quot;split_unit&quot;: &quot;conversation_or_template&quot;,\n  &quot;seed&quot;: null,\n  &quot;hardware&quot;: null,\n  &quot;training_config&quot;: {},\n  &quot;evaluation_protocol&quot;: {},\n  &quot;metrics&quot;: {},\n  &quot;cost&quot;: {},\n  &quot;failures&quot;: [],\n  &quot;conclusion_scope&quot;: &quot;&quot;\n}\n<\/code><\/pre>\n<p>null 表示尚未填写的实验元数据，不是已有结果。正式报告需区分教学算例、复现结果和个人业务成果。<\/p>"}</script>
<script id="data-doc-d07f8737d50" type="application/json">{"html":"<h1>蒸馏数值实验与 Agent 小项目<\/h1>\n<p>配合 <a class=\"ref\" href=\"#q-KD03\">KD03<\/a>、<a class=\"ref\" href=\"#q-KD04\">KD04<\/a>、<a class=\"ref\" href=\"#q-KD11\">KD11<\/a>、<a class=\"ref\" href=\"#q-KD22\">KD22<\/a>、<a class=\"ref\" href=\"#q-KD23\">KD23<\/a> 阅读。目标是先亲手检查关键计算，再组织可验证的 Agent 数据。<\/p>\n<h2>第一步：三种动作的概率<\/h2>\n<p>教学中把选择简化成“查订单、查天气、直接猜”。教师判断为 [0.90, 0.08, 0.02]，学生为 [0.60, 0.30, 0.10]；实际大模型的下一 token 预测一般有数万候选，这里只缩小维度。<\/p>\n<p>运行 distillation_examples.py 可以看到：<\/p>\n<ul>\n<li>正向 KL 约 0.2270，反向 KL 约 0.3142；方向不同，惩罚数值不同。<\/li>\n<li>温度 1、2、4 下的教师概率分布；温度越高，分布越平。<\/li>\n<li>软目标损失乘 T² 后的解析梯度与有限差分比较。<\/li>\n<li>被 mask 的工具观察位置改变预测分数时，该位置仍不进入直接损失。<\/li>\n<li><a class=\"ref\" href=\"#q-KD20\">KD20<\/a> 假设数字的成本摊平点：37500 个任务。<\/li>\n<\/ul>\n<p>请先预测结果再运行。例如，把师生分布改成完全相同，两个 KL 应该是多少？<\/p>\n<h2>第二步：检查一次完整的训练记分<\/h2>\n<p>“mask”就是一张“这个位置是否计分”的表。模型的工具调用和答复记 1；用户输入、工具返回、补齐长度的 padding 通常记 0。不同训练目标可能另有约定，先写出规则再编码。<\/p>\n<p>在真实因果语言模型中，第 t 个位置的输出分数预测第 t+1 个 token。配套函数接收的是<strong>已经完成这个移位的分数和目标<\/strong>，不要在调用时漏移或移两次。<\/p>\n<p>观察 token 虽不直接计分，仍应留在后续回答的上下文里。“不计算该位置损失”不等于“模型不读取该位置”。<\/p>\n<h2>第三步：一个可以逐步实现的订单 Agent 实验<\/h2>\n<p>下面是项目设计，尚未执行教师调用或 GPU 训练。<\/p>\n<ol>\n<li><strong>环境与任务：<\/strong>做可重置的模拟订单工具；任务包含完整参数、缺订单号、查无结果、一次超时和多轮补问。环境固定随机种子，每次可重放。<\/li>\n<li><strong>验证器：<\/strong>根据实际订单状态检查终态和答复。工具调用 JSON 合法只是第一关，还要核对订单号、调用依赖和观察一致性。<\/li>\n<li><strong>数据：<\/strong>按任务族先留出测试集，再向教师采样训练任务。记录完整 messages、工具版本、真实工具结果、教师版本与验证结果；不把测试题用于教师生成训练答案。<\/li>\n<li><strong>基线：<\/strong>原始学生直接执行；学生用教师轨迹 SFT；教师直接执行。保持部署工具和单题预算可比较。<\/li>\n<li><strong>定向改进：<\/strong>收集学生自己跑错的状态，提供完整上下文给教师纠正。只能拿文本就先做纠正示范训练；若有兼容概率与所需训练资源，再做 GKD 对照。<\/li>\n<li><strong>评测：<\/strong>新任务、异常恢复、工具说明变化、重复运行。分别报告最终成功率、有效工具调用率、恢复成功率、P95 延迟和每成功任务成本。<\/li>\n<\/ol>\n<p><strong>最小消融：<\/strong>相同训练 token 下比较最终答案 SFT、完整轨迹 SFT、轨迹加学生状态纠正。若测试时增加多次采样或教师兜底，单独记一组并计算额外成本。<\/p>\n<h2>如何运行<\/h2>\n<p>在知识库根目录执行：<\/p>\n<pre><code class=\"language-text\">python 03_代码实验/distillation_examples.py\npython 03_代码实验/test_distillation.py\n<\/code><\/pre>\n<p>依赖为 Python 3 和 NumPy。根目录“验证与重建.ps1”也包含这两步。源码均位于本文件同目录；网页只是说明，不会自动执行代码或调用教师。<\/p>\n<p>测试包含梯度有限差分、已知 KL 数值、温度稳定性、mask 行为与异常输入。它们用于检查基础计算，不能作为 Agent 能力提升或任何论文复现的证据。<\/p>"}</script>

<script id="data-doc-d408e0d6843" type="application/json">{"html":"<h1>维护规范<\/h1>\n<h2>文件职责<\/h2>\n<ul>\n<li>01_知识主线 与 02_项目与面试：人工维护正文，是唯一事实源。<\/li>\n<li>sources.json：来源登记，固定 S 编号；保留标题、URL、核查日、使用范围与状态。<\/li>\n<li>build.py：由正文生成题目索引、来源索引、48 题速记、离线阅读器与质量报告。<\/li>\n<li>core_algorithms.py / test_core.py：教学代码与可重跑校验。<\/li>\n<li>distillation_examples.py / test_distillation.py：蒸馏概率、温度与 mask 算例。<\/li>\n<li>posttraining_pretraining_examples.py / test_posttraining_pretraining.py：OPD 局部梯度、GSPO/SAPO/GDPO 和预训练样本、预算算例。<\/li>\n<li>agent_reliability_examples.py / test_agent_reliability.py：订单工具契约、超时恢复、记忆、预算与验收的单进程教学模拟；不代表真实 Agent 基准成绩。<\/li>\n<li>transformer_handwrite.py / test_transformer_handwrite.py：第 21 章的完整 PyTorch 实现与数值、梯度、因果性、缓存及玩具学习检查。<\/li>\n<li>reader_visuals.js / reader_visuals.css：8 个按需加载的离线算法演示；构建时嵌入单文件阅读器。题目映射由 QUESTION_VIZ 维护。<\/li>\n<li>CHANGELOG.md：记录新增、修正、依据与影响的题号。<\/li>\n<\/ul>\n<h2>新人可读性规则（1.1）<\/h2>\n<ul>\n<li>每题先给一个具体任务、生活场景或可算的小例子，再解释方法做了什么。<\/li>\n<li>术语第一次出现在入门讲解里时，先说白话含义；不要用另外几个没解释的术语代替解释。<\/li>\n<li>类比说明机制后，写清它的边界。例如概率猜准仍不代表每次结果确定，专家网络不等于人类领域专家。<\/li>\n<li>用“直答”收束已经解释过的概念。不要让直答成为读懂整题的先决条件。<\/li>\n<li>标题“### 进一步：公式、边界与追问”是阅读器识别深读部分的标记，保留完全一致的文字。<\/li>\n<li>深读区可以保留公式、论文版本、严谨前提与深入追问；每题来源仍要能够定位。<\/li>\n<li>新增公式例子必须手算或运行核对。新增内容还需验证默认折叠、完整阅读与旧复习进度兼容。<\/li>\n<li>修改正文后重建，20 题路线由 build.py 中 BEGINNER 维护；341 是当前题数，不是上限。<\/li>\n<\/ul>\n<h2>新增一题<\/h2>\n<p>按“## 固定题号｜问题（P0/P1/P2）”命名，新增后不复用旧题号。给直答、机制/例子、追问答案、条件或误区；算法定义或时效性观点附来源编号。代码练习注明运行范围。<\/p>\n<p>P0 是岗位主干，P1 是延伸追问，P2 是研究储备。不要因为论文新就自动升级 P0。<\/p>\n<h2>新增一篇论文<\/h2>\n<ol>\n<li>优先作者原论文、官方会议页、作者代码和官方文档。\n   来源编号现支持 <a class=\"ref\" href=\"#source-S01\">S01<\/a>—S999；题目编号仍采用原有前缀与两位数字。新增后检查正文、章末与阅读器内的来源跳转。<\/li>\n<li>核对准确标题、版本、发布日期与会议决定；arXiv 作者声明与官方接收分别记录。<\/li>\n<li>说明它改变哪道题：新条件、新反例、新算法，还是仅新的实验分数。<\/li>\n<li>数字写清模型、基线、数据版本、计算预算和单位。没有这些条件时，宁可讲机制。<\/li>\n<li>记录未复现、文档动态变化或访问受限，不把未核查标作已验证。<\/li>\n<\/ol>\n<h2>什么时候更新<\/h2>\n<ul>\n<li>每次面试后：新增真实追问、修正解释、补个人证据。<\/li>\n<li>每两周有空时：检查后训练/Agent 核心新研究，择优改题，不必追完每个模型。<\/li>\n<li>训练器/推理框架升级前：核对默认 loss、mask、KL、归一化与缓存行为。<\/li>\n<li>投递新岗位前：调整学习路线和重点，保留原题编号。<\/li>\n<\/ul>\n<p>这里是建议的手动维护节奏，没有创建定时任务或监控。<\/p>\n<h2>修正优先级<\/h2>\n<p>最高：公式符号/分母错、引用错位、指标混淆、错误归因、个人经历失真。其次：版本变化、重要失效漏讲、代码不能运行。最后才是措辞和排版。<\/p>\n<h2>生成与校验<\/h2>\n<p>运行根目录“验证与重建.ps1”，会校验教学代码并重建阅读器。新 Transformer 实验需先准备 PyTorch 环境，方法见相应运行说明；脚本优先找本地 .venv-transformer，再找本次检查环境，然后尝试原 Python。网络来源检查需显式运行 check_sources.py --refresh，避免每次离线阅读都联网。<\/p>\n<p>新增的 transformer_visual_qa.cjs 覆盖 8 个可视化在 4 档宽度下的交互、下载代码一致性、数值变化、按需挂载和性能。性能基线为 work/transformer-visual-revision/before.html（已经做过加载优化的 1.4），不能误用更早的慢版本来夸大效果。测量包含 4 倍 CPU 降速、5 次独立上下文；同时保留全部题目列表不挂载隐藏正文的约束。<\/p>\n<p>手写章中引用的代码片段应与完整实现对应。修改代码后需同时更新讲解中的片段，逐段比较并运行行为测试；不可只检查代码“能解析”。代码中的索引与函数调用不是 Markdown 链接，构建器使用 Markdown 解析结果识别真实链接。<\/p>\n<p>浏览器回归脚本为 browser_qa.cjs，需要 Node.js、Playwright 和 Edge。用 Node 运行该文件即可；支持 KNOWLEDGE_BROWSER 指定浏览器路径、KNOWLEDGE_QA_OUTPUT 指定截图与临时进度输出目录。脚本使用独立浏览器环境，不改个人浏览器进度；报告写入 browser-qa.json。新题按构建统计自动纳入检查。<\/p>\n<p>Agent 教程的 50 题集合、12 题入门顺序与订单互动在 reader_template.html 维护。修改互动时，要检查 3 种情景各 5 步、前进/返回/重置、最终状态以及窄屏显示；必须区分 Agent 观察与教学视角的后台事实。浏览器回归已包含这些情景。可靠性实验的正常、超时与故障路径由根目录验证脚本一起运行。<\/p>\n<p>公式还要单独运行 formula_qa.cjs，逐个检查 1440、768、390、320 像素宽度下的公式、真实滚动端点、上下边界与未转换命令；报告写入 formula-qa.json，同时生成全公式审阅图。不能仅凭“转换函数未报错”判断渲染正确。test_rendering.py 防止双线体丢失、未知命令直接显示和分隔符不完整等回归。<\/p>\n<p>浏览器数学字母遵循 <a href=\"https://www.w3.org/TR/mathml-core/#the-mathvariant-attribute\">MathML Core 的 mathvariant 约定<\/a>：双线体等字母应输出对应 Unicode 字符。当前转换器已显式处理双线体；遇到未处理的其他字母变体会停止构建，避免悄悄显示成普通字母。<\/p>\n<p>题目与研究记录可复制“新题与研究记录模板.md”；原始背景报告保存在同目录。<\/p>\n<p>阅读器内的复习状态保存在当前浏览器本地；定期使用“导出进度”保存 JSON。换浏览器或移动文件后可导入。导入只接受已存在题号及已知状态，不执行文件中的任何代码。<\/p>\n<h3>阅读器加载与性能<\/h3>\n<ul>\n<li>继续使用单文件内嵌题库，无需 SQLite、IndexedDB 或后台服务。<code>knowledge<\/code> 数据块只包含目录，<code>data-q-*<\/code> / <code>data-doc-*<\/code> 保存完整记录；浏览器通过 <code>DB<\/code> 的按需属性读取正文。校验脚本应读取 <code>DB<\/code>，不要把目录数据块当成完整题库。<\/li>\n<li>折叠题目只渲染标题；正文与深读分别按需创建。<code>build.py<\/code> 生成的深读包装与 <code>reader_template.html<\/code> 的拆分标记必须保持一致。<\/li>\n<li>屏幕外的题目使用 <code>content-visibility<\/code> 延后排版；打印时恢复完整渲染。“展开全部”每批最多 4 题，并响应收起和路由切换。<\/li>\n<li>复习状态继续使用 <code>llm-interview-study-v1<\/code>，阅读深度继续使用 <code>llm-study-depth<\/code>，不迁移或清空个人数据。<\/li>\n<li>用 Node 运行 <code>performance_qa.cjs<\/code> 对比 <code>work/reader-performance/before.html<\/code> 与当前入口，报告写入 <code>performance-qa.json<\/code>。使用独立 Edge 环境、4 倍 CPU 降速、5 次中位数；它测量浏览器加载和渲染，不代表磁盘冷启动，也不改变个人进度。<\/li>\n<li>修改懒加载后，运行 <code>browser_qa.cjs<\/code> 和 <code>formula_qa.cjs<\/code>，覆盖键盘展开、深读、批量展开取消、打印内容、319 题路由和四档屏宽公式。<\/li>\n<\/ul>\n<h2>不能被自动校验替代的审查<\/h2>\n<p>脚本可发现重复题号、未知来源、坏本地链接、无正文和数学渲染失败；不能证明论文因果结论正确、所有公式假设充分、岗位建议适合当前 JD。每次大改仍需人工抽查重点章节和研究原文。<\/p>\n<h2>版本规则<\/h2>\n<p>1.x：在既有结构中扩充/修正；2.0：主线、数据结构或评测协议发生不兼容变化。删除题目时保留迁移说明；引用 URL 变化保留旧地址或来源记录。<\/p>"}</script>
<script id="data-doc-d267c609f49" type="application/json">{"html":"<h1>新题与研究记录模板<\/h1>\n<p>本页可复制使用。尖括号中的内容由维护者填写，不能把空模板当作已完成题目。新增前先搜索已有问题，优先完善原题。<\/p>\n<h2>一道题的最小完整格式<\/h2>\n<pre><code class=\"language-markdown\">## 题号｜具体问题（优先级）\n\n### 先用一个例子想明白\n\n&lt;具体问题是什么；旧做法哪里不方便；这个方法怎样处理。首次使用的术语用白话解释，提供可核对的例子。&gt;\n\n**直答：** &lt;把已解释的机制收束成一句可复述的话。&gt;\n\n### 进一步：公式、边界与追问\n\n**展开：** &lt;定义符号；解释公式或流程；提供一个可核对的小例子。&gt;\n\n**追问：&lt;面试官会进一步问什么？&gt;** &lt;这里必须给出答案，或明确可运行的练习及预期结果。&gt;\n\n**易错：** &lt;最容易混淆的概念、失效条件或错误归因。&gt;\n\n**依据：** &lt;已登记的来源编号；指出适用版本和原文位置。&gt;\n<\/code><\/pre>\n<p>实际题号采用固定前缀和两位数字，如 P19；同一题号不随排序改变。优先级填写 P0、P1 或 P2。若一个主题需要超过 99 题，先升级编号解析规则，不要悄悄生成无法进入索引的新格式。<\/p>\n<h2>新研究记录卡<\/h2>\n<table>\n<thead>\n<tr>\n<th>字段<\/th>\n<th>填写要求<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>标题、作者、URL<\/td>\n<td>用原始来源核对，不照抄二手译名<\/td>\n<\/tr>\n<tr>\n<td>版本与日期<\/td>\n<td>发布、修订、此次核查日期分别填写<\/td>\n<\/tr>\n<tr>\n<td>发表状态<\/td>\n<td>作者自述与官方会议决定分开；无证据就写未核实<\/td>\n<\/tr>\n<tr>\n<td>想解决的问题<\/td>\n<td>旧方法在哪个具体条件下出错或成本过高<\/td>\n<\/tr>\n<tr>\n<td>学习信号<\/td>\n<td>数据、偏好、奖励或教师反馈来自哪里，怎样检查可靠性<\/td>\n<\/tr>\n<tr>\n<td>核心变化<\/td>\n<td>公式、目标函数、训练流程或系统部件改变了什么<\/td>\n<\/tr>\n<tr>\n<td>公平比较<\/td>\n<td>模型、数据、token、候选数、训练/推理预算是否一致<\/td>\n<\/tr>\n<tr>\n<td>结果范围<\/td>\n<td>指标、样本数、基线、误差与适用条件；不只摘最高分<\/td>\n<\/tr>\n<tr>\n<td>失效与反例<\/td>\n<td>新增代价、负面结果、没测的情形、证据不足处<\/td>\n<\/tr>\n<tr>\n<td>影响哪些题<\/td>\n<td>填已有题号，说明替换、补充还是暂不采用<\/td>\n<\/tr>\n<tr>\n<td>最小验证<\/td>\n<td>可在现有资源上验证哪条机制；什么结果会反驳预期<\/td>\n<\/tr>\n<tr>\n<td>当前证据<\/td>\n<td>明确区分读过原文、跑过代码、复现结果和未验证<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>一次修正记录<\/h2>\n<ul>\n<li>日期与版本：<\/li>\n<li>影响的题号、文件及阅读器功能：<\/li>\n<li>原表述或错误行为：<\/li>\n<li>改后的准确表述或行为：<\/li>\n<li>依据与适用条件：<\/li>\n<li>必要验证和实际结果：<\/li>\n<li>若删除或合并题目，旧题号应迁往哪里：<\/li>\n<\/ul>\n<p>把修正摘要加入 CHANGELOG，再运行“验证与重建.ps1”。来源更新需显式运行来源检查；涉及 UI 的变化，再检查检索、跳转、公式、进度导入导出与窄屏显示。<\/p>"}</script>
<script id="data-doc-db37b247f44" type="application/json">{"html":"<h1>1.5 Transformer 手写与算法可视化验收<\/h1>\n<p>日期：2026-09-16。增加面向新人的专门手写章，同时保留当前阅读器的性能优化。正文及代码在当前学习目录维护，开始阅读.html 是单文件离线入口。<\/p>\n<h2>本轮交付<\/h2>\n<ul>\n<li>新增第 21 章 <a class=\"ref\" href=\"#q-TH01\">TH01<\/a>—<a class=\"ref\" href=\"#q-TH22\">TH22<\/a>：从形状、投影、注意力、mask、多头、Norm/FFN 到 Block、完整小语言模型与 Encoder–Decoder；继续讲 loss、训练、生成、KV Cache、RoPE、GQA 和限时练习。核心段落提供逐行拆解。<\/li>\n<li>完整 PyTorch 实现、测试和安装运行说明；网页可以直接下载与磁盘一致的代码，不依赖当前打开的 HTML 所在目录。<\/li>\n<li>8 个新可视化：矩阵乘法、注意力、拆合头、Block 数据流、RoPE、KV Cache、CE/KL、LoRA。相关题内按需展开，可视化中心一次挂载一个演示。<\/li>\n<li>总计 21 个知识章节、341 题、135 条一手来源。旧题号、正文、入门和核心路线及复习进度格式保留；原订单互动仍可使用。<\/li>\n<\/ul>\n<h2>要求与证据<\/h2>\n<table>\n<thead>\n<tr>\n<th>用户要求<\/th>\n<th>实际证据<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>单独一章、手把手教手写 Transformer<\/td>\n<td>第 21 章 22 题，统一约定、前置解释、形状、代码、练习答案、逐行拆解、完整模型与训练循环<\/td>\n<\/tr>\n<tr>\n<td>代码能运行<\/td>\n<td>19 项 PyTorch 检查；16 个源码区间逐字对应正文；20 个文中 Python 块在完整模块依赖下执行<\/td>\n<\/tr>\n<tr>\n<td>更多算法可视化<\/td>\n<td>8 个独立演示；每种有参数变化或步骤/格子选择，并连接对应题号<\/td>\n<\/tr>\n<tr>\n<td>参考本地示例<\/td>\n<td>已读取指定实际目录下 5 份 HTML 的教学结构与交互实现；设计取舍写入“可视化与手写教学设计.md”<\/td>\n<\/tr>\n<tr>\n<td>参考“八股王优化大师”<\/td>\n<td>已读取该任务及当前性能优化说明；保留轻量目录、按题/深读加载、搜索缓存与批量展开取消<\/td>\n<\/tr>\n<tr>\n<td>页面不卡顿<\/td>\n<td>与优化后的 1.4 同条件测量，包含全题列表、搜索、Agent 页和可视化交互；报告保留绝对耗时与条件<\/td>\n<\/tr>\n<tr>\n<td>调研公开教程<\/td>\n<td>读取 Happy-LLM、LLMs-from-scratch、Hello-Agents、LLMGuide，并记录具体采用的教学组织方法与来源<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>检查记录<\/h2>\n<ul>\n<li>根目录验证脚本：基础 18、蒸馏 5、渲染 6、后训练/预训练 7、Agent 8、Transformer 19，共 63 项通过。<\/li>\n<li>Transformer 数值检查包括手写 Attention 的参考前向/梯度、有限差分、PyTorch MHA self/cross 对照、因果遮罩、padding、归一化、缓存分块等价和玩具学习。测试不只比形状。<\/li>\n<li>玩具循环学习运行 120 步，实际结果见 03_代码实验/Transformer手写运行结果.json；它只能证明小例子的训练链路可用。<\/li>\n<li>transformer-code-audit.json：正文源码区间一致性与代码块执行结果；有依赖的片段不是单独一段就完整运行的脚本，运行说明已写清。<\/li>\n<li>browser-qa.json：341 题页面及原专题、搜索、深读、进度、打印/展开恢复等回归；formula-qa.json：79 块公式在 4 档宽度下共 316 项显示检查。<\/li>\n<li>transformer-visual-qa.json：8 演示 × 4 档宽度，实际输入、选择、数值和显示检查；代码下载一致；默认不挂载演示、切走无残留面板；无自动 HTTP 请求与脚本错误。<\/li>\n<li>窄屏矩阵使用单独列宽规则和可滚动容器，不继承正文表格的 90px 最小列宽。视觉截图保存在 work/transformer-visual-revision/qa。<\/li>\n<li>content-audit.json、delivery-audit.json 和 final-manifest.json：新旧内容身份、完成要求对应、重复构建与最终文件哈希、副本一致性。<\/li>\n<\/ul>\n<h2>性能与范围<\/h2>\n<p>性能测试使用本机无界面 Edge、4 倍 CPU 降速、每场景 5 次独立上下文；路线报告中位数，交互报告采样最大值。不是冷磁盘缓存测试，也没有把模拟窄屏称为真实手机硬件测试。持续增长或修改后应重测，不承诺所有设备和未来版本都无卡顿。<\/p>\n<p>网页只计算小型示意数据；不执行 Python、不训练模型、不调用模型接口。Python 实验采用 CPU float32/float64。主线 LM 是 Pre-LN、可训练绝对位置、GELU 的教学版本；Encoder–Decoder 及独立现代部件的范围在正文中分别注明。没有将它们混称为某个现成大模型的完整复现。<\/p>\n<p>改版前版本保存在 work/transformer-visual-revision/修改前备份_1.4_含性能优化.zip。旧位置阅读器的最终同步以 delivery-audit.json 为准。<\/p>"}</script>
<script id="data-doc-dc090bebd39" type="application/json">{"html":"<h1>更新日志<\/h1>\n<h2>1.5 · 2026-09-16 · Transformer 手写与算法可视化<\/h2>\n<ul>\n<li>新增第 21 章 <a class=\"ref\" href=\"#q-TH01\">TH01<\/a>—<a class=\"ref\" href=\"#q-TH22\">TH22<\/a>，按形状、投影、注意力、mask、多头、Norm/FFN、Block、完整模型、loss、训练、生成与缓存逐步教学；附 RoPE、GQA 等独立部件和限时练习。全库为 21 章、341 题、135 条一手来源。<\/li>\n<li>配套从零编写的 PyTorch 实现，同时包含 Pre-LN 小语言模型和 Encoder–Decoder；主要章节增加逐行拆解。19 项新检查覆盖参考数值、梯度、因果性、padding、缓存等价与玩具学习；20 个文中代码块在完整模块依赖下实际执行。<\/li>\n<li>新增矩阵乘法、注意力、拆头、Block 数据流、RoPE、KV Cache、CE/KL、LoRA 共 8 个交互演示。题内默认折叠，可视化中心一次显示一个；无循环动画、模型调用和外部依赖。<\/li>\n<li>阅读“八股王优化大师”的优化记录并保留按题/深读加载和搜索缓存；对照用户目录的 5 份 HTML，以及 4 个公开课程/面试项目的组织方式，形成教学设计说明。<\/li>\n<li>原始模块与正文片段对应检查；修复链接检查将代码 <code>self.norms[0](x)<\/code> 误识别为本地链接的问题，新增相应回归。CPU 与转换检查累计 63 项。<\/li>\n<li>代码和说明嵌入阅读器，按需下载；换到原阅读器副本也不依赖相对路径找到 Python 文件。旧题号和进度格式保持兼容。<\/li>\n<li>页面检查与性能数据另记在 transformer-visual-qa.json，性能基线为已经优化过的 1.4。没有使用更早的慢版本来夸大新增可视化的效果。<\/li>\n<\/ul>\n<h2>阅读器性能优化 · 2026-09-15<\/h2>\n<ul>\n<li>将内嵌题库拆为轻量目录和逐条本地数据块，启动只解析目录；正文与文档按需解析一次并复用，清理已经解析的数据文本节点。<\/li>\n<li>折叠列表只创建标题，点击后加载题目正文，展开深读后再创建对应公式；长列表延后绘制屏幕外题目。<\/li>\n<li>搜索复用规范化文本，避免每个关键词重复转换全文；“展开全部”分批执行，收起或跳转会取消未完成的展开。<\/li>\n<li>保留单文件离线阅读、题号与路由、复习进度键和导入导出格式；打印前补齐尚未加载的正文。<\/li>\n<li>性能对比、数据一致性和回归结果见 performance-qa.json、browser-qa.json 与 formula-qa.json；优化前阅读器留在 work/reader-performance/before.html。<\/li>\n<\/ul>\n<h2>1.4 · 2026-09-15 · Agent 实战与前沿教程<\/h2>\n<ul>\n<li>新增第 20 章 <a class=\"ref\" href=\"#q-AG01\">AG01<\/a>—<a class=\"ref\" href=\"#q-AG36\">AG36<\/a>，与原 <a class=\"ref\" href=\"#q-A01\">A01<\/a>—<a class=\"ref\" href=\"#q-A14\">A14<\/a> 组成 Agent 50 题教程；全库为 20 章、319 题、127 条一手来源。按具体任务、白话直答、可展开追问组织。<\/li>\n<li>串起工具契约、MCP 与 A2A、程序化工具调用、上下文与记忆、Skills、长期任务和多 Agent 协作，再讲 Agent SFT/RL、蒸馏、评测与岗位项目。<\/li>\n<li>新增 <a class=\"ref\" href=\"#source-S104\">S104<\/a>—<a class=\"ref\" href=\"#source-S127\">S127<\/a> 共 24 条来源，核对 MCP 2026-07-28、A2A v1.0、Agent Lightning v1.0、MemSkill/TMEM/MindMemOS，以及 Terminal-Bench 4.0、2026-09 的 SWE-Bench Pro Verified 等。区分协议、工程方法、算法与评测，不按新旧自动排名。<\/li>\n<li>阅读器增加 Agent 50 题入口、12 题入门顺序，以及 3 种情景的订单执行互动演示。明确区分 Agent 可见信息与教学视角的后台状态。<\/li>\n<li>8 项新 CPU 检查覆盖工具参数与权限、超时前后恢复、重复执行、上下文压缩、记忆时效、预算停止和结果验收。演示限定为单进程模拟，不调用真实模型或订单服务。<\/li>\n<li>独立审读修正 A2A 首次回执丢失时可能没有 taskId、本地停止不等于远程取消、SFT 恢复轨迹需要一致上下文、rollout 优势基线与 loss 权重的区别，以及等奖励组相对目标的适用范围。<\/li>\n<li>43 项 CPU 与转换测试通过；319 题路由、50/12 题入口及互动演示检查通过；79 块公式在 4 档屏宽共 316 次检查通过。原题号、20 题新人路线、48 题口述路线及进度格式兼容。<\/li>\n<\/ul>\n<h2>1.3 · 2026-09-15 · OPD 家族、后训练进阶与预训练<\/h2>\n<ul>\n<li>本轮新增 38 题，全库为 19 章、283 题、103 条一手来源。继续采用“具体例子 → 白话直答 → 可展开公式、边界与追问”的结构。<\/li>\n<li>蒸馏专题扩展为 <a class=\"ref\" href=\"#q-KD01\">KD01<\/a>—<a class=\"ref\" href=\"#q-KD34\">KD34<\/a>；新增 OPD 的范式与局部梯度、OPSD 参考解自教师、MOPD 多领域专家、SDPO 环境反馈、EOPD 高熵监督和 2026-08 的 U-OPSD。<\/li>\n<li>对照用户 PDF 第 4、15 页的 OPSD/EOPD 条目；MOPD 另核对独立论文及 MiMo-V2-Flash 技术报告。区分原始背景、具体论文版本与教学建议。<\/li>\n<li>校正 EOPD v3 的目标：保留原 OPD 项，在高熵位置额外加入正向 KL；不是在两种 KL 之间直接切换。OPSD v3 的正向 KL 与词表项截断也单独注明。<\/li>\n<li>第 18 章 <a class=\"ref\" href=\"#q-HP01\">HP01<\/a>—<a class=\"ref\" href=\"#q-HP08\">HP08<\/a> 按训练瓶颈比较 DAPO、Dr. GRPO、GSPO、SAPO、GDPO、VESPO，并解释行为策略、教师、参考策略和当前策略的区别。<\/li>\n<li>第 19 章 <a class=\"ref\" href=\"#q-PT01\">PT01<\/a>—<a class=\"ref\" href=\"#q-PT20\">PT20<\/a> 串起训练目标、tokenizer、数据、DoReMi 配比、算力、优化、精度、训练恢复、长上下文、MTP、mid-training 与评测。<\/li>\n<li>增加 <a class=\"ref\" href=\"#source-S91\">S91<\/a>—<a class=\"ref\" href=\"#source-S103\">S103<\/a>；扩充来源编号解析，使 <a class=\"ref\" href=\"#source-S100\">S100<\/a> 等三位编号可定位、核查并在阅读器中跳转。<\/li>\n<li>阅读器新增 OPD 家族、后训练进阶、预训练入口；搜索可直接定位算法名。原 20 题入门路线、48 题口述路线和复习进度格式继续兼容。<\/li>\n<li>7 项新增 CPU 数值检查通过，覆盖固定上下文 OPD 梯度、GSPO 几何平均、SAPO 导数、GDPO 归一化、因果标签移位及 token 预算；含既有测试共 35 项通过。<\/li>\n<li>79 块公式在四种屏宽下共 316 次显示检查通过；283 题页面路由、专题入口、来源跳转、搜索和进度导入导出检查通过。补充实际截图审阅。<\/li>\n<\/ul>\n<h2>1.2 · 2026-09-15 · 公式检查与 Agent 蒸馏专题<\/h2>\n<ul>\n<li>新增第 17 章 <a class=\"ref\" href=\"#q-KD01\">KD01<\/a>—<a class=\"ref\" href=\"#q-KD24\">KD24<\/a>：软标签、温度与 T²、正反 KL、序列与推理蒸馏、DAgger、MiniLLM、GKD、Agent 轨迹、数据验证、异常恢复、成本与项目方案。<\/li>\n<li>区分 AgentTuning 的 AgentInstruct 数据集与微软 AgentInstruct 研究；纳入检索/代码工具蒸馏及 2026 年 SOD、SEED 预印本，注明版本和未复现边界。<\/li>\n<li>增加 <a class=\"ref\" href=\"#source-S79\">S79<\/a>—<a class=\"ref\" href=\"#source-S90\">S90<\/a> 共 12 条一手来源；全库为 17 章、245 题、90 条来源。原 20 题入门顺序、48 题口述表和进度格式继续兼容。<\/li>\n<li>14 处相邻独立等式拆分为各自的公式块；LoRA 矩阵维度和 DPO 概率差定义不再使用含糊的行尾反斜杠。<\/li>\n<li>修正双线体在原生 MathML 中退化成普通字母的问题：期望符号与实数集合显式转换为 𝔼、ℝ 等对应 Unicode 字符。<\/li>\n<li>公式共 64 块，覆盖四档屏宽下的转换、滚动端点和边界检查；增加全公式审阅图及转换回归检查。<\/li>\n<li>新增 5 项 CPU 蒸馏数值测试与 4 项公式转换测试；基础 18 项 CPU 测试继续通过。没有执行教师模型调用或 GPU 训练。<\/li>\n<li>阅读器顶部和导航新增“Agent 蒸馏 24 题”入口；首页题数与章节数改为随内容自动更新。<\/li>\n<\/ul>\n<h2>1.1 · 2026-09-15 · 新人讲解版<\/h2>\n<ul>\n<li>针对“抽象、缺少前置解释”的反馈，为全部 221 题增加场景、机制说明和重新组织的白话直答。<\/li>\n<li><a class=\"ref\" href=\"#q-M02\">M02<\/a> 改为完整红蓝球小课：单次负对数扣分 → 平均交叉熵 → 熵 → 额外扣分 KL → 最大似然，解释概率匹配时交叉熵仍可能大于零。<\/li>\n<li>数学、注意力、微调、偏好、强化学习、评测、检索、Agent、工程和驾驶章节均增加可复述的例子；保留原有公式与适用条件。<\/li>\n<li>新增 20 道新人阅读顺序和术语翻译小词表；明确岗位优先级与理解难度不同。<\/li>\n<li>阅读器默认显示入门讲解，深读区按题展开，支持完整阅读切换；原有题号、引用与复习进度格式兼容。<\/li>\n<li>通过数值复核、全题结构检查、浏览器交互检查与视觉抽查；本轮不增加大模型训练或论文复现声明。<\/li>\n<\/ul>\n<h2>1.0 · 2026-09-15<\/h2>\n<h3>内容<\/h3>\n<ul>\n<li>建立数学、结构、训练数据、SFT、偏好优化、在线 RL、蒸馏、安全、评测、RAG、Agent、服务、分布式、多模态、传统基线与手撕主线。<\/li>\n<li>按已有岗位背景整理项目深挖、系统设计和三场模拟面试。<\/li>\n<li>提供 7/14/30 天路线、48 道口述核心题与全部题目索引。<\/li>\n<\/ul>\n<h3>精度与版本处理<\/h3>\n<ul>\n<li><a class=\"ref\" href=\"#q-P08\">P08<\/a>/<a class=\"ref\" href=\"#q-P09\">P09<\/a> 明确 SimPO 的 β 与 γ，平均 log 概率阈值为 γ/β；长度归一不保证消除所有偏差。<\/li>\n<li><a class=\"ref\" href=\"#q-P06\">P06<\/a> 区分 DPO 方法依赖参考策略与实现必须常驻参考模型，补充参考概率预计算。<\/li>\n<li><a class=\"ref\" href=\"#q-P17\">P17<\/a>/<a class=\"ref\" href=\"#q-P18\">P18<\/a> 补齐 KTO 的 v3 效用公式、参考点实现和显式奖励模型训练，避免与二元交叉熵混同。<\/li>\n<li><a class=\"ref\" href=\"#q-RL07\">RL07<\/a>/<a class=\"ref\" href=\"#q-RL10\">RL10<\/a> 固定 TRL v0.24.0 文档例子，区分原始 GRPO、token 平均与常数归一；不把框架名当算法配置。<\/li>\n<li><a class=\"ref\" href=\"#q-E07\">E07<\/a>/<a class=\"ref\" href=\"#q-E08\">E08<\/a> 区分 pass@k 的至少一次成功与 pass^k 的重复可靠性。<\/li>\n<li><a class=\"ref\" href=\"#q-V08\">V08<\/a>/<a class=\"ref\" href=\"#q-V09\">V09<\/a> 明确原始 NAVSIM 的非反应式边界。<\/li>\n<li><a class=\"ref\" href=\"#source-S21\">S21<\/a>/<a class=\"ref\" href=\"#source-S46\">S46<\/a> 按检索到的作者原始标题登记 StrongREJECT 与 DriveDPO；<a class=\"ref\" href=\"#source-S24\">S24<\/a> 保留 SafeDialBench 的版本标题差异。<\/li>\n<li><a class=\"ref\" href=\"#source-S33\">S33<\/a> 区分 MemoryAgentBench 与早期 workshop 文稿的命名；不按背景报告自动断言会议状态。<\/li>\n<li>新研究聚焦 on-policy 自蒸馏、熵控制、IGPO 与 Agent RL 轨迹接口，结论保留任务与预算条件。<\/li>\n<\/ul>\n<h3>工具与验证<\/h3>\n<ul>\n<li>CPU 教学计算覆盖稳定 softmax、attention、LoRA、DPO/SimPO/KTO、GRPO/clip、pass@k、配对统计、RRF/KV 和幂等恢复。<\/li>\n<li>配套脚本生成离线检索阅读器、稳定题号、来源与索引，并检查结构和数学转换。<\/li>\n<li>\n<p>网络可达性与内容审查分开记录；最终验收另见“验收记录.md”。<\/p>\n<\/li>\n<li>\n<p>最终审查补齐 <a class=\"ref\" href=\"#q-P11\">P11<\/a> 口述答案、<a class=\"ref\" href=\"#q-RL10\">RL10<\/a> 手算追问、<a class=\"ref\" href=\"#q-T14\">T14<\/a>/<a class=\"ref\" href=\"#q-F08\">F08<\/a> 来源，交付可重跑浏览器检查和研究记录模板。<\/p>\n<\/li>\n<\/ul>"}</script>
<script id="data-doc-d9f6b9e2c79" type="application/json">{"html":"<h1>Transformer 手写与可视化设计依据<\/h1>\n<p>日期：2026-09-16。本轮以当前目录的优化版 1.4 为起点，没有使用旧的、一次性渲染全部正文的模板覆盖它。<\/p>\n<h2>用户参考材料实际看了什么<\/h2>\n<p>用户提供路径中的转义写法经目录检查，对应 <code>E:/1学习资料/阿里文档/HTML文档/模型hand_by_hand<\/code>。已阅读该目录 5 份 HTML 的教学结构、交互入口和实现：<\/p>\n<ul>\n<li>01_tokenize_embedding：用 token→位置→查表逐步讲输入；区分查表向量与后续隐藏状态。<\/li>\n<li>02_layer1_transformer：点击矩阵格子查看行乘列，开关因果遮罩和 softmax，按步骤追踪 Q/K/V 与输出。<\/li>\n<li>03_48_layers_depth：层级切换、形状追踪，并区分示意曲线与真实模型数据。<\/li>\n<li>04_gpu_deployment：参数变化驱动资源计算与布局，强调数值约束。<\/li>\n<li>05_training_internals：按前向、loss、反向、累积和更新讲完整链路。<\/li>\n<\/ul>\n<p>采用的教学方法是“可操作的小例子、参数变化后重新计算、逐步连接代码”。本库重新编写了小型数值演示，没有复制参考页的模型配置、真实权重声称、遥测脚本或外部资源依赖。<\/p>\n<h2>阅读了哪些公开教程<\/h2>\n<table>\n<thead>\n<tr>\n<th>一手项目<\/th>\n<th>观察到的组织方式<\/th>\n<th>本轮采用的具体做法<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"https://github.com/datawhalechina/happy-llm\">Happy-LLM<\/a><\/td>\n<td>基础原理衔接架构与代码实现<\/td>\n<td>先补形状与前置操作，再拼完整模型<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://github.com/rasbt/LLMs-from-scratch\">LLMs-from-scratch<\/a><\/td>\n<td>注意力、GPT、训练分章，附代码与练习<\/td>\n<td>部件单测、完整可运行实现、学习后检查生成<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://github.com/datawhalechina/hello-agents\">Hello-Agents<\/a><\/td>\n<td>从基础循环走向工具、记忆与项目<\/td>\n<td>保留“观察、操作、验证”的闭环，连接既有 Agent 教程<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://github.com/Meko1/llm-interview-guide\">LLMGuide<\/a><\/td>\n<td>基础直觉、问答、连续追问与手写练习入口<\/td>\n<td>每节给可回答的追问，最后做限时手写路线<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>上述是本次读取时的组织方式观察，不是对仓库全部内容的正确性认证，也不是关于公司面试频率的统计。课程采用原创示例与实现，算法事实使用原论文、固定版本的 PyTorch 官方文档和数值验证。来源 <a class=\"ref\" href=\"#source-S128\">S128<\/a>—<a class=\"ref\" href=\"#source-S135\">S135<\/a> 登记本次接口与教学参考。<\/p>\n<h2>新增 8 个可视化<\/h2>\n<table>\n<thead>\n<tr>\n<th>演示<\/th>\n<th>可以操作什么<\/th>\n<th>真正理解什么<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>矩阵投影<\/td>\n<td>点输出格子<\/td>\n<td>输入一行与权重一列怎样贡献结果<\/td>\n<\/tr>\n<tr>\n<td>注意力<\/td>\n<td>换示意头、开关遮罩和缩放、切分数/权重<\/td>\n<td>打分→归一化→加权内容；未来遮罩的作用<\/td>\n<\/tr>\n<tr>\n<td>拆头与合头<\/td>\n<td>切换 1/2/4 头<\/td>\n<td>数字顺序和轴语义，比只记 shape 更具体<\/td>\n<\/tr>\n<tr>\n<td>Block 数据流<\/td>\n<td>在 7 个步骤间移动<\/td>\n<td>归一化、注意力、残差、FFN 与最终预测如何连接<\/td>\n<\/tr>\n<tr>\n<td>RoPE<\/td>\n<td>改 Q/K 位置及频率<\/td>\n<td>范数保持与点积里的相对位置<\/td>\n<\/tr>\n<tr>\n<td>KV Cache<\/td>\n<td>增加解码步数<\/td>\n<td>缓存占用与省去的重复计算；新 Q 仍读全部 K<\/td>\n<\/tr>\n<tr>\n<td>交叉熵/KL<\/td>\n<td>改真实概率与预测概率<\/td>\n<td>熵、平均扣分与额外扣分的区别<\/td>\n<\/tr>\n<tr>\n<td>LoRA<\/td>\n<td>改秩和缩放<\/td>\n<td>冻结主路加小旁路；秩不够小时不一定省参数<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>均为有明确边界的教学模型：矩阵与概率直接计算；结构图只显示形状；缓存格数不能等同真实速度；二维旋转只展示一个通道对。<\/p>\n<h2>如何保留流畅性<\/h2>\n<ul>\n<li>保留轻量题目目录、按记录解析、正文/深读延迟挂载、搜索文本缓存和批量展开取消。<\/li>\n<li>题目中的演示默认折叠，第一次主动展开才创建表格与控件；“展开全部题目”不会自动打开所有演示。<\/li>\n<li>可视化中心一次只挂载 1 个演示，切换后旧节点和节点事件随页面释放。<\/li>\n<li>只在用户改变输入时同步重算小数据；没有循环动画、持续定时器、全局 ResizeObserver 或网络请求。<\/li>\n<li>代码下载按需解析嵌入资源，保持原目录副本和当前目录都能离线取得一致代码。<\/li>\n<li>维护文件 reader_visuals.js / reader_visuals.css 在构建时合并入单文件 HTML，没有要求用户启动服务。<\/li>\n<\/ul>\n<p>实测与上一版优化后的文件比较，结果写入 transformer-visual-qa.json。它包含四档页面宽度、交互检查及 4 倍 CPU 降速下的显示和交互测量；这比仅宣称“用懒加载所以不会卡”更可核查。具体测试条件及限制保留在报告中。<\/p>"}</script>
<script id="data-doc-index" type="application/json">{"html":"<h1>全部题目索引<\/h1>\n<p>共 341 题；按固定题号维护。P0/P1/P2 是岗位优先级，不是实际公司题频。<\/p>\n<table>\n<thead>\n<tr>\n<th>题号<\/th>\n<th>问题<\/th>\n<th>优先级<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>M01<\/td>\n<td><a href=\"#q-M01\">语言模型到底在学什么？<\/a><\/td>\n<td>P0<\/td>\n<\/tr>\n<tr>\n<td>M02<\/td>\n<td><a href=\"#q-M02\">交叉熵、KL、最大似然是什么关系？<\/a><\/td>\n<td>P0<\/td>\n<\/tr>\n<tr>\n<td>M03<\/td>\n<td><a href=\"#q-M03\">前向 KL 与反向 KL 为什么表现不同？<\/a><\/td>\n<td>P0<\/td>\n<\/tr>\n<tr>\n<td>M04<\/td>\n<td><a href=\"#q-M04\">softmax 为什么要减去最大值？<\/a><\/td>\n<td>P0<\/td>\n<\/tr>\n<tr>\n<td>M05<\/td>\n<td><a href=\"#q-M05\">交叉熵对 logits 的梯度为什么是 p−y？<\/a><\/td>\n<td>P0<\/td>\n<\/tr>\n<tr>\n<td>M06<\/td>\n<td><a href=\"#q-M06\">困惑度 PPL 是什么，为什么不能跨 tokenizer 乱比？<\/a><\/td>\n<td>P0<\/td>\n<\/tr>\n<tr>\n<td>M07<\/td>\n<td><a href=\"#q-M07\">Adam、AdamW 与学习率怎么解释？<\/a><\/td>\n<td>P0<\/td>\n<\/tr>\n<tr>\n<td>M08<\/td>\n<td><a href=\"#q-M08\">梯度裁剪、梯度累积与大 batch 有什么差别？<\/a><\/td>\n<td>P0<\/td>\n<\/tr>\n<tr>\n<td>M09<\/td>\n<td><a href=\"#q-M09\">熵、温度和多样性是一回事吗？<\/a><\/td>\n<td>P0<\/td>\n<\/tr>\n<tr>\n<td>M10<\/td>\n<td><a href=\"#q-M10\">MLE、MAP 与正则化有什么关系？<\/a><\/td>\n<td>P1<\/td>\n<\/tr>\n<tr>\n<td>M11<\/td>\n<td><a href=\"#q-M11\">重要性采样与 on-policy/off-policy 是什么？<\/a><\/td>\n<td>P0<\/td>\n<\/tr>\n<tr>\n<td>M12<\/td>\n<td><a href=\"#q-M12\">偏差、方差、置信区间分别回答什么？<\/a><\/td>\n<td>P0<\/td>\n<\/tr>\n<tr>\n<td>T01<\/td>\n<td><a href=\"#q-T01\">Self-Attention 的 Q、K、V 是什么？<\/a><\/td>\n<td>P0<\/td>\n<\/tr>\n<tr>\n<td>T02<\/td>\n<td><a href=\"#q-T02\">为什么除以 √d_k？<\/a><\/td>\n<td>P0<\/td>\n<\/tr>\n<tr>\n<td>T03<\/td>\n<td><a href=\"#q-T03\">多头注意力解决什么问题？<\/a><\/td>\n<td>P0<\/td>\n<\/tr>\n<tr>\n<td>T04<\/td>\n<td><a href=\"#q-T04\">MHA、MQA、GQA 怎么比较？<\/a><\/td>\n<td>P0<\/td>\n<\/tr>\n<tr>\n<td>T05<\/td>\n<td><a href=\"#q-T05\">因果 mask、padding mask、loss mask 有何区别？<\/a><\/td>\n<td>P0<\/td>\n<\/tr>\n<tr>\n<td>T06<\/td>\n<td><a href=\"#q-T06\">RoPE 为什么有相对位置信息？<\/a><\/td>\n<td>P0<\ d>P0<\/td>\n<\/tr>\n<tr>\n<td>C02<\/td>\n<td><a href=\"#q-C02\">设计一个航空三知识库问答系统<\/a><\/td>\n<td>P0<\/td>\n<\/tr>\n<tr>\n<td>C03<\/td>\n<td><a href=\"#q-C03\">设计一个可以处理退改签的 Agent<\/a><\/td>\n<td>P0<\/td>\n<\/tr>\n<tr>\n<td>C04<\/td>\n<td><a href=\"#q-C04\">设计 DPO/KTO/SimPO 对照实验<\/a><\/td>\n<td>P0<\/td>\n<\/tr>\n<tr>\n<td>C05<\/td>\n<td><a href=\"#q-C05\">设计一个低预算 RLVR 复现<\/a><\/td>\n<td>P1<\/td>\n<\/tr>\n<tr>\n<td>C06<\/td>\n<td><a href=\"#q-C06\">设计模型评测与版本回归平台<\/a><\/td>\n<td>P0<\/td>\n<\/tr>\n<tr>\n<td>C07<\/td>\n<td><a href=\"#q-C07\">设计一个满足延迟预算的推理服务<\/a><\/td>\n<td>P1<\/td>\n<\/tr>\n<tr>\n<td>C08<\/td>\n<td><a href=\"#q-C08\">设计驾驶 VLM 可靠性评测<\/a><\/td>\n<td>P0<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}</script>
<script id="data-doc-core-guide" type="application/json">{"html":"<h1>48 道口述核心题<\/h1>\n<p>这份清单由正文生成；先闭卷回答，再跳转原题接受追问。<\/p>\n<h2>M01 · 语言模型到底在学什么？<\/h2>\n<p>语言模型学习根据前文预测下一个 token；生成时不断把预测接到前文，逐步写成完整回答。它认为某句话“容易出现”，并不等于这句话一定真实。<\/p>\n<p><a href=\"#q-M01\">展开与追问<\/a><\/p>\n<h2>M02 · 交叉熵、KL、最大似然是什么关系？<\/h2>\n<p>交叉熵是模型对实际结果的平均扣分；KL 是其中因预测概率不匹配而产生的额外扣分。真实分布固定时，它自身的熵不变，所以降低交叉熵也就在降低 KL。最大似然则从“让观察到的数据更可能出现”的角度表达同一训练目标。<\/p>\n<p><a href=\"#q-M02\">展开与追问<\/a><\/p>\n<h2>M03 · 前向 KL 与反向 KL 为什么表现不同？<\/h2>\n<p>KL 的方向决定按谁的概率来算平均、重点惩罚哪种不匹配。先写清教师和学生分别在哪边，再讨论覆盖多种答案还是集中回答；不要把这些倾向背成无条件定律。<\/p>\n<p><a href=\"#q-M03\">展开与追问<\/a><\/p>\n<h2>M05 · 交叉熵对 logits 的梯度为什么是 p−y？<\/h2>\n<p>softmax 配合交叉熵时，对输出分数的梯度是“预测概率减标签”。正确类得到负梯度、其他类得到正梯度，因此梯度下降会在输出分数这一层提高正确类、压低其他类。<\/p>\n<p><a href=\"#q-M05\">展开与追问<\/a><\/p>\n<h2>T01 · Self-Attention 的 Q、K、V 是什么？<\/h2>\n<p>自注意力让一个位置按相关程度汇总其他位置的信息。Q 用来查询，K 用来匹配，V 提供被汇总的内容，这三者都由模型学习得到。<\/p>\n<p><a href=\"#q-T01\">展开与追问<\/a><\/p>\n<h2>T02 · 为什么除以 √d_k？<\/h2>\n<p>除以 √d_k 主要是控制匹配分数的尺度，避免维度变大时 softmax 过早变得极端。它是在常见方差假设下的缩放，不是让每个向量长度都等于 1。<\/p>\n<p><a href=\"#q-T02\">展开与追问<\/a><\/p>\n<h2>T04 · MHA、MQA、GQA 怎么比较？<\/h2>\n<p>MHA、MQA、GQA 的主要差别是 K/V 是否共享、共享到什么程度。共享通常能减少生成时的缓存，但质量和速度要结合具体模型与实现比较。<\/p>\n<p><a href=\"#q-T04\">展开与追问<\/a><\/p>\n<h2>T05 · 因果 mask、padding mask、loss mask 有何区别？<\/h2>\n<p>因果遮罩限制看未来，填充遮罩排除无效填充，损失遮罩决定哪些位置参与训练评分；三者不能互相替代。<\/p>\n<p><a href=\"#q-T05\">展开与追问<\/a><\/p>\n<h2>T06 · RoPE 为什么有相对位置信息？<\/h2>\n<p>RoPE 根据位置旋转 Q、K，让它们的匹配计算包含相对位置差。它给注意力加入顺序线索，但不自动保证任意长文本都能处理好。<\/p>\n<p><a href=\"#q-T06\">展开与追问<\/a><\/p>\n<h2>T14 · FlashAttention 为什么“精确”却更省显存？<\/h2>\n<p>FlashAttention 通过分块计算和在线归一化，避免完整存下巨大中间表，减少显存读写；它保持稠密注意力的数学目标。<\/p>\n<p><a href=\"#q-T14\">展开与追问<\/a><\/p>\n<h2>SFT01 · SFT 的目标和训练样本长什么样？<\/h2>\n<p>SFT 是用输入和示范输出训练生成模型，让它更容易按要求写出类似的回答；数据格式和哪些位置计分非常关键。<\/p>\n<p><a href=\"#q-SFT01\">展开与追问<\/a><\/p>\n<h2>SFT03 · LoRA 的公式、参数量与初始化怎么推？<\/h2>\n<p>LoRA 用两个小矩阵的乘积表示大矩阵的更新量，冻结原权重，只训练小矩阵，从而减少可训练参数和相关训练开销。<\/p>\n<p><a href=\"#q-SFT03\">展开与追问<\/a><\/p>\n<h2>P03 · DPO 是怎么从 KL 约束目标推出来的？<\/h2>\n<p>DPO 从“提高奖励，同时惩罚偏离参考策略”出发，先求理想策略与奖励的关系，再把奖励改写成模型概率比，转成直接可训练的偏好损失。<\/p>\n<p><a href=\"#q-P03\">展开与追问<\/a><\/p>\n<h2>P04 · DPO 损失怎么写，为什么 Z 消失？<\/h2>\n<p>DPO 比较当前模型与参考模型各自对同题两个回答的概率差，再推动较优回答在这个相对比较中占优势；共享的归一化项因相减而消失。<\/p>\n<p><a href=\"#q-P04\">展开与追问<\/a><\/p>\n<h2>P05 · DPO 梯度在推动什么？<\/h2>\n<p>DPO 梯度推动较优与较差回答的相对 log 概率差增大；损失改善不保证每个好回答的绝对概率都逐步上升，需要联合检查生成结果。<\/p>\n<p><a href=\"#q-P05\">展开与追问<\/a><\/p>\n<h2>P06 · DPO 的参考模型究竟有什么用？<\/h2>\n<p>参考模型提供固定的概率基准，让偏好优化具有相对原策略的约束含义。是否额外占用整份模型显存，要看预计算和参数共享等实现。<\/p>\n<p><a href=\"#q-P06\">展开与追问<\/a><\/p>\n<h2>P08 · SimPO 的完整公式是什么？<\/h2>\n<p>SimPO 直接比较好坏回答的平均 log 概率，并加入目标间隔；它不需要参考模型，但平均分仍只是训练信号，不能当成答案正确性的直接评分。<\/p>\n<p><a href=\"#q-P08\">展开与追问<\/a><\/p>\n<h2>P10 · KTO 适合什么反馈，和分类器有什么区别？<\/h2>\n<p>KTO 利用单个回答的好坏标签优化生成倾向，不要求每条都有同题偏好对；标签含义与数据比例仍需仔细处理。<\/p>\n<p><a href=\"#q-P10\">展开与追问<\/a><\/p>\n<h2>P11 · DPO、SimPO、KTO、PPO/GRPO 怎么选？<\/h2>\n<p>先看反馈是示范、成对偏好、单条标签还是可验证结果，再选训练方法；别先选热门算法，再勉强凑它需要的数据。<\/p>\n<p><a href=\"#q-P11\">展开与追问<\/a><\/p>\n<h2>P12 · 如何构造有价值的 rejected？<\/h2>\n<p>rejected 应揭示模型真实、可判断的短板；兼顾代表性和标签可靠性，避免只用明显垃圾或高度争议的回答。<\/p>\n<p><a href=\"#q-P12\">展开与追问<\/a><\/p>\n<h2>RL04 · PPO clip 目标如何解释正负优势？<\/h2>\n<p>PPO 用优势决定鼓励还是抑制某些选择，再通过新旧概率比的裁剪限制过大的优化激励，帮助控制单次更新幅度。<\/p>\n<p><a href=\"#q-RL04\">展开与追问<\/a><\/p>\n<h2>RL06 · GRPO 最核心的变化是什么？<\/h2>\n<p>GRPO 对同题多次生成的结果做组内比较，用相对奖励构造优势，再优化生成概率，减少对独立 critic 的依赖。<\/p>\n<p><a href=\"#q-RL06\">展开与追问<\/a><\/p>\n<h2>RL08 · 组内奖励全相同会怎样？<\/h2>\n<p>同组奖励全相同时，常见组内中心化得到零优势，偏好方向的学习信号消失；需要检查题目难度、生成覆盖和奖励区分度。<\/p>\n<p><a href=\"#q-RL08\">展开与追问<\/a><\/p>\n<h2>RL12 · RLVR 与 reward hacking 是什么？<\/h2>\n<p>RLVR 利用可验证结果提供训练奖励；验证器需要检查真实任务要求，否则优化会放大奖励规则的漏洞。<\/p>\n<p><a href=\"#q-RL12\">展开与追问<\/a><\/p>\n<h2>SA01 · 内容分类、生成安全、拒答检测怎么区分？<\/h2>\n<p>三者评价对象不同：内容是什么、生成是否合规、有没有拒答。拒答是行为之一，不等于安全本身。<\/p>\n<p><a href=\"#q-SA01\">展开与追问<\/a><\/p>\n<h2>SA02 · 漏放与误拒为什么要联合评估？<\/h2>\n<p>安全系统要同时控制漏放和误拒，在真实业务代价下选择平衡；单看某一侧可以被极端策略“做漂亮”。<\/p>\n<p><a href=\"#q-SA02\">展开与追问<\/a><\/p>\n<h2>SA05 · 为什么多轮安全比单轮难？<\/h2>\n<p>多轮安全依赖整个对话中的意图和信息联系；评测要覆盖跨轮累积、上下文截断和多次尝试。<\/p>\n<p><a href=\"#q-SA05\">展开与追问<\/a><\/p>\n<h2>SA06 · 越狱攻击成功率应该怎样定义？<\/h2>\n<p>攻击成功率必须说明目标、成功规则、尝试次数和分母；不同预算与统计单位下的数字不能混比。<\/p>\n<p><a href=\"#q-SA06\">展开与追问<\/a><\/p>\n<h2>SA12 · “精确率 79%→96%”面试怎么讲可信？<\/h2>\n<p>先解释 precision 的分母和比较条件，再用召回、误拒及对照说明收益；79% 到 96% 是增加 17 个百分点。<\/p>\n<p><a href=\"#q-SA12\">展开与追问<\/a><\/p>\n<h2>E01 · Precision、Recall、F1 怎么解释？<\/h2>\n<p>精确率以判为正的结果为分母，召回率以真正的正例为分母；F1 综合两者，实际使用还要说明什么算正类。<\/p>\n<p><a href=\"#q-E01\">展开与追问<\/a><\/p>\n<h2>E05 · 两个模型差 1 个百分点显著吗？<\/h2>\n<p>分数差要结合成对样本、抽样不确定性和实际价值判断；“高了 1 个百分点”本身不够说明提升可靠。<\/p>\n<p><a href=\"#q-E05\">展开与追问<\/a><\/p>\n<h2>E07 · pass@k 是什么，怎么估计？<\/h2>\n<p>pass@k 关注 k 次尝试中至少有一次成功的能力，必须说明采样与评分条件，并计入额外尝试成本。<\/p>\n<p><a href=\"#q-E07\">展开与追问<\/a><\/p>\n<h2>E08 · pass@k 与 τ-bench 的 pass^k 有什么不同？<\/h2>\n<p>pass@k 强调多次尝试的成功覆盖，pass^k 强调重复成功的可靠性；符号相近，考查目标相反，不能混用。<\/p>\n<p><a href=\"#q-E08\">展开与追问<\/a><\/p>\n<h2>E09 · LLM-as-a-Judge 怎么校准？<\/h2>\n<p>模型评审需要人工基准、偏差检查和持续抽查；评审分数是需要验证的测量工具，不是天然正确的真值。<\/p>\n<p><a href=\"#q-E09\">展开与追问<\/a><\/p>\n<h2>R01 · RAG、长上下文、微调和工具怎么选？<\/h2>\n<p>根据缺的是知识、上下文容量、行为习惯还是执行能力，选择检索、长输入、微调或工具，并考虑更新频率和成本。<\/p>\n<p><a href=\"#q-R01\">展开与追问<\/a><\/p>\n<h2>R04 · 稀疏检索、稠密检索为什么互补？<\/h2>\n<p>稀疏检索重视词项匹配，稠密检索重视学习到的语义相似；两者的强弱随任务不同，混合要通过证据召回验证。<\/p>\n<p><a href=\"#q-R04\">展开与追问<\/a><\/p>\n<h2>R06 · Bi-encoder 与 Cross-encoder 如何分工？<\/h2>\n<p>双编码器适合大规模快速召回，交叉编码器适合小候选集精排；分工来自速度与细粒度匹配的取舍。<\/p>\n<p><a href=\"#q-R06\">展开与追问<\/a><\/p>\n<h2>R09 · 三知识库路由如何设计和评测？<\/h2>\n<p>按问题的信息需求决定单库或跨库检索，测试路由错误、证据完整性和资源代价，避免把多库简单串在一起。<\/p>\n<p><a href=\"#q-R09\">展开与追问<\/a><\/p>\n<h2>R11 · Faithfulness、正确性、完整性、引用精度怎么区分？<\/h2>\n<p>忠实性、正确性、完整性和引用支持度分别回答不同问题，不能用“带引用”直接证明答案可靠。<\/p>\n<p><a href=\"#q-R11\">展开与追问<\/a><\/p>\n<h2>R14 · RAG 变差如何快速归因？<\/h2>\n<p>沿解析、索引、召回、重排、生成逐层检查，用正确证据替换实验定位瓶颈，再做针对性修复。<\/p>\n<p><a href=\"#q-R14\">展开与追问<\/a><\/p>\n<h2>A03 · 工具调用的 JSON 正确就算成功吗？<\/h2>\n<p>工具调用要依次验证格式、参数含义、权限、执行结果和最终状态；格式通过只是第一关。<\/p>\n<p><a href=\"#q-A03\">展开与追问<\/a><\/p>\n<h2>A05 · 工具超时与失败如何恢复？<\/h2>\n<p>超时后先判断执行状态是否未知，查询并核对业务结果；涉及写入时不能把所有失败都当作可直接重试。<\/p>\n<p><a href=\"#q-A05\">展开与追问<\/a><\/p>\n<h2>A07 · Agent 任务成功率怎么定义？<\/h2>\n<p>用可核验的最终业务状态和约束定义成功，把对话质量与任务实际完成分别评分。<\/p>\n<p><a href=\"#q-A07\">展开与追问<\/a><\/p>\n<h2>A09 · 记忆与长上下文的本质差别是什么？<\/h2>\n<p>两者分别扩展当前可见材料和跨任务持久信息；外部记忆还需要写入、检索、冲突与生命周期管理。<\/p>\n<p><a href=\"#q-A09\">展开与追问<\/a><\/p>\n<h2>I03 · KV cache 显存如何手算？<\/h2>\n<p>KV 显存按“保存两份什么形状的张量”逐维相乘；明确层数、K/V 头数、维度、长度、批量和精度，再检查特殊结构与额外开销。<\/p>\n<p><a href=\"#q-I03\">展开与追问<\/a><\/p>\n<h2>I10 · TTFT、TPOT、吞吐与 p95 如何解释？<\/h2>\n<p>首字等待、后续生成速度、整体吞吐和尾部延迟是不同体验与效率指标，要分开报告。<\/p>\n<p><a href=\"#q-I10\">展开与追问<\/a><\/p>\n<h2>V03 · 视觉 grounding 是什么，怎么测？<\/h2>\n<p>grounding 是语言判断与实际视觉证据的对应关系，应用定位和受控图像干预验证，不能只看答案是否听起来合理。<\/p>\n<p><a href=\"#q-V03\">展开与追问<\/a><\/p>\n<h2>V08 · 开环和闭环评测差别在哪里？<\/h2>\n<p>开环主要检查给定观测下的输出，闭环检查动作改变环境后的连续行为；二者能证明的可靠性范围不同。<\/p>\n<p><a href=\"#q-V08\">展开与追问<\/a><\/p>"}</script>
<script id="code-assets" type="application/json">{"transformer_handwrite.py":"\"\"\"从零拼出 Transformer 的 CPU 教学实现。运行本文件可做一次小规模学习实验。\n\n不使用 nn.Transformer / nn.MultiheadAttention 隐藏核心步骤。\n统一张量顺序 [batch, tokens, channels]；allowed=True 表示可以关注。\n各 # region 区间与第 21 章逐节对应。性能优化不是本实现的目的。\n\"\"\"\nimport math\nimport json\nimport torch\nfrom torch import nn\nfrom torch.nn import functional as F\n\n\n# region shapes\ndef split_heads(x, heads):\n    batch, tokens, channels = x.shape\n    if channels % heads:\n        raise ValueError(\"channels 必须能被 heads 整除\")\n    # reshape 只拆最后一维；transpose 才把头移到前面。\n    return x.reshape(batch, tokens, heads, channels // heads).transpose(1, 2)\n\n\ndef merge_heads(x):\n    batch, heads, tokens, width = x.shape\n    return x.transpose(1, 2).contiguous().view(batch, tokens, heads * width)\n# endregion shapes\n\n\n# region attention\ndef attention(q, k, v, allowed=None, dropout_p=0.0, training=False):\n    # q: [B,H,Tq,Dh]；k/v: [B,H,Tk,Dh]（v 的末维也可不同）\n    scores = q @ k.transpose(-2, -1) / math.sqrt(q.size(-1))\n    if allowed is not None:\n        if allowed.dtype != torch.bool:\n            raise TypeError(\"本教程只接受 bool mask；True = 可以看\")\n        allowed = torch.broadcast_to(allowed, scores.shape)\n        if not allowed.any(dim=-1).all():\n            raise ValueError(\"存在完全看不到任何 key 的行；请检查 padding/mask\")\n        scores = scores.masked_fill(~allowed, float(\"-inf\"))\n    weights = torch.softmax(scores, dim=-1)  # 沿 key 轴分配权重\n    used = F.dropout(weights, p=dropout_p, training=training)\n    return used @ v, weights  # 返回 dropout 前权重，便于教学验算行和\n# endregion attention\n\n\n# region masks\ndef causal_allowed(query_len, key_len, past_len=0, device=None):\n    # 缓存后 query 的绝对位置从 past_len 开始。\n    query_pos = past_len + torch.arange(query_len, device=device)\n    key_pos = torch.arange(key_len, device=device)\n    return key_pos[None, :] <= query_pos[:, None]\n\n\ndef padding_allowed(valid_keys):\n    # valid_keys: [B,Tk]；扩展后能广播到 [B,H,Tq,Tk]。\n    return valid_keys[:, None, None, :]\n# endregion masks\n\n\n# region mha\nclass MultiHeadAttention(nn.Module):\n    def __init__(self, d_model, heads, dropout=0.0):\n        super().__init__()\n        if d_model % heads:\n            raise ValueError(\"d_model 必须能被 heads 整除\")\n        self.heads, self.dropout = heads, dropout\n        self.q_proj = nn.Linear(d_model, d_model)\n        self.k_proj = nn.Linear(d_model, d_model)\n        self.v_proj = nn.Linear(d_model, d_model)\n        self.out_proj = nn.Linear(d_model, d_model)\n\n    def forward(self, x, context=None, allowed=None, causal=False,\n                cache=None, use_cache=False):\n        if context is not None and (cache is not None or use_cache):\n            raise ValueError(\"这个教学缓存仅支持 self-attention\")\n        source = x if context is None else context\n        q = split_heads(self.q_proj(x), self.heads)\n        k = split_heads(self.k_proj(source), self.heads)\n        v = split_heads(self.v_proj(source), self.heads)\n        past = 0\n        if cache is not None:\n            past = cache[0].size(-2)\n            k = torch.cat([cache[0], k], dim=-2)\n            v = torch.cat([cache[1], v], dim=-2)\n        if causal:\n            causal_mask = causal_allowed(q.size(-2), k.size(-2), past, x.device)\n            allowed = causal_mask if allowed is None else allowed & causal_mask\n        y, weights = attention(q, k, v, allowed, self.dropout, self.training)\n        y = self.out_proj(merge_heads(y))\n        return y, weights, (k, v) if use_cache else None\n# endregion mha\n\n\n# region norm\nclass LayerNorm(nn.Module):\n    def __init__(self, width, eps=1e-5):\n        super().__init__()\n        self.weight = nn.Parameter(torch.ones(width))\n        self.bias = nn.Parameter(torch.zeros(width))\n        self.eps = eps\n\n    def forward(self, x):\n        mean = x.mean(dim=-1, keepdim=True)\n        variance = (x - mean).square().mean(dim=-1, keepdim=True)\n        return (x - mean) * torch.rsqrt(variance + self.eps) * self.weight + self.bias\n\n\nclass RMSNorm(nn.Module):\n    def __init__(self, width, eps=1e-6):\n        super().__init__()\n        self.weight = nn.Parameter(torch.ones(width))\n        self.eps = eps\n\n    def forward(self, x):\n        return x * torch.rsqrt(x.square().mean(-1, keepdim=True) + self.eps) * self.weight\n# endregion norm\n\n\n# region ffn\nclass FeedForward(nn.Module):\n    def __init__(self, width, hidden):\n        super().__init__()\n        self.up = nn.Linear(width, hidden)\n        self.down = nn.Linear(hidden, width)\n\n    def forward(self, x):\n        return self.down(F.gelu(self.up(x)))\n\n\nclass SwiGLU(nn.Module):\n    def __init__(self, width, hidden):\n        super().__init__()\n        self.gate = nn.Linear(width, hidden, bias=False)\n        self.up = nn.Linear(width, hidden, bias=False)\n        self.down = nn.Linear(hidden, width, bias=False)\n\n    def forward(self, x):\n        return self.down(F.silu(self.gate(x)) * self.up(x))\n# endregion ffn\n\n\n# region positions\ndef sinusoidal_positions(length, width, device=None):\n    if width % 2:\n        raise ValueError(\"这个简化正弦实现要求 width 为偶数\")\n    pos = torch.arange(length, device=device).float()[:, None]\n    freq = torch.exp(torch.arange(0, width, 2, device=device).float()\n                     * (-math.log(10000.0) / width))\n    pe = torch.zeros(length, width, device=device)\n    pe[:, 0::2], pe[:, 1::2] = torch.sin(pos * freq), torch.cos(pos * freq)\n    return pe  # [T,D]，可广播加到 [B,T,D]\n# endregion positions\n\n\n# region block\nclass TransformerBlock(nn.Module):\n    \"\"\"Pre-LN：先归一化再进子层；不同于原始论文的 Post-LN 布局。\"\"\"\n    def __init__(self, width, heads, hidden, dropout=0.0):\n        super().__init__()\n        self.norm1, self.norm2 = LayerNorm(width), LayerNorm(width)\n        self.attn = MultiHeadAttention(width, heads, dropout)\n        self.ffn = FeedForward(width, hidden)\n        self.drop = nn.Dropout(dropout)\n\n    def forward(self, x, allowed=None, causal=False, cache=None, use_cache=False):\n        update, _, new_cache = self.attn(self.norm1(x), allowed=allowed,\n                                         causal=causal, cache=cache, use_cache=use_cache)\n        x = x + self.drop(update)\n        x = x + self.drop(self.ffn(self.norm2(x)))\n        return x, new_cache\n# endregion block\n\n\n# region decoder\nclass DecoderBlock(nn.Module):\n    \"\"\"翻译式 decoder：因果 self-attention → cross-attention → FFN。\"\"\"\n    def __init__(self, width, heads, hidden):\n        super().__init__()\n        self.norms = nn.ModuleList([LayerNorm(width) for _ in range(3)])\n        self.self_attn = MultiHeadAttention(width, heads)\n        self.cross_attn = MultiHeadAttention(width, heads)\n        self.ffn = FeedForward(width, hidden)\n\n    def forward(self, x, memory, source_valid=None, target_valid=None):\n        target_mask = None if target_valid is None else padding_allowed(target_valid)\n        update, _, _ = self.self_attn(self.norms[0](x), allowed=target_mask, causal=True)\n        x = x + update\n        source_mask = None if source_valid is None else padding_allowed(source_valid)\n        update, _, _ = self.cross_attn(self.norms[1](x), context=memory, allowed=source_mask)\n        x = x + update\n        return x + self.ffn(self.norms[2](x))\n# endregion decoder\n\n\n# region lm\nclass TinyLanguageModel(nn.Module):\n    def __init__(self, vocab_size=8, width=24, heads=3, layers=2, max_len=64):\n        super().__init__()\n        self.token_emb = nn.Embedding(vocab_size, width)\n        self.pos_emb = nn.Embedding(max_len, width)\n        self.blocks = nn.ModuleList([TransformerBlock(width, heads, 4 * width)\n                                     for _ in range(layers)])\n        self.norm = LayerNorm(width)\n        self.lm_head = nn.Linear(width, vocab_size, bias=False)\n        self.max_len = max_len\n\n    def forward(self, ids, caches=None, use_cache=False):\n        # 教学 LM 只接收无 padding 的等长序列；batch 内缓存长度相同。\n        if caches is not None and len(caches) != len(self.blocks):\n            raise ValueError(\"每一层都需要自己的 KV cache\")\n        past = 0 if caches is None else caches[0][0].size(-2)\n        if past + ids.size(1) > self.max_len:\n            raise ValueError(\"超过位置表长度，请用更短的序列\")\n        positions = torch.arange(past, past + ids.size(1), device=ids.device)\n        x = self.token_emb(ids) + self.pos_emb(positions)\n        new_caches = []\n        for i, block in enumerate(self.blocks):\n            x, cache = block(x, causal=True, cache=None if caches is None else caches[i],\n                             use_cache=use_cache)\n            new_caches.append(cache)\n        return self.lm_head(self.norm(x)), new_caches if use_cache else None\n# endregion lm\n\n\n# region seq2seq\nclass TinySeq2Seq(nn.Module):\n    def __init__(self, vocab_size=12, width=16, heads=2, layers=2, max_len=32):\n        super().__init__()\n        self.source_emb = nn.Embedding(vocab_size, width)\n        self.target_emb = nn.Embedding(vocab_size, width)\n        self.register_buffer(\"positions\", sinusoidal_positions(max_len, width))\n        self.encoders = nn.ModuleList([TransformerBlock(width, heads, 4*width) for _ in range(layers)])\n        self.decoders = nn.ModuleList([DecoderBlock(width, heads, 4*width) for _ in range(layers)])\n        self.encoder_norm, self.decoder_norm = LayerNorm(width), LayerNorm(width)\n        self.output = nn.Linear(width, vocab_size)\n\n    def forward(self, source_ids, target_input, source_valid=None, target_valid=None):\n        # 目标已在调用处右移；target_input[0] 通常是 BOS。\n        memory = self.source_emb(source_ids) + self.positions[:source_ids.size(1)]\n        mask = None if source_valid is None else padding_allowed(source_valid)\n        for block in self.encoders:\n            memory, _ = block(memory, allowed=mask)\n        memory = self.encoder_norm(memory)\n        x = self.target_emb(target_input) + self.positions[:target_input.size(1)]\n        for block in self.decoders:\n            x = block(x, memory, source_valid, target_valid)\n        return self.output(self.decoder_norm(x))\n# endregion seq2seq\n\n\n# region loss\ndef next_token_loss(model, token_ids):\n    # [0,1,2,3] -> 输入 [0,1,2]，标签 [1,2,3]；只移位一次。\n    if token_ids.size(1) < 2:\n        raise ValueError(\"至少两个 token 才能构造下一 token 标签\")\n    inputs, labels = token_ids[:, :-1], token_ids[:, 1:]\n    logits, _ = model(inputs)\n    return F.cross_entropy(logits.reshape(-1, logits.size(-1)), labels.reshape(-1))\n# endregion loss\n\n\n# region generation\n@torch.no_grad()\ndef generate(model, prompt, steps, use_cache=True):\n    was_training = model.training\n    model.eval()\n    try:\n        ids, caches = prompt.clone(), None\n        for _ in range(steps):\n            current = ids[:, -1:] if use_cache and caches is not None else ids\n            logits, caches = model(current, caches=caches, use_cache=use_cache)\n            next_id = logits[:, -1].argmax(dim=-1, keepdim=True)  # 贪心选择\n            ids = torch.cat([ids, next_id], dim=1)\n        return ids\n    finally:\n        model.train(was_training)\n# endregion generation\n\n\n# region rope\ndef apply_rope(x, positions, base=10000.0):\n    # 相邻两个通道为一对；有的模型使用前半/后半配对，不能混用权重约定。\n    width = x.size(-1)\n    if width % 2:\n        raise ValueError(\"RoPE 头维度必须为偶数\")\n    freq = base ** (-torch.arange(0, width, 2, device=x.device).float() / width)\n    angle = positions.to(x.device).float()[:, None] * freq\n    cos, sin = angle.cos().to(x.dtype), angle.sin().to(x.dtype)\n    even, odd = x[..., 0::2], x[..., 1::2]\n    return torch.stack([even*cos - odd*sin, even*sin + odd*cos], dim=-1).flatten(-2)\n# endregion rope\n\n\n# region gqa\ndef expand_kv(k, v, query_heads):\n    kv_heads = k.size(1)\n    if v.size(1) != kv_heads or query_heads % kv_heads:\n        raise ValueError(\"Q 头数必须是相同 K/V 头数的整数倍\")\n    group = query_heads // kv_heads\n    # 为看清语义先显式复制；生产内核可避免物理展开。\n    return k.repeat_interleave(group, dim=1), v.repeat_interleave(group, dim=1)\n# endregion gqa\n\n\n# region training\ndef learning_demo(steps=120):\n    torch.manual_seed(17)\n    torch.set_num_threads(1)\n    model = TinyLanguageModel()\n    # 玩具规律：0 -> 1 -> ... -> 7 -> 0；不是自然语言语料。\n    offsets = torch.arange(8)[:, None]\n    batch = (offsets + torch.arange(13)[None, :]) % 8\n    optimizer = torch.optim.AdamW(model.parameters(), lr=0.01, weight_decay=0.0)\n    history = []\n    for step in range(steps):\n        optimizer.zero_grad(set_to_none=True)\n        loss = next_token_loss(model, batch)\n        loss.backward()\n        torch.nn.utils.clip_grad_norm_(model.parameters(), 1.0)\n        optimizer.step()\n        if step in (0, steps - 1):\n            history.append(float(loss.detach()))\n    prediction = generate(model, torch.tensor([[0, 1, 2]]), 6).tolist()[0]\n    return {\"torch\": torch.__version__, \"device\": \"cpu\", \"steps\": steps,\n            \"first_loss\": history[0], \"last_loss\": history[-1],\n            \"generated\": prediction, \"expected\": [0,1,2,3,4,5,6,7,0],\n            \"scope\": \"玩具循环序列的过拟合自检；不代表语言理解与泛化能力\"}\n# endregion training\n\n\nif __name__ == \"__main__\":\n    print(json.dumps(learning_demo(), ensure_ascii=False, indent=2))\n","test_transformer_handwrite.py":"\"\"\"教学实现的数值、梯度与行为校验：python test_transformer_handwrite.py。\"\"\"\nimport unittest\nimport torch\nfrom torch import nn\nfrom torch.nn import functional as F\nfrom transformer_handwrite import (attention, split_heads, merge_heads, causal_allowed,\n    padding_allowed, MultiHeadAttention, LayerNorm, RMSNorm, FeedForward, SwiGLU,\n    sinusoidal_positions, TinyLanguageModel, TinySeq2Seq, next_token_loss,\n    generate, apply_rope, expand_kv, learning_demo)\n\n\nclass TransformerTests(unittest.TestCase):\n    def setUp(self):\n        torch.manual_seed(9)\n        torch.set_num_threads(1)\n\n    def close(self, actual, expected):\n        torch.testing.assert_close(actual, expected, atol=1e-6, rtol=1e-5)\n\n    def test_split_merge_preserves_token_order(self):\n        x = torch.arange(48).reshape(2, 3, 8)\n        heads = split_heads(x, 2)\n        self.assertEqual(tuple(heads.shape), (2, 2, 3, 4))\n        self.close(heads[0, 1, 1], x[0, 1, 4:])\n        self.close(merge_heads(heads), x)\n\n    def test_attention_weighted_sum(self):\n        q = torch.tensor([[[[1., 0.]]]])\n        k = torch.tensor([[[[1., 0.], [0., 1.]]]])\n        v = torch.tensor([[[[2., 0.], [0., 4.]]]])\n        y, weights = attention(q, k, v)\n        a = torch.sigmoid(torch.tensor(1 / 2**0.5))\n        self.close(y.flatten(), torch.stack([2*a, 4*(1-a)]))\n        self.close(weights.sum(-1), torch.ones(1,1,1))\n\n    def test_attention_matches_sdpa_forward_and_gradient(self):\n        q, k, v = [torch.randn(2, 2, 3, 4, dtype=torch.double, requires_grad=True) for _ in range(3)]\n        mask = causal_allowed(3, 3)\n        actual, _ = attention(q, k, v, mask)\n        expected = F.scaled_dot_product_attention(q, k, v, attn_mask=mask, dropout_p=0.)\n        self.close(actual, expected)\n        a = torch.autograd.grad(actual.square().sum(), (q,k,v), retain_graph=True)\n        b = torch.autograd.grad(expected.square().sum(), (q,k,v))\n        for x,y in zip(a,b): self.close(x,y)\n\n    def test_gradient_matches_finite_difference(self):\n        args = tuple(torch.randn(1,1,2,2, dtype=torch.double, requires_grad=True) for _ in range(3))\n        self.assertTrue(torch.autograd.gradcheck(lambda q,k,v: attention(q,k,v)[0], args))\n\n    def test_mask_all_hidden_fails_explicitly(self):\n        x=torch.randn(1,1,2,2)\n        with self.assertRaisesRegex(ValueError, '任何 key'):\n            attention(x,x,x,torch.zeros(2,2,dtype=torch.bool))\n\n    def test_padding_cannot_affect_valid_queries(self):\n        q,k,v=[torch.randn(2,2,4,3) for _ in range(3)]\n        mask=padding_allowed(torch.tensor([[True,True,False,False]]*2))\n        expected,_=attention(q,k,v,mask)\n        k[:,:,2:]+=1000; v[:,:,2:]-=1000\n        self.close(attention(q,k,v,mask)[0],expected)\n\n    def test_mha_matches_pytorch_self_and_cross(self):\n        manual=MultiHeadAttention(8,2).double().eval()\n        reference=nn.MultiheadAttention(8,2,batch_first=True).double().eval()\n        with torch.no_grad():\n            reference.in_proj_weight.copy_(torch.cat([manual.q_proj.weight,manual.k_proj.weight,manual.v_proj.weight]))\n            reference.in_proj_bias.copy_(torch.cat([manual.q_proj.bias,manual.k_proj.bias,manual.v_proj.bias]))\n            reference.out_proj.load_state_dict(manual.out_proj.state_dict())\n        x=torch.randn(2,3,8,dtype=torch.double)\n        for context in (None,torch.randn(2,5,8,dtype=torch.double)):\n            src=x if context is None else context\n            mask=causal_allowed(3,3) if context is None else torch.ones(3,5,dtype=torch.bool)\n            y,w,_=manual(x,context=context,allowed=mask)\n            # nn.MultiheadAttention 的 True 表示禁止，恰与本教程相反。\n            yr,wr=reference(x,src,src,attn_mask=~mask,average_attn_weights=False)\n            self.close(y,yr); self.close(w,wr)\n\n    def test_norm_reference_and_per_token_independence(self):\n        x=torch.randn(2,3,8,dtype=torch.double,requires_grad=True)\n        norm=LayerNorm(8).double()\n        self.close(norm(x),F.layer_norm(x,(8,),norm.weight,norm.bias,norm.eps))\n        changed=x.detach().clone(); changed[:,2]+=99\n        self.close(norm(changed)[:,:2],norm(x)[:,:2])\n        self.close(RMSNorm(8).double()(x), F.rms_norm(x,(8,),eps=1e-6))\n\n    def test_ffn_is_positionwise_and_nonlinear(self):\n        x=torch.randn(2,3,8)\n        for layer in (FeedForward(8,16), SwiGLU(8,16)):\n            changed=x.clone(); changed[:,2]+=3\n            self.close(layer(changed)[:,:2],layer(x)[:,:2])\n            self.assertEqual(layer(x).shape,x.shape)\n\n    def test_sinusoidal_zero_position_and_distinct_rows(self):\n        p=sinusoidal_positions(4,8)\n        self.close(p[0,0::2],torch.zeros(4)); self.close(p[0,1::2],torch.ones(4))\n        self.assertFalse(torch.equal(p[0],p[1]))\n\n    def test_lm_future_tokens_do_not_change_past_logits(self):\n        model=TinyLanguageModel().eval()\n        ids=torch.tensor([[0,1,2,3,4]])\n        changed=ids.clone(); changed[:,3:]=7\n        self.close(model(ids)[0][:,:3],model(changed)[0][:,:3])\n\n    def test_cache_chunk_and_single_token_equal_full_forward(self):\n        model=TinyLanguageModel().eval()\n        ids=torch.tensor([[0,1,2,3,4,5]])\n        full,_=model(ids)\n        with torch.no_grad():\n            prefix,caches=model(ids[:,:3],use_cache=True)\n            chunk,caches=model(ids[:,3:5],caches=caches,use_cache=True)\n            last,caches=model(ids[:,5:],caches=caches,use_cache=True)\n        self.close(torch.cat([prefix,chunk,last],1),full)\n        self.assertTrue(all(c[0].size(-2)==6 for c in caches))\n        self.assertEqual(causal_allowed(2,5,3).tolist(),[[True]*4+[False],[True]*5])\n\n    def test_cached_generation_equal_and_mode_restored(self):\n        model=TinyLanguageModel()\n        ids=torch.tensor([[0,1,2]])\n        self.close(generate(model,ids,5,True),generate(model,ids,5,False))\n        self.assertTrue(model.training)\n\n    def test_loss_shift_matches_explicit_log_softmax(self):\n        model=TinyLanguageModel()\n        ids=torch.tensor([[0,1,2,3]])\n        logp=model(ids[:,:-1])[0].log_softmax(-1)\n        expected=-logp.gather(-1,ids[:,1:,None]).mean()\n        self.close(next_token_loss(model,ids),expected)\n\n    def test_seq2seq_padding_and_causality(self):\n        model=TinySeq2Seq().eval()\n        src=torch.tensor([[1,2,3,0]]); valid=torch.tensor([[True,True,True,False]])\n        target=torch.tensor([[1,4,5]])\n        y=model(src,target,valid)\n        changed_src=src.clone(); changed_src[:,-1]=10\n        self.close(model(changed_src,target,valid),y)\n        changed_target=target.clone(); changed_target[:,-1]=11\n        self.close(model(src,changed_target,valid)[:,:2],y[:,:2])\n        model(src,target,valid).sum().backward()\n        self.assertTrue(all(p.grad is not None and torch.isfinite(p.grad).all() for p in model.parameters()))\n\n    def test_rope_preserves_norm_and_relative_dot(self):\n        q,k=[torch.randn(1,1,1,8,dtype=torch.double) for _ in range(2)]\n        qm=apply_rope(q,torch.tensor([3])); kn=apply_rope(k,torch.tensor([5]))\n        self.close(qm.square().sum(-1),q.square().sum(-1))\n        self.close((qm*kn).sum(-1),(q*apply_rope(k,torch.tensor([2]))).sum(-1))\n\n    def test_gqa_group_mapping(self):\n        k=torch.arange(8.).reshape(1,2,2,2); v=k+1\n        ke,ve=expand_kv(k,v,4)\n        self.close(ke[:,0],k[:,0]); self.close(ke[:,1],k[:,0])\n        self.close(ke[:,2],k[:,1]); self.close(ve[:,3],v[:,1])\n        with self.assertRaises(ValueError): expand_kv(k,v,3)\n\n    def test_layers_have_independent_parameters_and_gradients(self):\n        model=TinyLanguageModel()\n        self.assertIsNot(model.blocks[0].attn.q_proj.weight,model.blocks[1].attn.q_proj.weight)\n        next_token_loss(model,torch.tensor([[0,1,2,3]])).backward()\n        self.assertTrue(all(p.grad is not None and torch.isfinite(p.grad).all() for p in model.parameters()))\n\n    def test_toy_learning_reduces_loss_and_generates_pattern(self):\n        r=learning_demo()\n        self.assertLess(r['last_loss'],r['first_loss']*0.1)\n        self.assertEqual(r['generated'],r['expected'])\n\n\nif __name__=='__main__':\n    unittest.main(verbosity=2)\n","Transformer手写运行与练习.md":"# Transformer 手写：运行与练习\n\n先看第 21 章 TH01。你只需要能读 Python 函数、列表与类；不需要显卡、模型账号或下载训练语料。网页可直接阅读和操作可视化，只有运行 Python 实验时才需要下面的环境。\n\n## 第一次运行\n\n在当前学习目录打开 PowerShell。新建独立环境，不改其他项目的依赖。以下版本与本轮实际检查一致：Python 3.12、PyTorch 2.14.0 CPU。\n\n```powershell\npython -m venv .venv-transformer\n.\\.venv-transformer\\Scripts\\python.exe -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu\n.\\.venv-transformer\\Scripts\\python.exe -m pip install numpy\n.\\.venv-transformer\\Scripts\\python.exe -X utf8 03_代码实验/transformer_handwrite.py\n.\\.venv-transformer\\Scripts\\python.exe -X utf8 03_代码实验/test_transformer_handwrite.py\n```\n\n首次安装需要联网；后面的实验在 CPU 本地完成。如果系统找不到 python，先安装 Python 3.12 并重新打开终端。已有合适 PyTorch 环境也可直接运行最后两个文件；换版本后应重新跑测试。\n\n本次助手实际验证环境保存在 `work/transformer-visual-revision/venv`，你在当前电脑上也可用它的 `Scripts/python.exe` 运行。运行过程中打印版本、损失和生成序列，不保存大模型权重。\n\n## 先看怎样才算跑通\n\n完整实现学习 0→1→…→7→0 的循环。预期输入 [0,1,2] 后续写出 [3,4,5,6,7,0]，训练损失显著下降。具体实测数值保存在同目录 `Transformer手写运行结果.json`；不同运行环境可能出现小幅数值差异。\n\n这只是检查训练链路能工作的一道小题；没有自然语言数据、验证集或泛化成绩。TinySeq2Seq 做了前向、反向、因果性和 padding 检查，没有训练成翻译模型。\n\n## 五次练习，每次有明确产物\n\n| 次数 | 阅读 | 自己写出 | 验收 |\n|---|---|---|---|\n| 1 | TH01—TH05 | attention 与两种 mask | 小数值可手算；未来权重为 0 |\n| 2 | TH06—TH10 | MultiHeadAttention、Norm、FFN、Block | 与参考层对照；拆合头顺序不变 |\n| 3 | TH11—TH14 | TinyLanguageModel 与 TinySeq2Seq | 输出维度和双向/因果可见关系正确 |\n| 4 | TH15—TH17 | loss、训练循环、生成与缓存 | 玩具规律学会；缓存 logits 对齐完整前向 |\n| 5 | TH18—TH22 | RoPE、GQA 与限时手写 | 旋转不改长度；KV 分组正确；解释边界 |\n\n每次复制完整实现为自己的练习文件，先删去本次要练的函数体，合上参考答案再写。保留一份正确实现，方便比较。不要为了让测试变绿而删掉测试；先读失败信息，再画形状或算一个格子。\n\n## 建议主动制造的五个错误\n\n1. softmax 改成 dim=-2：观察权重行和与参考输出。\n2. 去掉 causal mask：修改未来 token，检查过去 logits 会不会变。\n3. 去掉合头前 transpose：输出形状可能相同，数字顺序会错。\n4. 缓存时把 positions 重置为 0：对比逐 token 与整段前向。\n5. 注释 optimizer.step：看 loss 为什么不随训练改善。\n\n上述错误只在自己的练习副本中尝试。参考实现与测试文件作为对照；每次只改一处，定位原因后恢复。\n\n## 代码的明确边界\n\n- attention 的 allowed=True 表示可见；完全屏蔽的行直接报错。padding 的可见性与标签忽略需分开处理。\n- 主线 LM 使用无 padding、批内等长输入、可训练绝对位置与 Pre-LN；生成使用贪心选择。\n- 缓存是各层的 K/V 张量元组；没有分页、跨请求共享、滑窗淘汰、量化或服务部署逻辑。\n- RoPE、RMSNorm、SwiGLU、GQA 是可运行的独立教学部件，并未声称主线 LM 同时采用这些变体。\n- Python 与浏览器演示使用同一数学定义和小例子；浏览器不运行 PyTorch、不做训练。不要把动画中的示意数值当作真实模型权重。\n\n参考资料与版本见第 21 章各题的一手来源；开源教程教学组织的取舍见维护目录的“可视化与手写教学设计”。\n"}</script>
<script>
"use strict";
const DB=JSON.parse(document.getElementById("knowledge").textContent);
// The embedded local database needs no server, permissions, or cache migration.
// Parse each record once on demand, then release its original JSON text node.
function lazyRecord(item,key,fields){
 let record;
 function read(){
  if(!record){const node=document.getElementById(key);record=JSON.parse(node.textContent);node.remove();}
  return record;
 }
 for(const field of fields)Object.defineProperty(item,field,{enumerable:true,get:()=>read()[field]});
}
for(const q of DB.questions)lazyRecord(q,"data-q-"+q.id,["body","html"]);
for(const d of DB.documents)lazyRecord(d,"data-doc-"+d.id,["html"]);
const Q=Object.fromEntries(DB.questions.map(q=>[q.id,q]));
const DOC=Object.fromEntries(DB.documents.map(d=>[d.id,d]));
const S=Object.fromEntries(DB.sources.map(s=>[s.id,s]));
const content=document.getElementById("content"), nav=document.getElementById("nav");
const search=document.getElementById("search"), priority=document.getElementById("priority"), statusFilter=document.getElementById("status");
const depth=document.getElementById("depth");
const KEY="llm-interview-study-v1", validStates=["new","review","done"];let progress={};
function safeProgress(data){const out={};if(!data||typeof data!=="object"||Array.isArray(data))return out;for(const[id,value]of Object.entries(data)){if(Q[id]&&value&&validStates.includes(value.state))out[id]={state:value.state,updated:typeof value.updated==="string"?value.updated:""};}return out;}
function notice(text){document.getElementById("notice").textContent=text;}
try{progress=safeProgress(JSON.parse(localStorage.getItem(KEY)||"{}"));}catch(e){notice("浏览器未能载入进度；仍可阅读，并用导出功能备份。");}
try{if(localStorage.getItem("llm-study-depth")==="full")depth.value="full";}catch(e){}
function applyDepth(){content.querySelectorAll("details.deep").forEach(d=>{d.open=depth.value==="full";if(d.open)hydrateDeep(d);});}
depth.onchange=()=>{applyDepth();try{localStorage.setItem("llm-study-depth",depth.value);}catch(e){}};
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(progress));}catch(e){notice("当前浏览器无法保存进度，请导出 JSON 备份。");}updateProgress();}
function updateProgress(){const done=DB.questions.filter(q=>progress[q.id]?.state==="done").length;document.getElementById("progressText").textContent="已掌握 "+done+" / "+DB.questions.length+" 题";document.getElementById("progressBar").style.width=(100*done/DB.questions.length)+"%";}
function navButton(label,hash){const b=document.createElement("button");b.textContent=label;b.dataset.route=hash;b.onclick=()=>go(hash);nav.appendChild(b);}
function navLabel(label){const p=document.createElement("div");p.className="navlabel";p.textContent=label;nav.appendChild(p);}
navButton("总览","home");navButton("新人 20 题：按顺序学","beginner");
for(const term of ["新人从这里开始","术语翻译小词表"]){const d=DB.documents.find(d=>d.path.includes(term));if(d)navButton(d.title,"doc-"+d.id);}
navButton("Transformer 手写 22 步","transformer");navButton("算法可视化：动手验证","visuals");navButton("Agent 50 题：入门到实战","agent");navButton("蒸馏 34 题","distill");navButton("OPD / OPSD / MOPD","opd");navButton("后训练进阶 8 题","posttrain");navButton("预训练 20 题","pretrain");navButton("48 道面试核心题","core");navButton("全部题目索引","doc-index");
navLabel("知识主线");
for(const d of DB.documents.filter(d=>d.path.startsWith("01_")))navButton(d.title,"doc-"+d.id);
navLabel("项目与使用");
for(const d of DB.documents.filter(d=>d.path.startsWith("02_")||d.path.startsWith("03_")||d.path.includes("岗位地图")))navButton(d.title,"doc-"+d.id);
navButton("一手来源与核查状态","sources");
for(const d of DB.documents.filter(d=>d.path.includes("维护规范")||d.path.includes("新题与研究记录模板")||d.path.includes("验收记录")||d.path.includes("CHANGELOG")))navButton(d.title,"doc-"+d.id);
function go(hash){if(["beginner","distill","opd","posttrain","pretrain","agent","agent-start","transformer","visuals"].includes(hash)){search.value="";priority.value="";statusFilter.value="";}if(location.hash==="#"+hash)route();else location.hash=hash;}
function selectNav(hash){for(const b of nav.querySelectorAll("button"))b.classList.toggle("active",b.dataset.route===hash);}
const questionParts=new Map(),searchText=new Map();
function parts(q){
 if(!questionParts.has(q.id)){
  const marker='<details class="deep"><summary>',bodyMarker='<div class="deepbody">',ending='</div></details>';
  const start=q.html.indexOf(marker),bodyStart=q.html.indexOf(bodyMarker,start);
  questionParts.set(q.id,start<0||bodyStart<0?{intro:q.html,deep:""}:{intro:q.html.slice(0,start),deep:q.html.slice(bodyStart+bodyMarker.length,-ending.length)});
 }
 return questionParts.get(q.id);
}
function questionBody(q){
 const state=progress[q.id]?.state||"new",part=parts(q);
 return '<div class="qbody">'+part.intro+visualPanel(q.id)+(part.deep?'<details class="deep" data-id="'+q.id+'"'+(depth.value==="full"?' open':'')+'><summary>我已读懂例子，继续看公式、边界与追问</summary><div class="deepbody"></div></details>':'')+'</div><div class="qfooter"><a class="small" href="#doc-'+q.doc+'">所属章节</a><label class="small">复习状态 <select class="study" data-id="'+q.id+'" aria-label="'+q.id+' 复习状态">'+[['new','未开始'],['review','需复习'],['done','已掌握']].map(([v,t])=>'<option value="'+v+'"'+(v===state?' selected':'')+'>'+t+'</option>').join('')+'</select></label></div>';
}
function hydrateDeep(detail){
 if(detail.dataset.loaded)return;
 detail.querySelector('.deepbody').innerHTML=parts(Q[detail.dataset.id]).deep;
 detail.dataset.loaded="true";
}
function hydrateQuestion(detail){
 if(detail.dataset.loaded)return;
 detail.insertAdjacentHTML('beforeend',questionBody(Q[detail.id.slice(2)]));
 detail.dataset.loaded="true";
 const deep=detail.querySelector('.deep');if(deep?.open)hydrateDeep(deep);
}
function card(q,open=false){return '<details class="question" id="q-'+q.id+'"'+(open?' open':'')+'><summary><span class="qid">'+q.id+'</span><span class="qtitle">'+escapeHtml(q.title)+'</span><span class="pill">'+q.priority+(q.core?' · 核心':'')+'</span></summary></details>';}
// Capturing handles the non-bubbling native toggle event, including keyboard use.
content.addEventListener('toggle',e=>{
 if(!e.target.open||!content.contains(e.target))return;
 if(e.target.matches('details.question'))hydrateQuestion(e.target);
 else if(e.target.matches('details.deep'))hydrateDeep(e.target);
},true);
function filtered(items){
 const words=search.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
 return items.filter(q=>{
  if(priority.value&&q.priority!==priority.value)return false;
  if(statusFilter.value&&(progress[q.id]?.state||"new")!==statusFilter.value)return false;
  if(!words.length)return true;
  if(!searchText.has(q.id))searchText.set(q.id,(q.id+" "+q.title+" "+q.body).toLowerCase());
  return words.every(w=>searchText.get(q.id).includes(w));
 });
}
let expansion=0;
function cancelExpansion(){
 expansion++;
 const button=document.getElementById('expandAll');if(button){button.disabled=false;button.textContent='展开全部';}
 content.removeAttribute('aria-busy');
}
function expandQuestions(){
 cancelExpansion();const token=expansion,button=document.getElementById('expandAll');
 const pending=[...content.querySelectorAll('details.question')];let index=0;
 button.disabled=true;content.setAttribute('aria-busy','true');
 function batch(){
  if(token!==expansion)return;
  const start=performance.now();let count=0;
  while(index<pending.length&&count<4&&performance.now()-start<8){
   const detail=pending[index++];hydrateQuestion(detail);detail.open=true;count++;
  }
  button.textContent='展开中 '+index+' / '+pending.length;
  if(index<pending.length)setTimeout(batch,0);
  else cancelExpansion();
 }
 batch();
}
function renderQuestions(title,items,overview=""){
 const list=filtered(items);
 content.innerHTML=(overview?'<div class="article">'+overview+'</div>':'')+'<div class="sectionhead" style="margin-top:22px"><div><h2>'+escapeHtml(title)+'</h2><span class="resultcount">'+list.length+' 道题 · 点击题目展开</span></div><div><button class="btn" id="expandAll">展开全部</button> <button class="btn" id="collapseAll">收起</button></div></div>'+(list.length?list.map(q=>card(q)).join(''):'<div class="empty">没有匹配的问题。可减少关键词或清除筛选。</div>');
 document.getElementById('expandAll').onclick=expandQuestions;
 document.getElementById('collapseAll').onclick=()=>{cancelExpansion();content.querySelectorAll('details.question').forEach(d=>d.open=false);};
}
function home(){

function vizSoftmax(row){const m=Math.max(...row),values=row.map(x=>Math.exp(x-m)),sum=values.reduce((a,b)=>a+b,0);return values.map(x=>x/sum);}
function vizDot(a,b){return a.reduce((sum,x,i)=>sum+x*b[i],0);}

function vizMatrix(name,matrix,options={}){

  const hidden=masked&&!masked[i][j],val=hidden?'遮住':vizNum(v),style=heat&&!hidden?' style="background:rgba(31,100,75,'+(0.04+0.5*v)+')"':'';

 }).join('')+'</tr>').join('')+'</tbody></table></div>';
}

  if(type==='block'){
   const steps=[['查表与位置','[1,3] → [1,3,8]','x = token_emb(ids) + pos_emb(pos)','编号变向量，加入位置信息。'],['第一次归一化','[1,3,8] → [1,3,8]','u = norm1(x)','只调整每个词的通道数值，不改形状。'],['多头注意力','[1,2,3,4] → [1,3,8]','a = out_proj(merge_heads(weights @ v))','两个头各看前文，合头后再混合。'],['第一次残差','[1,3,8] + [1,3,8]','x = x + a','加回进入子层之前的 x。'],['第二次归一化与 FFN','8 → 32 → 8','f = down(gelu(up(norm2(x))))','逐位置加工特征。'],['第二次残差','[1,3,8] + [1,3,8]','x = x + f','这一层完成；下一层有自己的参数。'],['最后预测词表','[1,3,8] → [1,3,10]','logits = lm_head(final_norm(x))','这里示意词表 10；选最后位置用于续写。']];
   result.innerHTML='<div class="viz-flow">'+steps.map((s,i)=>'<div class="viz-node'+(i===state.step?' active':'')+'"><strong>'+(i+1)+'. '+s[0]+'</strong><span>'+s[1]+'</span></div>').join('')+'</div>'+vizDetail('<strong>'+steps[state.step][0]+'</strong><br><code>'+escapeHtml(steps[state.step][2])+'</code><br>'+steps[state.step][3]);
  }
  if(type==='rope'){
   const a=state.m*state.freq,b=state.n*state.freq,q=[Math.cos(a),Math.sin(a)],k=[Math.cos(b),Math.sin(b)],cx=160,cy=145,r=92;
   const vector=(v,label,color,y)=>'<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+r*v[0])+'" y2="'+(cy-r*v[1])+'" stroke="'+color+'" stroke-width="3"/><circle cx="'+(cx+r*v[0])+'" cy="'+(cy-r*v[1])+'" r="5" fill="'+color+'"/><text x="18" y="'+y+'">'+label+'=['+v.map(n=>vizNum(n)).join(', ')+']</text>';
   result.innerHTML='<svg class="viz-svg" viewBox="0 0 320 330" role="img" aria-label="Q 与 K 单位向量随位置旋转，半径保持 1"><circle cx="160" cy="145" r="92" fill="none" stroke="#b8c7bc"/><line x1="40" y1="145" x2="280" y2="145" stroke="#b8c7bc"/><line x1="160" y1="35" x2="160" y2="255" stroke="#b8c7bc"/><text x="270" y="164">x</text><text x="170" y="39">y</text>'+vector(k,'K（橙）','#ad5d29',305)+vector(q,'Q（绿）','#1f644b',282)+'</svg>'+vizDetail('Q·K = cos(('+state.m+' − '+state.n+') × '+state.freq+') = <strong>'+vizNum(vizDot(q,k),6)+'</strong>。两者长度都为 1；同样平移位置保持相对角度。');
  }
  if(type==='cache'){
   const n=3+state.decode;let plain=9,cached=9;
   for(let t=4;t<=n;t++){plain+=t*t;cached+=t;}
   result.innerHTML='<div class="viz-flow">'+Array.from({length:n},(_,i)=>'<span class="viz-token'+(i>=3?' new':'')+'">位置 '+i+'</span>').join('')+'</div><div class="viz-grid"><div><h4>每次重新算整段</h4>'+vizMatrix('本次 Q×Kᵀ 的形状',[[n,n]],{headers:['query 数','key 数']})+'</div><div><h4>复用历史 K/V</h4>'+vizMatrix('本次 Q×Kᵀ 的形状',[[state.decode?1:3,n]],{headers:['query 数','key 数']})+'</div></div><div class="viz-bars">'+vizBar('重复算格数',plain,plain)+vizBar('缓存后格数',cached,plain,true)+'</div>'+vizDetail('累计 '+plain+' vs '+cached+' 个打分格。2 层、1 样本、2 个 KV 头、每头 4 维：缓存 '+(32*n)+' 个元素；float32 为 '+(128*n)+' 字节。新 Q 仍读取全部 '+n+' 个 K。')+'<p class="viz-note">仅计算密集打分矩阵格数，未包含 FFN、投影、带宽、缓存管理等开销。CPU 小模型会另检验完整与缓存 logits 相等。</p>';
  }
  if(type==='probability'){
   const p=state.p/100,q=state.q/100,h=-p*Math.log(p)-(1-p)*Math.log(1-p),ce=-p*Math.log(q)-(1-p)*Math.log(1-q),kl=ce-h;
   result.innerHTML='<div class="viz-bars">'+vizBar('真实红球 P',p,1,false)+vizBar('预测红球 Q',q,1,true)+'</div>'+vizMatrix('扣分分解（自然对数，nat）',[[h,ce,kl]],{headers:['熵 H(P)','交叉熵 H(P,Q)','KL(P||Q)']})+vizDetail('交叉熵 = −'+vizNum(p)+'·ln('+vizNum(q)+') − '+vizNum(1-p)+'·ln('+vizNum(1-q)+') = '+vizNum(ce,6)+'。<br>额外扣分 KL = '+vizNum(ce,6)+' − '+vizNum(h,6)+' = <strong>'+vizNum(kl,6)+'</strong>。')+'<p>当 Q=P 时，KL 为 0，但两种颜色仍有不确定性，所以交叉熵仍大于 0。这里展示的是完整分布的平均扣分；单次抽到红球只扣 −ln(Q红)。</p>';
  }
  if(type==='lora'){
   const r=state.rank,x=[1,2,-1,.5],w=[[1,0,1,0],[0,1,0,1],[1,-1,0,1]],A=Array.from({length:r},(_,i)=>[1,.5*(i+1),-1,.25*i]),B=Array.from({length:3},(_,o)=>Array.from({length:r},(_,i)=>(o+1)*(i%2?-.2:.3)));
   const ax=A.map(row=>vizDot(row,x)),base=w.map(row=>vizDot(row,x)),delta=B.map(row=>state.alpha/r*vizDot(row,ax)),out=base.map((v,i)=>v+delta[i]);
   result.innerHTML='<div class="viz-flow"><div class="viz-node"><strong>x [4]</strong><span>'+x.join(', ')+'</span></div><div class="viz-node"><strong>A·x ['+r+']</strong><span>'+ax.map(v=>vizNum(v)).join(', ')+'</span></div><div class="viz-node active"><strong>(α/r) B·A·x [3]</strong><span>'+delta.map(v=>vizNum(v)).join(', ')+'</span></div></div><div class="viz-grid">'+vizMatrix('A ['+r+',4]',A)+vizMatrix('B [3,'+r+']',B)+'</div>'+vizMatrix('每个输出通道：冻结主路 + 旁路',base.map((v,i)=>[v,delta[i],out[i]]),{headers:['W₀x','旁路修正','最终输出']})+vizDetail('主矩阵 3×4=12 个参数；旁路 r×(4+3)=<strong>'+(7*r)+'</strong> 个可训参数。这个小例子 r≥2 时旁路参数已超过主矩阵，说明低秩必须相对原维度足够小才省参数。α=0 时输出回到主路。');
  }
  if(active){const button=result.querySelector('[data-cell="'+active+'"]');button?.focus({preventScroll:true});}
  for(const out of host.querySelectorAll('[data-output]'))out.value=state[out.dataset.output];
 };

 result.addEventListener('click',e=>{const cell=e.target.closest('[data-cell]');if(!cell)return;[state.row,state.col]=cell.dataset.cell.split(',').map(Number);draw();});
