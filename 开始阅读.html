<script id="data-q-A09" type="application/json">{"body":"### 长上下文像摊开笔记，记忆像整理好的档案\n\n长上下文把较多材料直接放在当前输入里；外部记忆可以长期保存、筛选、更新，再按需取回。\n\n档案可能过期或记错，所以“记得更多”不自动更好。需要知道谁写入、来自哪里、什么时候应更新或删除。\n\n**直答：** 两者分别扩展当前可见材料和跨任务持久信息；外部记忆还需要写入、检索、冲突与生命周期管理。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 长上下文容纳更多当前输入；记忆系统还要管理写入、更新、检索、冲突、删除和来源。\n\n**展开：** 记忆可存在摘要、数据库、向量索引或参数中。业务规则要存实体、内容、版本、生效时间、来源和适用范围；用户偏好与系统规则不能混为一层。\n\n**追问：新规则与旧规则冲突怎么办？** 根据权威与有效期判断替换、保留历史或请求澄清，不能一律“后写覆盖先写”。\n\n**易错：** 记忆更长也可能保留过期错误。依据：S33。","html":"<h3>长上下文像摊开笔记，记忆像整理好的档案<\/h3>\n<p>长上下文把较多材料直接放在当前输入里；外部记忆可以长期保存、筛选、更新，再按需取回。<\/p>\n<p>档案可能过期或记错，所以“记得更多”不自动更好。需要知道谁写入、来自哪里、什么时候应更新或删除。<\/p>\n<p><strong>直答：<\/strong> 两者分别扩展当前可见材料和跨任务持久信息；外部记忆还需要写入、检索、冲突与生命周期管理。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 长上下文容纳更多当前输入；记忆系统还要管理写入、更新、检索、冲突、删除和来源。<\/p>\n<p><strong>展开：<\/strong> 记忆可存在摘要、数据库、向量索引或参数中。业务规则要存实体、内容、版本、生效时间、来源和适用范围；用户偏好与系统规则不能混为一层。<\/p>\n<p><strong>追问：新规则与旧规则冲突怎么办？<\/strong> 根据权威与有效期判断替换、保留历史或请求澄清，不能一律“后写覆盖先写”。<\/p>\n<p><strong>易错：<\/strong> 记忆更长也可能保留过期错误。依据：<a class=\"ref\" href=\"#source-S33\">S33<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-A10" type="application/json">{"body":"### 忘掉旧地址，又别把姓名一起删了\n\n选择性遗忘要让某条不该再用的信息失效，同时保留其他仍有效内容。删除数据库一行后，还要检查摘要、缓存或其他副本是否会把旧信息带回来。\n\n可以用应忘信息、应记信息和冲突信息分别测试。\n\n**直答：** 遗忘评测同时验证目标信息不再被使用、相关正常信息仍保留，并检查不同存储层的残留。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 写入一批信息、更新或删除其中部分，再测应保留、应替换、应遗忘的内容是否分别正确。\n\n**展开：** 不只从向量库删一行，还要检查摘要、缓存、备份恢复和相关派生记录；按系统设计明确删除范围。评测不要求模型忘掉通用常识，而是正确处理指定记忆。\n\n**追问：回答“不知道”就算删除成功？** 还要确认旧事实不会通过别的路径再次被检索或使用。\n\n**易错：** 记忆基准有不同版本和维度命名，引用时固定论文版本。依据：S33。","html":"<h3>忘掉旧地址，又别把姓名一起删了<\/h3>\n<p>选择性遗忘要让某条不该再用的信息失效，同时保留其他仍有效内容。删除数据库一行后，还要检查摘要、缓存或其他副本是否会把旧信息带回来。<\/p>\n<p>可以用应忘信息、应记信息和冲突信息分别测试。<\/p>\n<p><strong>直答：<\/strong> 遗忘评测同时验证目标信息不再被使用、相关正常信息仍保留，并检查不同存储层的残留。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 写入一批信息、更新或删除其中部分，再测应保留、应替换、应遗忘的内容是否分别正确。<\/p>\n<p><strong>展开：<\/strong> 不只从向量库删一行，还要检查摘要、缓存、备份恢复和相关派生记录；按系统设计明确删除范围。评测不要求模型忘掉通用常识，而是正确处理指定记忆。<\/p>\n<p><strong>追问：回答“不知道”就算删除成功？<\/strong> 还要确认旧事实不会通过别的路径再次被检索或使用。<\/p>\n<p><strong>易错：<\/strong> 记忆基准有不同版本和维度命名，引用时固定论文版本。依据：<a class=\"ref\" href=\"#source-S33\">S33<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-A11" type="application/json">{"body":"### 不要让读到的一张纸，自动获得操作账户的权限\n\n外部网页写着“执行这条命令”，并不等于用户要求这样做。防御要在内容来源、模型决策、工具授权和执行检查等位置共同建立边界。\n\n即使模型一时受骗，工具也应拒绝越权操作，而不是把全部防线放在一句提示词上。\n\n**直答：** 通过来源隔离、最小权限和执行校验限制外部内容的控制力，并用实际任务攻击验证多层防线。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 在不可信内容进入决策、工具执行和外部状态改变的多个环节建立约束。\n\n**展开：** 文档和工具返回标注来源；检索权限前置；执行工具只接收明确结构参数；高风险动作校验当前用户目标；敏感数据读取和输出按业务权限检查。\n\n**追问：模型能识别所有恶意指令吗？** 不应依赖完美识别；即使误判文本，执行层仍应限制越权行为。\n\n**易错：** AgentDojo 风格评测同时看任务实用性和攻击成功，不只看拦截率。依据：S32。","html":"<h3>不要让读到的一张纸，自动获得操作账户的权限<\/h3>\n<p>外部网页写着“执行这条命令”，并不等于用户要求这样做。防御要在内容来源、模型决策、工具授权和执行检查等位置共同建立边界。<\/p>\n<p>即使模型一时受骗，工具也应拒绝越权操作，而不是把全部防线放在一句提示词上。<\/p>\n<p><strong>直答：<\/strong> 通过来源隔离、最小权限和执行校验限制外部内容的控制力，并用实际任务攻击验证多层防线。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 在不可信内容进入决策、工具执行和外部状态改变的多个环节建立约束。<\/p>\n<p><strong>展开：<\/strong> 文档和工具返回标注来源；检索权限前置；执行工具只接收明确结构参数；高风险动作校验当前用户目标；敏感数据读取和输出按业务权限检查。<\/p>\n<p><strong>追问：模型能识别所有恶意指令吗？<\/strong> 不应依赖完美识别；即使误判文本，执行层仍应限制越权行为。<\/p>\n<p><strong>易错：<\/strong> AgentDojo 风格评测同时看任务实用性和攻击成功，不只看拦截率。依据：<a class=\"ref\" href=\"#source-S32\">S32<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-A12" type="application/json">{"body":"### 多人分工有收益，也有沟通成本\n\n独立资料整理和交叉检查可以并行；但如果任务步骤紧密依赖，多个 Agent 反复解释和传递上下文，可能更慢、更贵，还会传播同一种错误。\n\n比较时应与单 Agent 或固定流程使用相近预算，而不是仅看最后答案更长。\n\n**直答：** 在任务可分、分工清楚且协调收益超过成本时使用多 Agent，并评估通信、重复工作和错误相关性。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 当任务可有效分解、存在互补信息或独立核查价值，且协调成本可控时。\n\n**展开：** 明确角色输入输出、共享状态、冲突解决和停止规则；多个相同模型同提示可能共享错误，不能等同于独立专家投票。比较固定总 token/时长预算下的单 Agent 基线。\n\n**追问：分工后分数升了说明什么？** 可能只是多用了采样与上下文，应做预算匹配和角色消融。\n\n**易错：** Agent 数量是实现选择，不是能力指标。","html":"<h3>多人分工有收益，也有沟通成本<\/h3>\n<p>独立资料整理和交叉检查可以并行；但如果任务步骤紧密依赖，多个 Agent 反复解释和传递上下文，可能更慢、更贵，还会传播同一种错误。<\/p>\n<p>比较时应与单 Agent 或固定流程使用相近预算，而不是仅看最后答案更长。<\/p>\n<p><strong>直答：<\/strong> 在任务可分、分工清楚且协调收益超过成本时使用多 Agent，并评估通信、重复工作和错误相关性。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 当任务可有效分解、存在互补信息或独立核查价值，且协调成本可控时。<\/p>\n<p><strong>展开：<\/strong> 明确角色输入输出、共享状态、冲突解决和停止规则；多个相同模型同提示可能共享错误，不能等同于独立专家投票。比较固定总 token/时长预算下的单 Agent 基线。<\/p>\n<p><strong>追问：分工后分数升了说明什么？<\/strong> 可能只是多用了采样与上下文，应做预算匹配和角色消融。<\/p>\n<p><strong>易错：<\/strong> Agent 数量是实现选择，不是能力指标。<\/p><\/div><\/details>"}</script>
<script id="data-q-A13" type="application/json">{"body":"### 压缩会议纪要，不能删掉“仅限周五”这个条件\n\n上下文压缩要缩短文字，但保留任务目标、约束、关键事实、未决事项和已经执行的动作。丢掉一个日期或否定词，后续决策就可能完全改变。\n\n检验方法是让压缩前后完成同样任务，观察关键约束是否仍被满足。\n\n**直答：** 以决策所需信息是否保留来评估压缩，不能只看压缩率或摘要是否通顺。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 将可核验事实、约束、待办与副作用状态结构化保存，原始证据保留可回溯引用。\n\n**展开：** 摘要时区分已完成/计划/失败/未知；保留单位、日期、否定、来源和权限。压缩效果用后续任务成功率与事实恢复测，不只看字数减少。\n\n**追问：反复摘要会怎样？** 误差可能逐轮累积；可采用分层记忆、固定关键字段和按需回读原始记录。\n\n**易错：** 把工具报错总结成“已经处理”会污染后续决策。","html":"<h3>压缩会议纪要，不能删掉“仅限周五”这个条件<\/h3>\n<p>上下文压缩要缩短文字，但保留任务目标、约束、关键事实、未决事项和已经执行的动作。丢掉一个日期或否定词，后续决策就可能完全改变。<\/p>\n<p>检验方法是让压缩前后完成同样任务，观察关键约束是否仍被满足。<\/p>\n<p><strong>直答：<\/strong> 以决策所需信息是否保留来评估压缩，不能只看压缩率或摘要是否通顺。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 将可核验事实、约束、待办与副作用状态结构化保存，原始证据保留可回溯引用。<\/p>\n<p><strong>展开：<\/strong> 摘要时区分已完成/计划/失败/未知；保留单位、日期、否定、来源和权限。压缩效果用后续任务成功率与事实恢复测，不只看字数减少。<\/p>\n<p><strong>追问：反复摘要会怎样？<\/strong> 误差可能逐轮累积；可采用分层记忆、固定关键字段和按需回读原始记录。<\/p>\n<p><strong>易错：<\/strong> 把工具报错总结成“已经处理”会污染后续决策。<\/p><\/div><\/details>"}</script>
<script id="data-q-A14" type="application/json">{"body":"### 用了框架，还要证明它解决了哪个实际麻烦\n\n展示一个具体任务，从状态变化、工具调用到中断恢复和最终结果。让面试官看见为什么需要这些节点，而不是只画一张复杂流程图。\n\n框架已有能力、你写的业务规则、你做的评测，应分别说清。\n\n**直答：** 用真实任务记录、状态定义、失败恢复和对照评测证明项目价值，并准确划分个人贡献。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 状态图只是入口，还需任务集、节点日志、终态检查、故障恢复和版本对比。\n\n**展开：** 每个任务记录目标、允许工具、证据库、策略约束、预期终态；注入超时、空结果、权限不足、规则更新和恶意工具内容。报告任务成功、无效调用、违规、恢复、步数与 p95 时延。\n\n**追问：最有价值的新增实验是什么？** 固定任务集比较固定流程、单 Agent、加入恢复、加入记忆的增量效果，并做同预算对照。\n\n**易错：** 没有真实运行时，表述为实验方案，不填虚构 N 类任务/M 类故障。","html":"<h3>用了框架，还要证明它解决了哪个实际麻烦<\/h3>\n<p>展示一个具体任务，从状态变化、工具调用到中断恢复和最终结果。让面试官看见为什么需要这些节点，而不是只画一张复杂流程图。<\/p>\n<p>框架已有能力、你写的业务规则、你做的评测，应分别说清。<\/p>\n<p><strong>直答：<\/strong> 用真实任务记录、状态定义、失败恢复和对照评测证明项目价值，并准确划分个人贡献。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 状态图只是入口，还需任务集、节点日志、终态检查、故障恢复和版本对比。<\/p>\n<p><strong>展开：<\/strong> 每个任务记录目标、允许工具、证据库、策略约束、预期终态；注入超时、空结果、权限不足、规则更新和恶意工具内容。报告任务成功、无效调用、违规、恢复、步数与 p95 时延。<\/p>\n<p><strong>追问：最有价值的新增实验是什么？<\/strong> 固定任务集比较固定流程、单 Agent、加入恢复、加入记忆的增量效果，并做同预算对照。<\/p>\n<p><strong>易错：<\/strong> 没有真实运行时，表述为实验方案，不填虚构 N 类任务/M 类故障。<\/p><\/div><\/details>"}</script>
<script id="data-q-I01" type="application/json">{"body":"### 先读完题目，再一个字一个字作答\n\nPrefill 是处理已有输入、建立初始计算结果；decode 是在此基础上逐步生成新 token。前者一次有很多已知位置可计算，后者不断依赖刚生成的内容。\n\n因此二者可能受不同瓶颈限制。输入很长时首字等待长；输出很长时，后续逐步生成的总时间也会大。\n\n**直答：** Prefill 处理已有上下文，decode 逐步生成新内容；优化时分别看输入处理和每步生成的计算与访存。\n\n### 进一步：公式、边界与追问\n\n**本章进阶约定与范围：**\n\n定位：算法岗需要能估算和定位瓶颈；不要求把所有 kernel 实现背下来。数字为教学估算，GB=10^9 字节，GiB=2^30 字节。\n\n**技术表述：** Prefill 一次处理已知输入的多个 token；decode 每次为各请求生成少量新 token，并读取已有 KV。\n\n**展开：** Prefill 较易形成大的矩阵乘；小 batch decode 常受权重/KV 访存限制。实际瓶颈随 batch、长度、硬件、量化和注意力实现变化，不能绝对分类。\n\n**追问：为什么首字快但后续慢？** 输入短可降低 prefill，但长历史 KV 读写、batch 调度或网络输出会影响 decode。\n\n**易错：** tokens/s 需说明是输入、输出、单请求还是全服务聚合。依据：S34。","html":"<h3>先读完题目，再一个字一个字作答<\/h3>\n<p>Prefill 是处理已有输入、建立初始计算结果；decode 是在此基础上逐步生成新 token。前者一次有很多已知位置可计算，后者不断依赖刚生成的内容。<\/p>\n<p>因此二者可能受不同瓶颈限制。输入很长时首字等待长；输出很长时，后续逐步生成的总时间也会大。<\/p>\n<p><strong>直答：<\/strong> Prefill 处理已有上下文，decode 逐步生成新内容；优化时分别看输入处理和每步生成的计算与访存。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>本章进阶约定与范围：<\/strong><\/p>\n<p>定位：算法岗需要能估算和定位瓶颈；不要求把所有 kernel 实现背下来。数字为教学估算，GB=10^9 字节，GiB=2^30 字节。<\/p>\n<p><strong>技术表述：<\/strong> Prefill 一次处理已知输入的多个 token；decode 每次为各请求生成少量新 token，并读取已有 KV。<\/p>\n<p><strong>展开：<\/strong> Prefill 较易形成大的矩阵乘；小 batch decode 常受权重/KV 访存限制。实际瓶颈随 batch、长度、硬件、量化和注意力实现变化，不能绝对分类。<\/p>\n<p><strong>追问：为什么首字快但后续慢？<\/strong> 输入短可降低 prefill，但长历史 KV 读写、batch 调度或网络输出会影响 decode。<\/p>\n<p><strong>易错：<\/strong> tokens/s 需说明是输入、输出、单请求还是全服务聚合。依据：<a class=\"ref\" href=\"#source-S34\">S34<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-I02" type="application/json">{"body":"### 已读过的前文，不必每次重新做笔记\n\n每生成一个新 token，都要参考历史内容。KV cache 保存历史位置算出的 K 和 V，让后续步骤可以直接使用，减少重复计算。\n\n新一步主要使用新位置的 Q 去查询历史 K/V；旧位置的 Q 已完成对应输出计算，通常无需为未来步骤继续保留。\n\n**直答：** KV cache 保存历史键和值，供新位置查询；它用显存换取少做重复计算，历史 Q 通常不参与新的查询输出。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 存每层历史位置的 K/V，供未来 token 查询；旧位置的 Q 通常不会再用于计算新位置的输出。\n\n**展开：** 自回归推理中，新 token 的 Q 与所有可见历史 K 匹配，再聚合 V。缓存避免重复计算历史 token 的 K/V，但仍要读取和使用历史。\n\n**追问：KV cache 会降低模型参数量吗？** 不会，它是运行时状态，反而占额外显存，以换取计算复用。\n\n**易错：** 不要将 KV cache 说成缓存最终答案。依据：S34。","html":"<h3>已读过的前文，不必每次重新做笔记<\/h3>\n<p>每生成一个新 token，都要参考历史内容。KV cache 保存历史位置算出的 K 和 V，让后续步骤可以直接使用，减少重复计算。<\/p>\n<p>新一步主要使用新位置的 Q 去查询历史 K/V；旧位置的 Q 已完成对应输出计算，通常无需为未来步骤继续保留。<\/p>\n<p><strong>直答：<\/strong> KV cache 保存历史键和值，供新位置查询；它用显存换取少做重复计算，历史 Q 通常不参与新的查询输出。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 存每层历史位置的 K/V，供未来 token 查询；旧位置的 Q 通常不会再用于计算新位置的输出。<\/p>\n<p><strong>展开：<\/strong> 自回归推理中，新 token 的 Q 与所有可见历史 K 匹配，再聚合 V。缓存避免重复计算历史 token 的 K/V，但仍要读取和使用历史。<\/p>\n<p><strong>追问：KV cache 会降低模型参数量吗？<\/strong> 不会，它是运行时状态，反而占额外显存，以换取计算复用。<\/p>\n<p><strong>易错：<\/strong> 不要将 KV cache 说成缓存最终答案。依据：<a class=\"ref\" href=\"#source-S34\">S34<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-I03" type="application/json">{"body":"### 数一数缓存里到底放了多少个数字\n\n先算一层、一个 token：有 K 和 V 两份，每份包含若干 K/V 头，每头有一定维度。再乘历史 token 数、层数、并行请求数，得到数字总个数；最后乘每个数字占的字节。\n\n例如 32 层、8 个 K/V 头、每头 128 维、8192 个 token、一个请求、每数 2 字节：2×32×8×128×8192×2=1 GiB。\n\n**直答：** KV 显存按“保存两份什么形状的张量”逐维相乘；明确层数、K/V 头数、维度、长度、批量和精度，再检查特殊结构与额外开销。\n\n### 进一步：公式、边界与追问\n\n常见标准 attention、K/V head dim 相同，忽略分页碎片与额外元数据：\n\n$$M_{\\rm KV}=2\\cdot L_{\\rm layers}\\cdot B\\cdot T\\cdot H_{\\rm kv}\\cdot d_h\\cdot b.$$\n\n**技术表述：** 2 表示 K/V，b 是每元素字节数，T 是每请求当前缓存长度；变长请求用各 T 之和替代 B·T。\n\n**算例：** 32 层、batch=1、T=8192、8 个 KV 头、head dim=128、BF16 2 字节，约 1 GiB；若 32 个 KV 头，约 4 GiB。\n\n**追问：MLA/混合注意力适用吗？** 需按实际缓存表示重算，不能直接套这个标准式。\n\n**易错：** 参数精度与 KV 精度可能不同。依据：S03、S34。","html":"<h3>数一数缓存里到底放了多少个数字<\/h3>\n<p>先算一层、一个 token：有 K 和 V 两份，每份包含若干 K/V 头，每头有一定维度。再乘历史 token 数、层数、并行请求数，得到数字总个数；最后乘每个数字占的字节。<\/p>\n<p>例如 32 层、8 个 K/V 头、每头 128 维、8192 个 token、一个请求、每数 2 字节：2×32×8×128×8192×2=1 GiB。<\/p>\n<p><strong>直答：<\/strong> KV 显存按“保存两份什么形状的张量”逐维相乘；明确层数、K/V 头数、维度、长度、批量和精度，再检查特殊结构与额外开销。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p>常见标准 attention、K/V head dim 相同，忽略分页碎片与额外元数据：<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>M<\/mi><mrow><mi mathvariant=\"normal\">K<\/mi><mi mathvariant=\"normal\">V<\/mi><\/mrow><\/msub><mo>=<\/mo><mn>2<\/mn><mi>·<\/mi><msub><mi>L<\/mi><mrow><mi mathvariant=\"normal\">l<\/mi><mi mathvariant=\"normal\">a<\/mi><mi mathvariant=\"normal\">y<\/mi><mi mathvariant=\"normal\">e<\/mi><mi mathvariant=\"normal\">r<\/mi><mi mathvariant=\"normal\">s<\/mi><\/mrow><\/msub><mi>·<\/mi><mi>B<\/mi><mi>·<\/mi><mi>T<\/mi><mi>·<\/mi><msub><mi>H<\/mi><mrow><mi mathvariant=\"normal\">k<\/mi><mi mathvariant=\"normal\">v<\/mi><\/mrow><\/msub><mi>·<\/mi><msub><mi>d<\/mi><mi>h<\/mi><\/msub><mi>·<\/mi><mi>b<\/mi><mo>.<\/mo><\/mrow><\/math><\/div>\n<p><strong>技术表述：<\/strong> 2 表示 K/V，b 是每元素字节数，T 是每请求当前缓存长度；变长请求用各 T 之和替代 B·T。<\/p>\n<p><strong>算例：<\/strong> 32 层、batch=1、T=8192、8 个 KV 头、head dim=128、BF16 2 字节，约 1 GiB；若 32 个 KV 头，约 4 GiB。<\/p>\n<p><strong>追问：MLA/混合注意力适用吗？<\/strong> 需按实际缓存表示重算，不能直接套这个标准式。<\/p>\n<p><strong>易错：<\/strong> 参数精度与 KV 精度可能不同。依据：<a class=\"ref\" href=\"#source-S03\">S03<\/a>、<a class=\"ref\" href=\"#source-S34\">S34<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-I04" type="application/json">{"body":"### 放教材的空间，和做作业的草稿空间\n\n推理要放模型权重，还要放缓存、中间结果和服务需要的空间；训练还可能保存梯度、优化器状态以及反向传播要用的中间信息。\n\n所以“70 亿参数×每参数 2 字节”只估算了某种精度下的权重，不是训练或服务的全部显存。\n\n**直答：** 按权重、缓存、中间激活、梯度和优化器状态分项估算，结合运行方式确定哪些存在，避免把参数存储当成总显存。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 推理看权重+KV+激活/缓冲；训练另加梯度、优化器状态与保存激活，是否有主权重副本依实现。\n\n**展开：** 7B 参数 BF16 裸权重约 14GB；4bit 裸权重约 3.5GB，但都不是实际显存需求。典型混合精度 Adam 配置若含 BF16 权重/梯度、FP32 主权重和两个 FP32 动量，参数相关状态约 16 字节/参数。\n\n**追问：为什么估计放得下却 OOM？** 未计 KV、临时 workspace、碎片、并行通信缓存或长输入峰值。\n\n**易错：** 16 字节不是所有训练框架固定开销，参数分片与优化器实现会改变它。依据：S35。","html":"<h3>放教材的空间，和做作业的草稿空间<\/h3>\n<p>推理要放模型权重，还要放缓存、中间结果和服务需要的空间；训练还可能保存梯度、优化器状态以及反向传播要用的中间信息。<\/p>\n<p>所以“70 亿参数×每参数 2 字节”只估算了某种精度下的权重，不是训练或服务的全部显存。<\/p>\n<p><strong>直答：<\/strong> 按权重、缓存、中间激活、梯度和优化器状态分项估算，结合运行方式确定哪些存在，避免把参数存储当成总显存。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 推理看权重+KV+激活/缓冲；训练另加梯度、优化器状态与保存激活，是否有主权重副本依实现。<\/p>\n<p><strong>展开：<\/strong> 7B 参数 BF16 裸权重约 14GB；4bit 裸权重约 3.5GB，但都不是实际显存需求。典型混合精度 Adam 配置若含 BF16 权重/梯度、FP32 主权重和两个 FP32 动量，参数相关状态约 16 字节/参数。<\/p>\n<p><strong>追问：为什么估计放得下却 OOM？<\/strong> 未计 KV、临时 workspace、碎片、并行通信缓存或长输入峰值。<\/p>\n<p><strong>易错：<\/strong> 16 字节不是所有训练框架固定开销，参数分片与优化器实现会改变它。依据：<a class=\"ref\" href=\"#source-S35\">S35<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-I05" type="application/json">{"body":"### 给每位客人预留整栋房子，容易浪费空间\n\n不同请求的回答长度事先不确定。如果为每个请求连续预留很大缓存，容易产生空闲和碎片。PagedAttention 使用分块管理与映射，按需组织 K/V 存储。\n\n它重点解决存储安排和共享，不是靠改变答案质量来换速度。\n\n**直答：** PagedAttention 用分页式管理改善 KV cache 分配和利用率，减少连续预留带来的浪费，并支持相应共享。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 把 KV cache 按块分配并通过映射访问，减少连续大块预留带来的碎片与冗余。\n\n**展开：** 每个请求的逻辑 token 序列不必对应连续物理内存；动态增长与共享更灵活。仍有块内尾部空间和元数据，不能宣称绝对零浪费。\n\n**追问：它是稀疏注意力吗？** 主要是缓存组织与访问方法，不意味着只关注少数 token。\n\n**易错：** 更省缓存可支持更多并发，但具体吞吐收益取决于 workload。依据：S34。","html":"<h3>给每位客人预留整栋房子，容易浪费空间<\/h3>\n<p>不同请求的回答长度事先不确定。如果为每个请求连续预留很大缓存，容易产生空闲和碎片。PagedAttention 使用分块管理与映射，按需组织 K/V 存储。<\/p>\n<p>它重点解决存储安排和共享，不是靠改变答案质量来换速度。<\/p>\n<p><strong>直答：<\/strong> PagedAttention 用分页式管理改善 KV cache 分配和利用率，减少连续预留带来的浪费，并支持相应共享。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 把 KV cache 按块分配并通过映射访问，减少连续大块预留带来的碎片与冗余。<\/p>\n<p><strong>展开：<\/strong> 每个请求的逻辑 token 序列不必对应连续物理内存；动态增长与共享更灵活。仍有块内尾部空间和元数据，不能宣称绝对零浪费。<\/p>\n<p><strong>追问：它是稀疏注意力吗？<\/strong> 主要是缓存组织与访问方法，不意味着只关注少数 token。<\/p>\n<p><strong>易错：<\/strong> 更省缓存可支持更多并发，但具体吞吐收益取决于 workload。依据：<a class=\"ref\" href=\"#source-S34\">S34<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-I06" type="application/json">{"body":"### 做完的人先离桌，新人马上补位\n\n传统批处理可能让一组请求一起进、等全部完成再换下一组。有人回答两句话就结束，却要等其他人写长文。\n\n连续批处理可以在运行过程中移出完成请求、加入新请求，让设备更持续地工作，但调度和缓存管理也更复杂。\n\n**直答：** 连续批处理动态补充活跃请求，提高不同输出长度下的利用率；还要检查单个用户等待和服务公平性。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 连续批处理可在生成过程中让完成请求退出、新请求进入，提高不同长度请求混合时的利用率。\n\n**展开：** 调度要平衡公平性、尾延迟、总吞吐与 KV 容量；大批量不必然让单请求更快。长 prefill 可能阻塞其他 decode，chunked prefill 是一种缓解思路。\n\n**追问：为什么 GPU 利用率高但用户体验差？** 排队和长尾可能很高。必须看请求到达时间与端到端 SLO。\n\n**易错：** 静态 batch 的最优吞吐不能直接代表线上负载。","html":"<h3>做完的人先离桌，新人马上补位<\/h3>\n<p>传统批处理可能让一组请求一起进、等全部完成再换下一组。有人回答两句话就结束，却要等其他人写长文。<\/p>\n<p>连续批处理可以在运行过程中移出完成请求、加入新请求，让设备更持续地工作，但调度和缓存管理也更复杂。<\/p>\n<p><strong>直答：<\/strong> 连续批处理动态补充活跃请求，提高不同输出长度下的利用率；还要检查单个用户等待和服务公平性。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 连续批处理可在生成过程中让完成请求退出、新请求进入，提高不同长度请求混合时的利用率。<\/p>\n<p><strong>展开：<\/strong> 调度要平衡公平性、尾延迟、总吞吐与 KV 容量；大批量不必然让单请求更快。长 prefill 可能阻塞其他 decode，chunked prefill 是一种缓解思路。<\/p>\n<p><strong>追问：为什么 GPU 利用率高但用户体验差？<\/strong> 排队和长尾可能很高。必须看请求到达时间与端到端 SLO。<\/p>\n<p><strong>易错：<\/strong> 静态 batch 的最优吞吐不能直接代表线上负载。<\/p><\/div><\/details>"}</script>
<script id="data-q-I07" type="application/json">{"body":"### 大家读同一份开场材料，可以共用已做好的前半段计算\n\n很多请求共享完全相同的系统提示或长文档前缀，prefix caching 可以复用这段的缓存，减少重复 prefill。\n\n关键是模型实际看到的 token 前缀一致，而不只是两段文字“意思一样”。模型或缓存条件变化也会影响复用。\n\n**直答：** 前缀缓存复用兼容条件下相同 token 前缀的计算；命中率取决于请求结构、版本和缓存策略。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 相同模型条件下，共享完全匹配的前缀可复用 KV，减少重复 prefill；不直接减少后续生成所需的 decode。\n\n**展开：** 公共系统提示、固定文档前缀、多轮公共历史有机会命中。前缀前面插入随机时间戳或改变模板，会影响匹配；模型、adapter、位置与缓存实现也需兼容。\n\n**追问：只要包含相同段落就能缓存命中？** 普通前缀缓存通常还依赖之前所有前缀内容，不能把任意相同中间片段视为独立可复用。\n\n**易错：** 多租户复用需按系统边界保证隔离与正确性。依据：S50。","html":"<h3>大家读同一份开场材料，可以共用已做好的前半段计算<\/h3>\n<p>很多请求共享完全相同的系统提示或长文档前缀，prefix caching 可以复用这段的缓存，减少重复 prefill。<\/p>\n<p>关键是模型实际看到的 token 前缀一致，而不只是两段文字“意思一样”。模型或缓存条件变化也会影响复用。<\/p>\n<p><strong>直答：<\/strong> 前缀缓存复用兼容条件下相同 token 前缀的计算；命中率取决于请求结构、版本和缓存策略。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 相同模型条件下，共享完全匹配的前缀可复用 KV，减少重复 prefill；不直接减少后续生成所需的 decode。<\/p>\n<p><strong>展开：<\/strong> 公共系统提示、固定文档前缀、多轮公共历史有机会命中。前缀前面插入随机时间戳或改变模板，会影响匹配；模型、adapter、位置与缓存实现也需兼容。<\/p>\n<p><strong>追问：只要包含相同段落就能缓存命中？<\/strong> 普通前缀缓存通常还依赖之前所有前缀内容，不能把任意相同中间片段视为独立可复用。<\/p>\n<p><strong>易错：<\/strong> 多租户复用需按系统边界保证隔离与正确性。依据：<a class=\"ref\" href=\"#source-S50\">S50<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-I08" type="application/json">{"body":"### 小助手先起草，大模型按规则验收\n\n小模型快速猜几个 token，大模型一次检查这些候选；接受多少、拒绝后怎样重采样，都有严格规则。符合对应条件时，可以保持目标大模型的采样分布。\n\n它不是把小模型的答案未经验证直接交出去。草稿经常不被接受时，也可能没节省多少时间。\n\n**直答：** 推测解码用廉价草稿减少昂贵串行生成步骤，靠正确的验收与重采样保持目标分布，收益取决于接受率和实现成本。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 草稿模型先提议多个 token，目标模型并行验证；使用正确接受与残差采样规则，可保持目标采样分布。\n\n**展开：** 单步在草稿分布 q、目标 p 下，对提议 token 的接受概率为 min(1,p/q)；拒绝后从规范化的 (p−q)_+ 残差分布采样。精确性依完整算法与实现假设，不是任意“草稿+检查”都成立。\n\n**追问：加速来自哪里？** 目标模型并行验证一段有机会比逐个 decode 更高效；草稿成本、接受率和硬件决定收益。\n\n**易错：** 不承诺所有任务固定倍数提速。依据：S36。","html":"<h3>小助手先起草，大模型按规则验收<\/h3>\n<p>小模型快速猜几个 token，大模型一次检查这些候选；接受多少、拒绝后怎样重采样，都有严格规则。符合对应条件时，可以保持目标大模型的采样分布。<\/p>\n<p>它不是把小模型的答案未经验证直接交出去。草稿经常不被接受时，也可能没节省多少时间。<\/p>\n<p><strong>直答：<\/strong> 推测解码用廉价草稿减少昂贵串行生成步骤，靠正确的验收与重采样保持目标分布，收益取决于接受率和实现成本。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 草稿模型先提议多个 token，目标模型并行验证；使用正确接受与残差采样规则，可保持目标采样分布。<\/p>\n<p><strong>展开：<\/strong> 单步在草稿分布 q、目标 p 下，对提议 token 的接受概率为 min(1,p/q)；拒绝后从规范化的 (p−q)_+ 残差分布采样。精确性依完整算法与实现假设，不是任意“草稿+检查”都成立。<\/p>\n<p><strong>追问：加速来自哪里？<\/strong> 目标模型并行验证一段有机会比逐个 decode 更高效；草稿成本、接受率和硬件决定收益。<\/p>\n<p><strong>易错：<\/strong> 不承诺所有任务固定倍数提速。依据：<a class=\"ref\" href=\"#source-S36\">S36<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-I09" type="application/json">{"body":"### 调整概率，再决定从哪些候选里抽\n\n温度调概率分布的尖锐程度；top-k 只保留概率最高的 k 个候选；top-p 保留累计概率达到某阈值的一组高概率候选。\n\n例如 k 固定为 10，无论模型多确定都按这个数量限制；top-p 的候选数会随当前概率分布变化。\n\n**直答：** 三者分别改变概率尺度或截取候选集合；选择时联合考虑任务正确性、重复、多样性与可复现设置。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 温度重塑分布，top-k 限制候选数量，top-p 按累计概率质量截取候选集合，再重新归一化采样。\n\n**展开：** 确定性评测可用 greedy 作为基线；推理覆盖实验应记录温度、top-p、候选数、最大长度。代码或结构化输出还要看格式约束。\n\n**追问：top-p 会固定保留多少 token？** 不会，取决于当前分布尖锐程度。\n\n**易错：** temperature=0 常是接口里的 greedy 约定，不是在数学式里直接除零。","html":"<h3>调整概率，再决定从哪些候选里抽<\/h3>\n<p>温度调概率分布的尖锐程度；top-k 只保留概率最高的 k 个候选；top-p 保留累计概率达到某阈值的一组高概率候选。<\/p>\n<p>例如 k 固定为 10，无论模型多确定都按这个数量限制；top-p 的候选数会随当前概率分布变化。<\/p>\n<p><strong>直答：<\/strong> 三者分别改变概率尺度或截取候选集合；选择时联合考虑任务正确性、重复、多样性与可复现设置。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 温度重塑分布，top-k 限制候选数量，top-p 按累计概率质量截取候选集合，再重新归一化采样。<\/p>\n<p><strong>展开：<\/strong> 确定性评测可用 greedy 作为基线；推理覆盖实验应记录温度、top-p、候选数、最大长度。代码或结构化输出还要看格式约束。<\/p>\n<p><strong>追问：top-p 会固定保留多少 token？<\/strong> 不会，取决于当前分布尖锐程度。<\/p>\n<p><strong>易错：<\/strong> temperature=0 常是接口里的 greedy 约定，不是在数学式里直接除零。<\/p><\/div><\/details>"}</script>
<script id="data-q-I10" type="application/json">{"body":"### 用户既在乎多久开始，也在乎后面写得多快\n\nTTFT 是等到第一个 token 的时间；TPOT 描述后续每个 token 的平均时间；吞吐是系统单位时间完成多少工作。\n\np95 则关注较慢用户：约 95% 的观测值不超过这个数。平均很快，仍可能有少部分用户等得很久。\n\n**直答：** 首字等待、后续生成速度、整体吞吐和尾部延迟是不同体验与效率指标，要分开报告。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** TTFT 是首 token 等待，TPOT 表示后续 token 的平均生成时间，吞吐是单位时间总产出，p95 描述尾部体验。\n\n**展开：** 记录计时边界：客户端排队、服务排队、prefill、decode、网络是否都包括。TTFT 低但输出慢，长答案仍会很慢。\n\n**追问：怎么做负载测试？** 用真实输入/输出长度分布、到达率与并发，分别报告稳定负载和接近饱和时的延迟、错误与内存。\n\n**易错：** 不能用平均延迟掩盖少量严重超时。","html":"<h3>用户既在乎多久开始，也在乎后面写得多快<\/h3>\n<p>TTFT 是等到第一个 token 的时间；TPOT 描述后续每个 token 的平均时间；吞吐是系统单位时间完成多少工作。<\/p>\n<p>p95 则关注较慢用户：约 95% 的观测值不超过这个数。平均很快，仍可能有少部分用户等得很久。<\/p>\n<p><strong>直答：<\/strong> 首字等待、后续生成速度、整体吞吐和尾部延迟是不同体验与效率指标，要分开报告。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> TTFT 是首 token 等待，TPOT 表示后续 token 的平均生成时间，吞吐是单位时间总产出，p95 描述尾部体验。<\/p>\n<p><strong>展开：<\/strong> 记录计时边界：客户端排队、服务排队、prefill、decode、网络是否都包括。TTFT 低但输出慢，长答案仍会很慢。<\/p>\n<p><strong>追问：怎么做负载测试？<\/strong> 用真实输入/输出长度分布、到达率与并发，分别报告稳定负载和接近饱和时的延迟、错误与内存。<\/p>\n<p><strong>易错：<\/strong> 不能用平均延迟掩盖少量严重超时。<\/p><\/div><\/details>"}</script>
<script id="data-q-I11" type="application/json">{"body":"### 厨房每分钟出菜更多，不代表每单更便宜\n\n为了提高吞吐增加更多 GPU，总费用可能涨得更快；允许回答更长也会增加 token 量，却不一定提高任务价值。\n\n应同时看每个有效任务的成本、失败重试、设备空闲和用户等待，而不只看 tokens/s。\n\n**直答：** 吞吐描述处理速率，成本还取决于资源、输出长度、利用率和成功任务数；效率提升必须按完整业务单位核算。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 可能模型生成更长、重试更多、批量等待更久，或额外调用了评审/检索/草稿模型。\n\n**展开：** 成本应按成功任务或满足质量约束的请求计，而非只按输出 token。RAG 的检索与索引，Agent 的工具环境，RL 的验证器都要计入。\n\n**追问：怎么展示方案取舍？** 画成功率—成本、吞吐—p95 等曲线，给出业务约束下的候选点。\n\n**易错：** 单 kernel benchmark 的快不能证明端到端服务快。","html":"<h3>厨房每分钟出菜更多，不代表每单更便宜<\/h3>\n<p>为了提高吞吐增加更多 GPU，总费用可能涨得更快；允许回答更长也会增加 token 量，却不一定提高任务价值。<\/p>\n<p>应同时看每个有效任务的成本、失败重试、设备空闲和用户等待，而不只看 tokens/s。<\/p>\n<p><strong>直答：<\/strong> 吞吐描述处理速率，成本还取决于资源、输出长度、利用率和成功任务数；效率提升必须按完整业务单位核算。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 可能模型生成更长、重试更多、批量等待更久，或额外调用了评审/检索/草稿模型。<\/p>\n<p><strong>展开：<\/strong> 成本应按成功任务或满足质量约束的请求计，而非只按输出 token。RAG 的检索与索引，Agent 的工具环境，RL 的验证器都要计入。<\/p>\n<p><strong>追问：怎么展示方案取舍？<\/strong> 画成功率—成本、吞吐—p95 等曲线，给出业务约束下的候选点。<\/p>\n<p><strong>易错：<\/strong> 单 kernel benchmark 的快不能证明端到端服务快。<\/p><\/div><\/details>"}</script>
<script id="data-q-I12" type="application/json">{"body":"### 慢的是排队、读题、写答案，还是调用外部工具？\n\n把总耗时分段记录，先看哪个阶段最慢，再观察计算设备、显存、网络和并发。若主要时间花在外部查询，优化 attention 未必有明显帮助。\n\n每次改动后用相同请求分布重测，才能判断改善发生在哪里。\n\n**直答：** 先分解时间与资源瓶颈，再选择优化点；用一致工作负载验证端到端收益。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 先分排队、模型计算、访存、检索、工具与网络，再针对主导瓶颈优化。\n\n**展开：** 固定输入长度与输出长度测微基线；再逐步加入真实并发、长输入和工具。核查缓存命中、KV 占用、实际 batch、重试与冷启动。\n\n**追问：先换更强 GPU 行吗？** 如果瓶颈在数据库或队列，收益有限；先量化耗时占比。\n\n**易错：** 并发参数增大导致 OOM、排队和重试后，吞吐可能反而下降。","html":"<h3>慢的是排队、读题、写答案，还是调用外部工具？<\/h3>\n<p>把总耗时分段记录，先看哪个阶段最慢，再观察计算设备、显存、网络和并发。若主要时间花在外部查询，优化 attention 未必有明显帮助。<\/p>\n<p>每次改动后用相同请求分布重测，才能判断改善发生在哪里。<\/p>\n<p><strong>直答：<\/strong> 先分解时间与资源瓶颈，再选择优化点；用一致工作负载验证端到端收益。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 先分排队、模型计算、访存、检索、工具与网络，再针对主导瓶颈优化。<\/p>\n<p><strong>展开：<\/strong> 固定输入长度与输出长度测微基线；再逐步加入真实并发、长输入和工具。核查缓存命中、KV 占用、实际 batch、重试与冷启动。<\/p>\n<p><strong>追问：先换更强 GPU 行吗？<\/strong> 如果瓶颈在数据库或队列，收益有限；先量化耗时占比。<\/p>\n<p><strong>易错：<\/strong> 并发参数增大导致 OOM、排队和重试后，吞吐可能反而下降。<\/p><\/div><\/details>"}</script>
<script id="data-q-X01" type="application/json">{"body":"### 多张卡，可以分试卷、分一道题、分工序、分专家\n\nDP 数据并行：每张卡有模型副本，分不同数据；TP 张量并行：把一部分大矩阵计算拆开；PP 流水并行：不同设备负责不同层；EP 专家并行：把 MoE 专家放在不同设备上。\n\n拆分减少某些单卡负担，却会增加同步和通信。\n\n**直答：** 先说明拆的是数据、张量计算、网络层还是专家，再分析存储、通信和设备空闲的代价。\n\n### 进一步：公式、边界与追问\n\n**本章进阶约定与范围：**\n\n定位：补齐工程问答。所有接口和支持精度随硬件与版本变化，面试先讲机制，再根据实际栈举例。\n\n**技术表述：** DP 拆数据，TP 拆层内张量计算，PP 拆模型层流水，EP 拆 MoE 专家。\n\n**展开：** DP 需要汇总梯度；TP 需频繁层内通信；PP 有流水气泡；EP 有 token 路由和专家负载。通常组合使用，收益取决于互联与模型结构。\n\n**追问：为什么多卡不一定线性加速？** 通信、同步、负载不均、batch 太小与额外重计算限制扩展。\n\n**易错：** 不能只用总显存相加判断模型能否高效训练。","html":"<h3>多张卡，可以分试卷、分一道题、分工序、分专家<\/h3>\n<p>DP 数据并行：每张卡有模型副本，分不同数据；TP 张量并行：把一部分大矩阵计算拆开；PP 流水并行：不同设备负责不同层；EP 专家并行：把 MoE 专家放在不同设备上。<\/p>\n<p>拆分减少某些单卡负担，却会增加同步和通信。<\/p>\n<p><strong>直答：<\/strong> 先说明拆的是数据、张量计算、网络层还是专家，再分析存储、通信和设备空闲的代价。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>本章进阶约定与范围：<\/strong><\/p>\n<p>定位：补齐工程问答。所有接口和支持精度随硬件与版本变化，面试先讲机制，再根据实际栈举例。<\/p>\n<p><strong>技术表述：<\/strong> DP 拆数据，TP 拆层内张量计算，PP 拆模型层流水，EP 拆 MoE 专家。<\/p>\n<p><strong>展开：<\/strong> DP 需要汇总梯度；TP 需频繁层内通信；PP 有流水气泡；EP 有 token 路由和专家负载。通常组合使用，收益取决于互联与模型结构。<\/p>\n<p><strong>追问：为什么多卡不一定线性加速？<\/strong> 通信、同步、负载不均、batch 太小与额外重计算限制扩展。<\/p>\n<p><strong>易错：<\/strong> 不能只用总显存相加判断模型能否高效训练。<\/p><\/div><\/details>"}</script>
<script id="data-q-X02" type="application/json">{"body":"### 每人都复印全套资料，还是分着保管？\n\n数据并行里每卡若都存完整优化器状态、梯度和参数，存在大量副本。ZeRO 逐步把这些状态分片保管。\n\n第 1 阶段分优化器状态，第 2 阶段进一步分梯度，第 3 阶段再分参数。需要使用时通过相应通信协调，不能只看节省显存的一面。\n\n**直答：** ZeRO 1/2/3 依次分片优化器状态、梯度和参数，用通信与管理成本换取更少的单卡冗余存储。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** Stage 1 分片优化器状态；Stage 2 再分片梯度；Stage 3 进一步分片参数。\n\n**展开：** 分片降低每卡冗余，但需在计算时通信或聚合所需数据。FSDP 与全分片理念相关，但具体通信、API 和功能不能完全等同。\n\n**追问：ZeRO-3 必然比 ZeRO-2 快？** 不一定，更省显存可能伴随更多通信；选择取决于内存约束、互联和算力。\n\n**易错：** 不要把 stage 数字当流水并行的层数。依据：S35。","html":"<h3>每人都复印全套资料，还是分着保管？<\/h3>\n<p>数据并行里每卡若都存完整优化器状态、梯度和参数，存在大量副本。ZeRO 逐步把这些状态分片保管。<\/p>\n<p>第 1 阶段分优化器状态，第 2 阶段进一步分梯度，第 3 阶段再分参数。需要使用时通过相应通信协调，不能只看节省显存的一面。<\/p>\n<p><strong>直答：<\/strong> ZeRO 1/2/3 依次分片优化器状态、梯度和参数，用通信与管理成本换取更少的单卡冗余存储。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> Stage 1 分片优化器状态；Stage 2 再分片梯度；Stage 3 进一步分片参数。<\/p>\n<p><strong>展开：<\/strong> 分片降低每卡冗余，但需在计算时通信或聚合所需数据。FSDP 与全分片理念相关，但具体通信、API 和功能不能完全等同。<\/p>\n<p><strong>追问：ZeRO-3 必然比 ZeRO-2 快？<\/strong> 不一定，更省显存可能伴随更多通信；选择取决于内存约束、互联和算力。<\/p>\n<p><strong>易错：<\/strong> 不要把 stage 数字当流水并行的层数。依据：<a class=\"ref\" href=\"#source-S35\">S35<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-X03" type="application/json">{"body":"### 草稿放不下：用时重算，或暂时搬出去\n\nActivation checkpointing 少存一部分中间结果，到反向传播需要时重新算，主要以计算换显存；offload 把部分数据转存到 CPU 内存等位置，主要增加数据搬运。\n\n二者解决空间不足的方式不同，也可以配合。\n\n**直答：** 检查点重计算减少保存的激活，offload 改变数据存放位置；选择时比较额外计算和传输的实际耗时。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** Checkpointing 少存激活、反向时重算；offload 把部分状态移到 CPU 或其他存储，需付出传输代价。\n\n**展开：** 前者交换计算和显存，后者交换传输/存储和显存。可组合，但慢互联或频繁搬运可能显著降低吞吐。\n\n**追问：checkpointing 会减少参数状态吗？** 主要减少保存的中间激活，不直接改变优化器状态大小。\n\n**易错：** 不要把训练恢复用的 checkpoint 文件与 activation checkpointing 混淆。","html":"<h3>草稿放不下：用时重算，或暂时搬出去<\/h3>\n<p>Activation checkpointing 少存一部分中间结果，到反向传播需要时重新算，主要以计算换显存；offload 把部分数据转存到 CPU 内存等位置，主要增加数据搬运。<\/p>\n<p>二者解决空间不足的方式不同，也可以配合。<\/p>\n<p><strong>直答：<\/strong> 检查点重计算减少保存的激活，offload 改变数据存放位置；选择时比较额外计算和传输的实际耗时。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> Checkpointing 少存激活、反向时重算；offload 把部分状态移到 CPU 或其他存储，需付出传输代价。<\/p>\n<p><strong>展开：<\/strong> 前者交换计算和显存，后者交换传输/存储和显存。可组合，但慢互联或频繁搬运可能显著降低吞吐。<\/p>\n<p><strong>追问：checkpointing 会减少参数状态吗？<\/strong> 主要减少保存的中间激活，不直接改变优化器状态大小。<\/p>\n<p><strong>易错：<\/strong> 不要把训练恢复用的 checkpoint 文件与 activation checkpointing 混淆。<\/p><\/div><\/details>"}</script>
<script id="data-q-X04" type="application/json">{"body":"### 数字能写多大，和能写多细，都重要\n\nFP32、FP16、BF16 是不同的浮点表示格式。可用位数分给指数和有效数字的方式不同，所以可表示范围和精细程度也不同。\n\nFP16 某些大数更容易溢出；BF16 的范围接近 FP32，但不能因此认为它同样精细。混合精度会让不同操作采用合适精度。\n\n**直答：** 区分数值范围与精度，结合硬件和训练稳定性选择格式；低位表示节省资源，但需要检查溢出、舍入和关键计算。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 指数位决定可表达范围，尾数位影响精度；BF16 范围接近 FP32、尾数更少，FP16 范围较窄。\n\n**展开：** 混合精度常让大矩阵乘用低精度，对敏感归一化、累积或优化器状态保留更高精度。FP16 更常需要 loss scaling，BF16 也不保证所有计算稳定。\n\n**追问：BF16 是否总比 FP16 准？** 不是，量级小范围内 FP16 有更多尾数精度；最终训练稳定和效率取决于任务与硬件。\n\n**易错：** 软件声明一种 dtype，不代表所有中间计算都使用该精度。","html":"<h3>数字能写多大，和能写多细，都重要<\/h3>\n<p>FP32、FP16、BF16 是不同的浮点表示格式。可用位数分给指数和有效数字的方式不同，所以可表示范围和精细程度也不同。<\/p>\n<p>FP16 某些大数更容易溢出；BF16 的范围接近 FP32，但不能因此认为它同样精细。混合精度会让不同操作采用合适精度。<\/p>\n<p><strong>直答：<\/strong> 区分数值范围与精度，结合硬件和训练稳定性选择格式；低位表示节省资源，但需要检查溢出、舍入和关键计算。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 指数位决定可表达范围，尾数位影响精度；BF16 范围接近 FP32、尾数更少，FP16 范围较窄。<\/p>\n<p><strong>展开：<\/strong> 混合精度常让大矩阵乘用低精度，对敏感归一化、累积或优化器状态保留更高精度。FP16 更常需要 loss scaling，BF16 也不保证所有计算稳定。<\/p>\n<p><strong>追问：BF16 是否总比 FP16 准？<\/strong> 不是，量级小范围内 FP16 有更多尾数精度；最终训练稳定和效率取决于任务与硬件。<\/p>\n<p><strong>易错：<\/strong> 软件声明一种 dtype，不代表所有中间计算都使用该精度。<\/p><\/div><\/details>"}</script>
<script id="data-q-X05" type="application/json">{"body":"### 训练后再压缩，还是训练时就练习适应误差？\n\nPTQ 在已有模型训练完成后做量化；QAT 在训练中模拟或考虑量化误差；weight-only 说的是主要量化权重，而不是把所有中间计算都低位化。\n\n前两者描述什么时候处理量化，后者描述量化什么，不能放在同一层面互斥选择。\n\n**直答：** 分开说明量化时机与量化对象，并报告实际存储、计算精度和质量损失。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** PTQ 在训练后量化，QAT 在训练中模拟量化影响；weight-only 主要压缩权重，激活和 KV 未必一起量化。\n\n**展开：** 用 scale/zero point 把实数映射到有限整数；per-tensor、per-channel、group-wise 各有元数据与误差取舍。离群值会影响量化范围。\n\n**追问：4bit 为什么不一定更快？** 若无高效 kernel，反量化和小 batch 开销可能抵消访存收益；应测目标硬件和真实 workload。\n\n**易错：** 量化位数低不等于质量必然可接受。","html":"<h3>训练后再压缩，还是训练时就练习适应误差？<\/h3>\n<p>PTQ 在已有模型训练完成后做量化；QAT 在训练中模拟或考虑量化误差；weight-only 说的是主要量化权重，而不是把所有中间计算都低位化。<\/p>\n<p>前两者描述什么时候处理量化，后者描述量化什么，不能放在同一层面互斥选择。<\/p>\n<p><strong>直答：<\/strong> 分开说明量化时机与量化对象，并报告实际存储、计算精度和质量损失。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> PTQ 在训练后量化，QAT 在训练中模拟量化影响；weight-only 主要压缩权重，激活和 KV 未必一起量化。<\/p>\n<p><strong>展开：<\/strong> 用 scale/zero point 把实数映射到有限整数；per-tensor、per-channel、group-wise 各有元数据与误差取舍。离群值会影响量化范围。<\/p>\n<p><strong>追问：4bit 为什么不一定更快？<\/strong> 若无高效 kernel，反量化和小 batch 开销可能抵消访存收益；应测目标硬件和真实 workload。<\/p>\n<p><strong>易错：<\/strong> 量化位数低不等于质量必然可接受。<\/p><\/div><\/details>"}</script>
<script id="data-q-X06" type="application/json">{"body":"### 压缩时，尽量别伤到最影响输出的部分\n\nGPTQ 用校准信息近似考虑量化误差怎样影响结果，并补偿部分误差；AWQ 利用激活信息识别较重要的权重通道，通过缩放等办法降低量化影响。\n\n校准样本不代表所有任务，所以压缩后仍要测目标能力，不能只看文件缩小。\n\n**直答：** 二者都尝试用数据指导低位量化，降低关键误差；具体取舍看目标模型、校准集、硬件支持与任务结果。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** GPTQ 利用近似二阶信息补偿逐步权重量化误差；AWQ 利用激活统计识别重要权重并做缩放保护。\n\n**展开：** 两者都需理解校准数据与目标层，不能只凭模型文件名判断实际配置。量化后要测长上下文、代码、中文和安全边界等目标能力。\n\n**追问：校准集为何重要？** 它代表运行激活分布；只用短英文句子校准，未必适合中文长对话。\n\n**易错：** 不把校准集用于调参后继续当独立测试集。依据：S38、S39。","html":"<h3>压缩时，尽量别伤到最影响输出的部分<\/h3>\n<p>GPTQ 用校准信息近似考虑量化误差怎样影响结果，并补偿部分误差；AWQ 利用激活信息识别较重要的权重通道，通过缩放等办法降低量化影响。<\/p>\n<p>校准样本不代表所有任务，所以压缩后仍要测目标能力，不能只看文件缩小。<\/p>\n<p><strong>直答：<\/strong> 二者都尝试用数据指导低位量化，降低关键误差；具体取舍看目标模型、校准集、硬件支持与任务结果。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> GPTQ 利用近似二阶信息补偿逐步权重量化误差；AWQ 利用激活统计识别重要权重并做缩放保护。<\/p>\n<p><strong>展开：<\/strong> 两者都需理解校准数据与目标层，不能只凭模型文件名判断实际配置。量化后要测长上下文、代码、中文和安全边界等目标能力。<\/p>\n<p><strong>追问：校准集为何重要？<\/strong> 它代表运行激活分布；只用短英文句子校准，未必适合中文长对话。<\/p>\n<p><strong>易错：<\/strong> 不把校准集用于调参后继续当独立测试集。依据：<a class=\"ref\" href=\"#source-S38\">S38<\/a>、<a class=\"ref\" href=\"#source-S39\">S39<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-X07" type="application/json">{"body":"### 两张卡分别做 10 题和 90 题，不能各占总成绩一半\n\n若一张卡只有 100 个有效 token，另一张有 900 个，目标是所有 token 同权，那么前者应占 10%，后者占 90%。\n\n直接平均两卡各自的平均损失，会错误地让少 token 的卡占一半。分布式训练的求和和分母必须一起考虑。\n\n**直答：** 先确定样本或 token 的权重目标，再跨设备正确汇总损失与数量，避免“平均的平均”造成变长数据权重错误。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 明确全局目标的分子与分母，用有效 token 总数而非盲目平均各卡均值。\n\n**展开：** 一卡 100 个有效 token、另一卡 1000 个，各卡均值等权平均会放大小卡 token 权重。DDP 的梯度平均机制需与 loss 的缩放配合，梯度累积也一样。\n\n**追问：序列平均是不是一定错？** 如果目标本来要每条样本同权就合理；错误在于实现与声称的目标不一致。\n\n**易错：** padding 和截断样本不能被当作有效监督计入分母。关联：RL10。","html":"<h3>两张卡分别做 10 题和 90 题，不能各占总成绩一半<\/h3>\n<p>若一张卡只有 100 个有效 token，另一张有 900 个，目标是所有 token 同权，那么前者应占 10%，后者占 90%。<\/p>\n<p>直接平均两卡各自的平均损失，会错误地让少 token 的卡占一半。分布式训练的求和和分母必须一起考虑。<\/p>\n<p><strong>直答：<\/strong> 先确定样本或 token 的权重目标，再跨设备正确汇总损失与数量，避免“平均的平均”造成变长数据权重错误。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 明确全局目标的分子与分母，用有效 token 总数而非盲目平均各卡均值。<\/p>\n<p><strong>展开：<\/strong> 一卡 100 个有效 token、另一卡 1000 个，各卡均值等权平均会放大小卡 token 权重。DDP 的梯度平均机制需与 loss 的缩放配合，梯度累积也一样。<\/p>\n<p><strong>追问：序列平均是不是一定错？<\/strong> 如果目标本来要每条样本同权就合理；错误在于实现与声称的目标不一致。<\/p>\n<p><strong>易错：<\/strong> padding 和截断样本不能被当作有效监督计入分母。关联：<a class=\"ref\" href=\"#q-RL10\">RL10<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-X08" type="application/json">{"body":"### 显存爆了，先知道是谁占满了柜子\n\n权重过大、序列过长、批次太大、中间激活太多，都可能触发 OOM。不同来源对应不同办法：减批次、累积、重计算、分片、量化或调整长度。\n\n贸然截短所有输入虽然省空间，却可能丢掉关键监督，应同步检查任务影响。\n\n**直答：** 按显存组成定位超额来源，再选择有针对性的资源方案，并验证输入信息与训练目标没有被意外改变。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 先定位是权重状态、激活、序列峰值还是临时缓冲，再选择缩 batch、控长度、重计算、分片或低比特。\n\n**展开：** 记录失败时输入长度、batch、阶段和分配峰值；LoRA 节省优化器状态，却未必解决超长激活。减 batch 后可用正确加权的梯度累积维持目标。\n\n**追问：清空缓存可以根治吗？** 对真正超出容量的活跃张量无效；内存泄漏需找保留计算图、日志张量或未释放引用。\n\n**易错：** 频繁清缓存可能拖慢训练，还掩盖代码问题。","html":"<h3>显存爆了，先知道是谁占满了柜子<\/h3>\n<p>权重过大、序列过长、批次太大、中间激活太多，都可能触发 OOM。不同来源对应不同办法：减批次、累积、重计算、分片、量化或调整长度。<\/p>\n<p>贸然截短所有输入虽然省空间，却可能丢掉关键监督，应同步检查任务影响。<\/p>\n<p><strong>直答：<\/strong> 按显存组成定位超额来源，再选择有针对性的资源方案，并验证输入信息与训练目标没有被意外改变。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 先定位是权重状态、激活、序列峰值还是临时缓冲，再选择缩 batch、控长度、重计算、分片或低比特。<\/p>\n<p><strong>展开：<\/strong> 记录失败时输入长度、batch、阶段和分配峰值；LoRA 节省优化器状态，却未必解决超长激活。减 batch 后可用正确加权的梯度累积维持目标。<\/p>\n<p><strong>追问：清空缓存可以根治吗？<\/strong> 对真正超出容量的活跃张量无效；内存泄漏需找保留计算图、日志张量或未释放引用。<\/p>\n<p><strong>易错：<\/strong> 频繁清缓存可能拖慢训练，还掩盖代码问题。<\/p><\/div><\/details>"}</script>
<script id="data-q-X09" type="application/json">{"body":"### 出卷时学生是旧水平，批改完他已经进步了\n\n异步 rollout 让生成数据和训练同时进行，提高设备利用率；但训练收到的答案可能由较旧版本模型生成，与当前策略有差异。\n\n这种策略滞后会影响更新。需要记录版本、控制滞后程度，并检查概率计算和修正方法。\n\n**直答：** 异步采样提高并行利用率，也带来旧策略数据；需要显式管理版本、延迟与分布差异。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 采样和训练并行提高利用率，但轨迹可能来自较旧参数，更新时要知道对应行为策略。\n\n**展开：** 每条轨迹记录策略版本、生成设置、token 与 logprob；控制队列陈旧程度，必要时丢弃过旧轨迹或做适当纠偏。工具任务越长，滞后越明显。\n\n**追问：只更新模型权重就够了吗？** 采样服务的权重同步、缓存兼容、tokenizer/template 和概率计算也需一致。\n\n**易错：** off-policy 修正不是无代价的万能解决，方差和支持仍限制效果。依据：S66。","html":"<h3>出卷时学生是旧水平，批改完他已经进步了<\/h3>\n<p>异步 rollout 让生成数据和训练同时进行，提高设备利用率；但训练收到的答案可能由较旧版本模型生成，与当前策略有差异。<\/p>\n<p>这种策略滞后会影响更新。需要记录版本、控制滞后程度，并检查概率计算和修正方法。<\/p>\n<p><strong>直答：<\/strong> 异步采样提高并行利用率，也带来旧策略数据；需要显式管理版本、延迟与分布差异。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 采样和训练并行提高利用率，但轨迹可能来自较旧参数，更新时要知道对应行为策略。<\/p>\n<p><strong>展开：<\/strong> 每条轨迹记录策略版本、生成设置、token 与 logprob；控制队列陈旧程度，必要时丢弃过旧轨迹或做适当纠偏。工具任务越长，滞后越明显。<\/p>\n<p><strong>追问：只更新模型权重就够了吗？<\/strong> 采样服务的权重同步、缓存兼容、tokenizer/template 和概率计算也需一致。<\/p>\n<p><strong>易错：<\/strong> off-policy 修正不是无代价的万能解决，方差和支持仍限制效果。依据：<a class=\"ref\" href=\"#source-S66\">S66<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-X10" type="application/json">{"body":"### 存下模型，不一定就能接着同一次训练\n\n若只保存权重，忘了优化器状态、学习率进度、随机状态和数据位置，重新启动可能不像从断点继续。\n\n真正验证恢复，要让中断重启后的短段训练与连续运行比较，而不只是确认文件能够读取。\n\n**直答：** 按用途保存权重及必要训练状态，并实际验证恢复后的行为；“可加载”和“可继续同一训练过程”不同。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 不仅保存权重，还要按恢复目标保存优化器、调度、随机状态、数据游标与分片信息，并实际试一次恢复。\n\n**展开：** “能加载推理”与“能从同一步续训”是不同验收；分布式恢复要检查 world size 改变时支持情况。LoRA 必须记录对应基座 revision。\n\n**追问：恢复后 loss 突变？** 查数据顺序、学习率、优化器状态、精度与损失缩放；不先假定是随机波动。\n\n**易错：** 只把若干 checkpoint 目录列出来不证明它们可用。","html":"<h3>存下模型，不一定就能接着同一次训练<\/h3>\n<p>若只保存权重，忘了优化器状态、学习率进度、随机状态和数据位置，重新启动可能不像从断点继续。<\/p>\n<p>真正验证恢复，要让中断重启后的短段训练与连续运行比较，而不只是确认文件能够读取。<\/p>\n<p><strong>直答：<\/strong> 按用途保存权重及必要训练状态，并实际验证恢复后的行为；“可加载”和“可继续同一训练过程”不同。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 不仅保存权重，还要按恢复目标保存优化器、调度、随机状态、数据游标与分片信息，并实际试一次恢复。<\/p>\n<p><strong>展开：<\/strong> “能加载推理”与“能从同一步续训”是不同验收；分布式恢复要检查 world size 改变时支持情况。LoRA 必须记录对应基座 revision。<\/p>\n<p><strong>追问：恢复后 loss 突变？<\/strong> 查数据顺序、学习率、优化器状态、精度与损失缩放；不先假定是随机波动。<\/p>\n<p><strong>易错：<\/strong> 只把若干 checkpoint 目录列出来不证明它们可用。<\/p><\/div><\/details>"}</script>
<script id="data-q-V01" type="application/json">{"body":"### 让图片和对应文字在同一个“坐标空间”里靠近\n\nCLIP 同时处理图片和文字描述，训练时提高正确配对的相似程度，区分不匹配的配对。这样可以用文字去找相关图片，或比较图片与不同类别描述的匹配。\n\n但“这张图像一只狗”这种整体对应，不自动等于精确理解每个位置、数量和因果关系。\n\n**直答：** CLIP 通过图文配对学习可比较的表示，适合相似性匹配；细粒度定位和推理需要额外验证。\n\n### 进一步：公式、边界与追问\n\n**本章进阶约定与范围：**\n\n定位：发挥驾驶人注意、POMDP、程序化模仿学习与大模型评测的共同优势。重点是可靠性和评测，不把阅读经历包装成 VLA 大规模训练经验。\n\n**技术表述：** 将配对图像和文本映射到相互可匹配的表示空间，通过对比目标区分正确配对与其他组合。\n\n**展开：** 训练通常同时考虑图像到文本和文本到图像的匹配；可用于零样本分类、检索和表征。它并不是直接自回归生成长回答的聊天模型。\n\n**追问：文字描述正确就能精确定位目标吗？** 全局对齐不保证细粒度空间关系、计数或位置准确，需要专门评测和设计。\n\n**易错：** 图文相似度不等于视觉事实正确概率。依据：S40。","html":"<h3>让图片和对应文字在同一个“坐标空间”里靠近<\/h3>\n<p>CLIP 同时处理图片和文字描述，训练时提高正确配对的相似程度，区分不匹配的配对。这样可以用文字去找相关图片，或比较图片与不同类别描述的匹配。<\/p>\n<p>但“这张图像一只狗”这种整体对应，不自动等于精确理解每个位置、数量和因果关系。<\/p>\n<p><strong>直答：<\/strong> CLIP 通过图文配对学习可比较的表示，适合相似性匹配；细粒度定位和推理需要额外验证。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>本章进阶约定与范围：<\/strong><\/p>\n<p>定位：发挥驾驶人注意、POMDP、程序化模仿学习与大模型评测的共同优势。重点是可靠性和评测，不把阅读经历包装成 VLA 大规模训练经验。<\/p>\n<p><strong>技术表述：<\/strong> 将配对图像和文本映射到相互可匹配的表示空间，通过对比目标区分正确配对与其他组合。<\/p>\n<p><strong>展开：<\/strong> 训练通常同时考虑图像到文本和文本到图像的匹配；可用于零样本分类、检索和表征。它并不是直接自回归生成长回答的聊天模型。<\/p>\n<p><strong>追问：文字描述正确就能精确定位目标吗？<\/strong> 全局对齐不保证细粒度空间关系、计数或位置准确，需要专门评测和设计。<\/p>\n<p><strong>易错：<\/strong> 图文相似度不等于视觉事实正确概率。依据：<a class=\"ref\" href=\"#source-S40\">S40<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-V02" type="application/json">{"body":"### 给语言模型接上能处理图片的输入通道\n\n常见 VLM 先用视觉编码器把图片变成数字特征，再通过连接模块转成语言模型能使用的表示，与文字一起处理。\n\n就像把图像内容转换成可读的内部材料，但不是简单把图片先人工描述成一句话。\n\n**直答：** 典型 VLM 由视觉编码、连接模块和语言处理部分协作，让模型把图像信息用于回答；具体连接与训练方式各不相同。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 视觉编码器提取图像表示，通过投影/连接模块转换成语言模型可处理的视觉 token，再用图文数据对齐与指令训练。\n\n**展开：** 视觉分辨率、patch 数、连接模块和是否冻结视觉编码器影响成本与能力。视频还需时间采样、帧间关系和长上下文管理。\n\n**追问：多看几帧一定更好？** 可能增加关键信息，也可能引入重复、时延与截断；需要比较帧率、分辨率和时间覆盖。\n\n**易错：** VLM 的视觉 token 数不等于原始像素数。依据：S41。","html":"<h3>给语言模型接上能处理图片的输入通道<\/h3>\n<p>常见 VLM 先用视觉编码器把图片变成数字特征，再通过连接模块转成语言模型能使用的表示，与文字一起处理。<\/p>\n<p>就像把图像内容转换成可读的内部材料，但不是简单把图片先人工描述成一句话。<\/p>\n<p><strong>直答：<\/strong> 典型 VLM 由视觉编码、连接模块和语言处理部分协作，让模型把图像信息用于回答；具体连接与训练方式各不相同。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 视觉编码器提取图像表示，通过投影/连接模块转换成语言模型可处理的视觉 token，再用图文数据对齐与指令训练。<\/p>\n<p><strong>展开：<\/strong> 视觉分辨率、patch 数、连接模块和是否冻结视觉编码器影响成本与能力。视频还需时间采样、帧间关系和长上下文管理。<\/p>\n<p><strong>追问：多看几帧一定更好？<\/strong> 可能增加关键信息，也可能引入重复、时延与截断；需要比较帧率、分辨率和时间覆盖。<\/p>\n<p><strong>易错：<\/strong> VLM 的视觉 token 数不等于原始像素数。依据：<a class=\"ref\" href=\"#source-S41\">S41<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-V03" type="application/json">{"body":"### 它真看了红灯，还是靠常识猜到“应该停车”？\n\n视觉 grounding 关注回答是否对应图片里的具体证据。把红灯改为绿灯，若答案仍完全不变，就值得检查模型是否忽略了图像。\n\n还可以遮住目标、打乱图片与问题、改变物体位置，观察回答变化是否合理；单次变化也要排除其他因素。\n\n**直答：** grounding 是语言判断与实际视觉证据的对应关系，应用定位和受控图像干预验证，不能只看答案是否听起来合理。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 回答或决策是否真正依据当前图像，而不是语言常识或数据集偏差。\n\n**展开：** 做干净图、模糊/遮挡、删除图像、替换图像、矛盾文本先验对照；比较关键对象、关系和危险动作判断。反事实图应保证除目标因素外尽量一致。\n\n**追问：文本-only 仍答对说明什么？** 可能题目能靠常识猜对，提示泄漏，或数据不平衡，不能直接证明模型“看得很好”。\n\n**易错：** 合理的解释不是视觉依赖的充分证据。依据：S42。","html":"<h3>它真看了红灯，还是靠常识猜到“应该停车”？<\/h3>\n<p>视觉 grounding 关注回答是否对应图片里的具体证据。把红灯改为绿灯，若答案仍完全不变，就值得检查模型是否忽略了图像。<\/p>\n<p>还可以遮住目标、打乱图片与问题、改变物体位置，观察回答变化是否合理；单次变化也要排除其他因素。<\/p>\n<p><strong>直答：<\/strong> grounding 是语言判断与实际视觉证据的对应关系，应用定位和受控图像干预验证，不能只看答案是否听起来合理。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 回答或决策是否真正依据当前图像，而不是语言常识或数据集偏差。<\/p>\n<p><strong>展开：<\/strong> 做干净图、模糊/遮挡、删除图像、替换图像、矛盾文本先验对照；比较关键对象、关系和危险动作判断。反事实图应保证除目标因素外尽量一致。<\/p>\n<p><strong>追问：文本-only 仍答对说明什么？<\/strong> 可能题目能靠常识猜对，提示泄漏，或数据不平衡，不能直接证明模型“看得很好”。<\/p>\n<p><strong>易错：<\/strong> 合理的解释不是视觉依赖的充分证据。依据：<a class=\"ref\" href=\"#source-S42\">S42<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-V04" type="application/json">{"body":"### 会解释路况，和会输出动作，还差一层\n\nVLM 使用视觉与语言，可能回答“前方有障碍”；VLA 进一步把感知与语言条件连接到动作输出，例如机械臂动作或驾驶控制相关表示。\n\n动作会影响环境，错误也会累积，所以还要检查执行约束、反馈和连续行为。\n\n**直答：** VLA 在视觉语言理解之外面向动作生成，评价需要关注动作可执行性和环境中的实际后果。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** VLM 主要连接视觉与语言理解/生成；VLA 进一步将感知、语言与可执行动作输出或动作策略连接。\n\n**展开：** 动作可以离散 token、连续控制或轨迹，具体需看模型。自然语言“向左”与可执行转角、速度和时间轨迹之间还有控制与约束。\n\n**追问：为什么语言解释不能直接作为控制器？** 时延、单位、动态可行性、噪声和闭环稳定都需处理。\n\n**易错：** action token 并不天然满足车辆运动学与安全约束。依据：S41、S46。","html":"<h3>会解释路况，和会输出动作，还差一层<\/h3>\n<p>VLM 使用视觉与语言，可能回答“前方有障碍”；VLA 进一步把感知与语言条件连接到动作输出，例如机械臂动作或驾驶控制相关表示。<\/p>\n<p>动作会影响环境，错误也会累积，所以还要检查执行约束、反馈和连续行为。<\/p>\n<p><strong>直答：<\/strong> VLA 在视觉语言理解之外面向动作生成，评价需要关注动作可执行性和环境中的实际后果。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> VLM 主要连接视觉与语言理解/生成；VLA 进一步将感知、语言与可执行动作输出或动作策略连接。<\/p>\n<p><strong>展开：<\/strong> 动作可以离散 token、连续控制或轨迹，具体需看模型。自然语言“向左”与可执行转角、速度和时间轨迹之间还有控制与约束。<\/p>\n<p><strong>追问：为什么语言解释不能直接作为控制器？<\/strong> 时延、单位、动态可行性、噪声和闭环稳定都需处理。<\/p>\n<p><strong>易错：<\/strong> action token 并不天然满足车辆运动学与安全约束。依据：<a class=\"ref\" href=\"#source-S41\">S41<\/a>、<a class=\"ref\" href=\"#source-S46\">S46<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-V05" type="application/json">{"body":"### 同一个路口，可能有不止一条合理路线\n\n如果左绕和右绕都安全，直接把两条路线取平均，可能恰好撞上中间障碍。这里的“多模态轨迹”是多种合理行为模式，不是说同时有图片和文字。\n\n扩散规划通过逐步修正候选轨迹表示，可以表达多种可能，但候选仍要满足安全与动力学约束。\n\n**直答：** 扩散规划能够建模多种可行轨迹选择，价值在于表达行为分布；不能因轨迹像样就省掉执行与安全检查。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 同一个场景可能有多条合理未来，生成式分布可表示候选路径，而简单均方误差回归可能平均出不合理轨迹。\n\n**展开：** DDPM 类训练从加噪样本预测噪声/干净数据；规划时将场景作为条件，逐步生成候选。真实规划还需地图、动力学与交互约束。\n\n**追问：为什么不能一味增加去噪步数？** 实时系统有严格延迟预算；更多步骤与候选要换来可测的安全/完成率收益。\n\n**易错：** 多样不等于高质量，危险候选也会增加多样性。依据：S47、S45。","html":"<h3>同一个路口，可能有不止一条合理路线<\/h3>\n<p>如果左绕和右绕都安全，直接把两条路线取平均，可能恰好撞上中间障碍。这里的“多模态轨迹”是多种合理行为模式，不是说同时有图片和文字。<\/p>\n<p>扩散规划通过逐步修正候选轨迹表示，可以表达多种可能，但候选仍要满足安全与动力学约束。<\/p>\n<p><strong>直答：<\/strong> 扩散规划能够建模多种可行轨迹选择，价值在于表达行为分布；不能因轨迹像样就省掉执行与安全检查。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 同一个场景可能有多条合理未来，生成式分布可表示候选路径，而简单均方误差回归可能平均出不合理轨迹。<\/p>\n<p><strong>展开：<\/strong> DDPM 类训练从加噪样本预测噪声/干净数据；规划时将场景作为条件，逐步生成候选。真实规划还需地图、动力学与交互约束。<\/p>\n<p><strong>追问：为什么不能一味增加去噪步数？<\/strong> 实时系统有严格延迟预算；更多步骤与候选要换来可测的安全/完成率收益。<\/p>\n<p><strong>易错：<\/strong> 多样不等于高质量，危险候选也会增加多样性。依据：<a class=\"ref\" href=\"#source-S47\">S47<\/a>、<a class=\"ref\" href=\"#source-S45\">S45<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-V06" type="application/json">{"body":"### 能生成很多路线，还得来得及用于驾驶\n\n通用扩散往往需要多轮去噪。驾驶规划关注实时性，因此 DiffusionDrive 研究怎样用针对任务的设计减少生成开销，同时保持轨迹质量。\n\n介绍它时先说明改变了哪些去噪、初始化或候选处理环节，再看对应评测，不把图像生成里的优势直接外推到驾驶。\n\n**直答：** 该工作的价值要从轨迹分布建模与快速生成的结合解释，并保留其具体模型、步骤和评测条件。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 用多模态先验锚点与截断扩散安排，减少从纯噪声开始的长去噪过程，面向实时多候选轨迹生成。\n\n**展开：** 讨论“起点更接近有意义轨迹”“条件信息如何注入”“速度与多样性如何验证”。论文的步数降低、FPS 和 PDMS 都有具体模型与硬件条件。\n\n**追问：10 倍减少步数等于端到端 10 倍加速吗？** 不等，视觉编码、后处理与调度可能占大量时间。\n\n**易错：** 不将论文特定测试的实时表现写成任何车辆上的部署保证。依据：S45。","html":"<h3>能生成很多路线，还得来得及用于驾驶<\/h3>\n<p>通用扩散往往需要多轮去噪。驾驶规划关注实时性，因此 DiffusionDrive 研究怎样用针对任务的设计减少生成开销，同时保持轨迹质量。<\/p>\n<p>介绍它时先说明改变了哪些去噪、初始化或候选处理环节，再看对应评测，不把图像生成里的优势直接外推到驾驶。<\/p>\n<p><strong>直答：<\/strong> 该工作的价值要从轨迹分布建模与快速生成的结合解释，并保留其具体模型、步骤和评测条件。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 用多模态先验锚点与截断扩散安排，减少从纯噪声开始的长去噪过程，面向实时多候选轨迹生成。<\/p>\n<p><strong>展开：<\/strong> 讨论“起点更接近有意义轨迹”“条件信息如何注入”“速度与多样性如何验证”。论文的步数降低、FPS 和 PDMS 都有具体模型与硬件条件。<\/p>\n<p><strong>追问：10 倍减少步数等于端到端 10 倍加速吗？<\/strong> 不等，视觉编码、后处理与调度可能占大量时间。<\/p>\n<p><strong>易错：<\/strong> 不将论文特定测试的实时表现写成任何车辆上的部署保证。依据：<a class=\"ref\" href=\"#source-S45\">S45<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-V07" type="application/json">{"body":"### 先在脑中试走一步，再决定真实怎么走\n\n世界模型预测“现在这样，执行这个动作之后，环境可能变成什么样”。规划器可以先模拟几种动作的后果，再选择。\n\n但模拟误差会随着多步预测积累，尤其在少见场景中。因此“想象得合理”不能代替真实或更可靠环境中的验证。\n\n**直答：** 世界模型提供动作后果的预测，支持规划和学习；使用时需要考虑预测偏差、长时间累积误差与验证环境。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 预测行动后的未来状态或表征，让规划能比较潜在后果；也可提供未来预测的自监督信号。\n\n**展开：** 世界模型不一定生成高分辨率视频，也可预测 BEV、占用、潜变量和奖励。关键是预测条件里是否含动作，以及策略是否真的利用未来信息。\n\n**追问：画面好看就能规划更好吗？** 不一定。物理关系、交互反应与长时误差比视觉观感更关键；做去掉未来信息、替换随机 latent 和改变行动的消融。\n\n**易错：** 无动作条件的未来预测不能自动回答“如果我这样开会发生什么”。依据：S77；规划迁移部分为工程分析。","html":"<h3>先在脑中试走一步，再决定真实怎么走<\/h3>\n<p>世界模型预测“现在这样，执行这个动作之后，环境可能变成什么样”。规划器可以先模拟几种动作的后果，再选择。<\/p>\n<p>但模拟误差会随着多步预测积累，尤其在少见场景中。因此“想象得合理”不能代替真实或更可靠环境中的验证。<\/p>\n<p><strong>直答：<\/strong> 世界模型提供动作后果的预测，支持规划和学习；使用时需要考虑预测偏差、长时间累积误差与验证环境。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 预测行动后的未来状态或表征，让规划能比较潜在后果；也可提供未来预测的自监督信号。<\/p>\n<p><strong>展开：<\/strong> 世界模型不一定生成高分辨率视频，也可预测 BEV、占用、潜变量和奖励。关键是预测条件里是否含动作，以及策略是否真的利用未来信息。<\/p>\n<p><strong>追问：画面好看就能规划更好吗？<\/strong> 不一定。物理关系、交互反应与长时误差比视觉观感更关键；做去掉未来信息、替换随机 latent 和改变行动的消融。<\/p>\n<p><strong>易错：<\/strong> 无动作条件的未来预测不能自动回答“如果我这样开会发生什么”。依据：<a class=\"ref\" href=\"#source-S77\">S77<\/a>；规划迁移部分为工程分析。<\/p><\/div><\/details>"}</script>
<script id="data-q-V08" type="application/json">{"body":"### 看录像给建议，和真的接手方向盘\n\n开环评测常比较模型输出与记录数据，但模型动作不会改变后续世界；闭环评测会让动作进入环境，再观察新状态并继续行动。\n\n一次小偏差在录像题上可能不显眼，真正连续执行后却可能让车辆位置越来越偏，这就是闭环验证的重要性。\n\n**直答：** 开环主要检查给定观测下的输出，闭环检查动作改变环境后的连续行为；二者能证明的可靠性范围不同。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 开环通常在固定记录上评价预测；闭环把模型动作送入环境，后续观察受动作影响，错误可能累积。\n\n**展开：** 多条合理轨迹使单一专家 L2 不充分；小偏差也可能在下一步改变相对位置，最终导致碰撞或停滞。指标需覆盖完成、碰撞、违规、舒适与恢复。\n\n**追问：闭环仿真就是真实安全？** 仿真仍有域差、行为模型偏差和覆盖限制，需要分层验证。\n\n**易错：** 不要把所有带“simulation”的评价都称为完全反应式闭环。依据：S43、S44。","html":"<h3>看录像给建议，和真的接手方向盘<\/h3>\n<p>开环评测常比较模型输出与记录数据，但模型动作不会改变后续世界；闭环评测会让动作进入环境，再观察新状态并继续行动。<\/p>\n<p>一次小偏差在录像题上可能不显眼，真正连续执行后却可能让车辆位置越来越偏，这就是闭环验证的重要性。<\/p>\n<p><strong>直答：<\/strong> 开环主要检查给定观测下的输出，闭环检查动作改变环境后的连续行为；二者能证明的可靠性范围不同。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 开环通常在固定记录上评价预测；闭环把模型动作送入环境，后续观察受动作影响，错误可能累积。<\/p>\n<p><strong>展开：<\/strong> 多条合理轨迹使单一专家 L2 不充分；小偏差也可能在下一步改变相对位置，最终导致碰撞或停滞。指标需覆盖完成、碰撞、违规、舒适与恢复。<\/p>\n<p><strong>追问：闭环仿真就是真实安全？<\/strong> 仿真仍有域差、行为模型偏差和覆盖限制，需要分层验证。<\/p>\n<p><strong>易错：<\/strong> 不要把所有带“simulation”的评价都称为完全反应式闭环。依据：<a class=\"ref\" href=\"#source-S43\">S43<\/a>、<a class=\"ref\" href=\"#source-S44\">S44<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-V09" type="application/json">{"body":"### 不同考场，不能只比总分高低\n\n原始 NAVSIM 的非反应式评测有其仿真和评分设计，但周围交通不会像完整交互环境那样响应自车；Bench2Drive 等闭环设置考查另一类连续交互表现。\n\n因此要逐项看环境是否响应、任务覆盖、传感器、动作与计算条件，而不是看到“驾驶基准”就认为等价。\n\n**直答：** 先比较评测环境与反馈方式，再比较任务和指标；原始 NAVSIM 的边界应与完整反应式闭环明确区分。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 原始 NAVSIM 用数据驱动、非反应式仿真提供比纯轨迹误差更丰富的评测；Bench2Drive 在交互仿真场景中关注多能力闭环行为。\n\n**展开：** NAVSIM 的周围环境不随被测策略任意响应，因此不能等同全反应式真实交互。两者的数据、协议、指标和版本不同，不把分数直接横比。\n\n**追问：同名 PDMS 为什么不能随意比较？** 配置、数据版本、过滤、传感器和模型骨干变化可能影响难度；需固定完整协议。\n\n**易错：** 2026 新论文引用 NAVSIM v2 时，应读其确切评价配置，不能沿用早期标签。依据：S43、S44。","html":"<h3>不同考场，不能只比总分高低<\/h3>\n<p>原始 NAVSIM 的非反应式评测有其仿真和评分设计，但周围交通不会像完整交互环境那样响应自车；Bench2Drive 等闭环设置考查另一类连续交互表现。<\/p>\n<p>因此要逐项看环境是否响应、任务覆盖、传感器、动作与计算条件，而不是看到“驾驶基准”就认为等价。<\/p>\n<p><strong>直答：<\/strong> 先比较评测环境与反馈方式，再比较任务和指标；原始 NAVSIM 的边界应与完整反应式闭环明确区分。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 原始 NAVSIM 用数据驱动、非反应式仿真提供比纯轨迹误差更丰富的评测；Bench2Drive 在交互仿真场景中关注多能力闭环行为。<\/p>\n<p><strong>展开：<\/strong> NAVSIM 的周围环境不随被测策略任意响应，因此不能等同全反应式真实交互。两者的数据、协议、指标和版本不同，不把分数直接横比。<\/p>\n<p><strong>追问：同名 PDMS 为什么不能随意比较？<\/strong> 配置、数据版本、过滤、传感器和模型骨干变化可能影响难度；需固定完整协议。<\/p>\n<p><strong>易错：<\/strong> 2026 新论文引用 NAVSIM v2 时，应读其确切评价配置，不能沿用早期标签。依据：<a class=\"ref\" href=\"#source-S43\">S43<\/a>、<a class=\"ref\" href=\"#source-S44\">S44<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-V10" type="application/json">{"body":"### 同一个驾驶场景，比较两条候选路线\n\n偏好优化的对象可以从文本回答换成轨迹：在相同场景下，一条更安全或舒适，另一条较差。模型学习增加较优轨迹的生成倾向。\n\n但轨迹概率怎样定义、偏好由谁给出、安全标准是否可靠，都需要按模型和任务重新处理，不能只把文本变量换个名字。\n\n**直答：** 驾驶 DPO 需要同场景轨迹偏好及相应概率模型，并联合验证安全、舒适和闭环后果。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 将同场景的两段回答换成两条轨迹，偏好由安全、规则、进度、舒适和类人性构造。\n\n**展开：** 轨迹的概率或评分定义依生成模型；连续动作不能不经推导就套 token logprob。偏好可能多目标冲突，例如安全保守与通行效率。\n\n**追问：人类轨迹一定是最安全 chosen？** 不一定，人类示范也可能违反规则或依赖不可见信息；需结合可靠规则与交互评测。\n\n**易错：** DriveDPO 的 NAVSIM 分数不是实车安全证明。依据：S46。","html":"<h3>同一个驾驶场景，比较两条候选路线<\/h3>\n<p>偏好优化的对象可以从文本回答换成轨迹：在相同场景下，一条更安全或舒适，另一条较差。模型学习增加较优轨迹的生成倾向。<\/p>\n<p>但轨迹概率怎样定义、偏好由谁给出、安全标准是否可靠，都需要按模型和任务重新处理，不能只把文本变量换个名字。<\/p>\n<p><strong>直答：<\/strong> 驾驶 DPO 需要同场景轨迹偏好及相应概率模型，并联合验证安全、舒适和闭环后果。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 将同场景的两段回答换成两条轨迹，偏好由安全、规则、进度、舒适和类人性构造。<\/p>\n<p><strong>展开：<\/strong> 轨迹的概率或评分定义依生成模型；连续动作不能不经推导就套 token logprob。偏好可能多目标冲突，例如安全保守与通行效率。<\/p>\n<p><strong>追问：人类轨迹一定是最安全 chosen？<\/strong> 不一定，人类示范也可能违反规则或依赖不可见信息；需结合可靠规则与交互评测。<\/p>\n<p><strong>易错：<\/strong> DriveDPO 的 NAVSIM 分数不是实车安全证明。依据：<a class=\"ref\" href=\"#source-S46\">S46<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-V11" type="application/json">{"body":"### 开车时，你并不知道所有车主心里在想什么\n\n普通 MDP 假设决策者拿到的状态足以描述当前情况；POMDP 允许只能看到部分信息，例如看见对方车速，却不知道对方是否准备让行。\n\n模型可以维护一个“信念”：根据已见信息，对可能隐藏状态分配概率，再用新观察更新。\n\n**直答：** POMDP 把状态不完全可见纳入建模，通过观测和历史形成对隐藏状态的判断，再据此决策。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** POMDP 无法直接看到完整环境状态，需要根据观察和历史维护 belief，即对隐藏状态的概率分布。\n\n$$b_{t+1}(s')\\propto O(o_{t+1}|s',a_t)\\sum_s T(s'|s,a_t)b_t(s).$$\n\n**展开：** 驾驶员真实注意、意图和接管准备可能不可直接观测，只能从视线、操作与场景推断。belief 更新结合状态转移与新观察。\n\n**追问：和 Agent 记忆有什么联系？** 两者都要基于不完整历史推断当前状态，但文本摘要不自动等于校准的 belief。\n\n**易错：** 不要把隐藏状态当训练时每一步都可获得的真标签。依据：S73。","html":"<h3>开车时，你并不知道所有车主心里在想什么<\/h3>\n<p>普通 MDP 假设决策者拿到的状态足以描述当前情况；POMDP 允许只能看到部分信息，例如看见对方车速，却不知道对方是否准备让行。<\/p>\n<p>模型可以维护一个“信念”：根据已见信息，对可能隐藏状态分配概率，再用新观察更新。<\/p>\n<p><strong>直答：<\/strong> POMDP 把状态不完全可见纳入建模，通过观测和历史形成对隐藏状态的判断，再据此决策。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> POMDP 无法直接看到完整环境状态，需要根据观察和历史维护 belief，即对隐藏状态的概率分布。<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>b<\/mi><mrow><mi>t<\/mi><mo>+<\/mo><mn>1<\/mn><\/mrow><\/msub><mo stretchy=\"false\">(<\/mo><msup><mi>s<\/mi><mi>′<\/mi><\/msup><mo stretchy=\"false\">)<\/mo><mo>∝<\/mo><mi>O<\/mi><mo stretchy=\"false\">(<\/mo><msub><mi>o<\/mi><mrow><mi>t<\/mi><mo>+<\/mo><mn>1<\/mn><\/mrow><\/msub><mo stretchy=\"false\">|<\/mo><msup><mi>s<\/mi><mi>′<\/mi><\/msup><mo>,<\/mo><msub><mi>a<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><munder><mo>∑<\/mo><mi>s<\/mi><\/munder><mi>T<\/mi><mo stretchy=\"false\">(<\/mo><msup><mi>s<\/mi><mi>′<\/mi><\/msup><mo stretchy=\"false\">|<\/mo><mi>s<\/mi><mo>,<\/mo><msub><mi>a<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">)<\/mo><msub><mi>b<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>s<\/mi><mo stretchy=\"false\">)<\/mo><mo>.<\/mo><\/mrow><\/math><\/div>\n<p><strong>展开：<\/strong> 驾驶员真实注意、意图和接管准备可能不可直接观测，只能从视线、操作与场景推断。belief 更新结合状态转移与新观察。<\/p>\n<p><strong>追问：和 Agent 记忆有什么联系？<\/strong> 两者都要基于不完整历史推断当前状态，但文本摘要不自动等于校准的 belief。<\/p>\n<p><strong>易错：<\/strong> 不要把隐藏状态当训练时每一步都可获得的真标签。依据：<a class=\"ref\" href=\"#source-S73\">S73<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-V12" type="application/json">{"body":"### 不知道驾驶风格，怎么估计它的行为规律？\n\n假设观察了车速与让行行为，却不知道每段数据属于“谨慎”还是“激进”风格。EM 交替做两件事：先用当前参数估计隐藏风格的可能性，再按这些可能性更新行为参数。\n\n像先暂时给作业分组，再根据分组改统计，反复迭代。这里的风格只是示例，真实隐变量取决于研究设定。\n\n**直答：** EM 在隐藏变量不直接可见时，交替估计隐变量分布与更新参数；结果受建模假设和初始化影响。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 对含隐变量的模型，交替估计隐变量后验与更新模型参数。\n\n**展开：** E 步在当前参数下计算隐变量的后验或足够统计量；M 步最大化期望完整数据 log 似然。适用于隐含意图、规则选择等建模，但具体变量必须按本人论文说明。\n\n**追问：EM 保证全局最优吗？** 一般不保证；在标准精确 E/M 条件下可保证似然不降，但可能落入局部解。近似步骤还需检查性质是否保留。\n\n**易错：** 不把任何“交替训练”都叫 EM。依据：S74。","html":"<h3>不知道驾驶风格，怎么估计它的行为规律？<\/h3>\n<p>假设观察了车速与让行行为，却不知道每段数据属于“谨慎”还是“激进”风格。EM 交替做两件事：先用当前参数估计隐藏风格的可能性，再按这些可能性更新行为参数。<\/p>\n<p>像先暂时给作业分组，再根据分组改统计，反复迭代。这里的风格只是示例，真实隐变量取决于研究设定。<\/p>\n<p><strong>直答：<\/strong> EM 在隐藏变量不直接可见时，交替估计隐变量分布与更新参数；结果受建模假设和初始化影响。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 对含隐变量的模型，交替估计隐变量后验与更新模型参数。<\/p>\n<p><strong>展开：<\/strong> E 步在当前参数下计算隐变量的后验或足够统计量；M 步最大化期望完整数据 log 似然。适用于隐含意图、规则选择等建模，但具体变量必须按本人论文说明。<\/p>\n<p><strong>追问：EM 保证全局最优吗？<\/strong> 一般不保证；在标准精确 E/M 条件下可保证似然不降，但可能落入局部解。近似步骤还需检查性质是否保留。<\/p>\n<p><strong>易错：<\/strong> 不把任何“交替训练”都叫 EM。依据：<a class=\"ref\" href=\"#source-S74\">S74<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-V13" type="application/json">{"body":"### 不只模仿动作，还尝试得到能检查的规则\n\n程序化模仿学习希望用某种程序或规则结构表达行为，例如哪些条件触发让行、何时切换决策。这样更方便检查逻辑、解释失败。\n\n但人的行为不一定能被简单规则完整描述，可解释性也不自动保证规则正确。\n\n**直答：** 用可检查的结构学习或描述行为，有助于解释和测试；需要验证规则覆盖、表达能力与实际行为质量。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 用带结构的规则或程序表示策略，在拟合行为的同时提升可解释性与可检查性。\n\n**展开：** 可展示触发条件、时间关系与规则组合，便于分析“何时看哪里”“何时提示或接管”。价值需用准确性、复杂度、稳定性和人因效用共同衡量。\n\n**追问：规则可读就等于符合真实心理机制吗？** 不等，可能只是可解释的拟合；机制解释需要额外实验。\n\n**易错：** 报告称已有论文和专利，但具体作者贡献、算法细节与结果仍须本人原文和材料支撑。","html":"<h3>不只模仿动作，还尝试得到能检查的规则<\/h3>\n<p>程序化模仿学习希望用某种程序或规则结构表达行为，例如哪些条件触发让行、何时切换决策。这样更方便检查逻辑、解释失败。<\/p>\n<p>但人的行为不一定能被简单规则完整描述，可解释性也不自动保证规则正确。<\/p>\n<p><strong>直答：<\/strong> 用可检查的结构学习或描述行为，有助于解释和测试；需要验证规则覆盖、表达能力与实际行为质量。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 用带结构的规则或程序表示策略，在拟合行为的同时提升可解释性与可检查性。<\/p>\n<p><strong>展开：<\/strong> 可展示触发条件、时间关系与规则组合，便于分析“何时看哪里”“何时提示或接管”。价值需用准确性、复杂度、稳定性和人因效用共同衡量。<\/p>\n<p><strong>追问：规则可读就等于符合真实心理机制吗？<\/strong> 不等，可能只是可解释的拟合；机制解释需要额外实验。<\/p>\n<p><strong>易错：<\/strong> 报告称已有论文和专利，但具体作者贡献、算法细节与结果仍须本人原文和材料支撑。<\/p><\/div><\/details>"}</script>
<script id="data-q-V14" type="application/json">{"body":"### 重建场景、生成训练图、预测未来，各做一件事\n\n3D Gaussian Splatting 用许多带位置、形状和颜色等信息的高斯表示来渲染场景；重建或生成的场景可帮助制作训练数据。\n\n世界模型则还要考虑动作与时间下的变化。画面逼真，不代表交通反应和危险情形也足够真实。\n\n**直答：** 3D 表示可支持渲染与数据生成，世界模型关注动态演化；连接使用时分别验证视觉质量、行为真实性和训练迁移效果。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 3DGS 等表示可重建与渲染场景，生成模型或世界模型可扩展场景变化，最终目标是补足训练和评测中的稀缺条件。\n\n**展开：** 合成样本需保持相机、对象运动、地图、控制与标注的一致性。覆盖长尾交互比只追求逼真截图更有实际价值。\n\n**追问：合成数据如何证明有效？** 固定真实训练数据与预算，增加合成组；在独立真实场景测性能与退化，排除资产或模板泄漏。\n\n**易错：** FID 改善不直接证明闭环驾驶改善。依据：S75。","html":"<h3>重建场景、生成训练图、预测未来，各做一件事<\/h3>\n<p>3D Gaussian Splatting 用许多带位置、形状和颜色等信息的高斯表示来渲染场景；重建或生成的场景可帮助制作训练数据。<\/p>\n<p>世界模型则还要考虑动作与时间下的变化。画面逼真，不代表交通反应和危险情形也足够真实。<\/p>\n<p><strong>直答：<\/strong> 3D 表示可支持渲染与数据生成，世界模型关注动态演化；连接使用时分别验证视觉质量、行为真实性和训练迁移效果。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 3DGS 等表示可重建与渲染场景，生成模型或世界模型可扩展场景变化，最终目标是补足训练和评测中的稀缺条件。<\/p>\n<p><strong>展开：<\/strong> 合成样本需保持相机、对象运动、地图、控制与标注的一致性。覆盖长尾交互比只追求逼真截图更有实际价值。<\/p>\n<p><strong>追问：合成数据如何证明有效？<\/strong> 固定真实训练数据与预算，增加合成组；在独立真实场景测性能与退化，排除资产或模板泄漏。<\/p>\n<p><strong>易错：<\/strong> FID 改善不直接证明闭环驾驶改善。依据：<a class=\"ref\" href=\"#source-S75\">S75<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-V15" type="application/json">{"body":"### 从能证明的小问题切入\n\n例如研究驾驶问答是否真正依赖图像：固定问题，改变信号灯或关键障碍，检查答案变化、危险建议和误判原因。\n\n这个小课题能把视觉、人因理解和模型评测连接起来。范围明确、对照干净，比一下子声称训练完整自动驾驶大模型更容易形成可信证据。\n\n**直答：** 从与已有研究相连的可靠性问题切入，定义可控干预、风险指标和对照，用实际完成的证据证明迁移能力。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 从 VLM 视觉可靠性与人因决策评测入手，把已有驾驶理解与大模型安全评测经验结合。\n\n**展开：** 用驾驶图像构造干净、模糊、遮挡、缺图、误导文本组；标注关键对象与危险动作建议，分别评解释与行为。结合注意/接管问题，分析哪些视觉遗漏最影响风险。\n\n**追问：为什么优先评测而不是训练大 VLA？** 与现有证据、预算和可交付周期更匹配；后续再用失败集推动适配或偏好学习。\n\n**易错：** 数据规模、运行结果和指标必须真实填入，不把方案写成已完成。依据：S42；岗位建议。","html":"<h3>从能证明的小问题切入<\/h3>\n<p>例如研究驾驶问答是否真正依赖图像：固定问题，改变信号灯或关键障碍，检查答案变化、危险建议和误判原因。<\/p>\n<p>这个小课题能把视觉、人因理解和模型评测连接起来。范围明确、对照干净，比一下子声称训练完整自动驾驶大模型更容易形成可信证据。<\/p>\n<p><strong>直答：<\/strong> 从与已有研究相连的可靠性问题切入，定义可控干预、风险指标和对照，用实际完成的证据证明迁移能力。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 从 VLM 视觉可靠性与人因决策评测入手，把已有驾驶理解与大模型安全评测经验结合。<\/p>\n<p><strong>展开：<\/strong> 用驾驶图像构造干净、模糊、遮挡、缺图、误导文本组；标注关键对象与危险动作建议，分别评解释与行为。结合注意/接管问题，分析哪些视觉遗漏最影响风险。<\/p>\n<p><strong>追问：为什么优先评测而不是训练大 VLA？<\/strong> 与现有证据、预算和可交付周期更匹配；后续再用失败集推动适配或偏好学习。<\/p>\n<p><strong>易错：<\/strong> 数据规模、运行结果和指标必须真实填入，不把方案写成已完成。依据：<a class=\"ref\" href=\"#source-S42\">S42<\/a>；岗位建议。<\/p><\/div><\/details>"}</script>
<script id="data-q-B01" type="application/json">{"body":"### 先算分，再变成属于某一类的概率\n\n逻辑回归把输入特征加权求和，再用 sigmoid 转成 0 到 1 的数。例如根据若干文本特征估计是否属于某类别，最后按阈值分类。\n\n“回归”出现在名称里，不妨碍它用于分类；重点看模型输出和训练目标。\n\n**直答：** 逻辑回归用线性特征得分建模类别概率，再根据阈值决策，是常见、可解释的分类基线。\n\n### 进一步：公式、边界与追问\n\n**本章进阶约定与范围：**\n\n定位：为通用算法面试补底，也帮助你证明使用大模型的必要性。不要丢掉简单、便宜且可解释的强基线。\n\n**技术表述：** 它对类别的 log-odds 做线性建模，再经 sigmoid 转成概率。\n\n$$\\log\\frac{p}{1-p}=w^\\top x+b,\\quad p=\\sigma(w^\\top x+b).$$\n\n**展开：** 用二元交叉熵训练，决策边界在特征空间中为超平面。加入 n-gram、非线性特征后，可处理原输入上的复杂模式。\n\n**追问：输出是否天然校准？** 在模型设定与数据条件匹配时有优势，但现实数据偏移和正则化仍会影响校准。\n\n**易错：** 不要把类别不均衡的阈值固定为 0.5 当作业务最优。","html":"<h3>先算分，再变成属于某一类的概率<\/h3>\n<p>逻辑回归把输入特征加权求和，再用 sigmoid 转成 0 到 1 的数。例如根据若干文本特征估计是否属于某类别，最后按阈值分类。<\/p>\n<p>“回归”出现在名称里，不妨碍它用于分类；重点看模型输出和训练目标。<\/p>\n<p><strong>直答：<\/strong> 逻辑回归用线性特征得分建模类别概率，再根据阈值决策，是常见、可解释的分类基线。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>本章进阶约定与范围：<\/strong><\/p>\n<p>定位：为通用算法面试补底，也帮助你证明使用大模型的必要性。不要丢掉简单、便宜且可解释的强基线。<\/p>\n<p><strong>技术表述：<\/strong> 它对类别的 log-odds 做线性建模，再经 sigmoid 转成概率。<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>log<\/mi><mfrac><mrow><mi>p<\/mi><\/mrow><mrow><mn>1<\/mn><mo>−<\/mo><mi>p<\/mi><\/mrow><\/mfrac><mo>=<\/mo><msup><mi>w<\/mi><mo>⊤<\/mo><\/msup><mi>x<\/mi><mo>+<\/mo><mi>b<\/mi><mo>,<\/mo><mspace width=\"1em\" /><mi>p<\/mi><mo>=<\/mo><mi>σ<\/mi><mo stretchy=\"false\">(<\/mo><msup><mi>w<\/mi><mo>⊤<\/mo><\/msup><mi>x<\/mi><mo>+<\/mo><mi>b<\/mi><mo stretchy=\"false\">)<\/mo><mo>.<\/mo><\/mrow><\/math><\/div>\n<p><strong>展开：<\/strong> 用二元交叉熵训练，决策边界在特征空间中为超平面。加入 n-gram、非线性特征后，可处理原输入上的复杂模式。<\/p>\n<p><strong>追问：输出是否天然校准？<\/strong> 在模型设定与数据条件匹配时有优势，但现实数据偏移和正则化仍会影响校准。<\/p>\n<p><strong>易错：<\/strong> 不要把类别不均衡的阈值固定为 0.5 当作业务最优。<\/p><\/div><\/details>"}</script>
<script id="data-q-B02" type="application/json">{"body":"### 估计哪边概率大，还是找一条分隔余量大的线？\n\n逻辑回归直接学习类别概率相关的目标；SVM 重点寻找能把类别分开、并留出较大间隔的边界。\n\nSVM 的决策分数不天然等于校准后的概率。两者都应放在同样的数据、特征和调参预算下比较。\n\n**直答：** LR 与 SVM 的目标和输出解释不同；根据概率需求、特征和任务表现选择，不以算法名称直接判优。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** LR 学条件概率并用 log loss；SVM 通过 margin 与 hinge loss 强调决策边界。实际选型需比较数据与成本。\n\n**展开：** 线性 SVM 在高维稀疏文本上可作基线；核方法能表达非线性，但大样本训练/推理成本要考虑。概率输出通常需额外校准。\n\n**追问：SVM 只关心支持向量是什么意思？** 最优解受到边界附近约束的关键样本影响；具体还取决于软间隔与损失。\n\n**易错：** 不能绝对说一种永远优于另一种。","html":"<h3>估计哪边概率大，还是找一条分隔余量大的线？<\/h3>\n<p>逻辑回归直接学习类别概率相关的目标；SVM 重点寻找能把类别分开、并留出较大间隔的边界。<\/p>\n<p>SVM 的决策分数不天然等于校准后的概率。两者都应放在同样的数据、特征和调参预算下比较。<\/p>\n<p><strong>直答：<\/strong> LR 与 SVM 的目标和输出解释不同；根据概率需求、特征和任务表现选择，不以算法名称直接判优。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> LR 学条件概率并用 log loss；SVM 通过 margin 与 hinge loss 强调决策边界。实际选型需比较数据与成本。<\/p>\n<p><strong>展开：<\/strong> 线性 SVM 在高维稀疏文本上可作基线；核方法能表达非线性，但大样本训练/推理成本要考虑。概率输出通常需额外校准。<\/p>\n<p><strong>追问：SVM 只关心支持向量是什么意思？<\/strong> 最优解受到边界附近约束的关键样本影响；具体还取决于软间隔与损失。<\/p>\n<p><strong>易错：<\/strong> 不能绝对说一种永远优于另一种。<\/p><\/div><\/details>"}</script>
<script id="data-q-B03" type="application/json">{"body":"### 简单数片段，也可能抓住很多有用线索\n\n“我爱学习”的字符 2-gram 是“我爱、爱学、学习”。把文本里出现的这些片段当作特征，再用 TF-IDF 降低到处都出现的词项的影响。\n\n这种方法便宜、便于检查，也能捕捉局部字符模式，但不擅长长距离语义和复杂推理。\n\n**直答：** TF-IDF 与字符 n-gram 提供低成本、可解释的文本特征，应作为简单基线比较，并分析其局部模式局限。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 计算便宜、能捕获局部变体、可检查高权重特征，是中文短文本安全分类的有价值基线。\n\n**展开：** TF 表示文档内词项强度，IDF 降低常见项权重。字符片段可处理部分空格、拼写与字母组合，但不擅长长语境和复杂意图。\n\n**追问：怎样防止特征泄漏？** 词表与 IDF 只在训练集拟合，不能先用全量数据 fit 后再切分。\n\n**易错：** n 越大模式更长，也更稀疏；不存在脱离数据的最佳 n。依据：S67。","html":"<h3>简单数片段，也可能抓住很多有用线索<\/h3>\n<p>“我爱学习”的字符 2-gram 是“我爱、爱学、学习”。把文本里出现的这些片段当作特征，再用 TF-IDF 降低到处都出现的词项的影响。<\/p>\n<p>这种方法便宜、便于检查，也能捕捉局部字符模式，但不擅长长距离语义和复杂推理。<\/p>\n<p><strong>直答：<\/strong> TF-IDF 与字符 n-gram 提供低成本、可解释的文本特征，应作为简单基线比较，并分析其局部模式局限。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 计算便宜、能捕获局部变体、可检查高权重特征，是中文短文本安全分类的有价值基线。<\/p>\n<p><strong>展开：<\/strong> TF 表示文档内词项强度，IDF 降低常见项权重。字符片段可处理部分空格、拼写与字母组合，但不擅长长语境和复杂意图。<\/p>\n<p><strong>追问：怎样防止特征泄漏？<\/strong> 词表与 IDF 只在训练集拟合，不能先用全量数据 fit 后再切分。<\/p>\n<p><strong>易错：<\/strong> n 越大模式更长，也更稀疏；不存在脱离数据的最佳 n。依据：<a class=\"ref\" href=\"#source-S67\">S67<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-B04" type="application/json">{"body":"### “苹果”在水果文章和手机文章里，应该一样吗？\n\n静态词向量通常给同一个词固定表示，难以区分此刻说的是水果还是公司；上下文表示会结合周围文本改变这个位置的表示。\n\nWord2Vec 通过词的共现学习静态向量，是理解词表示的经典起点。\n\n**直答：** 静态向量主要按词表项给表示，上下文模型按当前语境给位置表示，因此更有机会区分一词多义。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 静态词向量通常一个词一份表示；上下文模型根据具体句子动态生成表示。\n\n**展开：** Skip-gram 用中心词预测上下文；CBOW 用上下文预测中心词。负采样用少量负例近似训练目标，但不应说它精确计算完整 softmax。\n\n**追问：为什么向量相似不等于语义相同？** 反义词也可能出现在相似语境；任务需要可能与共现相似不同。\n\n**易错：** 词向量类比现象不是可靠知识推理能力的证明。依据：S76。","html":"<h3>“苹果”在水果文章和手机文章里，应该一样吗？<\/h3>\n<p>静态词向量通常给同一个词固定表示，难以区分此刻说的是水果还是公司；上下文表示会结合周围文本改变这个位置的表示。<\/p>\n<p>Word2Vec 通过词的共现学习静态向量，是理解词表示的经典起点。<\/p>\n<p><strong>直答：<\/strong> 静态向量主要按词表项给表示，上下文模型按当前语境给位置表示，因此更有机会区分一词多义。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 静态词向量通常一个词一份表示；上下文模型根据具体句子动态生成表示。<\/p>\n<p><strong>展开：<\/strong> Skip-gram 用中心词预测上下文；CBOW 用上下文预测中心词。负采样用少量负例近似训练目标，但不应说它精确计算完整 softmax。<\/p>\n<p><strong>追问：为什么向量相似不等于语义相同？<\/strong> 反义词也可能出现在相似语境；任务需要可能与共现相似不同。<\/p>\n<p><strong>易错：<\/strong> 词向量类比现象不是可靠知识推理能力的证明。依据：<a class=\"ref\" href=\"#source-S76\">S76<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-B05" type="application/json">{"body":"### 一套问答规则、很多人投票、不断补前人的错\n\n决策树通过连续条件判断作出预测；随机森林训练多棵有差异的树并汇总；GBDT 则逐步增加模型，补偿当前预测的误差。\n\n“很多棵树”不代表训练方式相同，要区分并行集成与依次纠错的思想。\n\n**直答：** 决策树是单个规则结构，随机森林通过差异化树集成降低波动，GBDT 逐步拟合剩余误差提高表现。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 树通过特征切分建立规则；随机森林训练多棵较独立的随机树并聚合；GBDT 逐轮拟合现有模型的误差方向。\n\n**展开：** 表格元数据，如长度、风险分数、来源、历史命中，可用树模型建立强基线；原始长文本通常先做特征或表示。\n\n**追问：特征重要性可靠吗？** 受相关特征、分裂偏好和数据泄漏影响；可辅以置换与受控删除评测。\n\n**易错：** boosting 不等于把多棵树简单平均。","html":"<h3>一套问答规则、很多人投票、不断补前人的错<\/h3>\n<p>决策树通过连续条件判断作出预测；随机森林训练多棵有差异的树并汇总；GBDT 则逐步增加模型，补偿当前预测的误差。<\/p>\n<p>“很多棵树”不代表训练方式相同，要区分并行集成与依次纠错的思想。<\/p>\n<p><strong>直答：<\/strong> 决策树是单个规则结构，随机森林通过差异化树集成降低波动，GBDT 逐步拟合剩余误差提高表现。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 树通过特征切分建立规则；随机森林训练多棵较独立的随机树并聚合；GBDT 逐轮拟合现有模型的误差方向。<\/p>\n<p><strong>展开：<\/strong> 表格元数据，如长度、风险分数、来源、历史命中，可用树模型建立强基线；原始长文本通常先做特征或表示。<\/p>\n<p><strong>追问：特征重要性可靠吗？<\/strong> 受相关特征、分裂偏好和数据泄漏影响；可辅以置换与受控删除评测。<\/p>\n<p><strong>易错：<\/strong> boosting 不等于把多棵树简单平均。<\/p><\/div><\/details>"}</script>
<script id="data-q-B06" type="application/json">{"body":"### 只说“都正常”，也可能拿到很高准确率\n\n若 99% 样本都是正常，全部预测正常就有 99% 准确率，却一个风险也没找回。类别不平衡会让总指标掩盖少数类失败。\n\n可以调整采样、损失权重和阈值，但都要看少数类召回、误报与概率校准，而不是只提高某个数。\n\n**直答：** 先选能暴露少数类表现的指标，再比较数据、损失和决策层面的处理，联合控制漏检与误报。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 结合采样、损失权重、数据补充与决策阈值，并用真实部署分布评测。\n\n**展开：** 过采样少数类增加其训练权重，也可能重复记忆；加权损失会改变概率解释，需校准。Focal loss 强调难样本，但噪声标签也可能被放大。\n\n**追问：训练均衡、线上极不均衡怎么办？** 测真实基率下 precision、复核成本与风险，不只在人工均衡集报 accuracy。\n\n**易错：** 测试集重新平衡后不能直接代表真实误报负担。","html":"<h3>只说“都正常”，也可能拿到很高准确率<\/h3>\n<p>若 99% 样本都是正常，全部预测正常就有 99% 准确率，却一个风险也没找回。类别不平衡会让总指标掩盖少数类失败。<\/p>\n<p>可以调整采样、损失权重和阈值，但都要看少数类召回、误报与概率校准，而不是只提高某个数。<\/p>\n<p><strong>直答：<\/strong> 先选能暴露少数类表现的指标，再比较数据、损失和决策层面的处理，联合控制漏检与误报。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 结合采样、损失权重、数据补充与决策阈值，并用真实部署分布评测。<\/p>\n<p><strong>展开：<\/strong> 过采样少数类增加其训练权重，也可能重复记忆；加权损失会改变概率解释，需校准。Focal loss 强调难样本，但噪声标签也可能被放大。<\/p>\n<p><strong>追问：训练均衡、线上极不均衡怎么办？<\/strong> 测真实基率下 precision、复核成本与风险，不只在人工均衡集报 accuracy。<\/p>\n<p><strong>易错：<\/strong> 测试集重新平衡后不能直接代表真实误报负担。<\/p><\/div><\/details>"}</script>
<script id="data-q-B07" type="application/json">{"body":"### 记熟练习题，却不会做同类新题\n\n训练集越来越好，独立验证集却停滞或变差，是过拟合的常见信号。原因可能是数据少、重复多、模型过度适应或验证分布不同。\n\n应先排除泄漏和切分问题，再考虑增加有效数据、正则化、简化模型或早停。\n\n**直答：** 过拟合是对训练材料适应过强、泛化不足；通过独立评测和学习曲线定位，再针对数据或训练复杂度处理。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 看训练与独立验证的差距，再排数据泄漏、分布不同和指标实现错误。\n\n**展开：** 控制容量、正则化、早停、数据增强与更多独立样本都可帮助，但应该针对原因。学习曲线能显示是否主要受数据量或模型能力限制。\n\n**追问：训练好验证差一定是过拟合？** 可能是训练/验证预处理不一致或领域漂移，应先核查。\n\n**易错：** 重复数据扩增后的样本数不等于独立信息量增加。","html":"<h3>记熟练习题，却不会做同类新题<\/h3>\n<p>训练集越来越好，独立验证集却停滞或变差，是过拟合的常见信号。原因可能是数据少、重复多、模型过度适应或验证分布不同。<\/p>\n<p>应先排除泄漏和切分问题，再考虑增加有效数据、正则化、简化模型或早停。<\/p>\n<p><strong>直答：<\/strong> 过拟合是对训练材料适应过强、泛化不足；通过独立评测和学习曲线定位，再针对数据或训练复杂度处理。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 看训练与独立验证的差距，再排数据泄漏、分布不同和指标实现错误。<\/p>\n<p><strong>展开：<\/strong> 控制容量、正则化、早停、数据增强与更多独立样本都可帮助，但应该针对原因。学习曲线能显示是否主要受数据量或模型能力限制。<\/p>\n<p><strong>追问：训练好验证差一定是过拟合？<\/strong> 可能是训练/验证预处理不一致或领域漂移，应先核查。<\/p>\n<p><strong>易错：<\/strong> 重复数据扩增后的样本数不等于独立信息量增加。<\/p><\/div><\/details>"}</script>
<script id="data-q-B08" type="application/json">{"body":"### 比赛要给双方合理的参赛条件\n\n不能给大模型精心设计提示、充分调参，却给传统模型随便一组默认特征，就宣布后者无用。也不能忽略大模型更高的推理成本。\n\n同时报告效果、时延、资源、维护和样本需求，才能回答业务上该选哪个。\n\n**直答：** 在相同数据切分和合理调参条件下比较方法，并把质量与完整成本一起报告。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 同一冻结数据、相同标签政策与业务约束，比较质量、速度、成本、维护和长尾行为。\n\n**展开：** 内容安全可依次比较规则、TF-IDF+LR、encoder 分类器、LLM 分类/生成策略。每层回答“新增复杂度解决了哪类失败”。\n\n**追问：如果传统模型更好怎么办？** 保留它作为生产组件或前置筛选，把大模型用于真正需要语境和开放生成的部分。\n\n**易错：** 为证明大模型必要而只选一个没有调优的弱基线，会削弱面试可信度。","html":"<h3>比赛要给双方合理的参赛条件<\/h3>\n<p>不能给大模型精心设计提示、充分调参，却给传统模型随便一组默认特征，就宣布后者无用。也不能忽略大模型更高的推理成本。<\/p>\n<p>同时报告效果、时延、资源、维护和样本需求，才能回答业务上该选哪个。<\/p>\n<p><strong>直答：<\/strong> 在相同数据切分和合理调参条件下比较方法，并把质量与完整成本一起报告。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 同一冻结数据、相同标签政策与业务约束，比较质量、速度、成本、维护和长尾行为。<\/p>\n<p><strong>展开：<\/strong> 内容安全可依次比较规则、TF-IDF+LR、encoder 分类器、LLM 分类/生成策略。每层回答“新增复杂度解决了哪类失败”。<\/p>\n<p><strong>追问：如果传统模型更好怎么办？<\/strong> 保留它作为生产组件或前置筛选，把大模型用于真正需要语境和开放生成的部分。<\/p>\n<p><strong>易错：<\/strong> 为证明大模型必要而只选一个没有调优的弱基线，会削弱面试可信度。<\/p><\/div><\/details>"}</script>
<script id="data-q-H01" type="application/json">{"body":"### 把一次预测拆成四个可检查步骤\n\n拿分数 [1000,1001]：先减最大值，得到 [−1,0]；再算 softmax，约为 [0.269,0.731]；找到实际标签对应的概率；最后算它的负对数。\n\n这样每一步都有预期结果，容易发现溢出、取错标签或符号错误。先读 M02、M04，再打开代码会更容易。\n\n**直答：** 先保证概率计算稳定，再按实际标签取负 log 概率；用平移前后结果一致和简单手算检查实现。\n\n### 进一步：公式、边界与追问\n\n**本章进阶约定与范围：**\n\n代码位于 03_代码实验。先按本章要求自己写，再比较实现；测试通过只证明这些教学算例与性质，不证明真实大模型训练正确。\n\n**技术表述：** 先减去每行最大值，再用 logsumexp 计算 log-softmax，按正确 token 取负值。\n\n**展开：** 输入 shape、axis、mask 的 True 含义必须明确；空有效行应显式报错。对 logits 做平移结果不变，概率和为 1。用有限差分核查 p−y 梯度。\n\n**追问：为什么不用 exp 后加 1e−8 解决所有问题？** 无法修复已溢出的 exp，还可能改变极小概率对应的损失。\n\n**实现入口：** log_softmax、masked_softmax；独立校验包含大 logits、平移不变和梯度差分。","html":"<h3>把一次预测拆成四个可检查步骤<\/h3>\n<p>拿分数 [1000,1001]：先减最大值，得到 [−1,0]；再算 softmax，约为 [0.269,0.731]；找到实际标签对应的概率；最后算它的负对数。<\/p>\n<p>这样每一步都有预期结果，容易发现溢出、取错标签或符号错误。先读 <a class=\"ref\" href=\"#q-M02\">M02<\/a>、<a class=\"ref\" href=\"#q-M04\">M04<\/a>，再打开代码会更容易。<\/p>\n<p><strong>直答：<\/strong> 先保证概率计算稳定，再按实际标签取负 log 概率；用平移前后结果一致和简单手算检查实现。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>本章进阶约定与范围：<\/strong><\/p>\n<p>代码位于 03_代码实验。先按本章要求自己写，再比较实现；测试通过只证明这些教学算例与性质，不证明真实大模型训练正确。<\/p>\n<p><strong>技术表述：<\/strong> 先减去每行最大值，再用 logsumexp 计算 log-softmax，按正确 token 取负值。<\/p>\n<p><strong>展开：<\/strong> 输入 shape、axis、mask 的 True 含义必须明确；空有效行应显式报错。对 logits 做平移结果不变，概率和为 1。用有限差分核查 p−y 梯度。<\/p>\n<p><strong>追问：为什么不用 exp 后加 1e−8 解决所有问题？<\/strong> 无法修复已溢出的 exp，还可能改变极小概率对应的损失。<\/p>\n<p><strong>实现入口：<\/strong> log_softmax、masked_softmax；独立校验包含大 logits、平移不变和梯度差分。<\/p><\/div><\/details>"}</script>
<script id="data-q-H02" type="application/json">{"body":"### 第三个位置可以看前三个，不能偷看第四个\n\n先算 Q、K 匹配分数，再把未来位置遮住，接着做 softmax，最后用这些权重加总 V。顺序错了，可能在归一化时把未来信息算进去。\n\n一个好检查是只修改未来内容，观察前面位置的输出是否不变。\n\n**直答：** 按匹配、遮罩、归一化、加权汇总实现因果注意力，用“不受未来改动影响”的性质检查，而不只看形状正确。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** QKᵀ 除以 head dim 平方根，屏蔽未来位置，沿 key 维 softmax，再乘 V。\n\n**展开：** 支持 batch/head 维广播，验证输出 shape；修改未来 V 不应改变更早输出。这个性质测试比只看一组输出是否“像对的”更有力。\n\n**追问：KV cache 增量版怎么扩展？** 新 token 计算 Q/K/V，K/V 追加到历史，Q 只需查询可见缓存；因果位置偏移需正确处理。\n\n**实现入口：** causal_attention。当前实现是同长度 self-attention 数学演示，不含 GPU kernel 或缓存服务。","html":"<h3>第三个位置可以看前三个，不能偷看第四个<\/h3>\n<p>先算 Q、K 匹配分数，再把未来位置遮住，接着做 softmax，最后用这些权重加总 V。顺序错了，可能在归一化时把未来信息算进去。<\/p>\n<p>一个好检查是只修改未来内容，观察前面位置的输出是否不变。<\/p>\n<p><strong>直答：<\/strong> 按匹配、遮罩、归一化、加权汇总实现因果注意力，用“不受未来改动影响”的性质检查，而不只看形状正确。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> QKᵀ 除以 head dim 平方根，屏蔽未来位置，沿 key 维 softmax，再乘 V。<\/p>\n<p><strong>展开：<\/strong> 支持 batch/head 维广播，验证输出 shape；修改未来 V 不应改变更早输出。这个性质测试比只看一组输出是否“像对的”更有力。<\/p>\n<p><strong>追问：KV cache 增量版怎么扩展？<\/strong> 新 token 计算 Q/K/V，K/V 追加到历史，Q 只需查询可见缓存；因果位置偏移需正确处理。<\/p>\n<p><strong>实现入口：<\/strong> causal_attention。当前实现是同长度 self-attention 数学演示，不含 GPU kernel 或缓存服务。<\/p><\/div><\/details>"}</script>
<script id="data-q-H03" type="application/json">{"body":"### 每个位置的一大排概率，只取实际写出的那一项\n\n模型在每个位置都会给整个词表打分。先转成 log 概率，再取目标 token 的那一项；只保留回答中应计分的位置，最后求和或按长度平均。\n\n最容易出错的是对齐：前一个位置用于预测下一个 token，不能拿当前位置去预测自己。现有教学函数要求输入目标事先对齐。\n\n**直答：** 明确预测与目标的移位关系，按 token 取 log 概率，再应用回答遮罩和规定的聚合方式。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 先对齐每个位置预测的目标 token，再 gather 正确 logprob，屏蔽 prompt/padding 后求和或平均。\n\n**展开：** shift 必须只做一次；无效 target 可设 −100，但 gather 前要替成合法占位索引；最后再 mask。分母是有效回答 token。\n\n**追问：为什么不直接把 logits 加起来？** logits 未归一化，可以任意平移；概率语义来自 log-softmax。\n\n**实现入口：** sequence_logprob；它要求调用者已对齐目标，不偷偷再次 shift。","html":"<h3>每个位置的一大排概率，只取实际写出的那一项<\/h3>\n<p>模型在每个位置都会给整个词表打分。先转成 log 概率，再取目标 token 的那一项；只保留回答中应计分的位置，最后求和或按长度平均。<\/p>\n<p>最容易出错的是对齐：前一个位置用于预测下一个 token，不能拿当前位置去预测自己。现有教学函数要求输入目标事先对齐。<\/p>\n<p><strong>直答：<\/strong> 明确预测与目标的移位关系，按 token 取 log 概率，再应用回答遮罩和规定的聚合方式。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 先对齐每个位置预测的目标 token，再 gather 正确 logprob，屏蔽 prompt/padding 后求和或平均。<\/p>\n<p><strong>展开：<\/strong> shift 必须只做一次；无效 target 可设 −100，但 gather 前要替成合法占位索引；最后再 mask。分母是有效回答 token。<\/p>\n<p><strong>追问：为什么不直接把 logits 加起来？<\/strong> logits 未归一化，可以任意平移；概率语义来自 log-softmax。<\/p>\n<p><strong>实现入口：<\/strong> sequence_logprob；它要求调用者已对齐目标，不偷偷再次 shift。<\/p><\/div><\/details>"}</script>
<script id="data-q-H04" type="application/json">{"body":"### 写完损失，先问好答案变好时分数会怎样\n\n给一个小例子，增大好答案相对差答案的优势，检查损失是否下降。DPO 要减参考差值，SimPO 要按回答长度平均并减 margin。\n\n先验证这个方向，再处理批量计算。程序能跑，并不能排除把 chosen 和 rejected 写反。\n\n**直答：** 用小算例检查偏好方向、参考项、长度与缩放，再用梯度验证关键符号，最后扩展到批量训练。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 将偏好 logit z 写清，用 softplus(−z) 稳定求 loss；DPO 含参考差，SimPO 含长度与 margin。\n\n**展开：** DPO 当前=参考时 loss=ln2；提高相对 chosen 的 logprob 应降低单样本 loss。SimPO 按比例复制总 logprob 与长度，平均值和 loss 不变。\n\n**追问：单样本性质能证明参数训练总向好？** 不能，参数共享、多样本权重和泛化仍需真实实验。\n\n**实现入口：** dpo_loss、simpo_loss；含 DPO 有限差分与 P09 算例。","html":"<h3>写完损失，先问好答案变好时分数会怎样<\/h3>\n<p>给一个小例子，增大好答案相对差答案的优势，检查损失是否下降。DPO 要减参考差值，SimPO 要按回答长度平均并减 margin。<\/p>\n<p>先验证这个方向，再处理批量计算。程序能跑，并不能排除把 chosen 和 rejected 写反。<\/p>\n<p><strong>直答：<\/strong> 用小算例检查偏好方向、参考项、长度与缩放，再用梯度验证关键符号，最后扩展到批量训练。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 将偏好 logit z 写清，用 softplus(−z) 稳定求 loss；DPO 含参考差，SimPO 含长度与 margin。<\/p>\n<p><strong>展开：<\/strong> DPO 当前=参考时 loss=ln2；提高相对 chosen 的 logprob 应降低单样本 loss。SimPO 按比例复制总 logprob 与长度，平均值和 loss 不变。<\/p>\n<p><strong>追问：单样本性质能证明参数训练总向好？<\/strong> 不能，参数共享、多样本权重和泛化仍需真实实验。<\/p>\n<p><strong>实现入口：<\/strong> dpo_loss、simpo_loss；含 DPO 有限差分与 <a class=\"ref\" href=\"#q-P09\">P09<\/a> 算例。<\/p><\/div><\/details>"}</script>
<script id="data-q-H05" type="application/json">{"body":"### 先让四份答案排出相对好坏，再限制更新\n\n奖励 [0,0,1,1] 能算出正负组内优势；奖励 [1,1,1,1] 应得到零优势。再分别构造正优势与负优势的概率比，检查 PPO 裁剪是哪一项起作用。\n\n把两个步骤分开检查，比对着整行目标函数排错容易。\n\n**直答：** 分别验证优势归一化、零方差组和正负优势的裁剪分支，再确认回答与 token 的聚合权重。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 按 prompt 分组减均值，按所选约定缩放；clip 目标用原项与截断项取较小值。\n\n**展开：** 明确 std 的 ddof 和 ε；全相同奖励优势为零。分别测试正优势/负优势与 ratio 过高/过低四种情况。\n\n**追问：为什么 std 的实现差异会影响值？** 样本标准差与总体标准差不同，小 group 时差别明显；论文、框架与代码必须对齐。\n\n**实现入口：** grpo_advantages、ppo_surrogate、aggregate_token_losses；演示三类长度归一化。","html":"<h3>先让四份答案排出相对好坏，再限制更新<\/h3>\n<p>奖励 [0,0,1,1] 能算出正负组内优势；奖励 [1,1,1,1] 应得到零优势。再分别构造正优势与负优势的概率比，检查 PPO 裁剪是哪一项起作用。<\/p>\n<p>把两个步骤分开检查，比对着整行目标函数排错容易。<\/p>\n<p><strong>直答：<\/strong> 分别验证优势归一化、零方差组和正负优势的裁剪分支，再确认回答与 token 的聚合权重。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 按 prompt 分组减均值，按所选约定缩放；clip 目标用原项与截断项取较小值。<\/p>\n<p><strong>展开：<\/strong> 明确 std 的 ddof 和 ε；全相同奖励优势为零。分别测试正优势/负优势与 ratio 过高/过低四种情况。<\/p>\n<p><strong>追问：为什么 std 的实现差异会影响值？<\/strong> 样本标准差与总体标准差不同，小 group 时差别明显；论文、框架与代码必须对齐。<\/p>\n<p><strong>实现入口：<\/strong> grpo_advantages、ppo_surrogate、aggregate_token_losses；演示三类长度归一化。<\/p><\/div><\/details>"}</script>
<script id="data-q-H06" type="application/json">{"body":"### 组合问题用枚举检查，统计问题用成对结果检查\n\npass@k 的小规模例子可以枚举所有选法，看有多少组合至少包含一次成功；成对 bootstrap 则每次把同一道题的新旧结果一起抽走。\n\n如果两个模型结果完全相同，差值区间应该为 [0,0]，这是很直观的检查。\n\n**直答：** 用可枚举的小案例验证采样公式，用保持配对关系的重采样验证差值统计，并固定随机种子方便复查。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** pass@k 用无成功组合数占比；配对 bootstrap 对同样本差值共同重采样。\n\n**展开：** pass@k 用连乘避免巨大组合数；小 n 可穷举所有 k 子集验证。bootstrap 先明确每个元素是独立样本或会话聚合得分。\n\n**追问：同一批样本 A=B，区间应是什么？** 配对差恒为零，区间应为 [0,0]，可作关键性质测试。\n\n**实现入口：** pass_at_k、paired_bootstrap。","html":"<h3>组合问题用枚举检查，统计问题用成对结果检查<\/h3>\n<p>pass@k 的小规模例子可以枚举所有选法，看有多少组合至少包含一次成功；成对 bootstrap 则每次把同一道题的新旧结果一起抽走。<\/p>\n<p>如果两个模型结果完全相同，差值区间应该为 [0,0]，这是很直观的检查。<\/p>\n<p><strong>直答：<\/strong> 用可枚举的小案例验证采样公式，用保持配对关系的重采样验证差值统计，并固定随机种子方便复查。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> pass@k 用无成功组合数占比；配对 bootstrap 对同样本差值共同重采样。<\/p>\n<p><strong>展开：<\/strong> pass@k 用连乘避免巨大组合数；小 n 可穷举所有 k 子集验证。bootstrap 先明确每个元素是独立样本或会话聚合得分。<\/p>\n<p><strong>追问：同一批样本 A=B，区间应是什么？<\/strong> 配对差恒为零，区间应为 [0,0]，可作关键性质测试。<\/p>\n<p><strong>实现入口：<\/strong> pass_at_k、paired_bootstrap。<\/p><\/div><\/details>"}</script>
<script id="data-q-H07" type="application/json">{"body":"### 两种写法，应该算出同一个结果\n\n一种先算原矩阵与输入的乘积，再加 LoRA 两个小矩阵产生的结果；另一种先合成更新后的大矩阵，再乘输入。\n\n在对应精度与假设下，这两条路线应数值接近。改变 rank 和输入形状，能帮助发现矩阵方向写错。\n\n**直答：** 用分支计算与合并矩阵的等价性检查 LoRA，明确矩阵维度、缩放和允许的数值误差。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 按给定形状计算 xWᵀ+(α/r)(xAᵀ)Bᵀ，并与 x(W+(α/r)BA)ᵀ 比较。\n\n**展开：** 用随机小矩阵测试两种路径一致；B=0 时应还原基座输出。训练时不能把所有基座计算错误地切断梯度。\n\n**追问：NumPy 这个测试验证了训练吗？** 只验证线性代数等价，不含自动求导或量化合并误差。\n\n**实现入口：** lora_forward。","html":"<h3>两种写法，应该算出同一个结果<\/h3>\n<p>一种先算原矩阵与输入的乘积，再加 LoRA 两个小矩阵产生的结果；另一种先合成更新后的大矩阵，再乘输入。<\/p>\n<p>在对应精度与假设下，这两条路线应数值接近。改变 rank 和输入形状，能帮助发现矩阵方向写错。<\/p>\n<p><strong>直答：<\/strong> 用分支计算与合并矩阵的等价性检查 LoRA，明确矩阵维度、缩放和允许的数值误差。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 按给定形状计算 xWᵀ+(α/r)(xAᵀ)Bᵀ，并与 x(W+(α/r)BA)ᵀ 比较。<\/p>\n<p><strong>展开：<\/strong> 用随机小矩阵测试两种路径一致；B=0 时应还原基座输出。训练时不能把所有基座计算错误地切断梯度。<\/p>\n<p><strong>追问：NumPy 这个测试验证了训练吗？<\/strong> 只验证线性代数等价，不含自动求导或量化合并误差。<\/p>\n<p><strong>实现入口：<\/strong> lora_forward。<\/p><\/div><\/details>"}</script>
<script id="data-q-H08" type="application/json">{"body":"### 故意丢掉回执，看看系统会不会重复办事\n\n教学服务先记录“退款成功”，再模拟返回超时。恢复逻辑应通过同一个请求标识查询状态，发现已完成后直接返回，而不是再写一次。\n\n这里完全是本地模拟。关键检查是最终状态正确、实际写入次数为 1，而不只是没有抛异常。\n\n**直答：** 用“提交已生效但响应丢失”的故障检查幂等恢复，验证业务结果和写入次数，避免重复副作用。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 保留逻辑请求标识，超时后查询权威状态；确认已成功就返回，未知则保留未知并按有限策略处理。\n\n**展开：** 模拟服务先提交退款再抛超时；恢复后操作次数仍为 1，重复同一幂等键不再写入。真实系统还需处理最终一致性、权限与补偿。\n\n**追问：为什么不能只捕获异常重试？** 异常不必然表示没有副作用，重复写入会造成业务错误。\n\n**实现入口：** MockRefundService、recover_refund。全部是内存模拟，不访问真实订单或账户。","html":"<h3>故意丢掉回执，看看系统会不会重复办事<\/h3>\n<p>教学服务先记录“退款成功”，再模拟返回超时。恢复逻辑应通过同一个请求标识查询状态，发现已完成后直接返回，而不是再写一次。<\/p>\n<p>这里完全是本地模拟。关键检查是最终状态正确、实际写入次数为 1，而不只是没有抛异常。<\/p>\n<p><strong>直答：<\/strong> 用“提交已生效但响应丢失”的故障检查幂等恢复，验证业务结果和写入次数，避免重复副作用。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 保留逻辑请求标识，超时后查询权威状态；确认已成功就返回，未知则保留未知并按有限策略处理。<\/p>\n<p><strong>展开：<\/strong> 模拟服务先提交退款再抛超时；恢复后操作次数仍为 1，重复同一幂等键不再写入。真实系统还需处理最终一致性、权限与补偿。<\/p>\n<p><strong>追问：为什么不能只捕获异常重试？<\/strong> 异常不必然表示没有副作用，重复写入会造成业务错误。<\/p>\n<p><strong>实现入口：<\/strong> MockRefundService、recover_refund。全部是内存模拟，不访问真实订单或账户。<\/p><\/div><\/details>"}</script>
<script id="data-q-KD01" type="application/json">{"body":"**先看例子：**老师处理过一批订单咨询，把“缺订单号先询问、查到后按事实回答”的过程留下来。学生反复练这些示范，希望以后独立完成同类任务。\n\n这里的“知识”包括答案格式、选择工具的习惯、判断依据和处理异常的办法。学生不一定更小；同样规模的模型，也能通过更好的示范或反馈改善某项能力。\n\n**直答：**蒸馏是用教师提供的行为或信号训练学生；SFT 是一种训练方式，所以“用教师答案做 SFT”本身就可以是蒸馏。量化则是减少权重或计算使用的数值精度，主要改变存储与计算方式，二者可以组合。\n\n### 进一步：公式、边界与追问\n\n按信号分，常见有教师输出文本、下一 token 的概率分布、中间表示和任务交互轨迹。不能只问“有没有蒸馏”，要补齐“教师给了什么、学生在哪些输入上学习、损失怎样算”。\n\n**追问：学生能超过老师吗？**可能在某个测试任务上超过，例如数据筛选和任务专门化带来收益。但这不是获得老师全部能力，也不保证跨任务更强；比较时还要统一工具、提示词和推理预算。\n\n**依据：**S79、S80；本题的订单例子为教学设计。","html":"<p><strong>先看例子：<\/strong>老师处理过一批订单咨询，把“缺订单号先询问、查到后按事实回答”的过程留下来。学生反复练这些示范，希望以后独立完成同类任务。<\/p>\n<p>这里的“知识”包括答案格式、选择工具的习惯、判断依据和处理异常的办法。学生不一定更小；同样规模的模型，也能通过更好的示范或反馈改善某项能力。<\/p>\n<p><strong>直答：<\/strong>蒸馏是用教师提供的行为或信号训练学生；SFT 是一种训练方式，所以“用教师答案做 SFT”本身就可以是蒸馏。量化则是减少权重或计算使用的数值精度，主要改变存储与计算方式，二者可以组合。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p>按信号分，常见有教师输出文本、下一 token 的概率分布、中间表示和任务交互轨迹。不能只问“有没有蒸馏”，要补齐“教师给了什么、学生在哪些输入上学习、损失怎样算”。<\/p>\n<p><strong>追问：学生能超过老师吗？<\/strong>可能在某个测试任务上超过，例如数据筛选和任务专门化带来收益。但这不是获得老师全部能力，也不保证跨任务更强；比较时还要统一工具、提示词和推理预算。<\/p>\n<p><strong>依据：<\/strong><a class=\"ref\" href=\"#source-S79\">S79<\/a>、<a class=\"ref\" href=\"#source-S80\">S80<\/a>；本题的订单例子为教学设计。<\/p><\/div><\/details>"}</script>
<script id="data-q-KD02" type="application/json">{"body":"**先看例子：**你可以问老师问题，拿到完整答案，却看不到老师给每个候选词打了多少分。这仍足够制作“问题—优质回答”训练对，也可以收集工具调用过程。\n\n如果接口额外返回部分 token 的概率，那只是多拿到一些信息，不等于看见全部词表。\n\n**直答：**能。只有文本时，先做答案或轨迹蒸馏；拿到兼容的概率分布后，才考虑相应的 token 级 KL 方法。先盘点接口实际返回什么，再选算法。\n\n### 进一步：公式、边界与追问\n\n| 能拿到的信号 | 可行方向 | 常见误会 |\n|---|---|---|\n| 文本、工具调用与真实执行结果 | 序列 SFT、轨迹 SFT、验证后筛选 | 文本不能还原教师全部 logits |\n| 少量候选 token 的 logprob | 显式说明近似的分布训练或置信度特征 | top-k 重新归一化不是原始全词表 KL |\n| 兼容词表上的完整概率 | 软标签 KD、所需条件满足时的 GKD | 还须对齐每个位置的上下文 |\n| 可访问教师内部张量 | 中间层、特征蒸馏 | 张量维度相等也不保证语义对齐 |\n\n**追问：教师和学生分词不同怎么办？**序列文本可以分别分词。逐 token 概率不能直接按数组下标相减；需要有定义的对齐方法，或者换用文本级监督。详见 KD16。\n\n**依据：**S79、S80、S88。具体商业接口能力随版本变化，实施时核对实际接口。","html":"<p><strong>先看例子：<\/strong>你可以问老师问题，拿到完整答案，却看不到老师给每个候选词打了多少分。这仍足够制作“问题—优质回答”训练对，也可以收集工具调用过程。<\/p>\n<p>如果接口额外返回部分 token 的概率，那只是多拿到一些信息，不等于看见全部词表。<\/p>\n<p><strong>直答：<\/strong>能。只有文本时，先做答案或轨迹蒸馏；拿到兼容的概率分布后，才考虑相应的 token 级 KL 方法。先盘点接口实际返回什么，再选算法。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><table>\n<thead>\n<tr>\n<th>能拿到的信号<\/th>\n<th>可行方向<\/th>\n<th>常见误会<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>文本、工具调用与真实执行结果<\/td>\n<td>序列 SFT、轨迹 SFT、验证后筛选<\/td>\n<td>文本不能还原教师全部 logits<\/td>\n<\/tr>\n<tr>\n<td>少量候选 token 的 logprob<\/td>\n<td>显式说明近似的分布训练或置信度特征<\/td>\n<td>top-k 重新归一化不是原始全词表 KL<\/td>\n<\/tr>\n<tr>\n<td>兼容词表上的完整概率<\/td>\n<td>软标签 KD、所需条件满足时的 GKD<\/td>\n<td>还须对齐每个位置的上下文<\/td>\n<\/tr>\n<tr>\n<td>可访问教师内部张量<\/td>\n<td>中间层、特征蒸馏<\/td>\n<td>张量维度相等也不保证语义对齐<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>追问：教师和学生分词不同怎么办？<\/strong>序列文本可以分别分词。逐 token 概率不能直接按数组下标相减；需要有定义的对齐方法，或者换用文本级监督。详见 <a class=\"ref\" href=\"#q-KD16\">KD16<\/a>。<\/p>\n<p><strong>依据：<\/strong><a class=\"ref\" href=\"#source-S79\">S79<\/a>、<a class=\"ref\" href=\"#source-S80\">S80<\/a>、<a class=\"ref\" href=\"#source-S88\">S88<\/a>。具体商业接口能力随版本变化，实施时核对实际接口。<\/p><\/div><\/details>"}</script>
