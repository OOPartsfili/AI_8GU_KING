<script id="data-q-M01" type="application/json">{"body":"### 先用一个例子想明白\n\n给模型一句没写完的话：“我早上喝了一杯……”。它不会先从脑中拿出一整句答案，而是给下一小块文字分配概率：比如“水”50%、“茶”30%、“咖啡”20%。这些百分比合在一起，就是“概率分布”。\n\n这里的一小块叫 token。它可能是一个字、一个词的一部分，或者标点。选出一个 token 后，模型把它接到前文，再猜下一块。\n\n**训练在做什么？** 课本上实际接的是“茶”，训练就给模型反馈：“下次遇到类似前文，把‘茶’的概率调高一些。”反复读大量文本，它逐渐学会词语搭配、知识表达和解题方式。\n\n如果两步分别有 0.5 和 0.4 的条件概率，这条两步路径的概率是 0.5×0.4=0.2。不是相加。后面的“条件概率”已经把前一步选了什么算进去了。\n\n**直答：** 语言模型学习根据前文预测下一个 token；生成时不断把预测接到前文，逐步写成完整回答。它认为某句话“容易出现”，并不等于这句话一定真实。\n\n### 进一步：公式、边界与追问\n\n**本章进阶约定与范围：**\n\n定位：所有岗位共同底座。先理解概率、损失和梯度，再进入 DPO/GRPO。符号统一：x 为输入，y 为回答，t 为回答 token 位置，π 为模型条件概率；log 默认为自然对数。\n\n**技术表述：** 学习给定前文时下一个 token 的条件分布，用链式法则组成整段文本的概率。\n\n**展开：**\n\n$$\\pi_\\theta(y|x)=\\prod_{t=1}^{T}\\pi_\\theta(y_t|x,y_{<t})$$\n\n$$\\log\\pi_\\theta(y|x)=\\sum_{t=1}^{T}\\log\\pi_\\theta(y_t|x,y_{<t}).$$\n\n训练常用最大似然，等价于最小化正确 token 的负对数概率。高概率表示模型在当前条件下更倾向生成，并不自动表示真实、合理或安全。\n\n**追问：为什么训练可并行、生成通常串行？** 训练时已有整段真实序列，可一次计算所有位置；生成时后一个 token 依赖已经采样出的前文。\n\n**易错：** 不要把整个回答概率当成各 token 概率相加；相加的是 log 概率。依据：S01。","html":"<h3>先用一个例子想明白<\/h3>\n<p>给模型一句没写完的话：“我早上喝了一杯……”。它不会先从脑中拿出一整句答案，而是给下一小块文字分配概率：比如“水”50%、“茶”30%、“咖啡”20%。这些百分比合在一起，就是“概率分布”。<\/p>\n<p>这里的一小块叫 token。它可能是一个字、一个词的一部分，或者标点。选出一个 token 后，模型把它接到前文，再猜下一块。<\/p>\n<p><strong>训练在做什么？<\/strong> 课本上实际接的是“茶”，训练就给模型反馈：“下次遇到类似前文，把‘茶’的概率调高一些。”反复读大量文本，它逐渐学会词语搭配、知识表达和解题方式。<\/p>\n<p>如果两步分别有 0.5 和 0.4 的条件概率，这条两步路径的概率是 0.5×0.4=0.2。不是相加。后面的“条件概率”已经把前一步选了什么算进去了。<\/p>\n<p><strong>直答：<\/strong> 语言模型学习根据前文预测下一个 token；生成时不断把预测接到前文，逐步写成完整回答。它认为某句话“容易出现”，并不等于这句话一定真实。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>本章进阶约定与范围：<\/strong><\/p>\n<p>定位：所有岗位共同底座。先理解概率、损失和梯度，再进入 DPO/GRPO。符号统一：x 为输入，y 为回答，t 为回答 token 位置，π 为模型条件概率；log 默认为自然对数。<\/p>\n<p><strong>技术表述：<\/strong> 学习给定前文时下一个 token 的条件分布，用链式法则组成整段文本的概率。<\/p>\n<p><strong>展开：<\/strong><\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>π<\/mi><mi>θ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><munderover><mo>∏<\/mo><mrow><mi>t<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><mrow><mi>T<\/mi><\/mrow><\/munderover><msub><mi>π<\/mi><mi>θ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>y<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo>,<\/mo><msub><mi>y<\/mi><mrow><mo>&lt;<\/mo><mi>t<\/mi><\/mrow><\/msub><mo stretchy=\"false\">)<\/mo><\/mrow><\/math><\/div>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>log<\/mi><msub><mi>π<\/mi><mi>θ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>y<\/mi><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><munderover><mo>∑<\/mo><mrow><mi>t<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><mrow><mi>T<\/mi><\/mrow><\/munderover><mi>log<\/mi><msub><mi>π<\/mi><mi>θ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>y<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"false\">|<\/mo><mi>x<\/mi><mo>,<\/mo><msub><mi>y<\/mi><mrow><mo>&lt;<\/mo><mi>t<\/mi><\/mrow><\/msub><mo stretchy=\"false\">)<\/mo><mo>.<\/mo><\/mrow><\/math><\/div>\n<p>训练常用最大似然，等价于最小化正确 token 的负对数概率。高概率表示模型在当前条件下更倾向生成，并不自动表示真实、合理或安全。<\/p>\n<p><strong>追问：为什么训练可并行、生成通常串行？<\/strong> 训练时已有整段真实序列，可一次计算所有位置；生成时后一个 token 依赖已经采样出的前文。<\/p>\n<p><strong>易错：<\/strong> 不要把整个回答概率当成各 token 概率相加；相加的是 log 概率。依据：<a class=\"ref\" href=\"#source-S01\">S01<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-M02" type="application/json">{"body":"### 先别背定义：模型怎样为一次猜测扣分？\n\n我们只玩一个小游戏：猜下一次摸出的是红球还是蓝球。每次摸完放回、打乱再摸。模型先报概率，随后公布结果。\n\n假设这次确实摸出了红球。模型给红球的概率越高，说明这一次越“料到了”，扣分就应该越少；如果它很肯定地说“红球几乎不可能”，结果偏偏是红球，就应该重扣。\n\n交叉熵在这个单次、明确标签的例子中采用这样的扣分规则：\n\n$$\\text{本次扣分}=-\\ln(\\text{模型给实际结果的概率})$$\n\nln 是自然对数，一种数学函数。暂时不用会推导，先看它怎样扣分：\n\n| 给实际红球的概率 | 本次扣分（约） | 直觉 |\n|---|---:|---|\n| 90% | 0.105 | 猜得比较有把握，扣得少 |\n| 50% | 0.693 | 没什么把握，扣得更多 |\n| 10% | 2.303 | 给实际结果的概率很低，重扣 |\n| 1% | 4.605 | 几乎否认实际结果，扣得更重 |\n\n**为什么不用“猜对/猜错”就够了？** 两个模型都选红球，一个给 51%，另一个给 90%，只看对错无法区分它们。交叉熵能利用概率的变化，给训练提供更细的反馈。这里是在说这一次红球结果的得分，不能据此要求模型对所有事情都报 100%。\n\n### 再看很多次：交叉熵是什么？\n\n假设长期摸球有 80% 是红球、20% 是蓝球。把这套实际比例叫 **p**。模型却预测红球 60%、蓝球 40%，把模型的预测叫 **q**。\n\n它不光在红球出现时扣分，蓝球出现时也扣分。把很多次的扣分求平均：\n\n$$H(p,q)=0.8\\times(-\\ln0.6)+0.2\\times(-\\ln0.4)\\approx0.592$$\n\n这就是本例的**交叉熵：按实际出现的比例，计算模型平均会被扣多少分**。“交叉”可以记作涉及两套概率：实际比例 p，预测比例 q。\n\n训练想让这个平均扣分下降。因此，不能靠每次都报“100% 红球”取巧：蓝球确实会出现，到时会遭到极重的惩罚。\n\n### KL 散度：其中有多少分是可以避免的？\n\n现在让模型完全猜准长期比例，也报红球 80%、蓝球 20%。平均扣分仍然不是 0：\n\n$$H(p)=0.8\\times(-\\ln0.8)+0.2\\times(-\\ln0.2)\\approx0.500$$\n\n为什么还扣分？因为**猜准概率不等于预知每一次结果**。球本来就有随机性。0.500 是这个游戏在该评分规则下，知道真实比例也避免不了的平均扣分，这部分叫**熵**。\n\n旧模型平均扣 0.592，其中约 0.500 来自游戏本身的不确定性，剩下约 0.092 来自把 80/20 猜成 60/40。这一部分额外扣分，就是 KL 散度：\n\n$$D_{\\mathrm{KL}}(p\\|q)=H(p,q)-H(p)\\approx0.592-0.500=0.092$$\n\n**请抓住这三个区别：**\n\n- 熵：结果本身有多不确定。\n- 交叉熵：用模型这套概率去预测，平均扣多少分。\n- KL：相对于知道实际概率的最佳预测，模型额外多扣了多少分。\n\n预测分布和真实分布完全一样时，KL 为 0；交叉熵一般仍大于 0。只有实际结果本身完全确定，而且模型也预测得完全确定时，本例的最低交叉熵才是 0。\n\n### “最大似然”又是怎么接上的？\n\n假设连续观察到“红、红、蓝”。模型给这串结果的概率为 0.6×0.6×0.4。**最大似然**就是调整模型，让已经观察到的数据整体上更有可能出现。\n\n对乘积取对数后，乘法变加法；再加负号，“让概率尽量大”就变成“让扣分尽量小”。所以常见监督训练中，最大似然和最小化平均交叉熵是同一个优化方向。\n\n放回语言模型：我们不一定知道某个上下文后每个词的真实概率，只看到了语料实际写下的 token。训练会对这些实际 token 的负对数概率求平均，这就是常说的语言模型交叉熵损失。\n\n**直答：** 交叉熵是模型对实际结果的平均扣分；KL 是其中因预测概率不匹配而产生的额外扣分。真实分布固定时，它自身的熵不变，所以降低交叉熵也就在降低 KL。最大似然则从“让观察到的数据更可能出现”的角度表达同一训练目标。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 交叉熵是用预测分布 q 编码真实分布 p 的平均代价；KL 是相对 p 自身的额外代价。固定 p 时最小化交叉熵等价于最小化 KL。\n\n$$H(p,q)=-\\sum_i p_i\\log q_i$$\n\n$$D_{\\mathrm{KL}}(p\\|q)=H(p,q)-H(p).$$\n\n监督标签为 one-hot 时，单样本交叉熵就是 −log q_y。对样本平均得到经验负对数似然。语言模型中的 p 通常不是已知完整分布，而由语料中的实际 token 提供采样监督。\n\n**追问：交叉熵降低，业务效果一定提升吗？** 不一定。训练分布、token 权重和业务代价可能不一致；还要看冻结任务集、长尾类别与安全边界。\n\n**易错：** KL 不对称，也不是距离度量；比较 loss 前先统一 tokenizer、mask 与归一化方式。","html":"<h3>先别背定义：模型怎样为一次猜测扣分？<\/h3>\n<p>我们只玩一个小游戏：猜下一次摸出的是红球还是蓝球。每次摸完放回、打乱再摸。模型先报概率，随后公布结果。<\/p>\n<p>假设这次确实摸出了红球。模型给红球的概率越高，说明这一次越“料到了”，扣分就应该越少；如果它很肯定地说“红球几乎不可能”，结果偏偏是红球，就应该重扣。<\/p>\n<p>交叉熵在这个单次、明确标签的例子中采用这样的扣分规则：<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mtext>本次扣分<\/mtext><mo>=<\/mo><mo>−<\/mo><mi>ln<\/mi><mo stretchy=\"false\">(<\/mo><mtext>模型给实际结果的概率<\/mtext><mo stretchy=\"false\">)<\/mo><\/mrow><\/math><\/div>\n<p>ln 是自然对数，一种数学函数。暂时不用会推导，先看它怎样扣分：<\/p>\n<table>\n<thead>\n<tr>\n<th>给实际红球的概率<\/th>\n<th style=\"text-align: right;\">本次扣分（约）<\/th>\n<th>直觉<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>90%<\/td>\n<td style=\"text-align: right;\">0.105<\/td>\n<td>猜得比较有把握，扣得少<\/td>\n<\/tr>\n<tr>\n<td>50%<\/td>\n<td style=\"text-align: right;\">0.693<\/td>\n<td>没什么把握，扣得更多<\/td>\n<\/tr>\n<tr>\n<td>10%<\/td>\n<td style=\"text-align: right;\">2.303<\/td>\n<td>给实际结果的概率很低，重扣<\/td>\n<\/tr>\n<tr>\n<td>1%<\/td>\n<td style=\"text-align: right;\">4.605<\/td>\n<td>几乎否认实际结果，扣得更重<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>为什么不用“猜对/猜错”就够了？<\/strong> 两个模型都选红球，一个给 51%，另一个给 90%，只看对错无法区分它们。交叉熵能利用概率的变化，给训练提供更细的反馈。这里是在说这一次红球结果的得分，不能据此要求模型对所有事情都报 100%。<\/p>\n<h3>再看很多次：交叉熵是什么？<\/h3>\n<p>假设长期摸球有 80% 是红球、20% 是蓝球。把这套实际比例叫 <strong>p<\/strong>。模型却预测红球 60%、蓝球 40%，把模型的预测叫 <strong>q<\/strong>。<\/p>\n<p>它不光在红球出现时扣分，蓝球出现时也扣分。把很多次的扣分求平均：<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>H<\/mi><mo stretchy=\"false\">(<\/mo><mi>p<\/mi><mo>,<\/mo><mi>q<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>0.8<\/mn><mi>×<\/mi><mo stretchy=\"false\">(<\/mo><mo>−<\/mo><mi>ln<\/mi><mn>0.6<\/mn><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><mn>0.2<\/mn><mi>×<\/mi><mo stretchy=\"false\">(<\/mo><mo>−<\/mo><mi>ln<\/mi><mn>0.4<\/mn><mo stretchy=\"false\">)<\/mo><mo>≈<\/mo><mn>0.592<\/mn><\/mrow><\/math><\/div>\n<p>这就是本例的<strong>交叉熵：按实际出现的比例，计算模型平均会被扣多少分<\/strong>。“交叉”可以记作涉及两套概率：实际比例 p，预测比例 q。<\/p>\n<p>训练想让这个平均扣分下降。因此，不能靠每次都报“100% 红球”取巧：蓝球确实会出现，到时会遭到极重的惩罚。<\/p>\n<h3>KL 散度：其中有多少分是可以避免的？<\/h3>\n<p>现在让模型完全猜准长期比例，也报红球 80%、蓝球 20%。平均扣分仍然不是 0：<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>H<\/mi><mo stretchy=\"false\">(<\/mo><mi>p<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mn>0.8<\/mn><mi>×<\/mi><mo stretchy=\"false\">(<\/mo><mo>−<\/mo><mi>ln<\/mi><mn>0.8<\/mn><mo stretchy=\"false\">)<\/mo><mo>+<\/mo><mn>0.2<\/mn><mi>×<\/mi><mo stretchy=\"false\">(<\/mo><mo>−<\/mo><mi>ln<\/mi><mn>0.2<\/mn><mo stretchy=\"false\">)<\/mo><mo>≈<\/mo><mn>0.500<\/mn><\/mrow><\/math><\/div>\n<p>为什么还扣分？因为<strong>猜准概率不等于预知每一次结果<\/strong>。球本来就有随机性。0.500 是这个游戏在该评分规则下，知道真实比例也避免不了的平均扣分，这部分叫<strong>熵<\/strong>。<\/p>\n<p>旧模型平均扣 0.592，其中约 0.500 来自游戏本身的不确定性，剩下约 0.092 来自把 80/20 猜成 60/40。这一部分额外扣分，就是 KL 散度：<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>D<\/mi><mrow><mrow><mi mathvariant=\"normal\">K<\/mi><mi mathvariant=\"normal\">L<\/mi><\/mrow><\/mrow><\/msub><mo stretchy=\"false\">(<\/mo><mi>p<\/mi><mo fence=\"false\" stretchy=\"false\">‖<\/mo><mi>q<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mi>H<\/mi><mo stretchy=\"false\">(<\/mo><mi>p<\/mi><mo>,<\/mo><mi>q<\/mi><mo stretchy=\"false\">)<\/mo><mo>−<\/mo><mi>H<\/mi><mo stretchy=\"false\">(<\/mo><mi>p<\/mi><mo stretchy=\"false\">)<\/mo><mo>≈<\/mo><mn>0.592<\/mn><mo>−<\/mo><mn>0.500<\/mn><mo>=<\/mo><mn>0.092<\/mn><\/mrow><\/math><\/div>\n<p><strong>请抓住这三个区别：<\/strong><\/p>\n<ul>\n<li>熵：结果本身有多不确定。<\/li>\n<li>交叉熵：用模型这套概率去预测，平均扣多少分。<\/li>\n<li>KL：相对于知道实际概率的最佳预测，模型额外多扣了多少分。<\/li>\n<\/ul>\n<p>预测分布和真实分布完全一样时，KL 为 0；交叉熵一般仍大于 0。只有实际结果本身完全确定，而且模型也预测得完全确定时，本例的最低交叉熵才是 0。<\/p>\n<h3>“最大似然”又是怎么接上的？<\/h3>\n<p>假设连续观察到“红、红、蓝”。模型给这串结果的概率为 0.6×0.6×0.4。<strong>最大似然<\/strong>就是调整模型，让已经观察到的数据整体上更有可能出现。<\/p>\n<p>对乘积取对数后，乘法变加法；再加负号，“让概率尽量大”就变成“让扣分尽量小”。所以常见监督训练中，最大似然和最小化平均交叉熵是同一个优化方向。<\/p>\n<p>放回语言模型：我们不一定知道某个上下文后每个词的真实概率，只看到了语料实际写下的 token。训练会对这些实际 token 的负对数概率求平均，这就是常说的语言模型交叉熵损失。<\/p>\n<p><strong>直答：<\/strong> 交叉熵是模型对实际结果的平均扣分；KL 是其中因预测概率不匹配而产生的额外扣分。真实分布固定时，它自身的熵不变，所以降低交叉熵也就在降低 KL。最大似然则从“让观察到的数据更可能出现”的角度表达同一训练目标。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 交叉熵是用预测分布 q 编码真实分布 p 的平均代价；KL 是相对 p 自身的额外代价。固定 p 时最小化交叉熵等价于最小化 KL。<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>H<\/mi><mo stretchy=\"false\">(<\/mo><mi>p<\/mi><mo>,<\/mo><mi>q<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mo>−<\/mo><munder><mo>∑<\/mo><mi>i<\/mi><\/munder><msub><mi>p<\/mi><mi>i<\/mi><\/msub><mi>log<\/mi><msub><mi>q<\/mi><mi>i<\/mi><\/msub><\/mrow><\/math><\/div>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>D<\/mi><mrow><mrow><mi mathvariant=\"normal\">K<\/mi><mi mathvariant=\"normal\">L<\/mi><\/mrow><\/mrow><\/msub><mo stretchy=\"false\">(<\/mo><mi>p<\/mi><mo fence=\"false\" stretchy=\"false\">‖<\/mo><mi>q<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mi>H<\/mi><mo stretchy=\"false\">(<\/mo><mi>p<\/mi><mo>,<\/mo><mi>q<\/mi><mo stretchy=\"false\">)<\/mo><mo>−<\/mo><mi>H<\/mi><mo stretchy=\"false\">(<\/mo><mi>p<\/mi><mo stretchy=\"false\">)<\/mo><mo>.<\/mo><\/mrow><\/math><\/div>\n<p>监督标签为 one-hot 时，单样本交叉熵就是 −log q_y。对样本平均得到经验负对数似然。语言模型中的 p 通常不是已知完整分布，而由语料中的实际 token 提供采样监督。<\/p>\n<p><strong>追问：交叉熵降低，业务效果一定提升吗？<\/strong> 不一定。训练分布、token 权重和业务代价可能不一致；还要看冻结任务集、长尾类别与安全边界。<\/p>\n<p><strong>易错：<\/strong> KL 不对称，也不是距离度量；比较 loss 前先统一 tokenizer、mask 与归一化方式。<\/p><\/div><\/details>"}</script>
<script id="data-q-M03" type="application/json">{"body":"### 先看“谁出题，谁漏掉了答案”\n\n上一题把实际分布写成 p、预测写成 q。这一题换成“教师 p、学生 q”：老师认为两个答案都不错，学生的能力却只够熟练掌握一部分。\n\n**KL(p‖q) 像老师按自己的答案比例出题，再检查学生。** 老师经常出的答案，学生不能直接说“这种答案概率为零”，否则遇到它时扣分会非常大。于是学生有动力照顾老师的多种答案。\n\n**KL(q‖p) 则按学生自己的答案比例检查。** 学生经常说的答案，在老师眼中也得说得通；学生如果总往老师认为极不合理的方向回答，就会吃亏。学生很少去的方向，对这次平均检查的贡献也较小。\n\n这就是为什么人们常说前一种倾向于“多覆盖一些可能答案”，后一种可能“集中在少数可靠答案”。这是某些受限情况下的倾向：如果学生能完整学会老师，两种方法都可以在两者相同时达到 0。\n\n**直答：** KL 的方向决定按谁的概率来算平均、重点惩罚哪种不匹配。先写清教师和学生分别在哪边，再讨论覆盖多种答案还是集中回答；不要把这些倾向背成无条件定律。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 必须先写方向。以教师 p、学生 q 为例，前向 KL(p‖q) 对教师有概率而学生遗漏的位置惩罚很重；反向 KL(q‖p) 更惩罚学生去教师低概率的位置。\n\n**展开：** “覆盖模式”和“集中模式”是容量有限、分布多峰等条件下常见的优化倾向，不是所有问题的绝对定理。若学生能完全表示教师且优化成功，两种 KL 都在 p=q 时达到零。\n\n**追问：为什么蒸馏需要关心熵？** 教师不确定时可能有多条有效路径，过度集中会损失探索空间；但强迫小模型覆盖所有低概率尾部也可能浪费容量。参见 F03。\n\n**易错：** 不能只背“forward/reverse”不说明谁在前；也不能将 token 上的 KL 与完整序列 KL 无条件混用。依据：S19。","html":"<h3>先看“谁出题，谁漏掉了答案”<\/h3>\n<p>上一题把实际分布写成 p、预测写成 q。这一题换成“教师 p、学生 q”：老师认为两个答案都不错，学生的能力却只够熟练掌握一部分。<\/p>\n<p><strong>KL(p‖q) 像老师按自己的答案比例出题，再检查学生。<\/strong> 老师经常出的答案，学生不能直接说“这种答案概率为零”，否则遇到它时扣分会非常大。于是学生有动力照顾老师的多种答案。<\/p>\n<p><strong>KL(q‖p) 则按学生自己的答案比例检查。<\/strong> 学生经常说的答案，在老师眼中也得说得通；学生如果总往老师认为极不合理的方向回答，就会吃亏。学生很少去的方向，对这次平均检查的贡献也较小。<\/p>\n<p>这就是为什么人们常说前一种倾向于“多覆盖一些可能答案”，后一种可能“集中在少数可靠答案”。这是某些受限情况下的倾向：如果学生能完整学会老师，两种方法都可以在两者相同时达到 0。<\/p>\n<p><strong>直答：<\/strong> KL 的方向决定按谁的概率来算平均、重点惩罚哪种不匹配。先写清教师和学生分别在哪边，再讨论覆盖多种答案还是集中回答；不要把这些倾向背成无条件定律。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 必须先写方向。以教师 p、学生 q 为例，前向 KL(p‖q) 对教师有概率而学生遗漏的位置惩罚很重；反向 KL(q‖p) 更惩罚学生去教师低概率的位置。<\/p>\n<p><strong>展开：<\/strong> “覆盖模式”和“集中模式”是容量有限、分布多峰等条件下常见的优化倾向，不是所有问题的绝对定理。若学生能完全表示教师且优化成功，两种 KL 都在 p=q 时达到零。<\/p>\n<p><strong>追问：为什么蒸馏需要关心熵？<\/strong> 教师不确定时可能有多条有效路径，过度集中会损失探索空间；但强迫小模型覆盖所有低概率尾部也可能浪费容量。参见 <a class=\"ref\" href=\"#q-F03\">F03<\/a>。<\/p>\n<p><strong>易错：<\/strong> 不能只背“forward/reverse”不说明谁在前；也不能将 token 上的 KL 与完整序列 KL 无条件混用。依据：<a class=\"ref\" href=\"#source-S19\">S19<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-M04" type="application/json">{"body":"### 模型先给分，再把分变成概率\n\n模型最后往往先算出一组普通分数，叫 **logits**。这些数可以大于 1，也可以为负，还不是概率。**softmax** 把它们变成一组加起来等于 1 的概率，分高的得到更大概率。\n\n做法是：先对每个分数取指数，再除以所有指数的总和。为什么还要减最大值？假设分数为 1000、1001，指数会大到计算机装不下。\n\n把两个分数都减去 1001，就变成 −1、0，指数约为 0.368、1。归一化后概率约 26.9%、73.1%。共同减去同一个数，相当于分子分母同时除以同一个倍数，因此结果不变。\n\n**直答：** softmax 把分数变成概率；计算前共同减去最大分数，既保留原来的概率结果，又避免指数过大导致计算出错。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 不改变结果，却能避免 exp 对大数溢出。\n\n$$p_i=\\frac{e^{z_i-m}}{\\sum_j e^{z_j-m}}$$\n\n$$\\log\\sum_i e^{z_i}=m+\\log\\sum_i e^{z_i-m},\\ m=\\max_i z_i.$$\n\n**展开：** logits=[1000,1001] 时直接求 exp 容易溢出，减最大值后变成 [−1,0]。训练优先使用 log_softmax、cross_entropy 等稳定算子，不先算极小概率再取 log。\n\n**追问：所有位置都被 mask 为 −∞ 呢？** softmax 的分母没有有效质量，可能出现 NaN；应保证至少一个有效元素，或显式处理空行，不能只把 NaN 置零掩盖数据问题。\n\n**易错：** 减均值也具有平移不变性，但不保证指数上界为 1。","html":"<h3>模型先给分，再把分变成概率<\/h3>\n<p>模型最后往往先算出一组普通分数，叫 <strong>logits<\/strong>。这些数可以大于 1，也可以为负，还不是概率。<strong>softmax<\/strong> 把它们变成一组加起来等于 1 的概率，分高的得到更大概率。<\/p>\n<p>做法是：先对每个分数取指数，再除以所有指数的总和。为什么还要减最大值？假设分数为 1000、1001，指数会大到计算机装不下。<\/p>\n<p>把两个分数都减去 1001，就变成 −1、0，指数约为 0.368、1。归一化后概率约 26.9%、73.1%。共同减去同一个数，相当于分子分母同时除以同一个倍数，因此结果不变。<\/p>\n<p><strong>直答：<\/strong> softmax 把分数变成概率；计算前共同减去最大分数，既保留原来的概率结果，又避免指数过大导致计算出错。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 不改变结果，却能避免 exp 对大数溢出。<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>p<\/mi><mi>i<\/mi><\/msub><mo>=<\/mo><mfrac><mrow><msup><mi>e<\/mi><mrow><msub><mi>z<\/mi><mi>i<\/mi><\/msub><mo>−<\/mo><mi>m<\/mi><\/mrow><\/msup><\/mrow><mrow><msub><mo>∑<\/mo><mi>j<\/mi><\/msub><msup><mi>e<\/mi><mrow><msub><mi>z<\/mi><mi>j<\/mi><\/msub><mo>−<\/mo><mi>m<\/mi><\/mrow><\/msup><\/mrow><\/mfrac><\/mrow><\/math><\/div>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>log<\/mi><munder><mo>∑<\/mo><mi>i<\/mi><\/munder><msup><mi>e<\/mi><mrow><msub><mi>z<\/mi><mi>i<\/mi><\/msub><\/mrow><\/msup><mo>=<\/mo><mi>m<\/mi><mo>+<\/mo><mi>log<\/mi><munder><mo>∑<\/mo><mi>i<\/mi><\/munder><msup><mi>e<\/mi><mrow><msub><mi>z<\/mi><mi>i<\/mi><\/msub><mo>−<\/mo><mi>m<\/mi><\/mrow><\/msup><mo>,<\/mo><mtext> <\/mtext><mi>m<\/mi><mo>=<\/mo><msub><mo>max<\/mo><mi>i<\/mi><\/msub><msub><mi>z<\/mi><mi>i<\/mi><\/msub><mo>.<\/mo><\/mrow><\/math><\/div>\n<p><strong>展开：<\/strong> logits=[1000,1001] 时直接求 exp 容易溢出，减最大值后变成 [−1,0]。训练优先使用 log_softmax、cross_entropy 等稳定算子，不先算极小概率再取 log。<\/p>\n<p><strong>追问：所有位置都被 mask 为 −∞ 呢？<\/strong> softmax 的分母没有有效质量，可能出现 NaN；应保证至少一个有效元素，或显式处理空行，不能只把 NaN 置零掩盖数据问题。<\/p>\n<p><strong>易错：<\/strong> 减均值也具有平移不变性，但不保证指数上界为 1。<\/p><\/div><\/details>"}</script>
<script id="data-q-M05" type="application/json">{"body":"### 梯度就是“这项分数该往哪边调”\n\n先读 M04：模型先给每个候选一个分数，再变成概率。**梯度**告诉我们：分数稍微动一点，损失会朝哪边变。训练采用“减去梯度”的方向来降低损失。\n\n假设三个候选是“水、茶、咖啡”，模型概率为 [0.2,0.3,0.5]，课本上的正确答案是“茶”。把正确标签写成 [0,1,0]：正确位置为 1，其他为 0。这叫 one-hot 标签。\n\n交叉熵对这三个分数的梯度，恰好是：\n\n$$[0.2,0.3,0.5]-[0,1,0]=[0.2,-0.7,0.5]$$\n\n减去梯度后：“茶”的分数上升，另外两个下降。这里先把三个分数看成可以单独调整的旋钮；实际网络共享很多参数，一次更新还会影响其他输入。\n\n**直答：** softmax 配合交叉熵时，对输出分数的梯度是“预测概率减标签”。正确类得到负梯度、其他类得到正梯度，因此梯度下降会在输出分数这一层提高正确类、压低其他类。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** log-softmax 的导数与负对数似然相消，得到预测概率减真实标签。\n\n$$L=-\\sum_i y_i\\log p_i=-\\sum_i y_i z_i+\\log\\sum_j e^{z_j}$$\n\n$$\\frac{\\partial L}{\\partial z_i}=p_i-y_i.$$\n\n假设标签归一化到和为 1。对正确类，p_y−1≤0，梯度下降提高其 logit；其他类导数非负，梯度下降降低其 logit。\n\n**追问：为什么不是“只更新正确 token”？** softmax 的分母连接整个词表，因此一个位置的监督会影响所有类别 logits，再通过网络反向传播。\n\n**练习：** p=[0.2,0.3,0.5]，真实类为第二类，梯度为 [0.2,−0.7,0.5]，总和为零。","html":"<h3>梯度就是“这项分数该往哪边调”<\/h3>\n<p>先读 <a class=\"ref\" href=\"#q-M04\">M04<\/a>：模型先给每个候选一个分数，再变成概率。<strong>梯度<\/strong>告诉我们：分数稍微动一点，损失会朝哪边变。训练采用“减去梯度”的方向来降低损失。<\/p>\n<p>假设三个候选是“水、茶、咖啡”，模型概率为 [0.2,0.3,0.5]，课本上的正确答案是“茶”。把正确标签写成 [0,1,0]：正确位置为 1，其他为 0。这叫 one-hot 标签。<\/p>\n<p>交叉熵对这三个分数的梯度，恰好是：<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mo stretchy=\"false\">[<\/mo><mn>0.2<\/mn><mo>,<\/mo><mn>0.3<\/mn><mo>,<\/mo><mn>0.5<\/mn><mo stretchy=\"false\">]<\/mo><mo>−<\/mo><mo stretchy=\"false\">[<\/mo><mn>0<\/mn><mo>,<\/mo><mn>1<\/mn><mo>,<\/mo><mn>0<\/mn><mo stretchy=\"false\">]<\/mo><mo>=<\/mo><mo stretchy=\"false\">[<\/mo><mn>0.2<\/mn><mo>,<\/mo><mo>−<\/mo><mn>0.7<\/mn><mo>,<\/mo><mn>0.5<\/mn><mo stretchy=\"false\">]<\/mo><\/mrow><\/math><\/div>\n<p>减去梯度后：“茶”的分数上升，另外两个下降。这里先把三个分数看成可以单独调整的旋钮；实际网络共享很多参数，一次更新还会影响其他输入。<\/p>\n<p><strong>直答：<\/strong> softmax 配合交叉熵时，对输出分数的梯度是“预测概率减标签”。正确类得到负梯度、其他类得到正梯度，因此梯度下降会在输出分数这一层提高正确类、压低其他类。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> log-softmax 的导数与负对数似然相消，得到预测概率减真实标签。<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>L<\/mi><mo>=<\/mo><mo>−<\/mo><munder><mo>∑<\/mo><mi>i<\/mi><\/munder><msub><mi>y<\/mi><mi>i<\/mi><\/msub><mi>log<\/mi><msub><mi>p<\/mi><mi>i<\/mi><\/msub><mo>=<\/mo><mo>−<\/mo><munder><mo>∑<\/mo><mi>i<\/mi><\/munder><msub><mi>y<\/mi><mi>i<\/mi><\/msub><msub><mi>z<\/mi><mi>i<\/mi><\/msub><mo>+<\/mo><mi>log<\/mi><munder><mo>∑<\/mo><mi>j<\/mi><\/munder><msup><mi>e<\/mi><mrow><msub><mi>z<\/mi><mi>j<\/mi><\/msub><\/mrow><\/msup><\/mrow><\/math><\/div>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mfrac><mrow><mo>∂<\/mo><mi>L<\/mi><\/mrow><mrow><mo>∂<\/mo><msub><mi>z<\/mi><mi>i<\/mi><\/msub><\/mrow><\/mfrac><mo>=<\/mo><msub><mi>p<\/mi><mi>i<\/mi><\/msub><mo>−<\/mo><msub><mi>y<\/mi><mi>i<\/mi><\/msub><mo>.<\/mo><\/mrow><\/math><\/div>\n<p>假设标签归一化到和为 1。对正确类，p_y−1≤0，梯度下降提高其 logit；其他类导数非负，梯度下降降低其 logit。<\/p>\n<p><strong>追问：为什么不是“只更新正确 token”？<\/strong> softmax 的分母连接整个词表，因此一个位置的监督会影响所有类别 logits，再通过网络反向传播。<\/p>\n<p><strong>练习：<\/strong> p=[0.2,0.3,0.5]，真实类为第二类，梯度为 [0.2,−0.7,0.5]，总和为零。<\/p><\/div><\/details>"}</script>
<script id="data-q-M06" type="application/json">{"body":"### 把抽象扣分换成“像在几选一”\n\n如果每次正确 token 的概率都为 1/4，模型就像每次都面对四个同样可能的选择。它的平均扣分是 ln4，把它取指数又得到 4。这个数就是 **困惑度 PPL**。\n\n因此 PPL=4 可以粗略理解为“这套预测的不确定程度，相当于每步在四个等可能选项里猜”。它不表示模型内部真的只保留四个候选。\n\n比较前要先统一“每步”是什么。同一句话，一个分词器切成 5 块，另一个切成 10 块，预测单位和任务难度都变了，不能直接拿 PPL 数字排高低。\n\n**直答：** 困惑度把平均 token 扣分转换成一个较直观的不确定性指标。同一数据和计算口径下越低通常越好，但不能直接跨分词器比较，也不能替代聊天质量评测。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** PPL 是平均 token 负对数似然的指数，可理解为模型平均面临多少个等可能选择。\n\n$$\\mathrm{PPL}=\\exp\\left(-\\frac{1}{N}\\sum_{t=1}^{N}\\log p_t\\right).$$\n\n**展开：** 平均 NLL 为 ln 2 时 PPL=2。不同 tokenizer 会改变单位、序列长度和预测难度，直接比较数值常无意义。还应统一数据、预处理、上下文长度、是否计入提示词及特殊 token。\n\n**追问：PPL 小，聊天一定好？** 不一定。模型可能更像训练语料，但指令遵循、安全性和事实正确性仍需任务评测。\n\n**易错：** 先分别求每条样本 PPL 再平均，一般不等于全体有效 token 的 PPL；指数是非线性的。","html":"<h3>把抽象扣分换成“像在几选一”<\/h3>\n<p>如果每次正确 token 的概率都为 1/4，模型就像每次都面对四个同样可能的选择。它的平均扣分是 ln4，把它取指数又得到 4。这个数就是 <strong>困惑度 PPL<\/strong>。<\/p>\n<p>因此 PPL=4 可以粗略理解为“这套预测的不确定程度，相当于每步在四个等可能选项里猜”。它不表示模型内部真的只保留四个候选。<\/p>\n<p>比较前要先统一“每步”是什么。同一句话，一个分词器切成 5 块，另一个切成 10 块，预测单位和任务难度都变了，不能直接拿 PPL 数字排高低。<\/p>\n<p><strong>直答：<\/strong> 困惑度把平均 token 扣分转换成一个较直观的不确定性指标。同一数据和计算口径下越低通常越好，但不能直接跨分词器比较，也不能替代聊天质量评测。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> PPL 是平均 token 负对数似然的指数，可理解为模型平均面临多少个等可能选择。<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mrow><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">P<\/mi><mi mathvariant=\"normal\">L<\/mi><\/mrow><mo>=<\/mo><mi>exp<\/mi><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">(<\/mo><mo>−<\/mo><mfrac><mrow><mn>1<\/mn><\/mrow><mrow><mi>N<\/mi><\/mrow><\/mfrac><msubsup><mo>∑<\/mo><mrow><mi>t<\/mi><mo>=<\/mo><mn>1<\/mn><\/mrow><mrow><mi>N<\/mi><\/mrow><\/msubsup><mi>log<\/mi><msub><mi>p<\/mi><mi>t<\/mi><\/msub><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">)<\/mo><\/mrow><mo>.<\/mo><\/mrow><\/math><\/div>\n<p><strong>展开：<\/strong> 平均 NLL 为 ln 2 时 PPL=2。不同 tokenizer 会改变单位、序列长度和预测难度，直接比较数值常无意义。还应统一数据、预处理、上下文长度、是否计入提示词及特殊 token。<\/p>\n<p><strong>追问：PPL 小，聊天一定好？<\/strong> 不一定。模型可能更像训练语料，但指令遵循、安全性和事实正确性仍需任务评测。<\/p>\n<p><strong>易错：<\/strong> 先分别求每条样本 PPL 再平均，一般不等于全体有效 token 的 PPL；指数是非线性的。<\/p><\/div><\/details>"}</script>
<script id="data-q-M07" type="application/json">{"body":"### 下山时，方向和步子怎么决定？\n\n把损失想成山的高度，训练就是找更低的地方。梯度给出局部坡度，**学习率**决定一步迈多远。太大可能越过低点来回跳，太小则走得慢。\n\nAdam 不只看这一步的坡，还记住近期的方向和变化大小：方向长期一致就更明确地往那边走，变化很剧烈的参数则调整步子。这里“记住”是指保存移动平均数。\n\nAdamW 另外做一件事：每次适当把权重向零缩一点，称为**权重衰减**。它把这件事与根据坡度走路分开处理。warmup 则像先用小步适应，再逐渐走到计划步长。\n\n**直答：** 学习率控制更新幅度；Adam 根据近期梯度调整各参数步长；AdamW 单独处理权重衰减。它们帮助稳定优化，但调优化器不能弥补训练数据或标签错误。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** Adam 用梯度的一阶、二阶滑动统计调整各参数的步长；AdamW 将权重衰减与梯度更新分开。\n\n**展开：** m 跟踪梯度方向，v 跟踪梯度平方，偏差修正后用 m̂/(√v̂+ε) 更新。Adam 中把 L2 加到损失会进入这些统计量；AdamW 的衰减项直接作用于权重，两者通常不等价。\n\n**追问：为什么 warmup？** 初期梯度和优化器统计尚不稳定，逐步升高学习率能减少突变风险。它不能修复错误标签、mask 或数值异常。\n\n**面试落地：** 调参先看 loss、梯度范数、有效 token 数与学习率曲线；不要把 warmup 比例当成普适常数。依据：S55。","html":"<h3>下山时，方向和步子怎么决定？<\/h3>\n<p>把损失想成山的高度，训练就是找更低的地方。梯度给出局部坡度，<strong>学习率<\/strong>决定一步迈多远。太大可能越过低点来回跳，太小则走得慢。<\/p>\n<p>Adam 不只看这一步的坡，还记住近期的方向和变化大小：方向长期一致就更明确地往那边走，变化很剧烈的参数则调整步子。这里“记住”是指保存移动平均数。<\/p>\n<p>AdamW 另外做一件事：每次适当把权重向零缩一点，称为<strong>权重衰减<\/strong>。它把这件事与根据坡度走路分开处理。warmup 则像先用小步适应，再逐渐走到计划步长。<\/p>\n<p><strong>直答：<\/strong> 学习率控制更新幅度；Adam 根据近期梯度调整各参数步长；AdamW 单独处理权重衰减。它们帮助稳定优化，但调优化器不能弥补训练数据或标签错误。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> Adam 用梯度的一阶、二阶滑动统计调整各参数的步长；AdamW 将权重衰减与梯度更新分开。<\/p>\n<p><strong>展开：<\/strong> m 跟踪梯度方向，v 跟踪梯度平方，偏差修正后用 m̂/(√v̂+ε) 更新。Adam 中把 L2 加到损失会进入这些统计量；AdamW 的衰减项直接作用于权重，两者通常不等价。<\/p>\n<p><strong>追问：为什么 warmup？<\/strong> 初期梯度和优化器统计尚不稳定，逐步升高学习率能减少突变风险。它不能修复错误标签、mask 或数值异常。<\/p>\n<p><strong>面试落地：<\/strong> 调参先看 loss、梯度范数、有效 token 数与学习率曲线；不要把 warmup 比例当成普适常数。依据：<a class=\"ref\" href=\"#source-S55\">S55<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-M08" type="application/json">{"body":"### 一次走太猛，和一次装不下，是两个问题\n\n**梯度裁剪**处理的是“这次更新建议太大”：例如整体梯度长度为 10，规定上限为 1，就把整组梯度等比例缩小。方向尽量保留，步子的冲动受限制。\n\n**梯度累积**处理的是“显存一次装不下这么多样本”：本来想看 32 条后更新，可以分 4 次、每次看 8 条，先把反馈累起来，最后统一更新一次。\n\n注意平均方式。一个小批有 100 个有效 token，另一个有 900 个，若目标是让每个 token 同等重要，就不能把两个小批的平均损失简单各算一半。\n\n**直答：** 裁剪限制过大的梯度；累积把多个小批次的反馈合并后再更新。前者控制更新幅度，后者帮助在有限显存下使用更大的有效批次。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 裁剪限制更新所用梯度的范数；累积将多个 micro-batch 的梯度合并后更新，以降低每次前向的显存需求。\n\n**展开：** 若数据并行卡数为 D、每卡 micro-batch 为 b、累积次数为 a，样本意义的有效 batch 约为 Dba。对变长序列，必须明确按样本还是按有效 token 平均；简单平均每个 micro-batch loss 可能让短批次权重过大。\n\n**追问：完全等价于大 batch 吗？** 在损失权重一致、参数在累积期间不更新等条件下接近；随机层、BatchNorm、数值舍入和调度细节可能导致差别。\n\n**易错：** 混合精度下通常先 unscale 再裁剪；不要每个 micro-batch 都执行 optimizer.step。","html":"<h3>一次走太猛，和一次装不下，是两个问题<\/h3>\n<p><strong>梯度裁剪<\/strong>处理的是“这次更新建议太大”：例如整体梯度长度为 10，规定上限为 1，就把整组梯度等比例缩小。方向尽量保留，步子的冲动受限制。<\/p>\n<p><strong>梯度累积<\/strong>处理的是“显存一次装不下这么多样本”：本来想看 32 条后更新，可以分 4 次、每次看 8 条，先把反馈累起来，最后统一更新一次。<\/p>\n<p>注意平均方式。一个小批有 100 个有效 token，另一个有 900 个，若目标是让每个 token 同等重要，就不能把两个小批的平均损失简单各算一半。<\/p>\n<p><strong>直答：<\/strong> 裁剪限制过大的梯度；累积把多个小批次的反馈合并后再更新。前者控制更新幅度，后者帮助在有限显存下使用更大的有效批次。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 裁剪限制更新所用梯度的范数；累积将多个 micro-batch 的梯度合并后更新，以降低每次前向的显存需求。<\/p>\n<p><strong>展开：<\/strong> 若数据并行卡数为 D、每卡 micro-batch 为 b、累积次数为 a，样本意义的有效 batch 约为 Dba。对变长序列，必须明确按样本还是按有效 token 平均；简单平均每个 micro-batch loss 可能让短批次权重过大。<\/p>\n<p><strong>追问：完全等价于大 batch 吗？<\/strong> 在损失权重一致、参数在累积期间不更新等条件下接近；随机层、BatchNorm、数值舍入和调度细节可能导致差别。<\/p>\n<p><strong>易错：<\/strong> 混合精度下通常先 unscale 再裁剪；不要每个 micro-batch 都执行 optimizer.step。<\/p><\/div><\/details>"}</script>
<script id="data-q-M09" type="application/json">{"body":"### “拿不准”与“故意多试几种”要分开\n\n红蓝球各 50% 时，你很难猜；红球 99% 时，你比较有把握。**熵**给这种不确定程度一个数：越平均、越拿不准，熵通常越高。\n\n**温度**是生成时调整概率的旋钮。较低温度把概率更多地集中给高分候选；较高温度让低分候选也更有机会被抽到。它改的是抽选规则，不会凭空增加模型知识。\n\n即使每个字都选得很随机，也可能只是生成一堆乱码。所以“token 选择更分散”和“有更多正确解题办法”不能画等号。\n\n**直答：** 熵衡量概率有多分散，温度用来调整采样概率；实际答案是否多样且有用，还要看语义和正确性，不能只看熵高不高。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 熵描述概率分布的不确定性；温度是修改采样分布的参数；实际答案多样性还取决于语义、搜索和输出长度。\n\n$$H(p)=-\\sum_i p_i\\log p_i,\\qquad p_i(T)=\\mathrm{softmax}(z_i/T),\\ T>0.$$\n\n高温度通常让固定 logits 的分布更平；温度趋近零趋向最大 logit，但并列最大值要另行处理。高 token 熵也可能只是乱用标点、语言混杂，不代表有多条有效推理路线。\n\n**追问：RL 中熵降低一定坏吗？** 若错误路径被剔除，下降可能有益；若正确路径也大量消失、难题全错，则应检查探索不足。","html":"<h3>“拿不准”与“故意多试几种”要分开<\/h3>\n<p>红蓝球各 50% 时，你很难猜；红球 99% 时，你比较有把握。<strong>熵<\/strong>给这种不确定程度一个数：越平均、越拿不准，熵通常越高。<\/p>\n<p><strong>温度<\/strong>是生成时调整概率的旋钮。较低温度把概率更多地集中给高分候选；较高温度让低分候选也更有机会被抽到。它改的是抽选规则，不会凭空增加模型知识。<\/p>\n<p>即使每个字都选得很随机，也可能只是生成一堆乱码。所以“token 选择更分散”和“有更多正确解题办法”不能画等号。<\/p>\n<p><strong>直答：<\/strong> 熵衡量概率有多分散，温度用来调整采样概率；实际答案是否多样且有用，还要看语义和正确性，不能只看熵高不高。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 熵描述概率分布的不确定性；温度是修改采样分布的参数；实际答案多样性还取决于语义、搜索和输出长度。<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>H<\/mi><mo stretchy=\"false\">(<\/mo><mi>p<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mo>−<\/mo><munder><mo>∑<\/mo><mi>i<\/mi><\/munder><msub><mi>p<\/mi><mi>i<\/mi><\/msub><mi>log<\/mi><msub><mi>p<\/mi><mi>i<\/mi><\/msub><mo>,<\/mo><mspace width=\"2em\" /><msub><mi>p<\/mi><mi>i<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><mi>T<\/mi><mo stretchy=\"false\">)<\/mo><mo>=<\/mo><mrow><mi mathvariant=\"normal\">s<\/mi><mi mathvariant=\"normal\">o<\/mi><mi mathvariant=\"normal\">f<\/mi><mi mathvariant=\"normal\">t<\/mi><mi mathvariant=\"normal\">m<\/mi><mi mathvariant=\"normal\">a<\/mi><mi mathvariant=\"normal\">x<\/mi><\/mrow><mo stretchy=\"false\">(<\/mo><msub><mi>z<\/mi><mi>i<\/mi><\/msub><mo>/<\/mo><mi>T<\/mi><mo stretchy=\"false\">)<\/mo><mo>,<\/mo><mtext> <\/mtext><mi>T<\/mi><mo>&gt;<\/mo><mn>0<\/mn><mo>.<\/mo><\/mrow><\/math><\/div>\n<p>高温度通常让固定 logits 的分布更平；温度趋近零趋向最大 logit，但并列最大值要另行处理。高 token 熵也可能只是乱用标点、语言混杂，不代表有多条有效推理路线。<\/p>\n<p><strong>追问：RL 中熵降低一定坏吗？<\/strong> 若错误路径被剔除，下降可能有益；若正确路径也大量消失、难题全错，则应检查探索不足。<\/p><\/div><\/details>"}</script>
<script id="data-q-M10" type="application/json">{"body":"### 只有眼前成绩，还是还要考虑已有判断？\n\n假设只有两条训练数据，很复杂的模型可能把它们记得一字不差，但对新数据很差。**最大似然 MLE**只从“这些已观察到的数据有多可能”来选参数。\n\n**最大后验 MAP**还加上对参数的先验判断。比如在没看到更多证据前，我们倾向于参数别过大，这会让一些极端、勉强迎合少量数据的方案吃亏。\n\n这就是一种正则化思路：别只顾训练集表现，也约束模型的选择。不过，约束参数大小和约束模型输出概率变化，是两种不同的约束。\n\n**直答：** MLE 根据已观察到的数据选择参数；MAP 同时考虑参数先验。特定先验能导出常见的正则化惩罚，但不能把所有约束都当作同一件事。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** MLE 只最大化数据似然；MAP 同时考虑参数先验。在高斯先验下，负对数先验产生 L2 型惩罚。\n\n**展开：** MAP 优化 log p(D|θ)+log p(θ)。这提供正则化的概率解释，但不意味着所有训练技巧都等价于某个简单先验，也不意味着参数 L2 与输出分布 KL 相同。\n\n**追问：SFT 混入通用数据算什么？** 是通过训练分布和多任务损失约束行为的工程方法，与直接约束参数范数不同。\n\n**易错：** DPO 的参考策略约束作用于输出分布的推导，不是“参数不能偏离初值”的逐元素惩罚。","html":"<h3>只有眼前成绩，还是还要考虑已有判断？<\/h3>\n<p>假设只有两条训练数据，很复杂的模型可能把它们记得一字不差，但对新数据很差。<strong>最大似然 MLE<\/strong>只从“这些已观察到的数据有多可能”来选参数。<\/p>\n<p><strong>最大后验 MAP<\/strong>还加上对参数的先验判断。比如在没看到更多证据前，我们倾向于参数别过大，这会让一些极端、勉强迎合少量数据的方案吃亏。<\/p>\n<p>这就是一种正则化思路：别只顾训练集表现，也约束模型的选择。不过，约束参数大小和约束模型输出概率变化，是两种不同的约束。<\/p>\n<p><strong>直答：<\/strong> MLE 根据已观察到的数据选择参数；MAP 同时考虑参数先验。特定先验能导出常见的正则化惩罚，但不能把所有约束都当作同一件事。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> MLE 只最大化数据似然；MAP 同时考虑参数先验。在高斯先验下，负对数先验产生 L2 型惩罚。<\/p>\n<p><strong>展开：<\/strong> MAP 优化 log p(D|θ)+log p(θ)。这提供正则化的概率解释，但不意味着所有训练技巧都等价于某个简单先验，也不意味着参数 L2 与输出分布 KL 相同。<\/p>\n<p><strong>追问：SFT 混入通用数据算什么？<\/strong> 是通过训练分布和多任务损失约束行为的工程方法，与直接约束参数范数不同。<\/p>\n<p><strong>易错：<\/strong> DPO 的参考策略约束作用于输出分布的推导，不是“参数不能偏离初值”的逐元素惩罚。<\/p><\/div><\/details>"}</script>
<script id="data-q-M11" type="application/json">{"body":"### 旧食堂的调查，能代表新食堂吗？\n\n原来的样本里，套餐 A、B 各占 50%；现在想估计 A 占 80%、B 占 20% 时的平均满意度。可以把旧调查中 A 的权重乘 0.8/0.5=1.6，B 乘 0.2/0.5=0.4，再求平均。这就是**重要性采样**的直觉：用权重修正样本比例差异。\n\n但旧调查如果从未问过 B，就不能凭空知道 B 的满意度；极少见样本被放得特别大，估计也可能很不稳定。\n\n在强化学习里，“策略”就是模型选择动作或 token 的规则。用当前策略采集数据叫 on-policy；使用其他或旧策略的数据叫 off-policy。概率比可以帮助修正变化，但有条件和代价。\n\n**直答：** on-policy/off-policy 区分数据由哪套策略产生；重要性采样用“目标概率÷采样概率”给旧数据加权，估计新分布下的结果，前提是旧数据覆盖目标需要的情况。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 数据来自当前目标策略叫 on-policy；来自其他或较旧策略叫 off-policy。重要性采样用概率比修正分布差异。\n\n$$\\mathbb E_{a\\sim p}[f(a)]=\\mathbb E_{a\\sim q}\\left[\\frac{p(a)}{q(a)}f(a)\\right].$$\n\n条件是 p 有概率的区域 q 也必须覆盖。若比值极大，方差会很高；截断可降低方差，但通常引入偏差。\n\n**追问：PPO 有 old policy，为什么仍常称 on-policy？** 数据由最近策略采样，有限次更新后重新采样；“严格当前同一参数”与算法家族分类不是同一粒度。\n\n**易错：** token 比率的裁剪不能被描述成完整轨迹分布精确修正。依据：S11、S12。","html":"<h3>旧食堂的调查，能代表新食堂吗？<\/h3>\n<p>原来的样本里，套餐 A、B 各占 50%；现在想估计 A 占 80%、B 占 20% 时的平均满意度。可以把旧调查中 A 的权重乘 0.8/0.5=1.6，B 乘 0.2/0.5=0.4，再求平均。这就是<strong>重要性采样<\/strong>的直觉：用权重修正样本比例差异。<\/p>\n<p>但旧调查如果从未问过 B，就不能凭空知道 B 的满意度；极少见样本被放得特别大，估计也可能很不稳定。<\/p>\n<p>在强化学习里，“策略”就是模型选择动作或 token 的规则。用当前策略采集数据叫 on-policy；使用其他或旧策略的数据叫 off-policy。概率比可以帮助修正变化，但有条件和代价。<\/p>\n<p><strong>直答：<\/strong> on-policy/off-policy 区分数据由哪套策略产生；重要性采样用“目标概率÷采样概率”给旧数据加权，估计新分布下的结果，前提是旧数据覆盖目标需要的情况。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 数据来自当前目标策略叫 on-policy；来自其他或较旧策略叫 off-policy。重要性采样用概率比修正分布差异。<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi mathvariant=\"normal\">𝔼<\/mi><mrow><mi>a<\/mi><mi>~<\/mi><mi>p<\/mi><\/mrow><\/msub><mo stretchy=\"false\">[<\/mo><mi>f<\/mi><mo stretchy=\"false\">(<\/mo><mi>a<\/mi><mo stretchy=\"false\">)<\/mo><mo stretchy=\"false\">]<\/mo><mo>=<\/mo><msub><mi mathvariant=\"normal\">𝔼<\/mi><mrow><mi>a<\/mi><mi>~<\/mi><mi>q<\/mi><\/mrow><\/msub><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">[<\/mo><mfrac><mrow><mi>p<\/mi><mo stretchy=\"false\">(<\/mo><mi>a<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><mrow><mi>q<\/mi><mo stretchy=\"false\">(<\/mo><mi>a<\/mi><mo stretchy=\"false\">)<\/mo><\/mrow><\/mfrac><mi>f<\/mi><mo stretchy=\"false\">(<\/mo><mi>a<\/mi><mo stretchy=\"false\">)<\/mo><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">]<\/mo><\/mrow><mo>.<\/mo><\/mrow><\/math><\/div>\n<p>条件是 p 有概率的区域 q 也必须覆盖。若比值极大，方差会很高；截断可降低方差，但通常引入偏差。<\/p>\n<p><strong>追问：PPO 有 old policy，为什么仍常称 on-policy？<\/strong> 数据由最近策略采样，有限次更新后重新采样；“严格当前同一参数”与算法家族分类不是同一粒度。<\/p>\n<p><strong>易错：<\/strong> token 比率的裁剪不能被描述成完整轨迹分布精确修正。依据：<a class=\"ref\" href=\"#source-S11\">S11<\/a>、<a class=\"ref\" href=\"#source-S12\">S12<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-M12" type="application/json">{"body":"### 一把总是偏重的秤，测一百次也未必准确\n\n一把秤每次都把 60 千克测成 65 千克，结果很稳定，但有**偏差**：系统性偏离真值。另一把秤测成 59、60、61，波动较大，这部分叫**方差**。\n\n模型评测也一样：只挑简单题，会系统性高估能力；换一批随机题，成绩上下波动，则体现抽样不确定性。\n\n**置信区间**是在规定的抽样方法和假设下，给这种不确定性画一个范围。它不能拯救一份严重偏向简单题的试卷。95% 的严格含义是：如果反复按同一程序抽样并算区间，约 95% 的这些区间覆盖真值。\n\n**直答：** 偏差是方向性错误，方差是重复抽样的波动，置信区间描述统计估计的抽样不确定性。成绩稳定和成绩可信，需要分别检查。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 偏差指系统性偏离目标；方差指不同采样下的波动；置信区间反映既定统计程序的抽样不确定性。\n\n**展开：** 数据泄漏可造成严重偏差，即使重复实验的方差很小。95% 频率学置信区间的覆盖保证针对重复抽样过程，不是“固定参数有 95% 概率位于本次区间”。\n\n**追问：bootstrap 能修复测试集偏差吗？** 不能。它从已有样本重采样，不能自动代表线上未覆盖的场景；相关数据要按会话、用户等独立单元成组重采样。\n\n**落地：** 模型对比优先对同一测试样本的差值做 paired bootstrap，并说明样本单位。详见 E05。\n\n## 章节自测\n\n能从链式法则写到 NLL；能手算交叉熵梯度；能解释 KL 方向；能判断 PPL 对比是否公平；能指出“低方差但高偏差”的评测例子。代码练习见 03_代码实验。","html":"<h3>一把总是偏重的秤，测一百次也未必准确<\/h3>\n<p>一把秤每次都把 60 千克测成 65 千克，结果很稳定，但有<strong>偏差<\/strong>：系统性偏离真值。另一把秤测成 59、60、61，波动较大，这部分叫<strong>方差<\/strong>。<\/p>\n<p>模型评测也一样：只挑简单题，会系统性高估能力；换一批随机题，成绩上下波动，则体现抽样不确定性。<\/p>\n<p><strong>置信区间<\/strong>是在规定的抽样方法和假设下，给这种不确定性画一个范围。它不能拯救一份严重偏向简单题的试卷。95% 的严格含义是：如果反复按同一程序抽样并算区间，约 95% 的这些区间覆盖真值。<\/p>\n<p><strong>直答：<\/strong> 偏差是方向性错误，方差是重复抽样的波动，置信区间描述统计估计的抽样不确定性。成绩稳定和成绩可信，需要分别检查。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 偏差指系统性偏离目标；方差指不同采样下的波动；置信区间反映既定统计程序的抽样不确定性。<\/p>\n<p><strong>展开：<\/strong> 数据泄漏可造成严重偏差，即使重复实验的方差很小。95% 频率学置信区间的覆盖保证针对重复抽样过程，不是“固定参数有 95% 概率位于本次区间”。<\/p>\n<p><strong>追问：bootstrap 能修复测试集偏差吗？<\/strong> 不能。它从已有样本重采样，不能自动代表线上未覆盖的场景；相关数据要按会话、用户等独立单元成组重采样。<\/p>\n<p><strong>落地：<\/strong> 模型对比优先对同一测试样本的差值做 paired bootstrap，并说明样本单位。详见 <a class=\"ref\" href=\"#q-E05\">E05<\/a>。<\/p>\n<h2>章节自测<\/h2>\n<p>能从链式法则写到 NLL；能手算交叉熵梯度；能解释 KL 方向；能判断 PPL 对比是否公平；能指出“低方差但高偏差”的评测例子。代码练习见 03_代码实验。<\/p><\/div><\/details>"}</script>
<script id="data-q-T01" type="application/json">{"body":"### 把一句话看作正在互相查资料的词\n\n读“杯子放在桌上，因为它很稳”时，“它”需要联系前面的词才有意义。自注意力让每个位置根据当前需要，从其他位置取信息。\n\n可以把 Q 想成“我想找什么”，K 是“我提供什么线索”，V 是“我实际携带的信息”。Q 和各个 K 越匹配，对应 V 被取用的比例越大；最后把取来的信息加权汇总。\n\nQ、K、V 不是人写好的标签，而是模型把原有表示经过三组可学习变换算出来的。同一个词可以同时作为提问者和信息提供者。\n\n**直答：** 自注意力让一个位置按相关程度汇总其他位置的信息。Q 用来查询，K 用来匹配，V 提供被汇总的内容，这三者都由模型学习得到。\n\n### 进一步：公式、边界与追问\n\n**本章进阶约定与范围：**\n\n依赖：M01–M06。重点是维度、复杂度、信息流与推理代价，避免只背组件名称。\n\n**技术表述：** Q 表示当前位置要寻找什么信息，K 表示每个位置可被如何匹配，V 是匹配后实际汇聚的内容。\n\n$$Q=XW_Q,\\ K=XW_K,\\ V=XW_V$$\n\n$$O=\\mathrm{softmax}(QK^\\top/\\sqrt{d_k}+M)V.$$\n\n**展开：** 单头 X∈R^{B×L×d}，Q/K∈R^{B×L×d_k}，注意力矩阵为 B×L×L。softmax 沿被关注的 key 位置归一化。Q/K/V 是同一输入的不同可学习投影，不是三份独立文本。\n\n**追问：为什么 Q 和 K 不共用一套权重？** 不同投影可表达非对称关系，共享属于额外结构约束，不是数学上不允许。\n\n**易错：** 注意力权重不是完整因果解释；残差、MLP 与层间计算同样影响输出。依据：S01。","html":"<h3>把一句话看作正在互相查资料的词<\/h3>\n<p>读“杯子放在桌上，因为它很稳”时，“它”需要联系前面的词才有意义。自注意力让每个位置根据当前需要，从其他位置取信息。<\/p>\n<p>可以把 Q 想成“我想找什么”，K 是“我提供什么线索”，V 是“我实际携带的信息”。Q 和各个 K 越匹配，对应 V 被取用的比例越大；最后把取来的信息加权汇总。<\/p>\n<p>Q、K、V 不是人写好的标签，而是模型把原有表示经过三组可学习变换算出来的。同一个词可以同时作为提问者和信息提供者。<\/p>\n<p><strong>直答：<\/strong> 自注意力让一个位置按相关程度汇总其他位置的信息。Q 用来查询，K 用来匹配，V 提供被汇总的内容，这三者都由模型学习得到。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>本章进阶约定与范围：<\/strong><\/p>\n<p>依赖：<a class=\"ref\" href=\"#q-M01\">M01<\/a>–<a class=\"ref\" href=\"#q-M06\">M06<\/a>。重点是维度、复杂度、信息流与推理代价，避免只背组件名称。<\/p>\n<p><strong>技术表述：<\/strong> Q 表示当前位置要寻找什么信息，K 表示每个位置可被如何匹配，V 是匹配后实际汇聚的内容。<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>Q<\/mi><mo>=<\/mo><mi>X<\/mi><msub><mi>W<\/mi><mi>Q<\/mi><\/msub><mo>,<\/mo><mtext> <\/mtext><mi>K<\/mi><mo>=<\/mo><mi>X<\/mi><msub><mi>W<\/mi><mi>K<\/mi><\/msub><mo>,<\/mo><mtext> <\/mtext><mi>V<\/mi><mo>=<\/mo><mi>X<\/mi><msub><mi>W<\/mi><mi>V<\/mi><\/msub><\/mrow><\/math><\/div>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>O<\/mi><mo>=<\/mo><mrow><mi mathvariant=\"normal\">s<\/mi><mi mathvariant=\"normal\">o<\/mi><mi mathvariant=\"normal\">f<\/mi><mi mathvariant=\"normal\">t<\/mi><mi mathvariant=\"normal\">m<\/mi><mi mathvariant=\"normal\">a<\/mi><mi mathvariant=\"normal\">x<\/mi><\/mrow><mo stretchy=\"false\">(<\/mo><mi>Q<\/mi><msup><mi>K<\/mi><mo>⊤<\/mo><\/msup><mo>/<\/mo><msqrt><mrow><msub><mi>d<\/mi><mi>k<\/mi><\/msub><\/mrow><\/msqrt><mo>+<\/mo><mi>M<\/mi><mo stretchy=\"false\">)<\/mo><mi>V<\/mi><mo>.<\/mo><\/mrow><\/math><\/div>\n<p><strong>展开：<\/strong> 单头 X∈R^{B×L×d}，Q/K∈R^{B×L×d_k}，注意力矩阵为 B×L×L。softmax 沿被关注的 key 位置归一化。Q/K/V 是同一输入的不同可学习投影，不是三份独立文本。<\/p>\n<p><strong>追问：为什么 Q 和 K 不共用一套权重？<\/strong> 不同投影可表达非对称关系，共享属于额外结构约束，不是数学上不允许。<\/p>\n<p><strong>易错：<\/strong> 注意力权重不是完整因果解释；残差、MLP 与层间计算同样影响输出。依据：<a class=\"ref\" href=\"#source-S01\">S01<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-T02" type="application/json">{"body":"### 比分为什么需要统一尺度？\n\n注意力用 Q 和 K 的对应数字相乘再相加，得到匹配分数。向量维度越多，参与相加的项越多，在常见初始化假设下分数波动也会变大。\n\n把波动很大的分数直接交给 softmax，可能很快变成“一个候选接近 100%，其他接近 0”，训练不容易细调。除以维度的平方根，是把这种规模带来的波动拉回合适范围。\n\n**直答：** 除以 √d_k 主要是控制匹配分数的尺度，避免维度变大时 softmax 过早变得极端。它是在常见方差假设下的缩放，不是让每个向量长度都等于 1。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 在各维近似独立、零均值、单位方差的分析假设下，点积方差随 d_k 增长；缩放能减轻 softmax 饱和。\n\n**展开：** Var(∑q_i k_i)≈d_k，除以 √d_k 后方差约为 1。实际训练后的向量不严格满足假设，因此这是初始化和优化尺度的解释。\n\n**追问：不缩放会怎样？** 大幅 logits 差异可能使分布过尖、梯度变小，训练更难；不能说一定训练失败。\n\n**易错：** 分母是每个 head 的 key 维度平方根，不必等于整个 hidden size 的平方根。依据：S01。","html":"<h3>比分为什么需要统一尺度？<\/h3>\n<p>注意力用 Q 和 K 的对应数字相乘再相加，得到匹配分数。向量维度越多，参与相加的项越多，在常见初始化假设下分数波动也会变大。<\/p>\n<p>把波动很大的分数直接交给 softmax，可能很快变成“一个候选接近 100%，其他接近 0”，训练不容易细调。除以维度的平方根，是把这种规模带来的波动拉回合适范围。<\/p>\n<p><strong>直答：<\/strong> 除以 √d_k 主要是控制匹配分数的尺度，避免维度变大时 softmax 过早变得极端。它是在常见方差假设下的缩放，不是让每个向量长度都等于 1。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 在各维近似独立、零均值、单位方差的分析假设下，点积方差随 d_k 增长；缩放能减轻 softmax 饱和。<\/p>\n<p><strong>展开：<\/strong> Var(∑q_i k_i)≈d_k，除以 √d_k 后方差约为 1。实际训练后的向量不严格满足假设，因此这是初始化和优化尺度的解释。<\/p>\n<p><strong>追问：不缩放会怎样？<\/strong> 大幅 logits 差异可能使分布过尖、梯度变小，训练更难；不能说一定训练失败。<\/p>\n<p><strong>易错：<\/strong> 分母是每个 head 的 key 维度平方根，不必等于整个 hidden size 的平方根。依据：<a class=\"ref\" href=\"#source-S01\">S01<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-T03" type="application/json">{"body":"### 同一句话，可以从几个角度看\n\n“小王把书递给小李”里，模型可能需要同时联系“谁在做动作”“给了什么”“给谁”。多头注意力就是并行使用几组不同的 Q、K、V 变换，让模型有机会建立不同的信息联系。\n\n这些头不一定自动分别负责语法、指代、情感；有的功能也会重叠。多头给了不同观察方式，具体学出什么由训练决定。\n\n**直答：** 多头注意力让模型在不同表示空间里并行提取信息，再合并结果；它增加了表达关系的方式，但不保证每个头都有固定的人类可命名职责。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 用多个投影子空间学习不同关联，再拼接并投影，让单个位置能够综合不同关系。\n\n**展开：** 常见设置 H 个头，每头维度 d/H，输出拼接仍为 d；并非头数增加就必然按 H 倍增加全部参数。头可能冗余，也不一定能逐一对应“语法头”“事实头”。\n\n**追问：头越多越好吗？** 固定 d 时每头更窄，可能损失表达；实际还受 kernel、KV cache 与硬件效率影响。\n\n**易错：** 多头不是对同一注意力结果简单做多次平均。依据：S01。","html":"<h3>同一句话，可以从几个角度看<\/h3>\n<p>“小王把书递给小李”里，模型可能需要同时联系“谁在做动作”“给了什么”“给谁”。多头注意力就是并行使用几组不同的 Q、K、V 变换，让模型有机会建立不同的信息联系。<\/p>\n<p>这些头不一定自动分别负责语法、指代、情感；有的功能也会重叠。多头给了不同观察方式，具体学出什么由训练决定。<\/p>\n<p><strong>直答：<\/strong> 多头注意力让模型在不同表示空间里并行提取信息，再合并结果；它增加了表达关系的方式，但不保证每个头都有固定的人类可命名职责。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 用多个投影子空间学习不同关联，再拼接并投影，让单个位置能够综合不同关系。<\/p>\n<p><strong>展开：<\/strong> 常见设置 H 个头，每头维度 d/H，输出拼接仍为 d；并非头数增加就必然按 H 倍增加全部参数。头可能冗余，也不一定能逐一对应“语法头”“事实头”。<\/p>\n<p><strong>追问：头越多越好吗？<\/strong> 固定 d 时每头更窄，可能损失表达；实际还受 kernel、KV cache 与硬件效率影响。<\/p>\n<p><strong>易错：<\/strong> 多头不是对同一注意力结果简单做多次平均。依据：<a class=\"ref\" href=\"#source-S01\">S01<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-T04" type="application/json">{"body":"### 几个提问者，要不要各存一整套资料？\n\n先把 Q 看作提问方式，K/V 看作查询线索和内容。MHA 让每个头有自己的 Q、K、V；MQA 保留多个 Q 头，但让它们共用一组 K/V；GQA 则分组共享，是两者之间的安排。\n\n生成长回答时，需要保存历史 K/V。如果 8 个头各存一份，存储多；让 8 个头分成两组、每组共用一套 K/V，就能少存一些。\n\n**直答：** MHA、MQA、GQA 的主要差别是 K/V 是否共享、共享到什么程度。共享通常能减少生成时的缓存，但质量和速度要结合具体模型与实现比较。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 区别在多个 query head 是否共享 K/V。MHA 各自有 K/V；MQA 全部共享一组；GQA 分组共享。\n\n| 结构 | KV 头数 H_kv | 主要取舍 |\n|---|---:|---|\n| MHA | H_q | 表达灵活，KV 读写与缓存较多 |\n| GQA | 介于 1 与 H_q 之间 | 在质量和访存间折中 |\n| MQA | 1 | KV 最省，共享约束最强 |\n\n**追问：GQA 缓存缩小多少？** 在层数、序列长度、head dim 和精度相同时，约按 H_kv/H_q 缩小；总显存还包括权重等。\n\n**易错：** query 头数没有一起变成 1。依据：S03。","html":"<h3>几个提问者，要不要各存一整套资料？<\/h3>\n<p>先把 Q 看作提问方式，K/V 看作查询线索和内容。MHA 让每个头有自己的 Q、K、V；MQA 保留多个 Q 头，但让它们共用一组 K/V；GQA 则分组共享，是两者之间的安排。<\/p>\n<p>生成长回答时，需要保存历史 K/V。如果 8 个头各存一份，存储多；让 8 个头分成两组、每组共用一套 K/V，就能少存一些。<\/p>\n<p><strong>直答：<\/strong> MHA、MQA、GQA 的主要差别是 K/V 是否共享、共享到什么程度。共享通常能减少生成时的缓存，但质量和速度要结合具体模型与实现比较。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 区别在多个 query head 是否共享 K/V。MHA 各自有 K/V；MQA 全部共享一组；GQA 分组共享。<\/p>\n<table>\n<thead>\n<tr>\n<th>结构<\/th>\n<th style=\"text-align: right;\">KV 头数 H_kv<\/th>\n<th>主要取舍<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>MHA<\/td>\n<td style=\"text-align: right;\">H_q<\/td>\n<td>表达灵活，KV 读写与缓存较多<\/td>\n<\/tr>\n<tr>\n<td>GQA<\/td>\n<td style=\"text-align: right;\">介于 1 与 H_q 之间<\/td>\n<td>在质量和访存间折中<\/td>\n<\/tr>\n<tr>\n<td>MQA<\/td>\n<td style=\"text-align: right;\">1<\/td>\n<td>KV 最省，共享约束最强<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>追问：GQA 缓存缩小多少？<\/strong> 在层数、序列长度、head dim 和精度相同时，约按 H_kv/H_q 缩小；总显存还包括权重等。<\/p>\n<p><strong>易错：<\/strong> query 头数没有一起变成 1。依据：<a class=\"ref\" href=\"#source-S03\">S03<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-T05" type="application/json">{"body":"### 三种“遮住”，遮的不是同一件事\n\n想象学生做填空题：遮住后面的标准答案，是防止偷看未来，这对应 **causal mask（因果遮罩）**；忽略为了排齐长度而塞进去的空格，是 **padding mask（填充遮罩）**。\n\n老师还可能让学生阅读题目，只对回答部分打分。这对应 **loss mask（损失遮罩）**：某些位置参与理解，但不计入训练扣分。\n\n因此“能不能看见”和“要不要打分”必须分开。题目不计分，不代表模型不能读题。\n\n**直答：** 因果遮罩限制看未来，填充遮罩排除无效填充，损失遮罩决定哪些位置参与训练评分；三者不能互相替代。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 因果 mask 阻止看未来；padding mask 阻止把补齐位置当信息；loss mask 控制哪些目标位置贡献训练损失。\n\n**展开：** SFT 可让回答 token 看到完整用户输入，同时只对 assistant token 算 loss；这不意味着提示词在前向传播中被删除。packing 多个独立样本时，还要决定是否阻断跨样本注意力。\n\n**追问：只屏蔽 prompt loss 就没有 prompt 的梯度了吗？** 提示词表示参与后续回答计算，因此仍可通过回答损失影响共享参数。\n\n**易错：** 不能用 loss mask 代替 attention mask。检查目标 shift 是否只移动一次。","html":"<h3>三种“遮住”，遮的不是同一件事<\/h3>\n<p>想象学生做填空题：遮住后面的标准答案，是防止偷看未来，这对应 <strong>causal mask（因果遮罩）<\/strong>；忽略为了排齐长度而塞进去的空格，是 <strong>padding mask（填充遮罩）<\/strong>。<\/p>\n<p>老师还可能让学生阅读题目，只对回答部分打分。这对应 <strong>loss mask（损失遮罩）<\/strong>：某些位置参与理解，但不计入训练扣分。<\/p>\n<p>因此“能不能看见”和“要不要打分”必须分开。题目不计分，不代表模型不能读题。<\/p>\n<p><strong>直答：<\/strong> 因果遮罩限制看未来，填充遮罩排除无效填充，损失遮罩决定哪些位置参与训练评分；三者不能互相替代。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 因果 mask 阻止看未来；padding mask 阻止把补齐位置当信息；loss mask 控制哪些目标位置贡献训练损失。<\/p>\n<p><strong>展开：<\/strong> SFT 可让回答 token 看到完整用户输入，同时只对 assistant token 算 loss；这不意味着提示词在前向传播中被删除。packing 多个独立样本时，还要决定是否阻断跨样本注意力。<\/p>\n<p><strong>追问：只屏蔽 prompt loss 就没有 prompt 的梯度了吗？<\/strong> 提示词表示参与后续回答计算，因此仍可通过回答损失影响共享参数。<\/p>\n<p><strong>易错：<\/strong> 不能用 loss mask 代替 attention mask。检查目标 shift 是否只移动一次。<\/p><\/div><\/details>"}</script>
<script id="data-q-T06" type="application/json">{"body":"### 模型怎样知道两个词隔了多远？\n\n如果只看到一堆词，却不知道顺序，“狗咬人”和“人咬狗”就很难区分。RoPE 给位置信息的一种做法，是根据位置旋转 Q、K 向量中的成对坐标。\n\n可以先想两个表盘指针：一个转了角度 a，另一个转了 b，比较它们时会涉及两者的角度差。RoPE 的旋转设计使匹配计算能包含类似的“位置差”信息。\n\n这个比喻只解释相对位置从哪里来；实际是高维向量中许多二维旋转，并非给词画一个真实表盘。\n\n**直答：** RoPE 根据位置旋转 Q、K，让它们的匹配计算包含相对位置差。它给注意力加入顺序线索，但不自动保证任意长文本都能处理好。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 对 Q/K 的二维分量按位置旋转，两者点积中出现的是旋转角之差，因此可表达相对位置。\n\n$$\\langle R_mq,R_nk\\rangle=q^\\top R_m^\\top R_n k=q^\\top R_{n-m}k.$$\n\n**展开：** 不同维度采用不同频率；绝对位置决定旋转，但注意力点积包含相对位移。通常作用在 Q/K，不要未经检查就说 V 也旋转。\n\n**追问：天然支持无限长吗？** 公式可以算更长位置，但频率、位置分布和训练长度之外的泛化未获保证。位置插值、频率调整与长上下文训练需要评测。\n\n**易错：** “有相对位置”不等于平移后所有网络行为完全相同。依据：S02。","html":"<h3>模型怎样知道两个词隔了多远？<\/h3>\n<p>如果只看到一堆词，却不知道顺序，“狗咬人”和“人咬狗”就很难区分。RoPE 给位置信息的一种做法，是根据位置旋转 Q、K 向量中的成对坐标。<\/p>\n<p>可以先想两个表盘指针：一个转了角度 a，另一个转了 b，比较它们时会涉及两者的角度差。RoPE 的旋转设计使匹配计算能包含类似的“位置差”信息。<\/p>\n<p>这个比喻只解释相对位置从哪里来；实际是高维向量中许多二维旋转，并非给词画一个真实表盘。<\/p>\n<p><strong>直答：<\/strong> RoPE 根据位置旋转 Q、K，让它们的匹配计算包含相对位置差。它给注意力加入顺序线索，但不自动保证任意长文本都能处理好。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 对 Q/K 的二维分量按位置旋转，两者点积中出现的是旋转角之差，因此可表达相对位置。<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>⟨<\/mi><msub><mi>R<\/mi><mi>m<\/mi><\/msub><mi>q<\/mi><mo>,<\/mo><msub><mi>R<\/mi><mi>n<\/mi><\/msub><mi>k<\/mi><mi>⟩<\/mi><mo>=<\/mo><msup><mi>q<\/mi><mo>⊤<\/mo><\/msup><msubsup><mi>R<\/mi><mi>m<\/mi><mo>⊤<\/mo><\/msubsup><msub><mi>R<\/mi><mi>n<\/mi><\/msub><mi>k<\/mi><mo>=<\/mo><msup><mi>q<\/mi><mo>⊤<\/mo><\/msup><msub><mi>R<\/mi><mrow><mi>n<\/mi><mo>−<\/mo><mi>m<\/mi><\/mrow><\/msub><mi>k<\/mi><mo>.<\/mo><\/mrow><\/math><\/div>\n<p><strong>展开：<\/strong> 不同维度采用不同频率；绝对位置决定旋转，但注意力点积包含相对位移。通常作用在 Q/K，不要未经检查就说 V 也旋转。<\/p>\n<p><strong>追问：天然支持无限长吗？<\/strong> 公式可以算更长位置，但频率、位置分布和训练长度之外的泛化未获保证。位置插值、频率调整与长上下文训练需要评测。<\/p>\n<p><strong>易错：<\/strong> “有相对位置”不等于平移后所有网络行为完全相同。依据：<a class=\"ref\" href=\"#source-S02\">S02<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-T07" type="application/json">{"body":"### 一路计算下去，数字的尺度容易失控\n\n模型有很多层，每层都会变换一组数字。如果数值尺度忽大忽小，后面就更难稳定学习。归一化的作用是调整这些表示的尺度。\n\nLayerNorm 会考虑均值和方差；RMSNorm 主要按均方根缩放，不先减均值。Pre-Norm 的“Pre”说的是放置位置：先归一化，再交给该层的注意力或前馈变换。\n\n**直答：** 归一化帮助控制各层表示的尺度；LayerNorm 与 RMSNorm 的计算方式不同，Pre-Norm 则指归一化放在主要变换之前。名字分别在描述“怎么算”和“放哪里”。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** LayerNorm 在特征维做中心化与尺度归一；RMSNorm 主要按均方根缩放。Pre-Norm 在子层之前归一，常有较直接的残差梯度路径。\n\n**展开：** LN 的典型形式是 (x−μ)/√(σ²+ε) 再仿射；RMSNorm 用 x/√mean(x²)，不减均值。具体是否有 bias 要看模型实现。\n\n**追问：和 BatchNorm 区别？** LN 不依赖批间统计，更适合变长文本、较小 batch 及自回归推理。\n\n**易错：** “RMSNorm 完全没有可学习参数”通常不对，常有逐维缩放。依据：S56。","html":"<h3>一路计算下去，数字的尺度容易失控<\/h3>\n<p>模型有很多层，每层都会变换一组数字。如果数值尺度忽大忽小，后面就更难稳定学习。归一化的作用是调整这些表示的尺度。<\/p>\n<p>LayerNorm 会考虑均值和方差；RMSNorm 主要按均方根缩放，不先减均值。Pre-Norm 的“Pre”说的是放置位置：先归一化，再交给该层的注意力或前馈变换。<\/p>\n<p><strong>直答：<\/strong> 归一化帮助控制各层表示的尺度；LayerNorm 与 RMSNorm 的计算方式不同，Pre-Norm 则指归一化放在主要变换之前。名字分别在描述“怎么算”和“放哪里”。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> LayerNorm 在特征维做中心化与尺度归一；RMSNorm 主要按均方根缩放。Pre-Norm 在子层之前归一，常有较直接的残差梯度路径。<\/p>\n<p><strong>展开：<\/strong> LN 的典型形式是 (x−μ)/√(σ²+ε) 再仿射；RMSNorm 用 x/√mean(x²)，不减均值。具体是否有 bias 要看模型实现。<\/p>\n<p><strong>追问：和 BatchNorm 区别？<\/strong> LN 不依赖批间统计，更适合变长文本、较小 batch 及自回归推理。<\/p>\n<p><strong>易错：<\/strong> “RMSNorm 完全没有可学习参数”通常不对，常有逐维缩放。依据：<a class=\"ref\" href=\"#source-S56\">S56<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-T08" type="application/json">{"body":"### 先交换信息，再各自加工\n\n注意力主要让不同位置交换信息；FFN（前馈网络）则对每个位置得到的表示做进一步加工。它通常先扩展维度，再压回去，中间加入非线性变换。\n\nSwiGLU 在加工过程中加了可学习的门控：一条分支产生内容，另一条分支调节内容通过多少。残差连接则把加工前的输入直接加回来，让信息有一条较直接的传递路径。\n\n**直答：** 注意力负责跨位置交流，FFN 对各位置的信息进一步变换，SwiGLU 用门控调节信息，残差把输入直接接回输出，帮助深层网络训练。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 注意力负责位置间信息混合，FFN 对每个位置做非线性特征变换；残差提供信息和梯度的直接通路。\n\n**展开：** gated FFN 可写为 (SiLU(xW_g)⊙xW_u)W_d。相较两矩阵 FFN，多了门控投影，因此常调整中间宽度来控制参数量。注意力、FFN 并不是严格可分的“记忆模块”和“推理模块”。\n\n**追问：FFN 参数可能比 attention 多吗？** 可以，取决于中间维度和注意力结构。解释参数量要列矩阵形状，不能只凭层名。\n\n**易错：** 残差不是让网络“自动忽略所有差层”，而是改变函数参数化与优化路径。依据：S57。","html":"<h3>先交换信息，再各自加工<\/h3>\n<p>注意力主要让不同位置交换信息；FFN（前馈网络）则对每个位置得到的表示做进一步加工。它通常先扩展维度，再压回去，中间加入非线性变换。<\/p>\n<p>SwiGLU 在加工过程中加了可学习的门控：一条分支产生内容，另一条分支调节内容通过多少。残差连接则把加工前的输入直接加回来，让信息有一条较直接的传递路径。<\/p>\n<p><strong>直答：<\/strong> 注意力负责跨位置交流，FFN 对各位置的信息进一步变换，SwiGLU 用门控调节信息，残差把输入直接接回输出，帮助深层网络训练。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 注意力负责位置间信息混合，FFN 对每个位置做非线性特征变换；残差提供信息和梯度的直接通路。<\/p>\n<p><strong>展开：<\/strong> gated FFN 可写为 (SiLU(xW_g)⊙xW_u)W_d。相较两矩阵 FFN，多了门控投影，因此常调整中间宽度来控制参数量。注意力、FFN 并不是严格可分的“记忆模块”和“推理模块”。<\/p>\n<p><strong>追问：FFN 参数可能比 attention 多吗？<\/strong> 可以，取决于中间维度和注意力结构。解释参数量要列矩阵形状，不能只凭层名。<\/p>\n<p><strong>易错：<\/strong> 残差不是让网络“自动忽略所有差层”，而是改变函数参数化与优化路径。依据：<a class=\"ref\" href=\"#source-S57\">S57<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-T09" type="application/json">{"body":"### 是在切句子，还是在收集相邻片段？\n\n“我爱学习”按字符取 2-gram，得到“我爱、爱学、学习”。n-gram 的 n 就是连续取几块；用字符还是词作单位，需要先说明。这些片段可以重叠。\n\nBPE、WordPiece、Unigram 则主要用于学习一套分词词表，决定输入怎样切成 token。BPE 可以粗略理解为不断合并常见相邻片段；另两种方法采用不同的选择标准。\n\n**直答：** 分词方法决定文本如何变成模型读取的 token；n-gram 是连续 n 个单位组成的片段，可用于统计或特征。两者有关联，但不是同一个概念。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 前三者是子词分词方案；字符 n-gram 是连续 n 个字符的片段特征，不天然构成唯一分词序列。\n\n**展开：** BPE 迭代合并常见相邻单位；WordPiece 的训练与词表选择目标不同，不宜直接说“就是 BPE”；Unigram 以候选子词和概率模型评估切分。byte-level 方法可覆盖任意字节，但 token 数不等于字数。\n\n**追问：内容安全为什么仍用字符 n-gram？** 对拼写变体和局部字母组合可形成低成本强基线，但长距离语境和反讽能力弱。\n\n**易错：** 中文一个字未必恰好一个 token；换 tokenizer 后词表 ID、嵌入、模板和模型权重都需兼容。依据：S58。","html":"<h3>是在切句子，还是在收集相邻片段？<\/h3>\n<p>“我爱学习”按字符取 2-gram，得到“我爱、爱学、学习”。n-gram 的 n 就是连续取几块；用字符还是词作单位，需要先说明。这些片段可以重叠。<\/p>\n<p>BPE、WordPiece、Unigram 则主要用于学习一套分词词表，决定输入怎样切成 token。BPE 可以粗略理解为不断合并常见相邻片段；另两种方法采用不同的选择标准。<\/p>\n<p><strong>直答：<\/strong> 分词方法决定文本如何变成模型读取的 token；n-gram 是连续 n 个单位组成的片段，可用于统计或特征。两者有关联，但不是同一个概念。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 前三者是子词分词方案；字符 n-gram 是连续 n 个字符的片段特征，不天然构成唯一分词序列。<\/p>\n<p><strong>展开：<\/strong> BPE 迭代合并常见相邻单位；WordPiece 的训练与词表选择目标不同，不宜直接说“就是 BPE”；Unigram 以候选子词和概率模型评估切分。byte-level 方法可覆盖任意字节，但 token 数不等于字数。<\/p>\n<p><strong>追问：内容安全为什么仍用字符 n-gram？<\/strong> 对拼写变体和局部字母组合可形成低成本强基线，但长距离语境和反讽能力弱。<\/p>\n<p><strong>易错：<\/strong> 中文一个字未必恰好一个 token；换 tokenizer 后词表 ID、嵌入、模板和模型权重都需兼容。依据：<a class=\"ref\" href=\"#source-S58\">S58<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-T10" type="application/json">{"body":"### 看懂全文、接着写、读完再改写\n\nEncoder-only 像先把整段材料读完再判断，适合文本分类等理解任务；Decoder-only 像不断根据已有前文往后写，适合生成。\n\nEncoder-decoder 则分工：一部分先读输入，另一部分根据读到的内容生成输出，翻译就是容易理解的例子。这里是在讲结构倾向，实际任务可以有多种实现。\n\n**直答：** 三类结构主要区别在信息怎样流动：双向理解、按前缀生成，或者编码输入后再生成。选择时结合任务、已有模型和训练成本。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** Encoder-only 适合双向表征任务；Decoder-only 适合统一的自回归生成；Encoder-decoder 显式分离输入编码和输出生成。\n\n**展开：** BERT 类 mask 语言建模与 GPT 类 next-token prediction 监督方式不同。分类、检索未必需要生成式大模型；机器翻译和结构化转写也可使用 encoder-decoder。\n\n**追问：Decoder-only 能做 embedding 吗？** 可以经过池化、对比训练和检索评测适配，但不能认定最后 token 原始向量天然就是优秀检索表示。\n\n**易错：** “decoder”不意味着一定包含 encoder-decoder cross attention。依据：S01、S59。","html":"<h3>看懂全文、接着写、读完再改写<\/h3>\n<p>Encoder-only 像先把整段材料读完再判断，适合文本分类等理解任务；Decoder-only 像不断根据已有前文往后写，适合生成。<\/p>\n<p>Encoder-decoder 则分工：一部分先读输入，另一部分根据读到的内容生成输出，翻译就是容易理解的例子。这里是在讲结构倾向，实际任务可以有多种实现。<\/p>\n<p><strong>直答：<\/strong> 三类结构主要区别在信息怎样流动：双向理解、按前缀生成，或者编码输入后再生成。选择时结合任务、已有模型和训练成本。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> Encoder-only 适合双向表征任务；Decoder-only 适合统一的自回归生成；Encoder-decoder 显式分离输入编码和输出生成。<\/p>\n<p><strong>展开：<\/strong> BERT 类 mask 语言建模与 GPT 类 next-token prediction 监督方式不同。分类、检索未必需要生成式大模型；机器翻译和结构化转写也可使用 encoder-decoder。<\/p>\n<p><strong>追问：Decoder-only 能做 embedding 吗？<\/strong> 可以经过池化、对比训练和检索评测适配，但不能认定最后 token 原始向量天然就是优秀检索表示。<\/p>\n<p><strong>易错：<\/strong> “decoder”不意味着一定包含 encoder-decoder cross attention。依据：<a class=\"ref\" href=\"#source-S01\">S01<\/a>、<a class=\"ref\" href=\"#source-S59\">S59<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-T11" type="application/json">{"body":"### 医院有很多科室，一次就诊不必经过全部科室\n\nMoE 可以类比为许多可选择的处理单元，叫“专家”。每个 token 到来时，路由器只选其中一部分专家计算，而不是每个专家都算一遍。\n\n所以“总参数”是所有专家等参数加起来有多少；“激活参数”是一次处理实际用到的那部分。专家是网络模块，不能直接理解成真的懂某一专业的医生。\n\n**直答：** MoE 用路由选择部分专家参与每次计算，因此总参数可以很多，而单次激活参数较少。不过全部权重的存放、专家间通信仍然需要资源。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 总参数是所有专家等权重的总量；激活参数是单个 token 实际经过的专家及共享模块参数。\n\n**展开：** Router 选择少数专家可降低每 token 的部分计算，但所有专家通常仍需存储，分布式路由还带来 all-to-all 通信、负载不均与容量限制。\n\n**追问：总参数 100B、激活 10B，显存等于 10B 吗？** 通常不等于；权重驻留由部署分片、卸载和并行策略决定。不同 token 还可能激活不同专家。\n\n**易错：** MoE 不是多个独立聊天机器人投票。依据：S60。","html":"<h3>医院有很多科室，一次就诊不必经过全部科室<\/h3>\n<p>MoE 可以类比为许多可选择的处理单元，叫“专家”。每个 token 到来时，路由器只选其中一部分专家计算，而不是每个专家都算一遍。<\/p>\n<p>所以“总参数”是所有专家等参数加起来有多少；“激活参数”是一次处理实际用到的那部分。专家是网络模块，不能直接理解成真的懂某一专业的医生。<\/p>\n<p><strong>直答：<\/strong> MoE 用路由选择部分专家参与每次计算，因此总参数可以很多，而单次激活参数较少。不过全部权重的存放、专家间通信仍然需要资源。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 总参数是所有专家等权重的总量；激活参数是单个 token 实际经过的专家及共享模块参数。<\/p>\n<p><strong>展开：<\/strong> Router 选择少数专家可降低每 token 的部分计算，但所有专家通常仍需存储，分布式路由还带来 all-to-all 通信、负载不均与容量限制。<\/p>\n<p><strong>追问：总参数 100B、激活 10B，显存等于 10B 吗？<\/strong> 通常不等于；权重驻留由部署分片、卸载和并行策略决定。不同 token 还可能激活不同专家。<\/p>\n<p><strong>易错：<\/strong> MoE 不是多个独立聊天机器人投票。依据：<a class=\"ref\" href=\"#source-S60\">S60<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-T12" type="application/json">{"body":"### 一本书太长，可以从三个方向减轻负担\n\n一种做法是提高模型能读的长度；滑窗注意力则让某个位置主要看附近一段内容，减少全篇两两比较；一些线性注意力方法进一步改变计算形式，让成本随长度增长得更慢。\n\n这些办法解决问题的方式不同。只看附近会影响远距离联系，改变注意力计算也可能改变表达能力。能输入很长，也不等于每个细节都记得住。\n\n**直答：** 长上下文扩展可读范围，滑窗减少每个位置看见的范围，线性注意力改变计算方式来降低长度成本；它们都需要结合远距离任务检查效果。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 长上下文是能力目标；滑窗限制可关注范围；线性注意力或状态空间等结构改变计算和记忆形式。\n\n**展开：** 标准全注意力的 score 计算随长度平方增长；滑窗用局部连接降低代价，但跨远距离信息传播受结构影响。压缩状态可以降低随历史长度增长的存储，却可能损失精确检索细节。\n\n**追问：128K 上下文就能可靠记住 128K 内容吗？** 不一定。应测不同位置、干扰强度、多跳组合和规则更新，而非只测输入是否接受。\n\n**易错：** FlashAttention 优化 IO，不把一般精确稠密注意力的算术复杂度改成 O(L)。依据：S04、S33。","html":"<h3>一本书太长，可以从三个方向减轻负担<\/h3>\n<p>一种做法是提高模型能读的长度；滑窗注意力则让某个位置主要看附近一段内容，减少全篇两两比较；一些线性注意力方法进一步改变计算形式，让成本随长度增长得更慢。<\/p>\n<p>这些办法解决问题的方式不同。只看附近会影响远距离联系，改变注意力计算也可能改变表达能力。能输入很长，也不等于每个细节都记得住。<\/p>\n<p><strong>直答：<\/strong> 长上下文扩展可读范围，滑窗减少每个位置看见的范围，线性注意力改变计算方式来降低长度成本；它们都需要结合远距离任务检查效果。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 长上下文是能力目标；滑窗限制可关注范围；线性注意力或状态空间等结构改变计算和记忆形式。<\/p>\n<p><strong>展开：<\/strong> 标准全注意力的 score 计算随长度平方增长；滑窗用局部连接降低代价，但跨远距离信息传播受结构影响。压缩状态可以降低随历史长度增长的存储，却可能损失精确检索细节。<\/p>\n<p><strong>追问：128K 上下文就能可靠记住 128K 内容吗？<\/strong> 不一定。应测不同位置、干扰强度、多跳组合和规则更新，而非只测输入是否接受。<\/p>\n<p><strong>易错：<\/strong> FlashAttention 优化 IO，不把一般精确稠密注意力的算术复杂度改成 O(L)。依据：<a class=\"ref\" href=\"#source-S04\">S04<\/a>、<a class=\"ref\" href=\"#source-S33\">S33<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-T13" type="application/json">{"body":"### 先数“存了多少数字”，再数“做了多少计算”\n\n一个 100×200 的权重矩阵存了 2 万个参数。把各矩阵的元素数加起来，才能估计参数量。\n\n注意力里，每个位置要与许多其他位置比较。长度从 100 变成 200，全位置两两配对从 1 万变为 4 万，因此这部分随长度平方增长。其他线性变换则有不同的增长方式。\n\n**直答：** 参数量按权重矩阵尺寸数元素；计算量要按实际运算数估计。标准注意力的全位置交互有平方长度成本，但参数量、运算量和实际耗时是三个不同指标。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 参数量按矩阵尺寸相乘；attention 主要包含线性投影 O(Ld²) 和位置交互 O(L²d)。\n\n**展开：** 标准 MHA 的 Q/K/V/O 四个 d×d 投影约 4d² 参数。两层 FFN、宽度 d_ff 时约 2dd_ff；SwiGLU 常为 3dd_ff。词嵌入约 Vd，输入输出权重是否共享会改变总量。\n\n**追问：序列很短时谁更贵？** L²d 未必主导，投影与 FFN 可能占更大比例；实际时间还由并行度、访存和 kernel 决定。\n\n**练习：** d=4096、d_ff=11008 的三投影 FFN，忽略 bias 时约 1.353 亿参数。不要拿 FLOPs 直接当毫秒。","html":"<h3>先数“存了多少数字”，再数“做了多少计算”<\/h3>\n<p>一个 100×200 的权重矩阵存了 2 万个参数。把各矩阵的元素数加起来，才能估计参数量。<\/p>\n<p>注意力里，每个位置要与许多其他位置比较。长度从 100 变成 200，全位置两两配对从 1 万变为 4 万，因此这部分随长度平方增长。其他线性变换则有不同的增长方式。<\/p>\n<p><strong>直答：<\/strong> 参数量按权重矩阵尺寸数元素；计算量要按实际运算数估计。标准注意力的全位置交互有平方长度成本，但参数量、运算量和实际耗时是三个不同指标。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 参数量按矩阵尺寸相乘；attention 主要包含线性投影 O(Ld²) 和位置交互 O(L²d)。<\/p>\n<p><strong>展开：<\/strong> 标准 MHA 的 Q/K/V/O 四个 d×d 投影约 4d² 参数。两层 FFN、宽度 d_ff 时约 2dd_ff；SwiGLU 常为 3dd_ff。词嵌入约 Vd，输入输出权重是否共享会改变总量。<\/p>\n<p><strong>追问：序列很短时谁更贵？<\/strong> L²d 未必主导，投影与 FFN 可能占更大比例；实际时间还由并行度、访存和 kernel 决定。<\/p>\n<p><strong>练习：<\/strong> d=4096、d_ff=11008 的三投影 FFN，忽略 bias 时约 1.353 亿参数。不要拿 FLOPs 直接当毫秒。<\/p><\/div><\/details>"}</script>
<script id="data-q-T14" type="application/json">{"body":"### 同一道大题，可以边算边汇总\n\n普通实现可能先写出一张很大的注意力分数表，再读取它继续计算。FlashAttention 把任务切成块，边算边更新必要的汇总数字，减少大表的存储和来回搬运。\n\n它像用较小草稿区完成同一套精确计算，而不是为了省事删掉一些候选。浮点数的运算顺序变了，仍可能出现细小数值差异。\n\n**直答：** FlashAttention 通过分块计算和在线归一化，避免完整存下巨大中间表，减少显存读写；它保持稠密注意力的数学目标。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 它分块计算并维护在线 softmax 统计，减少大矩阵在显存与片上存储间搬运，避免完整存储注意力中间矩阵。\n\n**展开：** 归一化统计可跨块合并，因此不必先存整张 L×L score。数学目标是相同的稠密注意力；浮点求和顺序不同仍可能产生微小数值差异。FlashAttention-2 进一步改进线程块与 warp 的工作划分，减少非矩阵乘运算和共享存储通信（S37）。\n\n**追问：与 PagedAttention 的区别？** 前者主要优化注意力计算与 IO；后者主要改进服务中的 KV cache 分配和共享，二者可以配合。\n\n**易错：** 不能说 FlashAttention 丢弃低分 token 来近似；也不能把论文特定硬件加速倍数写成普遍承诺。依据：S04、S34。","html":"<h3>同一道大题，可以边算边汇总<\/h3>\n<p>普通实现可能先写出一张很大的注意力分数表，再读取它继续计算。FlashAttention 把任务切成块，边算边更新必要的汇总数字，减少大表的存储和来回搬运。<\/p>\n<p>它像用较小草稿区完成同一套精确计算，而不是为了省事删掉一些候选。浮点数的运算顺序变了，仍可能出现细小数值差异。<\/p>\n<p><strong>直答：<\/strong> FlashAttention 通过分块计算和在线归一化，避免完整存下巨大中间表，减少显存读写；它保持稠密注意力的数学目标。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 它分块计算并维护在线 softmax 统计，减少大矩阵在显存与片上存储间搬运，避免完整存储注意力中间矩阵。<\/p>\n<p><strong>展开：<\/strong> 归一化统计可跨块合并，因此不必先存整张 L×L score。数学目标是相同的稠密注意力；浮点求和顺序不同仍可能产生微小数值差异。FlashAttention-2 进一步改进线程块与 warp 的工作划分，减少非矩阵乘运算和共享存储通信（<a class=\"ref\" href=\"#source-S37\">S37<\/a>）。<\/p>\n<p><strong>追问：与 PagedAttention 的区别？<\/strong> 前者主要优化注意力计算与 IO；后者主要改进服务中的 KV cache 分配和共享，二者可以配合。<\/p>\n<p><strong>易错：<\/strong> 不能说 FlashAttention 丢弃低分 token 来近似；也不能把论文特定硬件加速倍数写成普遍承诺。依据：<a class=\"ref\" href=\"#source-S04\">S04<\/a>、<a class=\"ref\" href=\"#source-S34\">S34<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-T15" type="application/json">{"body":"### 历史资料能不能换一种更紧凑的表示？\n\n生成每个新 token 都要参考历史 K/V，历史越长，缓存越大。MLA 设计了一种较低维的潜在表示，用较少的数字承载历史信息，并配合投影与位置处理来完成后续注意力。\n\n它不是把已经训练好的任何模型都直接无损压缩，也不是仅减少几个 K/V 头。模型结构和训练本身需要适应这种表示。\n\n**直答：** MLA 通过专门设计的低维表示减少部分 K/V 缓存，缓存布局取决于具体模型；理解时要看实际保存了哪些张量。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** Multi-head Latent Attention 用较低维的潜在表示承载部分 K/V 信息，通过设计好的投影与计算吸收减少需要缓存的内容。\n\n**展开：** 它不是简单把 GQA 的 KV 头数再减小；位置编码部分、潜变量维度与重建/吸收方式共同决定缓存布局。具体模型中要按缓存张量计算，而非直接套标准 MHA 公式。\n\n**追问：低秩表示一定免费吗？** 可能引入投影、实现复杂度和训练适配，需看质量及实际 decode 性能。\n\n**易错：** DeepSeek 某个版本的缓存配置不是所有 MLA 系统的固定值。依据：S48。","html":"<h3>历史资料能不能换一种更紧凑的表示？<\/h3>\n<p>生成每个新 token 都要参考历史 K/V，历史越长，缓存越大。MLA 设计了一种较低维的潜在表示，用较少的数字承载历史信息，并配合投影与位置处理来完成后续注意力。<\/p>\n<p>它不是把已经训练好的任何模型都直接无损压缩，也不是仅减少几个 K/V 头。模型结构和训练本身需要适应这种表示。<\/p>\n<p><strong>直答：<\/strong> MLA 通过专门设计的低维表示减少部分 K/V 缓存，缓存布局取决于具体模型；理解时要看实际保存了哪些张量。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> Multi-head Latent Attention 用较低维的潜在表示承载部分 K/V 信息，通过设计好的投影与计算吸收减少需要缓存的内容。<\/p>\n<p><strong>展开：<\/strong> 它不是简单把 GQA 的 KV 头数再减小；位置编码部分、潜变量维度与重建/吸收方式共同决定缓存布局。具体模型中要按缓存张量计算，而非直接套标准 MHA 公式。<\/p>\n<p><strong>追问：低秩表示一定免费吗？<\/strong> 可能引入投影、实现复杂度和训练适配，需看质量及实际 decode 性能。<\/p>\n<p><strong>易错：<\/strong> DeepSeek 某个版本的缓存配置不是所有 MLA 系统的固定值。依据：<a class=\"ref\" href=\"#source-S48\">S48<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-T16" type="application/json">{"body":"### 大家都排同一个窗口，其他窗口再多也没用\n\nMoE 中如果路由器总选少数专家，那些专家会很忙，其他专家却闲着。计算既不均衡，也可能超过某个专家能处理的容量。\n\n均衡方法会调整路由、加入鼓励分散分配的约束，或改变专家选择的偏置。目标不是强制每个输入都平均分发，而是在任务质量与负载之间取舍。\n\n**直答：** MoE 要同时学会选合适专家和避免负载过度集中。除了总耗时，还要检查每个专家收到多少 token、是否溢出，以及设备间传输开销。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 通过路由设计、负载约束或偏置调整让 token 更均衡分配，并处理容量和通信。\n\n**展开：** 辅助均衡损失可能与主任务目标相互影响；不同模型会采用不同方案。统计每专家 token 数、溢出/丢弃、跨设备通信和尾部专家耗时。\n\n**追问：完全均衡就最好吗？** 过强均衡可能限制专业化；应在吞吐、质量和硬件约束间找合适取舍。\n\n**易错：** 只报激活参数量会漏掉路由与 all-to-all 的系统代价。依据：S48、S60。","html":"<h3>大家都排同一个窗口，其他窗口再多也没用<\/h3>\n<p>MoE 中如果路由器总选少数专家，那些专家会很忙，其他专家却闲着。计算既不均衡，也可能超过某个专家能处理的容量。<\/p>\n<p>均衡方法会调整路由、加入鼓励分散分配的约束，或改变专家选择的偏置。目标不是强制每个输入都平均分发，而是在任务质量与负载之间取舍。<\/p>\n<p><strong>直答：<\/strong> MoE 要同时学会选合适专家和避免负载过度集中。除了总耗时，还要检查每个专家收到多少 token、是否溢出，以及设备间传输开销。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 通过路由设计、负载约束或偏置调整让 token 更均衡分配，并处理容量和通信。<\/p>\n<p><strong>展开：<\/strong> 辅助均衡损失可能与主任务目标相互影响；不同模型会采用不同方案。统计每专家 token 数、溢出/丢弃、跨设备通信和尾部专家耗时。<\/p>\n<p><strong>追问：完全均衡就最好吗？<\/strong> 过强均衡可能限制专业化；应在吞吐、质量和硬件约束间找合适取舍。<\/p>\n<p><strong>易错：<\/strong> 只报激活参数量会漏掉路由与 all-to-all 的系统代价。依据：<a class=\"ref\" href=\"#source-S48\">S48<\/a>、<a class=\"ref\" href=\"#source-S60\">S60<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-D01" type="application/json">{"body":"### 学语言、学专业、学答题、学偏好\n\n可以把训练阶段理解成不同的学习材料：预训练广泛读文本，学习接下来通常怎样写；继续预训练加入某领域材料，进一步熟悉其语言和知识；SFT 看“问题—示范回答”，学会按要求回答；对齐再利用偏好或奖励，调整什么样的回答更值得生成。\n\n这些阶段会相互影响，并不是严格分成四个独立能力开关。\n\n**直答：** 先看每个阶段给模型什么材料、用什么反馈。广泛文本、领域文本、示范答案和偏好反馈，会把模型引向不同的学习方向。\n\n### 进一步：公式、边界与追问\n\n**本章进阶约定与范围：**\n\n定位：理解训练信号从哪里来，能解释数据效果与算法效果。预训练工程属于补强知识，不在简历中冒充已完成经历。\n\n**技术表述：** 预训练学习广泛分布；继续预训练适配新领域或语言；SFT 学习指令到回答的示范；偏好或奖励优化进一步改变行为选择。\n\n**展开：** 它们的分界主要在数据与目标，不是简单由“是否更新全部参数”区分。领域继续预训练常保留 next-token 目标；SFT 可全参也可 LoRA。流程可交替，不保证每个模型都经历相同阶段。\n\n**追问：业务知识过期，先继续预训练吗？** 先评估检索、数据库与工具是否更合适。频繁变化、需精确引用的知识通常更适合外部更新；领域语言与稳定技能再考虑训练。\n\n**易错：** SFT 不是只能改格式，也可能学知识和技能；但参数记忆不保证精确可控的知识更新。","html":"<h3>学语言、学专业、学答题、学偏好<\/h3>\n<p>可以把训练阶段理解成不同的学习材料：预训练广泛读文本，学习接下来通常怎样写；继续预训练加入某领域材料，进一步熟悉其语言和知识；SFT 看“问题—示范回答”，学会按要求回答；对齐再利用偏好或奖励，调整什么样的回答更值得生成。<\/p>\n<p>这些阶段会相互影响，并不是严格分成四个独立能力开关。<\/p>\n<p><strong>直答：<\/strong> 先看每个阶段给模型什么材料、用什么反馈。广泛文本、领域文本、示范答案和偏好反馈，会把模型引向不同的学习方向。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>本章进阶约定与范围：<\/strong><\/p>\n<p>定位：理解训练信号从哪里来，能解释数据效果与算法效果。预训练工程属于补强知识，不在简历中冒充已完成经历。<\/p>\n<p><strong>技术表述：<\/strong> 预训练学习广泛分布；继续预训练适配新领域或语言；SFT 学习指令到回答的示范；偏好或奖励优化进一步改变行为选择。<\/p>\n<p><strong>展开：<\/strong> 它们的分界主要在数据与目标，不是简单由“是否更新全部参数”区分。领域继续预训练常保留 next-token 目标；SFT 可全参也可 LoRA。流程可交替，不保证每个模型都经历相同阶段。<\/p>\n<p><strong>追问：业务知识过期，先继续预训练吗？<\/strong> 先评估检索、数据库与工具是否更合适。频繁变化、需精确引用的知识通常更适合外部更新；领域语言与稳定技能再考虑训练。<\/p>\n<p><strong>易错：<\/strong> SFT 不是只能改格式，也可能学知识和技能；但参数记忆不保证精确可控的知识更新。<\/p><\/div><\/details>"}</script>
<script id="data-q-D02" type="application/json">{"body":"### 大模型和多做题，预算应该怎样分？\n\n预算固定时，可以造一个更大的模型，也可以让较小模型读更多训练 token。只增加模型大小，却没有足够数据训练，就可能花了很多钱却没把容量用好。\n\nScaling law 研究这些规模与损失之间的经验关系；Chinchilla 研究了特定设置下模型规模和训练数据量的分配。经验关系能指导预算，不是跨任务都精确成立的配方。\n\n**直答：** 不只问模型要多大，还要问数据和计算是否匹配。规模规律给出经验指导，具体比例仍要结合训练方式与任务验证。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** Scaling law 用经验规律描述损失随参数、数据与计算预算变化；Chinchilla 强调在其研究条件下，模型规模和训练 token 应共同配置。\n\n**展开：** 不能把某个 token/parameter 比例当永恒最佳值。若模型要服务很多请求，更多训练小模型可能降低总生命周期推理成本，即使不满足单次训练的 compute-optimal 配比。\n\n**追问：6ND 是什么？** Dense Transformer 训练 FLOPs 的粗估，N 为参数数、D 为训练 token 数，系数依赖计算计数和假设；长注意力、稀疏专家等需修正。\n\n**易错：** 更低预训练 loss 不直接等于更高安全性或 Agent 成功率。依据：S05。","html":"<h3>大模型和多做题，预算应该怎样分？<\/h3>\n<p>预算固定时，可以造一个更大的模型，也可以让较小模型读更多训练 token。只增加模型大小，却没有足够数据训练，就可能花了很多钱却没把容量用好。<\/p>\n<p>Scaling law 研究这些规模与损失之间的经验关系；Chinchilla 研究了特定设置下模型规模和训练数据量的分配。经验关系能指导预算，不是跨任务都精确成立的配方。<\/p>\n<p><strong>直答：<\/strong> 不只问模型要多大，还要问数据和计算是否匹配。规模规律给出经验指导，具体比例仍要结合训练方式与任务验证。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> Scaling law 用经验规律描述损失随参数、数据与计算预算变化；Chinchilla 强调在其研究条件下，模型规模和训练 token 应共同配置。<\/p>\n<p><strong>展开：<\/strong> 不能把某个 token/parameter 比例当永恒最佳值。若模型要服务很多请求，更多训练小模型可能降低总生命周期推理成本，即使不满足单次训练的 compute-optimal 配比。<\/p>\n<p><strong>追问：6ND 是什么？<\/strong> Dense Transformer 训练 FLOPs 的粗估，N 为参数数、D 为训练 token 数，系数依赖计算计数和假设；长注意力、稀疏专家等需修正。<\/p>\n<p><strong>易错：<\/strong> 更低预训练 loss 不直接等于更高安全性或 Agent 成功率。依据：<a class=\"ref\" href=\"#source-S05\">S05<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-D03" type="application/json">{"body":"### “好教材”不能只用一个形容词判断\n\n一页语言通顺但答案错误的教材，对训练可能有害；一页内容正确但和目标任务无关，也未必有用。因此要把“高质量”拆成能检查的条件。\n\n例如抽查答案是否正确、是否重复、格式能否解析、难度是否合适、边界情况是否覆盖，再统计每项的比例。\n\n**直答：** 把数据质量拆成正确性、相关性、多样性、可用性等具体检查项，并用抽样审核和训练对照验证它们的价值。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 用明确的目标适配性、正确性、多样性、去重和可追踪标准定义，并用受控实验验证。\n\n**展开：** 数据卡至少记录来源、授权范围、时间、语言、主题、长度、质量规则、去重方法、版本。过滤器可能偏爱某种文风或语言，误删专业数据，因此要抽样审查“被保留”和“被删除”的样本。\n\n**追问：只要大模型打分高就好？** 评审器可能偏向冗长、自信或熟悉风格，应与人工样本对齐并观察下游指标。\n\n**实验：** 固定训练 token 预算，比较原始、规则过滤、模型评分过滤三组，报告任务收益与被删场景，不只报保留比例。","html":"<h3>“好教材”不能只用一个形容词判断<\/h3>\n<p>一页语言通顺但答案错误的教材，对训练可能有害；一页内容正确但和目标任务无关，也未必有用。因此要把“高质量”拆成能检查的条件。<\/p>\n<p>例如抽查答案是否正确、是否重复、格式能否解析、难度是否合适、边界情况是否覆盖，再统计每项的比例。<\/p>\n<p><strong>直答：<\/strong> 把数据质量拆成正确性、相关性、多样性、可用性等具体检查项，并用抽样审核和训练对照验证它们的价值。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 用明确的目标适配性、正确性、多样性、去重和可追踪标准定义，并用受控实验验证。<\/p>\n<p><strong>展开：<\/strong> 数据卡至少记录来源、授权范围、时间、语言、主题、长度、质量规则、去重方法、版本。过滤器可能偏爱某种文风或语言，误删专业数据，因此要抽样审查“被保留”和“被删除”的样本。<\/p>\n<p><strong>追问：只要大模型打分高就好？<\/strong> 评审器可能偏向冗长、自信或熟悉风格，应与人工样本对齐并观察下游指标。<\/p>\n<p><strong>实验：<\/strong> 固定训练 token 预算，比较原始、规则过滤、模型评分过滤三组，报告任务收益与被删场景，不只报保留比例。<\/p><\/div><\/details>"}</script>
<script id="data-q-D04" type="application/json">{"body":"### 一字不差、换个说法、提前见过考题\n\n两条样本完全相同，精确去重就能发现；“如何退票”和“怎样办理退票”可能语义相近，需要近似去重。测试题或答案进入训练材料，则是评测泄漏，要跨数据切分检查。\n\n后两者都不能仅靠文件是否完全相同来判断。题目换了措辞，核心答案也可能已经泄漏。\n\n**直答：** 精确去重找相同内容，近似去重找高度相似内容，泄漏检查则关注训练材料是否提前暴露测试信息，检查范围不同。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 精确去重找规范化后相同样本；近似去重找高度相似片段或模板；泄漏检查判断测试信息是否进入训练或选择过程。\n\n**展开：** 可用哈希处理完全重复，用 n-gram shingles、MinHash/LSH 做候选召回后核验近似重复；语义相近不一定等于应删。要防页面不同却包含相同问答、翻译版本和同攻击模板。\n\n**追问：训练测试随机切分够吗？** 不够。按用户、会话、文档、模板或时间分组，单位由实际泛化目标决定；先识别重复族再分组切分。\n\n**易错：** 高训练测试相似度是线索，不是泄漏的充分证明；阈值需人工审查。","html":"<h3>一字不差、换个说法、提前见过考题<\/h3>\n<p>两条样本完全相同，精确去重就能发现；“如何退票”和“怎样办理退票”可能语义相近，需要近似去重。测试题或答案进入训练材料，则是评测泄漏，要跨数据切分检查。<\/p>\n<p>后两者都不能仅靠文件是否完全相同来判断。题目换了措辞，核心答案也可能已经泄漏。<\/p>\n<p><strong>直答：<\/strong> 精确去重找相同内容，近似去重找高度相似内容，泄漏检查则关注训练材料是否提前暴露测试信息，检查范围不同。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 精确去重找规范化后相同样本；近似去重找高度相似片段或模板；泄漏检查判断测试信息是否进入训练或选择过程。<\/p>\n<p><strong>展开：<\/strong> 可用哈希处理完全重复，用 n-gram shingles、MinHash/LSH 做候选召回后核验近似重复；语义相近不一定等于应删。要防页面不同却包含相同问答、翻译版本和同攻击模板。<\/p>\n<p><strong>追问：训练测试随机切分够吗？<\/strong> 不够。按用户、会话、文档、模板或时间分组，单位由实际泛化目标决定；先识别重复族再分组切分。<\/p>\n<p><strong>易错：<\/strong> 高训练测试相似度是线索，不是泄漏的充分证明；阈值需人工审查。<\/p><\/div><\/details>"}</script>
<script id="data-q-D05" type="application/json">{"body":"### 每天练什么，会改变学生擅长什么\n\n一个训练批次里若 90% 都是数学题，模型得到的大部分更新也来自数学。调整数据配比，就是调整不同能力被练习的频率。\n\n但多练某类可能挤掉其他类的训练时间。应在总 token 预算相同时比较，而不是一边改变比例、一边多训练一倍。\n\n**直答：** 数据配比决定模型把训练机会花在哪些任务上；用目标能力、遗忘情况和固定预算下的对照来选择比例。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 从部署需求建立目标分布，再兼顾稀缺能力与遗忘风险，通过固定预算的混合实验调配比。\n\n**展开：** 数据集大小不同，可按任务采样权重而非自然数量拼接；过度重复小数据可能记忆化。报出每类采样概率、实际 token 占比及 epoch 等效次数。\n\n**追问：安全数据越多越好吗？** 过强拒答示范可能增加正常请求误拒。要搭配安全邻域、澄清、可回答的敏感主题和通用能力集。\n\n**易错：** 样本比例与 token 比例不是同一个量，长文本可能主导损失。","html":"<h3>每天练什么，会改变学生擅长什么<\/h3>\n<p>一个训练批次里若 90% 都是数学题，模型得到的大部分更新也来自数学。调整数据配比，就是调整不同能力被练习的频率。<\/p>\n<p>但多练某类可能挤掉其他类的训练时间。应在总 token 预算相同时比较，而不是一边改变比例、一边多训练一倍。<\/p>\n<p><strong>直答：<\/strong> 数据配比决定模型把训练机会花在哪些任务上；用目标能力、遗忘情况和固定预算下的对照来选择比例。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 从部署需求建立目标分布，再兼顾稀缺能力与遗忘风险，通过固定预算的混合实验调配比。<\/p>\n<p><strong>展开：<\/strong> 数据集大小不同，可按任务采样权重而非自然数量拼接；过度重复小数据可能记忆化。报出每类采样概率、实际 token 占比及 epoch 等效次数。<\/p>\n<p><strong>追问：安全数据越多越好吗？<\/strong> 过强拒答示范可能增加正常请求误拒。要搭配安全邻域、澄清、可回答的敏感主题和通用能力集。<\/p>\n<p><strong>易错：<\/strong> 样本比例与 token 比例不是同一个量，长文本可能主导损失。<\/p><\/div><\/details>"}</script>
<script id="data-q-D06" type="application/json">{"body":"### 一节车厢不要只坐两个人\n\n若训练长度固定为 1000 token，某条样本只有 100 token，其余位置用填充补齐，会浪费计算。Packing 把多条短样本装进同一长序列，提高有效内容占比。\n\n装在一起后，还得标清边界、计分位置和注意力规则，防止后一条样本不合理地利用前一条的信息。\n\n**直答：** Packing 通过减少填充浪费提高利用率，但要正确处理样本边界、注意力和损失遮罩，不能只拼接文本。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 将多段短样本装入较长序列，减少 padding。关键是样本边界、注意力隔离、位置编号与 loss mask 的一致性。\n\n**展开：** 独立样本若直接拼接，后者可能看到前者；这可以是有意训练设计，也可能是泄漏。SFT 回答起点、EOS、系统提示和截断规则必须明确。\n\n**追问：只加 EOS 就隔离 attention 吗？** 通常不会。EOS 是 token；真正阻断跨样本关注需要支持的 mask/变长注意力实现。\n\n**检查：** 打印打包后 token、样本 ID、position ID、有效 label，手查至少一条跨边界样本。","html":"<h3>一节车厢不要只坐两个人<\/h3>\n<p>若训练长度固定为 1000 token，某条样本只有 100 token，其余位置用填充补齐，会浪费计算。Packing 把多条短样本装进同一长序列，提高有效内容占比。<\/p>\n<p>装在一起后，还得标清边界、计分位置和注意力规则，防止后一条样本不合理地利用前一条的信息。<\/p>\n<p><strong>直答：<\/strong> Packing 通过减少填充浪费提高利用率，但要正确处理样本边界、注意力和损失遮罩，不能只拼接文本。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 将多段短样本装入较长序列，减少 padding。关键是样本边界、注意力隔离、位置编号与 loss mask 的一致性。<\/p>\n<p><strong>展开：<\/strong> 独立样本若直接拼接，后者可能看到前者；这可以是有意训练设计，也可能是泄漏。SFT 回答起点、EOS、系统提示和截断规则必须明确。<\/p>\n<p><strong>追问：只加 EOS 就隔离 attention 吗？<\/strong> 通常不会。EOS 是 token；真正阻断跨样本关注需要支持的 mask/变长注意力实现。<\/p>\n<p><strong>检查：<\/strong> 打印打包后 token、样本 ID、position ID、有效 label，手查至少一条跨边界样本。<\/p><\/div><\/details>"}</script>
<script id="data-q-D07" type="application/json">{"body":"### 学生出的练习册，也需要老师校对\n\n模型生成数据很便宜，但可能重复同一个错误。如果把这些回答全当正确答案再训练，错误会被反复强化。\n\n可用程序检查、可靠参考或人工抽查筛选，再保留真实数据作独立考试。关键是新增数据带来了什么信息，而不只是数量变大。\n\n**直答：** 合成数据需要独立质量检查和去重；生成者与评审者共享错误时尤其要谨慎，最终收益用独立测试验证。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 让生成、筛选和评测形成可追踪闭环，用独立验证与真实数据锚定，避免同一模型的偏差自我确认。\n\n**展开：** 记录生成模型、提示模板、采样参数和来源种子；去重并按生成家族隔离。数学可用可执行答案校验，业务安全要抽样人工检查语境。\n\n**追问：学生一定不可能超过教师吗？** 不成立。额外数据、任务定向训练、采样聚合和不同评测都可能带来超越；必须控制信息和计算预算。\n\n**易错：** “由强模型生成”不等于真标签；风格变一致也可能损害覆盖。","html":"<h3>学生出的练习册，也需要老师校对<\/h3>\n<p>模型生成数据很便宜，但可能重复同一个错误。如果把这些回答全当正确答案再训练，错误会被反复强化。<\/p>\n<p>可用程序检查、可靠参考或人工抽查筛选，再保留真实数据作独立考试。关键是新增数据带来了什么信息，而不只是数量变大。<\/p>\n<p><strong>直答：<\/strong> 合成数据需要独立质量检查和去重；生成者与评审者共享错误时尤其要谨慎，最终收益用独立测试验证。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 让生成、筛选和评测形成可追踪闭环，用独立验证与真实数据锚定，避免同一模型的偏差自我确认。<\/p>\n<p><strong>展开：<\/strong> 记录生成模型、提示模板、采样参数和来源种子；去重并按生成家族隔离。数学可用可执行答案校验，业务安全要抽样人工检查语境。<\/p>\n<p><strong>追问：学生一定不可能超过教师吗？<\/strong> 不成立。额外数据、任务定向训练、采样聚合和不同评测都可能带来超越；必须控制信息和计算预算。<\/p>\n<p><strong>易错：<\/strong> “由强模型生成”不等于真标签；风格变一致也可能损害覆盖。<\/p><\/div><\/details>"}</script>
<script id="data-q-D08" type="application/json">{"body":"### 不止提前见过考题才算作弊\n\n反复看同一测试集，每次都根据分数改提示词、选模型，即使没有把测试题拿来训练，也逐渐在“针对这张卷子优化”。\n\n开发集用来试方法，最终测试集用来做一次相对独立的判断。两者角色混用，会高估对新问题的能力。\n\n**直答：** 数据污染既包括训练见过测试内容，也包括反复用测试结果指导选择；需要隔离开发、选型和最终评测。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 不仅训练看到测试题算污染，反复根据同一个测试集调提示、阈值和超参数，也会把测试集变成开发集。\n\n**展开：** 训练集用于拟合，验证集用于选择，冻结测试集用于最终估计。线上挑战集可滚动，但要区分发现问题的数据与衡量修复泛化的数据。\n\n**追问：公开基准还能用吗？** 可以做可比参照，但不能独自证明无泄漏泛化。搭配新时间切片、私有未见样本和任务变体。\n\n**易错：** “没直接训练 benchmark 文件”并不保证没从网页、翻译或合成样本间接见过。","html":"<h3>不止提前见过考题才算作弊<\/h3>\n<p>反复看同一测试集，每次都根据分数改提示词、选模型，即使没有把测试题拿来训练，也逐渐在“针对这张卷子优化”。<\/p>\n<p>开发集用来试方法，最终测试集用来做一次相对独立的判断。两者角色混用，会高估对新问题的能力。<\/p>\n<p><strong>直答：<\/strong> 数据污染既包括训练见过测试内容，也包括反复用测试结果指导选择；需要隔离开发、选型和最终评测。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 不仅训练看到测试题算污染，反复根据同一个测试集调提示、阈值和超参数，也会把测试集变成开发集。<\/p>\n<p><strong>展开：<\/strong> 训练集用于拟合，验证集用于选择，冻结测试集用于最终估计。线上挑战集可滚动，但要区分发现问题的数据与衡量修复泛化的数据。<\/p>\n<p><strong>追问：公开基准还能用吗？<\/strong> 可以做可比参照，但不能独自证明无泄漏泛化。搭配新时间切片、私有未见样本和任务变体。<\/p>\n<p><strong>易错：<\/strong> “没直接训练 benchmark 文件”并不保证没从网页、翻译或合成样本间接见过。<\/p><\/div><\/details>"}</script>
<script id="data-q-D09" type="application/json">{"body":"### 补了一门课，原来的强项却退步\n\n模型专门练安全拒答后，可能连正常问题也不愿回答；只练某种格式后，也可能更难完成别的任务。这类旧能力退化需要通过旧任务的固定测试发现。\n\n缓解可以从混入通用样本、降低更新强度、缩短训练或调整训练目标入手。具体哪种有效，要用前后对照判断。\n\n**直答：** 灾难性遗忘是学习新任务时旧能力明显退化。训练目标能力的同时，要保留旧能力测试，观察收益和代价。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 新任务收益伴随旧能力显著退化时，需要检查遗忘。可考虑降低更新强度、混合通用数据、正则化或参数高效训练。\n\n**展开：** 在训练前固定通用、领域、安全和格式评测，沿 checkpoint 画多指标曲线。LoRA 也可能改变行为，不是自动免疫遗忘。\n\n**追问：loss 持续下降但旧能力退化怎么办？** 验证早停、减少 epoch/学习率、修正数据配比，并确认不是提示模板或解码参数变了。\n\n**易错：** 每个 benchmark 波动都叫遗忘不严谨，需要看误差范围与一致性。","html":"<h3>补了一门课，原来的强项却退步<\/h3>\n<p>模型专门练安全拒答后，可能连正常问题也不愿回答；只练某种格式后，也可能更难完成别的任务。这类旧能力退化需要通过旧任务的固定测试发现。<\/p>\n<p>缓解可以从混入通用样本、降低更新强度、缩短训练或调整训练目标入手。具体哪种有效，要用前后对照判断。<\/p>\n<p><strong>直答：<\/strong> 灾难性遗忘是学习新任务时旧能力明显退化。训练目标能力的同时，要保留旧能力测试，观察收益和代价。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 新任务收益伴随旧能力显著退化时，需要检查遗忘。可考虑降低更新强度、混合通用数据、正则化或参数高效训练。<\/p>\n<p><strong>展开：<\/strong> 在训练前固定通用、领域、安全和格式评测，沿 checkpoint 画多指标曲线。LoRA 也可能改变行为，不是自动免疫遗忘。<\/p>\n<p><strong>追问：loss 持续下降但旧能力退化怎么办？<\/strong> 验证早停、减少 epoch/学习率、修正数据配比，并确认不是提示模板或解码参数变了。<\/p>\n<p><strong>易错：<\/strong> 每个 benchmark 波动都叫遗忘不严谨，需要看误差范围与一致性。<\/p><\/div><\/details>"}</script>
<script id="data-q-D10" type="application/json">{"body":"### 换了老师，也换了教材，成绩上涨该归功于谁？\n\n新方法用了更多数据、更长训练、更大的模型，分数更高不能单独证明新算法有效。要尽量让比较双方其他条件一致，只改变要研究的部分。\n\n如果无法完全一致，就明确列出差异，控制最关键因素，再用补充对照解释可能影响。\n\n**直答：** 证明算法贡献，需要控制模型、数据、训练和采样预算等条件；一次综合升级有效，不等于其中每个改动都有效。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 控制起始模型、训练数据、预算、评测和调参资源，只改变待研究因素，再做消融与不确定性分析。\n\n**展开：** DPO/SimPO 比较至少统一 SFT checkpoint、偏好对、tokenizer、最大长度、数据切分和生成评测配置；算法自身关键超参数允许合理调优，记录搜索预算。\n\n**追问：步数相同就公平吗？** 长度、采样次数和每步计算可能不同。可分别报告固定数据、固定训练 FLOPs/时长、固定总成本三种视角。\n\n**易错：** 完全不给新方法调参也不是公平；只挑最好 seed 同样会夸大收益。","html":"<h3>换了老师，也换了教材，成绩上涨该归功于谁？<\/h3>\n<p>新方法用了更多数据、更长训练、更大的模型，分数更高不能单独证明新算法有效。要尽量让比较双方其他条件一致，只改变要研究的部分。<\/p>\n<p>如果无法完全一致，就明确列出差异，控制最关键因素，再用补充对照解释可能影响。<\/p>\n<p><strong>直答：<\/strong> 证明算法贡献，需要控制模型、数据、训练和采样预算等条件；一次综合升级有效，不等于其中每个改动都有效。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 控制起始模型、训练数据、预算、评测和调参资源，只改变待研究因素，再做消融与不确定性分析。<\/p>\n<p><strong>展开：<\/strong> DPO/SimPO 比较至少统一 SFT checkpoint、偏好对、tokenizer、最大长度、数据切分和生成评测配置；算法自身关键超参数允许合理调优，记录搜索预算。<\/p>\n<p><strong>追问：步数相同就公平吗？<\/strong> 长度、采样次数和每步计算可能不同。可分别报告固定数据、固定训练 FLOPs/时长、固定总成本三种视角。<\/p>\n<p><strong>易错：<\/strong> 完全不给新方法调参也不是公平；只挑最好 seed 同样会夸大收益。<\/p><\/div><\/details>"}</script>
<script id="data-q-SFT01" type="application/json">{"body":"### 给模型看一份“题目和标准作答示范”\n\n例如输入：“把这句话翻译成中文”，示范回答是正确译文。SFT 让模型读到输入后，把示范回答中实际出现的 token 概率调高。\n\n这里不是只记住“翻译”这个标签，而是在学习怎样一步步写出回答。通常让模型阅读整个对话，但主要对助手应答部分计分。\n\n**直答：** SFT 是用输入和示范输出训练生成模型，让它更容易按要求写出类似的回答；数据格式和哪些位置计分非常关键。\n\n### 进一步：公式、边界与追问\n\n**本章进阶约定与范围：**\n\n定位：内容安全和后训练岗位的必答主线。建议结合本人 SFT 项目逐题补充实际配置与日志。\n\n**技术表述：** 用高质量示范提升模型在给定指令下生成期望回答的概率。数据通常含 system、user、assistant 角色和模板化边界。\n\n$$L_{\\mathrm{SFT}}=-\\frac{\\sum_{i,t}m_{i,t}\\log\\pi_\\theta(y_{i,t}|x_i,y_{i,<t})}{\\sum_{i,t}m_{i,t}}.$$\n\n**展开：** m 为有效目标 mask，常只覆盖回答 token。多轮样本需决定监督所有 assistant 轮次还是最后一轮；两种设计都要与任务对齐。\n\n**追问：为什么高质量示范重要？** 损失会奖励示范本身；如果示范习惯无依据拒答，模型就会更倾向这种行为。\n\n**易错：** 分母为有效 token 数的写法与先每样本平均再求平均不同。","html":"<h3>给模型看一份“题目和标准作答示范”<\/h3>\n<p>例如输入：“把这句话翻译成中文”，示范回答是正确译文。SFT 让模型读到输入后，把示范回答中实际出现的 token 概率调高。<\/p>\n<p>这里不是只记住“翻译”这个标签，而是在学习怎样一步步写出回答。通常让模型阅读整个对话，但主要对助手应答部分计分。<\/p>\n<p><strong>直答：<\/strong> SFT 是用输入和示范输出训练生成模型，让它更容易按要求写出类似的回答；数据格式和哪些位置计分非常关键。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>本章进阶约定与范围：<\/strong><\/p>\n<p>定位：内容安全和后训练岗位的必答主线。建议结合本人 SFT 项目逐题补充实际配置与日志。<\/p>\n<p><strong>技术表述：<\/strong> 用高质量示范提升模型在给定指令下生成期望回答的概率。数据通常含 system、user、assistant 角色和模板化边界。<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><msub><mi>L<\/mi><mrow><mrow><mi mathvariant=\"normal\">S<\/mi><mi mathvariant=\"normal\">F<\/mi><mi mathvariant=\"normal\">T<\/mi><\/mrow><\/mrow><\/msub><mo>=<\/mo><mo>−<\/mo><mfrac><mrow><msub><mo>∑<\/mo><mrow><mi>i<\/mi><mo>,<\/mo><mi>t<\/mi><\/mrow><\/msub><msub><mi>m<\/mi><mrow><mi>i<\/mi><mo>,<\/mo><mi>t<\/mi><\/mrow><\/msub><mi>log<\/mi><msub><mi>π<\/mi><mi>θ<\/mi><\/msub><mo stretchy=\"false\">(<\/mo><msub><mi>y<\/mi><mrow><mi>i<\/mi><mo>,<\/mo><mi>t<\/mi><\/mrow><\/msub><mo stretchy=\"false\">|<\/mo><msub><mi>x<\/mi><mi>i<\/mi><\/msub><mo>,<\/mo><msub><mi>y<\/mi><mrow><mi>i<\/mi><mo>,<\/mo><mo>&lt;<\/mo><mi>t<\/mi><\/mrow><\/msub><mo stretchy=\"false\">)<\/mo><\/mrow><mrow><msub><mo>∑<\/mo><mrow><mi>i<\/mi><mo>,<\/mo><mi>t<\/mi><\/mrow><\/msub><msub><mi>m<\/mi><mrow><mi>i<\/mi><mo>,<\/mo><mi>t<\/mi><\/mrow><\/msub><\/mrow><\/mfrac><mo>.<\/mo><\/mrow><\/math><\/div>\n<p><strong>展开：<\/strong> m 为有效目标 mask，常只覆盖回答 token。多轮样本需决定监督所有 assistant 轮次还是最后一轮；两种设计都要与任务对齐。<\/p>\n<p><strong>追问：为什么高质量示范重要？<\/strong> 损失会奖励示范本身；如果示范习惯无依据拒答，模型就会更倾向这种行为。<\/p>\n<p><strong>易错：<\/strong> 分母为有效 token 数的写法与先每样本平均再求平均不同。<\/p><\/div><\/details>"}</script>
<script id="data-q-SFT02" type="application/json">{"body":"### 改整本教材、加小补丁、还是改开头提示？\n\n全参微调允许改动模型的大量原有权重；LoRA 冻结原权重，只训练附加的小矩阵；Prompt Tuning 学习一段可训练的输入表示。\n\n这是不同的“允许改哪里”。改动位置少通常节省部分训练资源，但不保证适合所有任务，也不能只按可训练参数量估算总显存。\n\n**直答：** 根据任务变化幅度、资源和部署方式选择可更新的部分；全参、LoRA 和 Prompt Tuning 的核心差别是更新位置和自由度。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 全参更新容量大但资源需求高；LoRA 更新权重的低秩增量；Prompt Tuning 学习输入端或类似位置的连续提示参数。\n\n**展开：** 选择要考虑任务变化幅度、数据规模、GPU、推理部署和多任务管理。LoRA 适合资源受限与多适配器场景，但不能预先保证性能等于全参。\n\n**追问：只训练少量参数为什么还需不少显存？** 基座权重仍需参与计算，中间激活、反向传播路径和临时缓冲也会占用显存。\n\n**易错：** “冻结参数”不等于所有基座层都能用 no_grad 包住，否则可能切断 LoRA 的梯度路径。依据：S06。","html":"<h3>改整本教材、加小补丁、还是改开头提示？<\/h3>\n<p>全参微调允许改动模型的大量原有权重；LoRA 冻结原权重，只训练附加的小矩阵；Prompt Tuning 学习一段可训练的输入表示。<\/p>\n<p>这是不同的“允许改哪里”。改动位置少通常节省部分训练资源，但不保证适合所有任务，也不能只按可训练参数量估算总显存。<\/p>\n<p><strong>直答：<\/strong> 根据任务变化幅度、资源和部署方式选择可更新的部分；全参、LoRA 和 Prompt Tuning 的核心差别是更新位置和自由度。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 全参更新容量大但资源需求高；LoRA 更新权重的低秩增量；Prompt Tuning 学习输入端或类似位置的连续提示参数。<\/p>\n<p><strong>展开：<\/strong> 选择要考虑任务变化幅度、数据规模、GPU、推理部署和多任务管理。LoRA 适合资源受限与多适配器场景，但不能预先保证性能等于全参。<\/p>\n<p><strong>追问：只训练少量参数为什么还需不少显存？<\/strong> 基座权重仍需参与计算，中间激活、反向传播路径和临时缓冲也会占用显存。<\/p>\n<p><strong>易错：<\/strong> “冻结参数”不等于所有基座层都能用 no_grad 包住，否则可能切断 LoRA 的梯度路径。依据：<a class=\"ref\" href=\"#source-S06\">S06<\/a>。<\/p><\/div><\/details>"}</script>
<script id="data-q-SFT03" type="application/json">{"body":"### 不重写整个大表，只学习它怎样改动\n\n假设模型里有一张 1000×1000 的权重表，共 100 万个数字。LoRA 不直接更新整张表，而是训练 1000×8 和 8×1000 两张小表，共 1.6 万个数字。\n\n两张小表相乘，仍得到 1000×1000 的修改量，再加到原表上。8 叫 rank（秩）参数，它限制修改量能表达的形式，所以不是任意大改动都能用这么少数字表示。\n\n**直答：** LoRA 用两个小矩阵的乘积表示大矩阵的更新量，冻结原权重，只训练小矩阵，从而减少可训练参数和相关训练开销。\n\n### 进一步：公式、边界与追问\n\n**技术表述：** 将权重更新写成两个低秩矩阵相乘，学习 ΔW=(α/r)BA。\n\n$$W\\in\\mathbb R^{d_{\\rm out}\\times d_{\\rm in}}$$\n\n$$A\\in\\mathbb R^{r\\times d_{\\rm in}}$$\n\n$$B\\in\\mathbb R^{d_{\\rm out}\\times r}.$$\n\n新增参数为 r(d_in+d_out)。当 d_in=d_out=4096、r=8 时为 65,536，原矩阵为 16,777,216，比例约 0.39%，忽略偏置。\n\n**追问：A 随机、B 为零时，为什么一开始 A 梯度为零？** ΔW=BA；对 A 的梯度含 B，而 B=0。B 首步可有梯度，随后 A 也开始更新。\n\n**易错：** A/B 命名可能被实现交换，答题先给形状。依据：S06。","html":"<h3>不重写整个大表，只学习它怎样改动<\/h3>\n<p>假设模型里有一张 1000×1000 的权重表，共 100 万个数字。LoRA 不直接更新整张表，而是训练 1000×8 和 8×1000 两张小表，共 1.6 万个数字。<\/p>\n<p>两张小表相乘，仍得到 1000×1000 的修改量，再加到原表上。8 叫 rank（秩）参数，它限制修改量能表达的形式，所以不是任意大改动都能用这么少数字表示。<\/p>\n<p><strong>直答：<\/strong> LoRA 用两个小矩阵的乘积表示大矩阵的更新量，冻结原权重，只训练小矩阵，从而减少可训练参数和相关训练开销。<\/p><details class=\"deep\"><summary>我已读懂例子，继续看公式、边界与追问<\/summary><div class=\"deepbody\"><p><strong>技术表述：<\/strong> 将权重更新写成两个低秩矩阵相乘，学习 ΔW=(α/r)BA。<\/p>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>W<\/mi><mo>∈<\/mo><msup><mi mathvariant=\"normal\">ℝ<\/mi><mrow><msub><mi>d<\/mi><mrow><mi mathvariant=\"normal\">o<\/mi><mi mathvariant=\"normal\">u<\/mi><mi mathvariant=\"normal\">t<\/mi><\/mrow><\/msub><mi>×<\/mi><msub><mi>d<\/mi><mrow><mi mathvariant=\"normal\">i<\/mi><mi mathvariant=\"normal\">n<\/mi><\/mrow><\/msub><\/mrow><\/msup><\/mrow><\/math><\/div>\n<div class=\"formula\" tabindex=\"0\" role=\"group\" aria-label=\"数学公式；超出宽度时可横向滚动\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><mrow><mi>A<\/mi><mo>∈<\/mo><msup><mi mathvariant=\"normal\">ℝ<\/mi><mrow><mi>r<\/mi><mi>×<\/mi><msub><mi>d<\/mi><mrow><m
